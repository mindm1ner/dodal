*{box-sizing:border-box}

/* ── 상단 ─────────────────────────────────────── */

.icon-btn:hover{border-color:var(--ink-3); color:var(--ink)}

.facets{max-width:1280px; margin:0 auto; padding:11px 0 12px;
        display:flex; flex-direction:column; gap:7px}
.fhead{display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.ftoggle{display:inline-flex; align-items:center; gap:6px; padding:4px 10px;

/* ── 비교함 ───────────────────────────────────── */
.tray{position:sticky; top:0; z-index:25; background:var(--accent-soft);
      border-bottom:1px solid var(--accent)}
.tray-in{max-width:1280px; margin:0 auto; padding:9px 20px;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap}

.slot{display:inline-flex; align-items:center; gap:7px; padding:0 8px 0 10px;

  background:none; font-size:12.5px}

.btn{padding:5px 13px; border-radius:7px; font-size:13px; cursor:pointer;
  border:1px solid var(--accent); background:var(--accent); color:#fff; font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.4; cursor:default; filter:none}
.btn.quiet{background:none; color:var(--accent-ink); font-weight:500}

/* ── 본문 ─────────────────────────────────────── */
.split{max-width:1280px; margin:0 auto; padding:0 20px 40px;

.row{display:grid; grid-template-columns:70px minmax(0,1fr) 24px; gap:10px;

.row .meta em{font-style:normal; color:var(--accent); font-weight:600}
/* 영역 > 단원 두 겹 머리글 */
.grp{display:flex; align-items:baseline; gap:7px; width:100%; text-align:left;
  border:none; border-bottom:1px solid var(--rule-2); cursor:pointer;
  font-family:var(--sans)}
.grp .caret{font-size:8px; flex-shrink:0; transition:transform .15s}

.grp .n{margin-left:auto; flex-shrink:0; font-size:11px; font-weight:400;

.g1 .kind{font-size:10px; font-weight:400; opacity:.6; letter-spacing:.06em}

  border:1px solid var(--rule); border-radius:4px; padding:0 5px; flex-shrink:0}

  border-radius:4px; padding:0 5px; flex-shrink:0}
@media (prefers-color-scheme:dark){ .grp .cross{color:#E0BE73; background:#2C2513} }
:root[data-theme="dark"] .grp .cross{color:#E0BE73; background:#2C2513}
:root[data-theme="light"] .grp .cross{color:#8A6A1F; background:#FBF3DD}

.pick{width:22px; height:22px; border-radius:6px; border:1px solid var(--rule);

/* ── 상세 ─────────────────────────────────────── */

.sec{padding-top:18px; margin-top:18px; border-top:1px solid var(--rule-2)}

/* 66ch로 묶어뒀더니 상세 박스(700px)보다 좁아서 오른쪽이 비었다.
   ch 단위는 숫자 '0' 폭 기준이라 한글로는 절반밖에 안 된다. 박스 폭에 맡긴다. */
.sec p{margin:0; font-size:14.5px; line-height:1.85; color:var(--ink-2); text-wrap:pretty}
.sec p + p{margin-top:10px}
.sec.none p{color:var(--ink-3); font-style:italic}

/* 딸린 글은 원문이 문단으로 쪼개놓은 항목 목록이다. 원문 표기대로 가운뎃점을 쓴다 */
.items{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px}

details.sec > summary{list-style:none; cursor:pointer; margin:0 0 9px;

.sibs{display:flex; flex-direction:column; gap:2px}

.sib[data-self="1"]{background:var(--accent-soft); cursor:default}

/* 다른 교육과정의 비슷한 성취기준 */

/* ── 비교 화면 ────────────────────────────────── */
.cmp-head{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
  padding-bottom:16px; border-bottom:1px solid var(--rule-2); margin-bottom:4px}

del{background:var(--gone-bg); color:var(--gone); text-decoration:line-through;

<script>
const DB = {"areas":{"2022|과학|3~4학년|힘과 우리 생활|1":{"c":"초등학교 5~6학년군 ‘물체의 운동’, 중학교 1~3학년군 ‘힘의 작용’과 연계된다.\n무게를 비교할 때는 용수철저울이나 전자저울 등을 사용하고, 분동을 사용하는 윗접시저울은 다루지 않는다.\n조사한 내용을 공유할 때 사회 관계망 서비스(SNS)를 활용할 수 있으며, 글과 그림으로 표현한 발표 자료 만들기를 할 수 있다.","q":"무거운 물체를 밀 때와 가벼운 물체를 밀 때의 특징 탐구하기"},"2022|과학|3~4학년|동물의 생활|1":{"c":"초등학교 3~4학년군 ‘생물의 한살이’, ‘생물과 환경’, 5~6학년군 ‘우리 몸의 구조와 기능’과 중학교 1~3학년군 ‘생물의 구성과 다양성’, ‘동물과 에너지’와 연계된다.\n‘동물의 생활’에서는 여러 가지 동물의 형태적 특징을 중심으로 관찰, 분류 활동을 한다.","q":"동물 분류 기준 정하기"},"2022|과학|3~4학년|식물의 생활|1":{"c":"초등학교 3~4학년군 ‘생물의 한살이’, ‘생물과 환경’, 5~6학년군 ‘식물의 구조와 기능’과 중학교 1~3학년군 ‘생물의 구성과 다양성’, ‘식물과 에너지’와 연계된다.\n여러 가지 식물을 줄기, 잎, 꽃 등으로 분류 활동을 할 수 있으나, 주변에서 쉽게 구할 수 있는 식물의 잎을 대상으로 활동하도록 한다.\n초등학교 5~6학년군 ‘식물의 구조와 기능’에서 각 부위의 구조와 기능을 이해하는 데 중점을 두고 다루므로 ‘식물의 생활’에서는 여러 가지 식물의 잎을 중심으로 관찰, 분류 활동을 한다.","q":"식물 분류 기준 정하기"},"2022|과학|3~4학년|생물의 한살이|1":{"c":"초등학교 3~4학년군 ‘동물의 생활’, ‘식물의 생활’, ‘생물과 환경’, 5~6학년군 ‘식물의 구조와 기능’, ‘우리 몸의 구조와 기능’, 중학교 1~3학년군 ‘식물과 에너지’, ‘동물과 에너지’와 연계된다.\n동물의 한살이 관찰을 위해서는 주변에서 쉽게 구할 수 있으며, 한살이 기간이 짧은 동물(예: 배추흰나비)을 선택하는 것이 좋다.\n동물의 한살이 관찰을 통하여 동물에 대한 관심과 호기심을 증대시키는 것도 중요한 목표이므로 동물을 직접 관찰하는 활동을 권장하며, 보조 학습 자료로 동영상이나 누리망을 활용할 수 있다. 다양한 도구를 활용하여 글과 그림으로 한살이를 표현해 보도록 지도할 수 있다.\n동물의 한살이 관찰에는 시간이 많이 소요되므로 학습이 시작되기 전에 관찰 대상을 미리 준비해야 하며, 교수⋅학습 전개 시 수업 차시에 따라 연속하여 진행하기에는 무리가 있으므로 동물의 한살이 정도에 맞추어 융통성 있게 수업 시간을 재구성하는 것이 좋다.","q":"곤충의 한살이 관찰하기"},"2022|과학|3~4학년|물체와 물질|1":{"c":"초등학교 3~4학년군 ‘물의 상태 변화’, ‘여러 가지 기체’, 5~6학년군 ‘혼합물의 분리’, 중학교 1~3학년군 ‘물질의 특성’과 연계된다.\n일상생활에서 사용할 수 있는 물체를 기초적인 아이디어 수준에서 설계하며, 물체의 쓰임새에 적합한 성질을 지닌 물질을 이용하는 데 중점을 두고 지도한다.","q":"용기에 따른 고체와 액체의 모양과 부피 변화 관찰하기\n기체가 공간을 차지하고 있음을 알아보는 실험하기"},"2022|과학|3~4학년|지구와 바다|1":{"c":"초등학교 5~6학년군 ‘날씨와 우리 생활’, 중학교 1~3학년군 ‘날씨와 기후변화’, ‘수권과 해수의 순환’과 연계된다.\n여행에서 촬영한 사진 자료나 스마트 기기를 활용하여 육지와 바다의 다양한 모습과 지형을 탐색하여 수업에 활용할 수 있다.\n지구의 물은 바닷물과 육지의 물로 구분하며, 지구 표면에서 바다가 차지하는 비율은 정성적으로 다룬다. 지구의 육지와 바다 면적을 시각적으로 비교할 수 있는 자료를 활용할 수 있다.\n육지의 물과 바닷물을 가열할 때는 끓임쪽을 넣고 가열하는 등 안전에 유의한다.\n우리나라의 대표적인 갯벌의 위치, 갯벌에 사는 생물의 다양성, 갯벌 보전의 필요성을 알아보는 활동을 통해 환경과 생명의 가치를 알고 생태감수성을 기르도록 한다.","q":"지구의 육지와 바다 면적 비교하기\n육지의 물과 바닷물을 가열하여 남는 물질 탐구하기"},"2022|과학|3~4학년|소리의 성질|1":{"c":"중학교 1~3학년군 ‘빛과 파동’과 연계된다.\n소리를 관찰하기 위해 청각뿐만 아니라 시각, 촉각 등의 다양한 감각을 활용할 수 있도록 한다.\n큰 소리로 인해 청각이 손상될 수 있으므로 안전에 유의한다.\n소리의 세기와 높낮이를 탐구할 때 디지털 탐구 도구를 활용할 수 있다.\n소음을 줄이는 방법을 찾아 실천해 봄으로써 공동체의 문제 해결에 참여하는 민주 시민으로서의 소양을 기르되, 소리 자체에 대한 부정적 인식이 형성되지 않도록 유의한다.","q":"소리가 나는 소리굽쇠의 떨림 관찰하기\n물체의 길이에 따른 소리의 높낮이 비교하기"},"2022|과학|3~4학년|감염병과 건강한 생활|1":{"c":"중학교 1~3학년군 ‘재해⋅재난과 안전’과 연계된다.\n예방접종의 경험이나 범유행 상황 등을 통해 생활 속에서 다양한 감염 사례가 있음을 인식할 수 있도록 한다.\n다양한 감염 과정을 놀이, 역할극, 그림, 표, 책 만들기 공예 등 다양한 시각화 방법을 통해 표현할 수 있다. 단, 단순한 표현 활동보다는 생활 속 습관과 감염병 유행과의 연관성을 탐구하도록 지도한다.\n건강한 생활을 위해 지켜야 하는 수칙은 감염 과정과 생활 습관을 관련지어 학생들이 실천 가능한 수준으로 제시하도록 한다.","q":"감염 과정과 감염병 예방 방법 탐구하기"},"2022|과학|3~4학년|자석의 이용|1":{"x":"[4과09-01∼02] 자석과 물체, 자석과 자석 사이의 상호작용을 다루되, 자기장의 개념은 도입하지 않는다.","c":"초등학교 5~6학년군 ‘전기의 이용’, 중학교 1~3학년군 ‘전기와 자기’와 연계된다.\n자석을 이용한 장치 설계하기 활동은 학습한 자석의 성질을 이용하여 생활을 편리하게 만드는 장치를 구상해볼 수 있도록 하기 위한 것으로, 설계한 것이 반드시 만들기로 이어져야 함을 의미하는 것은 아니다.","q":"자석의 극을 찾고 서로 같은 극과 다른 극을 가까이했을 때의 특징 비교하기\n나침반과 자석을 가까이했을 때 나타나는 현상 관찰하기"},"2022|과학|3~4학년|물의 상태 변화|1":{"c":"초등학교 3~4학년군 ‘물체와 물질’, 중학교 1~3학년군 ‘물질의 상태 변화’와 연계된다.\n실험 전에 학생들에게 물을 가열하거나 얼음을 다룰 때 주의할 점과 안전사고 대처 방법을 지도한다.\n생태전환교육과 연계하여 물의 중요성과 물 부족 현상을 다룬다. 물을 얻는 여러 가지 사례나 장치를 조사하고, 이를 바탕으로 물을 얻을 수 있는 장치를 창의적으로 고안하도록 한다.\n물을 얻을 수 있는 장치를 설계할 때는 물의 상태 변화를 이용하는 데 중점을 두고, 우리 주변에서 쉽게 구할 수 있는 재료를 이용하여 간단한 장치를 만드는 수준에서 지도한다.","q":"물이 얼 때와 얼음이 녹을 때의 무게와 부피 변화 관찰하기\n물이 증발할 때와 끓을 때의 특징 관찰하기\n얼음이 든 비커의 바깥 면 관찰하기"},"2022|과학|3~4학년|땅의 변화|1":{"c":"초등학교 5~6학년군 ‘지층과 화석’, 중학교 1~3학년군 ‘지권의 변화’와 연계된다.\n휴화산이나 활화산과 같은 화산의 상태에 대해서는 다루지 않으며, 화산과 화산이 아닌 산을 비교하여 화산의 의미를 살펴볼 수 있다.\n학생들이 화산 활동과 지진을 직접 관찰하기 어려우므로, 화산 활동이나 지진과 관련된 영상을 스마트 기기로 조사하는 활동이 필요하다.\n화산 활동을 모형실험으로 지도하는 경우 안전사고가 발생하지 않도록 유의하며, 실제 화산 활동과 모형실험의 공통점과 차이점을 비교할 수 있다.","q":"흙 언덕을 만들고 물을 흘려보낸 후, 깎이는 곳과 쌓이는 곳 관찰하기\n지진의 피해 사례를 조사하고 대처 방법 탐구하기"},"2022|과학|3~4학년|다양한 생물과 우리 생활|1":{"c":"초등학교 3~4학년군 ‘동물의 생활’, ‘식물의 생활’, ‘생물과 환경’과 중학교 1~3학년군 ‘생물의 구성과 다양성’과 연계된다.\n주변에서 쉽게 구할 수 있는 버섯, 곰팡이, 해캄, 짚신벌레를 디지털현미경이나 실체현미경 등 학생들이 다룰 수 있는 다양한 도구를 사용하여 직접 관찰하도록 하고, 지역의 특성에 따라 관찰 가능한 소재로 변경하여 다룰 수 있다.\n세균은 사진 자료나 동영상 자료 등을 활용하여 관찰할 수 있게 한다.\n세균이나 곰팡이 등이 우리 생활에 미치는 영향이나 생명과학의 이용 사례는 실생활에 많이 반영된 자료들을 중심으로 한다.\n우리 생활에 생명과학이 이용되는 사례는 관련 도서와 누리망 자료를 활용하고, 발표 자료를 만들고 공유하는 활동은 디지털 소양 교육과 연계하여 지도할 수 있다.","q":"버섯과 곰팡이 관찰하기\n해캄과 짚신벌레 관찰하기"},"2022|과학|3~4학년|밤하늘 관찰|1":{"c":"초등학교 5~6학년군 ‘지구의 운동’, ‘계절의 변화’, 중학교 1~3학년군 ‘태양계’, ‘별과 우주’와 연계된다.\n여러 날 동안 달의 모양 변화 등은 관찰 시기와 방법을 안내한 후 관찰하도록 한다.\n모형이나 시청각 자료, 천체 관측 프로그램 등을 이용하여 천체에 대한 호기심을 유도하고 공간적 이해를 도울 수 있다.\n야간에 달, 행성, 별 등을 관찰할 경우 안전 사항을 준수하도록 한다.","q":"여러 날 동안 보이는 달의 모양 관찰하기\n태양계 행성 모형 만들기"},"2022|과학|3~4학년|생물과 환경|1":{"c":"초등학교 3~4학년군 ‘동물의 생활’, ‘식물의 생활’, ‘생물의 한살이’, ‘다양한 생물과 우리 생활’과 중학교 1~3학년군 ‘생물의 구성과 다양성’과 연계된다.\n먹이사슬 놀이, 먹이그물 모형 만들기 등과 같은 모의 활동을 통하여 생태계의 구성 요소들이 상호 관련되어 있음을 인식하게 한다.\n생태전환교육과 연계하여 생태계 보전 또는 복원을 위한 활동을 학생 스스로 계획하고 실천함으로써 생태계 보전과 관련한 문제해결력을 기르도록 지도할 수 있다.","q":"양분을 얻는 방법에 따라 생물 요소 분류하기\n먹이 관계 모형 만들기"},"2022|과학|3~4학년|여러 가지 기체|1":{"c":"초등학교 3~4학년군 ‘물체와 물질’, 중학교 1~3학년군 ‘기체의 성질’과 연계된다.\n질소, 산소, 이산화 탄소 등 여러 가지 기체의 성질과 일상생활 속 이용 사례를 조사하여 발표하도록 지도한다.\n장치를 작동시키는 기체로는 공기를 사용하고, 장치를 평가할 때는 기체의 어떤 성질을 이용했는지에 중점을 둔다.","q":"공기를 넣거나 뺄 때의 무게 변화 관찰하기\n온도나 압력에 따른 기체의 부피 변화 관찰하기"},"2022|과학|3~4학년|기후변화와 우리 생활|1":{"c":"초등학교 5~6학년군 ‘날씨와 우리 생활’, 중학교 1~3학년군 ‘날씨와 기후변화’, ‘재해⋅재난과 안전’과 연계된다.\n기후라는 용어를 설명하는 데 중점을 두기보다는 기후변화의 사례를 주로 다룬다.\n기후변화에 대응하는 방법은 기후변화로 인한 자연환경의 변화를 인간이 완화하는 방안, 혹은 변화에 적응하는 방안으로 생각해볼 수 있으나, 이를 구분하여 지도하지 않도록 한다.\n기후변화가 우리 생활과 환경에 끼치는 영향을 학습하면서 지나친 불안감이나 무기력함을 느끼기보다는 기후위기를 해결하기 위한 진취적인 실천 의지를 다지도록 한다.","q":"해수면 상승으로 인한 피해 모형실험하기"},"2022|과학|5~6학년|지층과 화석|1":{"c":"초등학교 3~4학년군 ‘땅의 변화’, 중학교 1~3학년군 ‘지권의 변화’와 연계된다.\n여러 가지 지층, 퇴적암, 화석 등을 관찰하여 그 특징을 찾아 생성 과정을 추리하는 활동이 필요하다. 이때, 학생들이 직접 조사한 자료를 활용할 수 있다. 학생들이 박물관에서 찍은 사진이나 여행지에서 찍은 사진을 이용하여 관련 특징을 설명하면 학습 효과를 높일 수 있을 것이다.\n디지털 소양 교육과 관련하여 실감형 자료를 활용한 화석 관찰도 가능하다.","q":"이암, 사암, 역암 관찰하기\n화석을 관찰하고 화석 모형 만들기"},"2022|과학|5~6학년|빛의 성질|1":{"c":"중학교 1~3학년군 ‘빛과 파동’과 연계된다.\n물체를 보기 위해서는 빛이 필요하며 빛이 없을 때 불편한 점을 과학 글쓰기, 그림 그리기, 역할 놀이 등의 다양한 활동으로 융합하여 전개할 수 있다.\n빛의 직진, 반사, 굴절 현상을 관찰할 때 컴퓨터 시뮬레이션, 가상 현실, 증강 현실 등을 이용하여 관찰을 보조할 수 있다.","q":"어둠상자 속의 물체 관찰하기\n평면거울에서 빛의 반사 실험하기\n렌즈를 이용하여 빛의 굴절 실험하기"},"2022|과학|5~6학년|용해와 용액|1":{"c":"초등학교 5~6학년군의 ‘혼합물의 분리’, ‘산과 염기’, 중학교 1~3학년군의 ‘물질의 특성’과 연계된다.\n일상생활에서 용액의 사용 사례를 조사하여 우리 주변에서 용액의 중요성과 필요성을 이해할 수 있도록 한다. 디지털 소양 교육과 연계하여 포스터, 동영상 등 다양한 형태로 디지털 자료를 제작하여 누리망이나 사회 관계망 서비스 등에서 공유하도록 한다.","q":"용해 전과 후의 무게 측정하기\n물에 녹는 용질의 양에 영향을 미치는 요인 탐구하기\n진하기가 다른 용액에서 물체의 뜨는 정도 비교하기"},"2022|과학|5~6학년|우리 몸의 구조와 기능|1":{"c":"초등학교 3~4학년군 ‘동물의 생활’, ‘생물의 한살이’와 중학교 1~3학년군 ‘동물과 에너지’와 연계된다.\n우리 몸의 각 기관의 위치와 생김새는 그림과 모형 등을 통해 관찰하게 하고, 각 기관의 기능은 기관계의 역할을 위주로 이해하게 한다.\n일상생활에서 우리 몸의 각 기관에 발생하는 질병과 예방법을 책이나 발표 자료 등의 다양한 형태로 만들어 공유함으로써 학생들의 건강을 유지하기 위한 실천 의지를 다진다. 또한, 발표 자료를 만들거나 공유하는 활동은 디지털 소양 교육과 연계하여 지도할 수 있다.","q":"운동할 때 몸에서 일어나는 변화 관찰하기"},"2022|과학|5~6학년|혼합물의 분리|1":{"c":"초등학교 3~4학년군의 ‘물체와 물질’, 5~6학년군의 ‘용해와 용액’, 중학교 1~3학년군의 ‘물질의 특성’과 연계된다.\n대부분 물질은 혼합물 상태이기 때문에 필요한 물질을 얻기 위해서는 혼합물을 분리할 필요가 있음을 이해하도록 지도한다.\n혼합물의 분리 실험을 할 때는 우리 주변에서 쉽게 구할 수 있는 물질을 사용하고, 실험이 끝난 뒤 남은 물질은 과학 실험실 폐수 및 폐기물 처리 기준과 방법에 따라 처리할 수 있도록 한다.\n유리 기구를 사용하거나 거름 장치와 증발 장치로 실험할 때는 실험 전에 학생들에게 주의할 점과 안전사고 대처 방법을 지도한다.\n생태전환교육과 연계하여 오염된 물을 정화할 수 있는 장치 등과 같이 경제적, 사회적, 지역적 상황을 고려하여 개발된 과학기술 사례를 중심으로 조사하도록 한다. 디지털 소양 교육과 연계하여 조사 결과를 누리망이나 사회 관계망 서비스 등에서 공유하도록 한다.","q":"모래와 자갈의 혼합물 분리하기\n물과 기름의 혼합물 분리하기\n소금과 모래의 혼합물 분리하기"},"2022|과학|5~6학년|날씨와 우리 생활|1":{"c":"초등학교 3~4학년군 ‘지구와 바다’, 중학교 1~3학년군 ‘날씨와 기후변화’, ‘수권과 해수의 순환’과 연계된다.\n날씨는 학생들이 매일 접하는 자연 현상으로, 관찰과 실험을 중심으로 한 탐구 활동의 좋은 소재가 된다. 따라서 관찰과 실험을 중심으로 여러 가지 기상 요소의 특징을 이해하고, 우리 생활과 관련짓도록 한다.\n이슬, 안개 발생 실험 과정에서 응결 현상을 중심으로 설명하고, 단열 팽창 실험 기구를 활용하지 않는다.\n바람 발생에 대한 모형실험은 해륙풍 모형으로 제시하며, 가열에 따른 육지와 바다의 온도 차이에 의해 고기압에서 저기압으로 바람이 부는 것으로 설명한다.","q":"이슬, 안개 발생 실험하기\n바람 발생에 대한 모형실험하기"},"2022|과학|5~6학년|열과 우리 생활|1":{"c":"초등학교 3~4학년군 ‘물의 상태 변화’, 5~6학년군 ‘날씨와 우리 생활’, 중학교 1~3학년군 ‘열’과 연계된다.\n일상생활의 열과 관련된 현상을 과학 글쓰기, 그림 그리기, 역할 놀이, 장치 만들기 등의 다양한 활동으로 융합하여 다룰 수 있다.\n뜨거운 물질이나 물체 등을 다룰 때 화상, 화재 등의 안전사고에 유의한다.","q":"온도가 다른 두 물체가 접촉할 때 두 물체의 온도 변화 측정하기\n열이 이동하는 여러 방식의 특징 비교하기"},"2022|과학|5~6학년|자원과 에너지|1":{"c":"중학교 1~3학년군 ‘식물과 에너지’, ‘동물과 에너지’, ‘전기와 자기’, ‘운동과 에너지’와 연계된다.\n재활용된 자원이 순환 과정을 거치는 사례가 있으나, 이러한 사례로 인해 자원이 무한한 것이라는 인식을 갖지 않도록 유의한다.\n일상생활에서 이용하는 에너지를 알아보고, 지속가능한 에너지 이용이 필요한 까닭을 알 수 있도록 한다.","q":"효율적으로 에너지를 이용하는 집 모형의 효과 탐구하기"},"2022|과학|5~6학년|산과 염기|1":{"c":"초등학교 3~4학년군 ‘물체와 물질’, 5~6학년군 ‘물질의 연소’, 중학교 1~3학년군 ‘화학 반응의 규칙성’과 연계된다.\n겉보기 성질이 비슷한 여러 가지 용액의 분류 활동 결과를 바탕으로, 용액을 분류하는 새로운 기준이 필요함을 인식하도록 한다.\n산성 용액이나 염기성 용액을 사용할 때는 실험실 안전 수칙에 따라 실험하고, 실험이 끝난 뒤 남은 물질은 과학 실험실 폐수 및 폐기물 처리 기준과 방법에 따라 처리할 수 있도록 한다.\n생태전환교육과 연계하여 산성비, 해양 산성화, 토양 산성화 등 산성화로 인한 생태계의 피해 사례 및 관련 자료를 수집하여 분석하도록 한다. 디지털 소양 교육과 연계하여 환경 파괴의 원인, 현황, 전망, 대책 등을 포함한 조사 결과를 누리망이나 사회 관계망 서비스 등에서 공유하도록 한다.","q":"지시약을 이용하여 용액 분류하기\n묽은 염산과 묽은 수산화 나트륨 용액을 섞을 때 용액의 색깔 변화 관찰하기"},"2022|과학|5~6학년|물체의 운동|1":{"c":"초등학교 3~4학년군 ‘힘과 우리 생활’, 중학교 1~3학년군 ‘운동과 에너지’와 연계된다.\n속력의 산술적 계산 능력보다는 속력의 의미를 이해하고 물체의 빠르기를 정량적으로 표현하여 소통할 수 있는 과학적인 의사소통 능력 평가에 중점을 둔다.\n물체의 속력을 측정하고 계산할 때 디지털 탐구 도구나 계산기 등을 활용할 수 있다.\n속력과 관련된 안전 수칙과 안전장치를 조사한 결과를 발표하거나 사회 관계망 서비스 등을 통해 공유하고, 교통안전의 실천은 실천적 습관 형성에 주안점을 둔다.","q":"운동하는 물체의 공통된 특징 탐구하기\n같은 시간 동안에 물체가 이동한 거리 비교하기"},"2022|과학|5~6학년|식물의 구조와 기능|1":{"c":"초등학교 3~4학년군 ‘식물의 생활’, ‘생물의 한살이’, 중학교 1~3학년군 ‘생물의 구성과 다양성’, ‘식물과 에너지’와 연계된다.\n식물 세포 현미경 표본을 만들어 직접 관찰하되 학교 사정에 따라 이미 만들어진 현미경 표본을 이용하여 관찰할 수도 있다.\n식물의 구조와 기능을 설명하는 자료를 만들어 공유하는 활동은 디지털 소양 교육과 연계하여 지도할 수 있다.\n초등학교 3~4학년군 ‘식물의 생활’과 ‘생물의 한살이’에서는 식물들의 특징을 관찰하고 비교하는 데 중점을 두지만, ‘식물의 구조와 기능’에서는 식물 각 기관의 구조와 기능에 중점을 두는 만큼 실험을 통해 탐구하도록 한다.","q":"줄기에서 물의 이동 실험하기\n광합성 산물 확인 실험하기\n증산 작용 확인 실험하기"},"2022|과학|5~6학년|지구의 운동|1":{"c":"초등학교 3~4학년군 ‘밤하늘 관찰’, 5~6학년군 ‘계절의 변화’, 중학교 1~3학년군 ‘태양계’, ‘별과 우주’와 연계된다.\n관찰과 실험을 중심으로 지구의 운동과 관련된 개념을 이해하고 지구의 자전과 공전에 의하여 일어나는 현상을 지구의 관측자 중심으로 탐구할 수 있는 활동이 필요하다.\n탐구 활동을 하기 전, 교실이나 운동장 등의 공간에서 관측자가 남쪽을 바라볼 때를 기준으로 방위를 설정할 필요가 있다.\n디지털 소양 교육 관련하여, 계절별 대표적인 별자리는 남쪽 하늘의 별자리를 중심으로 천체 관측 프로그램이나 실감형 자료를 활용하여 조사할 수 있다.","q":"낮과 밤이 생기는 이유 모형실험하기\n천체 관측 프로그램을 이용하여 계절별 대표적인 별자리 관찰하기"},"2022|과학|5~6학년|계절의 변화|1":{"c":"초등학교 3~4학년군 ‘밤하늘 관찰’, 5~6학년군 ‘지구의 운동’과 중학교 1~3학년군 ‘태양계’, ‘별과 우주’와 연계된다.\n태양 고도 측정기 만들기 활동에서는 단순하게 그림자의 길이를 이용하는 장치, 정확한 태양 고도값을 측정하는 장치 등 다양한 태양 고도 측정 장치를 설계하고 만들 수 있다. 또한, 하루 동안 태양 고도와 그림자 길이를 직접 측정하여, 표와 그래프로 나타내는 활동이 필요하다.\n디지털 소양 교육과 관련하여, 누리집을 활용하여 계절에 따른 태양의 남중 고도와 낮의 길이 자료를 수집하고 해석할 수 있다.","q":"태양 고도 측정기 만들기\n디지털 자료를 활용하여 계절별 태양의 남중 고도, 낮의 길이 관계 탐구하기"},"2022|과학|5~6학년|물질의 연소|1":{"c":"초등학교 3~4학년군 ‘물체와 물질’, ‘여러 가지 기체’, 5~6학년군 ‘산과 염기’, 중학교 1~3학년군 ‘화학 반응의 규칙성’과 연계된다.\n연소 과정에 필요한 물질이나 연소 후 생성되는 물질을 지도할 때 초등학교 3~4학년군 ‘여러 가지 기체’에서 학습한 산소나 이산화 탄소의 성질을 상기시킨다.\n실험할 때는 학생들이 적절한 안전 장구를 착용하도록 하고, 실험 전에 학생들에게 주의할 점과 안전사고 대처 방법을 지도한다.\n생태전환교육과 연계하여 연소 생성물 중 이산화 탄소로 인한 생태계의 피해 사례를 수집하여 분석하도록 한다. 디지털 소양 교육과 연계하여 피해의 원인, 현황, 전망 등을 바탕으로 실천 가능한 해결책이나 행동 방식을 제안하고, 누리망이나 사회 관계망 서비스 등에서 공유하도록 한다.","q":"서로 다른 물질을 섞었을 때 물질의 성질 변화 관찰하기\n양초와 알코올이 탈 때 나타나는 공통적인 현상 관찰하기\n연소 후 생성되는 물질 확인하는 실험하기"},"2022|과학|5~6학년|전기의 이용|1":{"c":"초등학교 3~4학년군 ‘자석의 이용’, 중학교 1~3학년군 ‘전기와 자기’와 연계된다.","q":"전구에 불이 켜지는 전기 회로와 불이 켜지지 않는 전기 회로 비교하기\n전지 한 개를 연결한 전기 회로와 전지 두 개를 직렬연결한 전기 회로에서 전구의 밝기 비교하기\n전자석의 성질을 영구 자석과 비교하여 탐색하기\n등의 학습 과정에서 전기 안전에 유의하도록 한다.\n전지와 전구, 전선을 연결하여 전구에 불이 켜지는 전기 회로를 구성하여 도체와 부도체를 구별하는 활동을 진행할 수 있다.\n전지 한 개를 연결한 회로와 전지 두 개를 직렬연결한 회로의 특징을 비교하기 위해 발광다이오드, 전동기, 버저 등의 다양한 전기 부품을 이용할 수 있다.\n전구 등의 전기 부품은 전지의 연결을 고려하여 알맞은 규격을 사용한다.\n전기를 효율적이고 안전하게 사용하는 방법에 대한 학습을 생활 규칙 만들기, 과학 글쓰기, 그림 그리기, 역할 놀이 등의 다양한 활동으로 융합하여 전개할 수 있다."},"2022|과학|5~6학년|과학과 나의 진로|1":{"c":"중학교 1~3학년군 ‘과학과 나의 미래’와 연계된다.\n인구 문제, 환경 문제 등 미래 사회에 일어날 수 있는 문제의 해결과 관련하여 과학의 유용성을 다룰 때는 과학이 모든 문제를 해결할 수는 없다는 것도 함께 지도한다.\n과학기술의 발달이 가지고 올 미래 사회의 모습에 맞춰 새로운 진로의 탐색이나 미래의 나를 위한 준비의 필요성을 느낄 수 있도록 지도한다.","q":"우리의 진로에 영향을 미치는 과학적 요소 탐구하기"},"2022|국어|1~2학년|듣기⋅말하기|1":{"c":"학습자가 학교생활에 적응하는 과정에서 다른 사람과 상호 작용하는 데 필요한 기초적인 듣기⋅말하기 능력을 갖출 수 있도록 한다. 일상생활에서 친숙하게 접할 수 있는 주제로 대화하는 상황, 교사나 동료 학습자 앞에서 자신의 경험이나 배경지식을 바탕으로 간단히 발표하는 상황을 중심으로 듣기⋅말하기 활동이 이루어지도록 한다.\n올바른 구어 의사소통 습관을 형성할 수 있도록 학습자의 삶과 연계하여 지도한다. 말차례 지키기나 바르고 고운 말로 말하기에 대해 학습하는 수업 시간뿐만 아니라 평소 학교생활이나 가정생활에서도 말차례 지키기와 바르고 고운 말 사용하기를 실천하도록 한다.\n학습자가 경험할 수 있는 실제적이고 구체적인 상황 맥락을 설정하여 학습자가 듣기⋅말하기 활동에 관심과 흥미를 가지고 자발적으로 참여할 수 있도록 하고, 그 과정에서 자연스럽게 평가가 이루어지도록 하여 평가에 대한 부담을 느끼지 않게 한다.\n감정 나누기를 지도할 때는 화자의 감정을 일방적으로 전달하는 데 그치지 않고 상대의 감정 표현도 이해하며 서로의 감정을 교류할 수 있도록 한다.\n발표하기를 지도할 때는 학습자가 공적 발표 상황에 대해 부담감이나 불안감을 느낄 수 있으며 발표 수행 결과에 따라 부정적인 자아 개념을 형성할 수도 있다는 점에 유의하여, 동료 학습자의 발표에 대해 긍정적으로 반응하고 상호 격려하는 교실 문화를 조성하도록 한다."},"2022|국어|1~2학년|읽기|1":{"c":"읽기 성취기준과 타 영역의 성취기준을 분리해서 지도하기보다 상호 연계하여 국어 활동의 총체성을 구현하도록 한다. 예를 들어 정확히 소리 내어 읽기와 관련한 성취기준은 글자와 단어를 바로 쓰기에 대한 쓰기 성취기준, 소리와 표기가 다름을 알고 정확하게 발음하고 쓰기에 대한 문법 성취기준, 말놀이와 낭송에 관한 문학 성취기준 등과 연계하여 지도한다.\n정확히 소리 내어 읽기나 알맞게 띄어 읽기를 지도할 때는 학습자가 해당 성취기준에 대한 학습 시간에는 물론이고, 일상생활에서도 학교 안내판, 학급 게시판, 광고지 등 주변에서 접할 수 있는 읽기 자료를 보고 스스로 읽기 활동에 적극적으로 참여할 수 있도록 관심을 기울여 지도한다. 나아가 가정에서도 쉽게 접할 수 있는 읽기 자료를 보고 정확히 소리 내어 읽고 알맞게 글을 읽는지 점검하도록 안내하여 학교 안팎에서의 기초 읽기 능력이 균형 있게 발달할 수 있도록 한다.\n알맞게 띄어 읽기는 함께 읽기와 혼자 읽은 후 짝과 함께 상호 점검하며 읽기 등의 방법을 활용한다. 이때 의미에 따라 여러 단위에서 띄어 읽기가 가능하므로 기계적으로 띄어 읽기를 하지 않도록 유의한다.\n학습자가 한글 학습에 흥미를 느끼고 지속적으로 참여할 수 있도록 몸으로 문자를 표현하는 등의 신체 놀이, 첫음절이 같은 단어를 다양하게 떠올려 보는 연상 놀이 등을 활동 중심 수업과 연계하여 지도할 수 있다. 또한 이 시기는 한글 학습을 통해 기초적인 읽기 능력 계발뿐만 아니라 학습자가 읽기에 대한 흥미를 형성하는 매우 중요한 시기이다. 따라서 학습자가 자신의 수준과 흥미에 맞는 책을 읽은 후 자신의 생각을 표현하는 놀이나 활동⋅체험 등을 연계하여 즐거운 독서 경험을 통해 독서에 대한 긍정적인 태도를 기를 수 있도록 지도한다.\n일반 학습자를 포함하여, 다문화 배경 학습자나 느린 학습자 등의 특별한 요구가 있는 경우에는 해당 성취기준에 대한 개별화 맞춤형 수업을 통해 정확히 소리 내어 읽기와 알맞게 띄어 읽기 등의 한글 깨치기 학습이 충실히 이루어질 수 있도록 지도한다."},"2022|국어|1~2학년|쓰기|1":{"c":"글자와 단어를 쓰는 것은 쓰기의 기초에 해당한다. 글자를 정확하게 쓰기 위해서 바른 자세로 필순과 글자의 짜임에 맞게 낱자를 쓰게 한다. 글자의 복잡성 정도를 고려하여 처음에는 받침이 없는 간단한 글자부터 시작하여 점차 받침이 있는 복잡한 글자를 쓸 수 있게 한다. 글자를 어느 정도 익히고 난 후에는 단어부터 문장 쓰기까지 경험하도록 한다. 쓰기의 기초에 해당하는 내용은 읽기 영역의 ‘읽기의 기초’와 문법 영역의 ‘한글의 기초와 국어 규범’과 연계하여 지도할 수 있다.\n기초 한글 학습이 부족한 학습자를 위해서 문자 학습에 흥미를 느낄 수 있도록 신체 놀이, 연상 놀이, 질문 놀이 등 놀이 중심으로 교수⋅학습을 진행한다.\n학습자가 쓰기 분량에 부담을 갖지 않도록 자신의 생각을 한두 문장으로 자유롭게 구성하도록 지도하며, 맞춤법이나 띄어쓰기와 같은 규범을 강조하기보다 쓰기에 흥미를 가질 수 있도록 지도하는 데 중점을 둔다.\n학습자가 쉽게 글감을 마련하여 쓸 수 있도록 인상 깊었던 일이나 자신이 경험한 일을 친구에게 이야기하듯이 글로 쓰도록 지도한다. 문자 언어의 관습과 규범에 익숙하지 않은 학습자들이 큰 어려움을 느끼지 않으며 글을 쓸 수 있도록 자신의 경험을 글과 그림으로 함께 표현하도록 지도하는 것도 가능하다. 또한 자신이 쓴 글을 다른 사람들과 나누는 과정을 통해 쓰기에 대해 긍정적인 인식을 갖게 하여 쓰기가 자신을 표현하고 사람들과 소통하는 방법임을 깨닫도록 한다.\n받아쓰기는 글자를 정확하게 쓰는 데 도움이 될 수 있으나, 학습자가 부담을 갖게 되면 국어 활동에 자신감을 잃을 수도 있으므로 신중하게 활용한다. 학습자의 수준을 넘는 어려운 글자나 복잡한 띄어쓰기가 포함된 문장을 피하도록 한다."},"2022|국어|1~2학년|문법|1":{"c":"읽기 영역의 ‘읽기의 기초’, 쓰기 영역의 ‘쓰기의 기초’ 성취기준과 연계하여 ‘낱자, 글자, 단어, 문장’에 대한 순차적이고 체계적인 학습을 제공함으로써 입학 초기 기초 문식성을 지원하도록 한다. 특히 단어를 다룰 때는 소리와 표기가 일치하는 단어부터 소리와 표기가 일치하지 않는 단어로 학습 범위를 점차 확장하여, 소리와 표기가 일치하지 않지만 자주 쓰이는 단어를 어법에 맞게 적고 바르게 읽을 수 있도록 지도한다. 이를 통해 한글 학습 및 맞춤법의 기초를 닦을 수 있도록 한다.\n기초적인 한글 학습을 위해 문법을 지도할 때는 성취기준 설정 취지에 맞게 단계적이고 순차적으로 학습 요소를 설정한다. 또한 다양한 국어 자료를 바탕으로 말놀이나 신체 놀이, 수수께끼 등 흥미로운 활동을 계획하여, 학습자들의 수준이 다르더라도 소외되는 학습자 없이 문법 활동에 모두 적극적으로 참여할 수 있도록 지도한다.\n한글에 대해 관심과 흥미를 가질 수 있도록 다양한 글이나 담화 자료뿐만 아니라 일상에서 접할 수 있는 다양한 매체 자료를 두루 활용하여, 학습자들이 국어의 표기 수단인 한글에 호기심을 가질 수 있도록 지도한다."},"2022|국어|1~2학년|문학|1":{"c":"학습자가 문학에 친밀감과 흥미를 느끼게 하는 데 중점을 둔다. 재미있는 발상과 표현이 담긴 작품을 활용하여 말의 재미를 느끼고, 작품을 읽은 뒤 자신의 생각이나 느낌, 작품과 관련된 경험을 다양하게 표현하는 활동을 통해 문학을 향유하는 데 필요한 기초 소양을 기르도록 한다.\n작품에 대한 생각과 느낌을 표현하는 활동을 할 때는 학습자가 어렵지 않게 수행할 수 있는 수준에서 다른 영역 성취기준과 연계하여 통합적인 국어 능력이 신장될 수 있게 한다.\n다문화 배경 학습자나 느린 학습자 등 특별한 지원이 필요한 경우 해당 성취기준에 대한 수준별 교과 수업, 협력 수업, 교과 수업 이외의 보충 수업, 기타 학업 지원을 통해 말놀이나 낭송, 작품에 대해 생각한 점 말하기 등의 활동이 충실히 이루어질 수 있도록 지도한다.\n낭송이나 낭독을 지도할 때는 작품의 분위기나 느낌을 살려서 표현하는 데에 중점을 두되, 같은 작품이라도 낭송하는 사람에 따라 개성 있는 느낌과 분위기를 만들어 낼 수 있으므로 융통성을 가지고 허용적인 분위기 속에서 다양한 활동이 이루어지게 한다.\n교과 외 시간에도 시나 노래, 이야기에 흥미를 가지고 즐겨 접하도록 독려함으로써 문학을 생활화하는 태도를 기르게 한다. 수업 시간에 작품의 일부만을 다루었거나 관련 있는 작품들을 더 읽는 것이 필요한 경우, 작품 전체 읽기, 다른 작품 함께 읽기 등을 통해 부족한 부분을 보완하도록 한다."},"2022|국어|1~2학년|매체|1":{"c":"매체 경험을 나눌 때는 학습자가 교육적으로 적절한 매체 자료를 선정할 수 있도록 안내를 제공할 필요가 있다. 또한 각자의 고유한 매체 이용 경험을 자유롭게 공유하도록 함으로써 학습자가 매체 및 매체 자료에 대한 흥미와 관심을 가질 수 있도록 한다.\n일상의 매체 자료에 대해 흥미와 관심을 갖는 활동은 읽기 영역에서 읽기에 흥미를 가지고 즐겨 있는 태도를 함양하는 활동([2국02-05])과 연계할 수 있다. 그리고 일상의 경험을 글과 그림으로 표현해 보는 활동은 쓰기 영역에서 자신의 생각이나 느낌을 문장으로 표현해 보는 활동([2국03-02]), 문학 영역에서 작품 속 내용을 시, 노래, 이야기, 그림 등으로 표현해 보는 활동([2국05-03])과 연계할 수 있다."},"2022|국어|3~4학년|듣기⋅말하기|1":{"c":"일상생활과 교과 학습에 필요한 듣기⋅말하기 능력을 갖출 수 있도록 한다. 학습자 생활 주변의 친숙한 주제에 대해 대화하는 상황, 교과 학습 과정에서 일정한 자료를 정리한 결과를 교사나 동료 학습자 앞에서 발표하는 상황, 학교생활 중 문제를 해결하기 위해 토의하는 상황 등을 중심으로 듣기⋅말하기 활동이 이루어지도록 한다.\n대화, 발표, 토의 담화 수행을 위한 상황 맥락을 설정할 때는 학습자들의 발달 수준, 경험, 흥미와 관심사를 고려하여 학습자들이 적극적으로 참여할 수 있도록 한다.\n구어 의사소통에 즐겁게 참여할 수 있도록 드라마, 애니메이션, 다큐멘터리 등 각종 영상 자료를 활용하거나 역할 놀이 등 다양한 방법을 활용한다.\n상황과 상대의 입장 이해하기, 예의를 지키며 듣고 말하기, 목적과 주제를 고려하여 말하기 등의 기능은 대화나 발표 담화에서뿐만 아니라 일반적인 구어 의사소통 과정에서 두루 필요함을 고려하여 지도한다.\n듣기⋅말하기 과정과 전략에 대해 점검하고 조정하기 기능은 준언어⋅비언어적 표현이 효과적인지, 대화 과정에서 예의에 어긋남이 없는지, 발표 내용이 목적과 주제에 알맞은지, 토의에서 제시한 의견이 주제에 적절하고 이유가 의견을 뒷받침하고 있는지 등을 듣기⋅말하기 중이나 후에 점검하고 조정하는 활동을 통해 지도한다.\n화자와 청자로서의 효능감을 가질 수 있도록 발표를 비롯한 다양한 담화 상황에 자신감 있게 참여하고 상대방과 긍정적으로 상호 작용할 수 있는 기회를 제공한다. 동료 학습자의 듣기⋅말하기 활동에 대해 피드백을 할 때는 화자나 청자로서의 강점을 중심으로 의견을 나누고, 개선할 점에 대해 언급할 때는 화자나 청자로서의 효능감을 훼손하지 않도록 주의하여 지도한다.\n예의를 지키며 대화하기를 지도할 때는 학습자의 삶과 연계해 예의를 지키는 대화 습관을 형성할 수 있도록 한다. 대화가 이루어지는 시간과 장소, 대화의 목적, 상대의 입장 등 다양한 상황을 고려하여, 그에 알맞은 호칭어 사용하기, 인사 예절 지키기, 높임 표현 활용하기, 준언어⋅비언어적 표현 활용하기, 비속어 경계하기, 온라인 대화 예절 지키기 등을 문법 영역, 매체 영역 등과 연계하여 지도한다. 또한 언어 예절을 지키며 대화하는 과정을 스스로 점검하고 평가하여 가정에서도 예의를 지키며 대화하기를 실천하도록 한다.\n토의하기를 지도할 때는 학습자들이 토의 담화에 입문하는 단계임을 고려하여 토의 집단을 짝, 소집단, 대집단으로 서서히 확대하고, 학습자가 소속된 학급에서 경험한 실제적 문제와 관련된 주제를 선정하여 토의에 흥미를 갖도록 한다. 토의의 절차나 형식을 지나치게 강조하지 않으며, 학급 회의나 원탁회의 등을 활용하여 학습자들이 자신의 생각을 자유롭게 나눌 수 있도록 한다. 상대의 의견을 존중하며 경청하는 태도와 자신의 의견만을 고집하지 않는 자세도 함께 지도하여, 협력에 기반한 집단 의사소통을 통해 민주시민으로서의 기초 소양을 함양할 수 있도록 한다."},"2022|국어|3~4학년|읽기|1":{"c":"글의 내용을 파악하고 글에 담긴 의미를 추론하고 평가하는 등 기본적인 읽기 능력을 갖출 수 있도록, 읽기 유창성을 고려한 읽기 상황, 중심 내용을 파악하는 읽기 상황, 질문과 예측을 활용한 능동적인 읽기 상황, 사실과 의견을 구분하거나 출처의 신뢰성을 평가하는 상황 등을 중심으로 읽기 활동이 이루어지도록 한다.\n읽기 유창성을 지도할 때는 먼저 혼자 읽은 후에 짝과 함께 상호 점검하며 읽을 수 있도록 지도한다. 또한 글을 읽을 때 빠르고 정확하게 읽는 읽기 유창성이 충분히 숙달되었는지 점검하면서 글의 의미를 효과적으로 표현할 수 있는 방법을 사용하여 유창하게 글을 읽는지 살피고, 학습자의 읽기 유창성의 수준을 고려하며 지도한다. 1~2학년의 소리 내어 읽기와 알맞게 띄어 읽기의 학습이 충실히 이루어졌는지 연계하여 지도함으로써 한글 깨치기의 어려움을 진단하고 이를 보정하면서 소리 내어 읽기, 알맞게 띄어 읽기 기능이 숙달될 수 있도록 지도한다. 일반 학습자를 포함하여, 다문화 배경 학습자나 느린 학습자 등의 특별한 요구가 있는 경우에는 해당 성취기준에 대한 개별화 맞춤형 수업을 통해 한글 깨치기 학습이 충실히 이루어질 수 있도록 지도한다.\n중심 내용 간추리기를 지도할 때는 문단별로 중요 단어와 중심 문장을 파악하고 이를 바탕으로 글 전체의 중심 내용을 파악하여 간추리도록 지도한다. 문단별로 보충, 반복된 문장은 삭제하고, 중심 생각이 잘 드러나지 않은 문장은 학습자가 재구성할 수 있도록 한다. 그런 다음 문단별로 중심 문장을 통합하여 글 전체의 중심 내용을 파악할 수 있도록 지도한다. 이때 밑줄 긋기, 메모하기, 중요도 평정 등의 전략 등을 안내하고 이를 적용할 수 있도록 지도한다. 해당 성취기준은 타 교과 학습을 위한 교과서 읽기, 학습 자료 읽기 등의 상황과 연계하여 지도함으로써 교과 학습 능력과 읽기 능력이 균형 있게 발달할 수 있도록 한다.\n문맥을 고려하여 모르는 단어의 의미를 짐작하도록 지도할 때는 우선 학습자가 단어의 의미를 짐작한 후 그 의미를 확인하게 한다. 그리고 이 과정을 문법 성취기준과 연계함으로써 국어사전을 활용하여 모르는 단어를 찾도록 지도할 수 있다. 또한, 학습자의 어휘력을 기르기 위해 글을 읽으면서 연관 어휘를 익히거나, 의미 관계를 중심으로 비슷한 말이나 반대말 등을 찾게 할 수 있다. 이때 연상 활동이나 말놀이, 어휘망 그리기 등을 활용할 수 있고, 나만의 단어 사전이나 그림 사전 등을 만들어 다른 학습자들과 공유하도록 지도할 수 있다.\n이 시기는 학습자가 바람직한 독서 습관을 형성하고 읽기에 대한 효능감을 형성하도록 함으로써 지속적으로 읽기에 참여할 수 있는 태도를 형성하는 데 매우 중요한 시기이다. 교사는 학습자가 자신의 수준과 흥미에 맞는 읽을거리를 스스로 찾고, 독서 시간과 분량 등을 고려하여 독서 계획을 세움으로써 한 권의 책을 완독할 수 있는 습관을 형성할 수 있도록 지도한다. 또한 교사는 학습자의 읽기 어려움을 점검하고 이를 해결할 수 있는 피드백을 제공함으로써 학습자가 성공적인 읽기 경험을 통해 읽기 효능감을 높이도록 지도할 수 있다. 이때 읽기 효능감을 높일 수 있도록 어려움을 겪는 학습자의 독서 활동에 대해 교사와 동료 학습자들이 격려와 칭찬과 같은 긍정적인 피드백을 제공하도록 한다. 또한 교사는 수업 상황을 고려하여 학급 전체가 같은 책을 읽거나, 모둠끼리 같은 책을 읽거나, 학습자 개인별로 원하는 책을 읽도록 할 수 있다."},"2022|국어|3~4학년|쓰기|1":{"c":"쓰기는 특정한 상황 안에서 이루어지는 의미 구성 행위이다. 쓰기가 이루어지는 상황 맥락에 대한 이해 없이는 필자의 의도, 전달하고자 하는 바를 효과적으로 표현할 수 없다. 이때의 상황 맥락은 텍스트의 생산⋅수용 과정에 직접적으로 개입하는 맥락을 의미한다. 쓰기의 상황 맥락 요인으로는 예상 독자, 글의 주제, 글의 목적, 매체 등을 들 수 있다. 다양한 쓰기 과제를 제시하여 상황 맥락 요인에 따라 쓰기 과정과 결과가 달라질 수 있음을 지도한다.\n쓰기 활동을 위해 쓰기 과제를 설계할 때는 다양한 사회⋅문화적 배경의 학습자들이 소외되지 않고 쓰기 활동에 적극적으로 참여할 수 있는 상황 맥락을 설정한다. 나아가 이들 학습자들의 사회⋅문화적 경험을 활용하여 글을 쓸 수 있도록 함으로써 쓰기 학습 과정에서 다양성을 경험할 수 있도록 지도한다.\n글은 문단들로 구성되며, 하나의 문단은 중심 문장과 이 중심 문장의 내용을 구체적으로 보충하고 뒷받침하는 뒷받침 문장으로 구성된다. 문단을 구성하는 것은 한 편의 글을 구성하는 과정에서 필요한 능력이다. 문단 쓰기를 지도할 때에는 다양한 예시 글을 활용하여 중심 문장과 뒷받침 문장의 개념을 이해한 후 학습자가 글을 쓰는 과정에서 이를 실제로 적용할 수 있도록 지도한다.\n학습에 필요한 기본적인 쓰기 능력과 태도를 갖출 수 있도록, 교과 학습의 토대가 되는 쓰기 활동이 이루어지도록 한다. 특히 국어과 내 타 영역의 성취기준, 타 교과의 성취기준, 범교과 학습 주제와 관련된 쓰기 활동을 계획하여 쓰기 활동이 학습자의 교과 학습에 실제적으로 기여할 수 있도록 지도한다.\n보고하는 글 쓰기를 지도할 때는 체험 학습 보고서, 과학 실험 보고서, 조사 보고서 등의 글을 다루도록 한다. 보고하는 목적과 주제에 맞게 보고서에 들어갈 핵심 내용을 구성하고 형식을 갖추어 간결하고 정확하게 보고하는 글을 쓰도록 지도한다. 또한 보고하는 글이 내용적으로 사실에 기반해야 함을 이해하고, 과장되거나 왜곡된 내용을 경계하여 정확하게 표현하는 글을 쓸 수 있도록 지도한다.\n자신의 의견을 밝히는 글 쓰기를 지도할 때는 학급, 학교, 이웃과 관련하여 쟁점이 되는 사안을 화제로 선정하고, 자신의 배경지식과 경험을 기초로 의견을 뒷받침하는 이유를 들어 글을 쓰도록 지도한다. 글을 쓰는 과정에서 자신의 의견을 명료화, 구체화함으로써 논리적으로 글을 쓰는 기초 능력을 기르는 데에 중점을 둔다.\n고쳐쓰기를 지도할 때는 학습자들이 자신의 글을 점검하는 데에 익숙하지 않을 수 있으므로, 동료 학습자를 통해 실제 독자의 반응을 접하고 이를 반영하여 자신의 글을 점검하고 수정할 수 있도록 격려한다. 고쳐쓰기는 글을 쓰는 전 과정에서 이루어져야 하지만, 초고 쓰기 이후에 집중적으로 지도하는 것도 가능하다.\n예상 독자에 대한 인식이 형성되기 시작하는 시기이므로 학습자에게 자신의 글을 읽을 예상 독자를 생각하며 글을 쓰도록 안내하고 실제 독자와 소통하는 기회를 제공할 필요가 있다. 실제 독자를 고려하여 편지의 형식을 갖추어 글을 쓰거나 사회 관계망 서비스(SNS) 등의 인터넷 매체를 활용하여 글을 쓸 수 있도록 지도한다. 쓴 글을 상대에게 전달하고 독자의 반응을 접함으로써 글이 소통의 매개가 됨을 이해하고 독자를 고려한 글쓰기의 필요성을 인식하며 필자로서의 효능감을 느낄 수 있도록 하는 데에 중점을 둔다."},"2022|국어|3~4학년|문법|1":{"c":"단어의 의미, 단어 간의 의미 관계, 단어의 분류, 문장의 짜임, 높임 표현과 지시⋅접속 표현 등을 지도할 때는 우리 주변의 글이나 담화 자료를 다양하게 활용하고, 학습한 지식을 바탕으로 어휘력이나 문장 생성 능력을 신장할 수 있도록 연계함으로써, 문법 활동이 학습자의 실제 삶의 맥락 및 국어생활과 밀접히 관련될 수 있도록 한다. 특히, 지시⋅접속 표현을 지도할 때는 유기적인 언어 단위인 글이나 담화의 개념을 이해할 수 있도록 지도한다.\n전통적인 글 자료 이외에 학습자들이 일상에서 접할 수 있는 다양한 매체 자료를 두루 활용하여 언어 자료의 실제성을 높이고, 매체 자료의 특성과 효과를 이해할 수 있도록 한다. 특히 다양한 형태와 유형의 종이 사전과 웹 사전(유의어⋅반의어 사전, 분류 사전 등)을 적극적으로 참조하고 활용하여 국어생활을 효과적으로 영위할 수 있도록 안내한다.\n언어의 본질과 맥락 관련 내용 요소는 학교급이 올라감에 따라 지속적으로 심화⋅연계될 수 있도록 지도한다. 예를 들어, 의사소통의 수단인 언어의 기호적 속성은 이후 학년군⋅학교급의 음성 언어와 문자 언어의 특성과 매체, 국어의 음운 체계와 문자 체계 관련 내용 요소와 심화⋅연계될 수 있도록 지도한다. 또한, 높임 표현은 참여자 간의 관계나 장면에 따라 분화되는 선택항으로서, 이후 학년군⋅학교급의 지역에 따른 언어와 표준어, 세대⋅분야⋅매체에 따른 언어 관련 내용 요소와 심화⋅연계될 수 있도록 지도한다.\n언어가 의사소통 및 관계 형성의 수단임을 지도할 때에는, 언어의 다양한 기능 중 지시적⋅정보적⋅친교적 기능에 중점을 두어 일상생활에서 수집한 다양한 언어 사례를 분석해 봄으로써 언어가 의사소통과 관계 형성의 주요한 도구임을 이해하고 국어를 소중히 하는 태도를 지닐 수 있도록 한다.\n문법 지식을 학습하는 데만 머무르지 않고 학습자 스스로 자신의 국어생활을 되돌아볼 수 있도록 간단한 형태의 점검표나 관찰 기록표 등을 제공함으로써 일상의 국어생활을 개선하는 계기를 마련한다."},"2022|국어|3~4학년|문학|1":{"c":"작품으로 형상화된 세계와 현실 세계를 비교하여 이해하고 감상하며, 그 결과를 다양한 방법으로 표현하는 능력을 기르는 데 중점을 둔다. 학습자가 자신의 흥미와 발달 단계에 맞는 작품을 찾아 읽고, 감상의 결과를 능동적으로 표현하면서 문학을 즐기는 태도를 기르도록 한다.\n마음에 드는 작품을 소개하는 활동을 할 때는 국어과의 다른 영역 성취기준과 연계하여 학습자의 수준에 맞는 통합적 활동을 수행하게 할 수 있다. 작품이 마음에 든 이유, 작품에 대한 자신의 의견 등을 정확히 말하거나 쓰면서 문학을 매개로 이루어지는 소통 활동을 다양하게 경험할 수 있게 한다.\n작품을 선정할 때는 서책 형태의 작품은 물론 오디오북, 전자책 등의 매체로 만들어진 작품들, 애니메이션, 영화, 연극 등 다양한 방식으로 구현된 작품들도 함께 고려하여 선정한다.\n학습자의 성취 정도를 판단할 때는 교수⋅학습에서 다룬 지식이나 개념에 대한 이해에한정하지 않고 작품을 감상하는 과정, 감상 결과를 표현하는 방법, 마음에 드는 작품을 설득력 있게 소개하고자 노력하는 자세, 문학을 즐기는 태도의 형성 등도 고려하여 평가한다."},"2022|국어|3~4학년|매체|1":{"c":"학습자들이 이미 학교 밖에서 다양한 인터넷 활동을 경험하고 있음을 고려하여 자료 탐색과 선택, 매체 자료의 활용과 공유 등의 학습 활동 설계 시 학습자들의 실제 삶과 유기적으로 연계될 수 있도록 한다.\n인터넷에서 학습에 필요한 다양한 자료를 탐색하고 목적에 맞게 선택하기를 지도할 때는 인터넷 공간을 지정하여 제한된 범위에서 자료 탐색이 이루어질 수 있도록 하여 상위 학년의 내용 요소인 검색하기보다는 접속하기와 자료 훑어보기 등에 초점을 두어 지도한다.\n인터넷에서 학습에 필요한 다양한 자료를 탐색하고 목적에 맞게 선택하는 활동은 매체를 활용하여 간단한 발표 자료를 제작하는 활동과 순차적으로 연계될 수 있다. 또한 듣기⋅말하기 영역에서 목적과 주제에 맞게 자료를 정리하여 발표하는 활동([4국01-05])과도 연계하여 발표 자료의 준비, 제작, 발표에 이르는 일련의 과정을 지도할 수도 있다.\n인터넷 접속 경험이 적고 자료 탐색 활동에 어려움을 겪는 학습자가 있는 경우, 보다 구체적인 안내를 통해 이들이 학습에서 소외되지 않도록 지도한다.\n매체 소통 윤리와 관련된 활동을 지도할 때는 규범의 당위성만을 강조하기보다는 매체 소통에 참여하는 구성원으로서 지켜야 할 예절, 배려, 준법정신 등의 태도를 강조하고 바람직한 매체 소통 문화 형성에 기여하는 사회 구성원으로서의 소양을 기를 수 있도록 한다."},"2022|국어|5~6학년|듣기⋅말하기|1":{"c":"다양한 담화 상황에서 지켜야 할 절차와 규칙, 태도를 학습함으로써 기본적인 구어 의사소통 능력을 기르고, 이를 바탕으로 교과 학습을 수행하며 대인 관계를 형성하고 학습자가 속한 공동체의 문제를 해결하는 능력을 갖출 수 있도록 한다. 친숙하거나 흥미로운 주제에 대해 대화하는 상황, 정보를 수집하기 위해 면담하는 상황, 자료를 선별하고 매체를 활용하여 발표하는 상황, 학교나 지역사회 문제에 대해 토의하는 상황, 찬성과 반대로 나누어 토론하는 상황 등을 중심으로 듣기⋅말하기 활동이 이루어지도록 한다.\n전형적인 구어 담화 자료 이외에 학습자들이 일상에서 접할 수 있는 여러 가지 매체를 활용하여 디지털 공간을 비롯한 다양한 소통 공간에서 담화를 정확하게 이해하고 효과적으로 표현하는 능력을 기르도록 지도한다. 발표를 위해 주제나 목적에 적합한 자료를 선별할 때, 면담을 위해 사전 질문을 준비할 때, 토의에 필요한 자료를 수집할 때, 토론에서 타당한 근거를 마련할 때에 매체 영역과 연계하여 지도할 수 있다.\n대화, 면담, 발표, 토의, 토론 담화에 대한 수업을 설계할 때 다양한 사회⋅문화적 배경의 학습자들이 소외되지 않고 듣기⋅말하기 활동에 적극적으로 참여할 수 있도록 주제, 청자, 매체 선정 등에 유의한다. 구어 의사소통 과정에서 상대방이 처한 상황과 입장의 다양성을 인정하고 서로를 배려하는 민주시민의 기초 소양을 함양할 수 있도록 한다.\n추론하며 듣기, 주제에 적절한 질문하기, 의견 비교 및 조정하기, 주장⋅이유⋅근거가 타당한지 평가하며 듣기 등의 기능은 대화, 토의, 토론 담화에서뿐만 아니라 다양한 담화를 듣고 말하는 데 두루 필요함을 고려하여 지도한다.\n듣기⋅말하기 과정과 전략에 대해 점검하고 조정하기 기능은 면담에서 질문이 적절한지, 발표 내용이 목적과 주제에 적절한지, 토론에서 절차와 규칙을 준수하고 있는지 등을 듣기⋅말하기 중이나 후에 점검하고 조정하는 활동을 통해 지도한다.\n면담하기를 지도할 때는 학습자의 진로를 탐색하는 활동과 연계할 수도 있다. 학습자가 관심을 가지고 있는 직업군에서 면담 대상자를 선정하고, 해당 직업에 대해 인터넷 정보 검색을 통해서 확인할 수 있는 정보보다 면담을 통해서 얻을 수 있는 정보를 물어보는 구체적이고 실제적인 질문을 준비하여 면담하도록 한다. 다만 면담의 실제성이 높아지는 만큼 사전 준비와 면담 시 지켜야 할 예절 등을 충분히 지도한다.\n토의하기를 지도할 때는 토의의 일반적인 절차를 고려하여 학습자가 경험한 일상생활의 실제적 문제에 대해 토의하도록 한다. 특히 학습자가 소속된 학교나 지역사회 문제와 연계된 토의 주제를 정함으로써 협력적 소통을 통해 공동체의 문제를 해결하는 방안을 마련해 보는 경험을 할 수 있도록 한다.\n토론하기를 지도할 때는 토론이 문제에 대해 대립되는 입장을 확인함으로써 상호 이해의 계기를 마련하는 민주적인 소통 방법이라는 점을 안내한다. 토론 과정에서 상대의 의견을 존중하며 경청하는 태도와 자신의 의견만을 고집하지 않는 자세를 갖추도록 하여, 민주시민으로서의 기초 소양을 함양할 수 있도록 한다."},"2022|국어|5~6학년|읽기|1":{"c":"글의 구조를 고려하여 요약하기를 지도할 때는 요약하기가 단순히 글의 분량을 줄이는 것이 아니라 글의 구조에 따라 중심 내용을 자신의 언어로 표현하는 것임을 이해할 수 있도록 지도한다. 글의 구조를 시각화하여 제시한 도해 조직자 등을 활용하고, 짝 활동이나 모둠 활동을 통해 요약하기 과정과 결과를 공유하며 효과적으로 요약하기 전략을 내면화할 수 있도록 지도한다. 해당 성취기준은 타 교과 학습을 위한 교과서 읽기, 학습 자료 읽기 등의 상황과 연계하여 지도함으로써 교과 학습과 관련하여 읽기 능력이 균형 있게 발달하도록 지도한다.\n일반 학습자를 포함하여, 다문화 배경 학습자나 느린 학습자 등의 특별한 요구가 있는 경우에는 해당 성취기준에 대한 개별화 맞춤형 수업을 통해 한글 깨치기 학습과 기본적인 읽기 기능에 대한 학습이 연계하여 이루어질 수 있도록 지도한다.\n교육 기술의 발달에 따라 교육 현장의 여건과 학습자의 수준에 적절한 매체를 선정하여 학습 공간을 연결하고 확장하여 지도할 수 있다. 수업 상황에서는 학습관리시스템(LMS), 교육 기술 수업 도구, 실시간 쌍방향 수업 플랫폼, 메타버스 등을 활용하여 실시간과 비실시간으로 독서 토론, 대화, 발표, 질의응답 등을 수행하고 독서에 관한 피드백을 나눌 수 있다. 또한 독서 과정과 결과를 인터넷 게시판, 누리집 등을 통해 공유할 수 있다. 독서 감상문이나 서평 쓰기, 책 쓰기 등의 독서 활동 이외에도 카드 뉴스 만들기, 책 소개 영상을 제작하고 공유하는 활동 등 매체를 활용하여 다채로운 독서 활동을 수행할 수 있도록 지도한다.\n학습자 스스로 자신의 읽기 활동을 되돌아보고 능동적으로 읽기에 참여하는지 확인하기 위해 독서 성찰 일지나 독서 기록장을 작성하도록 하고, 자기 점검표나 관찰 기록표 작성 등 다양한 방법을 활용하여 일상의 읽기 습관을 개선하고 읽기 동기를 긍정적으로 형성하도록 지도한다. 이때 글을 읽는 과정에서 새롭게 알게 된 단어나 교과 학습을 위한 목적으로 글을 읽을 때 새롭게 알게 된 개념어 등을 토대로 나만의 단어 사전이나 단어 기록장 등을 만들어 학습자가 자기주도적으로 읽기 활동을 수행하는 가운데 어휘 학습을 연계할 수 있도록 지도한다.\n이 시기는 학습자가 긍정적인 읽기 동기를 형성하여 읽기에 지속적으로 참여할 수 있도록 하는 태도를 형성하는 데 매우 중요한 시기이다. 학습자가 읽기에 대한 중요성과 가치를 인식하고, 교과 학습, 진로 탐색, 여가 등의 읽기 목적과 학습자 개인의 흥미나 수준을 고려하여 읽을거리를 스스로 찾아 읽되, 한 학기에 적어도 한 편의 글을 능동적으로 읽는 경험을 할 수 있도록 지도한다. 이때, 교사는 도서관이나 인터넷에서 관련 자료를 찾아 참고하면서 책을 찾아 읽을 수 있도록 안내하거나, 관심 분야가 유사한 학습자 간에 모둠을 구성하여 책을 선정하여 읽고, 읽기 결과를 공유할 수 있도록 하는 등의 독서 활동에 필요한 시간을 확보한다. 보상이나 성적 등에 의한 것이 아니라, 주제에 대한 흥미와 선호, 읽기의 가치와 중요성, 읽기에 대한 즐거움 등을 느낄 수 있는 독서 경험을 통해 읽기 동기가 형성될 수 있도록 지도한다."},"2022|국어|5~6학년|쓰기|1":{"c":"설명하는 글 쓰기는 학습에 필요한 쓰기 능력을 갖출 수 있도록 교과 학습과 연계하여 지도하는 것이 효율적이다. 각 교과의 관찰, 조사 등의 학습 활동과 연계하여 대상의 특성이 나타나게 설명하는 글을 쓰도록 지도한다.\n쓰기 과정에서 자료 수집이 필요할 경우, 다양한 매체를 활용하여 표현하고자 하는 내용에 알맞은 사진이나 삽화, 도표, 동영상 등의 자료를 찾을 수 있도록 지도한다. 또한 글을 쓸 때에도 글의 목적이나 주제에 따라 필자의 의도를 효과적으로 전달할 수 있는 다양한 매체를 선정하고, 선정한 매체의 특성을 고려하여 글을 쓸 수 있도록 지도한다. 동일한 목적의 글이라 하더라도 매체가 달라지면 글의 내용과 형식이 영향을 받게 됨을 이해하도록 하는 것에 중점을 두되, 다양한 예시 글을 제시하고 학습자가 스스로 글을 분석하여 내용 선정 시 고려해야 할 점, 내용 선정 방법 등을 찾을 수 있도록 안내한다. 이때 제시한 글이 단순히 모방을 위한 예가 되지 않도록 유의한다.\n설득을 목적으로 하는 글 쓰기는 주장하는 바가 뚜렷하게 드러나고 근거가 적절해야 독자를 효과적으로 설득할 수 있음을 지도한다. 제시한 근거가 주장과 관련이 있는지, 주장을 뒷받침하는 데에 적절한지에 중점을 둔다.\n체험을 바탕으로 감상을 나타내는 글을 쓰는 과정을 지도할 때는 학습자의 삶의 맥락에서 접하는 다양한 체험을 소재로 솔직하고 진솔하게 글을 쓰게 하되, 특별한 경험이 아닌 일상의 경험에서 의미 있는 글의 소재를 찾을 수 있도록 지도한다.\n쓰기 과정을 지도할 때는 계획하기, 내용 생성하기, 내용 조직하기, 초고 쓰기, 고쳐쓰기와 같은 일련의 과정을 거침으로써 효율적인 글쓰기가 가능해진다는 점을 이해시키되, 이러한 일련의 쓰기 과정이 엄격하게 구별되거나 분절적인 것이 아니며 쓰기 과정에 대한 점검 및 조정을 통해 회귀할 수 있는 특성을 가졌다는 점에 유의하여 지도한다. 내용 생성하기 과정에서는 독자와 매체를 고려하여 내용 생성하기를 지도하되, 브레인스토밍, 마인드맵 등의 방법을 통해 글을 쓰기 위한 내용 생성 전략이나 기능을 익히도록 한다. 고쳐쓰기 과정에서는 띄어쓰기와 맞춤법을 포함하여 지도하되, 본래 의도한 의미가 독자에게 전달될 수 있도록 표현되었는지, 글 전체의 통일성이 확보되었는지 등에 중점을 두어 지도한다.\n쓰기 윤리는 필자가 글을 쓰는 과정에서 준수해야 할 윤리적 규범으로, 학습자가 글을 쓰는 과정 전반에서 이를 고려하도록 지도한다. 다른 사람의 글이나 자료를 인용하여 글을 쓸 때는 그 출처를 밝히도록 지도하는 데에 중점을 두며, 자신의 의견과 다른 사람의 의견을 구분하여 표시하고 지나치게 많은 부분을 인용하지 않도록 지도한다. 디지털 의사소통 환경 속에서 글을 쓰고 소통할 때에도 쓰기 윤리를 지키고 독자를 존중하고 배려하는 태도를 지녀야 한다는 점에 유의하도록 지도한다.\n진로연계교육과 관련하여 자신의 흥미나 관심사가 무엇인지 생각해 보고, 관련된 직업에 대해 다양한 매체를 활용하여 글을 쓸 수 있도록 지도한다.\n쓰기는 사회⋅문화적 맥락을 고려한 사회적 행위이며, 필자는 쓰기 경험을 통해 언어 공동체의 구성원으로 성장할 수 있어야 한다. 쓰기 과정에서 필자가 고려해야 하는 사회⋅문화적 맥락으로는 자신이 속한 언어 공동체의 문화, 신념, 가치관 등을 들 수 있다. 자신이 속한 언어 공동체의 구성원이 공유하는 사회⋅문화적 맥락에 대해 이해하고 필자로서 언어 공동체에 적극적으로 참여하는 경험을 통해 독자와 효과적으로 소통하는 필자로 성장할 수 있도록 지도한다."},"2022|국어|5~6학년|문법|1":{"c":"고유어와 관용 표현의 의미와 쓰임, 시간 표현의 형식이나 기능을 지도할 때는, 문장 수준에 국한되지 않도록 우리 주변의 글이나 담화 자료를 다양하게 활용하고, 학습한 지식을 바탕으로 어휘력이나 문장 생성 능력을 신장할 수 있도록 연계함으로써 문법 활동이 학습자의 실제 삶의 맥락 및 국어생활과 밀접히 관련될 수 있도록 한다.\n지역에 따른 언어 변이로서 방언을 지도할 때는, 지역 연계 학습을 도입, 활용하여 지역 방언을 자신이 속한 언어 공동체의 언어로서 인식하고, 그러한 언어로 사고하고 소통하는 것의 의미를 자신의 삶의 맥락 및 정체성과 연계하여 이해할 수 있도록 한다. 또한 학습자들의 다양한 언어적 배경과 교실 맥락을 고려하여 특정 학습자가 소외되지 않고 적극적으로 참여할 수 있도록 학습 활동을 설계한다.\n다양한 매체에 나타난 음성 언어 및 문자 언어의 특성과 표현 효과를 지도할 때는, 매체 영역 5~6학년의 복합양식 매체 자료 제작 관련 성취기준과 연계할 수 있으며, 직접 매체 자료를 제작해 보는 과정을 통해 그 이해가 확장, 심화될 수 있도록 학습 활동을 설계할 수 있다.\n호응 관계가 자연스럽고 올바른 문장 사용하기, 잘못 쓰인 단어나 문장 고쳐 쓰기, 오⋅남용한 외래어 순화하기 등 바른 국어생활을 위한 내용을 지도할 때는, 배운 지식을 활용하여 자신의 국어생활을 되돌아볼 수 있도록 구조화된 점검표나 관찰 기록표, 성찰 일지, 자기 보고서 등 다양한 형태의 평가 도구를 제공함으로써 일상의 국어생활을 민감하게 주시하고 이 과정에서 발견되는 문제를 적극적으로 개선할 수 있도록 지도한다."},"2022|국어|5~6학년|문학|1":{"c":"작품에 담긴 뜻이나 의도를 깊이 생각하고, 작품을 구성하는 여러 요소들에 대한 이해를 바탕으로 작품에 대한 자신의 의견을 적극적으로 표현하는 데에 중점을 둔다. 또한 작품을 읽고 자신의 삶을 성찰하는 한편, 자신의 경험을 다양한 갈래로 표현하여 다른 독자들과 능동적으로 소통하도록 한다.\n작품에 대한 의견을 나누는 활동을 할 때는 다른 사람의 의견을 존중하는 가운데 국어과의 다른 영역 성취기준과 연계하여 통합적인 국어 능력이 신장될 수 있도록 한다. 예를 들어 이전 학년 쓰기 영역의 ‘자신의 의견을 담은 글 쓰기’([4국03-03])에 대해 학습한 내용을 활용하여, 의견을 제시할 때 고려해야 할 점에 유의하면서 작품에 대한 자신의 의견을 명확하게 전달할 수 있도록 한다.\n자신의 경험을 문학으로 표현하는 활동을 할 때, 작품으로 쓸 만한 특별한 일이나 경험이 없다고 어려움을 호소하는 학습자의 경우, 관심을 가지고 주위를 둘러보며 익숙했던 것들을 새로운 시각으로 관찰하는 등 작고 쉬운 일에서부터 경험의 폭을 넓힐 수 있게 독려한다. 또한 이러한 태도를 지속적으로 유지하며 문학 표현에 적극성을 가질 수 있게 지도한다.\n어떤 대상이나 상태를 다른 것에 빗대어 나타내는 비유적 표현을 지도할 때는 비유를 쓰지 않았을 때와 비유를 사용했을 때의 차이와 효과를 생각해 보게 함으로써 비유의 특성을 자연스럽게 이해할 수 있게 하는 데에 중점을 둔다. 또한 문학 작품을 읽을 때는 물론이고 일상에서 언어생활을 할 때에도 비유를 통해 효과적인 언어 표현이 이루어짐을 깨달음으로써 비유의 중요성을 인식할 수 있게 지도한다.\n학습자가 작품을 수용하고 생산하는 과정에서 자연스럽게 문학에 대한 지식을 익히고, 그 지식을 바탕으로 학습자가 더 적극적이고 수준 높은 문학 활동을 수행하는 선순환적 관계를 형성할 수 있게 지도한다.\n지구가 처한 위기에 관련된 문제들을 찾아보고 일상에서 그러한 문제를 해결하기 위해 노력하는 생태 소양을 함양하는 한편 융합적인 사고와 역량을 기를 수 있도록 지도한다. 예를 들어 사회과의 ‘지구촌을 위협하는 다양한 문제들을 파악하고, 지속가능한 미래를 위한 해결 방안을 탐색’하는 성취기준([6사12-02])과 연계할 수 있는 문학 작품을 선정하여 교과 통합적 활동을 수행하도록 한다.\n진로연계교육과 관련하여 학습자가 자신의 흥미나 관심사가 무엇인지 생각해 보고, 관심사와 연관된 작품을 찾아 읽으며 자신의 미래에 대해 지속적으로 관심을 가지고 탐색할 수 있도록 지도한다."},"2022|국어|5~6학년|매체|1":{"c":"학습자가 학교 밖에서 수행한 다양한 매체 경험을 교실이라는 공적 공간을 통해 공유함으로써 학교와 학교 밖에서의 삶이 유기적으로 연계될 수 있도록 안내한다. 학교 밖에서의 매체 경험은 매체 단원을 학습하는 학습의 자원으로서 작용할 수 있다. 따라서 한편으로는 기존에 형성된 학습자들의 검색 전략 및 표현 전략을 수용하고 적극적으로 공유할 수 있는 수업 분위기를 조성하되, 다른 한편으로는 부족한 부분에 대해 명시적인 안내를 제공하도록 한다. 또한 학교 밖에서 여가에 초점을 두고 이루어진 활동에 대해서도 학습자 개인의 선호나 주도성의 발현이라는 측면에서 긍정적으로 바라보고 학습자 간 상호 공유하는 과정을 통해 각자의 매체 경험에 대해 점검과 성찰이 이루어질 수 있도록 안내한다.\n정보 검색 도구를 활용하여 자신의 목적에 맞는 매체 자료를 찾는 활동은 자료를 선별하여 핵심 정보를 중심으로 내용을 구성하고 매체를 활용하여 발표하는 활동([6국01-05])과 연계 가능하다. 학습자들은 [6국06-01]에서 정보를 검색하는 일반적인 원리를 학습한 후 이를 [6국01-05]의 학습 상황에 적용해 볼 수 있다.\n정보 검색 활동에서 초등학생에게 교육적으로 적합하지 않은 선정적인 글이나 이미지 등의 검색 결과가 포함될 수 있다. 교사는 이를 고려하여 학습자들이 안전한 인터넷 공간에서 검색 활동을 실행할 수 있게 하며, 이러한 고려에도 불구하고 부적절한 자료가 검색되었을 때는 교사에게 즉시 말할 수 있도록 사전에 안내한다.\n복합양식 매체 자료의 제작은 쓰기 및 문법 영역의 성취기준과 연계하여 지도할 수 있다. 쓰기 영역에서는 문자를 중심으로 독자와 매체를 고려하여 글을 생산하는 과정([6국03-04])에 초점을 맞춘다면, 매체 영역에서는 문자와 더불어 그림, 사진, 이미지, 소리 등의 다양한 표현 양식을 통한 소통에 초점을 맞춘다. 각 양식의 표현 효과를 이해하고 적용하는 과정은 문법 영역에서 음성 언어 및 문자 언어의 특성을 이해하고 다양한 매체 자료에서 표현 효과를 평가하는 활동([6국04-01])과 유기적으로 연계될 수 있다."},"2022|도덕|3~4학년|자신과의 관계|1":{"c":"학생이 성실하게 생활하면서도 자신의 삶에 대한 반성을 통해 도덕적인 삶으로 개선시켜 나갈 수 있도록 하는 것에 중점을 둘 필요가 있다.\n성취기준의 내용은 핵심 가치인 성실을 비롯하여 자기존중, 정직, 자주, 반성 등이 관련되어 있다. 각각의 내용은 복합적으로 서로 작용하여 학생의 행동으로 드러나므로 통합적으로 다루어질 필요가 있다.\n성취기준이 주로 자기 이해의 도덕적 성장을 도모하는 내용으로 구성된 점을 감안하여, 학생의 일상생활에서 탐구 활동을 통하여 사례가 확인될 수 있어야 교육의 효과를 극대화할 수 있다."},"2022|도덕|3~4학년|타인과의 관계|1":{"c":"다른 사람과의 원만한 관계를 위해 타인과의 관계에서 발생하는 문제를 올바로 인식하고 해결할 수 있는 역량을 함양하도록 한다.\n배려와 감사, 봉사, 차이 존중 등과 관련된 도덕적 문제 상황에서 문제 해결을 위한 여러 가지 방법을 스스로 찾아보고 그 방법의 타당성을 점검해 볼 수 있는 기회를 제공한다.\n학생과 인공지능 로봇의 올바른 관계 형성뿐만 아니라 인공지능 윤리의식 함양에도 역점을 둔다.\n다양한 도덕적 문제 상황에 직면하여 학생 스스로 생각하여 의미 있고 책임 있는 의사 결정을 할 수 있는 역량 함양에 중점을 둔다."},"2022|도덕|3~4학년|사회⋅공동체와의 관계|1":{"c":"공동체 구성원 모두 인권을 지니고 있음을 느낄 수 있도록 하며 인권의 의미와 중요성에 대해 탐구하는 과정에서 인권 감수성을 강화할 수 있도록 한다.\n학생의 일상에서 공정과 불공정의 사례를 탐색하고 자신의 이익과 공정이라는 가치가 대립할 때 어떻게 판단하고 행동해야 하는지를 구체적으로 다루도록 한다.\n인공지능 윤리, 미디어 문해력 등과 관련된 문제를 도덕적인 관점에서 살펴보고 해결 방안을 탐구한다.\n통일에 관해 다양한 관점을 탐색하면서 균형 잡힌 통일의식을 함양하고 북한 주민에 대한 이해의 과정을 확장하여 인류애까지 이어지도록 한다."},"2022|도덕|3~4학년|자연과의 관계|1":{"c":"생명의 소중함에 대한 인식을 바탕으로 도덕적 정서에 기반을 둔 생태 감수성을 기를 수 있도록 수업을 계획한다.\n생명 경시 사례, 과도한 개발 문제, 기후 문제 등 지구의 환경 위기 상황을 초래하고 있는 도덕적 쟁점을 주제로 지속가능한 삶에 대하여 탐구하는 기회를 제공한다.\n미래 세대에 대한 책임이나 자연과의 공생 방법을 탐색할 때 현재 상태를 부정적으로 생각하지 않도록 주의하여 지도한다.\n학생 스스로 협력적 연대를 통하여 자연과의 바람직한 공존을 위해 실천가능한 수준에서 문제 해결 방법을 모색할 수 있도록 한다."},"2022|도덕|5~6학년|자신과의 관계|1":{"c":"학생이 성실하게 생활하면서도 자신의 삶에 대한 반성을 통해 도덕적인 삶으로 개선시켜 나갈 수 있도록 하는 것에 중점을 둘 필요가 있다.\n성취기준의 내용은 핵심 가치인 성실을 비롯하여 자기존중, 정직, 자주, 반성 등이 관련되어 있다. 각각의 내용은 복합적으로 서로 작용하여 학생의 행동으로 드러나므로 통합적으로 다루어질 필요가 있다.\n성취기준이 주로 자기 이해의 도덕적 성장을 도모하는 내용으로 구성된 점을 감안하여, 학생의 일상생활에서 탐구 활동을 통하여 사례가 확인될 수 있어야 교육의 효과를 극대화할 수 있다."},"2022|도덕|5~6학년|타인과의 관계|1":{"c":"다른 사람과의 원만한 관계를 위해 타인과의 관계에서 발생하는 문제를 올바로 인식하고 해결할 수 있는 역량을 함양하도록 한다.\n배려와 감사, 봉사, 차이 존중 등과 관련된 도덕적 문제 상황에서 문제 해결을 위한 여러 가지 방법을 스스로 찾아보고 그 방법의 타당성을 점검해 볼 수 있는 기회를 제공한다.\n학생과 인공지능 로봇의 올바른 관계 형성뿐만 아니라 인공지능 윤리의식 함양에도 역점을 둔다.\n다양한 도덕적 문제 상황에 직면하여 학생 스스로 생각하여 의미 있고 책임 있는 의사 결정을 할 수 있는 역량 함양에 중점을 둔다."},"2022|도덕|5~6학년|사회⋅공동체와의 관계|1":{"c":"공동체 구성원 모두 인권을 지니고 있음을 느낄 수 있도록 하며 인권의 의미와 중요성에 대해 탐구하는 과정에서 인권 감수성을 강화할 수 있도록 한다.\n학생의 일상에서 공정과 불공정의 사례를 탐색하고 자신의 이익과 공정이라는 가치가 대립할 때 어떻게 판단하고 행동해야 하는지를 구체적으로 다루도록 한다.\n인공지능 윤리, 미디어 문해력 등과 관련된 문제를 도덕적인 관점에서 살펴보고 해결 방안을 탐구한다.\n통일에 관해 다양한 관점을 탐색하면서 균형 잡힌 통일의식을 함양하고 북한 주민에 대한 이해의 과정을 확장하여 인류애까지 이어지도록 한다."},"2022|도덕|5~6학년|자연과의 관계|1":{"c":"생명의 소중함에 대한 인식을 바탕으로 도덕적 정서에 기반을 둔 생태 감수성을 기를 수 있도록 수업을 계획한다.\n생명 경시 사례, 과도한 개발 문제, 기후 문제 등 지구의 환경 위기 상황을 초래하고 있는 도덕적 쟁점을 주제로 지속가능한 삶에 대하여 탐구하는 기회를 제공한다.\n미래 세대에 대한 책임이나 자연과의 공생 방법을 탐색할 때 현재 상태를 부정적으로 생각하지 않도록 주의하여 지도한다.\n학생 스스로 협력적 연대를 통하여 자연과의 바람직한 공존을 위해 실천가능한 수준에서 문제 해결 방법을 모색할 수 있도록 한다."},"2022|미술|3~4학년|미적 체험|1":{"c":"미적 체험 영역에서는 학생들이 지각, 성찰, 소통의 개념을 이해하도록 한다.\n미적 체험은 학생들이 자신의 감각으로 주변 대상을 생동감 있게 탐색하고 지각하는 활동을 통해 감각적 인식이 주는 새로움과 다양성을 경험하는 데 수업의 주안점을 둔다. 미적 체험에서는 시각을 비롯한 촉각, 청각, 후각, 미각 등 몸의 다양한 감각을 활용한다. 직접 체험이 좋지만, 환경적 여건이 어려울 때는 사진, 영상, 멀티미디어 자료 등을 활용한 간접 체험을 활용하도록 한다.\n특정 감각을 활용하는 데 어려움이 있는 학습자를 고려한 활동을 별도 구성하여 유의미한 미적 체험이 될 수 있도록 하며 활동 시 안전에 유의한다.\n미적 탐색은 대상을 지각하는 체험뿐만 아니라 대상에 반응하며 떠오르는 자신의 감정, 느낌, 생각 등을 글, 그림, 사진, 동영상, 음악, 움직임 등을 통해 자유롭게 표현하는 활동으로까지 이어지도록 한다. 이로써 자신의 감각을 통해 대상을 지각하고 반응하는 방식을 성찰할 수 있다. 작품 표현 활동이 아니므로 시각적 표현을 지나치게 강요하지 않도록 유의한다.\n생활 속 미술의 범위는 순수 미술, 응용 미술 및 시각 문화 전반을 포괄한다. 학습자가 주변의 생활용품이나 영상물, 건축 및 생활공간 등에서 미술과 관련된 것들을 조사⋅수집⋅분류하고 소통하는 과정에서 미술이 삶과 밀접하게 연관되어 있음을 이해하도록 한다.\n미적 체험은 감각을 통해 대상을 직접 보고 느끼며 이해하는 심미적 경험이다. 학습자가 대상을 보는 자신만의 방식을 발견하고 대상이 지닌 다채로운 면모를 접하며 세계에 대한 호기심을 기를 수 있도록 허용적인 분위기를 조성한다.\n미적 체험의 평가는 감각을 활용하는 능력, 대상을 관찰하고 탐색하는 능력, 대상에 대한 자신의 반응을 이해하는 능력, 생활 속에서 미술을 발견하는 능력을 평가하며 체험 결과뿐만 아니라 과정에 초점을 두고 관찰하여 평가한다."},"2022|미술|3~4학년|표현|1":{"c":"표현 영역에서는 학생들이 발상, 매체 탐색, 제작의 개념과 방법을 이해하도록 한다.\n표현 활동이 학생들의 삶과 연결될 수 있도록 성취기준을 활용하여 학습 목표를 설정한다. 관찰의 대상이나 상상을 이끄는 동기는 학습자의 주변에서 흔히 접할 수 있는 생활 요소에서 출발하여 표현 활동이 삶에 주는 심미적 영향력을 경험할 수 있도록 한다.\n작품 제작은 주제 선정에서 표현 계획 및 실행과 발표 및 마무리까지 일련의 문제 해결 과정이 되도록 한다. 심화 수준의 학생들에게는 표현 방법과 과정을 자기주도적으로 계획하여 실행할 수 있도록 장려하고, 보통 수준의 학생들에게는 표현 주제에 적합한 예시적인 방법을 제안하는 등 학생들의 개인차에 따라 과제를 부여한다.\n조형 요소는 시각적 아름다움을 구성하는 기본 요소이다. 학생들이 작품뿐 아니라 주변 자연물이나 인공물에서 조형 요소를 발견하고 그 특징을 이해하여 주제 표현에 알맞은 조형 요소를 연결하여 적용할 수 있도록 한다.\n표현 재료와 용구의 물성을 감각적으로 익히고 체험하는 활동은 학생들의 감수성을 발달시키고 자신의 느낌과 생각, 경험을 시각적으로 표현하는데 중요한 경험이다. 이에 다양한 표현 재료와 용구를 충분히 다루고 익힐 수 있는 시간을 확보하여 학생들이 의도에 따라 활용할 수 있도록 한다. 더불어 재료와 용구의 사용에 있어 제한이 있는 학생을 고려하여 대체할 방법을 마련하도록 한다.\n학생들의 건강과 환경에 미치는 영향을 고려하여 표현 재료와 용구를 준비하고 안전하게 사용하는 방법을 지도한다. 표현 재료와 용구의 구성 성분 및 유의 사항을 파악하여 학생들의 피부와 호흡기에 해로운 재료와 용구를 사전에 구별하여 제외한다. 사용 후 발생하는 쓰레기 처리 및 하수 처리 등이 환경에 미치는 영향을 고려하여 표현 재료와 용구를 준비하고 안전 수칙을 지켜 사용하도록 한다.\n학생들의 감성, 흥미, 표현력 등의 개인차에 따라 작품 제작의 과정과 결과는 다를 수 있다. 다른 사람들의 시선을 의식하지 않고 자신의 창작 욕구에 따라 표현 주제에 흥미를 갖고 끝까지 작품을 제작하도록 하되 지나치게 높은 수준의 완성도를 요구하지 않도록 한다.\n표현에서 평가는 표현 주제를 구체화하는 능력, 조형 요소의 특징을 이해하고 활용하는 능력, 기본적인 표현 재료와 용구의 사용 방법을 익히는 과정, 자유로운 시도로 의도에 맞게 작품을 제작하는 과정, 자기 작품을 소중히 하는 태도 등을 지속해서 관찰하여 평가한다."},"2022|미술|3~4학년|감상|1":{"c":"감상 영역에서는 학생들이 미술의 이해, 비평, 생활화의 개념을 이해하도록 한다.\n감상 활동 시 미술 작품과 미술가를 조사하고 탐구하는 방법을 안내하고 정보와 일화 등을 활용하여 학생들이 미술 작품과 미술가를 친근하게 느끼고 감상에 흥미와 관심을 가지도록 한다.\n작품 선정은 학습자의 발달 수준을 고려하되, 여러 분야의 작품을 풍부하게 접할 수 있도록 배려한다. 사실기 전 발달 수준의 학습자들이 다양한 미술 작품을 접함으로써 미술에 대한 고정 관념에서 벗어나 자신의 취향을 발견하고 감상에서 이해한 바를 표현 활동의 아이디어로 연계할 수 있도록 한다. 더불어 미술 작품을 통해 서로 다른 생각이 공존할 수 있음을 이해하고 존중하는 태도를 기를 수 있도록 한다.\n미술 작품에 관해 교사가 질문하고 학생이 답변하는 감상이 아니라 미술 작품을 충분히 볼 수 있는 기회와 여건을 제공하여 학생들이 호기심을 갖고 질문을 만들 수 있도록 유도한다. 질문 만들기를 통해 미술 작품에 대한 적극적인 감상 태도와 자신의 감상 관점을 기르도록 한다.\n작품 감상문 쓰기, 작품을 소개하는 편지 쓰기, 작품 속 장면을 연극으로 표현하기, 작품을 노래로 표현하기 등 작품에 대한 느낌과 생각을 자유롭게 발표하도록 한다.\n감상에서 평가는 미술 작품과 미술가를 조사한 내용, 작품에 관한 질문 만들기, 작품에 대한 자신의 느낌과 생각 발표, 미술 전시에 참여하는 태도 등을 중심으로 평가한다."},"2022|미술|5~6학년|미적 체험|1":{"c":"미적 체험 영역에서는 학생들이 지각, 성찰, 소통의 개념을 이해하도록 한다.\n5, 6학년의 미적 체험은 3, 4학년에서의 대상에 대한 탐색에서 나아가 자신에 대한 탐색까지 다루도록 한다. 자신의 외적 특징뿐만 아니라 관심, 취향, 성격 등 내면적 특징을 민감하게 찾아보도록 한다. 자신도 모르게 이끌리는 것, 자신에게 의미 있는 것 등을 주의 깊게 지각하며 정체성을 발견하는 기회가 되도록 한다.\n자신이나 대상을 다양한 방법으로 탐색할 수 있도록 고려한다. 3, 4학년에서 경험한 몸의 감각적 체험과 더불어 사진, 영상, 증강현실 및 가상현실 기기 등 디지털 매체를 포함한 다양한 매체를 활용하여 탐색하고 새로운 특징을 지각하도록 한다. 이를 통해 학습자가 감각의 확장을 경험할 수 있다.\n미적 체험은 주변 환경의 특징을 지각하는 데 그치는 것이 아니라 감각과 사고의 연결을 경험하는 활동까지 연계되도록 한다. 주변 환경에서 찾은 감각적 특징과 자신이 떠올린 감정, 느낌, 생각을 관련지어 통합적으로 나타내는 경험을 통해 감정, 느낌이 사고에 미치는 영향을 성찰하도록 한다.\n광고, 게임, 만화, 영화, 포스터, 픽토그램, 표지판 등 학습자에게 친근한 생활 속 시각 문화를 탐색하고 이미지에 담긴 의미를 비판적으로 해석함으로써 시각적 문해력을 기르도록 한다. 시각 문화가 만들어진 맥락과 의도, 속성을 탐색하며 이미지를 주도적으로 이해하고 활용하는 능력을 기르는 데 중점을 둔다. 학생들이 토의, 토론, 게임, 퀴즈 등을 통해 이미지의 의미를 흥미 있게 탐구하고 소통할 수 있도록 고려한다.\n미적 체험은 무심코 보던 대상을 감각적으로 탐색하고 지각함으로써 세계에 대한 인식과 소통의 범위를 확장하는 활동으로 사람과 사람, 사람과 주변 대상, 대상과 대상과의 관계를 포함한다. 미적 체험을 통해 학습자가 시야를 넓히고 타인과 대상에 대한 심미적 감성을 함양할 수 있도록 고려한다. 나아가 인간 중심의 사고에서 벗어나 대상에 대한 생태 감수성을 풍부하게 하고 사람과 자연의 공존에 대한 생태 전환적 가치를 내면화하도록 지원한다.\n미적 체험의 평가는 자신과 대상의 특징을 발견하는 능력, 주변 환경에 대한 자신의 반응을 나타내는 능력, 주변 환경 속 대상과 상호 작용하며 의미를 만드는 능력, 이미지의 의미를 이해하고 활용하는 능력을 중심으로 평가하며 체험 결과뿐만 아니라 과정에 초점을 두고 관찰하여 평가한다."},"2022|미술|5~6학년|표현|1":{"c":"표현 영역에서는 학생들이 발상, 매체 탐색, 제작의 개념과 방법을 이해하도록 한다.\n학생들의 표현 주제는 생활 속 경험, 타 교과 학습 경험 등 다양한 경험을 바탕으로 한다. 주변 대상과 현상을 자세히 관찰 및 조사하거나 다양한 소재의 작품을 접하면서 떠오르는 생각을 연결하여 아이디어를 발전시키도록 한다. 또한 연상과 상상을 바탕으로 대상과 현상을 새롭게 바라보거나 변화시키는 다양한 발상의 과정을 안내하여 표현 주제를 확장할 수 있도록 한다.\n작품 제작을 위한 조형 요소와 조형 원리의 이해는 감상 활동과 연계할 수 있다. 주제 표현을 위해 조형 요소와 원리를 효과적으로 적용한 작품 사례를 살펴보고 조형 요소의 어울림으로 조형 원리를 이해할 수 있도록 한다. 학생들이 조형 요소와 원리를 다양하게 적용해보면서 그 차이를 경험하고 의도에 따라 주제 표현에 활용하도록 한다.\n남과 다른 자신만의 표현 방식을 존중받는 분위기 속에서 표현 재료와 용구를 확장하여 디지털 매체를 포함한 생활 주변의 다양한 매체와 방법을 활용하여 작품을 제작할 수 있도록 한다. 사용하고자 하는 표현 재료와 용구의 활용 방법을 조사하고 익힐 수 있는 수업 환경을 마련하고 온라인 수업과 연계한 혼합 수업도 계획할 수 있다. 특정 표현 재료와 용구에 따라 환기가 잘 되는 수업 환경 유지를 위해 유해성 물감, 분진, 금속, 플라스틱, 섬유 등의 사용에 주의하고 학생들이 안전사고 예방과 사고 발생 시 행동 요령을 숙지하도록 한다.\n교사는 학생들이 자신의 느낌과 생각, 경험을 작품을 통해 나타내고 발표하는 모든 과정에서 자기주도성을 가질 수 있도록 협력한다. 학생들의 개인차에 따라 다양한 전략으로 접근하여 학습 부진 학생, 느린 학습자, 장애가 있는 학생, 다문화 가정 학생 등 모든 학생이 소외되지 않고 깊이 있는 학습을 경험할 수 있도록 돕는다.\n표현에서 평가는 표현 주제를 발전시키는 능력, 조형 요소와 원리를 작품 제작에 활용하는 능력, 디지털 매체 등 다양한 표현 재료와 용구를 탐색하고 활용하는 과정, 반성적 태도로 작품을 발전시키는 성찰의 과정, 타 교과와 융합하여 자유롭게 표현하려는 시도 등을 지속해서 관찰하여 평가한다."},"2022|미술|5~6학년|감상|1":{"c":"감상 영역에서는 학생들이 미술의 이해, 비평, 생활화의 개념을 이해하도록 한다.\n미술 작품 감상은 작품이 만들어진 시대적, 지역적 배경, 미술가의 심리와 정서 등과 관련지어 작품을 맥락과 함께 이해할 수 있도록 한다.\n미술 작품의 내용과 형식의 개념을 이해하고 작품의 특징을 분석하는 활동을 통해 미술 감상 방법을 익히고 자신의 느낌과 생각을 미술 용어를 활용하여 설명할 수 있는 능력을 기르도록 한다.\n우리나라의 전통 미술과 현대 미술을 포함하여 다양한 시대의 미술 작품과 다양한 문화의 미술 작품을 비교 감상하면서 작품에 대한 자신의 관점과 반응을 명료화하고 관점의 다양성을 경험하도록 한다. 더불어 문화적 다양성을 이해하고 존중하는 태도를 기르도록 한다.\n감상 작품은 학습자의 발달 수준을 고려하여 선정하며 학생들이 직접 경험할 수 있는 전시와 문화 행사 등을 적극적으로 활용한다. 또한 온라인 미술관 작품 감상을 통해 학습자가 주도적으로 미술 작품을 찾아 감상할 수 있도록 지도하여 미술을 생활화할 수 있도록 한다.\n감상에서 평가는 미술 작품의 배경을 연결하여 감상하기, 미술 작품의 내용과 형식에 따른 특징 분석하기, 여러 가지 미술 감상 방법을 활용하고 자신의 느낌과 생각을 발표하기, 다양한 미술 문화에 관심 갖기 등을 중심으로 평가한다. 관찰법, 발표 및 토론법, 감상문, 포트폴리오법 등을 활용하여 감상의 과정과 태도가 평가에 반영될 수 있도록 한다."},"2022|바른 생활|1~2학년|우리는 누구로 살아갈까|1":{"c":"이 영역의 모든 성취기준을 적용할 때 학교라는 새로운 생활의 장에서 학생이 마주하는 다양한 사회적 관계에 심리적으로 안정을 느끼며 적응할 수 있도록 하고, 무엇보다 학교에서 안전하게 생활할 수 있도록 생활 안전 교육, 교통 안전 교육과 연계할 수 있다. 또 교육 내용으로 ‘나’를 다룰 때는 내 몸이 소중하다는 인식을 바탕으로, 성폭력, 실종, 유괴 등 폭력예방 및 신변보호 교육도 병행할 수 있다.\n[2바01-01] 초등학교 적응 활동에 초점을 맞춘다. 그리고 안전 교육이 필요할 때 바른 생활과 모든 성취기준과 함께 적용할 수 있다.\n[2바01-02] 진로 교육과 연계할 수 있다.\n[2바01-03] 자신이 속해 있는 가족의 형태를 이해하고, 주변에서 만나는 다양한 형태의 가족을 존중할 수 있도록 안내한다. 여기에 다문화 교육을 연계할 수 있다."},"2022|바른 생활|1~2학년|우리는 어디서 살아갈까|1":{"c":"타인과의 관계에서 발생하는 문제에 대한 올바른 인식 및 실천에 필요한 역량을 함양하여 원만한 인간관계를 형성할 수 있도록 한다. 이 영역의 모든 성취기준을 적용할 때 가정, 마을 등 학생이 접하는 공간에서 안전하게 생활하는 데 필요한 안전 수칙을 다루며 가정과 연계하여 습관화하도록 한다. 특히 가정, 마을에 있는 다양한 도구와 시설을 안전하게 사용하는 방법을 다루도록 한다.\n[2바02-01] 공동체에 대한 관심을 학교에서 마을로 확대하며 민주시민 교육에 활용할 수 있다.\n[2바02-02] 우월적⋅배타적 민족주의 관점으로 접근하지 않도록 유의한다. 3학년 도덕과의 통일 교육, 독도 교육과 연계하여 적용할 수 있다.\n[2바02-04] 새로운 활동에 대한 도전과 관련하여 자기 인식과 자신감, 자기주도성, 위험 감수, 비판적 사고, 창의성, 문제 해결력 등을 다룰 수 있다. 또한 다양한 매체를 활용하면서 디지털 소양과 연계할 수 있다."},"2022|바른 생활|1~2학년|우리는 지금 어떻게 살아갈까|1":{"c":"안전 교육에서는 습관화가 중요하다. 이 영역의 모든 성취기준을 적용할 때 학생의 일상적 삶과 밀접한 보행자 안전, 자전거⋅자동차 안전, 도구와 전기 사용 안전, 화재 예방, 학교폭력 예방, 계절별 감염병 예방 등을 꾸준히 다룸으로써 학생이 일상생활에서 안전 수칙을 지킬 수 있도록 한다.\n[2바03-01] 사람들은 나름의 주기(흐름, 리듬, 패턴)에 따라 생활한다. 따라서 변화, 성장, 발달을 의식하며 일상의 삶에 자신만의 주기를 형성하게 할 수 있다.\n[2바03-02] 계절이나 날씨의 특징 등을 다루면서 범교과 주제인 환경⋅지속가능발전 교육을 연계할 수 있고 생태전환 교육도 고려할 수 있다.\n[2바03-03] 과거 현재를 구분하지 않고 공동체성을 발휘한 여러 인물을 다룰 수 있다. 이러한 인물이 한 일을 통해서 함께 사는 삶을 위해 우리가 지금 해야 할 일, 할 수 있는 일을 찾아 실천할 수 있도록 한다. 여기에 인성 교육을 연계할 수 있다.\n[2바03-04] 범지구적인 문제들(기후변화, 먹을거리, 소비, 에너지, 자원순환, 생물 다양성, 지진, 태풍, 가뭄, 홍수, 감염병, 미세먼지, 전쟁)이 현재와 미래 우리 삶에 미치는 영향을 생각해 보는 기회로 삼을 수 있다. 이와 관련하여 지금, 여기의 교수⋅학습 상황을 고려하여 학생과 교사가 구체적인 활동을 선정할 수 있으며 범지구적인 재난과 관련한 안전 교육, 민주시민 교육, 생태전환 교육과 연계할 수 있다."},"2022|바른 생활|1~2학년|우리는 무엇을 하며 살아갈까|1":{"c":"이 영역의 모든 성취기준을 적용할 때는 여러 사람이 모여 함께 활동할 때 필요한 안전 교육을 할 수 있다. 특히 학생의 질병 감염을 최소화하고 건강을 유지하기 위해 필수적인 손 씻기, 위생용품 사용하기 등을 다룰 수 있다.\n[2바04-01] 우리 사회에서 간과하기 쉬운 불편함을 찾아 모두를 이롭게 하는 환경으로 구축하는 경험을 할 수 있다. 여기에 더불어 살아가는 태도를 기르는 민주시민 교육, 인권 교육과 연계할 수 있다.\n[2바04-02] 다양한 아이디어 발산 장면을 통해 서로 소통할 때 상대의 의도를 충실히 파악하고 다른 사람의 의견을 경청하며 호혜적으로 해석하는 기회로 삼을 수 있다. 이를 통해 민주시민의 소양을 형성할 수 있다.\n[2바04-03] 경쟁적 삶의 방식과 협력적 삶의 방식의 예시를 찾아보고 나는 지금 어떠한 삶을 살아가고 있는지 생각해 볼 수 있다. 또한 자신이 실천할 수 있는 협력적 삶의 방식을 다루며 인성 교육, 민주시민 교육과 연계할 수 있다.\n[2바04-04] 1~2학년군에서 배운 것을 친구들과 되돌아보며 3학년 이후 교과 교육과 연계할 수 있다."},"2022|사회|3~4학년|우리가 사는 곳|1":{"c":"우리가 사는 곳의 범위는 생활권을 기반으로 하되 여가, 쇼핑을 위한 이동 및 학생의 경험 등 일상생활이 이루어지는 공간 범위를 고려하여 탄력적으로 설정할 수 있다. 1~2학년군 통합 교과의 ‘동네’, ‘마을’과는 차별적으로 차량을 이용하여 자주 방문하는 장소도 포함할 수 있다.\n삶의 터전에 관심을 가지고 학생의 생활과 관련이 깊은 주변의 장소를 탐색하는 데 중점을 둔다. 또한 우리가 사는 곳의 좋은 점, 불편한 점 등을 살펴보면서 살기 좋은 삶터를 만드는 방안을 생각해보고, 이를 알리는 활동을 수행할 수 있다.\n우리가 사는 곳의 여러 장소를 탐색할 때는 디지털 영상지도, 사진 등의 자료나 현장답사 등으로 실제 모습을 파악하는 활동을 수행할 수 있다.\n장소감을 표현하고 이를 공유하는 과정에서 장소에 대한 관심 정도 및 의사소통 능력과 태도를 평가할 수 있으며, 이때 장소에 대한 감정과 같은 정의적 영역뿐만 아니라 인지적, 행동적 영역을 고려한다."},"2022|사회|3~4학년|일상에서 만나는 과거|1":{"c":"[4사02-01]은 시간을 표현하는 용어, 사건의 시간적 위치, 과거와 현재의 거리감 등을 통해 역사의 시간 개념을 이해하고 시간 감각을 키우는 데 중점을 둔다.\n[4사02-02]는 오래된 물건과 자료가 과거를 알려주는 증거임을 이해하고, 이를 통해 역사가 증거를 바탕으로 구성된다는 것을 파악하는 데 중점을 둔다.\n나와 가족, 학교 등에서 일어난 중요한 일을 조사하여 시간의 흐름에 따라 배열하고 옛 기록이나 일기에서 시간 표현 용어를 찾아보는 등의 활동으로 역사의 시간 개념을 익힌다. 이러한 활동으로 나와 가족의 삶도 역사의 일부임을 자연스럽게 이해한다.\n학생의 애장품(장난감, 일기장 등), 주변에서 접할 수 있는 오래된 물건이나 건축물 등이 과거를 알려주는 중요한 자료로서 가치가 있음을 이해한다.\n과거를 알려주는 물건이나 자료 등을 활용하여 과거의 모습을 합리적으로 추론하며, 어떤 자료를 선택하였는지에 따라 과거에 대한 설명이 달라질 수 있음을 파악한다.\n주변 사람들의 증언과 사진, 영상, 문헌 등 자료를 활용해 지역의 변화상과 사람들의 달라진 생활 모습을 살펴본다.\n지역의 의미는 학생이 살고 있는 현재 행정구역 단위를 기본으로 하되 과거 사람들이 살았던 지역의 범위와 다르다는 점에 유의한다.\n학생이 적절한 자료를 활용하여 역사의 시간 개념, 과거를 보여주는 증거, 지역의 변화상과 달라진 사람들의 생활을 이해하였는지 평가한다."},"2022|사회|3~4학년|사회 변화와 다양한 문화|1":{"c":"일상생활에서 경험할 수 있는 사례 또는 통계 자료를 활용하여 저출산, 고령화, 지능정보화 같은 사회 변동으로 달라진 생활 모습을 학생이 주도적으로 분석하고 탐구하는 데 중점을 둔다.\n최근 우리 사회에서 증가하는 외국인 이주민 증가, 1인 가구와 비혼, 반려동물 양육 등 다양한 문화가 확산되면서 나타난 긍정적 효과와 사회문제를 각종 통계 자료, 언론 기사, 사진 등을 활용하여 학생이 탐구하고 분석하는 과정을 평가하는 데 중점을 둔다.\n우리 사회에서 다양한 문화가 확산되면서 나타나는 문제의 해결 방안을 토의하는 과정에서 나와 다른 사람이나 문화에 대한 편견과 차별적 태도를 해소하고, 다른 사람과 문화를 존중하는 태도를 형성하였는지를 평가한다."},"2022|사회|3~4학년|옛날과 오늘날의 생활 모습|1":{"c":"‘옛날’은 해당 시대에 맞게 설정하여 당시 사람들의 생활 모습을 맥락적으로 파악한다. 또 시대에 따른 사람들의 생활 모습은 다양한 양상으로 나타난다는 점을 이해하고, 현재의 시각만으로 과거를 평가하지 않도록 유의한다.\n변화가 발전만을 의미하지 않는다는 점을 이해하고 발전의 성과와 한계를 함께 살펴본다.\n도로, 철도, 항만, 공항, 교량 등 교통망의 구축으로 나타나는 생활공간의 확대를 중심으로 사람과 물자의 이동 및 달라진 생활 모습을 종합적으로 파악한다.\n여가 생활을 포함하여 학생의 일상생활 경험과 관련 있는 소재를 중심으로 교통의 발달이 생활 변화에 미친 영향을 파악한다.\n세대 간 의사소통 경험을 비교하면서 통신기술 발달에 따른 정보 교류와 의사소통 방식(시간과 빈도, 정보의 질과 양 등)이 달라졌음을 이해하고, 시⋅공간을 초월한 실시간 소통으로 나타난 생활 변화를 파악하는 데 초점을 둔다.\n교통수단과 통신수단의 발달 과정을 시간 순서대로 배열하는 등의 단순 지식을 평가하는 방법은 지양하고, 교통⋅통신의 변화가 생활에 미친 영향을 이해하고 있는지를 평가한다."},"2022|사회|3~4학년|지도로 만나는 우리 지역|1":{"c":"지도의 요소 파악은 지도에 대한 흥미와 지역 이해를 도모하려고 학생들이 거주하는 지역의 지도를 이용할 수 있으며, 상황에 따라 서책형 지도와 디지털 영상지도 등을 융통성 있게 이용한다. 특히 디지털 영상 지도의 축소 및 확대 기능을 이용하여 우리 지역을 살펴보면서 축척 개념도 자연스럽게 이해하도록 한다.\n[4사05-01]과 [4사05-02]에서의 우리 지역은 행정구역상 시⋅군⋅구 단위의 범위를 의미한다. [4사05-02]에서 우리 지역의 위치를 파악할 때는 시⋅도 단위의 행정구역 범위에서 위치를 찾아보고, 우리 지역과 연접한 지역(시⋅군⋅구)도 확인할 수 있다. 또한 전국 시⋅도 단위의 행정구역을 파악함으로써 [4사07-02]의 지역 간 교류 학습에서 다른 지역의 위치를 파악하는 데 도움이 되도록 한다.\n지역의 누리집, 통계, 지도, 지역에서 발간하는 홍보물 등 다양한 자료를 이용하여 지역의 지리 정보를 조사한다. 우리 지역의 특징을 이해하기 위해 우리 지역과 다른 지역을 비교하여 지역 간의 차이점이나 상호의존 관계를 파악하는 활동을 수행할 수 있다. 다만 지역 간의 우열을 가리거나 다른 지역에 대한 편견을 가지지 않도록 유의한다.\n지도의 요소 이해를 바탕으로 지도를 읽고 해석하는 활동에서 지도를 활용하는 능력을 평가할 수 있다. 이때, 축척 계산, 방위 기입, 기호 식별 등과 같은 지필평가는 지양한다."},"2022|사회|3~4학년|우리 지역의 문화유산|1":{"c":"문화유산의 의미와 특징을 역사적, 과학적, 심미적, 생태환경적 측면에서 파악한다.\n지역의 역사는 고유성을 지니며 지역에 따라 다양성을 드러낸다는 사실을 이해한다.\n지역의 박물관, 기념관, 유적지를 체험할 때 학생이 질문을 만들고 답을 찾아가는 과정을 경험하도록 한다. 전시물을 통해 옛날 사람들의 생활 모습을 재현하고 기억⋅기념하는 장소로서 박물관, 기념관, 유적지를 살펴본다."},"2022|사회|3~4학년|경제활동과 지역 간 교류|1":{"c":"일상적 사례를 통해 생산이나 소비 활동에서 선택의 문제가 발생하는 이유를 희소성 개념과 관련하여 파악하도록 하고, 실제 경제활동에서 합리적으로 선택하는 능력을 기르는 데 중점을 둔다.\n다양한 사례에서 생산과 소비 개념을 이해하고, 상품과 인적 교류의 사례를 통하여 지역의 경제활동이 다른 지역과 상호 의존 관계에 있다는 사실을 인식함으로써 지역 간 교류의 중요성을 깨닫게 하는 데 중점을 둔다.\n경제활동에서 합리적으로 선택하는 과정을 평가하고, 지역 간 경제활동의 상호 의존 관계를 파악함으로써 상호 협력의 중요성을 인식하는지를 평가한다."},"2022|사회|3~4학년|민주주의와 자치|1":{"c":"지방 자치 기관의 권한이나 역할 같은 어려운 내용을 다루기보다는 지역사회에서 민주주의가 실현되는 사례를 통하여 주민 자치와 주민 참여의 중요성을 인식하고, 지역사회의 문제 해결 과정에 적극 참여하는 시민 역량을 기르는 데 중점을 둔다.\n학교 자치 조례의 내용을 설명하기보다는 학교생활에서 이루어지는 학급회장 및 학생회장 선거, 학급 생활 규칙의 제⋅개정, 학생 행사의 주체적 운영처럼 학생이 학교생활과 관련된 의사 결정 및 운영에 참여하는 기회를 제공하도록 한다.\n학생이 학교의 주체로서 학교생활 속에서 민주주의를 실천하는 방안을 토론하는 과정 및 학교 자치 활동에 참여하는 과정을 평가하도록 한다."},"2022|사회|3~4학년|지역문제를 해결하고 지역을 알리는 노력|1":{"c":"학생이 경험할 수 있는 문제를 선정하고, 그 문제가 발생한 배경과 이유, 과정을 살펴보고 문제와 관련된 사실과 가치 부분을 구분하고 객관적인 자료와 근거에 의거해 문제를 합리적으로 해결하는 능력과 태도를 기르는 데 중점을 둔다.\n학생들이 문제 해결을 위해 관련 자료를 분석하고 토론하는 과정을 평가하고, 문제를 해결하기 위해 서로 협력하고 합리적인 해결 방안을 선택하는 능력과 태도를 형성하는 과정을 평가하도록 한다.\n지역의 자연환경, 역사, 문화, 생산물 등이 지역의 단순한 홍보나 자랑거리가 아닌, 지역을 깊이 이해하는 내용임을 알고 수업을 구성한다.\n역사와 관련 있는 축제, 문화 관광, 역사적 연원이 있는 생산물 등을 통해 지역의 역사를 어떻게 해석하여 활용하고 있는지를 오늘날 시각으로 파악한다.\n지역의 지리적 환경 이해를 바탕으로 지역의 관광, 축제, 생산물 등의 특성을 파악하고, 지역에 대한 관심을 가지도록 한다.\n지역사회의 노력을 조사할 때 지역의 누리집이나 사회 관계망 서비스(SNS), 소식지, 관광 안내 자료 등을 활용할 수 있다."},"2022|사회|3~4학년|다양한 환경과 삶의 모습|1":{"c":"환경의 이용과 개발로 촌락이었던 곳에도 도시적 요소가 나타나는 도시화의 과정에 중점을 두어 지역 변화를 살펴본다. 이때, 촌락과 도시를 이분법적으로 구분하는 것을 지양하며 촌락과 도시에 고정 관념이나 편견을 갖거나, 환경 결정론적 인식이 발생하지 않도록 주의한다.\n환경의 이용과 개발에 따른 변화를 다룰 때는 시간의 흐름에 따른 경관과 토지 이용의 변화를 나타낸 사진 등과 같은 시각 자료뿐 아니라 통계 자료, 보도 자료, 영상자료, 지도 등을 활용할 수 있다. 또한 이러한 변화에서 환경과 인간의 상호 작용을 탐색하고 생태시민으로서 환경 감수성을 지니도록 한다.\n산업과 기능에 따른 우리나라 여러 도시의 사례에서 도시의 경관뿐만 아니라 인구, 교통, 산업 등을 전반적으로 탐색하면서 도시에서의 삶을 이해하도록 한다. 이때 인간의 생활공간에 대한 이해를 도모하고 다양한 생활공간을 파악하는 데 주안점을 둔다."},"2022|사회|5~6학년|우리나라 국토 여행|1":{"c":"지역 간 경계나 지세에 영향을 주는 주요 산지, 하천의 분포를 파악하고, 해안선의 특징을 살펴본다. 이때, 각 지형을 자세히 다루기보다는 국토의 전체적인 특징을 파악하는 데 초점을 둔다.\n국토의 아름다움과 생태환경의 중요성을 느끼는 데 주안점을 두고 우리나라에서 유명한 지형과 관련 있는 관광지를 대상으로 답사 및 현장 체험 학습이나 가족 여행 설계하기 등과 같이 실제 생활과 관계 깊은 활동을 수행할 수 있다.\n국토의 지형 경관을 텍스트 중심의 자료보다는 주제도나 그래픽, 영상물 등의 구체적인 자료로 살펴보고, 국토지리정보원 누리집 내 각종 지도 자료, 디지털 영상지도, 국토 전체 및 지방별 백지도 등을 활용하도록 한다.\n독도의 위치를 지도에서 찾아보고, 주요 역사 기록들을 분석 및 해석하여 독도가 우리나라 영토임을 확인한다. 독도를 다루는 다양한 정보를 탐색하는 데 독도와 관련 있는 기관의 누리집을 활용할 수 있다. 이를 통해 영토 주권 의식을 기르고, 주변국과 영토 관련 주제를 다룰 때 합리적이고 능동적으로 적극 대처할 수 있는 태도를 기르도록 한다.\n지리적 차원에서 독도의 지형, 기후, 동식물 등에 대한 학습으로 독도의 아름다움을 감상할 수 있게 하며 소중한 국토로서 독도의 가치를 인식하도록 한다.\n한반도 전체의 지형적 윤곽과 특징을 파악하면서 우리나라 국토의 특징을 이해하는 데 중점을 두며, 개별 산맥과 하천의 이름을 암기하는 등의 지필평가는 지양한다."},"2022|사회|5~6학년|우리나라 지리 탐구|1":{"c":"기온과 강수량을 나타낸 기후 그래프에서 우리나라의 계절별 기후 특징을 탐구하며, 최근의 기후변화 현황과 원인을 파악한다. 단, 초등학교에서는 지역별 기후 특징으로까지 학습 범위를 확대하지 않는다.\n기후변화 대응에 관심을 가지며, 기후변화로 심화하는 자연재해에 대비하기 위한 안전 수칙 준수의 생활화가 이루어지도록 한다. 이때 기후변화와 재해로 인한 피해 중 일부는 인간 행위의 결과일 수 있음을 인식하도록 한다.\n기후변화 및 자연재해 관련 자료는 미디어 등에서 시의적절하게 선별하되, 자료의 신뢰성을 고려하여 기상청 누리집에서 기상 특보의 종류와 발표 기준, 기후 관련 통계 자료와 그래프, 위성사진 등을 활용할 수 있다.\n우리나라 인구 분포를 파악하는 데 필요한 자료로 통계청 누리집의 자료를 활용하며, 수도권 지역 인구 유입 및 연령별 인구 구조를 파악한다.\n우리나라의 기후와 인구에 대한 사실적 지식 습득 관련 평가는 지양하고, 지도나 그래프 등의 자료를 토대로 사실 정보 파악하기, 두 가지 사실 정보 사이의 관계(일반화) 도출하기, 두 가지 사실 정보 외의 다른 사실 정보를 추가하여 관계 확장하기 등의 활동으로 학생의 탐구 과정을 평가하는 데 중점을 둔다."},"2022|사회|5~6학년|법과 인권의 보장|1":{"c":"학생이 경험하는 일상 사례를 통하여 법이 우리의 행동과 삶에 미치는 영향력을 이해하고, 권리 보장과 사회 질서 유지 같은 법의 역할을 인식함으로써 준법 태도를 형성하는 데 중점을 둔다.\n헌법에 규정된 기본적 인권의 개념과 조항을 나열하지 않고 자유, 평등, 정치 참여, 사회 복지 등 실제 생활에서 보장되는 인권의 사례들을 조사하여 인권 보장이 인간다운 삶을 위해 중요하다는 사실을 인식하도록 한다. 또한 나와 타인의 인권을 존중하고 보호하는 인권 의식을 함양하는 데 초점을 맞춘다.\n최근 우리 사회에서 발생하는 인권 침해 사례를 제시하고, 토론을 통해 문제를 해결하는 능력을 함양한다. 또한 인권을 존중하고 보호하는 활동에 참여하는 기회를 제공함으로써 인권 친화적 태도를 함양하는 데 중점을 둔다.\n인권 침해 문제의 해결 방안을 토의하는 과정에서 자신의 주장을 뒷받침하기 위한 합리적 근거, 이유, 사례 등을 제시하는지 평가하고, 인권 친화적 태도를 형성하였는지 평가한다."},"2022|사회|5~6학년|유적과 유물로 살펴본 옛 사람들의 생활|1":{"c":"유적과 유물, 역사 기록을 활용한 탐구 과정을 경험하며 당시 사회 모습과 사람들의 생활 모습을 파악하는 데 중점을 둔다.\n학생들이 역사 지식에 대해 질문을 하고 답을 찾아가는 과정을 경험하도록 학습 주제에 따라 적절한 역사 탐구 방법을 안내한다. 이 과정에서 역사적 관점에 따라 당시 모습을 다르게 해석할 수 있음을 파악하도록 한다.\n종교, 성별, 신분, 교류 등과 관련 있는 자료를 탐구하며 당시 사회 모습과 사람들의 생활을 시대적 맥락에 맞게 파악하는지 평가한다."},"2022|사회|5~6학년|달라지는 시대, 변화하는 생활 모습|1":{"c":"[6사05-01]은 조선 전기부터 조선 후기까지 유교 문화가 조선 사회에 미친 영향을 파악하는 데 중점을 둔다.\n유교 문화, 조선 후기 사회⋅문화적 변화 및 개항기 근대 문물 수용 과정과 관련 있는 내용 중에서 당시 사람들의 생각과 생활을 보여주는 주제를 선택하여 살펴본다.\n조선 후기 사회⋅문화적 변화와 근대 문물의 수용 과정에서 사람들의 생각과 생활이 변화되었음을 다양한 자료를 통해 파악한다.\n유교 문화가 조선 시대 사람들의 생각과 생활에 미친 영향과 조선 후기 사회⋅문화적 변화 및 근대 문물 수용 과정에서 달라진 생활 모습을 설명할 수 있는지 평가한다."},"2022|사회|5~6학년|식민 통치와 저항, 전쟁이 바꾼 사회와 생활|1":{"c":"일제에 저항한 사건들을 시간 순서대로 나열하여 다루기보다, 구체적인 사례로 당시 사회와 사람들의 생활을 깊이 있게 탐구하는 데 중점을 둔다.\n일제가 식민 통치에 근대 문물을 어떻게 활용하였는지 살펴봄으로써 식민 통치라는 제약 속에서 근대 문물이 어떻게 해석⋅변형되었는지 알아본다.\n6⋅25 전쟁을 학습할 때 전쟁의 원인 등 당시 상황을 파악할 수 있는 사진이나 영상, 기록 등 학생 수준에 적절한 자료를 선정하여 살펴본다.\n8⋅15 광복부터 6⋅25 전쟁에 이르는 역사 사건들을 연대기 순서대로 나열하여 다루기보다 광복과 전쟁이 당시 사회와 생활에 미친 영향을 탐색하는 데 중점을 두고 이를 평가한다."},"2022|사회|5~6학년|평화 통일을 위한 노력, 민주화와 산업화|1":{"c":"전쟁과 관련 있는 장소 및 기념관, 박물관 등을 온오프라인으로 방문하여 전시물을 분석하고, 전쟁으로 인한 인권 유린 및 생태환경의 파괴, 분단으로 발생한 사회문제 등을 이해한다.\n여러 역사 주체(성별, 연령, 계층 등)의 경험을 바탕으로 사회 전반에 걸쳐 진행된 민주화와 산업화를 파악한다.\n산업화와 관련 있는 사람들의 생활 모습을 다룰 때는 산업화의 성과와 한계점을 함께 살펴본다.\n평화 통일을 위한 노력, 민주화, 산업화와 관련 내용은 사회 참여나 실천을 포함하여 다양한 방식으로 평가한다."},"2022|사회|5~6학년|민주주의와 시민 참여|1":{"c":"국회의원, 대통령 선거 같은 사례에서 시민이 직접 주권을 행사하는 선거의 중요성을 인식하고 선거 과정에 능동적으로 참여하는 태도를 형성하는 데 중점을 둔다.\n국회, 행정부, 법원의 권한을 나열하기보다는 사례를 통해 국가기관이 시민의 권리 보장과 공익의 실현을 위해 하는 일을 파악하고, 권력 분립을 위반한 사례를 통해 민주주의에서 국가기관 간 상호 견제와 균형을 이루게 하는 이유와 중요성을 인식하는 데 초점을 맞춘다.\n전통적인 언론과 소셜 미디어를 포함하여 여러 가지 미디어에서 찾을 수 있는 거짓 또는 왜곡된 정보나 내용(소위 가짜 뉴스, 허위 사실 유포 등)에서 학생들이 누가 무엇을 어떻게 왜곡, 과장, 생략 등을 했는지 비판적으로 분석하는 활동을 통해 미디어에 대한 비판적 사고력을 기르도록 한다. 이런 활동에서 학생이 미디어의 내용을 비판적으로 받아들이고 올바르게 이용하는 능력과 태도를 함양하는 데 중점을 둔다.\n민주주의의 의미와 특성에 기초하여 선거의 중요성을 인식하고 선거에 적극 참여하는 태도가 형성되었는지 평가하도록 한다.\n학생이 객관적인 근거를 바탕으로 미디어의 내용을 비판적으로 분석하였는지 평가하고, 미디어를 올바르게 이용하는 태도가 형성되는지를 평가하도록 한다."},"2022|사회|5~6학년|지구, 대륙 그리고 국가들|1":{"c":"디지털 공간 영상 정보를 활용하여 세계지도(평면)와 지구본(입체)의 차이를 이해함으로써 세계에 대한 인식의 왜곡을 줄이도록 유의한다. 대륙과 대양 및 여러 국가의 영토 특징을 파악할 때 평면적 공간 도구뿐 아니라 입체적 공간 도구를 활용하도록 한다.\n세계지리 학습에서는 세계에 대한 지식 이외에도 도해력을 포함한 다양한 지리적 기능(지구본에서 경도와 위도 특성 알아내기, 세계 백지도 완성하기, 지도 퍼즐 맞추기 등)의 학습 기회를 제공한다.\n위도와 경도를 이해하기 위해 사례를 중심으로 탐구한다. 경도와 관련하여 단순히 시차 계산보다는 대중매체, 문학작품, 여행 경험 등 생활 주변 소재를 중심으로 시차의 의미를 파악하며, 표준경선의 역할, 시차를 이용한 지역 간 교류 등을 논의할 수 있다. 위도별 기후 분포는 [6사10-02]에서 본격적으로 학습하고, 여기서는 위도(저위도, 고위도, 중위도)에 따른 일사량의 차이(밤낮의 길이), 북반구와 남반구의 계절 차이 정도를 파악하도록 한다.\n세계 여러 나라 중에서 국제적인 위상, 우리나라와의 관계 등을 고려하여 우리나라와 정치⋅경제⋅문화면에서 밀접한 관계를 맺고 있는 국가들을 사례로 선정할 수 있으며, 그 국가들의 위치와 영토를 파악하여 기초적인 지리 정보를 이해하도록 한다.\n생소한 지명들을 열거하고 이를 암기하기보다는 세계의 대륙과 대양, 여러 국가 등을 다양한 공간 도구를 통해 파악하도록 하며, 이를 통해 다양한 지도 읽기, 위치 표현 방법 등의 도해력을 평가할 수 있다."},"2022|사회|5~6학년|세계의 자연환경|1":{"c":"광활하고 경이로운 지형 경관이 나타나는 사례 지역을 중심으로 관광산업의 발달과 이에 따른 긍정적⋅부정적 영향을 균형적 시각으로 학습하도록 유의한다.\n세계적으로 유명하거나 학생이 가보고 싶은 지형 경관 학습을 위해 텍스트 자료뿐만 아니라 지도나 시청각 자료(사진, 영상 등)의 활용도를 높임으로써 직접 경험하지 않은 곳에 대한 감각을 기를 수 있도록 한다.\n학생들의 사고력 수준을 고려하여 기후 지역을 지나치게 세분하여 가르치지 않도록 주의한다. 기후 지역은 1차적으로 열대, 건조, 온대, 냉대, 한대, 고산 기후로 구분할 수 있다. 다만, 강수 패턴의 다양성으로 세분하는 열대 기후와 온대 기후는 각각 열대 우림, 열대 사바나와 서안 해양성, 지중해성 기후를 추가로 제시할 수 있다.\n각종 이미지를 활용하여 기후 지역별 특징 표현하기, 기후 지역별 전형적인 경관 사진을 적도에서 극지방 순서로 배열하기 등의 활동으로 기후에 대한 이해를 평가할 수 있다.\n사람들의 생활양식을 기후 조건과 연결 지어 생각함으로써, 우리와 다른 기후 환경에 적응하고, 이를 극복하면서 살아가는 사람들의 다양한 생활양식을 이해하는 데 중점을 둔다. 또한, 같은 기후 환경에서도 다양한 인간의 삶이 있다는 것을 파악하여 인간과 자연과의 관계를 다각적으로 인식하도록 한다."},"2022|사회|5~6학년|시장경제와 국가 간 거래|1":{"c":"사례를 통해 시장경제에서 가계와 기업의 자유로운 경제활동이 상호 관계를 맺고 서로 영향을 주고받는다는 사실을 파악한다. 이에 기초해 공정한 시장과 지속가능한 발전을 위해서 근로자의 권리를 보호하고 기업이 자유로운 경제활동 및 사회적 책임(ESG 등)을 이행하는 것의 중요성을 인식하는 데 초점을 맞춘다.\n통계 자료를 활용하여 경제성장이 우리 생활에 가져온 긍정적⋅부정적 영향을 파악한다. 또한 토론을 통해 저임금과 노사 갈등, 불평등과 빈부격차의 심화, 과소비와 자원 낭비 같은 경제문제의 해결 방안을 정부, 기업, 시민단체, 개인 등 여러 차원에서 찾는 능력을 기르는 데 중점을 둔다.\n세계화 시대에 무역의 중요성을 파악하고, 무역 관련 통계 자료나 시사 자료를 활용하여 세계 여러 나라가 무역을 통해 경쟁 및 상호 의존 관계에 있음을 파악하는 데 초점을 맞춘다.\n우리나라의 빠른 경제성장 과정에서 발생한 문제의 해결 방안을 토론하는 과정에서 객관적 자료와 근거를 바탕으로 합리적인 해결 방안을 제시하는 능력과 상대방의 주장을 경청하는 태도 등을 평가한다."},"2022|사회|5~6학년|지구촌 사람들|1":{"c":"세계의 인구 분포 특징을 알아보고, 인구 분포와 자연 및 인문환경 간의 관계를 탐구한다. 인구 성장, 인구수, 인구 밀도, 인구 구조 등과 같은 주제를 선정하여 세계의 인구 특징을 파악하는 활동을 수행할 수 있다.\n세계 여러 나라 중에서 인구수와 인구 밀도를 고려하여 인구수가 많은 나라와 적은 나라 및 인구 밀도가 높은 나라와 낮은 나라를 사례로 인구 특징을 탐색할 수 있으며, 이 과정에서 특정 국가에 대한 편견을 가지지 않도록 유의한다.\n지구촌 차원에서 공동으로 대응하여 해결해야 할 문제(자원 및 에너지 문제, 기후변화 문제, 생태계 파괴 문제, 난민 문제 등)의 원인과 현황을 조사함으로써 비판적 사고력을 기르고 지구촌 갈등 사례를 해결하려고 노력하는 개인, 국가, 국제기구, 비정부 기구 등 다양한 행위 주체들의 활동 실천 사례를 조사함으로써 지구촌의 평화와 발전에 기여할 수 있는 태도를 함양하도록 한다.\n세계 여러 지역의 인구 분포와 특징을 도출하는 데 다양한 지도 및 통계 자료를 활용할 수 있으며 이러한 자료를 수집하고 분석하는 능력을 평가할 수 있다."},"2022|수학|1~2학년|수와 연산|1":{"c":"‘수와 연산’ 영역에서는 용어와 기호로 ‘덧셈, 뺄셈, 곱셈, 짝수, 홀수, +, -, ×, =, >, <’를 다룬다.\n자연수가 개수, 순서, 이름 등을 나타내는 경우가 있음을 알고, 실생활에서 수가 사용되는 사례를 통하여 네 자리 이하의 수의 필요성을 인식하게 한다.\n두 자리 수를 10개씩 묶음과 낱개로 나타내게 함으로써 위치적 기수법의 기초 개념을 형성하게 한다.\n저학년 학생들의 한글 학습 정도를 고려하여 수를 ‘여덟’, ‘마흔아홉’, ‘칠십육’, ‘첫째’ 등과 같이 한글로 쓰게 하는 것은 지양한다.\n수 세기가 필요한 장면에서 묶어 세기, 뛰어 세기의 방법으로 수를 세어 보게 한다.\n짝수와 홀수는 20 이하의 수의 범위에서 다루고, 실생활 상황에서 둘씩 묶어 보는 활동을 통하여 짝수와 홀수를 직관적으로 이해하게 한다.\n십의 자리 수가 0인 세 자리 수, 백의 자리 수나 십의 자리 수가 0인 네 자리 수를 활용하여 자릿값을 이해하게 할 수 있다.\n수를 분해하고 합성하는 활동은 20 이하의 수의 범위에서 한다.\n‘∼보다 ∼만큼 더 큰 수’, ‘∼보다 ∼만큼 더 작은 수’, ‘더한다’, ‘합한다’, ‘뺀다’, ‘덜어 낸다’, ‘합’, ‘차’ 등의 일상용어를 사용하여 덧셈과 뺄셈의 의미에 친숙하게 한다.\n한 자리 수인 두 수를 바꾸어 더해 보고 그 결과를 비교하는 활동을 통하여 덧셈의 교환법칙을 직관적으로 이해하게 한다.\n덧셈과 뺄셈을 여러 가지 방법으로 계산하는 활동을 통하여 연산 감각을 기르게 하되, 이를 지나치게 형식화하여 다루지 않는다.\n학생들에게 친근한 실생활 상황을 이용하여 덧셈과 뺄셈에 관련된 문제를 만들고 해결하게 한다.\n덧셈식, 뺄셈식, 곱셈식에서 등호(=)의 양쪽에 있는 양이 서로 같음을 이해하게 한다.\n한 가지 상황을 간단한 덧셈식과 뺄셈식으로 나타내는 활동을 통하여 덧셈과 뺄셈의 관계를 이해하게 한다.\n세 수의 덧셈에서는 세 수를 앞에서부터 순서대로 더한 결과와 합이 10이 되는 두 수를 먼저 더하고 나머지 수를 더한 결과를 비교하는 활동을 통하여 덧셈의 결합법칙을 직관적으로 이해하게 한다.\n□가 사용된 덧셈식과 뺄셈식은 □의 값을 직관적으로 구할 수 있는 수준으로 다룬다.\n곱셈의 의미는 배의 개념과 동수누가를 통하여 다루고, 1의 곱과 0의 곱은 실생활과 관련지어 다룬다.\n곱셈표를 이용해서 두 수를 바꾸어 곱해도 곱이 같음을 비교하는 활동을 통하여 곱셈의 교환법칙을 직관적으로 이해하게 한다.\n‘수와 연산’ 영역의 문제 상황에 적합한 문제해결 전략을 지도하여 문제해결 역량을 기르게 한다."},"2022|수학|1~2학년|변화와 관계|1":{"c":"학생이 스스로 만든 규칙에 따라 물체, 무늬, 수 등을 배열하는 활동을 통해 수학에 대한 흥미를 느끼게 할 수 있다.\n수의 배열뿐만 아니라 수 배열표, 덧셈표, 곱셈표를 활용하여 수의 다양한 규칙을 찾게 한다.\n물체, 무늬, 수 등의 배열에서는 크기, 색깔, 위치, 순서 등에 대한 단순한 규칙을 다루고, 지나치게 복잡한 배열에 대한 평가는 지양한다.\n다른 사람의 배열에서 규칙을 찾아보거나 규칙에 대해 서로 말하게 한다.\n‘변화와 관계’ 영역의 문제 상황에 적합한 문제해결 전략을 지도하여 문제해결 역량을 기르게 한다."},"2022|수학|1~2학년|도형과 측정|1":{"c":"‘도형과 측정’ 영역에서는 용어와 기호로 ‘삼각형, 사각형, 원, 꼭짓점, 변, 시, 분, 약, cm, m’를 다룬다.\n입체도형과 평면도형의 모양을 다룰 때 모양의 특징을 직관적으로 파악하여 모양을 분류하고, 분류한 모양을 지칭하기 위해 일상용어를 사용하게 할 수 있다.\n입체도형과 평면도형의 모양을 이용한 모양 만들기의 주제는 학생들에게 친근한 소재인 동물, 탈 것, 건물 등으로 다양하게 제시하여 수학에 대한 흥미와 관심을 갖게 한다.\n쌓기나무, 칠교판 등의 구체물을 이용한 모양 만들기를 통하여 도형에 대한 공간 감각을 기르게 한다.\n양의 비교는 학생들에게 친근한 실생활 상황을 이용하고, 직관적인 비교, 직접 비교, 간접 비교 등을 상황에 따라 알맞게 다룬다.\n저학년 학생들의 한글 학습 정도를 고려하여 양을 비교할 때 ‘짧다’, ‘많다’, ‘넓다’ 등과 같이 한글로 쓰게 하는 것은 지양한다.\n학생들이 모형 시계를 조작하여 ‘몇 시’, ‘몇 시 30분’, ‘몇 시 몇 분’, ‘몇 시 몇 분 전’ 등의 시각을 읽게 한다.\n‘몇 시 몇 분 전’의 시각 읽기에서 5분 전, 10분 전과 같이 간단한 경우를 다루고, 13분 전과 같이 복잡한 경우는 다루지 않는다.\n시간의 여러 가지 단위를 지도할 때는 단위 사이의 관계를 이해하는 데 중점을 두고, 지나친 단위 환산은 다루지 않는다.\n1일, 1주일, 1개월, 1년 사이의 관계를 지도할 때는 실생활 상황에서 달력을 이용하여 그 관계를 이해하게 한다.\n구체물의 길이를 재는 과정에서 자의 눈금과 일치하지 않는 길이의 측정값을 ‘약’으로 표현할 수 있음을 알게 한다.\n‘도형과 측정’ 영역의 문제 상황에 적합한 문제해결 전략을 지도하여 문제해결 역량을 기르게 한다."},"2022|수학|1~2학년|자료와 가능성|1":{"c":"‘자료와 가능성’ 영역에서는 용어와 기호로 ‘표, 그래프’를 다룬다.\n분류하기에서는 학생들이 실생활에서 친근하게 느낄 수 있는 소재를 활용한다.\n기준을 정하여 분류할 때는 학생들이 정한 다양한 기준을 존중하되, 분명하지 않은 기준으로는 분류하기가 어렵다는 점을 인식하게 한다.\n자료를 분류하여 표나 그래프를 만들 때는 자료가 중복되거나 빠지지 않도록 세어 보는 방법을 함께 지도한다.\n표와 그래프로 나타내기는 실생활이나 환경과 관련된 자료들을 활용하되, 학생들의 수준에 비해 어려운 분류 대상이나 분류 기준을 사용하지 않는다.\n‘자료와 가능성’ 영역의 문제 상황에 적합한 문제해결 전략을 지도하여 문제해결 역량을 기르게 한다."},"2022|수학|3~4학년|수와 연산|1":{"c":"‘수와 연산’ 영역에서는 용어와 기호로 ‘나눗셈, 몫, 나머지, 나누어떨어진다, 분수, 분모, 분자, 단위분수, 진분수, 가분수, 대분수, 자연수, 소수, 소수점(.), ÷ ’를 다룬다.\n뉴스, 광고 등 여러 가지 매체를 활용해 자료를 조사하는 활동을 통하여 실생활에서 다섯 자리 이상의 큰 수가 쓰이는 경우를 찾아보게 한다. 조사한 결과를 바탕으로 큰 수와 관련하여 이야기하는 활동을 통하여 큰 수에 대한 필요성을 인식하고 양감을 기르게 한다.\n한 가지 상황을 곱셈식과 나눗셈식으로 나타내는 활동을 통하여 곱셈과 나눗셈의 관계를 이해하게 한다.\n나눗셈에 대한 검산에서는 나눗셈식을 보고 곱셈식으로 나타내는 것보다 검산의 목적과 필요성을 이해하는 데 초점을 둔다.\n자연수의 덧셈, 뺄셈, 곱셈, 나눗셈을 하기 전에 계산 결과를 어림하기, 어림한 값을 이용하여 계산 결과가 타당한지 확인하기, 어림셈이 필요한 실생활 상황의 문제를 해결하기 등을 다룰 수 있다.\n친근한 실생활 상황을 이용하여 자연수의 덧셈, 뺄셈, 곱셈, 나눗셈에 관련된 문제를 만들어 해결하게 하고, 사칙계산의 유용성을 인식하게 한다.\n실생활에서 소수를 활용한 사례를 통해 소수의 필요성을 인식하게 한다.\n소수의 덧셈과 뺄셈은 계산 원리를 이해할 수 있는 수준에서 간단히 다룬다.\n계산 기능을 숙달하는 것이 목적이 아닌 경우에는 계산기를 사용하게 할 수 있다.\n‘수와 연산’ 영역의 문제 상황에 적합한 문제해결 전략을 지도하고, 문제해결 과정을 설명하게 하여 문제해결 역량을 기르게 한다.\n‘수와 연산’ 영역에서 문제해결 과정을 설명할 때 다른 친구의 의견을 존중하고 경청하는 태도로 참여하게 한다."},"2022|수학|3~4학년|변화와 관계|1":{"c":"규칙을 식으로 나타낼 때 혼합 계산식, 일반항을 나타낸 식 등을 이용해야 하는 복잡한 문제는 다루지 않는다.\n계산식의 배열에서 계산 결과의 규칙을 찾는 활동을 할 때 필요에 따라 계산기를 사용하게 할 수 있다.\n자신이 추측한 규칙을 배열에 적용해 보는 등 다양한 방법으로 규칙이 옳은지 스스로 검토하게 할 수 있다.\n동치 관계는 두 자리 수의 범위에서 다룬다.\n등호가 사용된 식이 옳은지 판단할 때는 수 감각이나 학생이 직관적으로 이해하고 있는 연산의 성질을 이용하여 두 양이 서로 같은지 비교하게 할 수 있다.\n‘변화와 관계’ 영역의 문제 상황에 적합한 문제해결 전략을 지도하고, 문제해결 과정을 설명하게 하여 문제해결 역량을 기르게 한다.\n‘변화와 관계’ 영역에서 문제해결 과정을 설명할 때 다른 친구의 의견을 존중하고 경청하는 태도로 참여하게 한다."},"2022|수학|3~4학년|도형과 측정|1":{"c":"‘도형과 측정’ 영역에서는 용어와 기호로 ‘직선, 선분, 반직선, 각, (각의) 꼭짓점, (각의) 변, 직각, 예각, 둔각, 수직, 수선, 평행, 평행선, 원의 중심, 반지름, 지름, 이등변삼각형, 정삼각형, 직각삼각형, 예각삼각형, 둔각삼각형, 직사각형, 정사각형, 사다리꼴, 평행사변형, 마름모, 다각형, 정다각형, 대각선, 초, 도(°), mm, km, L, mL, g, kg, t’을 다룬다.\n직선, 선분, 반직선에 대한 평가에서는 정확한 정의나 표현보다 직선, 선분, 반직선을 서로 구별할 수 있는지에 중점을 둔다.\n평면도형의 이동에서 돌리고 뒤집기나 뒤집고 돌리기 등 복잡한 변화를 지양한다.\n평면도형의 이동을 활용하여 모양의 변화나 무늬를 설명하게 할 때 설명 방법이 다양할 수 있음에 유의하여 다른 친구들의 설명을 비판적으로 검토하게 한다.\n평면도형의 이동, 원 그리기 등을 이용하여 여러 가지 모양이나 무늬 만들기 활동을 통해 수학의 아름다움을 느끼게 할 수 있다.\n삼각형의 성질을 탐구하는 활동에서 구체적인 관찰, 실험, 측정 등 귀납적 추론을 통해 성질을 이해하게 한다.\n여러 가지 사각형의 성질은 구체적인 조작 활동을 통하여 간단한 것만 다루고, 여러 가지 사각형 사이의 관계는 다루지 않는다.\n시각과 시간의 의미는 구체적인 상황 속에서 구별하여 사용할 수 있는 정도로 이해하게 한다.\n실제로 재거나 어림하는 측정 활동을 통하여 시간, 길이, 들이, 무게, 각도에 대한 양감을 기르게 한다.\n들이, 무게의 표준 단위를 도입하기 전에 표준 단위의 필요성을 알게 한다.\n시간, 길이, 들이, 무게의 단위를 지도할 때 단위 사이의 관계를 이해하는 데 중점을 두고, 1km와 1cm의 관계, 1t과 1g의 관계 등의 지나친 단위 환산은 다루지 않는다.\n길이, 들이, 무게, 각도를 측정할 때 측정도구의 눈금에 일치하지 않는 측정값을 ‘약’으로 표현하게 한다.\n‘도형과 측정’ 영역의 문제 상황에 적합한 문제해결 전략을 지도하고, 문제해결 과정을 설명하게 하여 문제해결 역량을 기르게 한다.\n‘도형과 측정’ 영역에서 문제해결 과정을 설명할 때 다른 친구의 의견을 존중하고 경청하는 태도로 참여하게 한다."},"2022|수학|3~4학년|자료와 가능성|1":{"c":"‘자료와 가능성’ 영역에서는 용어와 기호로 ‘그림그래프, 막대그래프, 꺾은선그래프’를 다룬다.\n문제 상황에 맞게 간단한 설문조사, 실험과 관찰, 공공 자료의 활용 등을 통해 자료를 직접 수집하게 한다.\n그림그래프를 그릴 때 항목의 이름과 수량의 단위를 명확히 인식하고, 자료의 개수에 따라 그림이 나타내는 단위를 적절히 선택하게 한다.\n막대그래프와 꺾은선그래프를 그릴 때는 가로축과 세로축이 각각 무엇을 나타내는지 확인하게 하고 눈금 한 칸이 나타내는 크기를 적절히 선택하게 한다.\n막대그래프와 꺾은선그래프를 그릴 때 공학 도구를 사용하게 할 수 있다.\n여러 가지 사회, 환경 문제를 탐구하는 데 그림그래프, 막대그래프, 꺾은선그래프로부터 얻은 정보를 활용하게 할 수 있다.\n자료 수집의 목적과 수집한 자료의 특성에 맞는 그래프로 적절히 표현되었는지를 비판적으로 판단하게 할 수 있다.\n‘자료와 가능성’ 영역의 문제 상황에 적합한 문제해결 전략을 지도하고, 문제해결 과정을 설명하게 하여 문제해결 역량을 기르게 한다.\n‘자료와 가능성’ 영역에서 문제해결 과정을 설명할 때 다른 친구의 의견을 존중하고 경청하는 태도로 참여하게 한다."},"2022|수학|5~6학년|수와 연산|1":{"c":"‘수와 연산’ 영역에서는 용어와 기호로 ‘이상, 이하, 초과, 미만, 올림, 버림, 반올림, 약수, 공약수, 최대공약수, 배수, 공배수, 최소공배수, 약분, 통분, 기약분수’를 다룬다.\n자연수의 혼합 계산은 계산 순서에 중점을 두고, 지나치게 복잡한 혼합 계산은 다루지 않는다.\n수의 범위와 올림, 버림, 반올림은 측정 상황과 같이 수나 양의 어림이 필요한 여러 가지 실생활 사례를 통하여 그 의미를 알게 한다.\n약수와 배수는 실생활에서 활용되는 경우를 찾아 자연수 범위에서 다룬다.\n약수와 배수를 학습하는 과정에서 약수와 배수의 관계를 이해하게 한다.\n최대공약수와 최소공배수는 두 수에 대하여 약수와 배수를 각각 나열하여 공통된 약수와 배수를 찾는 방법으로 그 의미를 이해하게 하고, 평가에서 소인수의 곱으로 나타내어 구하는 방법은 다루지 않는다.\n구체물이나 그림 등을 이용하여 크기가 같은 분수를 만든 후 분모는 분모끼리, 분자는 분자끼리 비교하는 활동을 통해 크기가 같은 분수를 만드는 방법을 이해하게 한다.\n분모가 다른 분수의 크기를 비교할 때 수 감각을 이용하여 추론하고 토론하는 활동을 하게 한다.\n분수의 사칙계산에서 기약분수로 나타낼 것을 요구하지 않을 경우, 계산 결과를 기약분수가 아닌 분수로 나타내는 것도 허용한다.\n분수를 통분할 때는 공통분모로 최소공배수뿐만 아니라 분모의 곱과 같은 공배수도 이용하게 할 수 있다.\n분수의 곱셈과 나눗셈, 소수의 곱셈과 나눗셈은 계산 원리를 탐구하여 이해하는 수준에서 다룬다.\n소수의 곱셈과 나눗셈에서 복잡한 계산은 계산기를 사용하게 할 수 있다.\n소수의 곱셈과 나눗셈에서 계산 결과를 어림할 필요가 있는 상황, 정확한 계산 대신에 어림셈으로 비교가 가능한 상황 등 어림셈이 필요한 여러 가지 실생활 상황을 제시하여 어림셈의 필요성과 유용성을 알게 한다.\n‘수와 연산’ 영역의 문제 상황에서 문제해결 전략 비교하기, 주어진 문제에서 필요 없는 정보나 부족한 정보 찾기, 조건을 바꾸어 새로운 문제 만들기, 문제해결 과정의 타당성 검토하기 등을 통하여 문제해결 역량을 기르게 한다.\n‘수와 연산’ 영역에서 자신의 문제해결 과정을 논리적으로 설명하고 다른 친구의 문제해결 과정과 비교함으로써 비판적으로 사고하는 태도를 기르게 한다."},"2022|수학|5~6학년|변화와 관계|1":{"c":"‘변화와 관계’ 영역에서는 용어와 기호로 ‘비, 기준량, 비교하는 양, 비율, 백분율, 비례식, 비례배분,:,%’를 다룬다.\n대응 관계를 탐구할 때는 두 양의 변화를 함께 고려하게 하고, 한 양의 변화에만 초점을 두지 않는다.\n두 양 사이의 대응 관계를 식으로 나타내는 방법을 지도하는 활동에서는 덧셈식, 뺄셈식, 곱셈식, 나눗셈식 중 하나로 표현되는 간단한 경우만 다룬다.\n비와 비율을 다룰 때는 기준량과 비교하는 양을 명확하게 인식하게 한다.\n비와 비율을 탐구할 때는 실생활 및 타 교과에서 비와 비율이 적용되는 간단한 사례를 활용하며 수학의 유용성을 인식하게 한다.\n동일한 비율을 분수, 소수, 백분율로 다양하게 나타낼 수 있음을 알게 한다.\n대응 관계를 기호를 사용하여 식으로 나타내고 두 양의 관계를 비로 나타내 보는 경험을 통해 수학적 표현의 편리함을 인식하게 할 수 있다.\n‘변화와 관계’ 영역에서는 기후변화, 생태계, 과학 기술의 발전 등 학생의 삶과 관련된 다양한 문제 상황을 활용할 수 있다.\n‘변화와 관계’ 영역의 문제 상황에서 문제해결 전략 비교하기, 주어진 문제에서 필요 없는 정보나 부족한 정보 찾기, 조건을 바꾸어 새로운 문제 만들기, 문제해결 과정의 타당성 검토하기 등을 통하여 문제해결 역량을 기르게 한다.\n‘변화와 관계’ 영역에서 자신의 문제해결 과정을 논리적으로 설명하고 다른 친구의 문제해결 과정과 비교함으로써 비판적으로 사고하는 태도를 기르게 한다."},"2022|수학|5~6학년|도형과 측정|1":{"c":"‘도형과 측정’ 영역에서는 용어와 기호로 ‘합동, 대칭, 대응점, 대응변, 대응각, 선대칭도형, 점대칭도형, 대칭축, 대칭의 중심, 직육면체, 정육면체, 면, 모서리, 밑면, 옆면, 겨냥도, 전개도, 각기둥, 각뿔, 원기둥, 원뿔, 구, 모선, 가로, 세로, 밑변, 높이, 원주, 원주율, cm², m², km², cm³, m³’를 다룬다.\n선대칭도형과 점대칭도형 그리기를 평가할 때 모눈종이, 점판, 공학 도구 등을 이용하여 쉽게 그릴 수 있게 한다.\n무늬 찾기, 종이 겹쳐 오리기, 도장 찍기, 데칼코마니 등 구체적인 조작 활동을 통하여 도형의 합동의 의미를 알게 한다.\n실생활이나 자연 환경 등에서 도형의 합동, 선대칭도형, 점대칭도형의 예를 찾고 수학의 아름다움을 느낄 수 있게 한다.\n입체도형의 전개도에 대한 평가는 전개도가 될 수 있는 것과 될 수 없는 것을 구별하는 데 중점을 둔다.\n각기둥의 전개도는 간단한 형태만 다루고, 각뿔과 원뿔의 전개도는 다루지 않는다.\n한 직선을 중심으로 직사각형, 직각삼각형, 반원을 돌리는 활동을 통하여 원기둥, 원뿔, 구를 만들어 보게 한다.\n실생활에서 접할 수 있는 여러 가지 물건, 건축물 등에서 직육면체, 정육면체, 각기둥, 각뿔, 원기둥, 원뿔, 구를 찾고 수학에 대한 흥미와 관심을 갖게 한다.\n입체도형의 구성 요소와 성질, 전개도, 쌓기나무로 만든 입체도형을 탐구할 때는 여러 가지 모형과 공학 도구를 이용하게 할 수 있다.\n쌓기나무로 만든 입체도형의 위, 앞, 옆에서 본 모양에 대한 평가를 할 때는 간단한 모양을 이용한다.\n삼각형의 넓이를 구할 때는 높이가 삼각형의 외부에 있는 것도 다룬다.\n넓이 단위 사이의 관계 중 1cm², 1km² 사이의 단위 환산은 다루지 않는다.\n도형의 넓이는 1cm²인 정사각형의 몇 배인지를 구하는 것임을 이해하게 하고, 도형의 변형을 이용하여 넓이를 구하는 여러 가지 방법을 추론하게 한다.\n원주율을 지도할 때는 원주와 지름의 관계를 이해하고 원주율에 대한 양감을 기르게 한다.\n원주율, 원주, 원의 넓이, 입체도형의 겉넓이와 부피 등을 구할 때 복잡한 계산은 계산기를 사용하게 한다.\n겉넓이와 부피를 구하는 방법에 대하여 다양한 추론을 하게 하고, 자신의 추론 과정을 다른 사람에게 설명하게 할 수 있다.\n도형의 넓이와 부피를 구하는 방법의 편리함을 인식하게 한다.\n‘도형과 측정’ 영역의 문제 상황에서 문제해결 전략 비교하기, 주어진 문제에서 필요 없는 정보나 부족한 정보 찾기, 조건을 바꾸어 문제 만들기, 문제해결 과정의 타당성 검토하기 등을 통하여 문제해결 역량을 기르게 한다.\n‘도형과 측정’ 영역에서 자신의 문제해결 과정을 논리적으로 설명하고 다른 친구의 문제해결 과정과 비교함으로써 비판적으로 사고하는 태도를 기르게 한다."},"2022|수학|5~6학년|자료와 가능성|1":{"c":"‘자료와 가능성’ 영역에서는 용어와 기호로 ‘평균, 띠그래프, 원그래프, 가능성’을 다룬다.\n자료를 수집할 때, 간단한 설문조사, 실험이나 관찰, 공공 자료 활용과 같은 방법 중 탐구 목적에 적합한 것을 결정하게 한다.\n평균을 구하는 방법뿐만 아니라 그 의미를 직관적으로 파악하게 한다.\n복잡한 자료의 평균이나 백분율을 구할 때 계산기를 사용하게 할 수 있다.\n조사 자료에서 전체에 대한 각 부분의 비율을 비교해야 하는 문제 상황을 제시하여 띠그래프와 원그래프의 필요성을 인식하게 한다.\n원그래프를 그릴 때는 눈금이 표시된 원을 사용하게 한다.\n띠그래프와 원그래프를 그릴 때 공학 도구를 사용하게 할 수 있다.\n여러 가지 사회, 환경 문제를 탐구하는 데 그림그래프, 막대그래프, 꺾은선그래프, 띠그래프, 원그래프로부터 얻은 정보를 활용하게 할 수 있다.\n자료 수집의 목적과 수집한 자료의 특성에 맞는 그래프로 적절히 표현되었는지, 또는 정보를 왜곡하는 오류가 포함되어 있지는 않은지 등을 비판적으로 판단하게 할 수 있다.\n‘자료와 가능성’ 영역의 문제 상황에서 문제해결 전략 비교하기, 주어진 문제에서 필요 없는 정보나 부족한 정보 찾기, 조건을 바꾸어 새로운 문제 만들기, 문제해결 과정의 타당성 검토하기 등을 통하여 문제해결 역량을 기르게 한다.\n‘자료와 가능성’ 영역에서 자신의 문제해결 과정을 논리적으로 설명하고 다른 친구의 문제해결 과정과 비교함으로써 비판적으로 사고하는 태도를 기르게 한다."},"2022|슬기로운 생활|1~2학년|우리는 누구로 살아갈까|1":{"c":"이 영역의 모든 성취기준을 적용할 때 학교 안팎을 탐색할 때는 교실, 복도, 학교 공공시설, 특별실 등에서 지켜야 할 안전 수칙을 다룬다. 나의 몸과 마음을 다루면서 아팠던 경험을 바탕으로 어떻게 대처할지 혹은 특정 증상(심폐소생술이 필요한 상황 등)에 대한 응급 처치는 구체적으로 어떻게 할지 등을 다루면서 안전 교육과 연계할 수 있다.\n[2슬01-01] 유⋅초 연계 강화 일환으로 입학 초기 적응 활동 중심으로 다룬다. 그리고 안전 교육이 필요할 때 슬기로운 생활과 모든 성취기준과 함께 적용할 수 있다.\n[2슬01-02] 내가 좋아하는 것, 잘하는 것, 흥미를 갖는 것이 무엇인지 찾아보고 자기를 이해하는 경험을 가짐으로써 진로 교육의 자기 이해 부분을 다룰 수 있다.\n[2슬01-03] 다문화 교육이나 인권 교육과 연계할 수 있다."},"2022|슬기로운 생활|1~2학년|우리는 어디서 살아갈까|1":{"c":"이 영역의 모든 성취기준을 적용할 때 마을을 탐색할 때는 마을에서 안전한 장소와 도움을 청할 수 있는 장소가 어디 있는지, 안전한 통학로는 어디인지, 화재와 관련하여 소방서나 다양한 생활 중 사건 사고와 관련하여 경찰서 등이 어디 있는지 나와 마을의 안전을 지켜주는 곳은 어디인지 등 안전과 관련된 곳을 다루는 데 중점을 둔다.\n[2슬02-01] 마을 사람들이 하는 일을 살펴보고 조사하는 활동 과정에서 진로 교육, 마을을 중심으로 한 경제⋅금융 교육, 민주시민 교육과 연계할 수 있다.\n[2슬02-02] 바른 생활과와 연계하여 통일 교육, 독도 교육을 할 수 있다.\n[2슬02-03] 학생이 알고 싶은 나라를 중심으로 탐색할 수 있도록 한다. 학생이 조사할 나라, 조사할 내용과 방법을 정할 수 있도록 하고 자신이 알아낸 정보를 조직해 볼 수 있도록 한다.\n[2슬02-04] 궁금한 세계를 탐색할 때는 영상물, 사진, 책, 누리집 등 다양한 매체를 활용할 수 있어 디지털 소양 교육을 겸할 수 있다. 궁금한 세계에 대해 밝혀진 사실을 아는 데 중점을 두기보다는 학생의 흥미를 중심으로 밝혀지지 않은 부분에 대해 자유롭게 상상할 수 있도록 안내한다. 단, 상위 학년 군의 교육 내용을 직접 다루지 않도록 유의한다."},"2022|슬기로운 생활|1~2학년|우리는 지금 어떻게 살아갈까|1":{"c":"이 영역의 모든 성취기준을 적용할 때 계절과 생활의 관계 탐구와 관련하여 황사, 폭염, 집중호우, 태풍, 낙뢰, 폭설, 한파 등 계절별 재난과 물놀이 안전, 벌레 물림, 가을철 열성 질환, 계절별 감염, 빙판길 안전 등 계절별로 빈번히 일어나는 다양한 재난 안전 교육을 연계할 수 있다.\n[2슬03-01] 다른 사람의 하루가 나의 하루와 다를 수 있음을 이해하고, 우리가 사는 하루를 위해 애쓰는 사람들이 있음을 경험하며 민주시민 교육과 연계할 수 있다.\n[2슬03-02] 계절은 학생이 살면서 경험하는 대표적인 자연현상이다. ‘봄-여름-가을-겨울’로 반복하는 자연의 시간을 다루면서 동시에 사람들이 사는 사회적 시간과 연결하여 다룰 수 있다.\n[2슬03-03] 미래를 상상할 때는 앞으로 어떠한 직업이 생겨나고 사람들이 어떠한 일을 할지 고려해 볼 수 있다.\n[2슬03-04] 지속가능성과 관련된 사례(기후변화, 에너지 문제, 환경오염, 질병, 전쟁 등)를 다룰 때, 학생의 삶과 관련한 문제를 중심으로 지금 무엇을 할 수 있는지, 그리고 미래에 어떤 영향을 미치는지를 다양하게 예측해 볼 수 있다. 이 과정에서 민주시민으로서 자신의 역할을 생각해 볼 수 있다."},"2022|슬기로운 생활|1~2학년|우리는 무엇을 하며 살아갈까|1":{"c":"이 영역의 모든 성취기준을 적용할 때 다양한 매체를 다루는데 있어 개인 정보, 건전한 사이버 생활, 새로운 매체의 활용 등 안전한 매체 사용과 관련한 안전 교육을 병행할 수 있다.\n[2슬04-01] 생각의 전환을 통해 생활 도구를 새롭게 볼 수 있도록 한다. 사람마다 관점과 발상이 다르다는 것, 내가 보지 못하는 것을 다른 친구들이 볼 수 있다는 것을 수업 과정에서 경험하도록 한다.\n[2슬04-02] 엉뚱하고 기발한 상상력, 실현 가능성은 없지만 신선한 자극을 주는 것은 학생의 생각을 발전시키는 데 중요하다. 다양한 매체가 학생이 상상한 것을 구현하는 데 도움을 줄 수 있음을 고려하고 가능한 한 매체와 재료의 제한을 두지 않도록 한다.\n[2슬04-03] 다양한 원천으로부터 주제를 찾도록 안내하고 주제 탐구 과정에서 사용하는 매체와 관련해서 디지털 소양 교육을 할 수 있다.\n[2슬04-04] 주제학습을 성찰하면서 3학년 이후 교과 교육에 대한 기대감을 형성할 기회를 제공할 수 있다."},"2022|실과|5~6학년|인간 발달과 주도적 삶|1":{"c":"아동기의 발달 단계에 근거하여 성장 발달에 요구되는 핵심 조건과 이를 충족하는 방법 탐색에 초점을 둔다. 특히 개인차로 인해 영역마다 발달의 차이가 있을 수 있음을 이해하여 다른 친구들의 발달을 존중하도록 지도한다.\n가족의 역할 수행에서 성역할 고정 관념이나 편견이 형성되지 않도록 하며 생활 속에서 실천할 수 있는 자기관리 방법을 계획하여 실천하도록 지도한다.\n균형 잡힌 식사나 적절한 옷차림을 지도할 때, 이것이 자신의 성장 발달과 관련되는 구체적인 내용임을 인식하여 실천할 수 있도록 지도한다.\n학습자가 진로에 관해 고정관념이나 편견이 있지 않은지 주의 깊게 관찰하여 이에 영향을 받지 않고 자신의 진로를 탐색할 수 있도록 지도한다."},"2022|실과|5~6학년|생활환경과 지속가능한 선택|1":{"c":"식재료의 생산과 선택에서 건강과 안전성은 물론 환경을 고려해야 하는 사실을 지도한다. 또한 다양한 식재료의 고유한 맛을 경험하여 아동기에 전통음식을 비롯한 다양한 음식에 대한 수용성을 높일 수 있도록 하기 위해 오감을 활용한 맛 교육을 적용한다.\n학생들의 학습 부담을 줄이기 위하여 내용 요소로서의 안전 교육은 지양하고 지속가능한 의식주 생활 전반에서 안전한 생활을 위한 예방적 태도를 기를 수 있도록 지도한다.\n삶을 유지하기 위해 필요한 제한된 생활자원 관리 및 지속가능한 선택을 위해서 환경적⋅생태적 접근을 바탕으로 생태감수성을 길러 실천할 수 있도록 지도한다. 특히 잔반 적게 남기기, 불필요한 전등 끄기, 일회용품 줄이기, 의복의 재활용 등 지속가능한 의식주 생활을 학생 삶의 장면에 생태전환교육으로 적용하고 실천하도록 하는 데 중점을 둔다.\n시간과 용돈 관리는 학습자들이 흥미를 갖는 도구(애플리케이션 등)를 활용하는 등 변화하는 생활 방식에 따라 다양한 디지털 기기를 선택하여 활용할 수 있도록 하여 생활자원에 대한 관리에 쉽게 접근하고 적용이 가능하도록 한다."},"2022|실과|5~6학년|기술적 문제해결과 혁신|1":{"c":"발명, 수송 등이 일상생활의 문제와 연결되어 있음을 이해시키고 그것의 개념을 탐색하는 과정에서 기술적 문제 해결과 발명 개념을 강조한다.\n창의적인 발명 문제해결과 수송 수단을 만드는 과정에서 자신과 연결된 문제들을 공유와 협업에 기반을 두고 실제로 해결하는 메이커 활동을 통해 건강한 시민으로서의 기본 소양을 갖추도록 한다.\n메이커 활동의 재료는 일상생활 속에서 손쉽게 구할 수 있는 것을 활용하되 생활 속에서 버려진 재료도 재활용하여 생태전환 측면에도 기여하도록 하고, 로봇과 연계하여 교수⋅학습 내용이 영역 간 내용이 융합되도록 한다."},"2022|실과|5~6학년|지속가능한 기술과 융합|1":{"c":"일상생활과 연결되어 있는 건설, 정보 기술의 가치를 인식시키고, 지속가능성과 융합적 사고에 기초하여 체험 과정에서 나타나는 문제를 해결하도록 한다.\n로봇의 개념과 구조, 작동 원리를 이해하고 앞으로의 발달 사례를 예측하고 블록기반 코딩 프로그램의 적용을 통한 로봇 작동 체험과 인공지능을 연계하여 미래의 로봇에 대한 흥미와 관심이 유발되도록 한다.\n식물 가꾸기, 동물 기르기와 같은 체험활동을 통해 자연과의 교감, 생명존중, 책임감 등과 같이 농업이 가지는 순기능으로서 인성 함양 측면을 강조하고 동시에 지속가능한 생태 문명을 위해 생각과 행동의 변화를 추구하는데도 농업이 기여할 수 있음을 강조한다.\n동식물 자원 생산과 유통의 탐색, 생활 속 농촌 체험 등을 통해 지속가능한 기술로서의 농업의 가치와 중요성을 인식시키는 한편, 디지털 소양을 기반으로 이루어지는 스마트팜, 정밀농업 등과 같은 미래 산업으로서 농업의 가치가 부각되도록 한다."},"2022|실과|5~6학년|디지털 사회와 인공지능|1":{"c":"다양한 디지털 기기를 실제로 활용하며 생활 속 컴퓨터의 활용 사례를 탐색하도록 한다.\n우리 일상을 돕고 문제를 해결하기 위해 컴퓨터를 활용한 사례를 탐색하여 발표하도록 한다.\n특정 프로그래밍 언어의 기능을 익히는데 치중하지 않도록 유의하고 알고리즘을 토대로 프로그래밍을 작성하는 활동을 통해 프로그래밍의 기본 원리를 익히도록 한다.\n단순한 프로그래밍 산출물 평가를 지양하고 프로그래밍 과정을 통한 컴퓨팅사고력의 향상 정도를 측정할 수 있도록 한다.\n다양한 사례로 데이터의 의미를 파악하는 활동을 통해 디지털 소양을 함양하도록 한다.\n인공지능 기술을 단순히 체험하는 것을 넘어 인공지능의 기계 학습 과정을 이해할 수 있도록 지도하여 학생들이 인공지능 소양을 함양할 수 있도록 한다."},"2022|영어|3~4학년|이해|1":{"c":"영어를 처음 접하는 시기이므로 듣기 능력의 향상에 중점을 두되, 읽기 능력도 균형적으로 발달하도록 지도한다. 또한 이해 영역의 듣기와 읽기를 연계한 활동뿐만 아니라 이해한 내용을 말하거나 쓰기, 질문하며 답하기 등의 활동을 활용하여 이해 영역 활동이 자연스럽게 표현 영역 활동에 연결되도록 통합적으로 지도한다.\n영어 학습 초기임을 고려하여 학습자 자신 주변의 주제(이름, 색깔, 시간, 학용품, 운동, 동물 등)를 중심으로 듣기나 읽기 자료를 구성하는 것이 효과적이다. 다양한 실물, 동작, 그림, 사진, 삽화, 도표 등의 시각 정보도 함께 제시하여 학습자가 듣거나 읽은 것을 쉽게 이해할 수 있도록 한다.\n영어 학습에 관한 인지적 부담을 낮추고 흥미와 자신감을 가질 수 있도록 듣고 행동으로 반응하기, 듣고 지시대로 행동하기, 들은 내용을 바탕으로 그리기, 들은 내용을 바탕으로 도표 만들기 등 듣고 이해한 정도를 다양한 과업 수행으로 표현할 수 있도록 지도한다.\n듣기와 읽기 전략은 학습자가 담화나 문장을 효과적으로 이해하는 데 도움을 줄 수 있다. 그림이나 동작 등 시각적 단서를 활용하여 단어, 어구, 문장의 의미를 추측할 수 있으며, 삽화 속에 나타난 등장인물이나 상황을 통해 이야기의 내용이나 결말을 예측해 보도록 하여 능동적으로 의미를 구성해 보는 기회를 준다.\n듣기나 읽기 자료를 제시할 때는 시각 자료나 일상생활의 맥락, 배경이 포함되도록 하여 학습자의 이해를 돕고, 역할극, 놀이, 게임, 영상 등 다양한 매체와 학습 방법을 통해 관련 표현을 자연스럽게 반복적으로 배우도록 지도한다. 특히, 에듀테크에 기반한 디지털 매체는 영어 입력 및 영어 학습에 대한 흥미도 향상, 영어에 관한 불안감 해소에 기여할 수 있다.\n알파벳은 알파벳 모형 등 구체적인 조작물을 활용한 알파벳 대소문자 짝짓기, 이름 듣고 해당하는 알파벳 찾기, 신체를 활용한 알파벳 놀이, 디지털 도구를 활용한 알파벳 인식 등 다양한 읽기 활동을 통하여 재미를 느끼면서 익힐 수 있도록 지도한다.\n소리와 철자의 관계를 지도할 때는 비슷한 패턴을 보이는 여러 단어를 사용하여 학습자가 스스로 규칙을 찾도록 유도한다. 첫소리나 끝소리가 같은 단어 찾기, 중간 모음이 같은 단어 찾기, 철자를 조합하거나 변형하여 읽어 보기 등 다양한 활동을 할 수 있다.\n듣기의 이해 정도를 평가할 때는 질문에 관한 대답뿐만 아니라 그림으로 나타내거나 행동으로 반응하는 등 언어 외적인 방법으로도 표현할 수 있도록 한다. 또한 상황에 따라 알맞게 단어나 어구 등을 바꾸어 제시하고 집중하여 듣는 능력을 평가하는 방법도 사용할 수 있다. 초기 영어 학습자임을 고려하여 단순한 음성 자료만 활용하는 것은 지양하고, 시각적 자료를 병행하거나 일상생활의 맥락, 배경이 포함된 음성 자료를 활용하여 평가하도록 한다.\n단어나 어구 읽기를 평가할 때는 가급적 구두로 익힌 쉽고 간단한 단어나 어구를 선정한다. 학습자의 수준에 따라 시각적인 보조 자료 없이 문자 언어만 제시하는 것도 고려할 수 있다. 평가 방법으로는 단어 또는 어구와 그림을 연결하기, 단어 또는 어구를 읽고 분류하기, 상황에 어울리는 단어 또는 어구 카드 찾기 등이 있다.\n영어 이해 기능의 가치⋅태도를 평가할 때는 해당 성취기준을 독립적으로 평가하기보다는 다른 성취기준과 통합하여 평가하는 것을 권장한다. 존중과 배려의 태도로 상대방의 말을 수용하거나 다양한 문화를 이해하는 것이 중요한 듣기의 태도임을 인식할 수 있도록 지도한다. 또한 일회적인 평가보다는 장기간의 지속적인 관찰을 통해 평가하기를 권장한다.\n평가에 대한 개별 피드백을 제공하여 학습에 대한 동기를 부여하고 이것이 다시 학습의 과정과 결과물에 반영되는 순환 구조가 이루어지도록 한다."},"2022|영어|3~4학년|표현|1":{"c":"영어를 처음 접하는 시기이므로 말하기 능력의 향상에 중점을 두되, 쓰기 능력도 균형적으로 발달하도록 지도한다. 또한 표현 영역에서 말하기와 쓰기를 연계한 활동뿐만 아니라 듣고 말하기, 읽고 쓰기 등의 활동을 활용하여 이해 영역과 표현 영역의 활동이 자연스럽게 연결되도록 통합적으로 지도한다.\n교실 및 자기 주변에서 쉽게 접하는 교사나 친구, 사물에 대하여 말하거나 쓰는 활동을 통해 교사와 학생, 동료 학생 간의 상호 작용을 강화하고 목표 언어의 의미와 사용 맥락을 실제적으로 체험할 수 있도록 지도한다.\n노래와 찬트는 영어의 강세, 리듬, 억양을 익히기에 좋은 언어 자료이므로 내용을 이해하고 반복적으로 들으면서 따라 부르도록 한다. 단어 수준에서부터 어구, 문장, 간단한 대화 등의 순으로 들려주면서 자연스럽게 영어의 강세, 리듬, 억양에 익숙해지게 한다.\n학습자는 여러 단계의 중간 언어(interlanguage)를 거쳐 영어를 습득하기 때문에 발화 과정에서 나타나는 오류는 자연스러운 현상이다. 따라서 의사소통에 지장을 주는 경우가 아니라면 오류에 대한 즉각적인 교정은 피하는 것이 좋다. 교정적인 피드백은 학습자끼리 주고받을 수도 있고, 오류의 유형과 특성에 따라 개인별 혹은 전체를 대상으로 교사가 제공할 수도 있다.\n알파벳 쓰기를 처음 배우는 시기이므로 대소문자를 모양과 획순에 맞게 정확하게 쓸 수 있게 충분한 연습 기회를 제공한다. 모양이 유사해서 혼동하기 쉬운 철자에 대하여 반복적으로 학습할 기회를 제공하고, 소문자 위주로 단어나 어구 등이 제시될 수 있으므로 대문자도 균형적으로 익힐 수 있도록 유의한다. 학습자의 특성과 필요에 따라 단기간 집중 또는 분산 지도 방법을 사용하여 알파벳을 지도할 수 있으며, 읽기와 쓰기를 연계하여 지도한다.\n초기 쓰기 단계에서는 학습자가 철자 쓰기에 어려움을 겪는다. 따라 쓰기, 보고 쓰기, 완성하여 쓰기의 순으로 점진적으로 통제의 정도를 줄여 가며 쓰도록 하여 쓰기에 대한 자신감을 가지게 한다. 또한 알파벳의 이름과 소리를 연계하여 생각해 보기, 같은 소리와 철자를 가진 친숙한 단어 생각해 보기 등 철자를 기억할 수 있는 다양한 전략도 활용하도록 안내한다.\n학습자는 영어로 표현하는 것에 대한 어려움과 불안감을 느끼는 경우가 많다. 교사는 이해 가능한 입력 자료, 의미 중심의 활동, 동료와의 협력 등을 통해 발화에 어려움이 있는 학습자가 적극적으로 대화에 참여하도록 이끌어 주어야 한다. 쓰기에 대한 흥미와 관심도 잃지 않도록 주변의 친숙한 간판이나 표지판, 상표 등에 나타난 알파벳과 단어를 중심으로 쓰게 한다. 또한 언어 수준을 고려하여 개별 학습자에게 필요한 맞춤형 자료를 준비하여 지도한다.\n학습자 간 의사소통 과정에서 기본적인 대화 예절을 이해하고 준수하도록 지도한다. 적극적으로 대화에 참여하는 태도, 상대방을 배려하여 공손하게 듣고 말하는 태도, 말하는 차례 지키기 등을 의사소통 전 과정에 걸쳐 체득할 수 있도록 지속적으로 점검하고 격려한다.\n에듀테크의 발달에 따라 사이버 공간에서 활발한 상호 작용이 이루어지고 온오프라인 연계 학습이 활성화되고 있으므로 교육 환경과 학습자의 상황을 고려하여 적절한 매체와 기법을 활용하여 새롭고 흥미로운 학습 경험을 제공하고, 다양한 형태의 결과물을 창의적으로 만들 수 있도록 유도한다.\n말하기 형성평가는 교사의 발문에 대한 응답, 짝이나 소그룹 활동 등에서 이루어지는 학습자들의 상호 작용 및 과업 수행 정도, 전략 활용과 대화 예절 등에 초점을 두고 진행한다. 쓰기 형성평가는 학습자가 배운 단어, 어구, 문장을 바르게 쓸 수 있는지와 과업의 수행 정도 등에 중점을 둔다.\n말하기와 쓰기에 대한 흥미나 자신감을 평가하는 방법으로 자기 평가와 동료 평가를 활용할 수 있다. 표현 활동에 얼마나 흥미가 있으며 자신감이 생겼는지 평가하는 과정을 통해 학습자 스스로 학습 계획을 세워 실천해 나가며 성찰할 수 있는 자기주도학습의 기초가 될 수 있도록 한다.\n말하기와 쓰기의 통합 평가를 위해 간단한 단어와 어구를 쓰고 이와 관련된 의사소통 표현을 묻거나 답하는 방법, 구어로 물어본 질문에 답하고 이를 단어나 어구로 쓰도록 하는 방법 등을 이용할 수 있다. 통합 평가를 수행하는 데 어려움을 겪는 학습자에게는 시각적 단서 등의 자료를 제공하여 평가할 수 있다."},"2022|영어|5~6학년|이해|1":{"c":"듣기와 읽기 능력을 균형 있게 향상하는 데 중점을 두어 지도한다. 또한 이해 영역의 듣기와 읽기를 연계한 활동뿐만 아니라 이해한 내용을 말하거나 쓰기, 질문하며 답하기 등의 활동을 활용하여 이해 영역 활동이 표현 영역 활동에 자연스럽게 연결되도록 통합적으로 지도한다.\n초등학교 5~6학년군에서는 일상생활에서 자주 접할 수 있는 주제(장래 희망, 여행, 취미, 건강 등)를 중심으로 3~4학년군보다 다양한 주제와 의사소통 상황을 포함한 듣기, 읽기 자료를 구성하여 활용한다. 자연스러운 의사소통의 맥락에서 학습자가 다양한 문화권에 속한 사람들의 의사소통 방식이나 일상생활도 접할 수 있도록 한다.\n일상생활 주제의 담화나 글을 이해하기 위해 듣기 및 읽기 전⋅중⋅후 활동에서 적절한 전략을 활용할 수 있다. 즉, 듣기⋅읽기 전 활동에서는 시각 단서를 활용하여 듣거나 읽을 내용을 예측하는 전략, 듣기⋅읽기 중 활동에서는 특정 정보에 주목하여 듣거나 읽는 전략, 듣기⋅읽기 후 활동에서는 듣거나 읽은 내용을 점검하고 필요한 내용을 다시 듣거나 읽는 전략 등을 단계별로 지도한다.\n담화나 글의 내용을 파악할 때는 인물, 행동, 장소, 시간, 감정 등 명시적으로 언급된 세부 정보뿐만 아니라, 담화나 글의 맥락, 주제 및 요지 등의 중심 내용, 일이나 사건의 전후 관계 등을 파악하도록 지도한다. 예를 들어 담화나 글의 줄거리 파악하기, 듣거나 읽은 문장을 순서대로 배열하기, 간단한 메모 작성하기 등 학습자의 흥미를 불러일으킬 수 있는 유의미하고 다양한 학습 활동을 사용한다.\n소리 내어 읽기를 위해 혼자 읽기, 반 전체가 함께 읽기, 짝이나 모둠원과 번갈아 읽기, 모둠에게 읽어 주기, 시간을 정하여 읽기 등 다양한 방법을 활용한다. 소리 내어 읽기의 목적은 단어, 어구, 문장을 빠르고 정확하게 읽도록 연습하는 데 있으므로, 의미 중심의 읽기를 위한 발판의 역할로 사용하는 것이 좋다.\n에듀테크의 발달과 함께 듣기, 읽기 도구도 다양해지고 있으므로 다양한 디지털 매체를 활용한 듣기와 읽기에 익숙해질 수 있도록 한다. 인공지능이나 앱, 번역기 등의 디지털 도구를 활용하여 학습자의 수준에 맞는 맞춤형 학습을 제공할 수도 있다.\n듣기⋅읽기 평가는 일괄적으로 실시하는 것보다 평가 목적과 대상, 방법에 따라 다양하게 실시하는 것이 바람직하며, 단어, 어구, 문장, 글 등 학습자의 수준에 적절한 언어 재료를 다양하게 활용하는 방안을 고려할 수 있다.\n듣기⋅읽기 평가는 지필평가, 수행평가, 교사 평가, 동료 평가, 자기 평가 등을 다양하게 적용하여 학습의 과정이 드러나도록 한다. 학습 과정을 누가 기록할 수 있도록 다양한 도구를 활용하고, 이를 바탕으로 학습자에게 적절한 피드백을 제공한다. 학습자가 피드백을 활용하여 자신의 현재 수준과 학습의 목표 사이의 간격을 줄이도록 지도한다.\n듣기⋅읽기의 가치⋅태도를 평가할 때는 해당 성취기준을 독립적으로 평가하기보다는 다른 성취기준과 통합하여 평가하는 것을 권장한다. 자기 평가나 동료 평가 등을 통해 학습자 스스로 듣기나 읽기 태도를 확인하고 점검하게 할 수 있다. 또한 듣기⋅읽기 태도가 자신의 영어 듣기⋅읽기 능력 향상과 어떠한 관련이 있는지를 스스로 성찰해 볼 수 있도록 지도한다."},"2022|영어|5~6학년|표현|1":{"c":"말하기와 쓰기 능력을 균형 있게 향상하는 데 중점을 두어 지도한다. 또한 표현 영역의 말하기와 쓰기를 연계한 활동뿐만 아니라 듣고 말하기, 읽고 쓰기 등의 활동을 활용하여 이해 영역 활동과 표현 영역 활동이 자연스럽게 연결되도록 통합적으로 지도한다.\n학습자의 일상생활과 밀접하게 관련된 주제로서 자신의 경험, 의견, 계획, 진로뿐만 아니라 기후변화나 다문화 문제 등에 대해서도 적극적으로 관심을 가지도록 과업이나 프로젝트 학습, 의견 조사 등의 다양한 활동을 실시한다. 학습자가 결과물을 정리하고 발표하는 과정에서 자기주도성을 높이고 유의미한 학습이 이루어지도록 수업을 설계한다.\n교사와 학습자, 학습자 간의 상호 작용에서 다양한 유형의 질문과 피드백을 활용하여 학습자의 응답을 유도하고, 지속적인 상호 작용이 이루어지도록 한다.\n효과적인 쓰기 활동을 위해 계획, 초고 쓰기 및 수정, 공유 단계 혹은 쓰기 전⋅중⋅후 활동으로 나누어 단계별로 지도할 수 있다. 학습자 스스로 또는 동료들과 협력하여 쓰기 과정을 점검하게 함으로써 쓰기 능력을 신장하는 기회로 활용한다.\n교사 또는 학습자 상호 간의 교정을 통해 알파벳 대소문자와 문장 부호 등 영어 표기법을 이해하고 알맞게 사용할 수 있도록 지도한다. 이 과정에서 국어에서 배운 쉼표, 마침표, 물음표 등에 대한 지식을 활용하도록 지도할 수 있다.\n말하기와 쓰기의 유창성을 높이기 위해 그림, 사진, 실물 등의 시각 자료나 번역기 등을 활용할 수 있다. 그림으로 그린 후에 이를 보고 문장을 말하거나 써 보도록 할 수 있으며, 사전 앱이나 번역기 등의 도움을 받아 문장을 구성하게 하는 것도 좋다. 또한 협력 학습을 통해 짝이나 모둠원과 서로 번갈아 문장을 말하거나 쓰는 문장 릴레이 활동을 한 후 여러 개의 문장을 이어서 말하거나 쓰도록 교수⋅학습 과정을 구성할 수도 있다.\n학습자의 수준을 고려하여 개별화된 수준별 학습 자료, 시청각 자료뿐만 아니라 다양한 디지털 매체를 활용한 학습 자료를 제공하여 인지적⋅심리적 부담감을 줄인다.\n말하기 전략은 의사소통 과정에서 발생할 수 있는 여러 가지 어려움을 해결하는 데 유용한 방법이 될 수 있으므로 다양한 비언어적, 언어적 전략을 익혀 활용하도록 지도한다. 글쓰기 과정에서도 교사와 동료의 피드백을 반영하여 고쳐 쓰거나 사전 앱이나 번역기 등의 디지털 도구를 활용하는 것은 중요한 쓰기 전략 중의 하나이며 자기주도적인 학습자로 성장하는 데 있어 좋은 경험이 될 수 있다.\n말하기⋅쓰기 평가는 가급적 수행평가를 통해 실시하며, 말하기는 면접이나 과업(역할놀이, 조사 활동 등)을, 쓰기는 서답형 문항이나 포트폴리오 등을 활용하여 평가할 수 있다.\n말하기⋅쓰기 평가를 위한 채점 척도는 일반 평가 원리에 의한 척도를 응용하거나 과업에 적합한 척도를 만들어 사용할 수 있고, 표현 능력을 발현시키고 측정할 수 있는 다양한 매체를 활용할 수도 있다. 말하기는 발음, 어휘, 내용 등에 대하여, 쓰기는 철자와 구두점, 어휘, 내용, 언어 형식 등에 대하여 세부적인 평가기준을 마련하고 학습자에게 충분히 안내한 후에 평가를 실시한다.\n말하기와 쓰기에 대한 흥미와 자신감, 짝이나 모둠 구성원들의 협력 정도를 평가할 때는 자기 평가와
