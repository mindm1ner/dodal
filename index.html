동료 평가를 활용할 수 있다. 이때 평가 결과는 학습자 스스로 학습 계획을 세우고 실천해 나가며 성찰할 수 있는 자기주도학습의 기초가 되도록 한다."},"2022|음악|3~4학년|연주|1":{"c":"생활 속에서 접할 수 있는 다양한 노래와 악기 연주 활동을 통해 음악적 감성을 기르도록 한다.\n자유롭게 소리를 탐색하며 음악 요소나 주법 등을 기초적인 수준에서 이해하여 음악에는 고유한 방식과 원리가 있고 이를 다양한 소리로 표현할 수 있음을 경험하도록 한다.\n노래나 악기 연주를 통한 음악 기초 기능을 바탕으로 신체표현, 놀이, 이야기 등으로 점차 확장시켜 음악 개념과 활동을 의미 있게 연결 짓도록 구성한다.\n연주를 즐기는 태도나 연주에 대한 관심과 관련된 성취기준은 학생의 학습 참여도 등을 평가기준으로 삼아 표현하기, 이야기하기 등의 다양한 활동으로 나타내도록 할 수 있다.\n간단한 악곡의 연주에 관한 개인 또는 공동체의 경험을 토대로 일상생활 속에서 음악에 관심을 가지고 생활화할 수 있도록 구조화된 점검표나 다이어그램, 음악 생활 일지 등을 활용할 수 있다."},"2022|음악|3~4학년|감상|1":{"c":"다양한 음악 감상을 통해 음악의 요소, 느낌, 쓰임 등을 파악하고 다양한 방식으로 반응, 탐색, 묘사해 보며, 음악이 고유한 방식과 원리에 따라 청각적으로 구현된 것임을 경험함으로써 음악적 감성을 기르도록 한다.\n예술적⋅교육적 가치뿐만 아니라 주변 생활과 밀접한 주제나 쓰임을 지닌 감상곡을 다룸으로써 생활 속의 다양한 소리와 음악에 호기심과 흥미를 갖도록 한다.\n음악의 종류나 주제에 따른 음악의 전반적 특징을 발견하고 이를 발표하며 공유하는 활동을 통해 청각적 인식과 음악적 이해를 연결 짓도록 한다.\n다양한 쓰임이나 주제를 가진 음악을 듣고 이를 노래나 악기 연주뿐 아니라, 신체, 그림, 영상, 글 등의 다양한 방법과 연계하여 표현할 수 있도록 한다.\n음악에 대한 호기심을 가지거나 음악을 즐기는 태도와 관련된 성취기준은 생활 속의 다양한 음악 조사하기, 소개하기, 생각 발표하기 등의 다양한 활동으로 나타내도록 할 수 있다.\n감상에서 평가는 실음을 중심으로 악곡에 대한 이해뿐만 아니라 음악을 감상하는 태도를 포괄적으로 평가할 수 있도록 실음 지필 평가, 관찰 평가, 포트폴리오 등의 다양한 방법을 활용할 수 있다."},"2022|음악|3~4학년|창작|1":{"c":"소리와 음악의 새로운 표현을 탐구하고 즐기며 음악적 창의성을 기르도록 한다.\n음악 요소 등 음악의 고유한 방식과 원리에 대한 이해를 바탕으로 한 음악적 표현을 통해 음악 창작 활동에 대한 자신감과 자기주도성의 토대를 형성하도록 한다.\n자신의 느낌과 상상을 다양하게 탐구하여 즉흥 표현하기, 바꾸기, 모방하여 나타내기 등 간단한 수준의 여러 창작 활동들을 쉽고 재미있게 할 수 있도록 구성한다.\n창작의 과정에 흥미를 느낄 수 있도록 자유롭고 수용적인 분위기를 조성하도록 한다.\n학생의 관심과 음악적 수준에 따라 음악을 표기하는 다양한 방법 중 적절한 것을 선택하여 활용할 수 있도록 한다.\n음악에 대한 흥미나 새로움을 즐기는 태도와 관련된 성취기준은 자신이 만든 음악을 신체나 악기 등으로 표현하기, 친구들과 공유하며 발전시키기, 창작 과정과 결과물에 관한 느낌 발표하기 등의 다양한 활동으로 나타낼 수 있다.\n창작에서 평가는 결과물뿐만 아니라 창작 동기나 과정, 참여도를 종합적으로 살피도록 하며 체크리스트, 포트폴리오, 음악 창작 일지 등을 활용할 수 있다."},"2022|음악|5~6학년|연주|1":{"c":"3~4학년에서 학습한 음악 요소, 주법과 표현 기법, 노래, 악기 연주 등에 관한 기초적인 내용을 포함하되, 5~6학년에서는 지식이나 기능의 개별 학습에 그치지 않고 협력적인 음악 연주 활동을 통해 소통하며 공동체 속에서의 민주 시민 의식을 기를 수 있도록 한다.\n다양한 연주를 통해 자신과 타인의 느낌, 경험, 생각 등을 조화롭게 표현할 수 있음을 경험하고 협력적인 활동을 다양하게 수행하며 과정을 돌아봄으로써 연주의 즐거움을 느끼도록 한다.\n노래와 악기 등의 연주를 위한 자세, 호흡, 발성, 악기 연주 방법 등의 주법과 표현 기법의 필요성을 인식하고, 소리의 원리와 특징에 따라 아름다운 소리로 연주할 수 있도록 한다.\n악곡에 드러난 여러 음악 요소에 대한 이해를 바탕으로 노래나 악기 연주로 발표하고, 자신의 발표 과정에 관해 스스로 또는 동료들과 함께 이야기하도록 한다.\n생활 속의 음악 활동 참여와 관련된 성취기준은 연주를 위한 준비와 발표 과정에서의 참여도를 평가 기준으로 삼아 자발적이고 주도적인 참여 태도, 실생활에서의 실천 의지 등으로 평가할 수 있다. 이 때 연습 일지나 체크리스트, 포트폴리오 등을 활용할 수 있다.\n연주를 발표하거나 생활 속 활동에 참여하는 것을 평가할 때에는 녹음이나 녹화를 통해 연주 활동을 되돌아보고 자기 평가 또는 상호 평가 등 학생들의 평가 내용을 반영할 수 있다."},"2022|음악|5~6학년|감상|1":{"c":"3~4학년에서 학습한 음악 요소, 종류 등의 기초적인 내용을 포함하되, 5~6학년에서는 보다 전체적이고 조화로운 음악적 구성이나 느낌, 배경, 활용 등의 맥락을 이해함으로써 음악적 감성을 기르도록 한다.\n건강, 행사, 기후⋅생태환경 변화 등 학습자의 생활과 관련된 다양한 음악의 활용과 연결지어 감상함으로써 음악의 내적⋅외적 측면을 균형 있게 파악하고, 음악 감상을 생활화하는 태도를 형성할 수 있도록 구성한다.\n음악의 요소, 특징, 구성을 구별하거나 인식, 혹은 음악에 대해 공감하는 것에 관한 성취기준은 노래, 악기, 신체, 언어, 그림 등으로 표현하기, 설명하기, 평하기 등의 다양한 활동을 통해 나타낼 수 있다.\n다양한 문화권, 배경, 활용 등 음악을 둘러싼 맥락에 관한 부분은 관련된 타 교과의 성취기준과 연계하여 학습하고 평가할 수 있다.\n감상에서 평가는 실음을 중심으로 악곡에 대한 이해뿐만 아니라 음악을 감상하는 태도를 포괄적으로 평가할 수 있도록 실음 지필 평가, 관찰 평가, 포트폴리오 및 보고서 등의 다양한 방법을 활용할 수 있다."},"2022|음악|5~6학년|창작|1":{"c":"3~4학년에서의 자유로운 발상을 토대로, 5~6학년에서는 악기나 매체 등을 활용하여 떠올리며 표현하기, 바꾸거나 활용하여 만들기 등의 창작 활동을 통해 음악적 창의성을 기르도록 한다.\n음악 창작의 소재로서 느낌과 아이디어를 자유롭게 발산해 내고 이를 음악으로 표현함으로써 음악적 자신감과 자기주도성의 토대를 형성하도록 한다.\n음악 창작과 표현, 공유와 소통 과정에서 디지털 매체를 적절히 활용함으로써 디지털 기초 소양을 기르도록 한다.\n창작의 과정에 흥미와 긍정적 태도를 가질 수 있도록 자유롭고 수용적인 분위기를 조성하도록 한다.\n음악에 대한 자신감이나 열린 태도와 관련된 성취기준은 학생들의 실제 생활을 토대로 자신의 경험 떠올리기, 관심 있는 대상에 관해 이야기하기, 음악 창작 활동에 관한 생각이나 느낌 발표하기 등의 다양한 활동으로 나타낼 수 있다.\n창작에서 평가는 결과물뿐만 아니라 창작 동기와 과정, 참여도를 종합적으로 살피도록 하며 체크리스트, 포트폴리오, 음악 창작 일지, 보고서 등을 활용할 수 있다."},"2022|즐거운 생활|1~2학년|우리는 누구로 살아갈까|1":{"c":"영역 내 모든 성취기준을 다룰 때는 놀이를 통한 기본 움직임 활동과 안전하게 생활하는 데 필요한 안전 교육을 주제 학습과 연계한다. 놀이할 때는 놀이 장소의 안전 상황을 살피고 안전하게 놀 수 있도록 한다. 놀이터에서 놀이하는 사람들의 밀집도, 놀이 도구 사용 상의 안전성, 놀잇감의 유해성 등과 관련해서 구체적인 안전 교육을 할 수 있다.\n[2즐01-01] 초등학교 적응 활동에 초점을 맞춘다. 놀이를 하며 몸을 움직임으로써 학생의 신체 활동 욕구를 충족시켜 주고 감각, 정서, 사회성 발달 등을 도모할 수 있다. 그리고 안전 교육이 필요할 때 즐거운 생활과 모든 성취기준과 함께 적용할 수 있다.\n[2즐01-02] 움직임이 큰 신체 놀이, 감각 체험 놀이, 다양한 방법의 표현 놀이 등 신체를 이용한 여러 놀이에 참여함으로써 학생이 건강하고 즐겁게 생활하는 데 초점을 둔다.\n[2즐01-03] 학생들이 소통할 가족, 친척, 친구, 이웃 등 주변 사람의 배경에 따라 다양한 지역이나 국가의 문화 예술 활동과 연계할 수 있다."},"2022|즐거운 생활|1~2학년|우리는 어디서 살아갈까|1":{"c":"영역 내 모든 성취기준을 다룰 때는 놀이를 통한 기본 움직임 활동과 안전하게 생활하는 데 필요한 안전 교육을 주제 학습과 연계한다. 특히 사람들이 많이 모이는 극장, 공연장, 전시관, 미술관 등에서 공연, 전시, 관람 등 다양한 문화 예술 활동을 할 때는 예절과 함께 필요한 안전 수칙을 학생이 미리 숙지할 수 있도록 유의한다.\n[2즐02-01] 주변에서 열리는 지역 축제 등 문화 예술 활동에 공연자나 관람자로 참여하면서 창조적 활동을 경험할 수 있다.\n[2즐02-03] 여러 나라의 놀이, 노래, 축제 등을 접하는 과정에서 다문화 교육과 연계할 수 있다.\n[2즐02-04] 창의적인 생각과 다양한 상상을 존중하고 허용하는 분위기를 조성하는 데 유의한다. 특히 매체를 사용할 때는 디지털 소양 교육과 연계할 수 있다."},"2022|즐거운 생활|1~2학년|우리는 지금 어떻게 살아갈까|1":{"x":"없음","c":"영역 내 모든 성취기준을 다룰 때는 놀이를 통한 기본 움직임 활동을 주제 학습과 연계한다. 특히 아동의 안전과 안녕을 다룰 때 가정폭력 및 학교폭력 예방, 아동학대 및 유기 대처 방안, 적극적인 자기 신변 보호 교육 등을 UN 아동 권리 협약에서 보장하는 내용과 연결할 수 있다.\n[2즐03-01] 규칙적인 운동이나 건강을 위한 습관을 형성하고 좋아하는 신체 활동을 통해서 하루를 활기차게 생활하도록 안내할 수 있다.\n[2즐03-02] 학생이 생활 속에서 접할 수 있는 계절별 생태놀이, 날씨에 영향을 받는 놀이, 전통놀이, 절기나 풍습과 관련된 놀이 등을 다양하게 즐길 수 있도록 하고 이를 생태전환 교육과 연계할 수 있다.\n[2즐03-03] 전통문화를 새로운 시각으로 현재에 맞게 재창조할 수 있는 기회를 만든다.\n[2즐03-04] 아동이 누려야 할 여러 가지 권리 내용을 알아보면서 전쟁, 기아, 자연재해와 같은 범지구적인 문제와 관련시킬 수 있다. 아동의 안전과 안녕을 위해 학생이 스스로 자신의 의견이나 목소리를 낼 수 있도록 하며 인권 교육과 연계할 수 있다."},"2022|즐거운 생활|1~2학년|우리는 무엇을 하며 살아갈까|1":{"c":"영역 내 모든 성취기준을 다룰 때는 놀이를 통한 기본 움직임 활동을 주제 학습과 연계한다. 놀이나 활동에 활용하는 도구나 물건을 안전하게 사용할 수 있도록 유의한다.\n[2즐04-01] 익숙한 물건을 낯설게 보거나 기존의 놀잇감에서 새로운 재미를 찾아보면서 엉뚱하고 기발한 상상, 창작의 기쁨을 느낄 수 있도록 한다. 기존의 놀잇감을 새로운 놀잇감으로 고쳐 만들거나 주변의 물건을 놀잇감으로 만드는 과정에서 안전이나 실용성을 고려하되 이를 지나치게 강조하여 상상력이나 창의성을 위축하지 않도록 유의한다.\n[2즐04-02] 학생들이 자유롭게 상상하고 표현하며 놀이에 몰입하여 즐기는 한편, 안심하고 마음껏 활동할 수 있도록 안전하면서도 허용적인 환경을 조성하는 데 주의를 기울인다.\n[2즐04-03] 여럿이 생각을 모아서 전시나 공연 및 놀이에 참여할 기회를 만드는 데 중점을 둔다. 이 과정에서 협력을 경험하고 민주시민 교육과 연계할 수 있다.\n[2즐04-04] 학교 안팎에서 한 경험 중 기억에 남은 경험에 대해 자기만의 의미를 부여해 보는 다양한 활동을 해 보고, 이를 3학년이 되어서 하고 싶은 경험에 대한 기대와 연결할 수 있다."},"2022|체육|3~4학년|운동|1":{"c":"3~4학년군 운동 영역에서는 자신의 체력 수준에 맞는 운동을 하며 즐거움을 느끼고, 체력과 건강을 증진하면서 정서적, 사회적 건강을 유지할 수 있도록 운동과 일상생활에서의 건강 활동을 체험하도록 한다.\n체력 운동에서는 학습자가 자신의 신체 특성과 수준을 고려한 운동 방법을 다양하게 탐색하고 실천하도록 운영한다. 단순한 흥미 위주의 활동을 지양하고 자신의 체력 수준을 점검하며 체력의 중요성을 인식할 수 있는 활동을 선정한다. 건강 활동에서는 학습자 스스로 생활 습관을 점검하면서 건강에 대해 적극적인 관심을 두고 올바른 생활 습관 실천 의지를 가질 수 있도록 운영한다. 이론 중심의 수업보다는 생활 속의 다양한 신체활동을 체험하면서 바람직한 생활 태도를 습관화할 수 있도록 활동을 구성한다.\n3~4학년군의 발달 특성, 학습자의 흥미와 신체활동 능력을 고려하여 수업을 운영한다. 체력 증진에 도움이 되는 다양한 기본 운동 방법을 흥미 있게 구성하여 운동에 관한 관심과 욕구를 가질 수 있도록 한다. 또한 건강한 생활 습관을 자기 주도적으로 실천할 수 있도록 일상생활에서 쉽게 실천할 수 있는 생활 방식을 활용하며, 더욱 생동감 있게 학습할 수 있도록 디지털 기기와 온라인 프로그램의 모의 상황 또는 가상현실 등 다양한 자료를 활용한다.\n3~4학년군 운동 영역에서는 운동과 체력, 기본 운동 방법, 운동과 건강, 건강한 생활 습관에 관한 이해력, 체력과 건강을 효과적으로 관리하기 위한 운동 수행 능력, 일상생활에서 운동과 건강에 적극적인 관심을 갖고 실천할 수 있는 능력을 균형 있게 평가한다.\n체력 운동에서 학습자의 체력 증진 수준을 평가할 때는 단순히 체력 측정 결과 중심으로 평가하기보다는 자신의 체력 증진을 위한 자기 주도적인 계획 수립과 실천, 관리의 과정을 전개했는지를 종합적으로 평가한다. 건강 활동에서는 운동에 기초하면서도 그 밖의 건강과 신체의 안전에 긍정적인 영향을 미칠 수 있는 다양한 건강 행동 및 생활 습관을 일상생활에서 실천하는지를 평가한다.\n3~4학년군 운동 영역 지식에 관한 이해력은 운동과 건강 관련 기본 지식을 중심으로 평가하고, 운동 및 건강 활동 수행 능력과 태도는 건강과 신체의 안전에 영향을 미칠 수 있는 다양한 운동 및 건강 습관을 일상생활에서 꾸준하게 실천하는 과정과 결과를 보여주는 체크리스트, 개인일지, 운동 기능 검사 등을 활용하여 평가한다.\n3~4학년군 운동 영역에서는 범교과 학습 주제인 안전⋅건강 교육과 연계하여 학교와 일상생활에서 안전하고 건강한 생활의 기본 습관을 형성할 수 있도록 체험 중심의 교수⋅학습을 운영하고, 학습자의 변화 과정을 다양한 방법으로 평가한다."},"2022|체육|3~4학년|스포츠|1":{"c":"3~4학년군 스포츠 영역에서는 스포츠의 개념을 이해하고 다양한 유형의 스포츠 활동을 수행하는데 요구되는 기본 움직임과 복합적인 움직임을 탐색하고 간단한 게임 상황에서 시도하도록 한다. 특히 3~4학년군 스포츠 영역은 움직임의 체계적 발달을 위한 입문 단계로서 이동 움직임, 비이동 움직임, 조작 움직임 기술을 신체, 노력, 공간, 관계와 연결한 다양한 복합 움직임 기술의 수행 능력을 기를 수 있도록 충분한 학습 기회를 제공한다.\n스포츠 유형별 기본 기능과 관련된 기본 움직임 기술을 습득하기 위해 신체, 노력, 공간, 관계의 변화에 따라 다양한 기술을 단계적으로 향상할 수 있는 학습 활동을 선정하고 조직한다. 스포츠 유형에 적합한 기본 움직임 기술과 복합적인 움직임 기술을 연결하여 간단한 게임 상황에서 시도하고 익힐 수 있도록 활동을 구성한다. 기본 움직임 기술을 수행할 기회를 충분히 제공하며, 스포츠 경기 방법 자체보다 기본 움직임의 수행 능력을 충실하게 습득할 수 있도록 운영한다.\n3~4학년군 스포츠 영역에서는 스포츠 수행에 필요한 다양한 기본 움직임 기술을 탐색하고 간단한 활동 상황에서 기본 움직임 기술을 시도하고 습득하는 것을 평가한다. 다양한 기본 움직임 기술의 정확하고 효과적인 수행 능력 습득에 평가의 초점을 맞추고, 이를 활용한 움직임 기술의 연결 능력과 스포츠 유형별 기본 기능에 적합한 복합 움직임 기술의 수행 능력을 평가한다.\n기본 움직임 기술을 움직임의 요소에 따라 실제로 다양하게 수행할 수 있는지를 평가하도록 한다. 일회성 평가를 지양하고 간단한 게임 상황에서 각각의 움직임 기술을 상황에 맞게 수행할 수 있는지를 평가한다. 이를 위해 움직임 기술 수행 능력 평가, 체크리스트, 자기 평가 등의 다양한 평가 방법을 학습 상황에 맞게 활용한다.\n3~4학년군 스포츠 영역의 지식에 관한 이해력은 스포츠의 의미와 유형에 관한 이해를 간단한 질의응답이나 평가지를 통해 확인할 수 있으며, 스포츠 관련 움직임 수행 능력은 기본 움직임 기능 및 복합 움직임 기능을 조작적 상황 또는 게임 상황에서 평가할 수 있다. 가치⋅태도의 실천 능력은 지속적인 태도 변화를 관찰하거나 체크리스트, 성찰 일지, 관찰 등의 평가 방법과 함께 수업 상황에서의 실천 여부를 중심으로 평가한다.\n3~4학년군 스포츠 영역에서는 다양한 기본 움직임을 탐색하고 습득하는 과정을 통해 개인별 특성을 존중하고, 상호 존중 및 공동체 의식을 함양할 수 있도록 교수⋅학습을 계획하고 평가한다."},"2022|체육|3~4학년|표현|1":{"c":"3~4학년군 표현 영역에서는 표현 활동의 의미와 움직임 기술의 관계에 관한 이해를 바탕으로, 움직임 요소에 따른 표현 기술을 파악하고, 모방 및 추상 표현 방법, 리듬, 도구 등을 활용한 표현 방법을 탐색하여 발표함으로써 표현 활동의 기본 능력을 기르도록 한다. 표현에 관한 이해의 폭을 넓힐 수 있도록 다양한 표현 사례를 직⋅간접적으로 학습할 기회를 제공한다.\n모방 표현 방법을 학습하면서 모방 대상의 움직임을 충분히 관찰하고 자유로운 방식으로 표현할 수 있는 학습 분위기를 조성하며, 자연 현상과 주변 환경을 모방 대상으로 설정함으로써 생태전환적 관점에서 환경을 이해할 기회를 제공한다. 추상 표현 방법의 경우 느낌이나 생각을 자유롭게 나타내고, 타인의 표현 방법을 존중하는 허용적인 학습 분위기를 조성한다. 리듬 표현에서는 음악뿐만 아니라 자연 현상이나 생활에서 나타나는 규칙적, 불규칙적 리듬에 따라 신체 표현을 할 수 있도록 표현 대상을 다양화한다. 도구를 활용한 표현의 경우 사전에 안전한 도구 사용 방법을 충분히 숙지하고 그 특징을 파악하여 표현 활동에 활용하도록 한다.\n기본 움직임 기술의 표현 방법은 자기 주도적 학습을 통해 다양한 움직임 요소를 반영한 기본 움직임 기술을 탐색할 기회를 제공하고, 탐색한 움직임을 모둠별로 공유할 수 있도록 협력 중심의 수업을 설계하고 운영할 수 있다. 또한 협력하여 만든 작품을 서로 발표하고 감상하는 과정을 통해 표현을 위한 움직임 기술을 넓게 탐색하도록 한다.\n3~4학년군 표현 영역에서는 생각과 느낌을 자유롭게 움직임으로 표현하는 과정에서 인간의 신체적 자유에 대한 기본 권리와 행복추구권을 연계하고, 다양한 표현 방식을 이해하고 존중하는 태도를 학습하도록 한다.\n3~4학년군 표현 영역에서는 표현과 움직임 기술의 관계, 움직임 요소에 따른 다양한 기본 움직임 기술의 이해력, 표현 방법에 따른 움직임 기술의 수행과 구성 능력, 표현 활동 과정에서 나타나는 움직임에 관한 호기심과 감수성을 균형 있게 평가한다.\n모방 대상의 특징을 움직임의 관점에서 파악하고 표현하는 능력, 생각과 느낌을 움직임으로 표현하는 능력, 리듬에 맞춰 다양한 요소에 따라 움직임을 표현하는 능력, 도구의 특성을 활용하여 심미적으로 표현하는 능력을 종합적으로 평가한다.\n3~4학년군 표현 영역에서 표현의 의미와 움직임 기술의 관계에 대한 지식은 지필평가 외에 실제 움직임 표현 과정에서의 이해력을 중심으로 평가한다. 움직임 표현 능력은 표현 동작 검사, 관찰 평가, 프로젝트 평가 등을 활용하여 움직임 기술과 표현 방법의 선택, 동작 수행, 구성의 과정을 종합적으로 평가한다. 가치⋅태도에 관한 평가는 표현 활동의 적극성과 긍정적인 태도 변화를 관찰하거나 수행 일지, 감상문 등을 통해 평가할 수 있다.\n영역\n세부 영역\n신체활동 예시\n운동\n기본 체력운동\n？ 체력운동 관련 기본 움직임 기술(걷기, 달리기, 매달리기, 버티기나 굽히기, 밀기, 당기기 등)\n？ 체력운동 기능(오래 달리거나 걷기, 팔굽혀펴기, 윗몸말아올리기, 왕복달리기 등)\n건강 운동 및 생활 습관\n？ 건강 생활 습관(자세, 체중 및 체형 관리, 위생, 식습관, 정서 관리 활동 등)\n？ 운동 생활 습관(맨손체조, 산책, 계단 오르기, 생활 주변 운동기구 활용하기 등)\n스포츠\n기본 움직임의\n기초 기술\n？ 이동 움직임(방향 전환 달리기, 뛰기, 구르기, 물에서 이동하기 등)\n？ 비이동 움직임(균형잡기, 구부리기, 회전하기, 물에 뜨기 등)\n？ 조작 움직임(던지기, 굴리기, 차기, 잡기, 치기, 튀기기, 몰기, 타기 등)\n스포츠 유형별\n움직임 기술\n？ 기술형 스포츠 유형별 움직임(앞뒤 구르기, 옆돌기, 전력 달리기, 헤엄치기, 발차기 등)\n？ 전략형 스포츠 유형별 움직임(공던지기와 잡기, 공몰기, 공차기와 멈추기, 공치기와 받기, 라켓으로 치기 등)\n？ 생태형 스포츠 유형별 움직임(균형 잡고 이동하기, 타고 버티기, 잡고 오르기 등)\n표현\n기본 움직임의\n기초 표현\n？ 이동 움직임 표현(워킹, 점핑, 호핑, 스키핑, 갤러핑, 리핑, 슬라이딩 등)\n？ 비이동 움직임 표현(펴기, 접기, 비틀기, 제자리 돌기, 털기, 흔들기 등)\n？ 조작 움직임 표현(들기, 돌리기 등)\n기본 움직임의\n표현 방법\n？ 추상 표현(언어 표현, 느낌이나 생각 표현하기 등)\n？ 모방 표현(사물 표현, 인물 표현, 자연 현상 표현하기 등)\n？ 리듬 표현(박자, 강약, 빠르기, 패턴에 따라 표현하기 등)\n？ 도구 표현(줄, 공, 천, 훌라후프 등을 활용하여 표현하기 등)"},"2022|체육|5~6학년|운동|1":{"c":"5~6학년군 운동 영역에서는 체력 유형별로 각 체력 요소에 적합한 운동을 선정하고 자기 수준에 맞는 운동 방법을 찾아 실천하도록 한다. 운동을 통해 신체의 성장과 발달 및 체력 향상뿐만 아니라 정서적, 사회적 성장 발달과의 관계를 파악할 수 있도록 교수⋅학습을 운영한다.\n체력 운동에서는 건강 체력과 운동 체력의 요소를 학습자가 이해하기 쉬운 수준으로 안내하고, 체력 요소별로 다양한 운동 방법을 선정하며, 끈기와 근면함을 바탕으로 자신의 체력을 점진적으로 증진할 수 있도록 단계적으로 학습을 운영한다. 건강 활동에서는 신체 성장에 따른 신체적 변화와 제2차 성징에 대한 이해와 함께 양성평등 감수성을 갖출 수 있도록 운영하고, 다양한 운동을 시도해 보면서 운동이 신체의 성장과 발달, 정서적 건강, 사회적 관계에 긍정적인 영향을 미친다는 것을 체험하도록 한다.\n건강 체력과 운동 체력의 측정 결과를 참고하여 자신의 체력 강점과 약점을 파악하고, 수준에 적합한 운동을 선정하여 안전하게 활동할 수 있도록 운영한다. 개인별 성장 및 발달 속도의 차이, 성별에 따른 차이를 인권 보호 및 양성 평등적 관점에서 수용할 수 있도록 하며, 디지털 도구와 프로그램을 활용하여 지속적이고 자기 주도적인 건강 관리와 체력 운동을 실천하도록 한다.\n5~6학년군 운동 영역에서는 개인적, 사회적으로 올바른 생활 양식의 실천을 민주시민 교육과 양성평등 및 상호 존중의 인권 교육과 연계하여 학습하도록 한다.\n5~6학년군 운동 영역에서는 건강 체력과 운동 체력, 체력 요소별 운동 방법, 운동과 성장 발달, 안전한 생활 습관에 관한 이해력, 체력 측정 결과를 바탕으로 다양한 운동을 안전하게 시도할 수 있는 운동 및 건강 활동 수행 능력, 일상생활에서 체력 운동에 끈기 있고 꾸준하게 참여하면서 개인별 차이를 공감하고 수용하는 태도를 균형 있게 평가한다.\n체력 운동에서는 체력 측정 결과 자체보다는 자신의 체력 수준에 적합한 체력 운동을 선정하고 계획하여 안전하게 실천하는 과정을 중심으로 평가한다. 건강 활동은 학습자가 운동이나 건강 활동을 하면서 자신과 타인의 신체적, 정서적 성장 발달의 차이를 공감하고 배려하면서 건강하고 안전한 생활 습관을 실천하는 태도를 평가한다.\n5~6학년군의 운동 영역의 지식은 체력 운동 및 건강 활동 과정에서의 이해력을 중심으로 평가한다. 체력 운동 및 건강 활동 수행 능력과 태도는 체력 및 건강을 증진할 수 있는 다양한 운동 및 건강 습관을 일상생활에서 꾸준하게 실천하는 과정과 결과를 체력 및 건강 검사, 체크리스트, 개인일지 등을 활용하거나 디지털 도구 및 온라인 교수⋅학습 방법을 적용하여 평가한다."},"2022|체육|5~6학년|스포츠|1":{"c":"5~6학년군 스포츠 영역에서는 3~4학년에서 학습한 스포츠와 움직임에 관한 지식, 기본 움직임 기술과 스포츠 유형별 기본 기능 및 태도를 바탕으로 기술형, 전략형, 생태형 스포츠의 의미와 유형, 기본 기능과 연계한 움직임 기술의 응용 방법과 기본 전략을 학습할 수 있도록 한다. 특히 스포츠 활동을 체험할 수 있는 주변 환경을 아끼는 태도와 목표 달성을 위한 의지를 발휘하며 경기 결과에 집착하지 않고 팀원과 협력하며 동료를 배려하는 태도를 꾸준히 실천할 수 있도록 교수⋅학습을 운영한다.\n기술형 스포츠에서는 동작형, 기록형, 투기형 스포츠의 유형별 목표 달성에 효과적인 응용 기능, 활동 방법, 전략을 파악하고 시도하는 데 중점을 둔다. 기본 움직임 기술을 경기에서 활용할 수 있는 응용 기능으로 발전시켜 학습하면서 기록을 향상하거나, 동작의 정확성을 추구하며, 상대의 기술에 맞춰 상호작용하는 기술형 스포츠의 특징을 학습할 수 있는 변형게임이나 뉴스포츠 등의 활동을 선정하고 운영한다.\n전략형 스포츠에서는 영역형, 필드형, 네트형 스포츠의 유형별로 개인 또는 팀의 전략을 겨루는 활동에 효과적인 응용 기능, 활동 방법, 전략을 파악하고 시도하는 데 중점을 둔다. 학습자가 활동 방법과 기본 전략을 협력적으로 수행하고 역할을 맡으며 민주적 의사결정 과정을 경험하도록 활동을 조직하고, 전략형 스포츠의 기본 전략을 학습할 수 있는 변형게임이나 뉴스포츠 등의 활동을 선정하고 운영한다.\n생태형 스포츠에서는 자연환경형, 생활환경형 스포츠 유형별로 환경과 상호작용하며 즐길 수 있는 활동에 유용한 응용 기능, 활동 방법, 전략을 파악하고 시도하는 데 중점을 둔다. 단위 학교의 환경을 고려한 활동으로 재구성하여 직접 체험하거나 디지털 기술을 활용하여 다양한 활동을 간접적으로 체험할 수 있도록 한다. 또한 가족이나 친구들과 함께 학교 밖 여가활동으로 이어질 수 있는 실천 방법을 안내하고 주변 환경을 보호하는 활동(플로킹, 플로깅 등)을 병행하여 생태적 감수성을 높이도록 한다.\n스포츠 영역에서는 교내외 체육 시설 이용에 따른 안전사고를 예방할 수 있도록 교수⋅학습을 운영한다.\n5~6학년군 스포츠 영역에서는 기술형⋅전략형⋅생태형 스포츠의 의미와 유형, 활동 방법과 기본 전략에 관한 이해력, 스포츠 유형별 기본 기능의 습득을 위한 움직임 기술의 응용 방법과 활동 수행 능력, 목표 달성 과정에서 인내하고 팀원과 협력하며 상대를 배려하고 스포츠 환경을 아끼고 감사하는 태도를 균형 있게 평가한다.\n기술형 스포츠에서는 학습자 수준별로 목표 달성 여부, 수행 과정에서의 변화 정도를 평가한다. 전략형 스포츠에서는 개인별 기본 움직임 기술의 응용 기능 및 전략 수행 능력과 함께 팀별 활동 수행 능력을 함께 평가한다. 생태형 스포츠에서는 생활 및 자연환경의 활용 능력뿐만 아니라 자연환경을 보호하기 위한 활동을 병행함으로써 스포츠 환경을 아끼고 감사하는 태도를 함께 평가한다.\n5~6학년군의 스포츠 영역 지식에 관한 이해력은 자기 점검 및 경기 분석 보고서, 포트폴리오 등을 활용하고, 기본 움직임 기술을 응용한 게임의 기본 기능은 동작 분석용 애플리케이션 등 디지털 도구를 활용한 평가, 게임 수행 능력은 활동 중 기본 기능과 전략을 평가할 수 있는 체크리스트 등을 활용한다. 교육환경의 제약으로 생태형 스포츠를 학습하기 힘든 경우, 간접 체험 활동을 통해 평가할 수 있다."},"2022|체육|5~6학년|표현|1":{"c":"5~6학년군 표현 영역에서는 3~4학년군에서 학습한 표현과 움직임에 관한 지식, 기본 움직임 기술과 표현 유형별 기본 움직임 기술 및 태도를 바탕으로 스포츠 표현, 전통 표현, 현대 표현의 의미와 유형, 기본 움직임 기술의 심미적 응용 동작과 구성 방법을 학습하도록 한다. 스포츠 표현, 전통 표현, 현대 표현의 유형별 다양한 사례를 직⋅간접적으로 체험함으로써 공통점과 차이점을 인식할 수 있도록 교수⋅학습을 운영한다.\n스포츠 표현에서는 기술적 표현과 예술적 표현이 강조되는 활동을 중심으로 신체활동을 선정하되 움직임이나 동작의 개수, 난이도를 고려하여 절차와 규칙을 간소화한 형식으로 활동을 구성한다. 전통 표현에서는 우리나라와 세계 여러 나라의 전통 표현을 체험함으로써 문화와 관련된 움직임 표현의 특성을 파악할 수 있도록 하며, 다양한 문화를 존중하고 수용하는 태도를 기를 수 있도록 한다. 현대 표현의 경우 최근의 문화적 변화를 반영한 다양한 표현 사례를 직⋅간접적으로 체험할 기회를 제공함으로써 표현 문화의 개인적, 사회적 가치를 인식하도록 하며, 창의적이고 자유로운 표현이 가능한 분위기를 조성한다.\n표현 유형별 의미와 특징을 활동 과정에서 자연스럽게 이해할 수 있도록 하며, 언어와 이미지, 영상 등을 활용한다. 표현 유형별 움직임 기술의 응용 동작은 기본 및 복합 움직임 기술을 표현 유형별 동작에 맞게 연결하되, 다양한 표현 동작을 학습자 스스로 탐색할 수 있도록 한다. 모둠별 협력 수업을 통해 표현 동작을 공유하고 개선할 수 있도록 운영하고, 동작의 연결, 대형의 선택, 예술적 표현 방법 등 표현 동작과 구성 방법을 설계하며, 작품의 의도와 표현 동작의 심미적 특성을 고려하여 기본적인 감상이 이루어지도록 한다. 특히 모둠별 작품 구성 및 발표 과정에서 발생할 수 있는 안전사고를 예방할 수 있도록 교수⋅학습을 운영한다.\n5~6학년군 표현 영역에서는 표현 유형에 따라 심미성을 추구하는 다양한 표현 방식을 존중하는 태도를 기를 수 있도록 한다. 이를 위해 세계 여러 나라의 전통 표현을 체험하면서 문화와 전통의 다양성을 존중하는 다문화 교육과 연계하여 운영할 수 있다.\n5~6학년군 표현 영역에서는 표현 활동 유형별 움직임 기술의 공통점과 차이점에 관한 이해, 유형별 특성을 반영한 움직임 기술의 표현 능력, 작품을 구성하고 감상할 수 있는 능력, 다양한 표현 활동 유형을 수용하는 태도와 움직임 표현의 아름다움을 추구하는 태도를 균형 있게 평가한다.\n스포츠 표현은 움직임 기술의 수행과 함께 심미적 표현 능력, 전통 표현에서는 표현에 담긴 문화적 특성을 이해하고 동작을 구성하여 발표하는 능력, 현대 표현에서는 타인의 작품을 공감하고 자신의 생각과 감정을 자유롭게 표현하며 감상하는 능력을 종합적으로 평가한다.\n5~6학년군 표현 영역에서 표현 활동 유형별 의미와 특성에 관한 지식은 단순 지필평가보다는 유형별 표현 활동 과정에서의 이해력을 평가한다. 유형별 움직임 표현 능력은 표현 동작 평가, 관찰 평가, 동료 평가, 포트폴리오 평가 등을 활용하며, 유형별 특성이 잘 드러나도록 표현 방법의 선택, 수행, 구성 및 감상의 과정을 종합적으로 평가한다. 가치⋅태도에 관한 평가는 다양한 표현 활동 유형을 수용하고 표현 유형별 움직임의 아름다움을 추구하는 태도를 확인할 수 있는 관찰 평가, 개인일지, 감상문 등의 평가 방법을 활용한다.\n영역\n세부 영역\n신체활동 예시\n운동\n건강 체력 및\n운동 체력\n？ 건강체력 관련 운동(근력, 근지구력, 심폐지구력, 유연성 운동 등)\n？ 운동체력 관련 운동(순발력, 민첩성, 평형성, 협응성 운동 등)\n성장 및 안전 활동\n？ 성장 관련 활동(신체 변화 및 제2차 성징 이해 활동, 감정 수용 및 조절 활동, 관계 형성 활동, 성 건강 활동 등)\n？ 안전 활동(운동 관련 안전사고 예방 및 대처 활동, 생활 안전사고 예방 및 대처 활동, 자연환경 변화 대처 활동 등)\n스포츠\n기술형 스포츠\n유형별 활동\n？ 기록형(육상 활동, 경영 활동, 빙상 활동, 표적 활동 등)\n？ 동작형(매트 활동, 뜀틀 활동, 평균대 활동 등)\n？ 투기형(태권도 활동, 씨름 활동 등)\n전략형 스포츠\n유형별 활동\n？ 영역형(축구형 게임, 농구형 게임, 핸드볼형 게임, 럭비형 게임, 하키형 게임 등)\n？ 필드형(야구형 게임 등)\n？ 네트형(배구형 게임, 배드민턴형 게임, 족구형 게임, 탁구형 게임, 테니스형 게임 등)\n생태형 스포츠\n유형별 활동\n？ 생활환경형(골프형 활동, 플라잉디스크형 활동, 자전거타기형 활동, 인라인스케이팅 활동, 스포츠클라이밍 활동, 민속놀이 등)\n？ 자연환경형(오리엔티어링, 등산 활동, 캠핑 활동, 수상 활동, 설상 활동, 승마 활동 등)\n표현\n스포츠 표현 활동\n？ 창작체조 활동, 음악줄넘기 활동 등\n전통 표현 활동\n？ 우리나라의 민속무용 활동, 외국의 민속무용 활동 등\n현대 표현 활동\n？ 라인댄스 활동, 댄스스포츠 활동, 스트리트댄스 활동 등"},"2015|과학|3~4학년|물질의 성질|1":{"m":"학교, 가정, 우리 주변의 여러 가지 물질을 관찰하고 분류하는 활동을 통하여 물질이 지니는 다양한 성질을 이해하고, 이러한 성질에 따라 만들어진 물체의 기능을 연결 지을 수 있도록 지도할 수 있다.\n물질의 성질 변화를 활용한 재미있고 간단한 실험을 실시하고, 이러한 변화가 일어나는 과학적 원리, 개념 등에 대해서는 다루지 않도록 주의한다.\n이 단원은 초등학교 3~4학년군의 ‘물질의 상태’, 5~6학년군의 ‘여러 가지 기체’, 중학교 1~3학년군의 ‘물질의 특성’과 연계된다.","v":"물질의 다양한 성질을 비교하고 분류하는 활동을 관찰 평가하거나 물질의 성질과 관련된 이해 정도를 알아보는 서술형 평가를 할 수 있다.\n물질의 성질을 고려하여 여러 가지 기능을 하는 물체를 설계한 결과물을 발표하거나 토의하는 활동을 관찰 평가할 수 있다.","l":"물체와 물질, 물질의 성질, 물체의 기능, 물질의 변화","q":"물체가 어떤 재료로 만들어졌는지 조사하기\n물체의 기능과 물질의 성질 관계 짓기\n물질의 성질 변화 관찰하기"},"2015|과학|3~4학년|자석의 이용|1":{"m":"자석은 학생의 호기심과 흥미의 대상이므로 관찰, 예상, 추리 등 탐구 활동을 학생들이 직접 경험하도록 지도한다.\n이 단원은 초등학교 3~4학년군의 ‘혼합물의 분리’, 5~6학년군의 ‘전기의 이용’, 중학교 1~3학년군의 ‘전기와 자기’와 연계된다.","v":"학생들이 자석의 성질에 대한 탐구 활동을 수행하는 동안 학생의 행동을 관찰하는 수행평가를 실시할 수 있다.","l":"자석 사이에 작용하는 힘(자기력), 자석의 성질, 자석의 쓰임새","q":"자석 주변에서 나침반의 움직임 관찰하기\n자석으로 나침반 만들기\n자석을 이용한 장난감 만들기"},"2015|과학|3~4학년|동물의 생활|1":{"m":"동물이라는 소재 자체가 학생의 호기심과 흥미의 대상이며 관찰을 중심으로 한 탐구 활동의 좋은 소재가 된다. 따라서 ‘동물의 생활’에서는 관찰을 중심으로 여러 가지 동물을 생김새와 특징에 따라 분류하는 능력이 형성될 수 있는 활동을 할 수 있도록 한다.\n단순 암기 활동을 지양하고 분류 기준을 정하여 동물을 분류하는 활동을 할 수 있도록 한다. 이때 동물의 형태적 특징을 찾고 그 특징에 따라 분류하는 활동을 하도록 하며 생물학적 분류 체계는 다루지 않는다.\n동물 생체 모방 사례는 생김새를 중심으로 간단한 활용 사례를 제시한다.\n이 단원은 초등학교 3~4학년군의 ‘동물의 한살이’, 5~6학년군의 ‘생물과 환경’, 중학교 1~3학년군의 ‘생물의 다양성’, ‘동물과 에너지’와 연계된다.","v":"동물의 생활은 관찰 결과를 바탕으로 기준을 정해 다양한 분류 활동이 가능하므로 학생들이 분류하는 과정을 관찰 평가하거나 학생들의 분류 결과물을 바탕으로 왜 그렇게 분류하였는지 면담 평가를 실시할 수 있다.\n동물을 자세히 조사하는 활동에서 생김새와 생활 방식에 대한 발표 결과물을 이용해 포트폴리오 평가를 실시할 수 있다.","l":"동물의 생김새, 특징에 따른 동물 분류, 다양한 환경에 사는 동물, 생활 속 동물 모방 사례","q":"비슷한 특징을 가진 동물들끼리 분류하기\n다양한 환경에 서식하는 동물의 생김새와 생활 방식 조사하기\n동물의 특징을 모방하여 생활 속에서 활용하는 예 조사하기"},"2015|과학|3~4학년|지표의 변화|1":{"m":"우리 주변의 여러 가지 흙, 강 주변 지형, 바닷가 주변 지형 등은 관찰과 실험, 조사를 중심으로 한 탐구 활동의 좋은 소재가 된다. 따라서 관찰을 통해 여러 장소의 흙을 비교하고, 흙은 바위나 돌이 부서져 만들어진다는 것을 다룬다.\n강과 바닷가 주변 지형의 특징은 야외 관찰 혹은 시청각 자료를 이용하여 지도할 수 있다.\n지표 변화의 주요 요인은 흐르는 물에 의한 침식, 운반, 퇴적작용으로 설명하며, 홍수나 지진 등과 같은 급격한 변화는 다루지 않는다.\n이 단원은 초등학교 3~4학년군의 ‘지층과 화석’, ‘화산과 지진’, ‘지구의 모습’, 중학교 1~3학년군의 ‘지권의 변화’와 연계된다.","v":"여러 장소의 흙의 특징을 관찰하여 작성한 조사 보고서를 평가할 수 있다.\n강과 바닷가 주변 지형의 특징을 흐르는 물 및 바닷물의 작용과 관련지을 수 있는지를 알아보는 서술형 평가를 실시할 수 있다.\n강 주변이나 바닷가 주변 조사를 위한 계획서 및 조사하여 발표한 결과물에 대해 동료 평가를 실시할 수 있다.","l":"흙의 생성과 보존, 강 주변 지형의 특징, 바다 주변 지형의 특징","q":"장소에 따른 흙의 특징 조사하기\n흙 언덕을 만들고 물을 흘려보낸 후, 깎이는 곳과 쌓이는 곳 관찰하기"},"2015|과학|3~4학년|식물의 생활|1":{"m":"여러 가지 식물의 줄기, 잎, 꽃 등으로 분류 활동을 할 수 있으나, 주변에서 쉽게 구할 수 있는 식물의 잎을 대상으로 활동하도록 한다.\n초등학교 5~6학년군의 ‘식물의 구조와 기능’에서는 각 부위의 구조와 기능을 이해하는데 중점을 두고 다룰 예정이므로 이 단원에서는 여러 가지 식물들의 외형상 특징을 중심으로 관찰, 분류 활동에 중점을 둔다.\n단순 암기 활동을 지양하고 분류 기준을 정하여 식물을 분류하는 활동을 할 수 있도록 하며, 이때 생물학적 분류 체계는 다루지 않는다.\n식물 생체 모방 사례는 식물의 생김새를 중심으로 간단한 활용 사례를 제시한다.\n이 단원은 초등학교 3~4학년군의 ‘식물의 한살이’, 5~6학년군의 ‘생물과 환경’, ‘식물의 구조와 기능’, 중학교 1~3학년군의 ‘생물의 다양성’, ‘식물과 에너지’와 연계된다.","v":"식물을 관찰한 결과를 바탕으로 기준을 정해 분류 활동을 해 보는 보고서 평가를 실시할 수 있다.","l":"식물의 생김새, 특징에 따른 식물 분류, 다양한 환경에 사는 식물, 생활 속 식물 모방사례","q":"비슷한 특징을 가진 식물들끼리 분류하기\n다양한 환경에 서식하는 식물의 생김새와 생활 방식 조사하기\n식물의 특징을 모방하여 생활 속에서 활용하는 예 조사하기"},"2015|과학|3~4학년|지층과 화석|1":{"m":"지층과 화석이라는 소재가 학생의 흥미와 호기심의 대상이므로 주로 관찰을 중심으로 수업을 계획하여 전개하도록 한다.\n이 단원에서는 여러 가지 지층, 퇴적암, 화석 등을 살펴서 그 특징을 찾아내고 추리할 수 있는 능력을 형성할 수 있는 활동이 필요하다. 이때, 학생들이 직접 조사한 자료를 활용할 수 있다. 학생들이 박물관에서 찍은 사진이나 가족과 여행지에서 찍은 사진을 이용하여 관련 특징을 설명하면 학습 효과를 높일 수 있을 것이다.\n이 단원은 초등학교 3~4학년군의 ‘지표의 변화’, ‘화산과 지진’, 중학교 1~3학년군의 ‘지권의 변화’와 연계된다.","v":"지층, 퇴적암, 화석에 대한 관찰 결과를 바탕으로 분류 기준을 정하여 다양하게 분류하는 활동이 가능하므로 학생이 분류하는 과정이나 그 결과물에 대해 관찰 평가할 수 있다.\n화석을 관찰한 결과를 토대로 옛날에 살았던 생물의 모양과 특징을 추리하거나 화석이 발견되는 지역의 환경을 추리하는 발표 결과물로 평가할 수 있다.","l":"지층, 지층의 형성과 특성, 퇴적암, 화석, 화석의 생성, 과거 생물과 환경","q":"지층이 쌓이는 순서 실험하기\n퇴적암 관찰하기\n화석을 관찰하고 화석 모형 만들기"},"2015|과학|3~4학년|물질의 상태|1":{"m":"액체와 기체는 고체와 달리 모양이 일정하지 않으므로 다양한 활동을 통하여 상태에 따른 성질을 배울 수 있도록 한다.\n이 단원은 초등학교 3~4학년군의 ‘물질의 성질’, ‘물의 상태 변화’, 5~6학년군의 ‘여러 가지 기체’, 중학교 1~3학년군의 ‘물질의 특성’과 연계된다.","v":"물질의 상태에 따른 특징을 이해하기 위한 실험 과정과 관찰 결과를 발표하는 과정을 관찰 평가하거나 학생들의 이해 정도를 알아보기 위한 실험 보고서 평가를 실시할 수 있다.\n탐구 활동 중 모둠원과의 상호 작용과 의사소통하는 과정을 관찰 평가하여 과학적 태도를 평가할 수 있다.","l":"고체, 액체, 기체, 기체의 무게","q":"기체가 공간을 차지하고 있음을 알아보는 실험하기\n기체가 무게가 있음을 알아보는 실험하기"},"2015|과학|3~4학년|소리의 성질|1":{"m":"다양한 소리의 발생, 전달, 반사 등을 학생이 직접 관찰하고 관찰한 내용을 스스로 설명해 보도록 지도할 수 있다.\n소리의 세기나 높낮이와 같은 과학적 용어의 뜻을 알고 올바르게 사용하도록 하며 일상생활의 문제를 토의할 때 과학적 이해와 증거에 기초할 수 있도록 지도할 수 있다.\n이 단원은 중학교 1~3학년군의 ‘빛과 파동’과 연계된다.","v":"소리의 성질을 올바르게 이해하고 있는지 다양한 일상생활 속의 상황을 제시하여 평가할 수 있다.\n일상생활에서 소음을 줄이기 위한 방법을 토의하는 과정에서 과학 지식의 적용 능력, 과학적 용어의 올바른 사용 능력 등을 평가할 수 있다.","l":"소리의 발생, 소리의 세기, 소리의 높낮이, 소리의 전달","q":"소리를 내는 물체의 떨림 관찰하기\n세기와 높낮이가 다른 소리 만들기\n일상생활에서 소음을 줄이는 방법 토의하기"},"2015|과학|3~4학년|물체의 무게|1":{"m":"초등학교 수준에서는 질량을 정의하기 어렵기 때문에 무게로 물체의 양을 나타내고 질량은 도입하지 않는다.\n일상생활에서 무게 측정이 필요한 이유와 중요성에 대해 다양한 사례를 가지고 토론, 발표하도록 지도하며 간단한 저울을 설계하여 제작, 평가하는 과정은 모둠별 협동 학습을 통해 지도할 수 있다.\n이 단원은 중학교 1~3학년군의 ‘여러 가지 힘’과 연계된다.","v":"용수철저울로 물체의 무게를 측정하여 바르게 읽고 기록할 수 있는지를 알아보기 위해 관찰 평가나 구술 평가 등의 수행평가를 실시할 수 있다.","l":"무게, 수평 잡기, 용수철저울의 원리, 간단한 저울 만들기","q":"수평 잡기로 물체의 무게 비교하기\n용수철저울로 물체의 무게 재기\n간단한 저울 만들기"},"2015|과학|3~4학년|동물의 한살이|1":{"m":"동물의 한살이 관찰을 위해서는 주변에서 쉽게 구할 수 있으며, 배추흰나비와 같이 한살이 기간이 짧은 동물을 선택하는 것이 좋다.\n이 단원에서는 한살이 과정을 아는 것뿐만 아니라 동물 관찰을 통하여 동물에 대한 관심과 호기심을 증대시키는 것도 중요한 목표이므로 동물을 직접 관찰하는 활동을 권장하며, 보조 학습 자료로 동영상이나 인터넷을 활용할 수 있다. 학년 수준을 고려해 글과 그림으로 한살이를 표현해 보도록 지도할 수 있다.\n동물의 한살이 관찰에는 시간이 많이 소요되므로 학습이 시작되기 전에 관찰 대상을 미리 준비해야 하며, 교수·학습 전개 시 수업 차시에 따라 연속하여 진행하기에는 무리가 있으므로 동물의 한살이 정도에 맞추어 융통성 있게 수업 시간을 재구성하는 것이 좋다.\n이 단원은 초등학교 3~4학년군의 ‘동물의 생활’, 5~6학년군의 ‘다양한 생물과 우리 생활’, 중학교 1~3학년군의 ‘생물의 다양성’, ‘동물과 에너지’, ‘생식과 유전’과 연계된다.","v":"동물의 어린 시기와 다 자랐을 때의 생김새가 같거나 다른 동물을 찾아 비교하여 설명할 수 있는지 서술하도록 하여 평가할 수 있다.\n동물의 한살이에서 여러 동물을 비교하여 공통점을 찾아 설명할 수 있는지를 알아보는 서술형 평가를 할 수 있다.\n학생이 직접 관찰하고 싶은 동물을 선정하여 한살이 전 과정을 탐구한 결과를 기록하는 조사 보고서 평가를 할 수 있다.","l":"동물의 한살이, 동물의 암·수, 동물의 암·수 역할, 완전 탈바꿈, 불완전 탈바꿈","q":"동물의 한살이 관찰하기\n여러 가지 동물의 한살이 비교하기"},"2015|과학|3~4학년|화산과 지진|1":{"m":"화산과 지진이라는 학습 주제는 관찰과 토의를 중심으로 한 탐구 활동의 좋은 소재이지만 학생들이 화산 활동과 지진을 직접적으로 관찰하기 어려우므로, 화산 활동이나 지진과 관련된 동영상을 시청하고 모형을 만들어 비교하는 활동 등이 필요하다.\n영상을 이용하여 화산 활동으로 다양한 물질들이 분출됨을 인식하게 하고, 화산 활동과 지진을 모형실험으로 지도하는 경우에는 실제 화산 활동 및 지진과 비교하여 같은 점과 다른 점을 지도할 수 있다. 특히 화산 모형실험에서는 안전에 유의한다.\n토의 중심의 수업을 진행할 때는 토의에 적극 참여하도록 자유로운 분위기를 조성할 필요가 있다.\n이 단원은 초등학교 3~4학년군의 ‘지표의 변화’, ‘지층과 화석’, ‘지구의 모습’, 중학교 1~3학년군의 ‘지권의 변화’와 연계된다.","v":"실제 화산 활동과 지진과 모형실험 결과를 비교하여 같은 점과 다른 점을 찾아내게 하거나 화산에 대한 흥미와 관심을 파악하기 위한 서술형 평가를 실시할 수 있다.\n화산 활동과 지진이 우리 생활에 미치는 영향에 대한 조사, 안전하게 대피하는 방법에 대한 토의 과정 등에 대하여 자기 평가와 상호 평가를 실시할 수 있다.","l":"화산, 화산 활동, 화산 분출물, 화성암의 생성 과정, 화강암, 현무암, 지진, 지진 대처 방법","q":"화산 활동 모형 만들기\n화강암과 현무암 관찰하기\n화산과 지진의 피해 사례 조사하기"},"2015|과학|3~4학년|혼합물의 분리|1":{"m":"일상생활에서 볼 수 있는 대부분의 물질은 혼합물로 존재하기 때문에 필요한 물질을 얻기 위하여 혼합물을 분리하는 것은 매우 중요하다. 학생들이 혼합물이 무엇이고 왜 분리하는지 이해할 수 있도록 다양한 사례를 제시하거나 토의 수업을 실시할 수 있다.\n혼합물을 구성하는 물질의 특성을 고려하여 혼합물을 분리하는 다양한 실험을 설계하고 수행하도록 지도할 수 있다.\n이 단원은 초등학교 3~4학년군의 ‘자석의 이용’과 중학교 1~3학년군의 ‘물질의 특성’과 연계된다.","v":"혼합물의 개념을 이해하고, 혼합물을 분리하는 까닭에 대한 토의 과정을 관찰 평가하거나 혼합물의 특성을 고려하여 혼합물을 분리하기 위한 실험을 설계하고 수행하는 과정을 실험 보고서 형태로 평가할 수 있다.","l":"혼합물, 혼합물의 분리, 거름, 증발","q":"고체 혼합물 분리하기\n거름 실험하기\n증발 실험하기"},"2015|과학|3~4학년|식물의 한살이|1":{"m":"식물의 한살이 관찰을 위해서는 주변에서 쉽게 구할 수 있고 강낭콩과 같이 한살이 기간이 짧은 식물을 선택하는 것이 좋다.\n식물 관찰을 통하여 식물에 대한 관심과 호기심을 증대시키는 것도 중요한 목표이므로 식물을 재배하고 관찰하는 활동을 권장하며 보조 학습 자료로 동영상이나 인터넷을 활용할 수 있다.\n식물의 한살이의 교수·학습 전개 시 수업 차시에 따라 연속하여 진행하기에는 무리가 있으므로 식물의 한살이 정도에 맞추어 융통성 있게 수업 시간을 재구성하는 것이 좋다.\n이 단원은 초등학교 3~4학년군의 ‘식물의 생활’, 5~6학년군의 ‘다양한 생물과 우리 생활’, 중학교 1~3학년군의 ‘생물의 다양성’, ‘식물과 에너지’, ‘생식과 유전’과 연계된다.","v":"한살이 관찰에 적합한 식물을 선택하여 관찰 계획을 세우고, 직접 식물을 기르며 한살이를 관찰한 결과를 그림, 사진, 표, 그래프 등을 이용해 정리하도록 한 후 포트폴리오 평가를 할 수 있다.","l":"씨가 싹트는 조건, 식물의 한살이","q":"씨가 싹트거나 자라는데 필요한 조건 찾기\n한살이 관찰하기\n여러 가지 식물의 한살이 비교하기"},"2015|과학|3~4학년|물의 상태 변화|1":{"m":"물의 상태가 변할 때 부피와 무게 변화를 비교하고 이러한 변화가 우리 생활과 어떤 관계가 있는지 직접 찾아 볼 수 있도록 기회를 제공하거나 다양한 사례를 제시할 수 있다.\n이 단원은 초등학교 3~4학년군의 ‘물질의 상태’, 중학교 1~3학년군의 ‘물질의 상태 변화’와 연계된다.","v":"물의 세 가지 상태와 상태 변화의 특징을 관찰하는 과정을 평가할 수 있고, 이를 일상생활의 문제 해결에 활용할 수 있는지 과학 글쓰기 평가를 실시할 수 있다.\n실험 결과를 바탕으로 모둠원들과 과학적 의사소통을 통하여 결론을 이끌어 낼 수 있는지 관찰 평가할 수 있다.","l":"물의 상태 변화, 증발, 끓음, 응결","q":"물과 얼음의 상태 변화에서 부피와 무게 변화 비교하기\n물이 증발할 때와 끓을 때의 특징 관찰하기\n수증기가 응결되는 현상 관찰하기"},"2015|과학|3~4학년|그림자와 거울|1":{"m":"이 단원에서는 관찰 사실에 근거한 논리적인 추리를 해야 하므로 실험 활동뿐만 아니라 토의, 추리 활동을 많이 할 수 있도록 지도한다.\n전등을 이용하는 실험에서는 가능한 크기가 작은 전등을 사용하는 것이 좋다.\n이 단원은 초등학교 5~6학년군의 ‘빛과 렌즈’, 중학교 1~3학년군의 ‘빛과 파동’과 연계된다.","v":"학생의 사고 과정이나 추리 능력을 평가하기 위해서는 선다형 문항보다는 학생들이 빛의 진행 경로를 그려 보도록 하는 서답형 문항을 활용한 평가가 바람직하다.\n전등과 물체 사이의 거리에 따른 그림자의 크기 변화를 관찰하는 활동에서는 변인을 조작하는 능력을 관찰 평가로 실시할 수 있다.","l":"평면거울, 빛의 반사, 그림자, 빛의 직진, 그림자 크기, 거울의 쓰임새","q":"투명한 물체와 불투명한 물체의 그림자 비교하기\n전등과 물체 사이의 거리에 따른 그림자의 크기 변화 관찰하기\n물체와 평면거울에 비친 모습 비교하기"},"2015|과학|3~4학년|지구의 모습|1":{"m":"지구와 달은 가장 친근한 천체로, 조사를 중심으로 한 탐구 활동의 좋은 소재가 된다. 이 단원에서는 지구와 달을 조사한 내용을 중심으로 의사소통하여 공통점과 차이점을 찾도록 하는 활동이 필요하다.\n생명체가 살고 있는 천체로서 지구의 특징을 강조하되, 대기나 해수의 층상 구조에 대해서는 다루지 않는다. 달을 직접 관찰하는 활동을 하면 학생들의 호기심을 자극할 수 있지만, 학교와 학생의 여건을 고려하여 도서 자료, 시청각 자료와 모의실험 자료, 영상 자료 등으로 대체할 수도 있다.\n이 단원은 초등학교 3~4학년군의 ‘지표의 변화’, ‘화산과 지진’, ‘지층과 화석’, 5~6학년군의 ‘지구와 달의 운동’, 중학교 1~3학년군의 ‘지권의 변화’, ‘태양계’와 연계된다.","v":"구체적인 조사 관점을 제공하고 지구와 달을 조사하여 발표하도록 과제를 제시하고 그 결과를 보고서로 평가할 수 있다.\n생명체가 살 수 있는 지구의 특징을 주제로 한 토론 평가나 과학 글쓰기 평가를 실시할 수 있다.","l":"지구의 모양, 지구 표면, 바다의 특징, 지구의 대기, 달의 모양, 달 표면, 달의 환경","q":"스마트 기기를 활용하여 다양한 지구 표면의 모습 찾아보기\n지구의 육지와 바다 면적 비교하기\n달의 표면 관찰하기"},"2015|과학|3~4학년|물의 여행|1":{"m":"날씨 현상, 물 부족 현상과 관련된 다양한 사진 자료나 멀티미디어 자료를 조사하고, 이를 수업에 활용하여 물의 순환이 어떻게 일어나고, 물이 왜 소중한지를 인식하도록 한다. 물의 순환 과정을 알아보는 간단한 실험 활동을 실시하고, 그 결과를 그림이나 글로 표현하여 생각을 정리하게 할 수 있다.\n물 자원을 효과적으로 이용하는 방법을 조사하고 일상생활에서 실천할 수 있도록 한다.\n이 단원은 3~4학년군의 ‘물의 상태 변화’, 5~6학년군의 ‘식물의 구조와 기능’, ‘생물과 환경’, ‘날씨와 우리 생활’, 중학교 1~3학년군의 ‘수권과 해수의 순환’, ‘식물과 에너지’, ‘동물과 에너지’와 연계된다.","v":"물의 순환 과정과 관련된 다양한 사례를 조사하고 정리한 결과를 평가하거나, 물의 순환과 관련된 실험 과정을 관찰 평가하거나, 물의 순환 과정을 글과 그림으로 표현하게 하여 그 결과물을 평가할 수도 있다.\n탐구 활동 과정에서 얻어진 결과물을 실제 자연 현상에서 예를 찾아보는 활동 등을 평가하거나 토의 과정을 통해 평가할 수도 있다.","l":"증산 현상, 증발, 물의 상태 변화, 물의 순환","q":"물의 순환 과정을 알아보는 모형 실험하기\n물 부족 현상을 해결하기 위한 방법 토의하기"},"2015|과학|5~6학년|온도와 열|1":{"m":"전도, 대류 개념은 일상생활의 예를 통하여 그 개념을 이해하는 것이 효과적이다.\n열 현상에 대한 학생의 이해를 일상생활의 다양한 현상과 연계지어 표현할 수 있도록 과학 글쓰기 활동을 할 수 있다.\n열전달과 관련된 실험을 하는 경우에는 화상, 화재 등의 안전사고에 유의한다.\n이 단원은 초등학교 3~4학년군의 ‘물의 상태 변화’, 5~6학년군의 ‘날씨와 우리 생활’, 중학교 1~3학년군의 ‘열과 우리 생활’과 연계된다.","v":"물체의 온도 변화를 측정하거나 열전도 빠르기를 비교하는 등 이 단원에서는 실험 활동이 많으므로 실험 보고서 작성을 통해 수행평가를 실시할 수 있다.","l":"온도, 전도, 대류, 열의 이동, 단열","q":"여러 가지 물체나 장소의 온도 측정하기\n온도가 다른 두 물체를 접촉할 때 두 물체의 온도 변화 측정하기\n고체 물질의 열전도 빠르기 비교하기\n액체나 기체에서 대류 현상 관찰하기"},"2015|과학|5~6학년|태양계와 별|1":{"m":"태양계와 별은 학생들에게 흥미와 호기심의 대상으로, 학생들이 조사한 내용을 중심으로 한 탐구 활동의 좋은 소재가 된다. 따라서 이 단원에서는 태양계의 크기와 태양으로부터 행성까지의 거리 등에 관한 조사 활동을 통하여 태양계의 광대함을 체감하도록 한다.\n모형이나 시청각 자료, 천체 관측 소프트웨어 등을 이용하여 천체에 대한 공간적 이해를 도울 수 있다. 특히 야간에 별이나 행성 등을 관찰할 경우 안전 사항을 준수하도록 한다.\n이 단원은 초등학교 3~4학년군의 ‘지구의 모습’, 5~6학년군의 ‘지구와 달의 운동’, 중학교 1~3학년군의 ‘태양계’, ‘별과 우주’와 연계된다.","v":"구체적인 조사 관점을 제공하여 태양계 행성이나 별자리를 조사·발표하도록 과제를 제시하고 그 결과물을 평가할 수 있다.\n북쪽 하늘의 별자리에서 북극성을 찾을 수 있는지를 파악하기 위한 수행평가를 실시할 수 있다.","l":"에너지원으로서 태양, 태양계 행성, 행성의 크기와 거리, 별의 정의, 별자리, 북쪽 하늘 별자리, 북극성","q":"밤하늘에서 행성과 별의 관측상의 차이점 찾아보기\n태양계 행성들의 상대적 크기와 거리 비교하기\n별자리를 이용한 방향 찾아보기"},"2015|과학|5~6학년|용해와 용액|1":{"m":"용해의 과정과 개념을 이해하도록 다양한 물질을 물에 녹여보는 실험을 하고 관찰하게 할 수 있다. 용해 과정에서 물질이 사라지거나 없어진다는 오개념을 갖지 않도록, 물질을 녹이기 전과 후의 무게를 비교하는 실험을 하게 할 수 있다.\n물질이 용해하는 과정을 현상적인 수준에서 관찰하는 활동 위주로 지도하되, 이러한 현상이 일어나는 과학적 이유, 원리 등에 대해서는 다루지 않는다.\n이 단원은 초등학교 3~4학년군의 ‘물질의 상태’, ‘혼합물의 분리’, 5~6학년군의 ‘산과 염기’, 중학교 1~3학년군의 ‘물질의 특성’과 연계된다.","v":"다양한 물질의 용해 과정을 관찰하게 하고, 관찰한 결과를 그림, 글 등으로 표현하게 한 후 이를 발표하는 과정을 평가할 수 있다.\n용액의 진하기를 비교하는 방법을 고안하여 설계하는 과정을 보고서 형태로 평가하거나 이렇게 고안한 아이디어를 바탕으로 실제로 실험하는 과정을 관찰 평가할 수 있다.","l":"용해, 용액, 용질의 종류, 용질의 녹는 양, 용액의 진하기","q":"다양한 물질의 용해 현상 관찰하기\n용해 전과 후의 무게 측정하기\n용해에 영향을 주는 요인 찾기\n용액의 진하기를 비교하는 기구 만들기"},"2015|과학|5~6학년|다양한 생물과 우리 생활|1":{"m":"균류와 원생생물은 다양한 도구를 사용하여 생물을 직접 관찰할 수 있도록 하며, 지역의 특성에 따라 실제로 관찰 가능한 소재로 변경하여 다루어도 무방하다.\n세균은 사진 자료와 동영상 자료 등을 통해 관찰할 수 있도록 한다.\n세균이나 곰팡이 등이 우리 생활에 미치는 영향이나 첨단 생명과학의 이용 사례는 실생활에 많이 반영된 자료들을 중심으로 수업이 이루어지도록 한다.\n이 단원은 초등학교 3~4학년군의 ‘동물의 생활’, ‘식물의 생활’, 중학교 1~3학년군의 ‘생물의 다양성’과 연계된다.","v":"생물을 관찰하기 위한 도구 사용 능력, 자료를 정리하는 과정에서 친구들과 함께 의견을 교환하는 의사소통 능력과 인성적 측면까지 포함한 관찰 평가를 할 수 있다.\n현미경을 이용한 실험을 실시하여 실험 보고서 평가를 하거나 첨단 생명과학이 이용된 사례 결과물을 바탕으로 조사 보고서 평가를 실시할 수 있다. 단, 현미경의 명칭 및 사용법에 대해 지식을 요구하는 지필 평가는 지양한다.","l":"현미경 사용법, 균류·원생생물·세균의 특징과 사는 곳, 균류·원생생물·세균의 이용, 첨단 생명과학과 우리 생활","q":"현미경 사용법 익히기\n곰팡이, 해캄 등 관찰하기\n세균, 곰팡이 등이 우리 생활에 미치는 영향 조사하기"},"2015|과학|5~6학년|생물과 환경|1":{"m":"먹이 사슬 놀이, 생물과 환경의 상호 작용을 알아보는 게임 등과 같은 모의 활동을 통하여 생태계의 구성 요소들이 상호 관련되어 있음을 인식하게 한다.\n생물과 환경은 프로젝트 학습의 좋은 소재가 될 수 있다. 환경 오염의 종류와 원인, 이에 따른 생태계 복원 계획을 구상해 소집단이나 학생 개인별로 주제를 선정하고 스스로 탐구하도록 하여 자기 주도적 학습력 신장과 창의력뿐만 아니라 문제 해결력을 기르도록 지도할 수 있다.\n이 단원은 초등학교 3~4학년군의 ‘동물의 생활’, ‘식물의 생활’, 5~6학년군의 ‘다양한 생물과 우리 생활’, 중학교 1~3학년군의 ‘생물의 다양성’과 연계된다.","v":"생태계 평형의 중요성과 인간 활동이 생태계에 미치는 영향은 객관식 평가 보다는 프로젝트 학습 등을 통해 학생들이 알게 된 사실을 서술하는 서술형 평가가 바람직하다.\n빛, 온도, 물 등과 같은 환경 요인이 생물에 미치는 영향은 실험 평가를 할 수 있다.","l":"생물 요소와 비생물 요소, 환경 요인이 생물에 미치는 영향, 생태계의 구조와 기능, 먹이 사슬과 먹이 그물, 생태계 평형, 환경 오염이 생물에 미치는 영향, 생태계 보전을 위한 노력","q":"모의 활동으로 생태계 구성 요소들 사이의 관계 알아보기\n환경 요인이 생물에 미치는 영향 조사하기\n생태계 보전을 위한 실천 방안 토의하기"},"2015|과학|5~6학년|날씨와 우리 생활|1":{"m":"날씨는 학생들이 매일 접하는 자연 현상으로, 관찰과 실험을 중심으로 한 탐구 활동의 좋은 소재가 된다. 따라서 이 단원에서는 관찰과 실험을 중심으로 여러 가지 날씨 요소의 특징을 이해할 수 있도록 계획한다.\n구체적인 실험을 통하여 여러 가지 날씨 요소를 관찰하도록 하고, 관찰한 결과를 우리 생활과 관련짓도록 한다.\n이 단원은 초등학교 3~4학년군의 ‘물의 상태 변화’, ‘물의 여행’, 중학교 1~3학년군의 ‘기권과 날씨’와 연계된다.","v":"단편적인 지식의 평가를 지양하고, 관찰과 실험에 대한 이해도 등에 대해 관찰 평가를 실시할 수 있다.\n건습구 온도계로 습도를 측정하는 과정이나 바람 발생에 대한 모형실험의 과정을 실험 평가할 수 있다.","l":"습도, 이슬, 안개, 구름, 비와 눈, 기압, 고기압과 저기압, 바람, 계절별 날씨","q":"건습구 온도계로 습도 측정하기\n이슬, 안개 발생 실험하기\n바람 발생에 대한 모형 실험하기"},"2015|과학|5~6학년|물체의 운동|1":{"m":"이 단원에서는 속력의 산술적 계산이나 단위 변환에 중점을 두기보다는 속력의 뜻과 개념을 이해하는 데 중점을 두어 지도한다.\n조사 활동이 필요한 학습 요소들이 많으므로 모둠별 협동 학습을 활용할 수 있다.\n스포츠, 교통수단, 동물, 날씨(바람) 등과 관련하여 일상생활에서 속력을 나타내는 예에 대한 조사 활동, 교통안전 수칙 조사 활동 등을 통해 협력적 문제 해결력을 함양할 수 있도록 지도한다.\n속력과 관련된 안전 사항에 관해서는 실천적 습관 형성을 위하여 빠른 물체의 위험성을 인식시키는 데 중점을 두도록 한다.\n이 단원은 중학교 1~3학년군의 ‘운동과 에너지’와 연계된다.","v":"속력을 계산하는 능력보다는 속력의 뜻과 단위를 이해하는가에 중점을 두고 평가한다.","l":"속력, 속력과 안전","q":"속력이 일정한 운동, 속력이 변하는 운동의 다양한 사례 관찰하기\n여러 교통수단의 속력 비교하기\n속력과 관련된 교통안전 수칙 조사하기"},"2015|과학|5~6학년|산과 염기|1":{"m":"객관적인 실험 결과를 도출하게 하기 위해 개인별 혹은 모둠별 실험 결과를 정보화 기기를 활용하여 공유하도록 지도할 수 있다.\n위험한 용액을 다룰 경우 안전사고에 유의하여 지도한다.\n이 단원은 중학교 1~3학년군의 ‘화학 반응의 규칙과 에너지 변화’와 연계된다.","v":"일상생활에서 사용하는 용액의 공통점과 차이점을 이용하여 분류해 보는 탐구 활동에 주안점을 두고 평가할 수 있다.\n용액의 색이나 냄새를 관찰하는 방법과 지시약 등을 이용한 객관적인 분류 기준을 적용하여 용액을 분류하는 과정을 관찰 평가하거나 보고서 평가를 할 수 있다.\n실험 및 토의 활동을 할 때 모둠원들과 협력적 의사소통을 통해 결과를 이끌어내는 과정 중심 평가를 실시할 수 있다.","l":"용액의 성질, 용액의 분류, 지시약, 산성 용액, 염기성 용액","q":"여러 가지 용액을 관찰하여 분류하기\n지시약을 만들어 산성 용액과 염기성 용액 구분하기\n산성 용액과 염기성 용액을 섞을 때의 변화 관찰하기"},"2015|과학|5~6학년|지구와 달의 운동|1":{"m":"이 단원에서는 관찰과 실험을 중심으로 지구와 달의 운동과 관련된 개념을 이해하고 지구와 달의 운동에 의하여 일어나는 현상을 탐구할 수 있는 활동이 필요하다.\n하루 동안 달의 위치 변화, 여러 날 동안 달의 모양 변화 등은 관찰 시기와 방법을 안내한 후 관찰하도록 한다. 특히 야간에 달을 관찰할 경우 안전 사항을 준수하도록 한다.\n이 단원은 초등학교 5~6학년군의 ‘계절의 변화’, 중학교 1~3학년군의 ‘태양계’, ‘별과 우주’와 연계된다.","v":"하루 동안 태양과 달의 위치 변화를 관찰한 보고서나, 여러 날 동안 같은 시각에 보이는 달의 모양과 위치를 관찰한 보고서를 평가할 수 있다.\n낮과 밤, 달과 별의 움직임, 달의 모양 변화 등에 대한 여러 가지 관찰 결과를 올바르게 해석하는지에 대한 서술형 평가 혹은 면담 평가를 실시할 수 있다.","l":"지구의 자전과 공전, 낮과 밤, 하루 동안 달의 위치 변화, 계절별 별자리 변화, 달의 위상 변화","q":"하루 동안 태양과 달의 위치 변화 관찰하기\n계절별 대표적인 별자리 찾아보기\n여러 날 동안 같은 시각에 보이는 달의 모양과 위치 관찰하기"},"2015|과학|5~6학년|여러 가지 기체|1":{"m":"눈에 보이지 않는 기체를 이해시키기 위해 간단한 조작이나 실험 활동, 멀티미디어 자료 등을 이용할 수 있다.\n공기를 이루는 기체를 학생들에게 사전에 안내하여, 다양한 관련 자료를 수집하고 필요한 정보를 찾아 정리하도록 지도할 수 있다. 이때 공기를 이루는 성분 기체나 조성 등은 학습 내용에 포함하지 않도록 한다.\n실험 활동을 할 때에는 유리 기구 및 약품을 사용할 때 주의할 점, 불을 취급하는 요령 등 충분한 사전 안전 지도를 실시한다.\n이 단원은 초등학교 3~4학년군의 ‘물질의 상태’, 5~6학년군의 ‘연소와 소화’, 중학교 1~3학년군의 ‘기체의 성질’, ‘화학 반응의 규칙과 에너지 변화’와 연계된다.","v":"기체의 발생과 성질을 알아보기 위한 실험에서 관찰 평가 또는 보고서 평가를 실시할 수 있다.\n공기와 관련한 조사 학습의 경우 조사 학습 보고서를 평가할 수 있다.","l":"기체, 산소, 이산화 탄소, 온도에 따른 기체의 부피, 압력에 따른 기체의 부피, 공기","q":"산소를 발생시켜 그 성질을 확인하기\n이산화 탄소를 발생시켜 그 성질을 확인하기\n온도와 압력에 따른 기체의 부피 변화 관찰하기"},"2015|과학|5~6학년|빛과 렌즈|1":{"m":"프리즘, 유리, 물 등 다양한 예시를 통하여 빛의 굴절을 이해하도록 지도한다.\n렌즈는 학생들에게 매우 흥미로운 소재이긴 하지만 렌즈와 관련된 지식은 학생들이 어려워하는 학습 내용이다. 따라서 여러 가지 렌즈를 다루기보다는 볼록 렌즈에 중점을 두어 렌즈의 특징을 이해하도록 하며 일상생활에서 볼록 렌즈가 이용되는 예와 그 기능을 알게 한다.\n이 단원은 초등학교 3~4학년군의 ‘그림자와 거울’, 중학교 1~3학년군의 ‘빛과 파동’과 연계된다.","v":"이 단원에서는 학생들이 빛의 진행 경로를 직접 관찰하면서 그려보는 수행평가를 활용하는 것이 좋다.","l":"프리즘, 빛의 굴절, 볼록 렌즈, 볼록 렌즈의 쓰임새","q":"프리즘으로 만든 무지개 관찰하기\n유리나 물, 볼록 렌즈를 통과하는 빛 관찰하기\n볼록 렌즈를 이용한 도구 만들기"},"2015|과학|5~6학년|식물의 구조와 기능|1":{"m":"현미경을 이용해 식물 세포를 관찰할 때 세포의 구조는 핵, 세포막, 세포벽 정도만 용어 수준에서 다룬다. 세포 관찰 시 식물 세포 영구 표본을 이용하도록 하며, 동물 세포 영구 표본도 함께 관찰함으로써 동물도 세포로 구성되어 있다는 것을 인식하게 할 수도 있다. 단, 학습자의 수준에 따라서는 식물 세포 표본을 직접 제작하여 관찰할 수도 있다.\n씨가 퍼지는 방법을 아는 것뿐만 아니라 씨의 특징을 통해 발명 아이디어를 제공하는 등 식물에 대한 관심과 호기심을 증대시킬 수 있도록 동영상이나 인터넷을 활용한 사진 자료 등과 같은 보조 학습 자료를 활용해 지도할 수 있다.\n식물의 각 기관의 구조와 기능을 알아본 후, 이 기관들이 서로 관련 있음을 역할 놀이를 통하여 통합적으로 이해시킬 수 있다.\n초등학교 3~4학년군의 ‘식물의 생활’과 ‘식물의 한살이’ 영역에서는 식물들의 특징을 관찰하고 비교하는 데 중점을 두지만, 여기에서는 식물 각 부위의 구조와 기능에 중점을 두는 만큼 실험을 통해 탐구할 수 있도록 한다.\n이 단원은 초등학교 3~4학년군의 ‘식물의 생활’, ‘식물의 한살이’, 중학교 1~3학년군의 ‘생물의 다양성’, ‘식물과 에너지’와 연계된다.","v":"물의 이동이나 증산 작용, 광합성의 결과로 녹말이 형성됨을 실험을 통해 확인하는 과정을 관찰 평가하거나 실험 평가를 활용하는 것이 좋다. 실험에 사용되는 약품명 등과 같은 지식을 요구하는 지필 평가는 지양한다.","l":"세포, 핵, 세포막, 세포벽, 뿌리, 줄기, 잎, 꽃의 구조와 기능, 증산 작용과 광합성, 씨가 퍼지는 방법","q":"세포 관찰하기\n증산 작용과 줄기를 통한 물의 이동 실험하기\n광합성 산물 확인하는 실험하기"},"2015|과학|5~6학년|전기의 이용|1":{"m":"이 단원의 실험·실습 지도 시에는 특히 전기 안전에 유의하도록 한다.\n학생들이 직접 전기 회로를 연결할 수 있는 기능을 익히도록 지도한다.\n이 단원은 초등학교 3~4학년군의 ‘자석의 이용’, 중학교 1~3학년군의 ‘전기와 자기’와 연계된다.","v":"전기 회로를 올바르게 연결할 수 있는 기능을 수행평가를 통하여 평가할 수 있다.","l":"전기 회로, 전구의 연결, 전기 절약, 전기 안전, 전자석","q":"전구에 불 켜기\n전구의 연결 방법에 따른 밝기 비교하기\n전자석 만들기"},"2015|과학|5~6학년|계절의 변화|1":{"m":"이 단원에서는 관찰과 실험을 중심으로 계절의 변화를 설명할 수 있는 활동이 필요하다.\n계절의 변화는 장기간의 관찰이 필요하며, 모형을 이용하여 그 원인을 추론할 수 있는 수업을 계획하도록 한다. 모형실험은 다양한 요인에 의하여 오차가 생길 수 있으므로 정확한 측정값의 비교보다는 경향성을 찾는 수준에서 실험이 이루어지도록 한다.\n남중 고도 변화와 태양 복사 에너지의 변화 사이의 관계는 학생이 이해하기 어려울 수 있으므로 태양 전지판에 그림자보기를 설치하여 소리발생기 등을 연결하고 고도 변화에 따른 소리 크기 변화 등을 파악하게 한다.\n이 단원은 초등학교 5~6학년군의 ‘날씨와 우리 생활’, ‘지구와 달의 운동’, 중학교 1~3학년군의 ‘태양계’와 연계된다.","v":"탐구 활동 과정에서 얻어진 측정 결과물과 함께 자료 해석 능력을 평가할 수 있다.\n지구의 자전축이 기울어진 채 공전하기 때문에 계절의 변화가 나타난다는 것을 옳게 설명할 수 있는지를 파악하기 위해 지필평가나 면담 평가를 실시할 수 있다.","l":"태양 고도의 일변화, 기온의 일변화, 태양의 남중 고도, 계절별 낮과 밤의 길이","q":"하루 동안 태양의 고도와 그림자의 길이, 기온 측정하기\n계절별 태양의 남중 고도, 낮과 밤의 길이, 기온 자료 해석하기\n지구의 자전축이 기울어진 경우와 아닌 경우, 계절별 남중 고도를 비교하는 모형실험하기"},"2015|과학|5~6학년|연소와 소화|1":{"m":"학생들은 일상생활에서 다양한 연소와 소화의 예를 경험하게 되므로 학생들의 경험과 적절히 관련시켜 수업을 진행하도록 한다. 또한 ‘여러 가지 기체’ 영역에서 배운 산소와 이산화 탄소의 성질을 미리 상기시키는 것도 좋은 방법이다.\n관련 실험을 할 때는 화재가 발생하지 않도록 유의시키고, 안전 교육을 병행하도록 한다.\n이 단원은 초등학교 3~4학년군의 ‘물질의 상태, 5~6학년군의 ‘여러 가지 기체’, 중학교 1~3학년군의 ‘재해·재난과 안전’, ‘화학 반응의 규칙과 에너지 변화’와 연계된다.","v":"양초나 알코올이 타는 모습을 관찰하고 연소와 소화의 관계를 연관 지어 생각해 봄으로써 탐구 능력을 향상시킬 수 있다. 따라서 학생들의 탐구 과정을 관찰 평가할 수 있다.\n과학실에서나 일상생활에서 볼 수 있는 다양한 연소 및 소화 관련 사진, 시사적인 자료, 여러 가지 화재의 특징, 화재 안전 대책 등을 조사하고 기록하여 포트폴리오 자료를 평가할 수도 있다.","l":"연소 현상, 연소 조건, 연소 생성물, 소화 방법, 화재 시 안전 대책","q":"물질이 탈 때 나타나는 현상 관찰하기\n연소 후 생성되는 물질 확인하는 실험하기\n다양한 연소 물질에 의해 발생하는 화재 안전 대책 조사하기"},"2015|과학|5~6학년|우리 몸의 구조와 기능|1":{"m":"우리 몸의 내부 구조나 각 기관, 기관의 명칭은 그림과 모형 등의 시청각 자료를 통해 관찰하게 하고, 각 기관의 기능을 기관계의 역할을 위주로 이해하도록 한다.\n뼈와 근육의 생김새는 뼈와 근육 모형을 만들면서 뼈와 근육 사이의 관계를 알게 한다.\n자극과 반응의 세부적인 시스템은 중학교에서 다루므로 이에 대해서는 기본적인 자극이 전달되는 과정을 이해하는 데 초점을 둔다.\n인간 활동에 있어 소화, 순환, 호흡, 배설, 감각 기관의 기능에 문제가 있을 경우에 나타나는 질병을 조사하고, 예방법을 조사·발표하여 건전하고 건강한 생활 방식이 필요함을 이해시키도록 한다.\n이 단원은 중학교 1~3학년군의 ‘자극과 반응’과 연계된다.","v":"여러 가지 기관의 구조와 기능을 바르게 이해하고 설명할 수 있는지 면담 평가를 할 수 있다. 우리 몸의 기관들이 서로 유기적으로 관련되어 있음을 평가하기 위해서는 모형을 이용해 기관의 위치나 호흡, 소화 과정을 그려보도록 하여 관찰 평가하거나 서술형 평가를 실시하는 것이 바람직하다.","l":"뼈와 근육의 구조와 기능, 소화, 순환, 호흡, 배설 기관의 구조와 기능, 감각 기관의 종류와 역할, 자극 전달 과정","q":"뼈와 근육 모형 만들기\n자극이 전달되는 과정 역할 놀이하기\n운동할 때 몸에서 일어나는 변화 알아보기"},"2015|과학|5~6학년|에너지와 생활|1":{"m":"에너지를 효율적으로 활용하는 사례를 조사하고 새로운 아이디어를 제안하는 과정은 모둠별 협동 학습이나 프로젝트 학습을 통해 지도할 수 있다.\n이 단원은 중학교 1~3학년군의 ‘식물과 에너지’, ‘동물과 에너지’, ‘운동과 에너지’, ‘에너지 전환과 보존’과 연계된다.","v":"학생의 에너지에 대한 이해 정도를 알아보기 위해서는 다양한 현상을 에너지 관점에서 자신의 언어로 설명할 수 있는지에 중점을 두어 평가하고, 용어에 대한 암기를 평가하지 않도록 유의한다.","l":"에너지 형태, 에너지 전환","q":"식물과 동물이 에너지를 얻는 방법 비교하기\n효율적인 에너지 활용 방법 제안하기"},"2015|국어|1~2학년|듣기·말하기|1":{"m":"① 일상생활에서 자연스럽게 이루어지는 대화 상황이나 학교에서 이루어지는 교사 및 또래 집단과의 상호 작용 상황을 선정하여 듣기·말하기 활동이 이루어지도록 한다.\n② 듣기 활동을 지도할 때에는 학습자의 흥미와 관심을 고려하여 이야기 구조가 있는 담화를 선정하고 교사가 직접 이야기해 주거나 시청각 매체를 활용하는 등 다양한 방법을 활용할 수 있다.\n③ 말하기 활동을 지도할 때에는 학습자가 겪은 일, 읽거나 보거나 들은 이야기를 말하게 하되, 저학년의 특성을 고려하여 교사가 대화를 주도하면서 학습자가 자연스럽게 말하기 활동에 참여하게 한다.\n④ 인사말을 지도할 때에는 학습자가 경험할 수 있는 여러 상황을 제시하여 연습하게 하고 생활 속에서 인사말을 자연스럽게 주고받도록 지속적으로 지도한다.\n⑤ 감정을 표현하는 말하기를 지도할 때에는 자신의 감정을 직접 표현하거나 역할극 등을 활용하여 다양하게 표현해 보게 한다.\n⑥ 바른 자세로 말하기를 지도할 때에는 말하기 자세와 관련된 매체 자료를 활용하여 바른 자세, 자신 있게 말하기의 특징을 파악하도록 한다.\n⑦ 집중하며 듣기를 지도할 때에는 듣는 이의 반응에 따라 말하는 이의 기분이 어떻게 다른지 말해 보는 활동을 활용한다.\n⑧ 어법에 맞는 고운 말의 사용은 해당 성취기준의 학습 시간 외에도 일상생활 속에서 지속적으로 관심을 기울이도록 지도한다.","v":"① 학습자가 능동적으로 말하기 활동에 참여하도록 격려하여 평가에 부담을 느끼지 않게 한다.\n② 인사말, 감정 표현하기, 바른 자세로 말하기, 바른 말을 사용하는 태도 지니기 등의 학습 요소는 학습자가 학교뿐 아니라 가정에서의 말하기에서도 잘 실천하고 있는지 점검하여, 학교 안팎에서 듣기·말하기 능력이 균형 있게 발달할 수 있도록 한다.\n③ 바른 자세로 말하기와 집중하며 듣기를 연계하여 모든 학습자가 듣기와 말하기 활동에 고루 참여하도록 한다.","l":"인사말 주고받기, 일의 순서 이해하기, 대화하기(감정 표현), 자신 있게 말하기, 바른 자세로 말하기, 주의 집중하며 듣기, 바르고 고운 말 사용하기"},"2015|국어|1~2학년|읽기|1":{"m":"① 학교 안내판, 학급 게시판, 광고지 등 주변에서 접할 수 있는 읽기 자료를 보고 학습자 스스로 읽기를 시도해 보도록 한다. 예컨대, 글자, 낱말, 문장을 소리 내어 읽기를 지도할 때에는 낱자의 형태, 소리, 이름 등을 읽기보다는 ‘자동차’의 ‘자’와 같이 학습자가 익숙한 낱말 속에서 글자의 형태와 소리를 익히도록 한다.\n② 띄어 읽기를 지도할 때에는 다 같이 읽기보다는 혼자 읽기를 하도록 하여 기계적으로 띄어 읽기를 하지 않도록 한다. 여러 단위에서 띄어 읽기가 가능하므로 특정한 띄어 읽기 방법을 강요하지 않으며 의미가 통할 수 있는 수준에서 띄어 읽도록 지도한다.\n③ 글을 읽고 내용 확인하기를 지도할 때에는 ‘무엇이 어떠하다.’, ‘누가 무엇을 하였다.’와 같은 수준에서 내용을 파악하도록 지도한다.\n④ 글을 읽고 인물의 처지와 마음 짐작하기를 지도할 때에는 그렇게 짐작한 까닭을 말해 보게 함으로써 인물의 처지나 마음을 바르게 짐작하였는지를 살펴본다. 또한 인물의 처지나 마음을 표현할 때에는 ‘기분이 좋다, 기분이 나쁘다’와 같은 표현을 이용하기보다는 ‘신나다, 즐겁다, 설레다, 창피하다, 기죽다, 답답하다’와 같이 감정을 표현하는 다양한 어휘를 사용하여 표현할 수 있도록 지도한다.\n⑤ 이 시기는 읽기에 흥미를 가질 뿐 아니라 기본적인 읽기 능력을 갖추도록 하는 데 매우 중요한 시기이므로 글자, 낱말, 문장을 소리 내어 능숙하게 읽을 수 있도록 교과 시간 외에도 지속적으로 관심을 가지고 읽기를 독려한다.","v":"① 글자, 낱말, 문장 소리 내어 읽기와 알맞게 띄어 읽기는 교실 수업 상황에서 돌아가며 읽기 등의 수행 과정에서 평가할 수 있다. 또한 친구들끼리 서로 평가하도록 할 수도 있는데, 이 과정에서 자신의 읽기를 자연스럽게 점검해 볼 수 있게 한다.\n② 글자, 낱말, 문장 소리 내어 읽기를 평가할 때에는 음운 변동이 없는 낱말이나 문장을 주로 평가하되, 음운 변동을 다루더라도 연음 현상이나 경음화(된소리되기) 위주로 다룬다.\n③ 인물의 처지나 마음을 짐작하는 글 읽기에서는 글을 읽고 내용을 확인하기, 자신과 비슷한 경험을 떠올리기, 글쓴이의 마음이나 처지를 파악하기를 순차적으로 평가하여 학습자의 읽기 능력을 정확하게 점검하도록 한다.","l":"정확하게 소리 내어 읽기, 알맞게 띄어 읽기, 주요 내용 확인하기, 인물의 처지와 마음 짐작하기, 읽기에 흥미 갖기"},"2015|국어|1~2학년|쓰기|1":{"m":"① 가장 기본적인 글자, 낱말, 문장을 바르고 정확하게 쓰게 하는 데 주안점을 두되, 학습자가 생활 속에서 흔히 접하는 것을 중심으로 반복해서 학습하도록 한다.\n② 글자 바르게 쓰기를 지도할 때에는 학습자의 발달 단계와 수준을 고려하여 기본적인 낱말과 문장을 제시하여 글씨 쓰기를 연습하도록 한다. 학습자의 수준을 넘는 낱말이나 문장을 제시하면 쓰기를 어려워할 수 있으므로 적절한 수준의 낱말이나 문장을 제시하여 쓰기에 흥미를 갖도록 지도한다. 특히 읽기 능력에 비해 쓰기 능력의 발달이 늦다는 점을 고려한다.\n③ 받아쓰기는 글자를 정확하게 쓰는 데 도움이 될 수 있으나, 학습자가 부담을 갖게 되면 국어 활동에 자신감을 잃을 수도 있으므로 신중하게 활용한다. 너무 어려운 글자를 받아쓰게 하여 국어에 대한 흥미가 떨어지지 않도록 유의하며 요소 중심으로(예：된소리되기 현상이 나타나는 낱말) 지도한다.\n④ 기초 한글 학습이 부족한 학습자를 위해서는 문자 학습에 흥미를 느낄 수 있도록 놀이 중심, 활동 중심으로 교수·학습을 진행한다.\n⑤ 주변 사람이나 사물에 대한 짧은 글 쓰기를 지도할 때에는 학습자 자신의 주변에 어떤 사람이 있는지, 생활하면서 어떤 사물을 접하게 되는지를 먼저 생각해 보도록 한 다음, 서너 문장의 짧은 글로 표현하도록 한다.\n⑥ 인상 깊었던 일이나 겪은 일을 쓸 때에는 한 편의 글이 갖추어야 하는 형식적인 측면을 지나치게 강조하지 말고 자신의 생각을 자유롭게 표현하도록 하는 데 중점을 둔다.\n⑦ 쓰기를 처음 시작하는 단계이므로 쓰기에 흥미와 자신감을 가지도록 격려하고, 최대한 활동 중심, 놀이 중심의 수업이 되도록 한다.","v":"① 평가를 위한 별도의 시간을 마련하거나 활동을 계획하기보다는 수업 및 학교생활에서 학습자의 수행과 태도의 변화 과정을 누적 기록하여 평가한다. 평소 자신이 쓴 쓰기 결과물을 정리해 두도록 하여 이를 평가하는 방법을 적극적으로 활용한다.\n② 결과 중심으로 평가할 때에는 맞춤법이나 글씨에 지나치게 얽매이지 않고 표현하고자 하는 내용을 얼마나 충실하게 표현했느냐에 주안점을 두어 평가함으로써 쓰기에 흥미를 가질 수 있게 한다.","l":"글자 정확하게 쓰기, 글씨 바르게 쓰기, 완성된 문장 쓰기, 짧은 글 쓰기, 경험에 대한 생각이나 느낌 쓰기, 쓰기에 흥미 갖기"},"2015|국어|1~2학년|문법|1":{"m":"① 이 시기의 학습자는 기초 문식성을 습득하는 단계임을 감안하여, 받침이 없는 낱말이나 글자 수가 적은 낱말에서 시작하여 점차 그 범위를 확장해 나가도록 한다.\n② 한글 자모의 이름과 소릿값을 알고 정확하게 발음하고 쓰는 교수·학습의 과정에서는 자음과 모음이 모여 글자를 만드는 방식을 쉽게 이해할 수 있도록 기본 음절표나 낱말 카드 등을 활용할 수 있다.\n③ 소리와 표기의 관계에 대해 지도할 때에는 소리와 표기가 같은 낱말, 소리와 표기가 다른 낱말 두 가지 모두를 다루도록 하고, 교수·학습의 초기에는 발음이나 표기가 지나치게 어려운 낱말이나 글자 수가 지나치게 많은 낱말을 피하도록 한다.\n④ 문장에 따라 알맞은 문장 부호 사용하기를 지도할 때에는 평서문, 의문문, 감탄문과 같은 용어를 노출할 필요는 없으며 문장에 따라 마침표, 물음표, 느낌표 등이 나타나는 양상을 알게 한다. 문장의 유형과 직접 관련이 없지만 쉼표는 필요하면 같이 지도할 수도 있다.\n⑤ 글자, 낱말, 문장에 흥미나 관심 가지기를 지도할 때에는 학습자가 국어 현상에 대해 창의적이고 비판적으로 사고할 수 있는 기회를 제공한다는 생각으로 교수·학습을 이끌어 가도록 한다.","v":"① 한글 자모의 이름과 소릿값을 알고 정확하게 발음하고 쓰는 것과 같은 기초 문식성 관련 평가는 듣기·말하기, 읽기, 쓰기와 관련된 기초적인 의사소통 능력을 배양하기 위한 학습 과정 전반에 대한 평가의 일부가 되도록 통합적으로 평가한다.\n② 낱말을 바르게 읽고 쓰기와 관련된 평가는 읽기 영역과 쓰기 영역을 통합하여 할 수 있다.\n③ 글자, 낱말, 문장에 대한 흥미와 관심에 대한 평가는 교사에 의한 관찰, 자기 평가와 동료 평가, 상황 학습이나 놀이 학습 등의 방법을 활용할 수 있다.","l":"한글 자모의 이름과 소릿값 알기, 소리와 표기의 관계 이해하기, 문장 부호 바르게 사용하기, 글자·낱말·문장에 흥미 갖기"},"2015|국어|1~2학년|문학|1":{"m":"① 낭송이나 낭독을 지도할 때에는, 작품이 특정한 느낌과 분위기를 고유하게 가지고 있다 하더라도 이를 낭송하는 과정에서는 또 다른 느낌과 분위기를 빚어낼 수 있으므로 허용적인 분위기 속에서 다양한 활동이 이루어지게 한다.\n② 재미있는 발상과 표현을 통해 창의력을 신장하도록 하고, 경험을 표현하는 활동에서는 인성 함양도 이루어질 수 있도록 한다.\n③ ‘재미’가 엄밀한 학문적 개념으로 쓰이는 용어가 아니므로 그 의미를 폭넓게 보고 유연하게 접근하도록 한다.\n④ 문학적 완성도에 구속되지 않고 일상적 언어생활의 연장선상에서 문학에 접근하도록 함으로써 문학에 대한 친밀감을 형성하도록 한다.\n⑤ 노래와 시, 이야기 등 특정한 문학 갈래에 국한하지 말고 만화, 애니메이션 등 갈래의 범위를 넓히거나 역할극과 같은 연극적 기법을 활용함으로써 학습자의 흥미와 관심을 유발하도록 한다.\n⑥ 문학의 기능이나 효용에 대한 일방적 설명을 지양하고, 문학에 대한 유의미한 경험과 기억을 바탕으로 하여 자발적으로 문학을 향유하는 습관을 형성하도록 한다.","v":"① 허용적인 분위기 속에서 시나 노래, 이야기를 감상하고, 느낀 점과 생각을 자유롭게 표현하도록 하고 이를 관찰하여 평가한다.\n② 시나 노래, 이야기를 교과 외 시간에도 흥미를 갖고 즐겨 접하도록 독려하고 이를 누적적으로 기록하여 평가한다.\n③ 작품에 대한 학습자의 반응에 대해 옳고 그름을 평가하기보다는 다른 학습자들과 반응을 공유하는 과정을 통해 자신의 생각과 느낌을 스스로 점검해 보는 기회를 제공한다.\n**< 초등학교 1~2학년 국어 자료의 예 >**\n- 우리말 자음과 모음의 다양한 짜임을 보여 주는 낱말\n- 친숙하고 쉬운 낱말과 문장, 짧은 글\n- 마침표, 물음표, 느낌표 등이 포함된 글\n- 가까운 사람들과 주고받는 간단한 인사말\n- 주변 사람이나 흔히 접하는 사물에 관해 소개하는 말이나 글\n- 재미있거나 인상 깊은 일을 쓴 일기, 생활문\n- 자신의 감정을 표현하는 간단한 대화, 짧은 글, 시\n- 재미있는 생각이나 표현이 담긴 시나 노래\n- 사건의 순서가 드러나는 간단한 이야기\n- 인물의 모습과 처지, 마음이 잘 드러나는 이야기, 글\n- 상상력이 돋보이는 그림책, 이야기, 만화나 애니메이션","l":"작품 낭독·낭송하기(느낌과 분위기), 인물의 모습·행동·마음 상상하기, 말의 재미 느끼기, 생각·느낌·경험을 표현하기, 문학에 흥미 갖기"},"2015|국어|3~4학년|듣기·말하기|1":{"m":"① 일상생활이나 학교생활에서 자연스럽게 이루어지는 대화 상황을 선정하여 듣기·말하기 활동이 이루어지도록 한다.\n② 듣기 활동을 지도할 때에는 학습자의 인지적 이해 수준을 고려하여 인과 관계 구조가 있는 담화를 선정하고 교사가 직접 이야기해 주거나 시청각 매체를 활용하는 등 다양한 방법을 활용할 수 있다.\n③ 회의에서 의견 교환하기를 지도할 때에는 학급 회의를 열게 하여 배운 내용을 적용할 수 있도록 하고, 공식적 말하기에 대한 긍정적 학습 경험을 가지도록 격려한다.\n④ 원인·결과를 고려하며 듣기를 지도할 때에는 인과 관계의 담화 표지로 ‘그래서, 결국, 왜냐하면, 결과적으로, ∼(으)니까, ∼ 때문에, ∼의 원인은’ 등을 사용할 수 있음을 알려 준다.\n⑤ 원인·결과를 고려하며 말하기를 지도할 때에는 학습자가 일상 경험을 바탕으로 하여 인과 관계 구조로 내용을 구성하여 발표하도록 하고, 이를 요약하며 듣기와 연계하여 지도할 수 있다.\n⑥ 적절한 표정·몸짓·말투로 말하기를 지도할 때에는 부탁, 수락, 거절, 사과, 감사, 제안 같은 다양한 목적의 대화 상황에서 언어적 표현을 보강하는 표정, 몸짓, 말투를 선택해서 말해 보도록 지도한다.\n⑦ 예의를 지켜 말하기를 지도할 때에는 나이가 많은 사람과의 의사소통 상황에 국한된 것으로 오해하지 않도록 하고, 문자 메시지를 주고받거나 인터넷상에서 의사소통할 때 다른 사람의 기분과 입장을 배려할 수 있도록 매체 언어 예절을 포함하여 지도한다.","v":"① 일상 대화나 수업에서 이루어지는 듣기·말하기 활동을 직접 점검하거나 교사 또는 동료 학습자가 기록할 수 있는 점검표나 관찰 기록표 등을 활용할 수 있다.\n② 동료 학습자의 듣기·말하기 활동에 대해 피드백을 할 때에는 단점보다는 장점을 더 많이 찾아보게 하고, 동료 학습자의 피드백을 들을 때에는 열린 마음으로 수용하도록 지도한다.\n③ 회의에서 의견 교환하기를 평가할 때, 발언의 횟수를 양적으로 집계하여 평가하지 않도록 지도한다.\n④ 적절한 표정, 몸짓, 말투로 말하는지 평가할 때에는 연극 대본, 드라마나 애니메이션의 한 장면을 활용할 수 있다.","l":"대화하기(경험 나누기, 대화의 즐거움), 회의하기(의견 교환), 인과 관계 이해하기, 효과적으로 표현하기(표정·몸짓·말투), 요약하며 듣기, 대화 예절 지키기"},"2015|국어|3~4학년|읽기|1":{"m":"① 글의 중심 생각 파악하기를 지도할 때에는 중심 낱말을 찾고 그것을 바탕으로 하여 문단에서 중심 문장과 뒷받침 문장을 파악한 후 이를 토대로 한 편의 글에서 중심 내용을 간추려 글쓴이가 글에서 드러내고자 하는 중심 생각을 파악하도록 한다. 문단의 중심 생각이 명시적으로 드러나지 않는 글은 학습자가 재구성하여 표현하도록 지도한다. 중심 문장을 찾을 때 두괄식, 미괄식 등 문단 구성의 유형을 먼저 가르치지 않도록 유의한다.\n② 글의 유형을 고려하여 대강의 내용을 간추릴 때에는 글의 목적에 따라 대강의 내용을 간추리는 방법이 다름을 파악하도록 한다. 예를 들어, 정보 전달을 목적으로 하는 글일 때에는 다루고 있는 중심 화제(소재)가 무엇인지를 파악하여 이를 설명하는 중심 문장을 선별하는 것이 중요하고, 설득을 목적으로 하는 글일 때에는 주장과 그것을 지지하는 근거가 무엇인지를 선별하는 것이 중요하다. 이와 같이 글의 유형을 고려하여 글 내용을 간추리도록 한다.\n③ 읽기 경험과 느낌을 다른 사람과 나눌 때에는 동일한 글에 대한 경험과 반응을 공유할 수도 있고, 생각의 차이를 발견하고 이를 이해하는 과정을 다룰 수도 있다. 서로 얼굴을 맞대고 읽기 경험을 나눌 수도 있지만, 인터넷 매체를 활용하여 의견을 나눌 수도 있다. 또한 자신의 마음을 표현하는 글 쓰기, 문학 작품을 듣거나 읽거나 보고 떠오른 느낌과 생각을 다양한 방법으로 표현하기, 재미나 감동을 느끼며 작품을 즐겨 감상하는 태도 지니기 등 쓰기나 문학 영역과 연계하여 지도할 수 있다.","v":"① 대강의 내용 간추리기를 평가할 때에는 글에 나타난 문장을 그대로 옮겨 쓰기보다 자신의 말로 바꾸어 쓰도록 한다.\n② 중심 생각 파악하기, 짐작하기와 사실과 의견 구분하기를 평가할 때에는 특정한 단원, 특정한 차시의 학습 활동만을 관찰하여 평가하기보다는 여러 단원에 걸쳐 학습 태도를 살펴보고 누적된 결과를 바탕으로 하여 평가하도록 한다.\n③ 읽기 경험과 느낌을 다른 사람과 나누는 태도를 평가할 때에는 교과 수업에서뿐 아니라 평소에도 읽기 경험을 공유하는지 관찰하여 형식적이고 일회적인 평가가 되지 않도록 유의한다.","l":"중심 생각 파악하기, 대강의 내용 간추리기, 짐작하기(낱말의 의미, 생략된 내용), 사실과 의견 구별하기, 읽기 경험을 나누는 태도 갖기"},"2015|국어|3~4학년|쓰기|1":{"m":"① 쓰기 과제를 부여할 때에는 실제로 학습자의 삶과 직결되는 쓰기를 경험하게 한다. 자신의 생활을 바탕으로 하여 글을 쓸 상황을 구체적으로 설정하고, 그 상황에서 주제나 목적, 읽는 이 등을 고려하여 글을 써 보도록 지도한다.\n② 문단 쓰기를 지도할 때에는 중심이 되는 내용과 이를 부연해 주거나 뒷받침해 주는 내용을 잘 조직하여 문단 자체의 완성도를 높이도록 지도한다.\n③ 시간의 흐름에 따라 사건이나 행동이 드러나는 글 쓰기를 지도할 때, 보통 수준의 학습자에게는 자신이 경험한 사건이나 행동을 시간 순서대로 써 보게 할 수 있고, 심화 수준의 학습자에게는 창작성을 감안하여 일부 내용을 꾸며 쓰게 할 수 있다.\n④ 서사적인 글 쓰기를 지도할 때에는 본격적인 이야기 창작 능력을 기르는 것이 목적이 아니므로 지나치게 높은 수준의 창작성을 요구하지 않도록 한다.\n⑤ 관심 있는 주제에 대해 자신의 의견을 쓰게 할 때에는 읽기 영역의 사실과 의견 구별하기 활동과 연계하여, 관심 있는 주제에 관한 객관적 사실과 이에 대한 자신의 의견을 구별하여 정리한 후 이를 글로 써 보게 할 수도 있다. 또는 듣기·말하기 영역의 인과 관계를 고려한 말하기 활동과 연계하여, 특정한 상황의 원인과 결과 그리고 그에 대한 자신의 의견을 글로 정리해서 발표하고 청중의 반응을 반영하여 보완하는 글을 써 보게 할 수도 있다.\n⑥ 의견이 드러나는 글 쓰기는 엄격한 형식을 갖추거나 지나치게 타당성이 높은 근거를 들도록 하기보다는 주변의 현상에 관심을 갖고 이에 대해 자유로운 형식으로 주장을 펼 수 있도록 지도한다.\n⑦ 읽는 이를 고려하여 쓰기를 지도할 때에는 처음에는 학습자가 잘 알거나 친숙한 사람을 읽는 이로 삼아 글을 쓰도록 하고, 학년이 올라감에 따라 점차 잘 알지 못하거나 친숙하지 않은 이를 읽는 이로 삼아 글을 쓰도록 한다.\n⑧ 글을 쓰고 난 후 자신의 글을 다른 학습자와 나누어 보는 활동을 통해 쓰기에 대한 자신감을 갖고 자신의 글을 점검하는 기회를 갖도록 한다. 또한 다른 학습자들의 반응이나 비평을 반영하여 자신의 글을 보완하는 노력을 해 보도록 독려한다. 짝 활동을 할 수도 있고 게시판이나 인터넷을 활용하여 다수가 참여하는 활동을 할 수도 있다.","v":"① 평가 목표는 쓰기의 목적, 읽는 이, 주제에 맞게 한 편의 글을 온전하게 썼는지를 평가하는 데 주안점을 두어 설정한다.\n② 교사의 평가뿐 아니라 자기 평가와 상호 평가를 실시하여 학습자의 쓰기 활동을 다면적으로 평가한다.\n③ 자신이 쓴 글과 다른 사람으로부터 받은 피드백을 포트폴리오 형식으로 정리하게 하여 성취감을 느낄 수도 있도록 한다. 이렇게 누적된 활동 결과를 평가 자료로 활용할 수도 있다.\n④ 자신이 쓴 글을 다른 학습자들과 나누어 읽는 과정에서 긍정적인 피드백을 경험하게 하여 평가가 글쓰기를 점검하고 보완할 수 있는 정보를 제공해 준다는 점을 이해하게 한다.","l":"문단 쓰기(중심 문장과 뒷받침 문장 이해하기), 시간의 흐름에 따라 쓰기, 의견이 드러나는 글 쓰기, 마음을 표현하는 글 쓰기, 쓰기에 자신감 갖기(글을 적극적으로 나누는 태도 갖기)"},"2015|국어|3~4학년|문법|1":{"m":"① 낱말의 분류를 지도할 때에는 학습자에게 낱말 분류의 경험을 제공함과 아울러 국어사전(종이 사전, 인터넷 사전)에서 낱말을 찾는 데에 필요한 방법적 지식을 익힐 수 있게 하고, 국어사전에서 낱말을 즐겨 찾는 태도를 지니게 하는 데 중점을 둔다.\n② 낱말의 의미 관계 파악을 지도할 때에는 어휘망 그리기 등 여러 가지 활동을 통해 한 낱말과 연관된 다양한 어휘를 익히게 한다. 사전을 통해 자신이 조사한 낱말을 이용하여 연상 활동이나 말놀이를 해 보고 어휘에 대한 관심을 가지도록 한다.\n③ 기본적인 문장의 짜임을 지도할 때에는 용어의 개념을 지도하기보다는 여러 가지 예시 자료를 활용하여 문장의 짜임을 이해하도록 한다. 학습자에게 기본적인 문장의 짜임을 보여 주는 사례를 제시한 다음, 이와 짜임이 유사한 문장을 생성해 보도록 할 수 있다.\n④ 높임법에 대해 지도할 때에는 높임법과 관련된 지식을 전달하는 데 중점을 두기보다는 학습자가 자주 틀리고 어려워하는 높임법 사례를 제시하여 문제의식을 유발하고 그것을 바로잡는 경험을 제공하는 데 중점을 둔다.\n⑤ 한글의 창제 과정, 한글의 우수성을 보여 주는 다양한 매체 자료를 활용하여 자연스럽게 한글을 소중히 여기는 태도를 기를 수 있게 한다. 또한 한글이 없거나 쓸 수 없는 상황을 상상하여 역할극을 해 보는 등 학습자가 흥미를 느낄 수 있는 다양한 학습 방법을 사용할 수도 있다.","v":"① 국어사전에서 낱말 찾기를 평가할 때에는 사전을 찾는 데 필요한 지식뿐만 아니라 사전에서 낱말을 찾는 수행 과정을 직접 관찰하여 평가하도록 한다.\n② 낱말과 문장, 높임법, 한글과 관련하여 비판적·창의적 사고력과 탐구 능력을 평가하는 데 중점을 둔다.\n③ 한글의 소중함을 깨닫게 해 주는 자료에 관해 자기 주도적으로 발표하거나 다른 학습자와 토의하고 그 내용을 공유하게 함으로써 자료·정보 활용 능력과 의사소통 능력을 평가할 수 있다.","l":"낱말 분류하기(기본형, 모양이 바뀌는 낱말, 모양이 바뀌지 않는 낱말), 낱말의 의미 관계 이해하기(비슷한 말, 반대말, 상·하위어), 기본적인 문장의 짜임 알기, 높임법 바르게 사용하기, 한글을 소중히 여기는 태도 갖기"},"2015|국어|3~4학년|문학|1":{"m":"① 창의적 표현을 중심으로 학습자의 창의적 사고를 계발하도록 하고, 다양한 삶에 대한 간접 경험을 통해 타자에 대한 이해의 폭을 넓힘으로써 인성 함양에도 기여하도록 한다.\n② 수용에 초점이 있는 학습 요소라 하더라도 발산적 사고 활동을 바탕으로 하여 창의적 재구성이나 창작 활동이 이루어지도록 지도한다.\n③ 작품을 선정할 때에는 문자로 기록된 문학에 국한하지 말고 아동극이나 동영상 등도 적극적으로 활용한다.\n④ 감각적 표현을 지도할 때에는 작품의 특정 구절과 다섯 가지 감각을 기계적으로 연결하는 데 초점을 두지 말고 그 표현 효과에 집중하여 지도한다.\n⑤ 인물, 사건, 배경을 지도할 때에는 이들 요소를 개별적으로 확인하게 하기보다는 이야기 속에서 상호 연관성을 파악하도록 하는 데 중점을 둔다.\n⑥ 독후 활동으로서 생각과 느낌 표현하기를 지도할 때에는 전형적인 감상문 쓰기 외에 인물에게 보내는 편지 쓰기, 일기 쓰기 등으로 활동을 다양화하고, 듣기·말하기와 연계한 작가 혹은 인물과의 가상 인터뷰, 미술 교과와 연계한 그림 그리기 등의 활동을 하도록 한다.\n⑦ 문학의 생활화를 위해 학교나 가족 혹은 또래 집단을 소재로 한 작품 중에서 현재 자신이 겪고 있는 고민을 성찰하는 데 도움이 되는 작품을 찾아 읽도록 하며, 교과서에 수록된 작품에 국한하지 않고 다양한 작품을 교수·학습 자료로 활용한다.","v":"① 인물, 사건, 배경을 통해 작품 이해하기에 대한 평가는 작품을 읽고 난 후 느낀 점이나 생각을 학습자끼리 공유하는 과정에서 이들 요소를 중심으로 작품을 이해하고 있는지 자연스럽게 확인하도록 한다.\n② 문학적 지식을 단편적으로 확인하기보다는 작품을 감상하는 가운데 문학 지식을 적절하게 활용할 수 있는지를 평가하는 데 중점을 둔다.\n③ 교수·학습에서 다룬 지식이나 내용을 직접적으로 확인하기보다는 작품을 감상한 결과를 다양한 방법으로 표현하는 과정에 중점을 두어 평가한다.\n④ 교과서에 수록된 작품에 국한하지 않고 학습 주제와 연관된 다양한 작품을 적절하게 활용하여 평가한다.\n⑤ 독후 활동으로서 생각과 느낌을 표현하는 능력을 평가할 때에는, 작품에 대한 수렴적인 이해보다는 발산적인 감상 능력에 중점을 두도록 한다.\n**< 초등학교 3~4학년 국어 자료의 예 >**\n- 높임법이 나타난 일상생활의 대화\n- 일상생활에서 가족, 친구들과 안부를 나누는 대화, 전화 통화, 문자, 사회 관계망 서비스의 글\n- 친구나 가족과 고마움이나 그리움 등의 감정을 나누는 대화, 편지\n- 학급이나 학교생활과 관련된 안건을 다루는 회의\n- 중심 생각이 잘 드러나는 문단이나 짧은 글\n- 가정이나 학교에서 일어난 일에 대해 자신의 의견을 쓴 글\n- 본받을 만한 인물의 이야기를 쓴 전기문, 이야기나 극\n- 한글의 우수성을 알게 해 주는 다양한 글이나 매체 자료\n- 일상의 경험이나 고민, 문제를 다룬 시, 이야기, 글\n- 운율, 감각적 요소가 돋보이는 시나 노래\n- 사건의 전개 과정이나 인과 관계가 잘 드러나는 이야기, 글\n- 감동이 있거나 재미가 있는 만화나 애니메이션","l":"감각적 표현의 효과 느끼기, 인물·사건·배경 이해하기, 이야기의 흐름 파악하기, 이야기 이어서 구성하기, 작품에 대한 생각과 느낌 표현하기, 작품을 즐겨 읽기"},"2015|국어|5~6학년|듣기·말하기|1":{"m":"① 구어 의사소통의 특성을 지도할 때에는 순서 교대가 있는 대면 의사소통 상황을 제시하고, 제시된 자료에서 학습자 스스로 자신의 경험을 활용하여 구어 의사소통의 특성을 찾아내도록 한다.\n② 구어 의사소통의 특성을 지도할 때에는 대화에 실패했던 경험이나 오해를 불러일으킨 경험 등을 이야기하게 하고 이를 학습에 활용하도록 한다.\n③ 발표, 토의, 토론 등 각각의 공식적 담화 상황의 특성에 초점을 맞추어 학습자가 공식적 말하기에 자신감을 가지도록 학습자의 수행에 대해 격려하고 칭찬하며 긍정적인 피드백을 한다.\n④ 매체 자료의 활용에 대해 지도할 때에는 매체 자료를 양적으로 많이 활용하는 것보다 발표할 내용과 발표를 듣는 대상의 특성, 발표 상황을 고려하여 적절한 자료를 알맞게 활용하게 하여 발표의 효과를 높이도록 한다.\n⑤ 토의에 대해 지도할 때에는 학습자가 적극적으로 의견을 제시하도록 격려하되, 소수의 학습자가 발언권을 독점하지 않도록 유의한다.\n⑥ 토론에 대해 지도할 때에는 논제에 대한 입장을 정하고 주장을 뒷받침할 만한 논리적 근거를 찾아 상대방을 설득하는 방법을 익히도록 한다. 상대방의 의견을 존중하며 듣고 이를 통해 자기 주장의 문제점을 점검하면서 합리적으로 토론해 가는 과정을 익히도록 지도한다.\n⑦ 추론하며 듣기를 지도할 때에는 드러나지 않은 화자의 의도나 관점을 생각하며 듣게 하거나 생략된 내용을 짐작하며 듣도록 지도한다.","v":"① 공식적인 말하기를 평가할 때에는 말하기 환경도 그와 유사하게 만들어 말하기 평가의 실제성을 높여 주고 녹화를 통해 자신의 말하기를 스스로 점검해 볼 수 있는 기회를 제공한다.\n② 매체 활용, 의견 제시, 자료 정리 등의 수행 여부를 기계적으로 평가하지 않도록 유의하고 말하기 효과를 고려하여 수행 수준을 평가하며, 학습자 스스로 칭찬할 점과 보완할 점을 찾아보게 한 후 수정 방향도 함께 논의하는 적극적인 피드백이 이루어지도록 한다.\n③ 담화 수행의 전 과정을 연습할 수 있도록 하고, 성취기준의 초점을 고려하여 평가의 범위를 설정하되 담화 수행의 전체적인 맥락과의 연계성에 유의하도록 한다.\n④ 토론의 절차와 규칙에 대한 지식의 수준을 확인하기보다는 학습자의 토론 수행을 관찰함으로써 토론의 절차와 규칙에 대한 이해 및 실제 사용 수준을 평가한다.","l":"구어 의사소통, 토의하기(의견 조정), 토론하기(절차와 규칙, 근거와 주장), 발표할 내용 정리하기, 발표하기(매체 활용), 추론하며 듣기, 공감하며 듣는 태도 갖기"},"2015|국어|5~6학년|읽기|1":{"m":"① 읽기가 글의 내용을 바탕으로 하여 배경지식을 활용하여 의미를 구성하는 과정임을 지도할 때에는 글을 읽으면서 떠올린 생각이 의미 구성에 어떠한 영향을 주는지를 살펴보고 이를 바탕으로 하여 읽기의 의미 구성 과정을 이해하도록 한다.\n② 요약하기를 지도할 때에는 요약하기 방법을 이해하도록 하고, 글에서 중심 문장을 그대로 옮기기보다는 자신의 말로 재구성하도록 지도한다.\n③ 내용의 타당성과 표현의 적절성을 판단하는 방법을 지도할 때에는 글에 나타난 주장이나 내용이 편견에 치우치지 않고 타당한지, 글쓴이가 자신의 생각을 드러내기 위해 사용한 표현이 적절한지를 평가하도록 지도한다.\n④ 학습자가 글에 대한 질문을 만들고, 함께 답을 찾아가는 대화로 수업이 진행될 수 있도록 한다.","v":"① 읽기가 글의 내용을 바탕으로 배경지식을 활용하여 의미를 구성하는 과정임을 아는지를 평가할 때에는 지필 평가보다는 읽기를 수행하는 과정을 중심으로 평가한다.\n② 읽기 습관 점검하기를 평가할 때에는 독서 시간을 충분히 확보하는지, 좋아하는 분야나 갈래 위주로 편협한 독서를 하지는 않는지 등을 점검한다. 또한, 자신의 독서 습관을 살펴보고 읽을거리의 분량, 난이도, 시간 등을 고려하여 독서 계획을 세워 실천하는지도 확인한다. 읽을거리를 스스로 찾아 읽으며 한 권의 책을 완독하는 습관을 가지고 있는지도 평가할 수 있다. 독서 계획을 세울 때에는 자율적으로 정하도록 하되, 매일 일정한 시간 동안 읽어야 한다는 생각에 얽매이지 않도록 한다.","l":"의미 구성 과정으로서의 읽기, 요약하기(글의 구조), 주장과 주제 파악하기, 내용의 타당성 평가하기, 표현의 적절성 평가하기, 다양한 읽기 방법 적용하기(매체), 읽기 습관 점검하기, 스스로 글을 찾아 읽기"},"2015|국어|5~6학년|쓰기|1":{"m":"① 쓰기의 절차를 지도할 때에는 글 한 편을 완성하도록 강조하면서 쓰기가 계획하기, 내용 생성하기, 내용 조직하기, 초고 쓰기, 고쳐쓰기의 과정을 요구한다는 점을 이해하도록 하되, 이러한 일련의 쓰기 과정이 엄격하게 구별되거나 분절적인 것이 아니라는 점에 유의한다. 특히 내용 생성하기 단계에서는 브레인스토밍, 마인드맵 등의 방법을 통해 글을 쓰기 위한 내용을 생성하는 전략이나 기능을 익히도록 하는 데 중점을 둔다. 고쳐쓰기 단계에서는 띄어쓰기와 맞춤법을 포함하여 지도하되, 창의성이나 유창성을 저해하지 않도록 유의한다.\n② 글의 목적이나 주제에 따라 내용과 매체를 선정하여 쓰기를 지도할 때에는 다양한 예시 글을 제시하고 학습자가 스스로 글을 분석하여 내용 선정 시 고려해야 할 점, 내용 선정 방법 등을 찾아내도록 안내한다. 이때 제시한 글이 단순히 모방을 위한 예가 되지 않도록 유의한다.\n③ 설명하는 글 쓰기를 지도할 때에는 내용 마련을 위한 자료 수집 과정에서 전문적인 자료보다는 학습자가 쉽게 구할 수 있는 자료를 활용하도록 한다. 특히 목적이나 대상에 알맞은 사진이나 도표, 동영상 등의 자료를 적절히 찾을 수 있도록 안내한다. 시각 자료를 포함한 글, 구체적인 예를 제시한 글이나 비교·대조 형태로 내용을 조직한 글 등을 제시하여 목적이나 대상에 따른 형식의 중요성을 이해하도록 한다.\n④ 체험한 일에 대한 쓰기를 지도할 때에는 직접 여행했던 경험을 제재로 기행문을 쓰거나 미술관이나 박물관 등을 견학하고 자신이 인상 깊게 보고 느낀 점을 표현하도록 한다. 책, 영화, 음악 등을 보고 들은 경험을 바탕으로 하여 감상문을 쓸 수도 있다. 단, 학습자의 다양한 체험을 이끌어 내어 글로 쓰게 하되, 사회적 위화감을 불러일으킬 수 있는 체험은 다루지 않도록 유의한다.\n⑤ 국어과의 다른 영역과 통합적으로 교수·학습을 진행할 수 있다. 예를 들어 글의 주제나 목적에 따른 쓰기를 지도할 때에는 읽기 영역에서 글의 주제가 무엇인지를 파악하고 내용 중에서 주제에 벗어난 것은 없는지를 분석해 보게 할 수도 있다. 독자를 존중하고 배려하며 쓰기는 듣기·말하기 영역의 언어 예절과 비교해 보게 하는 활동을 통해 지도할 수도 있다.","v":"① 평가 목표는 쓰기의 목적, 읽는 이, 주제에 맞게 글을 효과적으로 쓰는 능력에 중점을 두어 설정한다.\n② 한 편의 글을 평가할 때에는 내용, 형식, 표현 등을 종합적으로 살펴보되, 경우에 따라 이들 중에서 어느 한 측면에만 초점을 맞추어 평가할 수도 있다. 예를 들어 주장하는 글 쓰기를 평가할 때에는 주장에 따라 타당한 논거를 제시하였는지에 중점을 두어 평가할 수 있다.\n③ 한 편의 완성된 글을 평가하되, 경우에 따라서는 일련의 글쓰기 과정을 평가하여 학습자에 대한 좀 더 풍부한 정보를 얻을 수도 있다.\n④ 독자를 존중하고 배려하며 쓰기와 같은 정의적 영역의 평가를 할 때에는 일회적으로 끝나지 않도록 한다. 체크리스트를 만들어 활용할 수도 있고 자신의 언어 사용 실태를 기록하는 기록장을 만들어 활용할 수도 있다.\n⑤ 교사의 평가뿐 아니라 글을 쓰고 나서 다른 사람과 돌려 읽으며 자기 평가와 상호 평가를 하도록 하고, 이를 통해 학습자의 쓰기 활동에 대한 다면 평가를 강조하도록 한다.","l":"의미 구성으로서의 쓰기, 목적과 주제에 따라 내용 선정하기(글의 목적, 매체 활용), 설명 대상의 특성에 맞게 쓰기, 근거를 들어 주장하는 글 쓰기, 체험에 대한 감상 쓰기, 독자를 존중·배려하며 쓰기"},"2015|국어|5~6학년|문법|1":{"m":"① 언어의 기능을 지도할 때에는 다양한 언어 기능을 모두 다루기보다 지시적, 친교적, 명령적 기능 등 기본적인 기능을 중심으로 하되, 일상생활 속에서 언어 사례를 찾고 이때 사용된 언어 기능을 확인하도록 지도한다.\n② 낱말의 확장 방법을 지도할 때에는 낱말의 짜임에 대한 실제 사례를 탐구해 보고 새로운 낱말을 만들어 보도록 안내한다. 또한 짜임이 비교적 단순하고 대표적인 낱말을 분석 대상으로 삼도록 한다.\n③ 다양한 의미를 가진 낱말의 해석을 지도할 때에는 학습자가 일상생활에서 많이 접하는 낱말을 대상으로 한다. 낱말의 다양한 의미를 확인할 때에는 국어사전을 활용할 수도 있다.\n④ 관용 표현에 대해 지도할 때에는 관용어구, 속담 등이 담긴 글이나 담화를 대상으로 삼아 관용 표현에 대한 이해 능력을 향상시키고 관용 표현을 활용하는 능력을 신장하도록 한다.\n⑤ 문장 성분을 지도할 때에는 주어, 서술어, 목적어 수준에서 다루고, 학습자가 스스로 문장을 구성하는 요소를 탐구하여 문장 성분에 대해 이해할 수 있도록 한다.\n⑥ 호응 관계에 대해 지도할 때에는 학습자가 주로 범하는 오류 문장을 대상으로 하여 다루되 어떤 문제가 있는지 스스로 찾아보게 한다. 그리고 호응 관계가 맞지 않은 문장을 바르게 고쳐 보는 활동을 한다.\n⑦ 바른 국어 사용을 지도할 때에는 발음, 표기, 어휘 등의 기본적인 요소와 함께 어법, 언어 예절 등의 화용적인 측면까지 지속적으로 지도하도록 한다.","v":"① 언어의 기능, 낱말의 확장과 해석, 관용 표현, 문장의 구성에 관한 평가에서는 실제의 언어생활에서 접할 수 있는 다양한 자료를 활용하도록 한다.\n② 낱말이 상황에 따라 다양하게 해석됨을 평가할 때에는 상황이나 문맥이 드러나는 실제 언어 자료를 바탕으로 하여 평가하도록 한다.\n③ 낱말 확장, 관용 표현, 문장 구성에 대한 이해뿐 아니라 표현의 측면에 대해서도 평가가 이루어지도록 한다.\n④ 호응 관계를 평가할 때에는 지식을 독립적으로 평가하기보다는 쓰기 영역과 관련지어 자신의 글이나 친구가 쓴 글에서 호응 관계가 맞지 않는 문장을 찾아 바르게 고쳐 보게 한다.\n⑤ 바른 국어 사용의 태도는 자기 보고, 관찰 평가, 상호 평가 등의 비형식적, 상위 인지적 평가를 적극적으로 활용한다.","l":"언어의 기능(사고와 의사소통의 수단), 낱말 확장 방법 알기(합성, 파생), 낱말의 의미 파악하기(문맥적 의미, 다의어, 동음이의어), 관용 표현 활용하기, 문장 성분 이해하기, 호응 관계 이해하기, 국어를 바르게 사용하기"},"2015|국어|5~6학년|문학|1":{"m":"① 개념적 지식은 가급적 배제하고 문학이 자아 성찰과 지적·정서적 성장에 기여하는 바를 중심으로 그 효용을 직접 경험하도록 한다.\n② 문학의 의의를 지도할 때에는 문학 활동이 언어 능력의 신장에 기여할 수 있음을 이해하도록 함으로써 영역 통합적으로 접근하도록 한다. 문학의 가치 있는 내용은 인성 함양과, 세련된 표현은 창의적 능력과 각각 연결되며, 문학이 언어 활동의 하나라는 점을 강조한다.\n③ 작품 속 세계와 현실 세계의 관계를 다룰 때에는 문학 작품이 허황된 세계를 근거 없이 꾸며낸 것이라는 오해가 생기지 않도록 작품 속 세계와 현실 세계의 차이를 과도하게 강조하지 않도록 한다.\n④ 비유적 표현을 지도할 때에는 개성적·독창적 표현의 가치를 존중하되 널리 알려진 상투적 비유도 활용하도록 한다. 다만 기존 작품에서 베끼는 등의 쓰기 수행이 일어나지 않도록 쓰기 윤리를 강조한다.\n⑤ 일상생활의 경험을 이야기나 극으로 표현하기를 지도할 때에는 역할극은 물론 만화 그리기, 극본 구성 등 다양한 형식으로 수행하도록 한다. 극본을 구성하고 극화 활동을 할 때에는 비교적 긴 시간에 걸쳐 계획적으로 준비하여 2인 이상이 참여하고 신체의 움직임과 표정, 말투를 두루 고려하도록 한다. 이때 표정이나 동작 등 연기의 요소보다 내용을 이루는 경험의 가치에 초점을 맞추도록 한다.\n⑥ 작품 이해와 소통에 대해 지도할 때에는 문학적 표현의 의미만이 아니라 거기에서 얻는 느낌이나 생각의 차이도 함께 다룸으로써 작품의 개방성만이 아니라 인간의 다양성을 이해하는 데 중점을 둔다. 그리고 작품 해석의 개방성과 다양성을 보장한다 하더라도, 해석에는 최소한의 합리적 타당성은 있어야 하므로 지나치게 기이한 해석은 경계하도록 한다.\n⑦ 학습자가 작품에 대한 질문을 만들고, 함께 답을 찾아가는 대화로 수업이 진행될 수 있도록 한다.","v":"① 평가를 위한 별도의 시간을 할애하거나 활동을 계획하기보다는 수업 및 학교생활에서 학습자의 수행과 태도의 변화 과정을 직접적·누적적으로 기록하여 평가한다.\n② 개념적 지식에 대한 이해는 가급적 배제하고 문학을 즐겨 감상하는 능력에 중점을 두어 평가한다.\n③ 수업에서 다룬 내용이라고 하더라도 단편적인 정보에 초점을 맞추지 말고 작품 전체에 대해 추론적, 비판적, 창의적 사고를 발휘할 수 있도록 평가 도구를 구성한다.\n④ 형성 평가에서는 학습 목표에 초점을 맞추더라도 총괄평가에서는 작품에 대한 전체적인 감상 능력과 창작 능력을 측정하도록 한다.\n⑤ 교과서에 수록된 작품에 국한하지 않고 같은 또래 학습자들의 다양한 작품을 활용하여 평가한다.\n⑥ 비유적으로 표현하는 능력을 평가할 때에는 참신성과 개성은 물론 공감의 폭을 중요하게 고려한다.\n⑦ 이야기나 극의 형식으로 표현한 것을 평가할 때에는 완성도보다는 학습자가 즐겁게 참여하고 적극적으로 표현하려는 태도에 관심을 갖는다.\n**< 초등학교 5~6학년 국어 자료의 예 >**\n- 일상생활이나 학교생활에서 발생한 문제를 논제로 한 토의, 토론\n- 조사한 내용에 대해 여러 가지 매체를 활용한 발표\n- 주변 사람들과 생활 경험을 나누는 대화, 생활문\n- 인문, 사회, 과학, 예술, 체육 등과 관련한 교과 내용이 담긴 설명문\n- 일상생활이나 학교생활에 대해 글쓴이의 주장과 근거가 잘 나타난 논설문\n- 일상생활이나 학교생활에서의 의미 있는 체험이 잘 드러난 감상문, 수필\n- 개인적인 관심사나 일상적 경험을 다룬 블로그, 영상물\n- 설문 조사, 면담, 동영상 등을 활용하여 제작된 텔레비전 뉴스, 광고\n- 다양한 관용 표현이 나타나 있는 글\n- 다양한 가치와 문화를 경험할 수 있는 문학 작품\n- 비유 표현이 드러나는 다양한 형식의 시나 노래, 글\n- 현실이 사실적으로 반영되거나 환상적으로 구성된 이야기\n- 또래 집단의 형성과 구성원 사이의 관계를 다룬 이야기나 극\n[중학교 1~3학년]\n목적, 맥락, 주제, 유형 등을 고려한 다양한 국어 활동을 바탕으로 하여 국어 교과의 기본 지식과 교과 역량을 갖추고, 자신의 국어 활동과 공동체의 국어문화를 비판적으로 성찰하고 개선하는 태도를 기른다.\n(1) 듣기·말하기\n중학교 1~3학년 듣기·말하기 영역 성취기준은 공식적·비공식적 상황에서 이루어지는 다양한 듣기·말하기에 관한 지식, 기능, 태도를 체계적으로 갖추는 데 중점을 두어 설정하였다. 목적과 맥락을 고려하며 다양한 유형의 듣기·말하기를 수행하고, 듣기·말하기를 통해 의사소통 능력과 문제 해결 능력을 기르는 데 주안점을 둔다.","l":"문학의 의의(가치 있는 내용, 아름다운 표현), 작품 속 세계와 현실 세계 비교하기, 비유적 표현, 이야기나 극으로 표현하기, 작품을 매개로 하여 소통하기, 작품에서 발견한 가치 내면화하기"},"2015|도덕|3~4학년|자신과의 관계|1":{"m":"① 교수·학습 방법\n도덕이야기 수업모형을 예로 들 수 있다. 도덕이야기 수업모형은 학생들에게 도덕적인 이야기를 통해 가치 규범과 덕에 관한 이해를 심화시키고 도덕적 문제 해결에 필요한 사고력과 판단력을 높이는 데 적합하다. 이 성취기준에 적용 가능한 활동으로는 위인의 감정 다스리기 일화를 공유하는 ‘모범 사례에 대한 탐구’, 학급의 주요한 행사(현장 학습, 운동회 등)에서 느꼈던 ‘감정을 돌아가며 말하기’, 상대의 감정 상태를 대화를 통해 알아내는 ‘감정 맞추기 놀이’ 등이 유용하다.\n② 유의 사항\n도덕적 이야기는 덕스러운 인간의 모습이고 학생들의 본보기가 되는 것이기 때문에 교사는 이야기 내용을 점검해야 한다. 그리고 학생의 흥미를 높이기 위해 교육 연극적 요소(역할극, 무언극 등)나 역할놀이 등의 다양한 방법을 적절히 활용한다.","v":"① 평가 방법\n도덕 생활 평가표를 예로 들 수 있다. 도덕 생활 평가표는 학생들이 수업 시간에 배운 도덕 지식을 일상생활에서 잘 실천하는가를 스스로 평가하는 방법이다. 도덕 생활 평가표는 체크리스트 평가와 유사하다. 하지만 도덕성의 형성 과정을 평가하기 위해서는 성찰 일기, 간단한 감사의 글, 반성의 글 등을 써 보는 것도 효과적이다.\n② 유의 사항\n도덕 생활 평가표 작성 시, 실천 가능성을 염두에 두어야 한다. 그래서 교사는 학생 스스로가 실천 가능한 항목을 구성하게 하고, 이를 꾸준히 실천하도록 도와야 한다.","l":"감정의 도덕적 표현, 감정 표현의 규범 상황, 도덕적 감정 표현 점검 등"},"2015|도덕|3~4학년|타인과의 관계|1":{"m":"① 교수·학습 방법\n자기주도적 프로젝트 학습 모형을 통하여 사이버 공간에서 일어나는 다양한 문제점들을 찾아보고 해결 방안을 탐구하여 이를 생활 속에서 실천해 볼 수 있다. 학생들은 개인 또는 소집단을 구성하여 사이버 공간에서 일어나는 여러 문제 중에 관심 있는 주제를 선정한다. 이 문제 해결을 위해 구체적으로 활동을 계획한 후, 조사와 자료 수집 등을 거쳐 결과물을 작성하고 발표할 수 있다. 또한 사이버 공간에서 발생하는 문제에 대해 민감하게 반응하고 다른 사람을 위해 자신이 할 수 있는 것을 실천해 보는 배려 모형을 활용할 수 있다.\n② 유의 사항\n교사는 프로젝트 학습 모형을 활용할 경우, 단순한 조사 학습으로 끝나지 않도록 학생들이 자신의 동기와 흥미를 충분히 고려하여 주제를 선정하도록 안내하며 학생들의 자율적 활동을 지원하기 위해 적절한 도움을 제공한다. 또한 정보를 탐색하고 수합하는 과정에서 저작권 침해 등과 같은 문제가 발생하지 않도록 유의한다. 배려 모형을 적용하는 경우, 배려는 관심 속에서 이루어지는 것이므로 학생 서로 간에 관심을 가지고 상호 존중적인 관계를 형성하도록 유도하는 것이 중요하다.","v":"① 평가 방법\n교사는 연구 보고서법을 활용하여 사이버 상황과 관련된 문제 해결 능력을 평가할 수 있으며 보고서를 평가할 때 자기 평가, 동료 평가, 교사 평가 등 다면적인 평가가 이루어지도록 한다. 그리고 다른 사람을 배려하는 행동 등에 대한 평가는 학생 상호 평가법을 사용할 수 있다.\n② 유의 사항\n보고서의 평가는 보고서의 질뿐만 아니라 저작권 준수 여부 및 작성 과정에서의 노력 정도를 평가하고, 소집단별로 학습 활동을 하는 경우 학생 상호 간에 협력하는 태도도 함께 평가한다. 학생 상호 평가법을 활용하는 경우 질문의 내용을 쉽고 명확히 하여 학생들이 흥미를 가지고 선택할 수 있도록 해야 한다.","l":"사이버 예절, 사이버 공간에서 발생하는 문제점(저작권 침해, 사이버 폭력, 온라인 중독 등)과 해결 방안 등"},"2015|도덕|3~4학년|사회·공동체와의 관계|1":{"m":"① 교수·학습 방법\n주변에 있는 전쟁 관련 사적지를 직접 방문하게 하거나 혹은 전쟁을 경험한 어른들을 찾아가서 그들과 이야기를 나누는 체험 학습을 하게 한다. 체험 활동을 통해 알게 된 내용과 느낀 점을 활동 기록지에 기록하는 과정을 통해 통일이 필요한 이유에 대해 학생들 스스로 탐구하고 성찰해 보도록 한다. 이러한 체험 학습은 사전에 계획하여 프로젝트 수업으로 진행 할 수도 있다. 프로젝트 수업을 계획할 경우 활동 과정에서 올바른 의사결정 하기, 행위 결과 도덕적으로 상상하기 등의 기능을 경험하게 할 수 있다.\n② 유의 사항\n교사는 학생들이 전쟁과 분단을 직접 경험하지 않은 세대임을 충분히 인지하고 지적인 접근보다는 실천과 체험을 통한 방법을 활용한다. 체험 활동은 개인별 혹은 모둠별로 이루어질 수 있으며 학생들의 상황과 조건에 알맞은 형태를 선택하여 실시한다.","v":"① 평가 방법\n포트폴리오 평가 방법을 활용한다. 주기적이면서도 지속적인 체험 활동을 하게 한 후 통일과 관련하여 자신의 느낀 점을 기록한 작품집을 제출하게 한다. 평가는 제출된 작품집을 이용하는 데, 통일에 대한 관심, 자신의 생활과 연계해 실천하려는 의지 등 학생 내면의 변화를 드러내는 과정을 중심으로 실시한다.\n② 유의 사항\n교사는 학생들이 체험 학습을 충실히 계획하고 실시하였는지 그리고 체험 활동 후에 통일과 관련하여 학생들의 어떤 부분이 변화하였는지 등을 중심으로 평가한다.","l":"민족 분단, 통일, 통일 의지, 통일 비용, 통일 편익 등"},"2015|도덕|3~4학년|자연·초월과의 관계|1":{"m":"① 교수·학습 방법\n개념분석 수업 모형을 적용하여 아름다움, 아름다운 사람의 의미와 중요성을 이해하고 이를 바탕으로 아름다운 사람의 모습을 탐구하도록 한다. 아름다운 사람을 찾아보는 활동을 통해 이해한 개념을 실생활에 적용해 보도록 하고, 수업을 통해 심미적 감수성이 자극될 수 있도록 한다. 또한 참된 아름다움을 탐구하는 과정에서 가치갈등 수업 모형을 활용할 수도 있다.\n② 유의 사항\n단순히 개념 정의를 이해하는 수준에 머무르지 않고, 이해한 개념을 자신의 모습에 적용하며 또한 자신을 돌아볼 수 있는 학습 활동이 될 수 있도록 한다.","v":"① 평가 방법\n자기 평가 방법을 사용할 수 있다. ‘자연·초월과의 관계’ 영역의 성취기준 도달은 자기 스스로를 살펴보고 숙고하는 과정을 통해 가능하므로 자기 평가 방법이 효과적일 수 있다. 자기 평가는 자기 평가표를 활용할 수 있으며 구체적이고 진실하게 작성하도록 한다. 또한, 자기 평가 과정을 통해 자신의 아름다움에 대한 관점이 드러나도록 한다.\n② 유의 사항\n학생 개인이 자신을 평가하는 자기 평가표의 결과뿐만 아니라 평소의 생활 습관 및 관찰 기록 등과 비교하여 평가하도록 한다. 자기 평가의 과정을 통해 내면의 변화를 발견하고 심미적 감수성을 기를 수 있도록 한다.","l":"사람의 아름다움, 참된 아름다움, 아름다운 삶의 모습 등"},"2015|도덕|5~6학년|자신과의 관계|1":{"m":"① 교수·학습 방법\n도덕이야기 수업모형을 예로 들 수 있다. 도덕이야기 수업모형은 학생들에게 도덕적인 이야기를 통해 가치 규범과 덕에 관한 이해를 심화시키고 도덕적 문제 해결에 필요한 사고력과 판단력을 높이는 데 적합하다. 이 성취기준에 적용 가능한 활동으로는 위인의 감정 다스리기 일화를 공유하는 ‘모범 사례에 대한 탐구’, 학급의 주요한 행사(현장 학습, 운동회 등)에서 느꼈던 ‘감정을 돌아가며 말하기’, 상대의 감정 상태를 대화를 통해 알아내는 ‘감정 맞추기 놀이’ 등이 유용하다.\n② 유의 사항\n도덕적 이야기는 덕스러운 인간의 모습이고 학생들의 본보기가 되는 것이기 때문에 교사는 이야기 내용을 점검해야 한다. 그리고 학생의 흥미를 높이기 위해 교육 연극적 요소(역할극, 무언극 등)나 역할놀이 등의 다양한 방법을 적절히 활용한다.","v":"① 평가 방법\n도덕 생활 평가표를 예로 들 수 있다. 도덕 생활 평가표는 학생들이 수업 시간에 배운 도덕 지식을 일상생활에서 잘 실천하는가를 스스로 평가하는 방법이다. 도덕 생활 평가표는 체크리스트 평가와 유사하다. 하지만 도덕성의 형성 과정을 평가하기 위해서는 성찰 일기, 간단한 감사의 글, 반성의 글 등을 써 보는 것도 효과적이다.\n② 유의 사항\n도덕 생활 평가표 작성 시, 실천 가능성을 염두에 두어야 한다. 그래서 교사는 학생 스스로가 실천 가능한 항목을 구성하게 하고, 이를 꾸준히 실천하도록 도와야 한다.","l":"감정의 도덕적 표현, 감정 표현의 규범 상황, 도덕적 감정 표현 점검 등"},"2015|도덕|5~6학년|타인과의 관계|1":{"m":"① 교수·학습 방법\n자기주도적 프로젝트 학습 모형을 통하여 사이버 공간에서 일어나는 다양한 문제점들을 찾아보고 해결 방안을 탐구하여 이를 생활 속에서 실천해 볼 수 있다. 학생들은 개인 또는 소집단을 구성하여 사이버 공간에서 일어나는 여러 문제 중에 관심 있는 주제를 선정한다. 이 문제 해결을 위해 구체적으로 활동을 계획한 후, 조사와 자료 수집 등을 거쳐 결과물을 작성하고 발표할 수 있다. 또한 사이버 공간에서 발생하는 문제에 대해 민감하게 반응하고 다른 사람을 위해 자신이 할 수 있는 것을 실천해 보는 배려 모형을 활용할 수 있다.\n② 유의 사항\n교사는 프로젝트 학습 모형을 활용할 경우, 단순한 조사 학습으로 끝나지 않도록 학생들이 자신의 동기와 흥미를 충분히 고려하여 주제를 선정하도록 안내하며 학생들의 자율적 활동을 지원하기 위해 적절한 도움을 제공한다. 또한 정보를 탐색하고 수합하는 과정에서 저작권 침해 등과 같은 문제가 발생하지 않도록 유의한다. 배려 모형을 적용하는 경우, 배려는 관심 속에서 이루어지는 것이므로 학생 서로 간에 관심을 가지고 상호 존중적인 관계를 형성하도록 유도하는 것이 중요하다.","v":"① 평가 방법\n교사는 연구 보고서법을 활용하여 사이버 상황과 관련된 문제 해결 능력을 평가할 수 있으며 보고서를 평가할 때 자기 평가, 동료 평가, 교사 평가 등 다면적인 평가가 이루어지도록 한다. 그리고 다른 사람을 배려하는 행동 등에 대한 평가는 학생 상호 평가법을 사용할 수 있다.\n② 유의 사항\n보고서의 평가는 보고서의 질뿐만 아니라 저작권 준수 여부 및 작성 과정에서의 노력 정도를 평가하고, 소집단별로 학습 활동을 하는 경우 학생 상호 간에 협력하는 태도도 함께 평가한다. 학생 상호 평가법을 활용하는 경우 질문의 내용을 쉽고 명확히 하여 학생들이 흥미를 가지고 선택할 수 있도록 해야 한다.","l":"사이버 예절, 사이버 공간에서 발생하는 문제점(저작권 침해, 사이버 폭력, 온라인 중독 등)과 해결 방안 등"},"2015|도덕|5~6학년|사회·공동체와의 관계|1":{"m":"① 교수·학습 방법\n주변에 있는 전쟁 관련 사적지를 직접 방문하게 하거나 혹은 전쟁을 경험한 어른들을 찾아가서 그들과 이야기를 나누는 체험 학습을 하게 한다. 체험 활동을 통해 알게 된 내용과 느낀 점을 활동 기록지에 기록하는 과정을 통해 통일이 필요한 이유에 대해 학생들 스스로 탐구하고 성찰해 보도록 한다. 이러한 체험 학습은 사전에 계획하여 프로젝트 수업으로 진행 할 수도 있다. 프로젝트 수업을 계획할 경우 활동 과정에서 올바른 의사결정 하기, 행위 결과 도덕적으로 상상하기 등의 기능을 경험하게 할 수 있다.\n② 유의 사항\n교사는 학생들이 전쟁과 분단을 직접 경험하지 않은 세대임을 충분히 인지하고 지적인 접근보다는 실천과 체험을 통한 방법을 활용한다. 체험 활동은 개인별 혹은 모둠별로 이루어질 수 있으며 학생들의 상황과 조건에 알맞은 형태를 선택하여 실시한다.","v":"① 평가 방법\n포트폴리오 평가 방법을 활용한다. 주기적이면서도 지속적인 체험 활동을 하게 한 후 통일과 관련하여 자신의 느낀 점을 기록한 작품집을 제출하게 한다. 평가는 제출된 작품집을 이용하는 데, 통일에 대한 관심, 자신의 생활과 연계해 실천하려는 의지 등 학생 내면의 변화를 드러내는 과정을 중심으로 실시한다.\n② 유의 사항\n교사는 학생들이 체험 학습을 충실히 계획하고 실시하였는지 그리고 체험 활동 후에 통일과 관련하여 학생들의 어떤 부분이 변화하였는지 등을 중심으로 평가한다.","l":"민족 분단, 통일, 통일 의지, 통일 비용, 통일 편익 등"},"2015|도덕|5~6학년|자연·초월과의 관계|1":{"m":"① 교수·학습 방법\n개념분석 수업 모형을 적용하여 아름다움, 아름다운 사람의 의미와 중요성을 이해하고 이를 바탕으로 아름다운 사람의 모습을 탐구하도록 한다. 아름다운 사람을 찾아보는 활동을 통해 이해한 개념을 실생활에 적용해 보도록 하고, 수업을 통해 심미적 감수성이 자극될 수 있도록 한다. 또한 참된 아름다움을 탐구하는 과정에서 가치갈등 수업 모형을 활용할 수도 있다.\n② 유의 사항\n단순히 개념 정의를 이해하는 수준에 머무르지 않고, 이해한 개념을 자신의 모습에 적용하며 또한 자신을 돌아볼 수 있는 학습 활동이 될 수 있도록 한다.","v":"① 평가 방법\n자기 평가 방법을 사용할 수 있다. ‘자연·초월과의 관계’ 영역의 성취기준 도달은 자기 스스로를 살펴보고 숙고하는 과정을 통해 가능하므로 자기 평가 방법이 효과적일 수 있다. 자기 평가는 자기 평가표를 활용할 수 있으며 구체적이고 진실하게 작성하도록 한다. 또한, 자기 평가 과정을 통해 자신의 아름다움에 대한 관점이 드러나도록 한다.\n② 유의 사항\n학생 개인이 자신을 평가하는 자기 평가표의 결과뿐만 아니라 평소의 생활 습관 및 관찰 기록 등과 비교하여 평가하도록 한다. 자기 평가의 과정을 통해 내면의 변화를 발견하고 심미적 감수성을 기를 수 있도록 한다.","l":"사람의 아름다움, 참된 아름다움, 아름다운 삶의 모습 등"},"2015|미술|3~4학년|체험|1":{"m":"① 몸 전체의 감각을 활용하여 직접적으로 체험하는 활동에 적극적으로 참여하도록 유도한다.\n② 체험 활동 후 자신의 느낌이나 생각을 글, 이미지, 소리, 영상, 사진, 행위 등을 통해 자유롭게 나타내도록 허용적인 수업 분위기를 조성한다.\n③ 현장 학습을 통한 직접적인 체험이나 사진, 영상, 멀티미디어 자료 등을 활용한 간접적인 체험 등을 통해 지도한다.\n④ 주변의 생활 용품, 생활공간, 영상물 등에서 미술과 관련된 것들을 조사·수집·분류하고, 의견을 나누는 과정을 통해 미술이 우리 삶과 밀접하게 관련되어 있음을 이해하도록 지도한다.","v":"①감각을 활용하는 능력, 대상을 관찰하고 이해하는 능력, 생활 속에서 미술을 발견하는 능력 등을 평가한다.\n② 체험 활동의 결과뿐만 아니라 관찰 태도, 자신의 느낌과 생각을 찾아보려는 노력 등을 지속적으로 관찰하여 평가한다.\n③관찰법, 발표 및 토의법, 연구보고서법 등을 활용하여 평가한다.","l":"자연물, 인공물, 감각, 주변 대상, 영상물 등"},"2015|미술|3~4학년|표현|1":{"m":"① 학생 작품이나 작가 작품 등을 활용하여 다양한 주제를 찾아보도록 지도한다.\n② 학습자의 삶에서 친근하고 흥미로운 것으로부터 주제를 자유롭게 떠올리도록 지도한다.\n③연상과 상상의 방법으로 유연하게 사고하거나 관찰의 방법으로 세심하게 대상을 탐색하도록 지도한다.\n④표현 방법과 과정에 대한 계획이 필요하다는 것을 알고 계획하도록 지도한다.\n⑤조형 요소는 체험, 감상 활동과 연계하여 자연스럽게 이해하고 적용하도록 지도한다.\n⑥ 직접 교수법을 활용하여기본적인 재료와 용구의 사용법을 구조화된 연습과 독립적인 연습을 통해 익히고, 안전하게 사용하도록 지도한다.","v":"①다양한 주제 탐색 능력, 상상과 관찰 능력, 조형 요소 이해 및 활용 능력, 기본적인 표현 재료와 용구 사용 능력 등을 평가한다.\n②표현 계획과 과정에 대한 관심, 표현 활동을 스스로 계획하는 태도, 재료와 용구를 안전하게 사용하는 태도 등을 지속적으로 관찰하여 평가한다.\n③실기 평가, 관찰법, 자기 평가 및 동료 평가 보고서법, 포트폴리오법 등을 활용하여 평가한다.","l":"주제, 주제 탐색 방법, 표현 계획 탐색, 조형 요소, 기본적인 표현 재료와 용구 등"},"2015|미술|3~4학년|감상|1":{"m":"①미술 작품과 관련된 정보나 이야기, 미술가에 대한 일화 등을 통해 미술 작품을 친근하게 느끼고 작품 감상에 흥미와 관심을 가지도록 지도한다.\n②다양한 분야의 미술 작품에 대한 감상 경험을 바탕으로 관심 있는 미술 작품과 미술가를 선택하여 설명하도록 지도한다.\n③작품에 대한 문장 만들기, 작품을 소개하는 편지쓰기, 작품 카드 찾기, 작품 속 장면을 연극으로 표현하기 등 놀이와 활동을 중심으로 자신의 느낌과 생각을 발표하도록 지도한다.\n④ 주변의 미술관·박물관 견학을 통해 미술 작품을 감상하는 태도를 익히도록 지도한다.","v":"①관심 있는 미술 작품과 미술가에 대한 조사 내용, 발표 능력 등을 평가한다.\n② 미술 작품과 미술가에 대한 흥미와 관심 정도, 적극적인 발표 태도, 올바른 작품 감상 태도, 작품을 소중히 다루는 태도 등을 지속적으로 관찰하여 평가한다.\n③관찰법, 발표 및 토의법, 감상문, 연구보고서법 등을 활용하여 평가한다.","l":"미술 작품, 미술가, 자신의 느낌과 생각, 감상 태도 등"},"2015|미술|5~6학년|체험|1":{"m":"①자신의 외적 특징뿐만 아니라 성격, 취향, 관심 등의 내적 특징을 마인드 맵, 브레인스토밍 등을 활용하여 찾아보도록 지도한다.\n②자신에게 의미 있는 인물이나 사물, 현상 등을 주의 깊게 관찰하여 특징적인 선, 형, 색, 이미지 등을 발견하도록 지도한다.\n③ 마크, 표지판, 픽토그램, 포스터, 광고 등의 시각 이미지를 생활 속에서 찾아보고 관찰하도록 지도한다.\n④게임, 퀴즈 등을 활용하여 학습자들이 이미지의 의미를 찾아보도록 지도한다.\n⑤ 미술 수업 내용과 관련된 다른 교과의 내용과 방법을 수업 전에 미리 찾아보도록 지도한다.","v":"①자신과 대상의 특징을 발견하는 능력, 이미지 이해 및 활용 능력, 발표 능력, 타 교과의 내용이나 방법 활용 능력 등을 평가한다.\n② 체험 활동의 결과뿐만 아니라 관찰 태도, 발표 및 토의에 적극적으로 참여하는 태도 등을 지속적으로 관찰하여 평가한다.\n③관찰법, 발표 및 토의법, 연구보고서법 등을 활용하여 평가한다.","l":"자신의 특징, 대상과 현상, 시각적 특징, 이미지의 의미와 활용, 타 교과의 활용 등"},"2015|미술|5~6학년|표현|1":{"m":"①주변 관찰, 자료 수집, 마인드맵, 참고 작품 감상 등을 통하여 소재를 탐색하고, 표현 주제로 발전시키도록 지도한다.\n② 결합, 분해, 강조 등 다양한 발상 방법을 활용하도록 지도한다.\n③자신의 아이디어와 관련된 정보를 수집하고 적합한 것을 선택하여 표현 내용을 구체화하는 데 활용하도록 지도한다.\n④조형 원리는 체험, 감상 활동과 연계하여 자연스럽게 이해하고 3, 4학년에서 학습한 조형 요소와 연계하여 활용하도록 지도한다.\n⑤재료와 용구에 따른 표현 방법의 특징을 이해하고, 표현 방법에 따른 표현 과정과 유의점을 이해하도록 지도한다.\n⑥서로의 작품에 대하여 이야기하면서 다양한 표현 내용과 방법 등에 관심을 가지도록 지도한다.","v":"①소재와 주제의 탐색 능력, 발상 방법 활용 능력, 표현 내용을 구체화하는 능력, 조형 원리 이해 및 활용 능력, 표현 방법의 특징과 과정 탐색 및 활용 능력, 제작 과정과 작품에 대한 설명 내용 등을 평가한다.\n②다양한 소재와 주제에 대한 관심, 아이디어를 발전시키려는 노력, 표현 과정에 집중하는 태도, 공동 작업에서 협력하는 태도, 재료와 용구를 안전하게 사용하는 태도, 발표 및 토의에 적극적으로 참여하는 태도 등을 지속적으로 관찰하여 평가한다.\n③실기 평가, 관찰법, 발표 및 토의법, 자기 평가 및 동료 평가 보고서법, 포트폴리오법 등을 활용하여 평가한다.","l":"소재, 아이디어 발상, 조형 원리, 표현 방법과 과정의 탐색, 작품 제작 과정 발표 등"},"2015|미술|5~6학년|감상|1":{"m":"①우리나라 전통 미술과 현대 미술의 비교 감상을 통해 전통 미술의 특징을 이해하도록 지도한다.\n②미술 작품의 시대적 배경에 중점을 두어 지도하며, 자료집 제작, 비교하여 글쓰기, 발표하기, 토론하기 등 다양한 방법을 활용하여 지도한다.\n③퀴즈, 낱말 카드 등 게임을 활용하여 학습자들이 미술 용어에 흥미를 가지도록 지도한다.\n④학습자의 수준을 고려하여 감상 작품의 수, 감상 관점 등을 적절하게 계획한다.","v":"①우리나라 전통 미술과 현대 미술의 특징 이해 및 비교 능력, 시대적 배경 이해 능력, 작품의 내용과 형식 분석 능력, 미술 용어 활용 능력, 다양한 감상 방법 활용 능력 등을 평가한다.\n②우리나라 전통 미술에 대한 흥미와 관심 정도, 작품을 자세히 관찰하는 태도, 작품의 배경을 탐구하고 조사하는 태도, 다양한 의견을 존중하는 태도 등을 지속적으로 관찰하여 평가한다.\n③ 관찰법, 발표 및 토의법, 감상문, 연구보고서법 등을 활용하여 평가한다.","l":"전통 미술, 현대 미술, 시대적 배경, 작품의 내용, 작품의 형식, 미술 용어, 감상 방법 등"},"2015|바른 생활|1~2학년|가족|1":{"m":"① 가족에게 고마운 마음과 존중하는 태도를 갖고 가족의 소중함을 일깨울 수 있도록 학생 개개인의 다양한 경험을 공유하게 한다. 학생들의 경험을 자연스럽게 수업 주제로 이끌어 낼 수 있도록 수업을 계획한다.\n② 가족 간의 대화나 예절의 중요성과 관련한 모둠별 인형 놀이, 역할 놀이 등에 학생들이 직접 참여하고 실천할 수 있는 기회를 제공한다.\n③ 전형적인 가족의 형태를 규준으로 제시하는 것을 지양하고, 예화나 설명 및 그림을 통해 다양한 가족의 형태를 자연스럽게 제시하도록 한다. 이 학습 과정에서 서로 다른 가정의 형태를 가진 학생 간에 마음의 상처를 주지 않도록 지도한다.","v":"① 가족 간의 문제 해결, 가족 간의 알맞은 호칭과 존칭 사용, 가족과 친척의 소중함 등과 관련된 모둠별 역할 놀이나 상황극을 수행하게 하고, 그 과정에서 학생들의 협동성, 수행 완성도 등을 평가한다.\n② 관계 맺기, 습관화하기 등의 실천 기능과 공동체 역량, 의사소통 역량 등의 교과 역량도 함께 평가할 수 있도록 모둠활동 평가를 실시할 수 있다.\n③ 협력학습을 통해 특정 집단이나 문화에 대한 고정관념이나 편견은 없는지 찾아보고 반성하는 기회를 갖게 하며, 그 과정에서의 학생 반응 등 학습 수행 과정을 평가한다.","l":"가정 예절, 친척, 가족 문화, 가족 형태, 다문화"},"2015|바른 생활|1~2학년|여름|1":{"m":"① 에너지를 절약하는 방법에 중점을 두어 냉방 기구를 바르게 사용하는 방법, 전기를 절약하는 방법, 생활 용품을 절약하는 방법 등을 익히고 이를 실생활에서 실천하게 한다.\n② 생활 계획 작성 시 여름방학 동안 지켜야 할 일에 무엇이 있는지를 협력학습을 통하여 찾아보게 하고, 학생이 스스로 지킬 일을 자율적으로 결정할 수 있게 도움을 준다.\n③ 영상 매체나 사진 자료 등을 활용하여 여름철 건강 관리의 중요성을 알고 실천하게 한다.\n④ 땀을 많이 흘리는 더운 여름철에 지켜야 할 손 씻기, 손발톱 깎기, 목욕하기 등의 개인 위생을 지속적으로 실천하여 깨끗한 위생 상태를 유지하도록 지도한다.","v":"① 여름철 위생 관리나 건강 관리 등을 관찰 평가를 통해 지속적으로 지도하고 그 내용을 누가 기록하여 포트폴리오 평가를 한다.\n② 여름철 에너지 절약하기, 여름방학 생활 계획하기, 학습 스스로 준비하기 등에 초점을 두고 학생들의 경험과 이야기가 평가 활동에 드러나도록 평가를 계획한다.\n③ 여름철 생활을 건강하게 보낼 수 있는 생활 습관이 형성되어 있는지를 유의하며 평가한다.","l":"에너지 절약, 여름철 건강 관리, 개인 위생, 여름방학 계획"},"2015|바른 생활|1~2학년|마을|1":{"m":"① 도서관, 놀이터, 공원 등 공공장소에서 지켜야 할 일과 그 안에 설치된 시설물의 올바른 사용 방법을 알아보고 바르게 사용할 수 있도록 지도한다.\n② 이웃 사람을 만나게 되는 상황을 열거해 보고, 그 상황에서 어떤 행동이 바르고 적절한지 알아보는 상황극을 할 수 있다.\n③ ‘좋은 이웃에 대한 경험’을 발표함으로써 이웃 간에 지킬 예절을 학생 스스로 깨닫게 한다. 학생들의 경험을 발표할 때 이웃에 대한 부정적인 이야기에 편중되지 않도록 유의한다.\n④ 근면과 성실의 태도에 초점을 두어 일의 소중함을 일깨우고, 학교와 동네에서 자신이 할 수 있는 일을 찾아서 직접 실천할 수 있도록 지도한다.","v":"① 인형 놀이나 역할 놀이 등의 방법으로 학습하는 과정에서 가게, 놀이터, 승강기 등에서 이웃과 만났을 때 올바르게 인사하거나 대화하는지 평가한다.\n② 짝과 역할을 정해 이웃과 만나는 상황극을 연출하고 발표한 것에 대해 평가할 수 있다. 또는 상황 카드(예, 새로운 이웃이 이사를 왔을 때, 이웃집에서 손님으로 놀러왔을 때 등)를 보여주고 선택하게 한 후 그에 맞는 상황극을 해 보도록 하여 평가할 수 있다.\n③ 누적 기록 평가(체크리스트)를 통해 자기 행동에 대한 반성의 기회를 갖게 하고 그 과정을 평가하되, 일부 혹은 특정한 학생의 잘못된 행동에 대해 비난하거나 조롱하지 않게 한다.\n④ 이웃과의 예절, 공공 시설물 사용 규칙 등에 대하여 인지적 측면뿐만 아니라 실천적 측면을 함께 평가한다.","l":"이웃 간 예절, 공중도덕, 일의 소중함"},"2015|바른 생활|1~2학년|가을|1":{"m":"① 가을 운동회, 전시회, 체험학습 등 가을 행사에 참여한 경험(유치원 혹은 1학년 등)을 이야기해 보고, 학생들이 지켜야 할 규칙을 토의하여 체크리스트나 팝업 책자로 만들어 본다.\n② 사람들이 많이 모이는 가을철 지역 사회 행사 등에 직접 참여할 수 있는 다양한 체험 기회를 제공하고, 학생들이 공공장소에서 지켜야 할 예절과 규칙을 실천하도록 사전에 지도한다.\n③ 가을에 볼 수 있는 여러 가지 열매와 곡식이 여러 과정과 많은 사람들의 노력을 통해 우리에게 전달된다는 점에 중점을 두어, 추수하는 사람들의 모습이 담긴 사진이나 동영상 자료를 활용하여 추수하는 과정에 대하여 이해하고 감사하는 태도를 기르도록 지도한다.","v":"① 교내 행사에서 지켜야 할 예절이나 규칙을 자기 평가, 동료 평가 등에 포함시켜 꾸준히 누가 기록하고 이를 평가에 반영한다.\n② 일회성 평가보다는 지속성 있는 평가를 실시하고, 동료 평가를 할 때는 학생들이 정확한 기준 아래 공정한 평가를 할 수 있도록 평가 기준에 대해 사전 지도를 철저히 한다.\n③ 여러 사람이 지켜야 할 규칙을 준수하고, 추수하는 사람들에 대해 감사하는 마음이 형성되어 있는지 평가한다.","l":"공공 규칙, 타인 배려, 추수하는 사람들에 대한 감사"},"2015|바른 생활|1~2학년|나라|1":{"m":"① 지구상의 유일한 분단국가인 우리나라와 북한의 상황을 알고, 그로 인한 이산가족의 아픔을 공감하며 더 나아가 통일에 대한 의지를 다질 수 있도록 지도한다.\n② 관련 인사를 초청하여 북한 또는 다른 나라에 대한 이야기를 직접 듣거나 관련 인사와 함께 대화하는 기회를 제공할 수 있다. 이때, 학생들이 관련 인사에 대한 선입견이나 편견을 갖지 않도록 사전 지도한다.\n③ 문화 간의 차이를 존중하고 공감할 수 있도록 지도한다. 즉 한국인으로서의 정체성이 타문화에 대한 배타적인 태도로 귀결되지 않도록 유의한다.\n④ 자신이 가족과 오랜 시간 동안 이별하는 상황에 처했을 때의 감정에 대해 이야기해 보기, 분단에 의한 이산가족의 사례를 읽고 가족과 만나지 못하는 슬픔에 공감하기 등의 활동을 통해 이산가족의 아픔과 통일의 필요성을 느낄 수 있도록 한다.\n⑤ 다른 나라의 식사 예절과 인사법, 명절과 풍습 등의 체험을 통해 그 나라의 문화를 이해하고 존중하는 태도를 기를 수 있도록 한다.","v":"① 북한과 같은 민족임을 알고 통일을 해야 하는 이유를 설명할 수 있는지 다양한 방법을 활용하여 평가한다.\n② 다양한 사람, 다양한 문화 등을 조사·소개하는 활동을 통해 다른 문화에 대한 존중 및 공감하는 태도를 평가한다. 문화 다양성의 의미를 알고, 타문화를 존중하는 태도를 지녔는지 평가한다.","l":"같은 민족, 통일 의지, 반 편견, 타문화 존중, 공감"},"2015|바른 생활|1~2학년|겨울|1":{"m":"① 어려운 이웃을 돌아보는 활동을 통해 사회는 함께 더불어 살아가는 곳이라는 점을 이해하고 공감하는 데 중점을 둔다. 추운 겨울을 어렵게 지내는 이웃에게 직접 혹은 간접적으로 도움을 주는 방법을 모색하여 실천하도록 한다.\n② 겨울나기에 대비하여 주변의 식물이 겨울을 무사히 날 수 있도록 잘 관리하고 보호하는 방법을 찾아 스스로 실천하도록 한다.\n③ 겨울나기를 준비해야 하는 여러 가지 동물들을 알아보고 이들을 보호하려는 실천 의지를 기르게 한다.\n④ 겨울방학과 새해에 하고 싶은 일을 스스로 계획하고 실천하도록 지도한다. 또한 방학이 끝난 후 활동 결과에 대해 이야기를 나누고, 바람직한 활동 사례를 공유하거나 반성하는 시간을 갖게 한다.","v":"① 주변의 어려운 이웃에 대한 이해와 공감을 바탕으로 이들을 꾸준히 도우려는 의지와 태도를 자기, 동료, 교사 등 다양한 관점에서 관찰하여 평가한다.\n② 주변 식물의 겨울나기 도움 활동을 직접 체험하면서 그 과정을 평가하거나, 활동 과정에 대해 이야기 형식으로 짧게 기록한 내용을 평가에 활용할 수 있다.\n③ 겨울방학 계획 시 자유로운 형식으로 계획서를 작성하여 학습 및 생활에 대한 자기 관리 능력을 충분히 고려했는지 확인하고, 작성한 과제 및 활동을 매일 혹은 주별 체크리스트에 누가 기록하게 하여 평가한다.\n④ 이 영역(대주제)은 시기적으로 겨울방학 전에 평가가 이루어지게 되므로 교사는 학생의 지속적인 성장을 염두에 두고 평소에 관찰한 학생의 모습을 평가에 포함시킨다.","l":"나눔과 봉사, 배려, 생명 존중, 방학 계획"},"2015|사회|3~4학년|우리가 살아가는 곳|1":{"x":"이 단원은 고장에 대한 서로 다른 장소감을 표현하고, 이와 함께 디지털 영상 지도 등을 활용하여 고장의 실제 모습을 파악하는 데 주안점을 둔다.","m":"교수·학습의 과정은 고장에 대한 심상 지도 그리기, 장소감 나누기, 고장 내 주요 지형지물(산, 하천, 도로, 건물, 자기 집, 학교 등)의 위치 파악하기, 고장의 실제 모습 정리하기 등의 활동으로 이루어질 수 있다.\n‘심상 지도 그리기’에서는 고장 내 장소 관련 경험담, 사진 자료 등을 주요 자료로 활용하고, ‘장소감 나누기’에서는 학생 각자가 작성한 고장의 심상 지도를 활용한다. 이어 ‘지형지물의 위치 파악하기’에서는 디지털 영상 지도를, ‘고장의 실제 모습 정리하기’에서는 고장의 주요 지형지물을 표시한 백지도를 만들어 활용한다.\n‘심상 지도 그리기’의 경우 고장의 모습을 기성의 지도 형식으로 정확하게 그리기보다는 고장에 대해 떠오르는 생각들을 자유롭게 표현하도록 하는 데 주안점을 둔다.\n‘장소감 나누기’에서는 사람마다 장소에 대한 기억과 느낌이 서로 다르다는 점을 알도록 하면서도 공통적으로 등장하는 지형지물의 위치나 종류에도 관심을 갖도록 유도한다.\n‘지형지물의 위치 파악하기’에서는 인터넷 영상 지도의 축소 및 확대 기능을 활용하여 고장 모습을 다양한 규모에서 살펴보도록 한다. 이를 통해 고장 내 주요 지형지물의 위치와 고장의 실제 모습을 전체적으로 살펴본다.\n‘고장의 실제 모습 정리하기’와 관련하여 고장의 백지도에 ‘주요 지형지물을 재배치하기’에서는 교사가 제작한 약도 형식의 백지도를 활용할 수 있다.\n교수·학습 과정에서 창의성을 발휘하고, 고장에 대한 애향심과 함께 서로 다른 생각을 존중하는 태도를 함양할 수 있도록 지도한다.","v":"① 평가 방법\n여러 심상 지도를 제시하여 이들의 공통점과 차이점을 비교하는 표를 완성하거나 문장 형식으로 진술하도록 하여 학습자의 관찰 능력 및 의사소통 능력을 평가한다.\n고장 백지도에 주요 지형지물을 배치하거나, 고장의 지도나 영상 정보에서 주요 지형지물을 식별해 내게 하는 수행평가 방식을 활용하여 학습자의 공간 인지 능력을 평가한다.\n② 유의 사항\n심상 지도에서 공통점과 차이점을 탐색할 수 있는 능력을 평가할 때는 색채나 형태의 표현 등 예술적 기량보다는 사물의 입지, 경관, 배열 파악 등 공간 인지 능력에 중점을 둔다.\n고장의 실제 공간적 특성에 대한 인지 정도를 평가할 때에는 사물의 크기, 사물 간 거리와 같은 기하학적 특성보다는 방향을 포함하여 학습자가 제시한 사물 간 위치 관계 정보의 정확도에 중점을 둔다.\n학습이나 평가 활동을 위한 공간적 범위는 학교의 입지 환경에 따라 교사가 적절히 설정한다.\n<우리가 알아보는 고장 이야기>","l":"장소감의 표현과 공유, 고장 내 주요 지형지물의 위치와 분포 파악, 고장의 실제모습"},"2015|사회|3~4학년|우리가 살아가는 곳|2":{"x":"이 단원은 학생들이 생활하는 공간인 고장과 관련된 옛이야기와 문화유산의 역사적 가치 등을 인식함으로써 고장에 대한 자긍심을 갖도록 하는 데 주안점을 둔다.","m":"고장의 옛이야기와 관련된 동영상, 사진, 이야기책 등을 수업 자료로 활용하거나 전문 자원 인사를 초빙하여 강연을 듣게 함으로써 고장의 역사적인 유래와 특징을 이해하고, 고장에 대한 관심과 자부심을 갖도록 안내한다.\n고장의 역사적 유래와 특징 및 고장의 대표적인 문화유산에 대한 조사 학습을 실시할 수 있으며, 조사 학습을 위한 구체적인 방법(인터넷 검색하기, 시·군·구청 누리집 방문하기, 박물관 답사하기, 문화원 견학하기, 고장 안내도에서 문화유산의 위치 찾기 등)을 학생들에게 사전에 안내할 필요가 있다.\n자료 수집 방법을 참고하여 고장의 옛이야기, 문화유산 등의 자료를 조사하고, 조사한 내용들을 다양한 방식으로 정리하고 발표하도록 할 수 있다. 이때 교사가 엄선한 자료도 함께 제공하여 이를 활용해 정리하게 함으로써 학생들의 이해와 활동을 돕는다.\n고장의 문화원이나 박물관을 활용할 경우 사전 학습과 사후 학습을 통해 고장의 다양한 이야기를 경험할 수 있도록 한다.\n고장 답사 활동과 관련된 장소 견학 활동 후 그 결과를 정리하여 공유하도록 하게 할 수 있다.","v":"① 평가 방법\n고장 답사 활동의 경우 체크리스트법이나 관찰법 등을 활용하여 고장의 옛이야기, 지명, 문화유산 등에 대한 이해와 활동에 대한 참여도 등을 평가한다.\n조사 결과를 개별 또는 모둠별로 발표하도록 하고, 관찰법이나 면접법을 활용하여 고장의 역사적 유래와 특징, 문화유산의 역사적 가치를 이해하고 있는지를 평가한다.\n② 유의 사항\n조사 학습 과정을 평가할 경우 활동 단계에서는 조사 내용의 타당성 및 충실성, 조사 활동에 대한 참여도 등을 평가하도록 하며, 정리 단계에서는 조사 결과 정리 및 발표의 체계성 등을 평가하도록 한다.\n문화유산의 이름과 같은 단순 사실을 측정하기보다는 고장의 옛이야기, 문화유산 속에 담긴 역사적 유래와 특징 등을 명확하게 이해하는지를 평가한다.\n<교통과 통신수단의 변화>","l":"고장의 역사적 유래와 특징, 고장의 문화유산"},"2015|사회|3~4학년|우리가 살아가는 곳|3":{"x":"이 단원은 교통 및 통신수단의 발달 과정을 탐구하고, 이를 통해 교통과 통신수단의 발달이 우리 고장 사람들의 생활 모습 변화에 어떤 영향을 미쳤는지 파악하는 데 주안점을 둔다.","m":"교통 및 통신수단의 발달에 따른 고장 사람들의 생활 모습 변화를 조사할 경우 옛날과 오늘날의 사진 자료, 고장의 누리집, 박물관, 면담, 답사 등을 활용할 수 있다.\n교통수단 및 통신수단의 명칭을 자세하게 제시하기보다는 변화의 방향이나 특징을 전반적으로 파악할 수 있도록 안내한다.","v":"① 평가 방법\n‘옛날과 오늘날 우리 고장 사람들의 생활 모습 변화’에 관한 평가 활동 과제 주제로는 전화기의 변화에 따른 고장 사람들의 생활 모습 변화, 탈것의 변화에 따른 고장 사람들의 생활 모습 변화 등이 활용될 수 있다.\n교통 및 통신수단의 발달에 따른 우리 고장 사람들의 생활 모습 변화에 대한 이해도를 평가할 경우 서술형을 비롯하여 보고서법 등을 다양하게 활용할 수 있다.\n② 유의 사항\n학생들의 발달 수준에 적합한 간략하고 다양한 형태의 평가 과제(책 만들기, 신문 형태로 만들기 등)를 제시할 수 있다.\n보고서법을 활용할 경우 개인 또는 모둠별로 평가할 수 있다.","l":"교통수단, 교통수단의 발달 과정과 고장 생활의 변화, 통신수단, 통신수단의 발달 과정과 고장 생활의 변화"},"2015|사회|3~4학년|우리가 살아가는 모습|1":{"x":"이 단원은 고장마다 서로 다른 생활 모습의 차이, 고장의 자연환경 및 인문환경과 생활 모습 간의 관계 등에 대한 조사를 통해 환경에 따른 인간 생활의 다양성을 탐구하는 데 주안점을 둔다.","m":"‘고장의 환경과 생활 간 관계’를 학습할 때는, 먼저 고장의 특징적인 자연환경이나 인문환경을 조사하도록 한 후에 이것이 여가 및 생산 활동 등 고장 사람들의 생활과 어떤 관계가 있는지를 탐색하는 방식으로 전개할 수 있다. ‘환경에 따른 생활양식의 다양성’을 학습할 때는, 우리 고장과 다른 고장의 음식, 복식, 가옥의 사례를 수집하여 두 고장 간의 공통점과 차이점 등을 비교하는 방식으로 진행할 수 있다.\n계절별 전형적인 일기 예보 영상, 계절 변화에 따른 일상 경험이나 사진 자료, 다큐멘터리 프로그램이나 인터넷 이미지 자료 등 주제에 부합하는 시각 자료를 활용한다. 고장 안내 책자나 누리집 자료를 활용하거나 고장의 환경 특성을 살펴보기 위해 답사 활동을 할 수 있다.\n여러 시각 및 공간 자료를 주의 깊게 관찰하고 해석하는 활동을 제시함으로써 기초적인 수준의 도해력을 함양하도록 한다.\n고장의 지리적 특성을 탐색하는 활동에서는 자연적 조건이나 인문적 조건이 고장 사람들의 생활 모습과 어떤 관계가 있는지 파악하도록 유도함으로써 초보적인 수준에서 관계적 사고 능력을 기르는 데에도 유의한다. 이 경우 환경결정론적 사고를 갖지 않도록 유의한다.\n우리 고장과 다른 고장의 생활 모습을 비교하는 학습활동의 경우 ‘다른 고장’의 사례를 탄력적 환경 확대법에 따라 세계적 범위에서도 선정할 수 있다.","v":"① 평가 방법\n고장의 지리적 특성에 관한 이해도를 평가할 경우에 글, 그래프, 그림, 음악 등 다양한 형식으로 고장의 특성을 표현하도록 안내한다.\n환경에 따른 생활 모습의 다양성에 대한 이해도를 평가할 경우에 사진 자료나 텍스트 혹은 그래픽 자료를 제시하여 비교 설명하도록 하는 서술형 평가를 구안할 수 있다.\n② 유의 사항\n단편적인 사실 지식의 습득 여부나 열거 능력보다는 자료의 비교 분석이나 관계적 사고 능력을 평가하는 데 주안점을 두도록 유의한다.\n텍스트 자료보다는 공간 능력을 배양할 수 있는 지도나 사진 등 시각적 자료를 활용하여 평가할 수 있다.\n<시대마다 다른 삶의 모습>","l":"고장의 자연환경 및 인문환경, 고장의 환경과 생활 간 관계, 환경에 따른 생활 모습의 다양성"},"2015|사회|3~4학년|우리가 살아가는 모습|2":{"x":"이 단원은 생활 도구와 주거 형태 및 세시 풍속을 중심으로 옛날과 오늘날의 고장 사람들의 생활 모습을 탐색하여 고장 사람들의 생활 모습이 시대에 따라 변화한다는 점을 파악하는 데에 주안점을 둔다.","m":"학교와 고장의 여건 등을 고려하여 박물관 또는 민속촌과 같이 옛 사람들의 생활을 재현한 공간이나 장소 등을 견학하는 현장 학습을 통해 옛 사람들의 생활 모습을 파악할 수 있고, 사진과 동영상 등의 자료를 활용할 수 있다.\n옛 사람들의 모습을 재현해 놓은 그림을 통해 옛 사람들의 생활 도구와 주거 형태, 생활 모습 등을 파악할 수 있다.\n옛 사람들의 생활 모습이 잘 드러나는 사진, 동영상, 옛 사람들이 사용했던 생활 도구 모형 등의 구체적인 자료를 제시하여 당시 사람들의 생활 모습을 오늘날의 생활 모습과 비교하여 상상할 수 있도록 한다.\n옛 사람들이 사용했던 생활 도구를 만들어 보는 문화유산 모형 제작 활동과 생활 도구들을 직접 사용해 보는 활동을 통해 옛 사람들의 생활 모습을 파악할 수 있도록 한다.\n옛 사람들의 생활 도구와 주거 형태를 오늘날과 비교하여 불편했다거나 좋지 않다 등과 같이 부정적으로 평가하기보다는 당시 사람들이 왜 그런 도구와 주거를 만들어 사용하게 되었는지를 이해하도록 한다.\n학생들이 직접 경험했던 세시 풍속을 중심으로 흥미와 관심을 이끌어낸다.","v":"① 평가 방법\n옛날과 오늘날의 생활 도구와 주거 형태의 공통점과 차이점을 설명하는 능력을 서술형으로 평가할 수 있다.\n체크리스트법을 활용하여 문화유산 모형 제작 활동 및 주거 형태에 대한 조사 활동 과정(준비도, 참여도, 완성도 등)을 평가할 수 있다.\n② 유의 사항\n서술형 평가 문항은 단순 사실에 대한 지식을 평가하기보다는 생활 도구와 주거 형태의 변화 양상을 파악하는 사고를 촉진하는 질문으로 구성한다.\n<가족의 모습과 역할 변화>","l":"옛 사람들의 생활 도구와 주거 형태, 생활 모습의 변화, 옛날과 오늘날의 세시 풍속"},"2015|사회|3~4학년|우리가 살아가는 모습|3":{"x":"이 단원은 옛날과 오늘날의 혼인 풍습과 가족 구성을 비교하고 가족의 모습과 가족 구성원의 역할이 어떻게 변화하였는지를 알아보는 데 주안점을 둔다.","m":"다양한 가족 구성 사례를 분석하여 옛날과 다른 현대 가족 형태의 특징을 파악하고 현대의 여러 가족 형태에 대한 역할 놀이를 통해 가족의 다양한 삶의 모습을 표현하도록 한다.\n학생들이 직접 경험할 수 있는 가족 관련 자료나 사례를 활용할 수 있다.\n가족에 대해 다룬 동화, 드라마, 영화 등을 자료로 활용하여 학생들이 서로 다른 가족들의 다양한 삶의 모습을 구체적으로 이해할 수 있도록 돕는다. 이때 특정한 가족 형태나 가족의 모습을 이상적인 것으로 제시하지 않도록 유의한다.\n옛날과 오늘날의 혼인 풍습과 가족의 구성원의 역할을 이해하는 데 그치지 말고, 현대에도 계승되었으면 하는 생활 모습에는 무엇이 있는지 탐색하는 활동을 전개한다.\n학생들의 가족 형태나 가족생활의 모습이 다양할 수 있으므로 신중하게 접근할 필요가 있다. 학생들의 실제 가족생활을 학습의 소재로 할 경우 사생활 침해의 우려가 있으므로 유의한다. 또한 특정 가족 형태나 가족생활 모습에 대한 편견이 수업 내용에 반영되지 않도록 유념한다.\n현대에는 다양한 가족 형태가 있음을 이해하고 가족 형태의 다양성을 존중할 수 있도록 지도한다.\n역할 놀이를 통해 학생들이 가족 구성원의 바람직한 역할에 대해 생각해 볼 수 있는 기회를 제공할 수 있다.","v":"① 평가 방법\n생활 주변에서 접할 수 있는 다양한 가족 이야기를 역할극으로 꾸며 보거나 가족 갈등을 다룬 이야기의 결말 부분을 완성하는 활동을 통해 바람직한 가족 구성원의 역할에 대해 이해하고 있는지 평가한다.\n가족 구성원의 역할에 대한 고정 관념을 조사하고 이를 개선하고 실천할 수 있는 방안에 대한 보고서를 작성하여 평가할 수 있다.\n포트폴리오 방식을 활용하여 학생들이 일정 기간 동안 가정에서 가족 구성원으로서 수행할 역할을 계획하고, 이를 실천한 내용을 일지에 작성하도록 하여 평가할 수 있다.\n옛날과 오늘날의 혼인 풍습과 가족 형태의 차이점에 대하여 서술하고 이와 같은 차이가 발생한 원인에 대하여 이해하고 있는지 평가할 수 있다.\n② 유의 사항\n학생들이 일정 기간 동안 가정에서 가족 구성원으로서 실천한 내용을 포트폴리오로 작성할 때, 학생 개인의 사생활이 침해되는 일이 없도록 유념하여 지도한다.","l":"옛날과 오늘날의 혼인 풍습, 옛날과 오늘날의 가족 구성, 현대의 다양한 가족 형태, 가족 구성원의 역할"},"2015|사회|3~4학년|우리 지역의 어제와 오늘|1":{"x":"이 단원은 지도를 구성하는 기본 요소에 대한 이해를 통하여 지도 읽기 능력을 기르고, 지도를 비롯한 여러 자료를 활용하여 다양한 중심지의 특성을 탐구하는 데 주안점을 둔다.","m":"지도의 기본 요소에 대한 교수·학습에서 맥락 없이 각 요소를 학습하기보다는 지도의 기본 요소가 모두 포함되어 있는 전형적인 지도를 놓고 기본 요소들을 찾아보는 활동이 선행되도록 한다. 지도의 요소별 내용 이해 활동에서는 각 요소를 개인 혹은 집단별로 할당하여 탐구하도록 한 다음에 종합하는 방식도 가능할 수 있다.\n지역 중심지 교수·학습의 경우 먼저 주민의 일상생활과 관련된 다양한 중심지의 위치를 지도에서 확인한 후에 자료 분석이나 답사 활동을 토대로 중심지별 기능 및 경관 특성을 비교 분석하는 방식으로 활동을 전개한다. 이 경우 모둠 활동을 통한 집단 사고와 협동 학습이 적절할 것이다.\n중심지 학습에서는 공간 범위가 지역 규모로 확대되었다는 점에 유의하며, 중심지 탐색 과정에서 자신이 살아가고 있는 시·도 규모의 지역 범위를 전체적으로 살피도록 할 필요가 있다. 탄력적 환경 확대법을 적용하여 중심지 탐색의 범위를 고장 규모는 물론, 시·도 행정 경계를 넘어 이웃 지역으로도 확대할 수 있다.\n축척 학습의 경우 분수나 비율식을 통한 거리나 면적의 산술적 계산 활동, 대축척과 소축척의 구분 활동 등은 지양한다. 그 대신 지도상에 제시된 줄인자(축척 막대자)를 이용하여 대략적인 거리감을 익혀 축척의 개념을 이해하도록 한다.\n지도의 기본 요소에 대한 학습활동에서 요소별 파편적인 이해보다는 다양한 형식의 일반도나 주제도에 나타난 쓰임새를 통해 맥락적인 이해가 이루어지도록 한다.","v":"① 평가 방법\n지도의 기본 요소에 대한 평가의 경우 기본 요소의 필요성 이해와 실제 생활에의 활용 능력에 초점을 맞춘다. 이때 방위 기입이나 기호 식별과 같은 탈맥락적인 지필 검사보다는 실제 방위를 찾아내거나 실제 지도를 그리는 수행 활동을 통해 지도 요소의 활용 능력을 평가한다.\n중심지 이해에 대한 평가의 경우 지도에서 여러 중심지의 위치를 파악하고 기능 및 경관의 차이를 찾아보도록 하거나 중심지 답사 활동 보고서 작성과 같은 수행평가를 적용할 수도 있을 것이다. 지필 평가에서도 글 자료보다는 지도, 사진 등의 시각 및 공간 자료를 제시하고 그 특징이나 의미를 찾아내도록 한다.\n② 유의 사항\n중심지 답사 활동 시 안전사고에 특히 유의하며, 평소 익숙했던 것들에도 관심을 가지고 관찰하고 그것에서 의미를 찾아내도록 유도함으로써 창의적 사고력을 제고할 수 있도록 구안한다.\n지도의 기본 요소 학습이나 중심지 특성 학습에 대한 평가에서는 실제 지도를 적절히 활용하도록 한다.\n<우리가 알아보는 지역의 역사>","l":"지도의 기본 요소, 중심지의 위치와 기능 및 경관, 지역의 특성"},"2015|사회|3~4학년|우리 지역의 어제와 오늘|2":{"x":"이 단원은 현장 학습이나 조사 학습 등을 통해 우리 지역을 대표하는 유·무형의 문화유산에 대하여 알아보고, 우리 지역과 관련된 자랑스러운 역사적 인물을 조사하여 지역에 대해 자부심을 갖도록 하는 데 주안점을 둔다.","m":"지역의 문화유산과 인물들에 대한 내용을 조사하고 그 내용을 문화재 해설사, 기자 등과 같은 역할을 맡아 친구들 앞에서 소개할 수 있도록 한다.\n위인전, 사진, 동영상 등의 구체적 자료들을 제시하여 우리 지역과 관련된 인물과 문화유산에 대한 관심과 자긍심을 높이도록 한다.\n지역의 문화원이나 박물관, 인물과 관련된 장소를 적극 활용하여 현장 학습을 진행할 수 있다.\n학생들의 발달 수준을 고려하여 적절한 자료를 활용하고, 관련 역사적 사료나 동영상 자료를 재구성하여 활용할 수 있다.","v":"① 평가 방법\n우리 지역 내 문화유산의 특징과 가치를 파악하고, 이를 적절하게 설명하는 능력을 서술형으로 평가할 수 있다.\n우리 지역의 역사적 인물들을 조사하여 지역에 대한 자부심을 가지게 되었는지에 대해 자기 평가를 할 수 있다.\n② 유의 사항\n서술형 평가에서는 문화유산이나 인물의 이름이나 지명 같은 단순 사실에 대한 지식을 측정하는 평가가 되지 않도록 하며, 우리 지역의 대표적인 문화유산의 가치와 인물들이 주는 교훈에 대해 사례를 들어 서술하도록 한다.\n지역의 문화유산이나 인물에 관한 보고서를 작성하거나 감상문을 작성하도록 하여 문화유산과 인물들에 대한 이해의 수준을 평가할 수 있다. 이때 교사는 평가 요소와 평가 기준을 사전에 학생들에게 알려 주고, 평가 기준표를 마련하여 활용할 수 있다.\n<지역의 공공 기관과 주민 참여>","l":"우리 지역의 문화유산, 우리 지역의 역사적 인물, 우리 지역의 역사에 대한 자부심"},"2015|사회|3~4학년|우리 지역의 어제와 오늘|3":{"x":"이 단원은 지역 주민들의 생활에 도움을 주는 공공 기관에 대해 이해하고 지역 문제 및 해결 방안을 탐구함으로써 지역 문제 해결에 적극적으로 참여하는 자세를 기르는 데 주안점을 둔다.","m":"학생들이 생활 속에서 직접 이용해 본 경험이 있거나 많은 사람들이 이용하는 주요 공공 기관을 중심으로 그 역할을 탐색하게 한다.\n학생들에게 자신이 살고 있는 지역의 문제들을 다양한 방법(지역 신문, 인터넷 검색, 현장 조사 등)으로 조사하여 문제 발생의 원인을 탐구하고 문제 해결을 위한 정보를 수집하고 대안을 모색하는 활동을 통하여 지역 문제 해결 과정에 주체적으로 참여하도록 한다.\n지역 문제 해결에 앞장서는 각종 지역 사회 단체들의 활동 자료(누리집이나 블로그 등)를 참고하여 우리 지역에서 발생하는 다양한 문제를 탐구할 수 있도록 안내한다.\n지역 문제 해결을 위한
