식하고 자신의 신체 특성에 맞는 운동을 안전하고 효과적으로 수행하도록 한다.","k":"2022|체육|3~4학년|운동|1","r":"운동"},{"c":"4체01-06","y":"2022","s":"체육","g":"3~4학년","a":"운동","t":"운동과 건강한 생활 습관 형성에 관심을 갖고 적극적으로 실천한다.","e":"운동을 통한 건강한 생활 습관 형성의 의지를 기르기 위해 설정하였다. 자신의 운동 및 생활 습관을 점검해 보고, 건강 유지, 증진의 저해 요인을 삼가며, 적절한 운동과 바람직한 생활 태도에 관심을 갖고 적극적으로 실천할 수 있는 의지를 갖도록 한다.","k":"2022|체육|3~4학년|운동|1","r":"운동"},{"c":"4체02-01","y":"2022","s":"체육","g":"3~4학년","a":"스포츠","t":"스포츠의 의미와 유형을 파악한다.","e":"스포츠의 의미와 유형을 이해하기 위해 설정하였다. 일정한 규칙과 방법에 따라 경기 기술을 수행하고 환경과의 상호작용을 통해 발달한 스포츠의 개념과 기술형, 전략형, 생태형 스포츠의 유형별 특성을 이해하도록 한다.","k":"2022|체육|3~4학년|스포츠|1","r":"스포츠"},{"c":"4체02-02","y":"2022","s":"체육","g":"3~4학년","a":"스포츠","t":"기본 움직임 기술의 의미와 종류를 이해하고 스포츠와의 관계를 파악한다.","e":"기본 움직임 기술의 의미, 종류(이동 움직임, 비이동 움직임, 조작 움직임)와 특성을 파악하기 위해 설정하였다. 기본 움직임 기술의 종류를 다양하게 탐색하면서 스포츠 활동에 기초가 되는 기본 움직임 기술의 특성과 스포츠 활동 수행과의 관계를 파악하도록 한다.","k":"2022|체육|3~4학년|스포츠|1","r":"스포츠"},{"c":"4체02-03","y":"2022","s":"체육","g":"3~4학년","a":"스포츠","t":"움직임 요소에 따른 기본 움직임 기술의 수행 방법을 파악하고 시도한다.","e":"움직임 요소의 의미를 이해하고, 기본 움직임 기술을 다양한 상황에서 시도하기 위해 설정하였다. 이동 움직임, 비이동 움직임, 조작 움직임 기술을 단계적으로 익히고, 움직임 요소(신체, 노력, 공간, 관계)에 변화를 주어 안전하고 효과적으로 기본 움직임 기술을 수행하도록 한다.","k":"2022|체육|3~4학년|스포츠|1","r":"스포츠"},{"c":"4체02-04","y":"2022","s":"체육","g":"3~4학년","a":"스포츠","t":"기본 움직임 기술을 연결한 복합적인 움직임 기술을 파악하고 시도한다.","e":"기본 움직임 기술을 연결하여 다양하고 복합적인 움직임 기술을 수행하기 위해 설정하였다. 움직임 기술의 종류별(이동 움직임 기술 내 호핑과 스키핑의 연결 등), 종류 간(조작 움직임 기술의 치기와 이동 움직임 기술의 달리기의 연결 등)에 기본 움직임을 다양한 방식으로 연결하여 기본 움직임보다 심화된 복합적인 움직임 기술을 익히고, 간단한 게임 상황에서 시도하도록 한다.","k":"2022|체육|3~4학년|스포츠|1","r":"스포츠"},{"c":"4체02-05","y":"2022","s":"체육","g":"3~4학년","a":"스포츠","t":"기술형 스포츠에 적합한 기본 움직임 기술을 파악하고 시도한다.","e":"기술형 스포츠 유형에 적합한 움직임 기술을 탐색하고 수행하기 위해 설정하였다. 움직임 기술의 수월성을 겨루는 기술형 스포츠 활동에서 활용되는 다양한 기능과 관련된 움직임 기술의 효과적 수행 방법(앞뒤 구르기, 옆돌기, 전력 달리기, 헤엄치기, 발차기 등)을 익히고, 간단한 게임 상황에서 시도하도록 한다.","k":"2022|체육|3~4학년|스포츠|1","r":"스포츠"},{"c":"4체02-06","y":"2022","s":"체육","g":"3~4학년","a":"스포츠","t":"전략형 스포츠에 적합한 기본 움직임 기술을 파악하고 시도한다.","e":"전략형 스포츠 유형에 적합한 움직임 기술을 탐색하고 수행하기 위해 설정하였다. 움직임 기술과 전략에 따라 승패가 결정되는 전략형 스포츠 활동의 다양한 기능과 관련된 움직임 기술의 효과적 수행 방법(공던지기와 잡기, 공몰기, 공차기와 멈추기, 공치기와 받기, 라켓으로 치기 등)을 익히고, 기본적인 전략을 세워 간단한 게임 상황에서 시도하도록 한다.","k":"2022|체육|3~4학년|스포츠|1","r":"스포츠"},{"c":"4체02-07","y":"2022","s":"체육","g":"3~4학년","a":"스포츠","t":"생태형 스포츠에 적합한 기본 움직임 기술을 파악하고 시도한다.","e":"생태형 스포츠 유형에 적합한 움직임 기술을 탐색하고 수행하기 위해 설정하였다. 생활 주변과 자연환경에서 이루어지는 다양한 생태형 스포츠 활동과 관련된 움직임 기술의 수행 방법(균형 잡고 이동하기, 타고 버티기, 잡고 오르기 등)을 익히고, 간단한 활동 상황에서 안전하게 시도하도록 한다.","k":"2022|체육|3~4학년|스포츠|1","r":"스포츠"},{"c":"4체02-08","y":"2022","s":"체육","g":"3~4학년","a":"스포츠","t":"움직임 기술 수행에 자신감을 갖고 적극적으로 시도한다.","e":"기본 움직임 기술의 지속적인 시도를 통해 움직임 기술 수행에 대한 자신감을 기르기 위해 설정하였다. 기본 움직임 기술을 체계적으로 숙달하고, 간단한 규칙을 적용한 활동 상황에서 적극적으로 시도하며 움직임 기술 수행에 대한 자신감을 갖도록 한다.","k":"2022|체육|3~4학년|스포츠|1","r":"스포츠"},{"c":"4체02-09","y":"2022","s":"체육","g":"3~4학년","a":"스포츠","t":"게임 활동에 최선을 다하고 규칙을 지킨다.","e":"게임 활동을 수행하며 정해진 규칙을 지키고 최선을 다하는 태도를 기르기 위해 설정하였다. 다양한 유형의 스포츠 활동에 임하는 마음가짐, 구성원에 대한 태도, 규칙 준수의 필요성, 최선의 가치 등을 실제 활동 과정에서 느끼고 실천하도록 한다.","k":"2022|체육|3~4학년|스포츠|1","r":"스포츠"},{"c":"4체02-10","y":"2022","s":"체육","g":"3~4학년","a":"스포츠","t":"다양한 스포츠 환경에 개방적인 태도를 갖고 적극적이고 안전하게 스포츠 활동에 참여한다.","e":"스포츠 활동을 즐길 수 있는 환경에 개방적인 태도를 갖고 적극적이고 안전하게 활동하는 태도를 기르기 위해 설정하였다. 가정, 학교, 지역사회 체육 시설, 자연환경 등 다양하고 도전적인 스포츠 환경을 적극적으로 수용하고 활용하되, 안전 수칙을 숙지하여 안전사고를 예방하는 태도를 실천하도록 한다.","k":"2022|체육|3~4학년|스포츠|1","r":"스포츠"},{"c":"4체03-01","y":"2022","s":"체육","g":"3~4학년","a":"표현","t":"표현 활동의 의미와 기본 움직임 기술과의 관계를 파악한다.","e":"표현 활동의 의미, 표현 활동과 기본 움직임 기술과의 관계를 이해하기 위해 설정하였다. 표현 활동에서의 움직임 기술과 운동 및 스포츠 영역에서의 움직임 기술의 차이를 이해함으로써 표현 활동에서 움직임 기술의 창의적이고 심미적인 특성을 이해하도록 한다.","k":"2022|체육|3~4학년|표현|1","r":"표현"},{"c":"4체03-02","y":"2022","s":"체육","g":"3~4학년","a":"표현","t":"움직임 요소에 따른 기본 움직임 기술의 표현 방법을 파악하고 시도한다.","e":"움직임 요소에 따른 다양한 기본 움직임 기술을 학습함으로써 표현 활동의 기본 수행 능력을 기르기 위해 설정하였다. 이동 움직임, 비이동 움직임, 조작 움직임 기술을 체험하되 신체, 노력, 공간, 관계 등 움직임 요소의 변화에 따라 기본 움직임 기술을 창의적이고 심미적으로 표현하도록 한다.","k":"2022|체육|3~4학년|표현|1","r":"표현"},{"c":"4체03-03","y":"2022","s":"체육","g":"3~4학년","a":"표현","t":"기본 움직임 기술을 활용하여 사물이나 자연을 모방하여 표현한다.","e":"기본 움직임 기술을 활용한 모방 표현 능력을 기르기 위해 설정하였다. 기본 움직임 기술을 활용하여 사물, 인물, 자연 현상 등의 모양과 움직임을 모방하여 표현하는 방법을 탐색하고 그 특징을 살려 표현하도록 한다.","k":"2022|체육|3~4학년|표현|1","r":"표현"},{"c":"4체03-04","y":"2022","s":"체육","g":"3~4학년","a":"표현","t":"기본 움직임 기술을 활용하여 느낌이나 생각을 표현한다.","e":"기본 움직임 기술을 활용한 추상 표현 능력을 기르기 위해 설정하였다. 기본 움직임 기술을 활용하여 느낌과 생각 등을 동작으로 표현하는 방법을 탐색하고 창의적으로 표현하도록 한다.","k":"2022|체육|3~4학년|표현|1","r":"표현"},{"c":"4체03-05","y":"2022","s":"체육","g":"3~4학년","a":"표현","t":"기본 움직임 기술을 리듬에 맞춰 표현한다.","e":"기본 움직임 기술을 활용한 리듬 표현 능력을 기르기 위해 설정하였다. 기본 움직임 기술을 활용하여 박자, 강약, 빠르기, 패턴에 맞춰 표현하는 방법을 탐색하고 리듬감을 살려 표현하도록 한다.","k":"2022|체육|3~4학년|표현|1","r":"표현"},{"c":"4체03-06","y":"2022","s":"체육","g":"3~4학년","a":"표현","t":"기본 움직임 기술을 도구를 활용하여 표현한다.","e":"기본 움직임 기술을 활용한 도구 표현 능력을 기르기 위해 설정하였다. 기본 움직임 기술을 활용하여 줄, 공, 천, 훌라후프 등 도구의 특성을 활용한 표현 방법을 탐색하고 도구의 조작과 움직임을 연결하여 표현하도록 한다.","k":"2022|체육|3~4학년|표현|1","r":"표현"},{"c":"4체03-07","y":"2022","s":"체육","g":"3~4학년","a":"표현","t":"움직임의 심미적 표현에 대한 호기심과 감수성을 나타낸다.","e":"움직임을 심미적으로 표현하는 것에 대한 호기심과 감수성을 갖도록 설정하였다. 기본 움직임 기술을 아름답게 표현하며 움직임을 심미적으로 표현하는 다양한 자극에 관심을 갖고 운동이나 스포츠 기술과는 다른 감성을 느낄 수 있도록 한다.","k":"2022|체육|3~4학년|표현|1","r":"표현"},{"c":"6체01-01","y":"2022","s":"체육","g":"5~6학년","a":"운동","t":"건강 체력과 운동 체력의 의미와 요소를 파악하고 다양한 운동 방법을 탐색한다.","e":"3, 4학년군에서 학습한 기본 운동 방법을 체력 요소별로 구분하여 이해하고 체력 요소별로 다양한 운동 방법을 탐색하기 위해 설정하였다. 체력을 건강 체력과 운동 체력으로 구분하고, 유형별 체력 요소를 이해하며, 학습자 스스로 자신의 수준에 적합한 체력 요소별 운동 방법을 찾도록 한다.","k":"2022|체육|5~6학년|운동|1","r":"운동"},{"c":"6체01-02","y":"2022","s":"체육","g":"5~6학년","a":"운동","t":"건강 체력과 운동 체력을 측정하고 자신의 체력 수준에 맞는 운동을 시도한다.","e":"자신의 건강 체력과 운동 체력 수준을 파악하여 체력을 증진할 수 있는 다양한 운동 방법을 선택하고 실천하기 위해 설정하였다. 자신의 우수한 체력과 부족한 체력이 무엇인지를 파악하고, 특히 부족한 체력을 기르기 위해 체력 수준에 적합한 운동 방법을 탐색하여 꾸준하게 실천하도록 한다.","k":"2022|체육|5~6학년|운동|1","r":"운동"},{"c":"6체01-03","y":"2022","s":"체육","g":"5~6학년","a":"운동","t":"성장 발달의 의미와 특성을 이해하고 운동과의 관계를 파악한다.","e":"자신의 성장 발달을 이해하고, 운동이 성장 발달에 미치는 긍정적인 영향을 이해하기 위해 설정하였다. 성장에 따른 신체적, 정서적 변화, 특히 제2차 성징에 대한 이해를 바탕으로 자신의 성장 발달 양상을 긍정적으로 파악하고, 사춘기에 운동이 신체적, 정서적, 사회적 성장 발달에 바람직한 영향을 미친다는 점을 이해하도록 한다.","k":"2022|체육|5~6학년|운동|1","r":"운동"},{"c":"6체01-04","y":"2022","s":"체육","g":"5~6학년","a":"운동","t":"운동 및 생활 속 위험 상황, 성장 발달을 저해하는 생활 방식의 문제점을 파악하고 예방 및 대처 방법을 익혀 안전하게 활동한다.","e":"운동과 일상생활에서 발생할 수 있는 다양한 안전사고의 유형과 성장 발달을 저해하는 생활 방식의 문제점을 파악하고 침착하게 대처하기 위해 설정하였다. 운동 시설이나 용⋅기구, 지상⋅수상⋅빙상 등의 다양한 운동 환경에서 발생할 수 있는 안전사고, 건강한 성장 발달에 부정적인 생활 습관(흡연, 음주, 약물 오⋅남용 등), 안전을 위협하는 생활 및 자연 환경을 탐색하며 건강하고 안전한 생활 습관을 실천하도록 한다.","k":"2022|체육|5~6학년|운동|1","r":"운동"},{"c":"6체01-05","y":"2022","s":"체육","g":"5~6학년","a":"운동","t":"체력 운동을 끈기 있게 규칙적으로 수행한다.","e":"체력 증진에 필요한 끈기와 근면성을 기르기 위해 설정하였다. 단기간에 증진되기 어려운 체력 운동의 특성상, 학습자가 운동 과정에서 쉽게 포기하지 않도록 체력 증진을 저해하는 개인적, 환경적 조건을 탐색하고 극복하면서 체력 운동을 규칙적으로 수행하도록 한다.","k":"2022|체육|5~6학년|운동|1","r":"운동"},{"c":"6체01-06","y":"2022","s":"체육","g":"5~6학년","a":"운동","t":"성장과 발달 과정에서 나타나는 신체적, 정서적, 사회적 특성과 차이를 공감하고 위험 상황에 침착하게 대처한다.","e":"성장과 발달 과정에서 개인별 차이를 공감하며, 안전을 위협하는 위험 상황에 대처하기 위해 설정하였다. 자신의 신체적, 정서적, 사회적 건강 특성이 다른 사람과 어떤 차이가 있고, 그러한 차이를 공감하는 것이 자신과 공동체에 어떤 영향을 미치는지를 실제 사례를 통해 이해하도록 한다.","k":"2022|체육|5~6학년|운동|1","r":"운동"},{"c":"6체02-01","y":"2022","s":"체육","g":"5~6학년","a":"스포츠","t":"기술형 스포츠의 의미와 유형을 파악한다.","e":"기술형 스포츠의 의미와 유형을 이해하기 위해 설정하였다. 기술의 수월성을 추구하는 기술형 스포츠의 의미를 이해하고 다양한 환경(지상, 수상, 빙상 등)에서의 움직임 기록 향상을 위한 기록형, 일련의 절차와 방법이 정해진 움직임을 정확하게 수행하는 동작형, 상대방의 신체적 기량과 겨루는 투기형으로 구분하여 유형별 움직임의 세부 특성을 파악하도록 한다.","k":"2022|체육|5~6학년|스포츠|1","r":"스포츠"},{"c":"6체02-02","y":"2022","s":"체육","g":"5~6학년","a":"스포츠","t":"기술형 스포츠 유형별로 기본 움직임 기술을 응용한 기본 기능을 파악하고 수행한다.","e":"기록형, 동작형, 투기형 스포츠에서 기본 움직임 기술을 응용한 기본 기능을 효과적으로 활용하기 위해 설정하였다. 속도와 거리, 정확성에 도전하는 기록형 스포츠의 기본 기능(도움닫기 하여 멀리뛰기, 목표물에 정확히 던지기 등), 절차와 방법이 정해진 움직임을 수행하는 동작형 스포츠의 기본 기능(손 짚고 옆돌기, 다리 벌려 뛰어넘기 등), 상대방과 신체적 기술을 겨루는 투기형 스포츠의 기본 기능(발차기, 다리 걸기 등)을 게임 상황에 맞게 효율적으로 수행하도록 한다.","k":"2022|체육|5~6학년|스포츠|1","r":"스포츠"},{"c":"6체02-03","y":"2022","s":"체육","g":"5~6학년","a":"스포츠","t":"기술형 스포츠 유형별 활동 방법을 파악하고 기본 전략을 게임 활동에서 수행한다.","e":"기록형, 동작형, 투기형 스포츠의 활동 방법과 기본 전략을 활용하기 위해 설정하였다. 기록형, 동작형, 투기형 스포츠를 변형한 게임 활동의 경기 방법을 이해하고, 기록 측정과 분석, 동작 수행의 점검과 분석, 자신과 상대의 기량 확인과 분석 등 기술형 스포츠의 기본 전략을 파악하고 수행하도록 한다.","k":"2022|체육|5~6학년|스포츠|1","r":"스포츠"},{"c":"6체02-04","y":"2022","s":"체육","g":"5~6학년","a":"스포츠","t":"전략형 스포츠의 의미와 유형을 파악한다.","e":"전략형 스포츠의 의미와 유형을 이해하기 위해 설정하였다. 움직임 기능 수행 능력과 전략에 따라 승패가 결정되는 전략형 스포츠의 의미를 이해하고 스포츠의 유형을 상대 영역으로 이동하여 정해진 지점으로 공을 보내 득점하는 영역형, 동일 공간에서 공격과 수비를 번갈아 하며 정해진 구역을 돌아 점수를 얻는 필드형, 네트 너머에 있는 상대 영역에 공을 보내 넘기지 못하게 하여 득점하는 네트형으로 구분하여 각각의 세부 특성을 파악하도록 한다.","k":"2022|체육|5~6학년|스포츠|1","r":"스포츠"},{"c":"6체02-05","y":"2022","s":"체육","g":"5~6학년","a":"스포츠","t":"전략형 스포츠 유형별로 기본 움직임 기술을 응용한 기본 기능을 파악하고 수행한다.","e":"영역형, 필드형, 네트형 스포츠에서 기본 움직임 기술을 응용한 기본 기능을 효과적으로 활용하기 위해 설정하였다. 패스, 드리블, 슛 등과 같은 영역형 스포츠의 기본 기능, 포구, 송구, 타격, 주루 등과 같은 필드형 스포츠의 기본 기능, 서브, 리시브, 토스, 스트로크(스매싱) 등과 같은 네트형 스포츠의 기본 기능을 변형게임이나 뉴스포츠 수준의 게임 상황에 맞게 효율적으로 수행하도록 한다.","k":"2022|체육|5~6학년|스포츠|1","r":"스포츠"},{"c":"6체02-06","y":"2022","s":"체육","g":"5~6학년","a":"스포츠","t":"전략형 스포츠 유형별 활동 방법을 파악하고 기본 전략을 게임 활동에서 수행한다.","e":"영역형, 필드형, 네트형 스포츠의 활동 방법과 기본 전략을 활용하기 위해 설정하였다. 영역형, 필드형, 네트형 스포츠를 변형한 게임이나 뉴스포츠와 같은 게임 활동에 참여하며 경기 방법을 파악하고, 공간 만들기, 공간 차단하기, 골 넣기와 막기, 빈 곳으로 공 치기, 구역과 역할 나누어 수비하기, 빈 곳으로 공 넘기기, 유기적으로 역할 분담하기 등 전략형 스포츠의 기본 전략을 파악하고 수행하도록 한다.","k":"2022|체육|5~6학년|스포츠|1","r":"스포츠"},{"c":"6체02-07","y":"2022","s":"체육","g":"5~6학년","a":"스포츠","t":"생태형 스포츠의 의미와 유형을 파악한다.","e":"생태형 스포츠의 의미와 유형을 이해하기 위해 설정하였다. 다양한 환경 맥락에 따라 활동 특성이 나타나는 생태형 스포츠의 의미에 관한 이해를 바탕으로 생활 주변의 환경을 이용하여 활동하는 생활환경형, 자연환경과 상호작용하며 활동하는 자연환경형으로 구분하여 유형별 세부 특성을 파악하도록 한다.","k":"2022|체육|5~6학년|스포츠|1","r":"스포츠"},{"c":"6체02-08","y":"2022","s":"체육","g":"5~6학년","a":"스포츠","t":"생태형 스포츠 유형별로 기본 움직임 기술을 응용한 기본 기능을 파악하고 수행한다.","e":"생활환경형, 자연환경형 스포츠에서 기본 움직임 기술을 응용한 기본 기능을 효과적으로 활용하기 위해 설정하였다. 주변 생활환경에서 할 수 있는 골프형 게임, 디스크형 게임, 자전거 타기, 롤러스케이팅, 클라이밍 활동, 민속놀이 등과 자연환경에서 체험할 수 있는 등산 활동, 캠핑 활동, 수상 활동, 설상 활동 등 생태형 스포츠의 기본 기능을 익혀 주변의 다양한 활동 상황에 맞게 환경친화적으로 수행하도록 한다.","k":"2022|체육|5~6학년|스포츠|1","r":"스포츠"},{"c":"6체02-09","y":"2022","s":"체육","g":"5~6학년","a":"스포츠","t":"생태형 스포츠 유형별 활동 방법을 파악하고 기본 전략을 게임 활동에서 수행한다.","e":"생활환경형, 자연환경형 스포츠의 활동 방법과 기본 전략을 활용하기 위해 설정하였다. 생활환경형, 자연환경형 스포츠를 변형한 게임이나 뉴스포츠 수준의 활동에 참여하며 활동 방법을 파악하고 스포츠 환경에 적합한 활동의 선정과 장비 사용, 안전하고 환경친화적인 활동과 정리 등 생태형 스포츠의 기본 활동 방법과 전략을 파악하고 수행하도록 한다.","k":"2022|체육|5~6학년|스포츠|1","r":"스포츠"},{"c":"6체02-10","y":"2022","s":"체육","g":"5~6학년","a":"스포츠","t":"스포츠 활동에 참여하며 목표를 달성하기 위한 의지를 실천하고 상대의 기술을 인정한다.","e":"스포츠 활동에 참여하며 목표 달성을 위한 의지와 상대 기술을 인정하는 태도를 기르기 위해 설정하였다. 스스로 목표를 설정하고 책임감 있게 꾸준히 실천하도록 하며, 함께 참여하는 상대 팀과 구성원의 우수한 기술을 인정하고 배우는 태도를 실천하도록 한다.","k":"2022|체육|5~6학년|스포츠|1","r":"스포츠"},{"c":"6체02-11","y":"2022","s":"체육","g":"5~6학년","a":"스포츠","t":"스포츠 활동에 참여하며 팀원과 협력하고 구성원을 배려한다.","e":"스포츠에 참여하며 팀원과 협력하고 구성원을 배려하는 태도를 기르기 위해 설정하였다. 민주적인 의사결정을 통해 역할을 분담하고 전략을 수립하는 등 팀원과의 협력을 강조하며, 기능 수행에 어려움을 겪는 학습자를 도와주고 배려함으로써 팀의 활동 성과를 공유하도록 한다.","k":"2022|체육|5~6학년|스포츠|1","r":"스포츠"},{"c":"6체02-12","y":"2022","s":"체육","g":"5~6학년","a":"스포츠","t":"스포츠 활동에 참여하며 환경을 아끼고 감사하는 태도를 실천한다.","e":"스포츠 활동 환경을 아끼고 감사하는 태도를 기르기 위해 설정하였다. 주변의 다양한 스포츠 시설 및 용⋅기구 현황을 탐색하고 이를 적극적으로 활용하면서 학교 및 지역사회가 제공하는 스포츠 복지의 중요성을 이해하도록 한다. 또한 스포츠 환경을 아끼고 보존함으로써 지속해서 혜택을 누릴 수 있다는 점에 감사함을 느낄 수 있도록 한다.","k":"2022|체육|5~6학년|스포츠|1","r":"스포츠"},{"c":"6체03-01","y":"2022","s":"체육","g":"5~6학년","a":"표현","t":"표현 활동의 의미와 유형을 파악한다.","e":"표현 활동 의미와 유형을 이해하기 위해 설정하였다. 스포츠에서 신체 움직임의 심미성을 다루는 스포츠 표현, 민족의 고유한 전통을 신체 움직임으로 표현한 전통 표현, 자유로운 형식으로 움직임을 표현하는 현대 표현의 유형별로 다양한 작품을 직⋅간접적으로 체험함으로써 기본 동작과 구성 방법의 공통점과 차이점을 중심으로 특징을 파악하도록 한다.","k":"2022|체육|5~6학년|표현|1","r":"표현"},{"c":"6체03-02","y":"2022","s":"체육","g":"5~6학년","a":"표현","t":"스포츠 표현에서 움직임 기술을 응용한 기본 동작을 파악하고 표현한다.","e":"스포츠 표현의 기본 움직임 기술과 응용 동작을 탐색하고 심미적으로 표현하기 위해 설정하였다. 신체활동의 예술적 아름다움을 추구하는 스포츠 표현의 기본 동작에 적합한 움직임 기술의 응용 동작을 심미적으로 표현하도록 한다.","k":"2022|체육|5~6학년|표현|1","r":"표현"},{"c":"6체03-03","y":"2022","s":"체육","g":"5~6학년","a":"표현","t":"스포츠 표현의 기본 동작을 다양하게 구성하여 발표하고 감상한다.","e":"스포츠 표현에 적합한 움직임 기술의 응용 동작을 활용하여 작품을 구성하고 표현하기 위해 설정하였다. 스포츠 표현에 적합한 움직임 기술의 응용 동작을 창의적으로 구성하고, 개인 또는 모둠별로 간단한 작품을 만들어 발표하며 작품의 의도와 동작의 심미성을 감상하도록 한다.","k":"2022|체육|5~6학년|표현|1","r":"표현"},{"c":"6체03-04","y":"2022","s":"체육","g":"5~6학년","a":"표현","t":"전통 표현에서 움직임 기술을 응용한 기본 동작을 파악하고 표현한다.","e":"우리나라와 세계 여러 민족과 지역에서 전해 내려오는 전통 표현에서 기본 움직임 기술을 응용한 동작의 문화적 특징을 파악하고 그 특성을 살려 표현하기 위해 설정하였다. 전통 표현의 기본 동작에 적합한 움직임 기술의 응용 동작을 문화적 특색이 드러나게 표현하도록 한다.","k":"2022|체육|5~6학년|표현|1","r":"표현"},{"c":"6체03-05","y":"2022","s":"체육","g":"5~6학년","a":"표현","t":"전통 표현의 기본 동작을 다양하게 구성하여 발표하고 감상한다.","e":"전통 표현에 적합한 움직임 기술의 응용 동작을 활용하여 작품을 구성하고 표현하기 위해 설정하였다. 다양한 전통 표현에 담긴 역사와 특성을 이해하고 전통 표현의 움직임 기술 응용 동작을 문화적 특성에 따라 구성한다. 개인 또는 모둠별로 간단한 작품을 만들어 발표하며 작품의 의도와 동작이 갖는 전통적 의미를 감상하도록 한다.","k":"2022|체육|5~6학년|표현|1","r":"표현"},{"c":"6체03-06","y":"2022","s":"체육","g":"5~6학년","a":"표현","t":"현대 표현에서 움직임 기술을 응용한 기본 동작을 파악하고 표현한다.","e":"현대 표현에서 기본 움직임 기술을 응용한 동작의 자유로움이 갖는 특징을 파악하고 창의적으로 표현하기 위해 설정하였다. 기본 동작에 적합한 움직임 기술 응용 동작을 기존의 표현 방법이나 틀에 얽매이지 않고 자유롭고 창의적으로 표현하도록 한다.","k":"2022|체육|5~6학년|표현|1","r":"표현"},{"c":"6체03-07","y":"2022","s":"체육","g":"5~6학년","a":"표현","t":"현대 표현의 기본 동작을 다양하게 구성하여 발표하고 감상한다.","e":"현대 표현에 적합한 움직임 기술의 응용 동작을 활용하여 작품을 구성하고 표현하기 위해 설정하였다. 현대 표현에 적합한 움직임 기술의 응용 동작을 표현의 주제와 자유로운 흐름을 고려하여 구성한다. 개인 또는 모둠별로 간단한 작품을 만들어 발표하며 작품의 의도를 현대 사회의 문화적 특징과 비교하며 감상하도록 한다.","k":"2022|체육|5~6학년|표현|1","r":"표현"},{"c":"6체03-08","y":"2022","s":"체육","g":"5~6학년","a":"표현","t":"다양한 표현 활동 유형을 수용하고, 움직임 표현의 아름다움을 추구한다.","e":"다양한 표현 활동 유형을 긍정적으로 수용하고 움직임 표현의 아름다움을 추구하도록 설정하였다. 다양한 표현 유형에 담긴 의미와 표현 특성을 직⋅간접적으로 탐색하며 표현 문화에 대한 이해의 폭을 확장하고 움직임 표현의 아름다움을 추구하도록 한다.","k":"2022|체육|5~6학년|표현|1","r":"표현"},{"c":"4과01-01","y":"2015","s":"과학","g":"3~4학년","a":"물질의 성질","t":"서로 다른 물질로 만들어진 물체들을 비교하여 물체의 기능과 물질의 성질을 관련지을 수 있다.","e":"","k":"2015|과학|3~4학년|물질의 성질|1","r":"3~4학년","gr":1},{"c":"4과01-02","y":"2015","s":"과학","g":"3~4학년","a":"물질의 성질","t":"크기와 모양은 같지만 서로 다른 물질로 이루어진 물체들을 관찰하여 물질의 여러 가지 성질을 비교할 수 있다.","e":"","k":"2015|과학|3~4학년|물질의 성질|1","r":"3~4학년","gr":1},{"c":"4과01-03","y":"2015","s":"과학","g":"3~4학년","a":"물질의 성질","t":"서로 다른 물질을 섞었을 때 물질을 섞기 전과 후의 변화를 관찰하여 어떤 성질이 달라졌는지 설명할 수 있다.","e":"서로 다른 물질을 섞었을 때 나타나는 변화를 관찰하는 것에 중점을 두되, 화학적 변화가 일어나는 과학적 이유, 원리, 개념 등은 다루지 않는다.","k":"2015|과학|3~4학년|물질의 성질|1","r":"3~4학년","gr":1},{"c":"4과01-04","y":"2015","s":"과학","g":"3~4학년","a":"물질의 성질","t":"여러 가지 물질을 선택하여 다양한 물체를 설계하고 장단점을 토의할 수 있다. <","e":"나무, 철, 고무, 플라스틱 등의 물질이 가지는 성질을 활용하여 다양한 기능을 하는 물체를 창의적으로 설계하는 활동을 한다. 이렇게 설계된 물체의 장점과 단점을 선택한 물질의 성질 관점에서 생각해 보게 한다.","k":"2015|과학|3~4학년|물질의 성질|1","r":"3~4학년","gr":1},{"c":"4과02-01","y":"2015","s":"과학","g":"3~4학년","a":"자석의 이용","t":"자석 사이에 밀거나 당기는 힘이 작용하는 현상을 관찰하고 두 종류의 극을 구별할 수 있다.","e":"","k":"2015|과학|3~4학년|자석의 이용|1","r":"3~4학년","gr":1},{"c":"4과02-02","y":"2015","s":"과학","g":"3~4학년","a":"자석의 이용","t":"나침반의 바늘이 일정한 방향을 가리키는 성질이 있음을 관찰을 통해 설명할 수 있다.","e":"나침반의 바늘이 일정한 방향을 가리키는 성질은 다른 극 사이에 끌어당기는 힘, 같은 극 사이에 밀어내는 힘이 작용하는 현상과 관련지어 다루고, 자기장의 개념은 도입하지 않는다.","k":"2015|과학|3~4학년|자석의 이용|1","r":"3~4학년","gr":1},{"c":"4과02-03","y":"2015","s":"과학","g":"3~4학년","a":"자석의 이용","t":"일상생활에서 자석이 사용되는 예를 조사하고, 자석의 성질과 관련지어 그 기능을 설명할 수 있다. <","e":"","k":"2015|과학|3~4학년|자석의 이용|1","r":"3~4학년","gr":1},{"c":"4과03-01","y":"2015","s":"과학","g":"3~4학년","a":"동물의 생활","t":"여러 가지 동물을 관찰하여 특징에 따라 동물을 분류할 수 있다.","e":"생김새와 특징에 따라 여러 동물들을 나누어 보게 하는 과정에서 분류하는 활동에는 기준이 필요함을 인식하게 한다.","k":"2015|과학|3~4학년|동물의 생활|1","r":"3~4학년","gr":1},{"c":"4과03-02","y":"2015","s":"과학","g":"3~4학년","a":"동물의 생활","t":"동물의 생김새와 생활 방식이 환경과 관련되어 있음을 설명할 수 있다.","e":"","k":"2015|과학|3~4학년|동물의 생활|1","r":"3~4학년","gr":1},{"c":"4과03-03","y":"2015","s":"과학","g":"3~4학년","a":"동물의 생활","t":"동물의 특징을 모방하여 생활 속에서 활용하고 있는 사례를 발표할 수 있다. <","e":"","k":"2015|과학|3~4학년|동물의 생활|1","r":"3~4학년","gr":1},{"c":"4과04-01","y":"2015","s":"과학","g":"3~4학년","a":"지표의 변화","t":"여러 장소의 흙을 관찰하여 비교할 수 있다.","e":"흙의 특징은 색, 물 빠짐, 입자의 크기, 촉감, 부식물의 함량 등을 중심으로 살펴보고 흙과 생물의 관계도 다룬다.","k":"2015|과학|3~4학년|지표의 변화|1","r":"3~4학년","gr":1},{"c":"4과04-02","y":"2015","s":"과학","g":"3~4학년","a":"지표의 변화","t":"흙의 생성 과정을 모형을 통해 설명할 수 있다.","e":"흙의 생성은 주로 기계적 풍화 현상으로 제한하며, 풍화라는 용어는 도입하지 않는다.","k":"2015|과학|3~4학년|지표의 변화|1","r":"3~4학년","gr":1},{"c":"4과04-03","y":"2015","s":"과학","g":"3~4학년","a":"지표의 변화","t":"강과 바닷가 주변 지형의 특징을 흐르는 물과 바닷물의 작용과 관련지을 수 있다. <","e":"강 주변 지형은 흐르는 물에 의한 침식, 운반, 퇴적을 중심으로, 바닷가 주변 지형은 파도에 의한 침식, 운반과 퇴적을 중심으로 다룬다.","k":"2015|과학|3~4학년|지표의 변화|1","r":"3~4학년","gr":1},{"c":"4과05-01","y":"2015","s":"과학","g":"3~4학년","a":"식물의 생활","t":"여러 가지 식물을 관찰하여 특징에 따라 식물을 분류할 수 있다.","e":"여러 가지 식물의 잎을 채집해 생김새나 촉감 등과 같은 외형적 특징에 따라 분류하는 활동을 하도록 한다.","k":"2015|과학|3~4학년|식물의 생활|1","r":"3~4학년","gr":1},{"c":"4과05-02","y":"2015","s":"과학","g":"3~4학년","a":"식물의 생활","t":"식물의 생김새와 생활 방식이 환경과 관련되어 있음을 설명할 수 있다.","e":"식물이 사는 곳을 조사하고, 사는 곳에 따라 식물의 생김새와 생활 방식이 어떻게 다른지 설명하면서 적응 개념을 도입한다.","k":"2015|과학|3~4학년|식물의 생활|1","r":"3~4학년","gr":1},{"c":"4과05-03","y":"2015","s":"과학","g":"3~4학년","a":"식물의 생활","t":"식물의 특징을 모방하여 생활 속에서 활용하고 있는 사례를 발표할 수 있다. <","e":"","k":"2015|과학|3~4학년|식물의 생활|1","r":"3~4학년","gr":1},{"c":"4과06-01","y":"2015","s":"과학","g":"3~4학년","a":"지층과 화석","t":"여러 가지 지층을 관찰하고 지층의 형성 과정을 모형을 통해 설명할 수 있다.","e":"지층의 두께나 색 등을 다루고, 지층이 휘어지거나 끊어진 모습을 소개하되 생성 원리는 다루지 않는다. 지층의 특징을 다루되, 습곡과 단층이라는 용어는 도입하지 않는다.","k":"2015|과학|3~4학년|지층과 화석|1","r":"3~4학년","gr":1},{"c":"4과06-02","y":"2015","s":"과학","g":"3~4학년","a":"지층과 화석","t":"퇴적암을 알갱이의 크기에 따라 구분하고 퇴적암이 만들어지는 과정을 모형을 통해 설명할 수 있다.","e":"퇴적암은 이암, 사암, 역암만 다룬다.","k":"2015|과학|3~4학년|지층과 화석|1","r":"3~4학년","gr":1},{"c":"4과06-03","y":"2015","s":"과학","g":"3~4학년","a":"지층과 화석","t":"화석의 생성 과정을 이해하고 화석을 관찰하여 지구의 과거 생물과 환경을 추리할 수 있다. <","e":"화석의 표본은 동물과 식물의 특징이 분명하게 드러나는 것을 사용한다.","k":"2015|과학|3~4학년|지층과 화석|1","r":"3~4학년","gr":1},{"c":"4과07-01","y":"2015","s":"과학","g":"3~4학년","a":"물질의 상태","t":"고체와 액체의 성질을 용기에 따른 모양과 부피 변화를 관찰하여 설명할 수 있다.","e":"고체는 담는 용기가 변하여도 모양과 부피가 변하지 않고, 액체는 담는 용기에 따라 모양은 변하지만 부피는 변하지 않음을 다양한 실험을 통해 관찰할 수 있도록 한다.","k":"2015|과학|3~4학년|물질의 상태|1","r":"3~4학년","gr":1},{"c":"4과07-02","y":"2015","s":"과학","g":"3~4학년","a":"물질의 상태","t":"기체가 공간을 차지하고 있음을 알아보는 실험을 할 수 있다.","e":"물질의 상태 중 기체는 학생들이 쉽게 접하는 공기만 다룬다. 공기가 공간을 차지하고 있으며 공간을 이동할 수 있음을 실험을 통해 경험하도록 한다.","k":"2015|과학|3~4학년|물질의 상태|1","r":"3~4학년","gr":1},{"c":"4과07-03","y":"2015","s":"과학","g":"3~4학년","a":"물질의 상태","t":"기체가 무게가 있음을 알아보는 실험을 할 수 있다.","e":"기체가 무게가 있음을 알아보기 위해서, 용기에 공기를 1기압으로 담은 상태의 무게와 공기를 1기압 이상으로 압축한 상태의 무게를 서로 비교하는 실험을 한다.","k":"2015|과학|3~4학년|물질의 상태|1","r":"3~4학년","gr":1},{"c":"4과07-04","y":"2015","s":"과학","g":"3~4학년","a":"물질의 상태","t":"우리 주변의 물질을 고체, 액체, 기체로 분류할 수 있다. <","e":"","k":"2015|과학|3~4학년|물질의 상태|1","r":"3~4학년","gr":1},{"c":"4과08-01","y":"2015","s":"과학","g":"3~4학년","a":"소리의 성질","t":"여러 가지 물체에서 소리가 나는 현상을 관찰하여 소리가 나는 물체는 떨림이 있음을 설명할 수 있다.","e":"","k":"2015|과학|3~4학년|소리의 성질|1","r":"3~4학년","gr":1},{"c":"4과08-02","y":"2015","s":"과학","g":"3~4학년","a":"소리의 성질","t":"소리의 세기와 높낮이를 비교할 수 있다.","e":"큰 소리와 작은 소리를 구별하고, 높은 소리와 낮은 소리를 구별할 수 있도록 한다.","k":"2015|과학|3~4학년|소리의 성질|1","r":"3~4학년","gr":1},{"c":"4과08-03","y":"2015","s":"과학","g":"3~4학년","a":"소리의 성질","t":"여러 가지 물체를 통하여 소리가 전달되거나 반사됨을 관찰하고 소음을 줄이는 방법을 토의할 수 있다. <","e":"소리는 고체, 액체, 기체 상태의 다양한 물질을 통해 전달됨을 관찰하고, 소리가 장애물을 만나면 반사되는 현상을 관찰한다. 소리의 전달이나 반사의 정도를 조절하여 일상생활에서 소음을 줄이는 방법을 토의하도록 한다.","k":"2015|과학|3~4학년|소리의 성질|1","r":"3~4학년","gr":1},{"c":"4과09-01","y":"2015","s":"과학","g":"3~4학년","a":"물체의 무게","t":"일상생활에서 물체의 무게를 측정하는 예를 조사하고 무게 측정이 필요한 이유를 설명할 수 있다.","e":"일상생활에서 사용되는 여러 가지 저울을 다루되, 각 저울의 원리를 이해하는데 중점을 두는 것이 아니라 물체의 무게를 정확하게 측정하지 않으면 어떠한 불편함이나 어려움이 있는지를 설명할 수 있도록 한다.","k":"2015|과학|3~4학년|물체의 무게|1","r":"3~4학년","gr":1},{"c":"4과09-02","y":"2015","s":"과학","g":"3~4학년","a":"물체의 무게","t":"수평 잡기 활동을 통해 물체의 무게를 비교할 수 있다.","e":"수평 잡기의 원리는 받침점이 중앙에 있는 경우만 다루도록 하며 분동을 사용하는 윗접시 저울은 다루지 않는다.","k":"2015|과학|3~4학년|물체의 무게|1","r":"3~4학년","gr":1},{"c":"4과09-03","y":"2015","s":"과학","g":"3~4학년","a":"물체의 무게","t":"용수철에 매단 물체의 무게와 용수철의 늘어난 길이의 관계를 조사하고 물체의 무게를 재는 원리를 설명할 수 있다.","e":"","k":"2015|과학|3~4학년|물체의 무게|1","r":"3~4학년","gr":1},{"c":"4과09-04","y":"2015","s":"과학","g":"3~4학년","a":"물체의 무게","t":"간단한 저울을 설계하여 제작하고 그 결과물을 평가할 수 있다. <","e":"학생들이 제작한 저울이 물체의 무게를 정확하게 측정할 수 있는지, 견고한지, 편리한지 등 여러 가지 기준을 정하여 학생 스스로 혹은 학생 상호 간에 평가하도록 할 수 있다. 저울의 설계 과정에서부터 평가 기준을 미리 생각하도록 할 수 있다.","k":"2015|과학|3~4학년|물체의 무게|1","r":"3~4학년","gr":1},{"c":"4과10-01","y":"2015","s":"과학","g":"3~4학년","a":"동물의 한살이","t":"동물의 암·수에 따른 특징을 동물별로 비교해보고, 번식 과정에서 암·수의 역할이 다양함을 설명할 수 있다.","e":"번식 과정에서 동물의 암·수에 따른 역할에 대하여 알아봄으로써 동물의 성 역할을 이해하도록 하며, 특히 번식 과정에서 새끼를 돌보는 성 역할이 다양함을 알 수 있도록 한다. 또한, 개, 닭, 개구리 등 주변에서 쉽게 볼 수 있는 동물의 한살이로 관심을 넓혀 갈 수 있도록 한다.","k":"2015|과학|3~4학년|동물의 한살이|1","r":"3~4학년","gr":1},{"c":"4과10-02","y":"2015","s":"과학","g":"3~4학년","a":"동물의 한살이","t":"동물의 한살이 관찰 계획을 세우고, 동물을 기르면서 한살이를 관찰하며, 관찰한 내용을 글과 그림으로 표현할 수 있다.","e":"","k":"2015|과학|3~4학년|동물의 한살이|1","r":"3~4학년","gr":1},{"c":"4과10-03","y":"2015","s":"과학","g":"3~4학년","a":"동물의 한살이","t":"여러 가지 동물의 한살이 과정을 조사하여 동물에 따라 한살이의 유형이 다양함을 설명할 수 있다. <","e":"두 종류 이상의 동물의 한살이를 관찰하면서 동물에 따른 한살이의 차이를 알 수 있도록 한다. 이를 위해서 곤충 중 하나와 곤충 이외의 동물 중에서 하나를 선택하여 한살이를 비교할 수 있으며, 한 세대가 짧은 다양한 동물을 선택하여 관찰할 수 있도록 한다.","k":"2015|과학|3~4학년|동물의 한살이|1","r":"3~4학년","gr":1},{"c":"4과11-01","y":"2015","s":"과학","g":"3~4학년","a":"화산과 지진","t":"화산 활동으로 나오는 여러 가지 물질을 설명할 수 있다.","e":"","k":"2015|과학|3~4학년|화산과 지진|1","r":"3~4학년","gr":1},{"c":"4과11-02","y":"2015","s":"과학","g":"3~4학년","a":"화산과 지진","t":"화성암의 생성 과정을 이해하고 화강암과 현무암의 특징을 비교할 수 있다.","e":"화산과 지진의 발생은 판구조론과 관련되어 있지만 학생들에게는 어려운 개념이므로 지구 내부에서 작용하는 힘에 의하여 발생한다는 정도로만 다룬다.","k":"2015|과학|3~4학년|화산과 지진|1","r":"3~4학년","gr":1},{"c":"4과11-03","y":"2015","s":"과학","g":"3~4학년","a":"화산과 지진","t":"화산 활동이 우리 생활에 미치는 영향을 발표할 수 있다.","e":"화산 활동의 피해와 함께 이로움도 다룬다.","k":"2015|과학|3~4학년|화산과 지진|1","r":"3~4학년","gr":1},{"c":"4과11-04","y":"2015","s":"과학","g":"3~4학년","a":"화산과 지진","t":"지진 발생의 원인을 이해하고 지진이 났을 때 안전하게 대처하는 방법을 토의할 수 있다. <","e":"화산과 지진의 발생은 판구조론과 관련되어 있지만 학생들에게는 어려운 개념이므로 지구 내부에서 작용하는 힘에 의하여 발생한다는 정도로만 다룬다.","k":"2015|과학|3~4학년|화산과 지진|1","r":"3~4학년","gr":1},{"c":"4과12-01","y":"2015","s":"과학","g":"3~4학년","a":"혼합물의 분리","t":"일상생활에서 혼합물의 예를 찾고 혼합물 분리의 필요성을 설명할 수 있다.","e":"혼합물의 의미를 학습한 후에 우리 주변에서 혼합물의 예를 찾고, 혼합물을 구성하는 성분 물질을 구분할 수 있도록 한다. 대부분의 물질은 혼합물의 상태로 존재하기 때문에 생활에 필요한 물질을 얻기 위해 혼합물을 분리하는 것이 매우 중요함을 이해하도록 한다.","k":"2015|과학|3~4학년|혼합물의 분리|1","r":"3~4학년","gr":1},{"c":"4과12-02","y":"2015","s":"과학","g":"3~4학년","a":"혼합물의 분리","t":"알갱이의 크기와 자석에 붙는 성질을 이용하여 고체 혼합물을 분리할 수 있다.","e":"고체 물질로만 이루어진 혼합물을 분리하는 실험으로 알갱이의 크기 차이를 이용하는 경우와 자석에 붙는 성질을 이용하는 경우를 다룬다.","k":"2015|과학|3~4학년|혼합물의 분리|1","r":"3~4학년","gr":1},{"c":"4과12-03","y":"2015","s":"과학","g":"3~4학년","a":"혼합물의 분리","t":"거름 장치를 꾸며 물에 녹는 물질과 녹지 않는 물질의 혼합물을 분리할 수 있다.","e":"","k":"2015|과학|3~4학년|혼합물의 분리|1","r":"3~4학년","gr":1},{"c":"4과12-04","y":"2015","s":"과학","g":"3~4학년","a":"혼합물의 분리","t":"물을 증발시켜 물에 녹아 있는 고체 물질을 분리할 수 있다. <","e":"","k":"2015|과학|3~4학년|혼합물의 분리|1","r":"3~4학년","gr":1},{"c":"4과13-01","y":"2015","s":"과학","g":"3~4학년","a":"식물의 한살이","t":"씨가 싹트거나 자라는 데 필요한 조건을 설명할 수 있다.","e":"씨가 싹트거나 자라는 데 필요한 조건은 물과 온도로 한정하여 탐구하되 통합 탐구 과정 요소인 변인 통제에 대해서는 ‘같게 할 조건’과 ‘다르게 할 조건’이라는 용어를 사용한다.","k":"2015|과학|3~4학년|식물의 한살이|1","r":"3~4학년","gr":1},{"c":"4과13-02","y":"2015","s":"과학","g":"3~4학년","a":"식물의 한살이","t":"식물의 한살이 관찰 계획을 세워 식물을 기르면서 한살이를 관찰할 수 있다.","e":"","k":"2015|과학|3~4학년|식물의 한살이|1","r":"3~4학년","gr":1},{"c":"4과13-03","y":"2015","s":"과학","g":"3~4학년","a":"식물의 한살이","t":"여러 가지 식물의 한살이 과정을 조사하여 식물에 따라 한살이의 유형이 다양함을 설명할 수 있다. <","e":"식물에 따라 한살이의 유형이 한해살이, 여러해살이가 있음을 알게 하며, 식물의 한살이는 식물이 싹트고 자라고 다시 씨를 맺어 한 세대를 이어가는 과정임을 알게 한다.","k":"2015|과학|3~4학년|식물의 한살이|1","r":"3~4학년","gr":1},{"c":"4과14-01","y":"2015","s":"과학","g":"3~4학년","a":"물의 상태 변화","t":"물이 수증기나 얼음으로 변할 수 있음을 알고, 물이 얼 때와 얼음이 녹을 때의 부피와 무게 변화를 관찰할 수 있다.","e":"물이 얼 때와 녹을 때의 부피 변화를 정확한 수치로 측정하여 비교하지 않고, 물기둥의 높이 변화로 부피가 변했음을 이해할 수 있도록 한다.","k":"2015|과학|3~4학년|물의 상태 변화|1","r":"3~4학년","gr":1},{"c":"4과14-02","y":"2015","s":"과학","g":"3~4학년","a":"물의 상태 변화","t":"물이 증발할 때와 끓을 때의 변화를 관찰하여 차이점을 알고, 이와 관련된 예를 우리 주변에서 찾을 수 있다.","e":"","k":"2015|과학|3~4학년|물의 상태 변화|1","r":"3~4학년","gr":1},{"c":"4과14-03","y":"2015","s":"과학","g":"3~4학년","a":"물의 상태 변화","t":"수증기가 응결하는 현상을 관찰하고, 이와 관련된 예를 우리 주변에서 찾을 수 있다. <","e":"","k":"2015|과학|3~4학년|물의 상태 변화|1","r":"3~4학년","gr":1},{"c":"4과15-01","y":"2015","s":"과학","g":"3~4학년","a":"그림자와 거울","t":"여러 가지 물체의 그림자를 관찰하여 그림자가 생기는 원리를 설명할 수 있다.","e":"","k":"2015|과학|3~4학년|그림자와 거울|1","r":"3~4학년","gr":1},{"c":"4과15-02","y":"2015","s":"과학","g":"3~4학년","a":"그림자와 거울","t":"전등과 물체 사이의 거리에 따른 그림자의 크기 변화를 관찰하여 서술할 수 있다.","e":"전등과 물체 사이의 거리에 따른 그림자의 크기 변화를 관찰하는 활동에서 물체와 스크린 사이의 거리는 고정시켜 놓고 전등의 위치만 바꾸는 것을 기본으로 하여 실험하도록 하고, 추가적으로 물체와 스크린 사이의 거리를 변화시키는 것을 할 수 있다. 이 성취기준에서는 변인의 조작에 따른 변화의 규칙성을 정성적으로 파악하는 능력을 함양하는 데 중점을 준다.","k":"2015|과학|3~4학년|그림자와 거울|1","r":"3~4학년","gr":1},{"c":"4과15-03","y":"2015","s":"과학","g":"3~4학년","a":"그림자와 거울","t":"물체와 평면거울에 비친 모습을 비교하여 거울의 성질을 설명할 수 있다.","e":"실물과 평면거울에 비친 모습을 비교함으로써 거울이 빛을 반사시키는 성질이 있음을 이해한다. 빛이 반사되어 나타나는 현상임을 주목하되 빛의 반사 법칙은 다루지 않도록 한다.","k":"2015|과학|3~4학년|그림자와 거울|1","r":"3~4학년","gr":1},{"c":"4과15-04","y":"2015","s":"과학","g":"3~4학년","a":"그림자와 거울","t":"일상생활에서 거울을 이용하는 예를 조사하고 거울의 성질과 관련지어 그 기능을 설명할 수 있다. <","e":"","k":"2015|과학|3~4학년|그림자와 거울|1","r":"3~4학년","gr":1},{"c":"4과16-01","y":"2015","s":"과학","g":"3~4학년","a":"지구의 모습","t":"지구와 관련된 자료를 조사하여 모양과 표면의 모습을 설명할 수 있다.","e":"","k":"2015|과학|3~4학년|지구의 모습|1","r":"3~4학년","gr":1},{"c":"4과16-02","y":"2015","s":"과학","g":"3~4학년","a":"지구의 모습","t":"육지와 비교하여 바다의 특징을 설명할 수 있다.","e":"지구 표면에서 바다가 차지하는 비율과, 바닷물의 특성을 육지의 물과 비교하여 다룬다.","k":"2015|과학|3~4학년|지구의 모습|1","r":"3~4학년","gr":1},{"c":"4과16-03","y":"2015","s":"과학","g":"3~4학년","a":"지구의 모습","t":"지구 주위를 둘러싸고 있는 공기의 역할을 예를 들어 설명할 수 있다.","e":"","k":"2015|과학|3~4학년|지구의 모습|1","r":"3~4학년","gr":1},{"c":"4과16-04","y":"2015","s":"과학","g":"3~4학년","a":"지구의 모습","t":"달을 조사하여 모양, 표면, 환경을 이해하고 지구와 달을 비교할 수 있다. <","e":"달과 비교하여 지구는 물과 공기, 알맞은 온도 등 생명 활동의 필수 요소를 갖추고 있다는 것을 포함한다.","k":"2015|과학|3~4학년|지구의 모습|1","r":"3~4학년","gr":1},{"c":"4과17-01","y":"2015","s":"과학","g":"3~4학년","a":"물의 여행","t":"물이 이동하거나 상태가 변하면서 순환하는 과정을 생명체, 지표면, 공기 사이에서 일어나는 다양한 현상과 관련지어 설명할 수 있다.","e":"물의 순환 과정을 물의 상태 변화, 식물의 잎을 통한 증산 현상, 증발, 구름의 생성, 강우 등과 관련지어 통합적으로 다룬다. 지구에서 일어나는 물의 이동과 물의 상태 변화의 모습을 다양한 관점에서 다룬다. 증산 작용은 5~6학년군에서 다루기 때문에 여기서는 증산 현상 위주로 다룬다. 세계 여러 곳에서 물이 만년설, 빙하와 같이 액체가 아닌 상태로도 존재함을 이해한다. 구름이나 안개를 물의 기체 상태로 오해하지 않도록 유의한다.","k":"2015|과학|3~4학년|물의 여행|1","r":"3~4학년","gr":1},{"c":"4과17-02","y":"2015","s":"과학","g":"3~4학년","a":"물의 여행","t":"물의 중요성을 알고 물 부족 현상을 해결하기 위해 창의적 방법을 활용한 사례를 조사할 수 있다. <","e":"물 부족 현상을 해결하기 위한 과학·기술·공학적 설계의 예를 찾아봄으로써 적용된 과학적 원리를 탐색하되, 환경오염은 다루지 않는다.","k":"2015|과학|3~4학년|물의 여행|1","r":"3~4학년","gr":1},{"c":"6과01-01","y":"2015","s":"과학","g":"5~6학년","a":"온도와 열","t":"일상생활에서 온도를 어림하거나 측정하는 사례를 조사하고 정확한 온도 측정이 필요한 이유를 설명할 수 있다.","e":"","k":"2015|과학|5~6학년|온도와 열|1","r":"5~6학년","gr":1},{"c":"6과01-02","y":"2015","s":"과학","g":"5~6학년","a":"온도와 열","t":"온도가 다른 두 물체를 접촉하여 온도가 같아지는 현상을 관찰하고 물체의 온도 변화를 열의 이동으로 설명할 수 있다.","e":"","k":"2015|과학|5~6학년|온도와 열|1","r":"5~6학년","gr":1},{"c":"6과01-03","y":"2015","s":"과학","g":"5~6학년","a":"온도와 열","t":"고체 물질의 종류에 따라 열이 전도되는 빠르기를 관찰을 통해 비교하고 일상생활에서 단열을 이용하는 예를 조사할 수 있다.","e":"열의 이동 방법은 전도와 대류만 다루며, 열의 이동을 일상생활과 연계하기 위하여 단열을 다룬다. 복사에 의한 단열은 다루지 않도록 한다.","k":"2015|과학|5~6학년|온도와 열|1","r":"5~6학년","gr":1},{"c":"6과01-04","y":"2015","s":"과학","g":"5~6학년","a":"온도와 열","t":"액체나 기체에서 대류 현상을 관찰하고 대류 현상에서 열의 이동을 설명할 수 있다. <","e":"열의 이동 방법은 전도와 대류만 다루며, 열의 이동을 일상생활과 연계하기 위하여 단열을 다룬다. 복사에 의한 단열은 다루지 않도록 한다.","k":"2015|과학|5~6학년|온도와 열|1","r":"5~6학년","gr":1},{"c":"6과02-01","y":"2015","s":"과학","g":"5~6학년","a":"태양계와 별","t":"태양이 지구의 에너지원임을 이해하고 태양계를 구성하는 태양과 행성을 조사할 수 있다.","e":"태양계를 구성하는 행성들의 표면적인 특징 위주로 조사하고, 행성의 상세한 물리적 특징은 다루지 않는다. 태양과 행성의 실제 크기나 태양에서 행성까지의 실제 거리, 행성의 질량, 자전 속도, 대기 성분 등과 같은 물리량은 다루지 않는다.","k":"2015|과학|5~6학년|태양계와 별|1","r":"5~6학년","gr":1},{"c":"6과02-02","y":"2015","s":"과학","g":"5~6학년","a":"태양계와 별","t":"별의 의미를 알고 대표적인 별자리를 조사할 수 있다.","e":"별의 의미는 행성과 비교하여 스스로 빛을 내는 천체라는 수준에서만 다룬다. 대표적인 별자리는 학생들이 쉽게 관찰할 수 있는 북극성 주변의 별자리를 다루며, 계절별 별자리와 관련짓지 않는다.","k":"2015|과학|5~6학년|태양계와 별|1","r":"5~6학년","gr":1},{"c":"6과02-03","y":"2015","s":"과학","g":"5~6학년","a":"태양계와 별","t":"북쪽 하늘의 별자리를 이용하여 북극성을 찾을 수 있다. <","e":"북두칠성과 카시오페이아 자리를 이용하여 북극성을 찾게 함으로써 별자리가 방위를 찾는 데 이용됨을 다룬다.","k":"2015|과학|5~6학년|태양계와 별|1","r":"5~6학년","gr":1},{"c":"6과03-01","y":"2015","s":"과학","g":"5~6학년","a":"용해와 용액","t":"물질이 물에 녹는 현상을 관찰하고 용액을 설명할 수 있다.","e":"용해의 과정과 용해의 결과인 용액을 관찰하고 그 특징을 알게 한다. 물에 녹는 물질과 녹지 않는 물질을 물에 넣어서 비교하는 활동을 통하여 물질이 용해되는 현상을 이해하도록 한다. 물질을 물에 녹이기 전과 후의 무게를 비교하는 실험을 통하여 용해의 과정을 이해할 수 있도록 돕는다.","k":"2015|과학|5~6학년|용해와 용액|1","r":"5~6학년","gr":1},{"c":"6과03-02","y":"2015","s":"과학","g":"5~6학년","a":"용해와 용액","t":"용질의 종류에 따라 물에 녹는 양이 달라짐을 비교할 수 있다.","e":"","k":"2015|과학|5~6학년|용해와 용액|1","r":"5~6학년","gr":1},{"c":"6과03-03","y":"2015","s":"과학","g":"5~6학년","a":"용해와 용액","t":"물의 온도에 따라 용질의 녹는 양이 달라짐을 실험할 수 있다.","e":"","k":"2015|과학|5~6학년|용해와 용액|1","r":"5~6학년","gr":1},{"c":"6과03-04","y":"2015","s":"과학","g":"5~6학년","a":"용해와 용액","t":"용액의 진하기를 상대적으로 비교하는 방법을 고안할 수 있다. <","e":"","k":"2015|과학|5~6학년|용해와 용액|1","r":"5~6학년","gr":1},{"c":"6과04-01","y":"2015","s":"과학","g":"5~6학년","a":"다양한 생물과 우리 생활","t":"동물과 식물 이외의 생물을 조사하여 생물의 종류와 특징을 설명할 수 있다.","e":"동물과 식물 이외의 해캄, 짚신벌레 등과 같은 원생생물, 버섯, 곰팡이와 같은 균류, 그리고 세균에 대해서 다루도록 한다.","k":"2015|과학|5~6학년|다양한 생물과 우리 생활|1","r":"5~6학년","gr":1},{"c":"6과04-02","y":"2015","s":"과학","g":"5~6학년","a":"다양한 생물과 우리 생활","t":"다양한 생물이 우리 생활에 미치는 긍정적인 영향과 부정적인 영향에 대해 토의할 수 있다.","e":"","k":"2015|과학|5~6학년|다양한 생물과 우리 생활|1","r":"5~6학년","gr":1},{"c":"6과04-03","y":"2015","s":"과학","g":"5~6학년","a":"다양한 생물과 우리 생활","t":"우리 생활에 첨단 생명과학이 이용된 사례를 조사하여 발표할 수 있다. <","e":"첨단 생명과학은 학생들이 생활 속에서 경험하고 인지할 수 있는 수준으로 균류, 원생생물, 세균의 활용을 중심으로 다루도록 한다.","k":"2015|과학|5~6학년|다양한 생물과 우리 생활|1","r":"5~6학년","gr":1},{"c":"6과05-01","y":"2015","s":"과학","g":"5~6학년","a":"생물과 환경","t":"생태계가 생물 요소와 비생물 요소로 이루어져 있음을 알고 생태계 구성 요소들이 서로 영향을 주고받음을 설명할 수 있다.","e":"","k":"2015|과학|5~6학년|생물과 환경|1","r":"5~6학년","gr":1},{"c":"6과05-02","y":"2015","s":"과학","g":"5~6학년","a":"생물과 환경","t":"비생물 환경 요인이 생물에 미치는 영향을 이해하여 환경과 생물 사이의 관계를 설명할 수 있다.","e":"생태계 환경 요인은 빛, 온도, 물 등을 의미함을 인식하게 한다. 또한 빛, 온도, 물 등과 같은 환경 요인이 생물에 미치는 영향을 실험으로 확인하게 한다.","k":"2015|과학|5~6학년|생물과 환경|1","r":"5~6학년","gr":1},{"c":"6과05-03","y":"2015","s":"과학","g":"5~6학년","a":"생물과 환경","t":"생태계 보전의 필요성을 인식하고 생태계 보전을 위해 우리가 할 수 있는 일에 대해 토의할 수 있다. <","e":"환경 오염으로 인한 생태계 파괴 사례는 지역 사회에서 나타나는 대기오염, 수질오염, 토양오염 등에 관한 사례를 중심으로 다루도록 하며, 이에 대한 해결 방법을 찾고 아울러 생태계 보전에 대한 의식을 가지도록 한다.","k":"2015|과학|5~6학년|생물과 환경|1","r":"5~6학년","gr":1},{"c":"6과06-01","y":"2015","s":"과학","g":"5~6학년","a":"날씨와 우리 생활","t":"습도를 측정하고 습도가 우리 생활에 영향을 주는 사례를 조사할 수 있다.","e":"","k":"2015|과학|5~6학년|날씨와 우리 생활|1","r":"5~6학년","gr":1},{"c":"6과06-02","y":"2015","s":"과학","g":"5~6학년","a":"날씨와 우리 생활","t":"이슬, 안개, 구름의 공통점과 차이점을 이해하고 비와 눈이 내리는 과정을 설명할 수 있다.","e":"구름에서 비와 눈이 내리는 과정은 구름을 구성하는 입자가 커져서 떨어지는 수준에서 이해할 수 있도록 안내한다.","k":"2015|과학|5~6학년|날씨와 우리 생활|1","r":"5~6학년","gr":1},{"c":"6과06-03","y":"2015","s":"과학","g":"5~6학년","a":"날씨와 우리 생활","t":"고기압과 저기압이 무엇인지 알고 바람이 부는 이유를 설명할 수 있다.","e":"기압은 공기의 압력보다는 무게와 관련지어 소개하고, 고기압과 저기압의 의미는 고기압과 저기압 사이에서 바람이 어떻게 부는지를 이해하는 수준에서 다룬다. 대기의 연직 온도 분포, 대기의 성분, 기단, 전선 등의 개념은 구체적으로 다루지 않는다.","k":"2015|과학|5~6학년|날씨와 우리 생활|1","r":"5~6학년","gr":1},{"c":"6과06-04","y":"2015","s":"과학","g":"5~6학년","a":"날씨와 우리 생활","t":"계절별 날씨의 특징을 우리나라에 영향을 주는 공기의 성질과 관련지을 수 있다. <","e":"","k":"2015|과학|5~6학년|날씨와 우리 생활|1","r":"5~6학년","gr":1},{"c":"6과07-01","y":"2015","s":"과학","g":"5~6학년","a":"물체의 운동","t":"일상생활에서 물체의 운동을 관찰하여 속력을 정성적으로 비교할 수 있다.","e":"일상생활에서 쉽게 관찰할 수 있는 운동의 빠르기를 같은 거리를 갈 때 걸리는 시간과 같은 시간에 간 거리를 비교하여 알아볼 수 있다.","k":"2015|과학|5~6학년|물체의 운동|1","r":"5~6학년","gr":1},{"c":"6과07-02","y":"2015","s":"과학","g":"5~6학년","a":"물체의 운동","t":"물체의 이동 거리와 걸린 시간을 조사하여 속력을 구할 수 있다.","e":"이동 거리가 같고 걸린 시간이 다른 경우, 걸린 시간이 같고 이동 거리가 다른 경우, 이동 거리와 걸린 시간이 다른 경우를 모두 다룰 수 있다. 물체가 일직선 상에서 한 방향으로 운동하는 경우만 다루며, 속력의 단위 변환은 다루지 않는다.","k":"2015|과학|5~6학년|물체의 운동|1","r":"5~6학년","gr":1},{"c":"6과07-03","y":"2015","s":"과학","g":"5~6학년","a":"물체의 운동","t":"일상생활에서 속력과 관련된 안전 사항과 안전장치의 예를 찾아 발표할 수 있다. <","e":"","k":"2015|과학|5~6학년|물체의 운동|1","r":"5~6학년","gr":1},{"c":"6과08-01","y":"2015","s":"과학","g":"5~6학년","a":"산과 염기","t":"우리 주변에서 볼 수 있는 여러 가지 용액을 다양한 기준으로 분류할 수 있다.","e":"여러 가지 용액의 성질을 색, 냄새, 투명도 등의 다양한 관점에서 관찰하고, 이를 바탕으로 공통점과 차이점을 찾아낸 뒤에 분류 기준을 정하여 분류해 보도록 한다 과학|5~6학년|여러 가지 기체|1","r":"5~6학년","gr":1},{"c":"6과11-01","y":"2015","s":"과학","g":"5~6학년","a":"빛과 렌즈","t":"햇빛이 프리즘에서 다양한 색으로 나타나는 현상을 관찰하여, 햇빛이 여러 가지 색의 빛으로 되어 있음을 설명할 수 있다.","e":"빛의 분산이나 합성이란 용어는 사용하지 않고, 햇빛에는 여러 가지 색의 빛이 섞여 있음을 인식시키도록 한다. 파장에 따른 굴절률의 차이는 빛의 색에 따라 굴절하는 정도가 다르다는 정도로 다룬다.","k":"2015|과학|5~6학년|빛과 렌즈|1","r":"5~6학년","gr":1},{"c":"6과11-02","y":"2015","s":"과학","g":"5~6학년","a":"빛과 렌즈","t":"빛이 유리나 물, 볼록 렌즈를 통과하면서 굴절되는 현상을 관찰하고 관찰한 내용을 그림으로 표현할 수 있다.","e":"학생이 관찰한 빛의 진행 경로를 그려보는 정도로 다루며 정확한 광선 다이어그램을 그리는 것은 요구하지 않는다.","k":"2015|과학|5~6학년|빛과 렌즈|1","r":"5~6학년","gr":1},{"c":"6과11-03","y":"2015","s":"과학","g":"5~6학년","a":"빛과 렌즈","t":"볼록 렌즈를 이용하여 물체의 모습을 관찰하고 볼록 렌즈의 쓰임새를 조사할 수 있다. <","e":"볼록 렌즈에서는 빛의 굴절 현상이 일어나며 이로 인해 물체의 모습이 실제와 다르게 보인다는 사실을 인식시킨다. 단, 물체와 볼록 렌즈의 위치 관계에 따른 상의 차이는 다루지 않는다.","k":"2015|과학|5~6학년|빛과 렌즈|1","r":"5~6학년","gr":1},{"c":"6과12-01","y":"2015","s":"과학","g":"5~6학년","a":"식물의 구조와 기능","t":"생물체를 이루고 있는 기본 단위인 세포를 현미경으로 관찰할 수 있다.","e":"","k":"2015|과학|5~6학년|식물의 구조와 기능|1","r":"5~6학년","gr":1},{"c":"6과12-02","y":"2015","s":"과학","g":"5~6학년","a":"식물의 구조와 기능","t":"식물의 전체적인 구조 관찰과 실험을 통해 뿌리, 줄기, 잎, 꽃의 구조와 기능을 설명할 수 있다.","e":"식물체에서 물과 양분의 이동 시, 식물의 각 기관이 서로 연결되어 있음을 다루도록 한다.","k":"2015|과학|5~6학년|식물의 구조와 기능|1","r":"5~6학년","gr":1},{"c":"6과12-03","y":"2015","s":"과학","g":"5~6학년","a":"식물의 구조와 기능","t":"여러 가지 식물의 씨가 퍼지는 방법을 조사하고, 씨가 퍼지는 방법이 다양함을 설명할 수 있다. <","e":"","k":"2015|과학|5~6학년|식물의 구조와 기능|1","r":"5~6학년","gr":1},{"c":"6과13-01","y":"2015","s":"과학","g":"5~6학년","a":"전기의 이용","t":"전지와 전구, 전선을 연결하여 전구에 불이 켜지는 조건을 찾아 설명할 수 있다.","e":"","k":"2015|과학|5~6학년|전기의 이용|1","r":"5~6학년","gr":1},{"c":"6과13-02","y":"2015","s":"과학","g":"5~6학년","a":"전기의 이용","t":"전구를 직렬연결 할 때와 병렬연결 할 때 전구의 밝기 차이를 비교할 수 있다.","e":"전구의 밝기를 비교할 때 전류나 전압의 크기를 비교하지 않고 에너지 관점에서 전구의 연결 방법에 따라 에너지의 소비가 달라지는 것을 이해하도록 한다.","k":"2015|과학|5~6학년|전기의 이용|1","r":"5~6학년","gr":1},{"c":"6과13-03","y":"2015","s":"과학","g":"5~6학년","a":"전기의 이용","t":"전기를 절약하고 안전하게 사용하는 방법을 토의할 수 있다.","e":"","k":"2015|과학|5~6학년|전기의 이용|1","r":"5~6학년","gr":1},{"c":"6과13-04","y":"2015","s":"과학","g":"5~6학년","a":"전기의 이용","t":"전자석을 만들어 영구 자석과 전자석을 비교하고 일상생활에서 전자석이 사용되는 예를 조사할 수 있다. <","e":"전자석은 건전지를 이용하여 제작하도록 하며, 건전지의 수에 따라 전자석의 세기를 조절할 수 있고 건전지 연결 방향을 바꾸어 전자석의 극을 조절할 수 있음을 관찰하여 영구 자석과의 차이를 비교하고 사용 용도를 생각할 수 있도록 한다.","k":"2015|과학|5~6학년|전기의 이용|1","r":"5~6학년","gr":1},{"c":"6과14-01","y":"2015","s":"과학","g":"5~6학년","a":"계절의 변화","t":"하루 동안 태양의 고도, 그림자 길이, 기온을 측정하여 이들 사이의 관계를 찾을 수 있다.","e":"","k":"2015|과학|5~6학년|계절의 변화|1","r":"5~6학년","gr":1},{"c":"6과14-02","y":"2015","s":"과학","g":"5~6학년","a":"계절의 변화","t":"계절에 따른 태양의 남중 고도, 낮과 밤의 길이, 기온 변화를 설명할 수 있다.","e":"","k":"2015|과학|5~6학년|계절의 변화|1","r":"5~6학년","gr":1},{"c":"6과14-03","y":"2015","s":"과학","g":"5~6학년","a":"계절의 변화","t":"계절 변화의 원인은 지구 자전축이 기울어진 채 공전하기 때문임을 모형실험을 통해 설명할 수 있다. <","e":"지구 자전축이 기울어진 채 공전하기 때문에 계절에 따라 태양의 남중 고도가 달라져 지표가 받는 태양 에너지의 차이로 계절의 변화가 생김을 이해하게 한다.","k":"2015|과학|5~6학년|계절의 변화|1","r":"5~6학년","gr":1},{"c":"6과15-01","y":"2015","s":"과학","g":"5~6학년","a":"연소와 소화","t":"물질이 탈 때 나타나는 공통적인 현상을 관찰하고, 연소의 조건을 찾을 수 있다.","e":"","k":"2015|과학|5~6학년|연소와 소화|1","r":"5~6학년","gr":1},{"c":"6과15-02","y":"2015","s":"과학","g":"5~6학년","a":"연소와 소화","t":"실험을 통해 연소 후에 생성되는 물질을 찾을 수 있다.","e":"양초나 알코올이 탈 때 생성되는 물질을 간단한 조작을 통해 확인해 보게 한다. 양초가 연소할 때 발생하는 그을음이 생기는데, 이것은 불완전 연소일 때 나타나는 현상이다. 따라서 그을음을 양초가 연소할 때 발생하는 생성물로 설명하지 않도록 한다.","k":"2015|과학|5~6학년|연소와 소화|1","r":"5~6학년","gr":1},{"c":"6과15-03","y":"2015","s":"과학","g":"5~6학년","a":"연소와 소화","t":"연소의 조건과 관련지어 소화 방법을 제안하고 화재 안전 대책에 대해 토의할 수 있다. <","e":"연소의 조건을 하나씩 제거하면 불을 끌 수 있음을 인식하게 하여 일상생활에서 소화 방법을 찾아낼 수 있도록 한다. 이때 나무와 같은 물질과 기름과 같은 물질이 탈 때의 소화 방법이 다름을 알고, 화재가 발생했을 때 안전 대책을 생각해 보도록 한다.","k":"2015|과학|5~6학년|연소와 소화|1","r":"5~6학년","gr":1},{"c":"6과16-01","y":"2015","s":"과학","g":"5~6학년","a":"우리 몸의 구조와 기능","t":"뼈와 근육의 생김새와 기능을 이해하여 몸이 움직이는 원리를 설명할 수 있다.","e":"중학교와 고등학교 과정에서는 뼈와 근육에 대해서 학습하지 않으므로 이 단원에서 뼈와 근육의 구조와 기능에 대한 기본적인 이해를 하는 데 중점을 둔다.","k":"2015|과학|5~6학년|우리 몸의 구조와 기능|1","r":"5~6학년","gr":1},{"c":"6과16-02","y":"2015","s":"과학","g":"5~6학년","a":"우리 몸의 구조와 기능","t":"소화, 순환, 호흡, 배설 기관의 종류, 위치, 생김새, 기능을 설명할 수 있다.","e":"","k":"2015|과학|5~6학년|우리 몸의 구조와 기능|1","r":"5~6학년","gr":1},{"c":"6과16-03","y":"2015","s":"과학","g":"5~6학년","a":"우리 몸의 구조와 기능","t":"감각 기관의 종류, 위치, 생김새, 기능을 알고 자극이 전달되는 과정을 설명할 수 있다.","e":"","k":"2015|과학|5~6학년|우리 몸의 구조와 기능|1","r":"5~6학년","gr":1},{"c":"6과16-04","y":"2015","s":"과학","g":"5~6학년","a":"우리 몸의 구조와 기능","t":"운동할 때 우리 몸에서 나타나는 변화를 관찰하여 우리 몸의 여러 기관이 서로 관련되어 있음을 설명할 수 있다. <","e":"","k":"2015|과학|5~6학년|우리 몸의 구조와 기능|1","r":"5~6학년","gr":1},{"c":"6과17-01","y":"2015","s":"과학","g":"5~6학년","a":"에너지와 생활","t":"생물이 살아가거나 기계를 움직이는 데 에너지가 필요함을 알고, 이때 이용하는 에너지의 형태를 조사할 수 있다.","e":"에너지를 정확히 정의하기보다 에너지와 에너지 자원, 에너지와 물질을 구분하는데 초점을 둔다. 에너지의 형태는 열에너지, 전기 에너지, 빛에너지, 화학 에너지, 운동 에너지, 위치 에너지를 다룬다.","k":"2015|과학|5~6학년|에너지와 생활|1","r":"5~6학년","gr":1},{"c":"6과17-02","y":"2015","s":"과학","g":"5~6학년","a":"에너지와 생활","t":"자연 현상이나 일상생활의 예를 통해 에너지의 형태가 전환됨을 알고, 에너지를 효율적으로 사용하는 방법을 토의할 수 있다. <","e":"에너지는 물리적 현상, 화학적 현상, 생명 현상, 지구와 우주의 여러 현상을 설명하는데 필요한 통합적 개념이므로 에너지 전환이 일어나는 다양한 현상의 예를 들도록 한다. 에너지 전환 과정에서 에너지를 효율적으로 사용하는 전기 기구, 건축물 등의 예, 생물이 에너지를 효율적으로 사용하는 사례 등을 조사하여 설명하도록 한다.","k":"2015|과학|5~6학년|에너지와 생활|1","r":"5~6학년","gr":1},{"c":"2국01-01","y":"2015","s":"국어","g":"1~2학년","a":"듣기·말하기","t":"상황에 어울리는 인사말을 주고받는다.","e":"이 성취기준은 생활 속에서 상황에 맞는 인사말을 주고받음으로써 타인과 원만한 관계를 형성하는 능력을 기르기 위해 설정하였다. 학교생활에 적응할 때에도 자연스러운 인사말이 필요하고, 집을 나서거나 집으로 돌아올 때, 사람을 만나거나 헤어질 때, 처음 만나는 사람끼리 자기소개를 할 때, 상대방에게 고마운 마음을 드러낼 때 등 상황에 따라 주고받는 인사말이 다르다. 학습자가 처할 수 있는 여러 상황별로 어울리는 인사말을 이해하고 연습하는 데 중점을 둔다.","k":"2015|국어|1~2학년|듣기·말하기|1","r":"1~2학년","gr":1},{"c":"2국01-02","y":"2015","s":"국어","g":"1~2학년","a":"듣기·말하기","t":"일이 일어난 순서를 고려하며 듣고 말한다.","e":"","k":"2015|국어|1~2학년|듣기·말하기|1","r":"1~2학년","gr":1},{"c":"2국01-03","y":"2015","s":"국어","g":"1~2학년","a":"듣기·말하기","t":"자신의 감정을 표현하며 대화를 나눈다.","e":"이 성취기준은 대화를 나눌 때 자신의 감정을 적절하게 표현함으로써 타인과의 관계를 유지하고 발전시키는 능력을 기르기 위해 설정하였다. 자신의 감정을 이해하고 상황에 적절하게 감정을 표현하는 것은 자기를 이해하고 대인 관계를 형성하는 데 도움이 된다는 점을 알도록 하고, 기쁨, 슬픔, 사랑, 미움 등 다양한 종류의 감정을 자연스럽게 표현하도록 하는 데 중점을 둔다.","k":"2015|국어|1~2학년|듣기·말하기|1","r":"1~2학년","gr":1},{"c":"2국01-04","y":"2015","s":"국어","g":"1~2학년","a":"듣기·말하기","t":"듣는 이를 바라보며 바른 자세로 자신 있게 말한다.","e":"","k":"2015|국어|1~2학년|듣기·말하기|1","r":"1~2학년","gr":1},{"c":"2국01-05","y":"2015","s":"국어","g":"1~2학년","a":"듣기·말하기","t":"말하는 이와 말의 내용에 집중하며 듣는다.","e":"이 성취기준은 바른 듣기 방법과 태도를 배우고 연습함으로써 말하는 이를 존중하고 말의 내용을 정확하게 이해하는 능력을 기르기 위해 설정하였다. 말하는 이와 말의 내용에 주의를 집중하여 듣는 것은 내용을 이해하기 위해서 필요할 뿐 아니라, 상대를 배려하며 듣는 태도의 문제이며 언어 예절과도 관계가 있다. 눈 맞춤, 고개 끄덕임 등의 반응을 보임으로써 상대방의 말에 집중하며 듣고 있음을 상대가 알도록 하는 데 중점을 둔다.","k":"2015|국어|1~2학년|듣기·말하기|1","r":"1~2학년","gr":1},{"c":"2국01-06","y":"2015","s":"국어","g":"1~2학년","a":"듣기·말하기","t":"바르고 고운 말을 사용하여 말하는 태도를 지닌다.","e":"","k":"2015|국어|1~2학년|듣기·말하기|1","r":"1~2학년","gr":1},{"c":"2국02-01","y":"2015","s":"국어","g":"1~2학년","a":"읽기","t":"글자, 낱말, 문장을 소리 내어 읽는다.","e":"","k":"2015|국어|1~2학년|읽기|1","r":"1~2학년","gr":1},{"c":"2국02-02","y":"2015","s":"국어","g":"1~2학년","a":"읽기","t":"문장과 글을 알맞게 띄어 읽는다.","e":"이 성취기준은 알맞게 띄어 읽기를 통해 글의 내용을 파악하는 능력을 기르기 위해 설정하였다. 띄어 읽기를 할 때에는 어절, 문장 부호 다음, 주어부와 서술어부 등을 단위로 하여 띄어 읽을 수 있는데, 이들 용어를 노출시키지 않도록 주의한다. 쉬는 지점과 쉼의 길이에 유의하여 알맞게 띄어 읽도록 하는 데 중점을 둔다.","k":"2015|국어|1~2학년|읽기|1","r":"1~2학년","gr":1},{"c":"2국02-03","y":"2015","s":"국어","g":"1~2학년","a":"읽기","t":"글을 읽고 주요 내용을 확인한다.","e":"","k":"2015|국어|1~2학년|읽기|1","r":"1~2학년","gr":1},{"c":"2국02-04","y":"2015","s":"국어","g":"1~2학년","a":"읽기","t":"글을 읽고 인물의 처지와 마음을 짐작한다.","e":"이 성취기준은 글에 등장하는 인물의 심리를 상상하고 이에 공감하는 능력을 기르기 위해 설정하였다. 등장인물이 어떤 처지와 상황에 있는지, 혹은 어떤 마음인지를 짐작해 보는 활동에 주안점을 둔다. 이를 위해서는 글의 내용을 확인하고, 등장인물의 마음을 자신의 경험과 비교하는 활동을 해 보는 것이 좋다. 이러한 과정을 통해 타인에 대한 공감 능력을 기름으로써 실제 주변 인물에 대한 이해를 높일 수 있다.","k":"2015|국어|1~2학년|읽기|1","r":"1~2학년","gr":1},{"c":"2국02-05","y":"2015","s":"국어","g":"1~2학년","a":"읽기","t":"읽기에 흥미를 가지고 즐겨 읽는 태도를 지닌다.","e":"","k":"2015|국어|1~2학년|읽기|1","r":"1~2학년","gr":1},{"c":"2국03-01","y":"2015","s":"국어","g":"1~2학년","a":"쓰기","t":"글자를 바르게 쓴다.","e":"이 성취기준은 바른 자세로 글자를 정확하게 쓰는 습관을 기르기 위해 설정하였다. 바른 자세로 글씨 쓰기에는 바르게 앉아 쓰기, 연필 바르게 잡기, 낱자의 모양이나 간격 등을 고려하여 글씨 바르게 쓰기가 포함된다. 글자를 정확하게 쓰기 위해서는 짜임과 필순에 맞게 낱자를 쓰게 한다. 글자의 복잡성 정도를 고려하여 처음에는 받침이 없는 간단한 글자부터 시작하여 점차 받침이 있는 복잡한 글자를 쓸 수 있게 한다.","k":"2015|국어|1~2학년|쓰기|1","r":"1~2학년","gr":1},{"c":"2국03-02","y":"2015","s":"국어","g":"1~2학년","a":"쓰기","t":"자신의 생각을 문장으로 표현한다.","e":"이 성취기준은 문장 구성 능력을 기르기 위해 설정하였다. 문장은 글을 구성하는 기본이다. 글을 잘 쓰려면 먼저 자신의 생각을 정확하게 문장으로 표현할 수 있어야 한다. 한두 문장으로 짤막하게 자신의 생각이나 느낌을 표현하되, 마침표, 물음표, 느낌표 등의 문장 부호를 사용하여 자신의 생각을 문장으로 정확하게 구성하는 기본 능력을 기르도록 지도한다. 또한 꾸며 주는 말을 넣어 자신의 생각과 느낌을 구체적으로 표현하도록 지도한다.","k":"2015|국어|1~2학년|쓰기|1","r":"1~2학년","gr":1},{"c":"2국03-03","y":"2015","s":"국어","g":"1~2학년","a":"쓰기","t":"주변의 사람이나 사물에 대해 짧은 글을 쓴다.","e":"이 성취기준은 자신의 주변에서 소재를 찾아 글로 표현하는 능력을 기르기 위해 설정하였다. 자신의 주변에 있는 사람이나 사물에 관심을 가지고 그 특징이 드러나도록 짧은 글로 나타내 보게 한다.","k":"2015|국어|1~2학년|쓰기|1","r":"1~2학년","gr":1},{"c":"2국03-04","y":"2015","s":"국어","g":"1~2학년","a":"쓰기","t":"인상 깊었던 일이나 겪은 일에 대한 생각이나 느낌을 쓴다.","e":"","k":"2015|국어|1~2학년|쓰기|1","r":"1~2학년","gr":1},{"c":"2국03-05","y":"2015","s":"국어","g":"1~2학년","a":"쓰기","t":"쓰기에 흥미를 가지고 즐겨 쓰는 태도를 지닌다.","e":"","k":"2015|국어|1~2학년|쓰기|1","r":"1~2학년","gr":1},{"c":"2국04-01","y":"2015","s":"국어","g":"1~2학년","a":"문법","t":"한글 자모의 이름과 소릿값을 알고 정확하게 발음하고 쓴다.","e":"","k":"2015|국어|1~2학년|문법|1","r":"1~2학년","gr":1},{"c":"2국04-02","y":"2015","s":"국어","g":"1~2학년","a":"문법","t":"소리와 표기가 다를 수 있음을 알고 낱말을 바르게 읽고 쓴다.","e":"이 성취기준은 소리와 표기가 일치하는 낱말과 그렇지 않은 낱말이 있음을 알고 소리와 표기 사이의 관계를 이해하여 낱말을 바르게 쓰는 능력을 기르기 위해 설정하였다. 소리와 표기가 일치하는 쉬운 낱말부터 소리와 표기가 일치하지 않는 낱말로 점차 학습 범위를 확장하며 소리와 표기가 일치하지 않는 낱말을 어법에 맞게 적을 수 있도록 한다. 또한 소리와 표기가 일치하는 낱말이나 그렇지 않은 낱말을 그 소릿값에 맞게 바르게 읽을 수 있도록 한다.","k":"2015|국어|1~2학년|문법|1","r":"1~2학년","gr":1},{"c":"2국04-03","y":"2015","s":"국어","g":"1~2학년","a":"문법","t":"문장에 따라 알맞은 문장 부호를 사용한다.","e":"","k":"2015|국어|1~2학년|문법|1","r":"1~2학년","gr":1},{"c":"2국04-04","y":"2015","s":"국어","g":"1~2학년","a":"문법","t":"글자, 낱말, 문장을 관심 있게 살펴보고 흥미를 가진다.","e":"이 성취기준은 주변의 글자, 낱말, 문장에 대해 무심코 넘어가지 않고 민감하게 받아들이며 호기심을 바탕으로 탐구하는 자세를 기르기 위해 설정하였다. 예를 들어 낱자 하나를 바꾸면 낱말의 의미가 달라지거나 하나의 글자가 여러 낱말에서 쓰일 수 있는 것을 발견하는 등 일상생활에서 사용하는 글자, 낱말, 문장에 관심을 갖도록 하는 데 중점을 둔다.","k":"2015|국어|1~2학년|문법|1","r":"1~2학년","gr":1},{"c":"2국05-01","y":"2015","s":"국어","g":"1~2학년","a":"문학","t":"느낌과 분위기를 살려 그림책, 시나 노래, 짧은 이야기를 들려주거나 듣는다.","e":"이 성취기준은 작품의 내용이나 표현에서 오는 느낌과 분위기를 살려서 노래하거나 낭독 혹은 낭송함으로써 작품의 수용 능력을 향상시키기 위해 설정하였다. 따라서 시나 노래, 이야기 등 다양한 갈래의 작품을 두루 활용하여 목소리의 높낮이, 성량, 속도 등에 대한 감각을 기르도록 한다. 운율과 정서 및 운율과 분위기가 조화로운 작품, 다양한 분위기를 엿볼 수 있는 작품을 통해 내용과 표현이 서로 연관된다는 점을 이해하도록 하는 데 중점을 둔다.","k":"2015|국어|1~2학년|문학|1","r":"1~2학년","gr":1},{"c":"2국05-02","y":"2015","s":"국어","g":"1~2학년","a":"문학","t":"인물의 모습, 행동, 마음을 상상하며 그림책, 시나 노래, 이야기를 감상한다.","e":"","k":"2015|국어|1~2학년|문학|1","r":"1~2학년","gr":1},{"c":"2국05-03","y":"2015","s":"국어","g":"1~2학년","a":"문학","t":"여러 가지 말놀이를 통해 말의 재미를 느낀다.","e":"이 성취기준은 놀이 요소를 가진 말을 통해 문학의 즐거움을 느끼도록 하기 위해 설정하였다. 갈래를 시나 노래에 한정할 필요는 없으며, 여러 갈래의 작품은 물론 일상적 대화 등을 통해 언어의 놀이적 성격을 인지하고 문학을 즐겨 향유하도록 한다. 의성어와 의태어, 두운이나 각운, 율격이 두드러진 말, 언어유희, 재치 있는 문답, 수수께끼, 끝말잇기 등에서 재미를 느끼게 한다.","k":"2015|국어|1~2학년|문학|1","r":"1~2학년","gr":1},{"c":"2국05-04","y":"2015","s":"국어","g":"1~2학년","a":"문학","t":"자신의 생각이나 겪은 일을 시나 노래, 이야기 등으로 표현한다.","e":"이 성취기준은 일상생활의 다양한 경험을 문학적으로 표현함으로써 그 즐거움을 맛보고 문학 활동에 자신감을 갖도록 하기 위해 설정하였다. 시나 노래, 이야기의 특성이나 요건에 얽매이지 않고 자유롭게 표현하도록 하며, 이전에 배운 다른 작품을 모방하여 표현하는 것도 허용될 수 있다. 문학이 경험의 언어적 표현이라는 점을 익히도록 하는 데 중점을 둔다.","k":"2015|국어|1~2학년|문학|1","r":"1~2학년","gr":1},{"c":"2국05-05","y":"2015","s":"국어","g":"1~2학년","a":"문학","t":"시나 노래, 이야기에 흥미를 가진다.","e":"","k":"2015|국어|1~2학년|문학|1","r":"1~2학년","gr":1},{"c":"4국01-01","y":"2015","s":"국어","g":"3~4학년","a":"듣기·말하기","t":"대화의 즐거움을 알고 대화를 나눈다.","e":"이 성취기준은 자신의 생각과 느낌, 경험을 다른 사람과 공유하면서 대화의 즐거움을 깨닫고 능동적으로 대인 의사소통에 참여하는 태도를 기르기 위해 설정하였다. 대화에서 상대가 나의 말을 귀담아 듣고 흥미를 보이며, 서로 말의 내용과 감정을 공유하는 과정에서 대화의 즐거움을 느끼게 하는 데 중점을 둔다. 거창하거나 대단한 경험이 아닌 소박하고 친숙한 일상의 경험도 화제로 활용하게 하며, 경험과 함께 감정도 나눌 수 있도록 지도한다.","k":"2015|국어|3~4학년|듣기·말하기|1","r":"3~4학년","gr":1},{"c":"4국01-02","y":"2015","s":"국어","g":"3~4학년","a":"듣기·말하기","t":"회의에서 의견을 적극적으로 교환한다.","e":"이 성취기준은 의견을 조율하고 타당한 합의안을 선택하는 의사 결정의 기초 능력을 기르기 위해 설정하였다. 학습자가 겪을 수 있는 일상적 문제 중에서 회의 주제를 채택하고, 적절한 근거를 들어 의견을 제안하고 다른 사람의 의견을 경청하며 자신의 의견과 다른 사람의 의견을 비교하도록 한다. 직접 회의를 수행해 보며 회의가 일정한 절차와 방법에 따라 진행됨을 경험하고 회의에 능동적으로 참여하도록 한다.","k":"2015|국어|3~4학년|듣기·말하기|1","r":"3~4학년","gr":1},{"c":"4국01-03","y":"2015","s":"국어","g":"3~4학년","a":"듣기·말하기","t":"원인과 결과의 관계를 고려하며 듣고 말한다.","e":"","k":"2015|국어|3~4학년|듣기·말하기|1","r":"3~4학년","gr":1},{"c":"4국01-04","y":"2015","s":"국어","g":"3~4학년","a":"듣기·말하기","t":"적절한 표정, 몸짓, 말투로 말한다.","e":"","k":"2015|국어|3~4학년|듣기·말하기|1","r":"3~4학년","gr":1},{"c":"4국01-05","y":"2015","s":"국어","g":"3~4학년","a":"듣기·말하기","t":"내용을 요약하며 듣는다.","e":"","k":"2015|국어|3~4학년|듣기·말하기|1","r":"3~4학년","gr":1},{"c":"4국01-06","y":"2015","s":"국어","g":"3~4학년","a":"듣기·말하기","t":"예의를 지키며 듣고 말하는 태도를 지닌다.","e":"","k":"2015|국어|3~4학년|듣기·말하기|1","r":"3~4학년","gr":1},{"c":"4국02-01","y":"2015","s":"국어","g":"3~4학년","a":"읽기","t":"문단과 글의 중심 생각을 파악한다.","e":"","k":"2015|국어|3~4학년|읽기|1","r":"3~4학년","gr":1},{"c":"4국02-02","y":"2015","s":"국어","g":"3~4학년","a":"읽기","t":"글의 유형을 고려하여 대강의 내용을 간추린다.","e":"","k":"2015|국어|3~4학년|읽기|1","r":"3~4학년","gr":1},{"c":"4국02-03","y":"2015","s":"국어","g":"3~4학년","a":"읽기","t":"글에서 낱말의 의미나 생략된 내용을 짐작한다.","e":"이 성취기준은 중요한 낱말의 의미나 글에서 생략된 내용을 문맥을 통해 짐작하여 추측하며 읽는 능력을 기르기 위해 설정하였다. 글의 전체적인 흐름이나 글에서 빠진 세부 내용을 추측하거나, 이어질 내용을 예측하거나, 인물의 마음이나 상황을 상상하거나, 사건의 전후를 추론하거나, 낱말의 의미 등을 짐작하면서 내용을 이해하도록 지도한다. 이때 문맥이나 읽는 이의 배경지식을 이용하여 짐작할 수 있도록 지도한다.","k":"2015|국어|3~4학년|읽기|1","r":"3~4학년","gr":1},{"c":"4국02-04","y":"2015","s":"국어","g":"3~4학년","a":"읽기","t":"글을 읽고 사실과 의견을 구별한다.","e":"이 성취기준은 사실과 의견을 구별하고 이를 바탕으로 하여 글의 내용을 평가하며 읽는 능력을 기르기 위해 설정하였다. 사실과 의견 구별하기를 지도할 때에는 ‘∼라고 생각한다.’, ‘\\~해야 한다.’와 같이 문장 표현을 중심으로 사실과 의견을 구분하는 데서 더 나아가, 실제 있었던 일이나 이미 알려진 지식 등을 토대로 사실과 의견을 구별하여 판단할 수 있도록 지도한다.","k":"2015|국어|3~4학년|읽기|1","r":"3~4학년","gr":1},{"c":"4국02-05","y":"2015","s":"국어","g":"3~4학년","a":"읽기","t":"읽기 경험과 느낌을 다른 사람과 나누는 태도를 지닌다.","e":"","k":"2015|국어|3~4학년|읽기|1","r":"3~4학년","gr":1},{"c":"4국03-01","y":"2015","s":"국어","g":"3~4학년","a":"쓰기","t":"중심 문장과 뒷받침 문장을 갖추어 문단을 쓴다.","e":"","k":"2015|국어|3~4학년|쓰기|1","r":"3~4학년","gr":1},{"c":"4국03-02","y":"2015","s":"국어","g":"3~4학년","a":"쓰기","t":"시간의 흐름에 따라 사건이나 행동이 드러나게 글을 쓴다.","e":"","k":"2015|국어|3~4학년|쓰기|1","r":"3~4학년","gr":1},{"c":"4국03-03","y":"2015","s":"국어","g":"3~4학년","a":"쓰기","t":"관심 있는 주제에 대해 자신의 의견이 드러나게 글을 쓴다.","e":"이 성취기준은 어떤 대상이나 사실에 대해 자신의 의견을 밝히는 글을 쓰는 과정에서 생각을 구체화·명료화·정교화하여 제시하는 능력을 기르기 위해 설정하였다. 주변 현상에 대해 관심 갖기의 중요성을 일깨우고, 주장이 무엇이고 주장을 할 때에는 어떤 점에 주의해야 하는지를 기초적인 수준에서 다루도록 한다. 그리고 주장을 뒷받침하는 근거를 들어 자신의 의견이 뚜렷하게 드러나는 주장하는 글을 쓰게 한다.","k":"2015|국어|3~4학년|쓰기|1","r":"3~4학년","gr":1},{"c":"4국03-04","y":"2015","s":"국어","g":"3~4학년","a":"쓰기","t":"읽는 이를 고려하며 자신의 마음을 표현하는 글을 쓴다.","e":"이 성취기준은 읽는 이의 흥미나 관심, 입장, 반응 등을 고려하여 글을 쓰는 자세를 기르기 위해 설정하였다. 글은 글쓴이와 읽는 이가 만나는 공간이다. 글을 통해 다른 사람과 소통하려면 읽는 이의 흥미나 관심, 입장, 반응 등을 고려하여 글을 써야 한다. 친구, 부모님, 선생님, 이웃 등 주위 사람을 대상으로 하여 고마움, 미안함, 기쁨, 슬픔, 사랑, 우정, 고민 등 자신의 정서와 감정을 표현하는 글을 쓰는 경험을 통해 읽는 이를 고려하여 쓸 내용을 마련하거나 적절한 표현을 할 수 있는 능력을 기르도록 한다.","k":"2015|국어|3~4학년|쓰기|1","r":"3~4학년","gr":1},{"c":"4국03-05","y":"2015","s":"국어","g":"3~4학년","a":"쓰기","t":"쓰기에 자신감을 갖고 자신의 글을 적극적으로 나누는 태도를 지닌다.","e":"","k":"2015|국어|3~4학년|쓰기|1","r":"3~4학년","gr":1},{"c":"4국04-01","y":"2015","s":"국어","g":"3~4학년","a":"문법","t":"낱말을 분류하고 국어사전에서 찾는다.","e":"이 성취기준은 낱말 분류에 대한 기초적인 지식을 바탕으로 하여 국어사전에서 낱말을 정확하게 찾는 능력을 기르기 위해 설정하였다. 형태(모양)나 의미 등을 생각하면서 여러 가지 낱말을 분류해 보는 활동을 통해 주요 품사(명사, 동사, 형용사)를 변별할 수 있도록 한다. 이를 통해 낱말의 기본형을 이해하고 국어사전에서 낱말을 찾는 방법을 지도한다.","k":"2015|국어|3~4학년|문법|1","r":"3~4학년","gr":1},{"c":"4국04-02","y":"2015","s":"국어","g":"3~4학년","a":"문법","t":"낱말과 낱말의 의미 관계를 파악한다.","e":"이 성취기준은 낱말들이 의미 관계를 가지고 있음을 알고 어휘에 대한 관심과 호기심을 갖도록 하기 위해 설정하였다. 비슷한 말, 반대말, 상·하위어에 중점을 두어 낱말 간의 의미 관계를 지도하고, 연상 활동이나 말놀이를 통해 다양한 어휘를 익힐 수 있게 한다. 그리고 비슷한 말, 반대말, 상·하위어 등을 여러 상황에서 활용해 봄으로써 어휘력을 신장하도록 한다.","k":"2015|국어|3~4학년|문법|1","r":"3~4학년","gr":1},{"c":"4국04-03","y":"2015","s":"국어","g":"3~4학년","a":"문법","t":"기본적인 문장의 짜임을 이해하고 사용한다.","e":"이 성취기준은 기본적인 문장의 짜임을 익히고 이에 따라 문장을 만드는 능력을 기르기 위해 설정하였다. 문장은 기본적으로 동작이나 상태의 주체를 나타내는 부분(주어부)과 주체에 대해 서술하는 부분(서술어부)으로 나눌 수 있다. 주어부와 서술어부의 역할을 이해하고 정확하게 문장을 사용하도록 한다. 단, 주어나 서술어와 같은 문장 성분은 다루지 않는다.","k":"2015|국어|3~4학년|문법|1","r":"3~4학년","gr":1},{"c":"4국04-04","y":"2015","s":"국어","g":"3~4학년","a":"문법","t":"높임법을 알고 언어 예절에 맞게 사용한다.","e":"","k":"2015|국어|3~4학년|문법|1","r":"3~4학년","gr":1},{"c":"4국04-05","y":"2015","s":"국어","g":"3~4학년","a":"문법","t":"한글을 소중히 여기는 태도를 지닌다.","e":"이 성취기준은 한글의 소중함과 제자 원리에 대한 기초적인 이해를 바탕으로 하여 한글을 바르게 사용하고 가꾸려는 태도를 기르기 위해 설정하였다. 한글이 어떤 점에서 우리에게 소중한 의미를 갖고 있는지, 어떤 면에서 독창적이고 과학적인지 등을 탐구함으로써 한글의 우수성과 독창성을 알고 한글을 사랑하는 마음을 가질 수 있게 한다.","k":"2015|국어|3~4학년|문법|1","r":"3~4학년","gr":1},{"c":"4국05-01","y":"2015","s":"국어","g":"3~4학년","a":"문학","t":"시각이나 청각 등 감각적 표현에 주목하며 작품을 감상한다.","e":"이 성취기준은 언어가 인간의 오감을 자극하며, 이에 따라 구체적인 이미지를 형성하고 정서를 환기하는 기능이 있다는 점을 이해하며 문학 활동을 하도록 하기 위해 설정하였다. 문학, 특히 시에서 시각적 이미지나 청각적 이미지를 중심으로 감각을 환기하는 문학적 표현의 기능에 대해 알고 시적 언어의 용법을 이해하는 데 중점을 두었다. 의성어와 의태어, 비유적 표현을 비롯한 여러 가지 시어의 감각 환기 기능을 통해 인간의 오감을 자극하는 시적 표현의 재미를 느끼도록 한다.","k":"2015|국어|3~4학년|문학|1","r":"3~4학년","gr":1},{"c":"4국05-02","y":"2015","s":"국어","g":"3~4학년","a":"문학","t":"인물, 사건, 배경에 주목하며 작품을 이해한다.","e":"이 성취기준은 서사 갈래나 극 갈래의 작품을 수용할 때 인물, 사건, 배경이라는 핵심적인 요소를 중심으로 이야기를 이해하는 능력을 기르기 위해 설정하였다. 서사 갈래와 극 갈래가 인물, 사건, 배경으로 구성된다는 점을 바탕으로 하여 옛이야기, 창작 동화, 아동극, 애니메이션 등에서 인물과 사건의 관계, 사건과 배경의 관계 등을 파악하는 데 중점을 두도록 한다. 육하원칙을 적용하면 인물은 ‘누가’에, 사건은 ‘무엇을, 왜, 어떻게’에, 배경은 ‘언제, 어디서’에 해당된다는 점을 이해하도록 한다.","k":"2015|국어|3~4학년|문학|1","r":"3~4학년","gr":1},{"c":"4국05-03","y":"2015","s":"국어","g":"3~4학년","a":"문학","t":"이야기의 흐름을 파악하여 이어질 내용을 상상하고 표현한다.","e":"","k":"2015|국어|3~4학년|문학|1","r":"3~4학년","gr":1},{"c":"4국05-04","y":"2015","s":"국어","g":"3~4학년","a":"문학","t":"작품을 듣거나 읽거나 보고 떠오른 느낌과 생각을 다양하게 표현한다.","e":"","k":"2015|국어|3~4학년|문학|1","r":"3~4학년","gr":1},{"c":"4국05-05","y":"2015","s":"국어","g":"3~4학년","a":"문학","t":"재미나 감동을 느끼며 작품을 즐겨 감상하는 태도를 지닌다.","e":"","k":"2015|국어|3~4학년|문학|1","r":"3~4학년","gr":1},{"c":"6국01-01","y":"2015","s":"국어","g":"5~6학년","a":"듣기·말하기","t":"구어 의사소통의 특성을 바탕으로 하여 듣기·말하기 활동을 한다.","e":"이 성취기준은 문어 의사소통과 구분되는 구어 의사소통으로서 듣기·말하기의 특성을 이해하고 듣기·말하기를 하는 능력을 갖추기 위해 설정하였다. 구어 의사소통은 화자와 청자가 언어적·준언어적·비언어적 표현을 통해서 쌍방향적으로 소통하며 의미를 구성하는 과정인데, 순간적이고 일회적이므로 신중함과 주의 집중이 요구된다. 구어 의사소통에서 말하기와 듣기는 순차적으로 이루어지는 것이라기보다 동시적으로 이루어지며 의사소통에 참여하는 사람들이 서로 의논하고 절충하며 의미를 재구성하게 된다. 구어 의사소통은 상대방과 더불어 소통하면서 서로 관계를 형성하고 유지하며 발전시키는 데도 중요한 역할을 한다. 듣기·말하기 활동 시 이와 같은 구어 의사소통의 특성을 고려하도록 한다.","k":"2015|국어|5~6학년|듣기·말하기|1","r":"5~6학년","gr":1},{"c":"6국01-02","y":"2015","s":"국어","g":"5~6학년","a":"듣기·말하기","t":"의견을 제시하고 함께 조정하며 토의한다.","e":"","k":"2015|국어|5~6학년|듣기·말하기|1","r":"5~6학년","gr":1},{"c":"6국01-03","y":"2015","s":"국어","g":"5~6학년","a":"듣기·말하기","t":"절차와 규칙을 지키고 근거를 제시하며 토론한다.","e":"이 성취기준은 토론의 일반적 절차와 규칙에 대한 이해를 바탕으로 하여 토론에서 타당한 근거를 들며 논리적으로 주장을 펼치는 능력을 기르기 위해 설정하였다. 토론의 구성원은 사회자, 토론자, 판정관, 청중이며, 토론자는 찬성 측과 반대 측으로 나누어 논제에 대한 자신의 주장을 펼친다. 이때 토론의 단계와 정해진 시간을 지키고 타당한 근거를 들어 주장하며 토론에 참여하도록 하는 데 중점을 둔다.","k":"2015|국어|5~6학년|듣기·말하기|1","r":"5~6학년","gr":1},{"c":"6국01-04","y":"2015","s":"국어","g":"5~6학년","a":"듣기·말하기","t":"자료를 정리하여 말할 내용을 체계적으로 구성한다.","e":"","k":"2015|국어|5~6학년|듣기·말하기|1","r":"5~6학년","gr":1},{"c":"6국01-05","y":"2015","s":"국어","g":"5~6학년","a":"듣기·말하기","t":"매체 자료를 활용하여 내용을 효과적으로 발표한다.","e":"이 성취기준은 매체의 특성에 따라 그림, 표, 그래프, 사진, 동영상 등 말할 내용을 구체적으로 형상화하거나 요약적으로 보여 주는 자료를 보조 자료로 활용하여 발표하는 능력을 기르기 위해 설정하였다. 화자의 생각을 형상화한 매체 자료를 보조 자료로 활용하면 청자의 흥미를 유발하고 정보를 효과적으로 전달할 수 있으며 설득력을 높일 수 있다. 말하기의 목적과 대상, 말할 내용의 특성에 알맞은 매체와 매체 자료를 활용하여 발표 내용을 구성하고 발표를 해 보도록 한다.","k":"2015|국어|5~6학년|듣기·말하기|1","r":"5~6학년","gr":1},{"c":"6국01-06","y":"2015","s":"국어","g":"5~6학년","a":"듣기·말하기","t":"드러나지 않거나 생략된 내용을 추론하며 듣는다.","e":"","k":"2015|국어|5~6학년|듣기·말하기|1","r":"5~6학년","gr":1},{"c":"6국01-07","y":"2015","s":"국어","g":"5~6학년","a":"듣기·말하기","t":"상대가 처한 상황을 이해하고 공감하며 듣는 태도를 지닌다.","e":"","k":"2015|국어|5~6학년|듣기·말하기|1","r":"5~6학년","gr":1},{"c":"6국02-01","y":"2015","s":"국어","g":"5~6학년","a":"읽기","t":"읽기는 배경지식을 활용하여 의미를 구성하는 과정임을 이해하고 글을 읽는다.","e":"","k":"2015|국어|5~6학년|읽기|1","r":"5~6학년","gr":1},{"c":"6국02-02","y":"2015","s":"국어","g":"5~6학년","a":"읽기","t":"글의 구조를 고려하여 글 전체의 내용을 요약한다.","e":"이 성취기준은 읽은 내용을 글의 구조를 고려하여 자신의 언어로 요약하는 능력을 기르기 위해 설정하였다. 요약하기는 단순히 글의 분량을 줄이는 것이 아니라, 주요 내용을 뽑아 이를 중심으로 간추려 정리하는 것이다. 이때 ‘머리말-본문-맺음말’, ‘서론-본론-결론’, ‘발단-전개-위기-절정-결말’ 등 글의 형식상 구조를 고려하여 요약하는 것이 적절하다. 이 성취기준에서는 한 편의 글을 요약하는 것은 물론, 다양한 매체에서 타 교과 학습과 관련된 글을 찾아 읽고 이를 요약하는 활동을 함으로써 다른 교과의 읽기 활동도 자연스럽게 다루도록 한다.","k":"2015|국어|5~6학년|읽기|1","r":"5~6학년","gr":1},{"c":"6국02-03","y":"2015","s":"국어","g":"5~6학년","a":"읽기","t":"글을 읽고 글쓴이가 말하고자 하는 주장이나 주제를 파악한다.","e":"","k":"2015|국어|5~6학년|읽기|1","r":"5~6학년","gr":1},{"c":"6국02-04","y":"2015","s":"국어","g":"5~6학년","a":"읽기","t":"글을 읽고 내용의 타당성과 표현의 적절성을 판단한다.","e":"","k":"2015|국어|5~6학년|읽기|1","r":"5~6학년","gr":1},{"c":"6국02-05","y":"2015","s":"국어","g":"5~6학년","a":"읽기","t":"매체에 따른 다양한 읽기 방법을 이해하고 적절하게 적용하며 읽는다.","e":"이 성취기준은 매체의 유형을 고려하여 적절한 읽기 방법을 선택하고 효과적으로 읽는 능력을 기르기 위해 설정하였다. 예컨대, 애니메이션이나 영화와 같은 매체 자료는 인물의 표정이나 몸짓, 목소리의 변화, 음악 등이 내용을 파악하는 데 중요한 요소가 되며, 인터넷에 실린 기사문을 읽을 때에는 글을 읽는 것은 물론 사진, 동영상 등도 함께 이해해야 하는 경우가 많고, 경우에 따라서는 댓글도 내용을 파악하는 데 중요한 요소가 된다. 이 성취기준에서는 문자뿐 아니라 그림, 표, 그래프, 사진, 동영상 등의 매체가 내용을 전달하는 데 중요한 역할을 한다는 것을 알고, 이러한 매체의 유형에 따라 내용을 어떻게 파악하는 것이 효과적인지를 생각하여, 그에 맞는 적절한 읽기 방법을 찾아 적용하며 읽도록 하는 데 중점을 둔다.","k":"2015|국어|5~6학년|읽기|1","r":"5~6학년","gr":1},{"c":"6국02-06","y":"2015","s":"국어","g":"5~6학년","a":"읽기","t":"자신의 읽기 습관을 점검하며 스스로 글을 찾아 읽는 태도를 지닌다.","e":"","k":"2015|국어|5~6학년|읽기|1","r":"5~6학년","gr":1},{"c":"6국03-01","y":"2015","s":"국어","g":"5~6학년","a":"쓰기","t":"쓰기는 절차에 따라 의미를 구성하고 표현하는 과정임을 이해하고 글을 쓴다.","e":"","k":"2015|국어|5~6학년|쓰기|1","r":"5~6학년","gr":1},{"c":"6국03-02","y":"2015","s":"국어","g":"5~6학년","a":"쓰기","t":"목적이나 주제에 따라 알맞은 내용과 매체를 선정하여 글을 쓴다.","e":"이 성취기준은 글을 쓰기 전에 글을 쓰는 목적, 주제 등과 관련된 문제를 탐색하고 쓰는 자세를 기르기 위해 설정하였다. 글의 목적, 주제 등을 고려하는 것은 글의 내용을 마련하는 과정에 영향을 미친다. 글을 쓸 때 글의 목적이나 주제를 고려해야 하는 이유를 이해하고, 글의 목적이나 주제를 정한 다음 그것에 따라 내용을 생성하고 선정하는 방법을 익힌 후 글을 쓸 수 있도록 한다. 또한 글의 목적이나 주제에 따라 선정할 수 있는 매체가 달라질 수 있음을 이해하도록 한다. 예컨대 친교를 목적으로 글을 쓸 때에는 편지나 전자 우편을 이용할 수 있고, 단체에 정보를 제공할 때에는 인터넷 게시판을 이용할 수 있으며, 간단한 정보를 전달할 때에는 문자 메시지를 이용할 수도 있다.","k":"2015|국어|5~6학년|쓰기|1","r":"5~6학년","gr":1},{"c":"6국03-03","y":"2015","s":"국어","g":"5~6학년","a":"쓰기","t":"목적이나 대상에 따라 알맞은 형식과 자료를 사용하여 설명하는 글을 쓴다.","e":"","k":"2015|국어|5~6학년|쓰기|1","r":"5~6학년","gr":1},{"c":"6국03-04","y":"2015","s":"국어","g":"5~6학년","a":"쓰기","t":"적절한 근거와 알맞은 표현을 사용하여 주장하는 글을 쓴다.","e":"이 성취기준은 주장하는 글 쓰기의 능력을 기르기 위해 설정하였다. 주장하는 글 쓰기의 중요성과 특성, 주장하는 글의 조직 방식, 주장하는 글의 특징에 따른 표현 방법에 대해 학습하게 한다. 특히 주장과 근거의 개념, 주장과 근거의 관계 등을 알고 이를 적절히 활용할 수 있게 한다. 그리고 주장하는 글을 쓸 때 알맞은 표현에 관심을 갖게 하며 특히 주관적 표현이나 단정적인 표현, 모호한 표현 등을 사용하지 않도록 한다.","k":"2015|국어|5~6학년|쓰기|1","r":"5~6학년","gr":1},{"c":"6국03-05","y":"2015","s":"국어","g":"5~6학년","a":"쓰기","t":"체험한 일에 대한 감상이 드러나게 글을 쓴다.","e":"","k":"2015|국어|5~6학년|쓰기|1","r":"5~6학년","gr":1},{"c":"6국03-06","y":"2015","s":"국어","g":"5~6학년","a":"쓰기","t":"독자를 존중하고 배려하며 글을 쓰는 태도를 지닌다.","e":"이 성취기준은 읽는 이를 존중하고 배려하며 글을 쓰는 자세를 기르기 위해 설정하였다. 편지나 문자 메시지를 받고 감동했던 경험, 불쾌했던 경험에 대해 이야기해 보고, 또래나 자신의 주변 사람을 정하고 그 사람의 상황과 처지를 이해하여 적절하게 조언하는 글을 쓰게 한다. 격식에 맞지 않는 표현이나 속어, 비어 등 부정적인 표현이 드러난 글을 제시하여 적절하게 고쳐 써 볼 수도 있다. 긍정적인 언어 표현의 효과에 대해 이해하고, 타인에게 상처를 주는 언어 표현에 대해 비판할 줄 알며 타인을 존중하고 배려하며 글을 쓰는 태도를 기르는 데 중점을 두도록 한다.","k":"2015|국어|5~6학년|쓰기|1","r":"5~6학년","gr":1},{"c":"6국04-01","y":"2015","s":"국어","g":"5~6학년","a":"문법","t":"언어는 생각을 표현하며 다른 사람과 관계를 맺는 수단임을 이해하고 국어생활을 한다.","e":"이 성취기준은 언어가 자신의 느낌을 표현하는 수단이자 인간관계 형성의 수단임을 알고 국어 활동을 하는 자세를 기르기 위해 설정하였다. 언어의 기능에는 지시적·정보적·친교적·정서적·명령적 기능이 있는데, 언어가 대상과 상황 맥락에 따라 다양하게 표현되어 인간관계 형성에 중요한 영향을 미친다는 것을 이해하게 하는 데 중점을 둔다.","k":"2015|국어|5~6학년|문법|1","r":"5~6학년","gr":1},{"c":"6국04-02","y":"2015","s":"국어","g":"5~6학년","a":"문법","t":"국어의 낱말 확장 방법을 탐구하고 어휘력을 높이는 데에 적용한다.","e":"이 성취기준은 낱말의 확장 방법(합성, 파생)을 이해하고 이를 바탕으로 하여 낱말의 의미를 정확하게 파악함으로써 다양한 언어 사용 상황에서 적절하게 활용하는 능력을 기르기 위해 설정하였다. 우리가 접하는 낱말들은 다양한 낱말 확장 방법에 의해 만들어졌음을 탐구 활동을 통하여 이해하도록 한다. 또한 여러 가지 확장 방법을 통해 만들어진 낱말의 의미를 추론하고 의사소통 상황에서 적절하게 사용할 수 있도록 한다.","k":"2015|국어|5~6학년|문법|1","r":"5~6학년","gr":1},{"c":"6국04-03","y":"2015","s":"국어","g":"5~6학년","a":"문법","t":"낱말이 상황에 따라 다양하게 해석됨을 탐구한다.","e":"이 성취기준은 상황에 따라 낱말이 다양하게 해석될 수 있음을 알고 상황에 따라 낱말의 구체적인 의미를 파악하는 능력을 기르기 위해 설정하였다. 낱말의 의미는 의사소통 상황의 구체적인 맥락이나 문맥에 따라 달라질 수 있다. 소리는 같고 뜻은 다른 낱말이나 다양한 의미를 갖는 낱말을 주요 학습 대상으로 하며, 낱말들의 의미가 어떻게 다른지를 다양한 사례를 통해 탐구하도록 한다.","k":"2015|국어|5~6학년|문법|1","r":"5~6학년","gr":1},{"c":"6국04-04","y":"2015","s":"국어","g":"5~6학년","a":"문법","t":"관용 표현을 이해하고 적절하게 활용한다.","e":"","k":"2015|국어|5~6학년|문법|1","r":"5~6학년","gr":1},{"c":"6국04-05","y":"2015","s":"국어","g":"5~6학년","a":"문법","t":"국어의 문장 성분을 이해하고 호응 관계가 올바른 문장을 구성한다.","e":"","k":"2015|국어|5~6학년|문법|1","r":"5~6학년","gr":1},{"c":"6국04-06","y":"2015","s":"국어","g":"5~6학년","a":"문법","t":"일상생활에서 국어를 바르게 사용하는 태도를 지닌다.","e":"","k":"2015|국어|5~6학년|문법|1","r":"5~6학년","gr":1},{"c":"6국05-01","y":"2015","s":"국어","g":"5~6학년","a":"문학","t":"문학은 가치 있는 내용을 언어로 표현하여 아름다움을 느끼게 하는 활동임을 이해하고 문학 활동을 한다.","e":"이 성취기준은 문학이 가치 있는 내용을 언어로 표현하여 아름다움을 느끼게 하는 언어 활동의 일환이라는 점을 이해하고 문학 활동을 하는 자세를 기르기 위해 설정하였다. 문학 작품의 아름다움은 가치 있는 내용에서도, 언어 표현의 참신성이나 함축성에서도 생성된다는 점을 이해하는 데 중점을 둔다. 작품의 내용과 표현을 꼼꼼하게 분석하기보다는 내용과 표현의 아름다움을 느끼며 문학을 즐기는 수준의 활동이 되도록 한다.","k":"2015|국어|5~6학년|문학|1","r":"5~6학년","gr":1},{"c":"6국05-02","y":"2015","s":"국어","g":"5~6학년","a":"문학","t":"작품 속 세계와 현실 세계를 비교하며 작품을 감상한다.","e":"이 성취기준은 작품 속의 인물·정서·상황·배경·분위기 등이 현실 세계를 반영한 것이지만, 작품 속 세계는 허구적 세계여서 현실 세계와는 구별된다는 점을 인식하며 문학 활동을 하는 능력을 기르기 위해 설정하였다. 시와 이야기, 생활문 등 갈래에 따라 차이는 있지만, 문학 작품 속의 세계가 현실에 바탕을 두면서도 현실 세계를 있는 그대로 묘사한 것이 아니라 허구적으로 구성된 것이라는 점에 초점을 맞추어 문학적 상상력을 동원하여 감상하도록 하는 데 중점을 둔다.","k":"2015|국어|5~6학년|문학|1","r":"5~6학년","gr":1},{"c":"6국05-03","y":"2015","s":"국어","g":"5~6학년","a":"문학","t":"비유적 표현의 특성과 효과를 살려 생각과 느낌을 다양하게 표현한다.","e":"","k":"2015|국어|5~6학년|문학|1","r":"5~6학년","gr":1},{"c":"6국05-04","y":"2015","s":"국어","g":"5~6학년","a":"문학","t":"일상생활의 경험을 이야기나 극의 형식으로 표현한다.","e":"이 성취기준은 이야기와 극 만들기 활동을 통해 이야기와 극의 기본적인 원리를 이해하는 한편, 이를 다른 교과의 학습을 위한 도구로 활용하는 능력을 기르기 위해 설정하였다. 이야기와 극은 문학의 주요한 갈래로서 그 자체로 교수·학습의 주요한 내용이기도 하지만, 모든 교과에서 교수·학습 활동을 위한 도구로 활용될 수도 있다. 일상생활의 경험 중 즐겁거나 감동을 받았던 일, 슬프거나 속상했던 일, 부끄럽거나 후회스러웠던 일 등을 내용으로 삼아 이를 이야기나 극의 형식으로 표현하도록 한다.","k":"2015|국어|5~6학년|문학|1","r":"5~6학년","gr":1},{"c":"6국05-05","y":"2015","s":"국어","g":"5~6학년","a":"문학","t":"작품에 대한 이해와 감상을 바탕으로 하여 다른 사람과 적극적으로 소통한다.","e":"","k":"2015|국어|5~6학년|문학|1","r":"5~6학년","gr":1},{"c":"6국05-06","y":"2015","s":"국어","g":"5~6학년","a":"문학","t":"작품에서 얻은 깨달음을 바탕으로 하여 바람직한 삶의 가치를 내면화하는 태도를 지닌다.","e":"","k":"2015|국어|5~6학년|문학|1","r":"5~6학년","gr":1},{"c":"4도01-01","y":"2015","s":"도덕","g":"3~4학년","a":"자신과의 관계","t":"도덕 시간에 무엇을 배우며 도덕 공부가 왜 필요한지를 알고 공부하는 사람으로서 지켜야 할 규칙을 모범 사례를 통해 습관화한다. ①도덕 시간에 배우는 것은 무엇이며, 도덕 공부는 왜 필요할까? ②자신의 공부 습관에서 반성할 점은 무엇이며, 도덕공부를 위해 바람직한 태도와 방법은 무엇일까?","e":"","k":"2015|도덕|3~4학년|자신과의 관계|1","r":"3~4학년","gr":1},{"c":"4도01-02","y":"2015","s":"도덕","g":"3~4학년","a":"자신과의 관계","t":"시간과 물건의 소중함을 알고 자신이 시간과 물건을 아껴 쓰고 있는지 반성해 보며 그 모범 사례를 따라 습관화한다. ①시간과 물건을 아끼는 것의 중요성을 알고 이를 생활 속에서 실천하고 있는가? ②시간과 물건을 아껴 쓰는 방법은 무엇이고 이를 어떻게 실천할 수 있을까?","e":"","k":"2015|도덕|3~4학년|자신과의 관계|1","r":"3~4학년","gr":1},{"c":"4도01-03","y":"2015","s":"도덕","g":"3~4학년","a":"자신과의 관계","t":"최선을 다하는 삶을 위해 정성과 인내가 필요한 이유를 탐구하고 생활 계획을 세워본다. ①최선을 다하는 삶은 어떤 모습이고, 이를 위해 인내와 정성이 필요한 이유는 무엇일까? ②최선을 다하는 삶의 방법은 무엇이고 이를 어떻게 실천할 수 있을까?","e":"","k":"2015|도덕|3~4학년|자신과의 관계|1","r":"3~4학년","gr":1},{"c":"4도02-01","y":"2015","s":"도덕","g":"3~4학년","a":"타인과의 관계","t":"가족을 사랑하고 감사해야 하는 이유를 찾아보고, 가족 간에 지켜 야 할 도리와 해야 할 일을 약속으로 정해 실천한다. ①현대 사회에서의 가족의 모습은 어떠하며, 가족 간에 사랑하고 감사해야 하는 이유는 무엇일까? ②가족 간에 지켜야 할 도리와 내가 해야 할 일은 무엇이며, 어떻게 그 실천 의지를 기를까?","e":"","k":"2015|도덕|3~4학년|타인과의 관계|1","r":"3~4학년","gr":1},{"c":"4도02-02","y":"2015","s":"도덕","g":"3~4학년","a":"타인과의 관계","t":"친구의 소중함을 알고 친구와 사이좋게 지내며, 서로의 입장을 이 해하고 인정한다. ①친구의 소중함은 무엇이며 친구 사이에 지켜야 할 예절에는 무엇이 있을까? ②친구 사이에서 발생할 수 있는 갈등은 무엇이며, 이를 적절하게 해결하는 방법은 무엇일까?","e":"","k":"2015|도덕|3~4학년|타인과의 관계|1","r":"3~4학년","gr":1},{"c":"4도02-03","y":"2015","s":"도덕","g":"3~4학년","a":"타인과의 관계","t":"예절의 중요성을 이해하고, 대상과 상황에 따른 예절이 다름을 탐 구하여 이를 습관화한다. ①예절을 지키는 것이 왜 중요하며 일상생활에서 지켜야 하는 예절에는 무엇이 있을까? ②대상과 상황에 따라 달라지는 예절은 무엇이며, 이를 어떻게 실천할 수 있을까?","e":"","k":"2015|도덕|3~4학년|타인과의 관계|1","r":"3~4학년","gr":1},{"c":"4도02-04","y":"2015","s":"도덕","g":"3~4학년","a":"타인과의 관계","t":"협동의 의미와 중요성을 알고, 경청·도덕적 대화하기·도덕적 민감성을 통해 협동할 수 있는 능력을 기른다. ①협동의 의미와 중요성은 무엇이며, 협동을 위해 어떤 자세와 태도가 필요할까? ②다양한 활동을 통해 알게 된 협동의 방법은 무엇이며, 이를 어떻게 실천할 수 있을까?","e":"","k":"2015|도덕|3~4학년|타인과의 관계|1","r":"3~4학년","gr":1},{"c":"4도03-01","y":"2015","s":"도덕","g":"3~4학년","a":"사회·공동체와의 관계","t":"공공장소에서 지켜야 할 규칙과 공익의 중요성을 알고, 공익에 기여하고자 하는 실천 의지를 기른다. ①공공장소에서 지켜야 할 다양한 규칙과 그것의 중요성은 무엇이며, 어떻게 습관화할 수 있을까? ②공익의 의미와 중요성은 무엇이며, 공익을 위해 어떻게 하면 책임감 있게 행동할 수 있을까?","e":"","k":"2015|도덕|3~4학년|사회·공동체와의 관계|1","r":"3~4학년","gr":1},{"c":"4도03-02","y":"2015","s":"도덕","g":"3~4학년","a":"사회·공동체와의 관계","t":"다문화 사회에서 다양성을 수용해야 하는 이유를 탐구하고, 올바른 의사 결정 과정을 통해 다른 사람과 문화를 공정하게 대하는 태도를 지닌다. ①다문화 사회에서 다양성을 수용해야 하는 이유는 무엇이며, 다른 사람과 문화에 대한 자신의 태도는 어떠한가? ②다문화 가정과 타문화를 공정하게 대하는 데 필요한 것은 무엇이며, 어떻게 하면 이에 대한 실천 의지를 기를 수 있을까?","e":"","k":"2015|도덕|3~4학년|사회·공동체와의 관계|1","r":"3~4학년","gr":1},{"c":"4도03-03","y":"2015","s":"도덕","g":"3~4학년","a":"사회·공동체와의 관계","t":"남북 분단 과정과 민족의 아픔을 통해 통일의 필요성을 알고, 통일에 대한 관심과 통일 의지를 기른다. ①통일의 의미와 필요성은 무엇이며, 통일을 위해 어떻게 하면 나라사랑을 위한 실천 의지를 기를 수 있을까? ②북한이탈주민을 배려하는 것이 왜 중요하며, 생활 속에서 어떻게 통일 의지를 기를 수 있을까?","e":"","k":"2015|도덕|3~4학년|사회·공동체와의 관계|1","r":"3~4학년","gr":1},{"c":"4도04-01","y":"2015","s":"도덕","g":"3~4학년","a":"자연·초월과의 관계","t":"생명의 소중함을 이해하고 인간 생명과 환경 문제에 관심을 가지며 인간 생명과 자연을 보호하려는 태도를 가진다. ①인간 생명이 소중한 이유는 무엇이고, 어떻게 하면 책임감 있게 인간 생명을 존중할 수 있을까? ②자연을 보호해야 하는 이유와 방법은 무엇이고, 어떻게 하면 자연과의 유대감을 가질 수 있을까?","e":"","k":"2015|도덕|3~4학년|자연·초월과의 관계|1","r":"3~4학년","gr":1},{"c":"4도04-02","y":"2015","s":"도덕","g":"3~4학년","a":"자연·초월과의 관계","t":"참된 아름다움을 올바르게 이해하고 느껴 생활 속에서 이를 실천한다. ①아름다움의 의미와 종류는 무엇이며, 참된 아름다움을 느끼고 아는 것이 왜 필요할까? ②참된 아름다움을 행하는 사람들의 모습은 어떠하며, 어떻게 심미적 감수성을 기를 수 있을까?","e":"이 성취기준은 참된 아름다움이 외면적 아름다움뿐만 아니라 내면적 아름다움과 도덕적 삶의 아름다움을 포함하는 것임을 알고, 아름다운 마음과 심미적 감수성을 기르도록 하기 위해 설정하였다.","k":"2015|도덕|3~4학년|자연·초월과의 관계|1","r":"3~4학년","gr":1},{"c":"6도01-01","y":"2015","s":"도덕","g":"5~6학년","a":"자신과의 관계","t":"감정과 욕구를 조절하지 못해 나타날 수 있는 결과를 도덕적으로 상상해 보고, 올바르게 자신의 감정을 조절하고 표현할 수 있는 방법을 습관화한다. ①다양한 감정과 욕구는 무엇이며, 이를 조절하고 적절하게 표현하는 것이 왜 중요할까? ②대상과 상황에 따라 어떻게 하면 자신의 감정과 욕구를 적절하게 조절하고 표현할 수 있을까?","e":"이 성취기준은 3~4학년군에서 시간과 물자를 아껴 쓰는 내용을 중심으로 욕구와 그것을 조율하는 절제를 다루던 것을 감정의 문제로 이어지도록 설정되었다. 발달 단계 상 초등학교 학생들의 욕구는 많은 부분 감정에 의존하여 표현된다. 그래서 감정이 표현되는 상황을 중심으로 옳은 것과 거기에 미치지 못하는 것들을 구분하면서 욕구에 대한 이해력을 기를 수 있게 성취기준을 구성하였다. 따라서 이 성취기준에서는 행위 결과의 옳고 그름을 판단하는 것은 물론이고 대상에 따라 자신이 표현한 감정이 적절한가를 점검하는 것도 주요한 학습 내용으로 다룬다.","k":"2015|도덕|5~6학년|자신과의 관계|1","r":"5~6학년","gr":1},{"c":"6도01-02","y":"2015","s":"도덕","g":"5~6학년","a":"자신과의 관계","t":"자주적인 삶을 위해 자신을 이해하고 존중하며 자주적인 삶의 의미와 중요성을 깨닫고 실천 방법을 익힌다. ①자주적인 삶의 의미와 중요성은 무엇이며, 일상생활에서 어떻게 하면 자신을 이해하고 존중할 수 있을까? ②자주적인 삶을 살아가기 위해 어떻게 하면 그 모범 사례에 따른 생활계획을 수립할 수 있을까?","e":"","k":"2015|도덕|5~6학년|자신과의 관계|1","r":"5~6학년","gr":1},{"c":"6도01-03","y":"2015","s":"도덕","g":"5~6학년","a":"자신과의 관계","t":"정직의 의미와 정직하게 살아가는 것의 중요성을 탐구하고, 정직과 관련된 갈등 상황에서 정직하게 판단하고 실천하는 방법을 익힌다. ①정직의 의미와 정직하게 살아가는 것이 중요한 이유는 무엇이며, 어떻게 하면 올바른 의사 결정을 할 수 있을까? ②정직하게 살아가는 데 필요한 것은 무엇이고, 어떻게 하면 유혹을 이겨낼 수 있을까?","e":"","k":"2015|도덕|5~6학년|자신과의 관계|1","r":"5~6학년","gr":1},{"c":"6도02-01","y":"2015","s":"도덕","g":"5~6학년","a":"타인과의 관계","t":"사이버 공간에서 발생하는 여러 문제에 대한 도덕적 민감성을 기르며, 사이버 공간에서 지켜야 할 예절과 법을 알고 습관화한다. ①사이버 공간에서 필요한 예절은 무엇이며, 어떻게 하면 이를 책임감 있게 행동할 수 있을까? ②저작권 침해, 사이버 폭력, 온라인 중독이 갖는 문제점은 무엇이며 이를 해결하기 위해 무엇을 해야 할까?","e":"이 성취기준은 사이버 공간에서 발생하는 문제점과 그 해결 방안을 탐구하여 학생 스스로 사이버 공간에서의 예절과 법을 실천하고 습관화하는 것을 주된 목적으로 한다. 더불어 사이버 공간에서도 타인의 권리를 존중하며 배려하는 예절을 생활화하여 건전한 사이버 문화를 만들 수 있도록 성취기준을 설정하였다.","k":"2015|도덕|5~6학년|타인과의 관계|1","r":"5~6학년","gr":1},{"c":"6도02-02","y":"2015","s":"도덕","g":"5~6학년","a":"타인과의 관계","t":"다양한 갈등을 평화적으로 해결하는 것의 중요성과 방법을 알고, 평화적으로 갈등을 해결하려는 의지를 기른다. ①다양한 갈등이 발생하는 이유는 무엇이며, 갈등을 해결하기 위한 공감 능력을 어떻게 기를 수 있을까? ②갈등을 평화적으로 해결하기 위해 경청, 도덕적 대화하기 능력을 어떻게 기를 수 있을까?","e":"","k":"2015|도덕|5~6학년|타인과의 관계|1","r":"5~6학년","gr":1},{"c":"6도02-03","y":"2015","s":"도덕","g":"5~6학년","a":"타인과의 관계","t":"봉사의 의미와 중요성을 알고, 주변 사람의 처지를 공감하여 도와주려는 실천 의지를 기른다. ①봉사의 의미와 중요성은 무엇이며, 자신이 할 수 있는 봉사 계획을 어떻게 수립할 수 있을까? ②봉사를 실천하는 데 필요한 태도는 무엇이고, 봉사의 모범 사례를 따라 어떻게 하면 책임감 있게 행동할 수 있을까?","e":"","k":"2015|도덕|5~6학년|타인과의 관계|1","r":"5~6학년","gr":1},{"c":"6도03-01","y":"2015","s":"도덕","g":"5~6학년","a":"사회·공동체와의 관계","t":"인권의 의미와 인권을 존중하는 삶의 중요성을 이해하고, 인권 존중의 방법을 익힌다. ①인권이란 무엇이고 인권을 존중하기 위해 타인의 입장을 이해하고 인정하는 것이 왜 필요할까? ②인권을 존중하고 보호할 수 있는 방법은 무엇이며, 인권 문제에 대해 어떻게 올바른 의사결정을 할 수 있을까?","e":"","k":"2015|도덕|5~6학년|사회·공동체와의 관계|1","r":"5~6학년","gr":1},{"c":"6도03-02","y":"2015","s":"도덕","g":"5~6학년","a":"사회·공동체와의 관계","t":"공정함의 의미와 공정한 사회의 필요성을 이해하고, 일상생활에서 공정하게 생활하려는 실천 의지를 기른다. ①공정함의 의미는 무엇이며, 공정한 사회를 이루기 위해 관점 채택 능력을 어떻게 기를 수 있을까? ②공정하게 살아가기 위한 태도와 능력은 무엇이고, 이를 생활 속에서 어떻게 책임감 있게 행동할 수 있을까?","e":"","k":"2015|도덕|5~6학년|사회·공동체와의 관계|1","r":"5~6학년","gr":1},{"c":"6도03-03","y":"2015","s":"도덕","g":"5~6학년","a":"사회·공동체와의 관계","t":"도덕적 상상하기를 통해 바람직한 통일의 올바른 과정을 탐구하고 통일을 이루려는 의지와 태도를 가진다. ①통일의 과정과 방법, 통일의 미래상은 무엇이며, 통일에 대한 도덕적 민감성을 어떻게 기를 수 있을까? ②통일 이후에 예상되는 문제점은 무엇이며, 바람직한 통일을 위해 민주시민으로서 자신이 할 수 있는 구체적인 방법에는 어떤 것이 있을까?","e":"학생들은 통일의 중요성을 알고 있음에도 불구하고 실제로 통일이 되는 것에는 무관심하거나 통일이 자신들의 삶과 동떨어진 것으로 여기는 경향이 매우 높다. 이에 분단으로 인한 고통을 공감하고 통일의 의미와 필요성을 이해하며 나아가 학생들이 나라 사랑의 올바른 방법을 익혀 통일 의지를 갖도록 성취기준을 설정하였다.","k":"2015|도덕|5~6학년|사회·공동체와의 관계|1","r":"5~6학년","gr":1},{"c":"6도03-04","y":"2015","s":"도덕","g":"5~6학년","a":"사회·공동체와의 관계","t":"세계화 시대에 인류가 겪고 있는 문제와 그 원인을 토론을 통해 알아보고, 이를 해결하고자 하는 의지를 가지고 실천한다. ①우리가 겪고 있는 다양한 지구촌 문제들은 무엇이며, 어떻게 하면 지구촌 문제에 대한 도덕적 민감성을 기를 수 있을까? ②지구촌 문제를 올바르게 해결하기 위한 방법은 무엇이며, 어떻게 하면 이 문제를 해결하기 위한 올바른 의사 결정을 할 수 있을까?","e":"","k":"2015|도덕|5~6학년|사회·공동체와의 관계|1","r":"5~6학년","gr":1},{"c":"6도04-01","y":"2015","s":"도덕","g":"5~6학년","a":"자연·초월과의 관계","t":"긍정적 태도의 의미와 중요성을 알고, 어려움을 극복하기 위한 긍정적 삶의 태도를 습관화한다. ①긍정적 태도의 의미와 중요성은 무엇이며, 어려움에 직면했을 때 어떻게 반성하고 마음을 다스릴 수 있을까? ②긍정적 태도를 기르기 위한 자세와 능력은 무엇이고, 이를 생활 속에서 어떻게 습관화할 수 있을까?","e":"","k":"2015|도덕|5~6학년|자연·초월과의 관계|1","r":"5~6학년","gr":1},{"c":"6도04-02","y":"2015","s":"도덕","g":"5~6학년","a":"자연·초월  특성을 알고, 올바른 시간 관리 방법을 탐색한 후 실생활에 적용한다.","e":"","k":"2015|실과|5~6학년|자원|1","r":"5~6학년","gr":1},{"c":"6실03-03","y":"2015","s":"실과","g":"5~6학년","a":"자원","t":"용돈 관리의 필요성을 알고 자신의 필요와 욕구를 고려한 합리적인 소비생활 방법을 탐색하여 실생활에 적용한다.","e":"자신의 용돈 관리 실태를 통하여 용돈 관리의 필요성을 알게 한다. 용돈은 제한된 자원임을 알아 필요와 욕구를 구별하여 소비할 수 있는 능력을 길러 준다. 또한, 생활 자원을 구매·사용·폐기할 때도 환경과 안전을 고려하는 합리적 소비가 필요함을 강조한다.","k":"2015|실과|5~6학년|자원|1","r":"5~6학년","gr":1},{"c":"6실03-04","y":"2015","s":"실과","g":"5~6학년","a":"자원","t":"쾌적한 생활공간 관리의 필요성을 환경과 관련지어 이해하고 올바른 관리 방법을 계획하여 실천한다.","e":"정리정돈과 청소, 쓰레기 분리수거, 재활용의 일련의 과정은 생활환경을 관리하는 것임을 알게 하고 이의 관리 방안을 계획하고 방법을 습득하여 실천할 수 있도록 지도한다. 이때, 생활환경 관리 및 올바른 실천이 환경 문제의 해결과 관련이 있음을 강조한다.","k":"2015|실과|5~6학년|자원|1","r":"5~6학년","gr":1},{"c":"6실03-05","y":"2015","s":"실과","g":"5~6학년","a":"자원","t":"가정일을 담당하고 있는 가족원들의 역할을 탐색하고, 가정생활에 미치는 영향을 이해한다.","e":"다양한 가정일의 종류와 특징을 파악하고 가정일의 의미와 중요성을 알게 한다. 가정일 수행이 가정생활에 미치는 영향을 살펴 가정일에 대한 가족원 모두의 역할과 책임을 강조한다.","k":"2015|실과|5~6학년|자원|1","r":"5~6학년","gr":1},{"c":"6실03-06","y":"2015","s":"실과","g":"5~6학년","a":"자원","t":"자신의 위치에서 할 수 있는 가정일을 찾아 계획하고 실천한다.","e":"","k":"2015|실과|5~6학년|자원|1","r":"5~6학년","gr":1},{"c":"6실04-01","y":"2015","s":"실과","g":"5~6학년","a":"기술","t":"가꾸기와 기르기의 의미를 이해하고 동식물 자원의 중요성을 설명한다.","e":"가꾸기와 기르기를 투입-과정-산출-되먹임의 생명 기술 시스템으로 이해하고 일상생활 속에서 동식물을 자원으로 활용한 사례를 살펴보는 활동을 통해 우리 생활에서 동식물 자원의 중요성을 강조한다.","k":"2015|실과|5~6학년|기술|1","r":"5~6학년","gr":1},{"c":"6실04-02","y":"2015","s":"실과","g":"5~6학년","a":"기술","t":"생활 속 식물을 활용 목적에 따라 분류하고, 가꾸기 활동을 실행한다.","e":"","k":"2015|실과|5~6학년|기술|1","r":"5~6학년","gr":1},{"c":"6실04-03","y":"2015","s":"실과","g":"5~6학년","a":"기술","t":"생활 속 동물을 활용 목적에 따라 분류하고, 돌보고 기르는 과정을 실행한다.","e":"","k":"2015|실과|5~6학년|기술|1","r":"5~6학년","gr":1},{"c":"6실04-04","y":"2015","s":"실과","g":"5~6학년","a":"기술","t":"수송과 수송 수단의 의미를 알고, 수송 수단의 기본 요소를 설명한다.","e":"","k":"2015|실과|5~6학년|기술|1","r":"5~6학년","gr":1},{"c":"6실04-05","y":"2015","s":"실과","g":"5~6학년","a":"기술","t":"다양한 재료를 활용하여 수송 수단을 구상하고, 제작한다.","e":"수송 수단의 제작은 다양한 재료를 활용하여 수송 수단의 기본 요소 중 구동장치, 조향장치, 제동장치 등 최소 한 가지 이상의 요소를 충족하는 수송 수단을 제작하여 봄으로써 수송수단의 중요성을 강조한다.","k":"2015|실과|5~6학년|기술|1","r":"5~6학년","gr":1},{"c":"6실04-06","y":"2015","s":"실과","g":"5~6학년","a":"기술","t":"자전거의 구성 요소와 안전하게 관리하는 방법을 알고 실천한다.","e":"","k":"2015|실과|5~6학년|기술|1","r":"5~6학년","gr":1},{"c":"6실04-07","y":"2015","s":"실과","g":"5~6학년","a":"기술","t":"소프트웨어가 적용된 사례를 찾아보고 우리 생활에 미치는 영향을 이해한다.","e":"컴퓨터에 사용된 소프트웨어 이외에도 휴대폰, 가전제품, 사물인터넷 제품까지 여러 상황에서 사용된 소프트웨어를 탐색해 보고 우리 생활에 미치는 영향을 이해한다.","k":"2015|실과|5~6학년|기술|1","r":"5~6학년","gr":1},{"c":"6실04-08","y":"2015","s":"실과","g":"5~6학년","a":"기술","t":"절차적 사고에 의한 문제 해결의 순서를 생각하고 적용한다.","e":"절차적 사고란 문제를 효율적으로 해결하기 위해 문제를 작은 단위로 나누고, 각각의 문제를 단계별로 처리하는 사고 과정으로, 일상생활 속의 사례들을 찾아보고 절차적 사고 과정을 문제 해결에 적용한다.","k":"2015|실과|5~6학년|기술|1","r":"5~6학년","gr":1},{"c":"6실04-09","y":"2015","s":"실과","g":"5~6학년","a":"기술","t":"프로그래밍 도구를 사용하여 기초적인 프로그래밍 과정을 체험한다.","e":"블록 기반의 교육용 프로그래밍 도구를 활용하여 기초적인 프로그래밍 과정을 체험하고 자신만의 간단한 프로그램을 만들어 본다.","k":"2015|실과|5~6학년|기술|1","r":"5~6학년","gr":1},{"c":"6실04-10","y":"2015","s":"실과","g":"5~6학년","a":"기술","t":"자료를 입력하고 필요한 처리를 수행한 후 결과를 출력하는 단순한 프로그램을 설계한다.","e":"수치 값을 입력하여 덧셈이나 뺄셈의 결과를 출력하거나, 복수의 문자열을 입력 하여 두 문자열을 서로 연결한 결과를 출력하는 프로그램을 만들어 봄으로써, 소프트웨어의 입력, 처리, 출력 과정을 이해한다.","k":"2015|실과|5~6학년|기술|1","r":"5~6학년","gr":1},{"c":"6실04-11","y":"2015","s":"실과","g":"5~6학년","a":"기술","t":"문제를 해결하는 프로그램을 만드는 과정에서 순차, 선택, 반복 등의 구조를 이해한다.","e":"‘순차’는 명령문을 위에서 아래로 하나씩 순차적으로 수행하는 과정이며, ‘선택’은 주어진 조건에 따라 명령문을 선택적으로 수행하는 과정이다. ‘반복’은 명령문을 특정 횟수만큼 반복하거나, 주어진 조건이 만족할 때까지 반복하는 과정이다. 일상의 문제를 해결하는 프로그램을 만드는 기초 과정을 통해 위 프로그램의 3가지 구조를 이해한다.","k":"2015|실과|5~6학년|기술|1","r":"5~6학년","gr":1},{"c":"6실05-01","y":"2015","s":"실과","g":"5~6학년","a":"기술","t":"일과 직업의 의미와 중요성을 이해한다.","e":"","k":"2015|실과|5~6학년|기술|1","r":"5~6학년","gr":1},{"c":"6실05-02","y":"2015","s":"실과","g":"5~6학년","a":"기술","t":"나를 이해하고 적성, 흥미, 성격에 맞는 직업을 탐색한다.","e":"성격, 적성, 흥미 등 자신의 특성을 이해하고 다양한 직업을 알아보고 자신에게 맞는 직업을 탐색하게 하여 직업의 중요성을 강조한다.","k":"2015|실과|5~6학년|기술|1","r":"5~6학년","gr":1},{"c":"6실05-03","y":"2015","s":"실과","g":"5~6학년","a"  듣고 의미를 이해할 수 있다.","e":"쉽고 친숙한 표현을 듣고 의미를 이해할 수 있다.’는 인사하기, 안부 묻고 답하기, 질문하고 답하기 등 일상생활에서 가장 기본적으로 수행해야 하는 관용적인 표현을 상황과 함께 반복하여 듣고 자연스럽게 익히는 수준을 말한다.","k":"2015|영어|3~4학년|듣기|1","r":"3~4학년","gr":1},{"c":"4영01-05","y":"2015","s":"영어","g":"3~4학년","a":"듣기","t":"한두 문장의 쉽고 간단한 지시나 설명을 듣고 이해할 수 있다.","e":"","k":"2015|영어|3~4학년|듣기|1","r":"3~4학년","gr":1},{"c":"4영01-06","y":"2015","s":"영어","g":"3~4학년","a":"듣기","t":"주변의 사물과 사람에 관한 쉽고 간단한 말이나 대화를 듣고 세부 정보를 파악할 수 있다.","e":"주변의 사물과 사람에 관한 쉽고 간단한 말이나 대화를 듣고 세부 정보를 파악할 수 있다.’는 주변의 사물과 사람에 관한 친숙한 내용이 담긴 말이나 대화를 듣고, 주변 사물과 사람에 관한 모양, 크기, 개수, 색깔 등 특정한 정보를 파악하는 수준을 말한다.","k":"2015|영어|3~4학년|듣기|1","r":"3~4학년","gr":1},{"c":"4영01-07","y":"2015","s":"영어","g":"3~4학년","a":"듣기","t":"일상생활 속의 친숙한 주제에 관한 쉽고 간단한 말이나 대화를 듣고 세부 정보를 파악할 수 있다.","e":"일상생활 속의 친숙한 주제에 관한 쉽고 간단한 말이나 대화를 듣고 세부 정보를 파악할 수 있다.’는 학습자에게 친숙하며 흥미와 관심을 가질 수 있는 내용을 듣고, 대화가 일어난 장소, 시간, 방향, 종류, 관계 등 특정한 정보를 파악하는 수준을 말한다.","k":"2015|영어|3~4학년|듣기|1","r":"3~4학년","gr":1},{"c":"4영02-01","y":"2015","s":"영어","g":"3~4학년","a":"말하기","t":"알파벳과 낱말의 소리를 듣고 따라 말할 수 있다.","e":"","k":"2015|영어|3~4학년|말하기|1","r":"3~4학년","gr":1},{"c":"4영02-02","y":"2015","s":"영어","g":"3~4학년","a":"말하기","t":"영어의 강세, 리듬, 억양에 맞게 따라 말할 수 있다.","e":"영어의 강세, 리듬, 억양에 맞게 따라 말할 수 있다.’는 영어는 낱말 내에 강세가 있는 소리가 있으며, 문장 내에서도 강세가 있는 낱말과 약하게 발음하는 낱말이 있음을 학습자들이 자연스러운 발음을 통해 인지하고 강세, 리듬, 억양을 익히는 수준을 말한다.","k":"2015|영어|3~4학년|말하기|1","r":"3~4학년","gr":1},{"c":"4영02-03","y":"2015","s":"영어","g":"3~4학년","a":"말하기","t":"그림, 실물, 동작에 관해 쉽고 간단한 낱말이나 어구, 문장으로 표현할 수 있다.","e":"그림, 실물, 동작에 관해 쉽고 간단한 낱말이나 어구, 문장으로 표현할 수 있다.’는 실물이나 그림을 보거나 동작으로 표현하면서 해당하는 낱말이나 어구, 문장을 말하는 학습 초기에 쉽게 할 수 있는 수준을 말한다.","k":"2015|영어|3~4학년|말하기|1","r":"3~4학년","gr":1},{"c":"4영02-04","y":"2015","s":"영어","g":"3~4학년","a":"말하기","t":"한두 문장으로 자기소개를 할 수 있다.","e":"한두 문장으로 자기소개를 할 수 있다.’와 ‘","k":"2015|영어|3~4학년|말하기|1","r":"3~4학년","gr":1},{"c":"4영02-05","y":"2015","s":"영어","g":"3~4학년","a":"말하기","t":"한두 문장으로 지시하거나 설명할 수 있다.","e":"한두 문장으로 지시하거나 설명을 할 수 있다.’는 한두 문장의 영어로 간단하게 자신을 소개하고, 지시하거나 명령하는 문장들을 자
