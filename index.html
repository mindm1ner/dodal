의 연소","t":"물질의 성질이 달라지는 변화와 달라지지 않는 변화를 관찰하여 비교할 수 있다.","e":"서로 다른 물질을 섞었을 때 물질의 성질이 달라지는 변화를 활용한 재미있고 간단한 실험을 실시한다. 물질을 섞은 후 물질의 성질이 달라지는 까닭은 다루지 않으며, 물리 변화나 화학 변화 용어를 도입하지 않는다.","k":"2022|과학|5~6학년|물질의 연소|1","r":"물질"},{"c":"6과14-02","y":"2022","s":"과학","g":"5~6학년","a":"물질의 연소","t":"물질이 연소할 때 나타나는 공통적인 현상을 관찰하고, 연소의 조건을 찾을 수 있다.","e":"양초, 알코올, 나무 등과 같은 물질의 연소를 중심으로 다룬다.","k":"2022|과학|5~6학년|물질의 연소|1","r":"물질"},{"c":"6과14-03","y":"2022","s":"과학","g":"5~6학년","a":"물질의 연소","t":"연소 전과 후의 물질을 비교하여 연소 과정에서 물질의 성질이 달라짐을 설명할 수 있다.","e":"물이나 이산화 탄소와 같은 연소 생성물은 염화 코발트 종이나 석회수 등을 이용한 실험으로 확인하고, 그을음은 연소 생성물로 다루지 않는다.","k":"2022|과학|5~6학년|물질의 연소|1","r":"물질"},{"c":"6과14-04","y":"2022","s":"과학","g":"5~6학년","a":"물질의 연소","t":"연소 과정에서 생성되는 물질로 인한 생태계의 피해 사례를 수집하고 분석하여 해결책을 제안하고 공유할 수 있다. <","e":"생태계의 피해 사례는 연소 생성물 중 이산화 탄소로 인한 피해 사례를 중심으로 조사한다.","k":"2022|과학|5~6학년|물질의 연소|1","r":"물질"},{"c":"6과15-01","y":"2022","s":"과학","g":"5~6학년","a":"전기의 이용","t":"전지와 전구, 전선을 연결하여 전구에 불을 켜보고, 불이 켜지는 전기 회로의 특징을 말할 수 있다.","e":"","k":"2022|과학|5~6학년|전기의 이용|1","r":"운동과 에너지"},{"c":"6과15-02","y":"2022","s":"과학","g":"5~6학년","a":"전기의 이용","t":"전지 한 개를 연결한 전기 회로와 전지 두 개를 직렬연결한 전기 회로의 특징을 비교할 수 있다.","e":"전구의 직렬연결과 병렬연결은 다루지 않고, 전지의 연결은 직렬연결만 다룬다.","k":"2022|과학|5~6학년|전기의 이용|1","r":"운동과 에너지"},{"c":"6과15-03","y":"2022","s":"과학","g":"5~6학년","a":"전기의 이용","t":"전자석을 만들어 전자석의 성질을 탐색하고 전자석이 사용되는 예를 조사할 수 있다.","e":"전자석은 전지를 이용하여 제작하고, 전지의 수에 따라 전자석의 세기가 달라지는 현상, 전지의 연결 방향에 따라 전자석의 극이 달라지는 현상을 관찰하여 영구 자석과의 차이를 비교하도록 하되, 전류에 의한 자기장 개념은 도입하지 않는다.","k":"2022|과학|5~6학년|전기의 이용|1","r":"운동과 에너지"},{"c":"6과15-04","y":"2022","s":"과학","g":"5~6학년","a":"전기의 이용","t":"전기를 효율적이고 안전하게 사용하는 방법을 조사하여 실천 계획을 세우고 일상생활에서 실천할 수 있다. <","e":"","k":"2022|과학|5~6학년|전기의 이용|1","r":"운동과 에너지"},{"c":"6과16-01","y":"2022","s":"과학","g":"5~6학년","a":"과학과 나의 진로","t":"미래 사회에 일어날 수 있는 문제를 조사하고, 문제를 해결하는 데 과학이 기여할 수 있는 방법을 토의할 수 있다.","e":"단순한 상상이 아니라 현재의 다양한 정보를 기반으로 미래 사회의 문제를 예상해보도록 한다.","k":"2022|과학|5~6학년|과학과 나의 진로|1","r":"과학과 사회","x":"지구와 우주"},{"c":"6과16-02","y":"2022","s":"과학","g":"5~6학년","a":"과학과 나의 진로","t":"다양한 진로가 과학과 관련됨을 알고, 자신의 진로를 과학과 관련지어 설명할 수 있다. <","e":"과학자와 관련된 직업을 다루는 것이 아니라 학생이 희망하는 다양한 직업을 기준으로 하여 해당 직업과 관련된 과학적 요소를 찾도록 한다.","k":"2022|과학|5~6학년|과학과 나의 진로|1","r":"과학과 사회","x":"지구와 우주"},{"c":"2국01-01","y":"2022","s":"국어","g":"1~2학년","a":"듣기⋅말하기","t":"중요한 내용이나 일이 일어난 순서를 고려하며 듣고 말한다.","e":"","k":"2022|국어|1~2학년|듣기⋅말하기|1","r":"듣기⋅말하기"},{"c":"2국01-02","y":"2022","s":"국어","g":"1~2학년","a":"듣기⋅말하기","t":"바르고 고운 말로 서로의 감정을 나누며 듣고 말한다.","e":"이 성취기준은 대화를 나눌 때 자신의 감정을 적절하게 표현함으로써 타인과의 관계를 형성하고 유지하며 발전시키는 능력을 기르기 위해 설정하였다. 기쁨, 슬픔, 사랑, 미움 등 다양한 감정과 관련된 표현 알기, 감정을 표현하는 과정에서 바르고 고운 말을 사용하기, 상대의 감정을 이해하고 수용하기 등을 학습한다.","k":"2022|국어|1~2학년|듣기⋅말하기|1","r":"듣기⋅말하기"},{"c":"2국01-03","y":"2022","s":"국어","g":"1~2학년","a":"듣기⋅말하기","t":"상대의 말을 집중하여 듣고 말차례를 지키며 대화한다.","e":"이 성취기준은 구어 의사소통의 상호 교섭성을 인식하는 출발점으로, 대화 상황에서 상대의 말에 집중하여 그 내용을 이해하고 순서를 교대하며 구어 의사소통에 참여하는 기본 능력을 기르기 위해 설정하였다. 상대의 말을 집중하여 듣기, 다음 말할 사람을 선택하여 다음 말할 사람을 선택하여 부르거나, 고갯짓, 시선, 억양 등의 말차례 교환 신호를 활용하여 다음 사람이 말차례를 알아차릴 수 있도록 하기, 말차례 교환 신호를 확인하여 자신의 말차례 지키기 등을 학습한다.","k":"2022|국어|1~2학년|듣기⋅말하기|1","r":"듣기⋅말하기"},{"c":"2국01-04","y":"2022","s":"국어","g":"1~2학년","a":"듣기⋅말하기","t":"자신의 경험이나 생각을 바른 자세로 발표한다.","e":"이 성취기준은 교실에서 자신의 경험이나 생각을 바른 자세로 표현하고 학습에 참여할 수 있는 기본 능력을 기르기 위해 설정하였다. 자신의 경험이나 생각을 동료 학습자들 앞에서 간단히 말하기, 자신의 경험이나 배경지식을 바탕으로 말하기, 수업 시간에 바른 자세로 서서 말하기, 듣는 사람을 바라보며 말하기, 적절한 크기의 소리로 말하기 등을 학습한다.","k":"2022|국어|1~2학년|듣기⋅말하기|1","r":"듣기⋅말하기"},{"c":"2국01-05","y":"2022","s":"국어","g":"1~2학년","a":"듣기⋅말하기","t":"듣기와 말하기에 관심과 흥미를 가진다.","e":"이 성취기준은 삶에서 듣기⋅말하기의 즐거움을 느끼고 듣기⋅말하기의 중요성을 인식하도록 하기 위해 설정하였다. 듣기⋅말하기가 다양한 생각과 감정을 나누며 의사소통하기 위한 기본적인 도구임을 인식하기, 듣기⋅말하기의 역할과 중요성을 직접 경험해 보기, 다양한 놀이를 통해 듣기⋅말하기에 흥미 가지기 등을 학습한다.","k":"2022|국어|1~2학년|듣기⋅말하기|1","r":"듣기⋅말하기"},{"c":"2국02-01","y":"2022","s":"국어","g":"1~2학년","a":"읽기","t":"글자, 단어, 문장, 짧은 글을 정확하게 소리 내어 읽는다.","e":"","k":"2022|국어|1~2학년|읽기|1","r":"읽기"},{"c":"2국02-02","y":"2022","s":"국어","g":"1~2학년","a":"읽기","t":"의미가 잘 드러나도록 문장과 짧은 글을 알맞게 띄어 읽는다.","e":"이 성취기준은 글을 의미 단위에 알맞게 띄어 읽으며 글의 의미를 파악하는 능력을 기르기 위해 설정하였다. 글을 읽으면서 의미 단위를 인식하고 이에 맞게 띄어 읽는 것은 글의 의미를 정확하게 파악하고 읽기 유창성을 높이는 데 중요한 요소이다. 글의 의미를 이해하기 위해 의미 단위에 따른 어구나 어절 단위 등으로 띄어 읽기, 주어부와 서술어부 등을 단위로 하여 띄어 읽기, 문장 부호에 따라 문장 단위를 인식하면서 띄어 읽기, 쉬는 지점, 쉼의 길이에 유의하며 띄어 읽기 등을 학습한다.","k":"2022|국어|1~2학년|읽기|1","r":"읽기"},{"c":"2국02-03","y":"2022","s":"국어","g":"1~2학년","a":"읽기","t":"글을 읽고 중심 내용을 확인한다.","e":"","k":"2022|국어|1~2학년|읽기|1","r":"읽기"},{"c":"2국02-04","y":"2022","s":"국어","g":"1~2학년","a":"읽기","t":"인물의 마음이나 생각을 짐작하고 이를 자신과 비교하며 글을 읽는다.","e":"이 성취기준은 글에 등장하는 인물의 마음과 생각을 짐작하는 능력과 타인에 대한 공감 능력을 기르기 위해 설정하였다. 인물의 마음이나 생각을 짐작하는 것은 글의 내용에 대한 이해와 더불어 실제 주변 인물에 대한 이해를 높이는 데 도움이 된다. 인물의 처지나 상황을 파악하기, 자신의 경험에 비추어 인물의 마음이나 생각 짐작하기, 감정을 드러내는 다양한 어휘를 활용하여 인물의 마음이나 생각을 표현하기, 인물의 마음이나 생각과 관련된 자신의 경험이나 생각을 떠올리며 비교하기 등을 학습한다.","k":"2022|국어|1~2학년|읽기|1","r":"읽기"},{"c":"2국02-05","y":"2022","s":"국어","g":"1~2학년","a":"읽기","t":"읽기에 흥미를 가지고 즐겨 읽는 태도를 지닌다.","e":"","k":"2022|국어|1~2학년|읽기|1","r":"읽기"},{"c":"2국03-01","y":"2022","s":"국어","g":"1~2학년","a":"쓰기","t":"글자와 단어를 바르게 쓴다.","e":"","k":"2022|국어|1~2학년|쓰기|1","r":"쓰기"},{"c":"2국03-02","y":"2022","s":"국어","g":"1~2학년","a":"쓰기","t":"쓰기에 흥미를 가지며 자신의 생각이나 느낌을 문장으로 표현한다.","e":"이 성취기준은 쓰기에 흥미를 가지고 자신의 생각이나 느낌을 문장으로 표현하는 능력을 기르기 위해 설정하였다. 쓰기에 대한 긍정적인 인식을 가지고 문장 쓰기를 수행하는 것은 필자로 성장하기 위한 출발점에 해당한다. 자신의 생각이나 느낌을 문장으로 구성하는 방법, 꾸며 주는 말을 넣어 자신의 생각이나 느낌을 표현하는 방법 등을 학습한다. 이를 통해 학습자가 자신이 쓰고 싶은 화제나 주제를 찾아 다양한 문장으로 표현하는 즐거움을 경험하도록 한다.","k":"2022|국어|1~2학년|쓰기|1","r":"쓰기"},{"c":"2국03-03","y":"2022","s":"국어","g":"1~2학년","a":"쓰기","t":"주변 소재에 대해 소개하는 글을 쓴다.","e":"","k":"2022|국어|1~2학년|쓰기|1","r":"쓰기"},{"c":"2국03-04","y":"2022","s":"국어","g":"1~2학년","a":"쓰기","t":"겪은 일을 표현하는 글을 자유롭게 쓰고, 쓴 글을 함께 읽고 생각이나 느낌을 나눈다.","e":"이 성취기준은 자신이 겪은 일을 내용이나 형식에 제한 없이 자유롭게 표현하고, 그 과정과 결과를 독자와 공유하는 데에 필요한 능력과 태도를 기르기 위해 설정하였다. 자신이 겪은 일 중 글로 쓰고 싶은 경험 떠올리기, 경험에 대한 자신의 생각이나 느낌 떠올리기, 자유롭게 표현하기, 쓴 글을 함께 읽고 반응하기 등을 학습한다.","k":"2022|국어|1~2학년|쓰기|1","r":"쓰기"},{"c":"2국04-01","y":"2022","s":"국어","g":"1~2학년","a":"문법","t":"한글 자모의 이름과 소릿값을 알고 정확하게 발음하고 쓴다.","e":"","k":"2022|국어|1~2학년|문법|1","r":"문법"},{"c":"2국04-02","y":"2022","s":"국어","g":"1~2학년","a":"문법","t":"소리와 표기가 다를 수 있음을 알고 단어를 바르게 읽고 쓴다.","e":"","k":"2022|국어|1~2학년|문법|1","r":"문법"},{"c":"2국04-03","y":"2022","s":"국어","g":"1~2학년","a":"문법","t":"문장과 문장 부호를 알맞게 쓰고 한글에 호기심을 가진다.","e":"이 성취기준은 문장으로 의사소통하기 위해 필요한 기초적인 문식성을 기르고, 글자, 단어, 문장을 주의 깊게 관찰하고 탐구하는 자세를 기르기 위해 설정하였다. 자신의 생각을 문장으로 쓰는 것은 의사소통 능력의 핵심으로서, 특히 한글 학습 초기에는 음성 언어와는 다른 문자 언어의 특성을 이해하는 것이 중요하다. 문장 부호의 이름과 쓰임, 평서문⋅의문문⋅감탄문 등 다양한 종류의 문장 쓰기와 그에 따른 문장 부호 사용하기를 다루되, 문장 부호 사용의 필요성을 깨닫고 문장을 비롯하여 문장을 이루는 글자, 단어에도 호기심을 갖도록 한다.","k":"2022|국어|1~2학년|문법|1","r":"문법"},{"c":"2국05-01","y":"2022","s":"국어","g":"1~2학년","a":"문학","t":"말놀이, 낭송 등을 통해 말의 재미와 즐거움을 느낀다.","e":"이 성취기준은 흥미로운 말놀이와 분위기를 살린 낭송을 통해 언어 활동의 재미와 즐거움을 느끼며 언어적 감수성을 기르게 하기 위해 설정하였다. 일상에서 쉽게 접할 수 있는 작품은 물론 일상적 대화 등을 통해 언어의 놀이적 성격을 인지하도록 하고, 의성어와 의태어, 규칙적으로 반복되는 소리, 언어유희, 재치 있는 문답, 수수께끼, 끝말잇기 등에서 말놀이의 재미와 가치를 느끼게 한다. 또한 작품의 느낌과 분위기를 살려 낭송해 보면서 목소리 크기나 말의 속도, 어조 등을 달리함에 따라 다양한 느낌을 전달할 수 있음을 알고 문학을 즐겨 향유하도록 한다.","k":"2022|국어|1~2학년|문학|1","r":"문학"},{"c":"2국05-02","y":"2022","s":"국어","g":"1~2학년","a":"문학","t":"작품을 듣거나 읽으면서 느끼거나 생각한 점을 말한다.","e":"이 성취기준은 학습자들이 작품에 대해 느끼거나 생각한 점을 다른 이들과 나누는 과정에서 문학에 대해 더욱 흥미를 느끼고, 주체적으로 작품을 수용하는 능력을 기르게 하기 위해 설정하였다. 학습자의 발달과 정서적 측면을 고려하여 시, 노래, 이야기 등 다양한 갈래의 작품을 제시하고, 학습자가 이들 작품을 대상으로 자신의 생각이나 느낌을 표현할 수 있도록 한다. 이 과정에서 학습자로 하여금 작품에 대한 다른 학습자들의 말을 경청하게 하고, 사람마다 작품을 다르게 받아들일 수 있다는 점을 이해하게 한다.","k":"2022|국어|1~2학년|문학|1","r":"문학"},{"c":"2국05-03","y":"2022","s":"국어","g":"1~2학년","a":"문학","t":"작품 속 인물의 모습, 행동, 마음을 상상하여 시, 노래, 이야기, 그림 등으로 표현한다.","e":"","k":"2022|국어|1~2학년|문학|1","r":"문학"},{"c":"2국05-04","y":"2022","s":"국어","g":"1~2학년","a":"문학","t":"시나 노래, 이야기에 흥미를 가진다.","e":"","k":"2022|국어|1~2학년|문학|1","r":"문학"},{"c":"2국06-01","y":"2022","s":"국어","g":"1~2학년","a":"매체","t":"일상의 다양한 매체와 매체 자료에 흥미와 관심을 가진다.","e":"이 성취기준은 매체와 관련된 일상 경험을 나눔으로써 매체와 매체 자료에 대한 흥미와 관심을 가지고 매체의 가치와 필요성을 자연스럽게 인식하도록 하기 위해 설정하였다. 매체란 소통을 매개하는 도구, 기술, 환경으로, 책, TV, 스마트폰, 컴퓨터, 태블릿, 인터넷 등이 이에 속하며, 매체 자료에는 그림책, 만화, 뉴스, 광고, 웹툰, 애니메이션, 영화 등이 있다. 이 성취기준에서는 학습자가 친숙한 매체와 매체 자료를 토대로 일상의 경험을 매체와 연결 지어 이야기하여 매체와 매체 자료의 개념과 쓰임을 이해하고 다양한 매체와 매체 자료에 흥미와 관심을 갖도록 한다.","k":"2022|국어|1~2학년|매체|1","r":"매체"},{"c":"2국06-02","y":"2022","s":"국어","g":"1~2학년","a":"매체","t":"일상의 경험과 생각을 글과 그림으로 표현한다.","e":"이 성취기준은 글과 그림으로 자신의 생각과 느낌을 표현하는 즐거움을 경험하도록 하기 위해 설정하였다. 글, 그림(또는 사진, 이모티콘 등)을 활용하여 자신, 친구, 가족, 학교, 교실 등 친숙한 주제에 대해 표현하거나 그림일기를 작성해 보는 활동을 통해 자신의 경험과 생각을 다양한 방식으로 표현해 보는 데 중점을 둔다.","k":"2022|국어|1~2학년|매체|1","r":"매체"},{"c":"4국01-01","y":"2022","s":"국어","g":"3~4학년","a":"듣기⋅말하기","t":"중요한 내용과 주제를 파악하며 듣고 그 내용을 요약한다.","e":"","k":"2022|국어|3~4학년|듣기⋅말하기|1","r":"듣기⋅말하기"},{"c":"4국01-02","y":"2022","s":"국어","g":"3~4학년","a":"듣기⋅말하기","t":"원인과 결과의 관계를 고려하여 내용을 예측하며 듣고 말한다.","e":"","k":"2022|국어|3~4학년|듣기⋅말하기|1","r":"듣기⋅말하기"},{"c":"4국01-03","y":"2022","s":"국어","g":"3~4학년","a":"듣기⋅말하기","t":"상황에 적절한 준언어⋅비언어적 표현을 활용하여 듣고 말한다.","e":"이 성취기준은 구어 의사소통 상황에서 억양, 어조, 속도 등의 준언어적 표현과 표정, 시선, 몸동작, 자세 등의 비언어적 표현을 활용하여 의미를 효과적으로 전달하고 이해할 수 있는 능력을 기르기 위해 설정하였다. 다양한 상황에 알맞은 준언어⋅비언어적 표현의 중요성 이해하기, 준언어⋅비언어적 표현의 의미와 효과 파악하기, 준언어⋅비언어적 표현의 적절성 점검하기, 상황에 적절한 준언어⋅비언어적 표현 활용하기 등을 학습한다.","k":"2022|국어|3~4학년|듣기⋅말하기|1","r":"듣기⋅말하기"},{"c":"4국01-04","y":"2022","s":"국어","g":"3~4학년","a":"듣기⋅말하기","t":"상황과 상대의 입장을 이해하고 예의를 지키며 대화한다.","e":"","k":"2022|국어|3~4학년|듣기⋅말하기|1","r":"듣기⋅말하기"},{"c":"4국01-05","y":"2022","s":"국어","g":"3~4학년","a":"듣기⋅말하기","t":"목적과 주제에 알맞게 자료를 정리하여 자신감 있게 발표한다.","e":"이 성취기준은 교과 학습 상황을 비롯하여 다양한 상황에서 필요한 기초적인 발표 능력을 기르기 위해 설정하였다. 주어진 자료에서 발표 목적과 주제에 알맞은 내용을 중심으로 발표 내용 정리하기, 준비한 내용이 명확하게 전달되는지를 점검하며 발표 연습하기, 준언어⋅비언어적 표현을 효과적으로 사용하는지 점검하며 발표 연습하기, 연습 과정에서 부족했던 부분을 조정하여 자신감을 가지고 발표하기 등을 학습한다.","k":"2022|국어|3~4학년|듣기⋅말하기|1","r":"듣기⋅말하기"},{"c":"4국01-06","y":"2022","s":"국어","g":"3~4학년","a":"듣기⋅말하기","t":"주제에 적절한 의견과 이유를 제시하고 서로의 생각을 교환하며 토의한다.","e":"이 성취기준은 문제를 합리적으로 해결하기 위한 기초 능력으로서 토의 능력을 기르기 위해 설정하였다. 주제에 적절한 의견을 이유와 함께 제시하기, 상대의 의견을 구체적으로 파악하거나 의견과 이유의 적절성을 점검하기 위해 서로 묻고 답하기, 다른 사람의 생각 존중하기 등을 학습한다.","k":"2022|국어|3~4학년|듣기⋅말하기|1","r":"듣기⋅말하기"},{"c":"4국02-01","y":"2022","s":"국어","g":"3~4학년","a":"읽기","t":"글의 의미를 파악하며 유창하게 글을 읽는다.","e":"이 성취기준은 글의 의미를 효과적으로 표현하는 방법을 사용하여 유창하게 글을 읽는 능력을 기르기 위해 설정하였다. 글의 유형에 따라 글의 분위기, 장면, 인물의 특성 등을 파악하고 이를 고려하되, 어조, 억양, 속도, 강세 등의 표현 요소를 활용하여 글을 읽으면서 글의 의미를 효과적으로 표현하기 등을 학습한다.","k":"2022|국어|3~4학년|읽기|1","r":"읽기"},{"c":"4국02-02","y":"2022","s":"국어","g":"3~4학년","a":"읽기","t":"문단과 글에서 중심 생각을 파악하고 내용을 간추린다.","e":"","k":"2022|국어|3~4학년|읽기|1","r":"읽기"},{"c":"4국02-03","y":"2022","s":"국어","g":"3~4학년","a":"읽기","t":"질문을 활용하여 글을 예측하며 읽고 자신의 읽기 과정을 점검한다.","e":"이 성취기준은 글을 읽으며 글에 대한 질문을 만들고 이에 대한 답을 예측하면서 글을 읽는 추론적 읽기 능력을 기르기 위해 설정하였다. 읽기 전이나 읽기 중에 이루어지는 질문을 통해 자신의 배경지식이나 경험을 글과 관련짓기, 배경지식이나 경험을 활성화하여 글의 의미 추론하기, 제목이나 글의 차례, 사진이나 그림 등의 자료를 통해 글의 의미 추론하기, 질문을 통해 단어의 의미, 이어질 내용이나 사건의 전후를 예측하기, 질문을 통해 글을 이해한 정도를 점검하거나 읽기 과정에서 겪는 어려움을 점검하기 등을 학습한다.","k":"2022|국어|3~4학년|읽기|1","r":"읽기"},{"c":"4국02-04","y":"2022","s":"국어","g":"3~4학년","a":"읽기","t":"글에 나타난 사실과 의견을 구분하고 필자와 자신의 의견을 비교한다.","e":"이 성취기준은 글에 나타난 사실과 의견을 구별하고 필자와 자신의 의견을 비교하면서 필자의 의견을 일방적으로 수용하지 않고 글을 비판적으로 읽는 능력을 기르기 위해 설정하였다. 글을 읽고 필자의 의견과 객관적 사실을 구별하기, 필자의 의견과 자신의 의견을 비교하기, 필자의 의견에 대한 타당성을 평가하기, 동일한 주제나 상황에 대한 서로 다른 의견 비교하기 등을 학습한다.","k":"2022|국어|3~4학년|읽기|1","r":"읽기"},{"c":"4국02-05","y":"2022","s":"국어","g":"3~4학년","a":"읽기","t":"글이나 자료의 출처가 믿을 만한지 판단한다.","e":"이 성취기준은 도서관이나 인터넷 등을 통해 글이나 자료를 찾아 읽을 때 출처의 신뢰성을 평가하며 읽고 믿을 만한 글이나 자료를 선별하는 능력을 기르기 위해 설정하였다. 글이나 자료의 출처 확인 방법이나 필요성 이해하기, 다양한 매체를 활용하여 글이나 자료 탐색하기, 글이나 자료의 정보 출처 파악하기, 정보 출처의 유형이나 정보의 최신성 확인하기, 권위나 공신력 등을 고려한 신뢰성 평가하기, 여러 정보를 비교하며 내용의 신뢰성 평가하기 등을 학습한다.","k":"2022|국어|3~4학년|읽기|1","r":"읽기"},{"c":"4국02-06","y":"2022","s":"국어","g":"3~4학년","a":"읽기","t":"바람직한 읽기 습관을 형성하고 읽기에 대한 자신감을 기른다.","e":"","k":"2022|국어|3~4학년|읽기|1","r":"읽기"},{"c":"4국03-01","y":"2022","s":"국어","g":"3~4학년","a":"쓰기","t":"중심 문장과 뒷받침 문장을 갖추어 문단을 쓰고, 문장과 문단을 중심으로 고쳐 쓴다.","e":"이 성취기준은 문단을 짜임새 있게 쓰는 능력을 길러 글을 쓰는 과정에서 이를 적용할 수 있도록 하기 위해 설정하였다. 문단의 개념, 문단의 기능과 역할, 중심 문장과 뒷받침 문장의 관계, 중심 문장과 뒷받침 문장을 쓰는 방법, 중심 문장과 뒷받침 문장을 갖추어 문단을 쓰는 방법, 문장과 문단을 중심으로 글을 고쳐 쓰는 방법 등을 학습한다.","k":"2022|국어|3~4학년|쓰기|1","r":"쓰기"},{"c":"4국03-02","y":"2022","s":"국어","g":"3~4학년","a":"쓰기","t":"절차와 결과가 드러나게 정확한 표현으로 보고하는 글을 쓴다.","e":"이 성취기준은 교과 학습의 기초가 되는 보고하는 글을 쓰는 능력을 기르기 위해 설정하였다. 보고하는 글의 개념, 보고하는 글에 들어가야 할 내용 요소, 절차와 결과가 드러나게 글의 내용을 조직하는 방법, 절차와 결과를 정확하게 표현해야 하는 이유, 정확한 표현으로 보고하는 글 쓰기 등을 학습한다.","k":"2022|국어|3~4학년|쓰기|1","r":"쓰기"},{"c":"4국03-03","y":"2022","s":"국어","g":"3~4학년","a":"쓰기","t":"대상에 대한 자신의 의견과 그렇게 생각한 이유가 드러나게 글을 쓴다.","e":"이 성취기준은 어떤 대상이나 사실, 문제에 대한 자신의 의견을 구체적이고 명료하게 글로 쓰는 능력을 기르기 위해 설정하였다. 의견의 개념, 의견을 제시하는 것이 필요한 이유와 상황, 주제를 고려하여 자신의 의견을 제시하는 방법, 의견에 대한 이유를 드는 방법 등을 학습한다.","k":"2022|국어|3~4학년|쓰기|1","r":"쓰기"},{"c":"4국03-04","y":"2022","s":"국어","g":"3~4학년","a":"쓰기","t":"목적과 주제를 고려하여 독자에게 마음을 전하는 글을 쓴다.","e":"","k":"2022|국어|3~4학년|쓰기|1","r":"쓰기"},{"c":"4국03-05","y":"2022","s":"국어","g":"3~4학년","a":"쓰기","t":"자신의 쓰기 과정을 점검하며 쓰기에 자신감을 갖는다.","e":"","k":"2022|국어|3~4학년|쓰기|1","r":"쓰기"},{"c":"4국04-01","y":"2022","s":"국어","g":"3~4학년","a":"문법","t":"단어와 단어 간의 의미 관계를 파악한다.","e":"","k":"2022|국어|3~4학년|문법|1","r":"문법"},{"c":"4국04-02","y":"2022","s":"국어","g":"3~4학년","a":"문법","t":"단어를 분류하고 국어사전을 활용하여 능동적인 국어 활동을 한다.","e":"이 성취기준은 단어에 대한 기본적인 이해를 바탕으로 국어사전에서 단어를 찾고 국어사전에 수록된 정보를 활용하여 능동적인 국어생활을 할 수 있는 능력을 기르기 위해 설정하였다. 명사, 동사, 형용사에 대한 기본적인 이해를 바탕으로 하되, 상황에 따라 다양하게 해석되는 단어의 의미를 국어사전에서 찾을 수 있도록 동형이의어와 다의어가 국어사전에 수록된 방식을 이해하고, 동사와 형용사의 기본형과 활용형을 구분할 수 있도록 한다. 또한 국어사전을 통해 단어의 표기, 발음, 품사, 의미, 용례 등 다양한 정보를 확인할 수 있음을 이해하고, 단어의 정확한 발음과 표기를 국어사전에서 찾아 어법에 맞는 국어생활을 할 수 있도록 한다.","k":"2022|국어|3~4학년|문법|1","r":"문법"},{"c":"4국04-03","y":"2022","s":"국어","g":"3~4학년","a":"문법","t":"기본적인 문장의 짜임을 이해하고 적절하게 사용한다.","e":"","k":"2022|국어|3~4학년|문법|1","r":"문법"},{"c":"4국04-04","y":"2022","s":"국어","g":"3~4학년","a":"문법","t":"글과 담화에 쓰인 높임 표현과 지시⋅접속 표현을 이해하고 상황에 맞게 표현한다.","e":"이 성취기준은 높임 표현과 지시⋅접속 표현이 상황 맥락에 맞는 언어 표현을 선택하거나 글이나 담화를 유기적으로 구성하는 데 필요한 지식임을 이해하고, 글이나 담화에서 높임 표현과 지시⋅접속 표현을 적절히 사용할 수 있는 능력을 기르기 위해 설정하였다. 높임 표현의 기능과 적절한 사용 방식, 앞에 나온 말을 가리키는 지시 표현 및 문장과 문장 등을 연결하는 다양한 접속 표현의 기능과 이러한 표현들의 적절한 사용 방식을 학습한다.","k":"2022|국어|3~4학년|문법|1","r":"문법"},{"c":"4국04-05","y":"2022","s":"국어","g":"3~4학년","a":"문법","t":"언어가 의사소통과 관계 형성의 수단임을 이해하고 국어를 소중히 여기는 태도를 지닌다.","e":"","k":"2022|국어|3~4학년|문법|1","r":"문법"},{"c":"4국05-01","y":"2022","s":"국어","g":"3~4학년","a":"문학","t":"인물과 이야기의 흐름을 중심으로 작품을 감상한다.","e":"이 성취기준은 문학 작품 속 인물의 특성과 서사의 기본 구조를 파악하며 작품을 이해하는 능력을 기르게 하기 위해 설정하였다. 이야기를 읽을 때 인물의 성격과 역할을 파악하고, 이를 고려하여 시간적 순서나 인과관계를 생각하며 이야기의 흐름을 파악하는 활동에 중점을 둔다. 나아가 작품 속 다양한 인물의 특성을 고려하면서 이어질 이야기를 상상하여 표현해 봄으로써 작품을 능동적으로 이해하고 감상하게 한다.","k":"2022|국어|3~4학년|문학|1","r":"문학"},{"c":"4국05-02","y":"2022","s":"국어","g":"3~4학년","a":"문학","t":"자신의 경험을 바탕으로 작품 속 세계와 현실 세계를 비교하여 작품을 감상한다.","e":"이 성취기준은 작품 속의 세계가 현실 세계를 반영한 것이지만, 허구적 세계로서 현실 세계와 구별된다는 점을 인식하며 작품을 감상할 수 있게 하기 위해 설정하였다. 작품 속의 인물⋅정서⋅상황⋅배경⋅분위기⋅사건 등을 이해할 때 학습자 자신의 경험을 바탕으로 경험과 상상, 사실과 허구를 비교하며 생각하게 하고, 허구적으로 표현한 부분에 대한 의견을 나누며 작품을 감상하도록 한다.","k":"2022|국어|3~4학년|문학|1","r":"문학"},{"c":"4국05-03","y":"2022","s":"국어","g":"3~4학년","a":"문학","t":"작품을 듣거나 읽고 마음에 드는 작품을 소개한다.","e":"","k":"2022|국어|3~4학년|문학|1","r":"문학"},{"c":"4국05-04","y":"2022","s":"국어","g":"3~4학년","a":"문학","t":"감각적 표현에 유의하여 작품을 감상하고, 감각적 표현을 활용하여 자신의 생각이나 감정을 표현한다.","e":"이 성취기준은 문학 표현 방식의 효과와 기능을 이해하며 작품을 감상하고, 자신의 생각이나 느낌을 다양한 방법으로 나타내어 다른 이들과 나누게 하기 위해 설정하였다. 학습자로 하여금 감각적 표현을 통해 작품 속에 형상화된 대상을 생동감 있게 체험하면서 문학의 즐거움을 느끼게 하는 데 중점을 둔다. 또한 자신의 생각과 감정을 효과적으로 전달할 수 있는 감각적 표현을 활용하여 말을 하거나 글을 써 보고 감각적 표현을 사용하였을 때와 그렇지 않을 때의 차이를 비교하게 한다.","k":"2022|국어|3~4학년|문학|1","r":"문학"},{"c":"4국05-05","y":"2022","s":"국어","g":"3~4학년","a":"문학","t":"재미나 감동을 느끼며 작품을 즐겨 감상하는 태도를 지닌다.","e":"","k":"2022|국어|3~4학년|문학|1","r":"문학"},{"c":"4국06-01","y":"2022","s":"국어","g":"3~4학년","a":"매체","t":"인터넷에서 학습에 필요한 다양한 자료를 탐색하고 목적에 맞게 자료를 선택한다.","e":"이 성취기준은 다양한 교과 학습 맥락에서 인터넷에 접속하여 다양한 자료에 효과적으로 접근하고 유용한 정보를 선택하여 목적에 맞게 활용할 때 필요한 기초 능력을 기르기 위해 설정하였다. 교사의 안내에 따라 디지털 매체를 통해 지정된 인터넷 공간에 접속하기, 다양한 자료 훑어보기, 자료의 내용 파악하기, 유용한 자료 선택하기 등을 수행하고, 이를 통해 인터넷 접속 방법, 비선형적 자료의 탐색 방법, 목적에 맞는 정보 선택 방법 등을 체계적으로 학습한다.","k":"2022|국어|3~4학년|매체|1","r":"매체"},{"c":"4국06-02","y":"2022","s":"국어","g":"3~4학년","a":"매체","t":"매체를 활용하여 간단한 발표 자료를 만든다.","e":"","k":"2022|국어|3~4학년|매체|1","r":"매체"},{"c":"4국06-03","y":"2022","s":"국어","g":"3~4학년","a":"매체","t":"매체 소통 윤리를 고려하여 매체 자료를 활용하고 공유한다.","e":"이 성취기준은 매체 기반의 소통에서 지켜야 할 기본적인 윤리를 이해하고 이를 고려하며 매체 자료를 활용하거나 공유할 수 있는 능력을 기르기 위해 설정하였다. 다양한 매체 자료를 활용하거나 공유하는 과정에서 저작권과 초상권 침해, 개인 정보 유출 등의 문제가 발생할 수 있음을 이해한다. 다양한 사례를 통해 매체 이용자로서 소통 윤리를 지키려는 태도를 기르고, 매체 자료를 안전하고 올바르게 활용하고 공유할 수 있는 방법 등을 학습한다.","k":"2022|국어|3~4학년|매체|1","r":"매체"},{"c":"6국01-01","y":"2022","s":"국어","g":"5~6학년","a":"듣기⋅말하기","t":"대화에서 생략된 내용을 추론하며 듣는다.","e":"","k":"2022|국어|5~6학년|듣기⋅말하기|1","r":"듣기⋅말하기"},{"c":"6국01-02","y":"2022","s":"국어","g":"5~6학년","a":"듣기⋅말하기","t":"주장을 파악하고 이유나 근거가 타당한지 평가하며 듣는다.","e":"","k":"2022|국어|5~6학년|듣기⋅말하기|1","r":"듣기⋅말하기"},{"c":"6국01-03","y":"2022","s":"국어","g":"5~6학년","a":"듣기⋅말하기","t":"주제와 관련하여 궁금한 내용을 질문하며 적극적으로 듣고 말한다.","e":"이 성취기준은 교과 학습 상황을 비롯한 다양한 상황에서 주제와 관련하여 적극적으로 질문하며 구어 의사소통에 참여하는 능력을 기르기 위해 설정하였다. 들은 내용을 확인하거나 명료하게 이해하기 위한 질문, 생략된 내용을 추론하기 위한 질문, 상대의 의도를 파악하기 위한 질문, 다른 사람의 생각과 자신의 생각을 연결하기 위한 질문, 자료에서 제시되지 않은 대안이나 더 많은 정보를 찾기 위한 질문 등 다양한 목적으로 질문 생성하기, 분명한 표현으로 질문하기, 예절을 지켜 질문하기 등을 학습한다.","k":"2022|국어|5~6학년|듣기⋅말하기|1","r":"듣기⋅말하기"},{"c":"6국01-04","y":"2022","s":"국어","g":"5~6학년","a":"듣기⋅말하기","t":"면담의 절차를 이해하고 상대와 매체를 고려하여 면담한다.","e":"이 성취기준은 일련의 절차에 따라 면담을 경험해 봄으로써 정보 수집 등의 목적을 가진 구어 의사소통을 효과적이고 체계적으로 수행하는 능력을 기르기 위해 설정하였다. 면담 준비⋅진행⋅결과 정리 등 면담의 절차 이해하기, 면담의 목적⋅대상⋅주제 등 설정하기, 사전 정보 수집하기, 면담 대상 섭외하기, 목적⋅대상⋅주제에 알맞은 질문 준비하기, 녹음기나 기록용 노트 등 면담에 필요한 매체 준비하기, 준비한 질문을 바탕으로 면담하기, 면담 결과를 발표하거나 글로 써서 보고하기 등을 학습한다. 면담 상대를 배려하여 사전에 약속 시간 정하기, 녹음 여부에 대해 동의 구하기, 민감하거나 불편한 질문은 아닌지 점검하기, 종료 후 감사 표현하기 등 면담 과정에서 지켜야 할 예절도 학습한다.","k":"2022|국어|5~6학년|듣기⋅말하기|1","r":"듣기⋅말하기"},{"c":"6국01-05","y":"2022","s":"국어","g":"5~6학년","a":"듣기⋅말하기","t":"자료를 선별하여 핵심 정보를 중심으로 내용을 구성하고 매체를 활용하여 발표한다.","e":"","k":"2022|국어|5~6학년|듣기⋅말하기|1","r":"듣기⋅말하기"},{"c":"6국01-06","y":"2022","s":"국어","g":"5~6학년","a":"듣기⋅말하기","t":"토의에 협력적으로 참여하며 서로의 의견을 비교하고 조정한다.","e":"","k":"2022|국어|5~6학년|듣기⋅말하기|1","r":"듣기⋅말하기"},{"c":"6국01-07","y":"2022","s":"국어","g":"5~6학년","a":"듣기⋅말하기","t":"절차와 규칙을 지키고 타당한 이유와 근거를 제시하며 토론한다.","e":"이 성취기준은 민주적 의사소통 능력으로서 토론 능력을 기르기 위해 설정하였다. 찬성 또는 반대의 입장에서 주장하는 바에 대한 이유 마련하기, 이유를 뒷받침할 수 있는 객관적인 사실 또는 정보를 활용하여 근거 마련하기, 주장이 가치 있고 실천 가능한지 검토하기, 이유가 주장과 관련이 있는지 검토하기, 이유가 상대에게 받아들여질 수 있는지 검토하기, 근거가 이유와 관련이 있는지 검토하기, 근거로 제시한 자료의 출처가 명확하고 믿을 만한지 검토하기, 상대의 의견을 존중하며 토론하기, 절차와 규칙에 따라 합리적으로 소통하는 태도 형성하기 등을 학습한다.","k":"2022|국어|5~6학년|듣기⋅말하기|1","r":"듣기⋅말하기"},{"c":"6국02-01","y":"2022","s":"국어","g":"5~6학년","a":"읽기","t":"글의 구조를 고려하며 주제나 주장을 파악하고 글 내용을 요약한다.","e":"이 성취기준은 글의 구조를 고려하며 글의 중심 내용을 파악하고 자신의 언어로 요약하는 능력을 기르기 위해 설정하였다. 요약하기의 일반 원리를 이해하기, 글의 구조를 시각화한 도해 조직자를 활용하여 글의 구조와 내용 파악하기, 주제나 주장을 파악하기, 글의 중심 내용을 자신의 언어로 재구성하여 요약하기 등을 학습한다.","k":"2022|국어|5~6학년|읽기|1","r":"읽기"},{"c":"6국02-02","y":"2022","s":"국어","g":"5~6학년","a":"읽기","t":"글에서 생략된 내용이나 함축된 표현을 문맥을 고려하여 추론한다.","e":"이 성취기준은 글의 문맥을 고려하여 글에 표면적으로 드러나지 않은 내용을 추론하며 읽는 능력을 기르기 위해 설정하였다. 중요 단어나 문장, 문단 등의 수준에서 의미 추론하기, 글의 전체적인 흐름을 고려할 때 글에서 빠진 세부 내용이나 이어질 내용 추론하기, 학습자의 배경지식을 이용하여 함축적 표현이 암시하거나 내포하는 의미 추측하기 등을 학습한다.","k":"2022|국어|5~6학년|읽기|1","r":"읽기"},{"c":"6국02-03","y":"2022","s":"국어","g":"5~6학년","a":"읽기","t":"글이나 자료를 읽고 내용의 타당성과 표현의 적절성을 평가한다.","e":"","k":"2022|국어|5~6학년|읽기|1","r":"읽기"},{"c":"6국02-04","y":"2022","s":"국어","g":"5~6학년","a":"읽기","t":"문제 상황과 관련된 다양한 관점의 글을 읽고 이를 문제 해결에 활용한다.","e":"이 성취기준은 학습자가 직면한 문제를 해결하기 위해 다양한 관점의 글을 찾아 읽고 문제 해결에 필요한 지식이나 정보를 구성하는 창의적 읽기 능력을 기르기 위해 설정하였다. 문제 상황과 관련한 읽기 목적 명료화하기, 문제 상황 해결에 도움을 줄 수 있는 다양한 관점의 글 선정하기, 다양한 관점의 글을 읽고 내용의 타당성과 유용성 평가하기, 문제 해결을 위한 자신만의 창의적인 해결 방안 마련하기 등을 학습한다.","k":"2022|국어|5~6학년|읽기|1","r":"읽기"},{"c":"6국02-05","y":"2022","s":"국어","g":"5~6학년","a":"읽기","t":"긍정적인 읽기 동기를 형성하고 적극적으로 읽기에 참여하는 태도를 기른다.","e":"","k":"2022|국어|5~6학년|읽기|1","r":"읽기"},{"c":"6국03-01","y":"2022","s":"국어","g":"5~6학년","a":"쓰기","t":"알맞은 내용을 선정하여 대상의 특성이 나타나게 설명하는 글을 쓴다.","e":"이 성취기준은 설명하는 글을 쓰는 데에 필요한 능력을 기르기 위해 설정하였다. 설명하고자 하는 대상의 특성을 드러낼 수 있는 내용을 선정하는 방법, 개념 정의, 부연 상술, 예시, 열거, 인용, 비교와 대조 등을 활용하여 독자가 대상의 특성을 이해하기 쉽게 내용을 구성하고 표현하는 방법, 설명 대상과 설명 방법의 관련성 등을 학습한다. 설명 대상은 인문, 사회, 과학, 예술, 체육 등 교과 내용에서 선정한다.","k":"2022|국어|5~6학년|쓰기|1","r":"쓰기"},{"c":"6국03-02","y":"2022","s":"국어","g":"5~6학년","a":"쓰기","t":"적절한 근거를 사용하고 인용의 출처를 밝히며 주장하는 글을 쓴다.","e":"이 성취기준은 주장하는 글을 쓰는 데에 필요한 능력과 쓰기 윤리를 준수하며 글을 쓰는 태도를 기르기 위해 설정하였다. 주장하는 글 쓰기의 중요성과 특성, 주장과 이유 및 근거의 개념과 관계, 주장하는 글에 적절한 근거가 필요한 까닭, 역사적 사실, 실험 및 조사 결과, 통계 수치, 전문가의 견해 등을 활용하여 근거 생성하기, 이유와 근거를 활용하여 주장하는 글 쓰기, 인용의 출처를 밝혀야 하는 이유와 기본적인 인용 방법 등을 학습한다.","k":"2022|국어|5~6학년|쓰기|1","r":"쓰기"},{"c":"6국03-03","y":"2022","s":"국어","g":"5~6학년","a":"쓰기","t":"체험한 일에 대한 감상을 나타내는 글을 쓴다.","e":"","k":"2022|국어|5~6학년|쓰기|1","r":"쓰기"},{"c":"6국03-04","y":"2022","s":"국어","g":"5~6학년","a":"쓰기","t":"독자와 매체를 고려하여 내용을 생성하고 표현하며 글을 쓴다.","e":"이 성취기준은 글을 쓰는 과정에서 쓰기 목적, 독자와 매체 등과 같은 상황 맥락을 고려하여 내용을 생성하고 표현하는 능력을 기르기 위해 설정하였다. 예상 독자의 개념 이해하기, 독자 고려의 필요성 인식하기, 온라인 대화, 인터넷 게시판 댓글, 전자 우편, 블로그, 휴대전화 문자 메시지 등 다양한 매체의 특성 이해하기, 글의 목적이나 주제에 따라 알맞은 매체와 예상 독자 선정하기, 독자와 매체의 특성을 고려하여 계획 및 내용 생성하기, 독자와 매체의 특성을 고려하여 표현하기 등을 학습한다.","k":"2022|국어|5~6학년|쓰기|1","r":"쓰기"},{"c":"6국03-05","y":"2022","s":"국어","g":"5~6학년","a":"쓰기","t":"쓰기 과정을 점검⋅조정하며 글을 쓰고, 글 전체를 대상으로 통일성 있게 고쳐 쓴다.","e":"이 성취기준은 필자가 자신의 쓰기 과정을 점검⋅조정하고 그 결과를 바탕으로 글을 고쳐 쓰는 능력을 기르기 위해 설정하였다. 글쓰기에서 통일성의 개념과 중요성, 쓰기 과정에 대한 점검과 조정의 필요성, 쓰기 과정의 회귀적 특성, 글에 대한 독자의 반응을 생각하며 고쳐쓰기, 글의 주제와 목적, 예상 독자 등을 고려하여 글의 통일성 점검하기 등을 학습한다.","k":"2022|국어|5~6학년|쓰기|1","r":"쓰기"},{"c":"6국03-06","y":"2022","s":"국어","g":"5~6학년","a":"쓰기","t":"쓰기에 적극적으로 참여하며 자신의 글을 독자와 공유하는 태도를 지닌다.","e":"","k":"2022|국어|5~6학년|쓰기|1","r":"쓰기"},{"c":"6국04-01","y":"2022","s":"국어","g":"5~6학년","a":"문법","t":"음성 언어 및 문자 언어의 특성을 이해하고 다양한 매체 자료에서 표현 효과를 평가한다.","e":"이 성취기준은 생각을 표현하는 언어 양식으로서 음성 언어와 문자 언어의 특성을 이해하고, 매체 자료에서 생성된 음성 언어 및 문자 언어의 표현 효과를 평가하는 능력을 기르기 위해 설정하였다. 음성 언어 및 문자 언어의 특성을 비교하되, 복합양식적 특성을 지니는 다양한 매체 자료에 사용된 언어 양식의 표현 효과를 학습하고, 표현하고자 하는 목적이나 핵심 주제가 같더라도 언어 양식이 다르면 전달되는 내용과 표현 효과가 다를 수 있음을 분석적, 비판적 시각으로 이해하고 평가할 수 있도록 한다.","k":"2022|국어|5~6학년|문법|1","r":"문법"},{"c":"6국04-02","y":"2022","s":"국어","g":"5~6학년","a":"문법","t":"표준어와 방언의 기능을 파악하고 언어 공동체와 국어생활과의 관계를 이해한다.","e":"이 성취기준은 국어 화자의 의사소통에서 표준어와 방언이 담당하는 기능이 다르다는 점을 알고, 자신이 속한 언어 공동체 특유의 한국어 변이형들로 인해 자신의 국어생활이 상황에 따라 다양하게 실현됨을 이해하도록 하기 위해 설정하였다. 방언의 형성과 존재 양상을 파악함으로써 지역적 요인에 따라 자연스럽게 한국어에 변이가 일어남을 이해하도록 하고, 이러한 다양성을 아우르는 언어 공동체 규준인 표준어의 개념과 필요성을 함께 다루도록 한다. 또한 의사소통의 공적⋅사적 상황에 따라, 상대방과의 거리감 조절 등 화자의 의도에 따라 표준어와 방언을 선택함으로써 다양한 의사소통 기능이 실현된다는 점을 확인할 수 있도록 한다.","k":"2022|국어|5~6학년|문법|1","r":"문법"},{"c":"6국04-03","y":"2022","s":"국어","g":"5~6학년","a":"문법","t":"고유어와 관용 표현의 쓰임과 가치를 이해하고 상황에 맞게 표현한다.","e":"이 성취기준은 고유어와 관용 표현의 쓰임과 가치를 이해하고 국어문화에 대한 관심과 우리말을 소중히 여기는 태도를 고양하기 위해 설정하였다. 한자어, 외래어와 함께 국어 어휘의 일부를 이루는 고유어의 특성과 가치, 고유어에 다양하게 발달해 있는 관용 표현의 특성과 쓰임에 대한 이해에 중점을 두되, 상황과 표현 의도에 따라 어휘를 적절하게 사용하고 외래어의 오⋅남용 방지 등 국어 순화의 필요성을 자각하며 실천할 수 있도록 한다.","k":"2022|국어|5~6학년|문법|1","r":"문법"},{"c":"6국04-04","y":"2022","s":"국어","g":"5~6학년","a":"문법","t":"문장 성분을 이해하고 호응 관계가 올바른 문장을 구성한다.","e":"이 성취기준은 문장을 구성하는 성분들 사이의 호응 관계가 올바르고 자연스러운 문장을 구성하는 데 필요한 능력을 기르기 위해 설정하였다. 문장에서 주어, 목적어, 서술어의 역할, 성분 간의 호응 관계(주어와 서술어의 호응, 목적어와 서술어의 호응)에 대해 학습하고, 이전 학년군의 높임 표현 및 동일 학년군의 시간 표현 성취기준과 연계하여 높임이나 시제의 일치를 함께 학습할 수 있다.","k":"2022|국어|5~6학년|문법|1","r":"문법"},{"c":"6국04-05","y":"2022","s":"국어","g":"5~6학년","a":"문법","t":"글과 담화에 쓰인 시간 표현을 이해하고 상황에 맞게 표현한다.","e":"이 성취기준은 효과적인 의사소통을 위해 상황 맥락에 맞게 시간 표현을 사용하는 것의 중요성을 알고 시간을 표현할 때 사용되는 언어 형식을 이해하고 활용하는 능력을 기르기 위해 설정하였다. ‘-았-/-었-, -는-/-ㄴ-, -겠-, -(으)ㄹ 것이-’나 시간 부사 등 글이나 담화에서 과거, 현재, 미래를 표현하는 언어 형식 및 방법을 학습하고, 다양한 상황 맥락에서 시간 표현을 사용한 후 그 적절성을 평가해 보도록 한다.","k":"2022|국어|5~6학년|문법|1","r":"문법"},{"c":"6국04-06","y":"2022","s":"국어","g":"5~6학년","a":"문법","t":"글과 담화에 쓰인 단어 및 문장, 띄어쓰기를 민감하게 살펴 바르게 고치는 태도를 지닌다.","e":"","k":"2022|국어|5~6학년|문법|1","r":"문법"},{"c":"6국05-01","y":"2022","s":"국어","g":"5~6학년","a":"문학","t":"작가의 의도를 생각하며 작품을 읽는다.","e":"이 성취기준은 작품을 만든 이에 대해 호기심을 가지고 작가라는 존재를 고려하면서 작품을 수용하는 능력을 기르게 하기 위해 설정하였다. 작가가 작품을 쓰게 된 계기나 상황을 생각하고, 작가의 취지와 의도를 헤아리면서 작품을 더 깊고 넓게 이해할 수 있게 한다. 또한 작가에 대한 관심을 바탕으로 작가의 다른 작품들도 찾아 읽는 태도를 가지며 능동적인 문학 향유자로 성장할 수 있게 한다. 아울러 다양한 상상의 세계를 펼쳐 보이는 창의성을 가진 인간에게 관심을 가짐으로써 학습자도 그러한 창의성을 가진 인간으로 성장하는 계기가 될 수 있게 한다. 다만 작품의 의미는 작가의 의도에 한정되는 것이 아니며, 다양한 독자들의 해석이 더해져서 계속 생성되어 가는 것이라는 점을 함께 생각하며 문학 소통에 적극적으로 참여할 수 있게 한다.","k":"2022|국어|5~6학년|문학|1","r":"문학"},{"c":"6국05-02","y":"2022","s":"국어","g":"5~6학년","a":"문학","t":"비유적 표현의 효과에 유의하여 작품을 감상한다.","e":"","k":"2022|국어|5~6학년|문학|1","r":"문학"},{"c":"6국05-03","y":"2022","s":"국어","g":"5~6학년","a":"문학","t":"소설이나 극을 읽고 인물, 사건, 배경을 파악한다.","e":"이 성취기준은 작품을 이루는 주요 요소를 중심으로 작품을 분석하고 이해하는 능력을 기르게 하기 위해 설정하였다. 작품 속 인물, 사건, 배경을 파악하고, 각 요소의 기능 및 요소 간 관계를 이해하도록 한다. 예를 들어 인물의 성격과 사건의 전개 과정 간의 관계, 인물의 성격이 사건 전개 과정에 끼치는 영향, 사건의 전개 과정과 배경과의 관련, 배경의 변화에 따른 사건 전개 과정의 변화 등을 파악하여 작품을 깊이 있게 감상한다. 나아가 이러한 요소의 역할이나 관계가 모든 작품에서 동일한 양상으로 나타나는 것이 아니며, 작품에 따라 특정 요소가 두드러지게 부각되기도 하고 요소 간의 관계가 독특하게 형성되기도 한다는 점을 생각하며 작품을 수용하게 한다.","k":"2022|국어|5~6학년|문학|1","r":"문학"},{"c":"6국05-04","y":"2022","s":"국어","g":"5~6학년","a":"문학","t":"인상적인 부분을 중심으로 작품에 대한 의견을 나눈다.","e":"이 성취기준은 학습자가 작품에 대한 자신의 생각을 적극적으로 표현하고, 이를 타인과 나눔으로써 보다 주체적인 문학 수용 능력을 기르게 하기 위해 설정하였다. 이를 위해 인상적인 장면을 중심으로 작품에 대한 의견을 나누되, 인상적이라고 생각하는 이유나 근거를 작품과 연결 지어 설명하도록 한다. 또한 상대방의 수용 경험에도 귀를 기울여 작품에 대한 해석이 다양한 관점에서 이루어질 수 있음을 알고 문학 소통에 즐겁게 참여하도록 한다.","k":"2022|국어|5~6학년|문학|1","r":"문학"},{"c":"6국05-05","y":"2022","s":"국어","g":"5~6학년","a":"문학","t":"자신의 경험을 시, 소설, 극, 수필 등 적절한 갈래로 표현한다.","e":"","k":"2022|국어|5~6학년|문학|1","r":"문학"},{"c":"6국05-06","y":"2022","s":"국어","g":"5~6학년","a":"문학","t":"작품을 읽고 자신의 삶과 연관 지어 성찰하는 태도를 지닌다.","e":"이 성취기준은 작품을 읽고 성찰하는 과정을 통해 자신을 돌아보는 것은 물론 자신이 속한 공동체의 삶에 대해서도 생각하게 하기 위해 설정하였다. 학습자가 작품을 적극적으로 수용하여 작품에 담긴 가치를 내면화하는 가운데 자신의 삶의 모습을 되돌아보게 한다. 또한 공동체의 다양한 문제를 다룬 작품을 읽을 때에도 먼저 자신의 삶을 돌아보고, 함께 살아가는 삶을 위해 공동체 구성원으로서 가져야 할 바람직한 자세나 태도에 대하여 생각해 보도록 한다.","k":"2022|국어|5~6학년|문학|1","r":"문학"},{"c":"6국06-01","y":"2022","s":"국어","g":"5~6학년","a":"매체","t":"정보 검색 도구를 활용하여 자신의 목적에 맞는 매체 자료를 찾는다.","e":"이 성취기준은 정보 검색 도구의 특성을 이해하고 적절한 정보 검색 전략을 수립하여 자신의 목적에 맞는 매체 자료를 찾아 활용하는 능력을 향상하기 위해 설정하였다. 정보 유형별로 검색 결과를 제시하는 정보 검색 도구의 기능을 이해한다. 또한 핵심 단어 중심으로 검색이 되는 정보 검색 도구의 특징을 이해하여 자신의 목적에 적합한 검색어를 만들 수 있도록 한다. 인터넷의 특성을 고려하여 정보 검색 과정에서 지속적인 성찰과 점검을 통해 자신의 목적에 부합한 자료 검색 과정이 이루어질 수 있도록 한다.","k":"2022|국어|5~6학년|매체|1","r":"매체"},{"c":"6국06-02","y":"2022","s":"국어","g":"5~6학년","a":"매체","t":"뉴스 및 각종 정보 매체 자료의 신뢰성을 평가한다.","e":"이 성취기준은 뉴스 및 각종 정보 매체의 매체 자료에 대해 신뢰성 측면을 중심으로 평가하는 능력을 기르기 위해 설정하였다. 뉴스 및 각종 정보 매체 자료는 개인과 공동체에 미치는 영향력이 크기 때문에 매체 자료를 수용할 때는 그것이 신뢰할 만한 것인지 평가하는 태도가 중요하다는 점을 이해하도록 한다. 매체 자료의 신뢰성은 제작자가 얼마나 해당 분야에 전문적이고 권위가 있는지, 실제 취재하거나 수집한 근거 자료를 기반으로 제작된 것인지, 근거 자료가 얼마나 정확하고 최신의 것이며 증빙 가능한 것인지 등의 측면에서 평가할 수 있다.","k":"2022|국어|5~6학년|매체|1","r":"매체"},{"c":"6국06-03","y":"2022","s":"국어","g":"5~6학년","a":"매체","t":"적합한 양식과 수용자의 반응을 고려하여 복합양식 매체 자료를 제작하고 공유한다.","e":"이 성취기준은 매체 및 매체 자료의 양식과 수용자에게 끼칠 영향을 고려하여 복합양식 자료를 제작하는 능력을 기르기 위해 설정하였다. 의도나 주제를 드러내는 다양한 표현 양식을 이해하고 자신의 목적, 주제, 수용자 반응을 고려하여 이미지가 포함된 글, 카드 뉴스, 발표 자료, 동영상 등의 복합양식 매체 자료를 제작한 다음 이를 공유하여 그 효과성을 점검한다.","k":"2022|국어|5~6학년|매체|1","r":"매체"},{"c":"6국06-04","y":"2022","s":"국어","g":"5~6학년","a":"매체","t":"자신의 매체 이용 양상에 대해 성찰한다.","e":"","k":"2022|국어|5~6학년|매체|1","r":"매체"},{"c":"4도01-01","y":"2022","s":"도덕","g":"3~4학년","a":"자신과의 관계","t":"자신의 감정을 소중히 여기며 존중하는 태도를 바탕으로 내가 누구인가를 탐구한다.","e":"","k":"2022|도덕|3~4학년|자신과의 관계|1","r":"자신과의 관계"},{"c":"4도01-02","y":"2022","s":"도덕","g":"3~4학년","a":"자신과의 관계","t":"정직의 의미를 알고 모범적인 사례를 탐색하여 바르게 행동하려는 태도를 기른다.","e":"","k":"2022|도덕|3~4학년|자신과의 관계|1","r":"자신과의 관계"},{"c":"4도01-03","y":"2022","s":"도덕","g":"3~4학년","a":"자신과의 관계","t":"성실한 생활의 모범 사례를 탐색하고 시간 관리를 위한 생활을 계획하여 지속적인 자기 성장을 모색한다.","e":"","k":"2022|도덕|3~4학년|자신과의 관계|1","r":"자신과의 관계"},{"c":"4도01-04","y":"2022","s":"도덕","g":"3~4학년","a":"자신과의 관계","t":"다른 사람의 관점을 수용할 수 있는지를 도덕적으로 검토하고 도덕규범을 내면화하여 도덕적으로 행동할 수 있는 자세를 기른다.","e":"","k":"2022|도덕|3~4학년|자신과의 관계|1","r":"자신과의 관계"},{"c":"4도02-01","y":"2022","s":"도덕","g":"3~4학년","a":"타인과의 관계","t":"효, 우애의 의미와 필요성을 명료하게 이해하고 가족의 행복을 위해 할 수 있는 일을 탐색하여 실천 계획을 세운다.","e":"","k":"2022|도덕|3~4학년|타인과의 관계|1","r":"타인과의 관계"},{"c":"4도02-02","y":"2022","s":"도덕","g":"3~4학년","a":"타인과의 관계","t":"친구 사이의 배려에 대한 올바른 이해를 바탕으로 일상생활에서 배려에 기반한 도덕적 관계를 맺을 수 있는 방안을 탐색한다.","e":"","k":"2022|도덕|3~4학년|타인과의 관계|1","r":"타인과의 관계"},{"c":"4도02-03","y":"2022","s":"도덕","g":"3~4학년","a":"타인과의 관계","t":"공감의 태도가 필요한 이유를 이해하고 도덕적 상상력을 바탕으로 대상과 상황에 따라 감정을 나누는 방법을 탐구하여 실천한다.","e":"","k":"2022|도덕|3~4학년|타인과의 관계|1","r":"타인과의 관계"},{"c":"4도03-01","y":"2022","s":"도덕","g":"3~4학년","a":"사회⋅공동체와의 관계","t":"불공정의 사례를 탐구하고, 일상생활에서 공정의 가치를 추구하는 활동을 통해 실천 의지를 함양한다.","e":"이 성취기준의 취지는 학생이 자신의 삶에서 공정이라는 가치에 관해 성찰하는 기회를 갖도록 하여 공정한 사회로 발전해가는 토대를 마련하려는 것이다. 학생이 공정과 불공정의 사례를 스스로 탐구하고 일상에서 공정을 실제로 추구하는 활동을 실천함으로써 공정의 가치를 생활화할 수 있도록 한다.","k":"2022|도덕|3~4학년|사회⋅공동체와의 관계|1","r":"사회⋅공동체와의 관계"},{"c":"4도03-02","y":"2022","s":"도덕","g":"3~4학년","a":"사회⋅공동체와의 관계","t":"디지털 사회에서 발생하는 다양한 문제를 살펴보고, 해결 방안을 탐구하여 정보통신 윤리에 대한 민감성을 기른다.","e":"","k":"2022|도덕|3~4학년|사회⋅공동체와의 관계|1","r":"사회⋅공동체와의 관계"},{"c":"4도03-03","y":"2022","s":"도덕","g":"3~4학년","a":"사회⋅공동체와의 관계","t":"통일의 필요성을 이해하고, 통일 감수성을 길러 바람직한 통일의 방향을 모색한다.","e":"","k":"2022|도덕|3~4학년|사회⋅공동체와의 관계|1","r":"사회⋅공동체와의 관계"},{"c":"4도04-01","y":"2022","s":"도덕","g":"3~4학년","a":"자연과의 관계","t":"생명 경시 사례를 조사하고 문제 해결 방법을 탐구함으로써 생명의 소중함을 이해한다.","e":"","k":"2022|도덕|3~4학년|자연과의 관계|1","r":"자연과의 관계"},{"c":"4도04-02","y":"2022","s":"도덕","g":"3~4학년","a":"자연과의 관계","t":"인간과 자연이 함께 살아야 하는 이유를 이해하고 공생을 위한 구체적인 실천 계획을 세우며 생태 감수성을 기른다.","e":"이 성취기준의 취지는 학생이 일상에서 자연스럽게 생태 감수성과 생태전환적 사고에 따라 실천하도록 하기 위한 것이다. 생태전환과 관련된 도덕적 쟁점을 마주할 때 단순히 생태 체험에만 그치지 않고, 인간중심 사고에서 벗어나 자연과의 공존을 위한 생각과 행동의 변화까지 모색한다.","k":"2022|도덕|3~4학년|자연과의 관계|1","r":"자연과의 관계"},{"c":"6도01-01","y":"2022","s":"도덕","g":"5~6학년","a":"자신과의 관계","t":"자주적인 삶에 대한 이해를 바탕으로 자신의 생활계획을 세우고 실천하여 주체적인 삶의 태도를 기른다.","e":"","k":"2022|도덕|5~6학년|자신과의 관계|1","r":"자신과의 관계"},{"c":"6도01-02","y":"2022","s":"도덕","g":"5~6학년","a":"자신과의 관계","t":"생활 습관에 대한 성찰을 통해 자기 생활을 점검하고 올바른 계획을 세워 이를 실천한다.","e":"이 성취기준의 취지는 자신의 행동에 대한 문제점을 확인하고 재정립하도록 하여 반성하는 태도를 기르기 위한 것이다. 학생이 스스로 자기 행동의 문제를 인식하고 개선하려 노력함으로써 바른 도덕 생활의 토대를 마련하도록 한다.","k":"2022|도덕|5~6학년|자신과의 관계|1","r":"자신과의 관계"},{"c":"6도01-03","y":"2022","s":"도덕","g":"5~6학년","a":"자신과의 관계","t":"자기가 하고 싶은 일을 선택할 때 도덕적 고려의 필요성을 알고 자신의 특기와 적성을 탐색하여 진로계획을 수립한다.","e":"","k":"2022|도덕|5~6학년|자신과의 관계|1","r":"자신과의 관계"},{"c":"6도02-01","y":"2022","s":"도덕","g":"5~6학년","a":"타인과의 관계","t":"봉사의 의미와 중요성을 이해하고, 타인이 처한 상황과 환경에 대한 주의 깊은 관심을 바탕으로 봉사를 실천한다.","e":"이 성취기준의 취지는 봉사의 의미와 중요성을 지식적으로만 이해하는 것에 그치지 않고 타인의 환경에 대한 관심을 바탕으로 생활 속에서 자연스럽게 봉사를 실천할 수 있는 역량을 함양하기 위한 것이다. 타인을 위한 봉사 경험을 통해 학생에게 진정한 이타심과 봉사 의지를 다지고 고양할 기회를 제공하도록 한다.","k":"2022|도덕|5~6학년|타인과의 관계|1","r":"타인과의 관계"},{"c":"6도02-02","y":"2022","s":"도덕","g":"5~6학년","a":"타인과의 관계","t":"편견이 발생하는 이유를 탐색하여 해결 방안을 살펴보고, 다양성 존중을 바탕으로 다른 사람과 올바른 관계를 맺기 위한 실천 방안을 탐구한다.","e":"","k":"2022|도덕|5~6학년|타인과의 관계|1","r":"타인과의 관계"},{"c":"6도02-03","y":"2022","s":"도덕","g":"5~6학년","a":"타인과의 관계","t":"인간과 인공지능 로봇 간의 다양한 관계를 파악하고 도덕에 기반을 둔 관계 형성의 필요성을 탐구한다.","e":"","k":"2022|도덕|5~6학년|타인과의 관계|1","r":"타인과의 관계"},{"c":"6도03-01","y":"2022","s":"도덕","g":"5~6학년","a":"사회⋅공동체와의 관계","t":"인권과 관련된 다양한 사례를 살펴보고 인권에 관한 감수성을 길러 이를 실천하려는 의지를 함양한다.","e":"","k":"2022|도덕|5~6학년|사회⋅공동체와의 관계|1","r":"사회⋅공동체와의 관계"},{"c":"6도03-02","y":"2022","s":"도덕","g":"5~6학년","a":"사회⋅공동체와의 관계","t":"정의에 관한 관심을 토대로 공동체 규칙의 중요성을 살펴보고 직접 공정한 규칙을 고안하며 기초적인 시민의식을 기른다.","e":"","k":"2022|도덕|5~6학년|사회⋅공동체와의 관계|1","r":"사회⋅공동체와의 관계"},{"c":"6도03-03","y":"2022","s":"도덕","g":"5~6학년","a":"사회⋅공동체와의 관계","t":"통일과정과 통일 이후 사회의 여러 가지 상황을 예상하고 바람직한 통일과정과 통일 국가의 사회상을 제시한다","e":"","k":"2022|도덕|5~6학년|사회⋅공동체와의 관계|1","r":"사회⋅공동체와의 관계"},{"c":"6도03-04","y":"2022","s":"도덕","g":"5~6학년","a":"사회⋅공동체와의 관계","t":"다른 나라 사람들이 처한 여러 가지 상황을 종합적으로 이해하고 해결 방안을 탐구하며 인류애를 기른다.","e":"","k":"2022|도덕|5~6학년|사회⋅공동체와의 관계|1","r":"사회⋅공동체와의 관계"},{"c":"6도04-01","y":"2022","s":"도덕","g":"5~6학년","a":"자연과의 관계","t":"지구의 환경 위기 상황을 이해하고, 이를 극복하기 위한 다양한 방안을 찾아 자신의 일상에서 실천하고자 노력한다.","e":"","k":"2022|도덕|5~6학년|자연과의 관계|1","r":"자연과의 관계"},{"c":"6도04-02","y":"2022","s":"도덕","g":"5~6학년","a":"자연과의 관계","t":"지속가능한 삶의 의미를 탐구하고 미래 세대에 대한 책임을 강화하여 자연의 다양성을 존중하고 생산성을 유지할 수 있는 미래를 위한 실천 방안을 찾는다.","e":"","k":"2022|도덕|5~6학년|자연과의 관계|1","r":"자연과의 관계"},{"c":"4미01-01","y":"2022","s":"미술","g":"3~4학년","a":"미적 체험","t":"자연물과 인공물을 탐색하는 데 다양한 감각을 활용할 수 있다.","e":"","k":"2022|미술|3~4학년|미적 체험|1","r":"미적 체험"},{"c":"4미01-02","y":"2022","s":"미술","g":"3~4학년","a":"미적 체험","t":"주변 대상을 체험하며 떠오른 느낌과 생각을 다양한 방법으로 나타낼 수 있다.","e":"","k":"2022|미술|3~4학년|미적 체험|1","r":"미적 체험"},{"c":"4미01-03","y":"2022","s":"미술","g":"3~4학년","a":"미적 체험","t":"미적 탐색에 호기심을 갖고 참여하며 자신의 감각으로 대상의 특징을 이해할 수 있다.","e":"성취기준은 객관적 지식을 적용하거나 고정 관념에 따라 대상을 이해하는 방식에서 벗어나 몸의 다양한 감각으로 직접 대상을 탐색하는 데 호기심을 갖고 참여하며 자신의 감각을 바탕으로 대상의 특징을 이해하는 데 중점을 둔다. 같은 대상이라도 지각하고 반응하는 방식은 학생마다 다를 수 있다. 대상을 지각하며 자연스럽게 떠올린 자신의 감정, 느낌, 생각 등을 나타내고 친구들의 다양한 반응을 접하며 자신만의 고유한 감각을 통해 대상이 지닌 다채로운 특징을 이해한다.","k":"2022|미술|3~4학년|미적 체험|1","r":"미적 체험"},{"c":"4미01-04","y":"2022","s":"미술","g":"3~4학년","a":"미적 체험","t":"생활 속에서 활용되는 미술에 관심을 가지고 미술의 특징과 역할을 발견할 수 있다.","e":"","k":"2022|미술|3~4학년|미적 체험|1","r":"미적 체험"},{"c":"4미02-01","y":"2022","s":"미술","g":"3~4학년","a":"표현","t":"관찰과 상상으로 아이디어를 떠올려 표현 주제를 구체화할 수 있다.","e":"","k":"2022|미술|3~4학년|표현|1","r":"표현"},{"c":"4미02-02","y":"2022","s":"미술","g":"3~4학년","a":"표현","t":"기본적인 표현 재료와 용구의 특성을 이해하고 사용 방법을 익힐 수 있다.","e":"성취기준은 기본적인 표현 재료의 물성을 경험하고 표현 용구의 사용법을 충분히 익히는 활동에 중점을 둔다. 표현 재료와 용구는 단순히 표현 수단을 넘어 그 자체로서 학생들에게 새로운 느낌과 생각을 가지게 한다. 초등학교 3~4학년 수준에서 다룰 수 있는 기본적인 표현 재료에는 종이류(도화지, 색종이, 한지 등), 드로잉 재료(연필, 펜 등), 채색 재료(크레파스, 파스텔, 수채화물감, 아크릴물감, 먹 등), 조소 재료(찰흙, 종이죽, 공예용 철사 등)가 있으며 그 밖에 생활 속에서 익숙하게 다루고 있는 다양한 생활용품 및 디지털 매체를 활용할 수 있다.","k":"2022|미술|3~4학년|표현|1","r":"표현"},{"c":"4미02-03","y":"2022","s":"미술","g":"3~4학년","a":"표현","t":"조형 요소의 특징을 자유롭게 탐색하며 주제 표현에 알맞게 활용할 수 있다.","e":"성취기준은 미술 표현에 기초가 되는 조형 요소의 특징을 탐색하고 표현 주제와 연결 지어 조형 요소를 활용하는 데 중점을 둔다. 조형 요소에는 선, 형과 형태, 색, 질감, 양감 등이 있다. 각 조형 요소를 탐색하여 시각적 특징을 발견하고 표현하고자 하는 주제와 어울리는 조형 요소를 찾아 주제 표현에 활용한다.","k":"2022|미술|3~4학년|표현|1","r":"표현"},{"c":"4미02-04","y":"2022","s":"미술","g":"3~4학년","a":"표현","t":"표현 의도를 가지고 작품을 제작하며 자기 작품을 소중히 여길 수 있다.","e":"성취기준은 작품 제작을 위한 계획 단계부터 작품을 완성한 후 발표 및 전시에 이르기까지 학생들의 제작 의도와 작품을 대하는 태도에 중점을 둔다. 작품 제작에 분명한 의도를 갖는 것은 주도적으로 작품을 제작하는 바탕이 되어 표현 재료와 용구, 조형 요소의 특징을 탐색하여 작품에 활용하는 일련의 과정을 이끈다. 또한, 자신의 의도에 따라 주도적으로 제작한 작품에는 특별한 의미가 부여되어 작품을 소중히 여기는 태도로 이어질 수 있다.","k":"2022|미술|3~4학년|표현|1","r":"표현"},{"c":"4미02-05","y":"2022","s":"미술","g":"3~4학년","a":"표현","t":"미술과 타 교과를 관련지어 주제를 표현하는데 흥미를 가질 수 있다.","e":"","k":"2022|미술|3~4학년|표현|1","r":"표현"},{"c":"4미03-01","y":"2022","s":"미술","g":"3~4학년","a":"감상","t":"미술 작품을 자세히 보고 작품과 미술가에 관해 질문할 수 있다.","e":"성취기준은 작품에 대한 교사의 질문이나 조사에 의존하는 감상 방식에서 벗어나 학생들이 작품을 충분히 보고 자신의 느낌과 생각을 바탕으로 질문을 만들어 상호 작용하는 데 중점을 둔다. 질문하기를 통한 감상은 작품과 나누는 대화의 시작이다. 작품 정보를 활용한 질문, 작품의 내용이나 형식에 관한 질문, 작가의 입장이 되어 던지는 질문 등 다양한 질문을 통하여 학생들이 감상에 흥미를 느끼고 감상 관점을 기르도록 한다.","k":"2022|미술|3~4학년|감상|1","r":"감상"},{"c":"4미03-02","y":"2022","s":"미술","g":"3~4학년","a":"감상","t":"미술 작품의 특징과 작품에 관한 자신의 느낌과 생각을 설명할 수 있다.","e":"","k":"2022|미술|3~4학년|감상|1","r":"감상"},{"c":"4미03-03","y":"2022","s":"미술","g":"3~4학년","a":"감상","t":"미술 문화에 관심을 가지고 전시 및 행사에 참여할 수 있다.","e":"","k":"2022|미술|3~4학년|감상|1","r":"감상"},{"c":"4미03-04","y":"2022","s":"미술","g":"3~4학년","a":"감상","t":"작품 감상에 흥미를 가지고 참여하며 작품에 대한 자신의 감상 관점을 존중할 수 있다.","e":"","k":"2022|미술|3~4학년|감상|1","r":"감상"},{"c":"6미01-01","y":"2022","s":"미술","g":"5~6학년","a":"미적 체험","t":"다양한 감각과 매체를 활용하여 자신과 대상을 탐색할 수 있다.","e":"","k":"2022|미술|5~6학년|미적 체험|1","r":"미적 체험"},{"c":"6미01-02","y":"2022","s":"미술","g":"5~6학년","a":"미적 체험","t":"자신이나 주변 환경에서 찾은 감각적 특징, 느낌, 생각 등을 관련지어 나타낼 수 있다.","e":"성취기준은 자신이나 대상, 그리고 시시각각 변화하는 현상 등 주변 환경을 탐색하며 예민하게 찾은 감각적 특징과 체험 과정에서 떠오른 느낌과 생각을 관련지어 보는 경험에 중점을 둔다. 미술의 특성상 시각적 특징을 우선 다루게 되지만, 보이지 않아도 느낄 수 있는 특징이나 느낌과 상상이 반영된 색, 형, 이미지, 문구, 소리, 움직임 등을 자유롭게 활용한다. 이를 통해 감각이 사고에 미치는 영향뿐만 아니라 자신과 환경 사이의 관계를 이해한다.","k":"2022|미술|5~6학년|미적 체험|1","r":"미적 체험"},{"c":"6미01-03","y":"2022","s":"미술","g":"5~6학년","a":"미적 체험","t":"주변 환경에 대한 민감한 태도로 대상과 상호 작용하며 새로운 의미를 발견할 수 있다.","e":"성취기준은 주변 환경 속 대상과 민감하게 상호 작용하며 경험한 느낌과 생각을 바탕으로 대상에 이름 붙이기, 자신을 닮은 대상 찾기, 대상을 연결하여 이야기 만들기 등 대상에 의미를 부여하는 활동에 중점을 둔다. 보는 사람, 시간과 장소, 분위기 등에 따라 대상과 다양하게 교감하며 그 과정에서 생성되는 의미를 성찰할 수 있도록 한다. 이를 통해 예술적 사고를 이끄는 대상의 가치를 이해하고 자신과 환경과의 생태 전환적 관계를 인식한다.","k":"2022|미술|5~6학년|미적 체험|1","r":"미적 체험"},{"c":"6미01-04","y":"2022","s":"미술","g":"5~6학년","a":"미적 체험","t":"이미지가 나타내는 의미를 비판적으로 이해하고 느낌과 생각을 전달하는 데 활용할 수 있다.","e":"","k":"2022|미술|5~6학년|미적 체험|1","r":"미적 체험"},{"c":"6미02-01","y":"2022","s":"미술","g":"5~6학년","a":"표현","t":"다양한 방법으로 아이디어를 연결하여 확장된 표현 주제로 발전시킬 수 있다.","e":"","k":"2022|미술|5~6학년|표현|1","r":"표현"},{"c":"6미02-02","y":"2022","s":"미술","g":"5~6학년","a":"표현","t":"디지털 매체 등 다양한 표현 재료와 용구를 탐색하여 작품 제작에 활용할 수 있다.","e":"성취기준은 하나의 표현 주제에도 다양한 표현 방식이 있음을 이해하고 학생들이 자신의 의도에 따라 표현 재료와 방법을 선택하여 작품을 제작하는 데 중점을 둔다. 표현 주제에 적합한 표현 재료와 용구의 쓰임을 학생 스스로 탐색하고 습득하여 주제가 잘 드러날 수 있도록 적용하게 한다. 특히, 디지털 매체는 신체적 감각과 지각을 확장하는 표현의 도구로써 디지털 매체의 특징과 사용법을 익혀 작품 제작에 효과적으로 활용하게 한다.","k":"2022|미술|5~6학년|표현|1","r":"표현"},{"c":"6미02-03","y":"2022","s":"미술","g":"5~6학년","a":"표현","t":"조형 요소의 어울림을 통해 조형 원리를 이해하고 주제 표현에 연결할 수 있다.","e":"","k":"2022|미술|5~6학년|표현|1","r":"표현"},{"c":"6미02-04","y":"2022","s":"미술","g":"5~6학년","a":"표현","t":"주제 표현에 의지를 갖고 표현 과정을 돌아보며 작품을 발전시킬 수 있다.","e":"성취기준은 계획 단계를 비롯한 작품 완성의 전 과정에서 주제 표현에 의지를 갖고 표현 방법과 절차를 재고하는 성찰의 태도를 기르는 데 중점을 둔다. 주제 표현의 의지를 갖는 것은 표현 주제를 나타내기 위해 다양한 표현 재료와 용구, 조형 요소와 원리를 작품에 활용하는 일련의 과정을 이끈다. 또한 작품을 주도적으로 돌아보고 보완하며 발전시키는 경험을 통해 학생들은 작품 완성의 기준을 스스로 설정하고 창작에 대한 상위 인지를 활성화한다.","k":"2022|미술|5~6학년|표현|1","r":"표현"},{"c":"6미02-05","y":"2022","s":"미술","g":"5~6학년","a":"표현","t":"미술과 타 교과의 내용과 방법을 융합하는 활동을 자유롭게 시도할 수 있다.","e":"","k":"2022|미술|5~6학년|표현|1","r":"표현"},{"c":"6미03-01","y":"2022","s":"미술","g":"5~6학년","a":"감상","t":"미술 작품을 작품이 만들어진 시대적, 지역적 배경 등과 연결하여 이해할 수 있다.","e":"","k":"2022|미술|5~6학년|감상|1","r":"감상"},{"c":"6미03-02","y":"2022","s":"미술","g":"5~6학년","a":"감상","t":"미술 작품의 내용(소재, 주제 등)과 형식(재료와 용구, 표현 방법, 조형 요 과 느낌을 글, 그림, 심상지도 등의 다양한 방식으로 표현하고, 이를 통해 사람마다 장소감의 차이가 나타날 수 있음을 이해하도록 설정한 것이다. 장소감이란 장소에 대한 인지, 감정, 태도, 행동을 포괄하는 것으로 개인이나 집단이 장소에 부여하는 의미나 관심을 뜻한다. 장소 경험을 공유하는 과정에서 장소감의 차이를 이해하고 서로 존중하며, 주변의 장소를 알아가면서 이에 대한 관심을 심화시키는 데 초점을 맞춘다.","k":"2022|사회|3~4학년|우리가 사는 곳|1","r":"지리 인식","x":"지속가능한 세계"},{"c":"4사01-02","y":"2022","s":"사회","g":"3~4학년","a":"우리가 사는 곳","t":"주변의 여러 장소를 살펴보고, 우리가 사는 곳을 더 살기 좋은 곳으로 만드는 방안을 탐색한다.","e":"학생들이 생활하는 데 편익을 제공하는 주요 장소 및 시설이나 기관을 살펴보고, 우리가 사는 곳을 더 살기 좋은 곳으로 만드는 방안을 찾아보도록 설정한 것이다. 특히, 우리가 사는 곳의 놀이⋅여가, 안전, 교육⋅문화, 건강⋅의료 등과 관련 있는 장소를 조사하여 좋은 점, 불편한 점 등을 확인하고, 학생들의 관점에서 살기 좋은 곳의 조건을 생각하면서 우리가 사는 곳에 관심을 가지도록 하는 데 중점을 둔다.","k":"2022|사회|3~4학년|우리가 사는 곳|1","r":"지리 인식","x":"지속가능한 세계"},{"c":"4사02-01","y":"2022","s":"사회","g":"3~4학년","a":"일상에서 만나는 과거","t":"일상 속에서 시간의 흐름을 경험할 수 있는 사례를 살펴보고, 이를 바탕으로 역사의 시간 개념을 이해한다.","e":"가정, 학교 등 학생 주변의 사례를 활용하여 역사의 시간 개념을 이해하도록 설정한 것이다. 역사에서 자주 사용하는 시간 표현 용어, 시간의 흐름 속에서 어떤 사건의 시간상 위치를 파악하는 등 역사의 시간 개념을 이해한다.","k":"2022|사회|3~4학년|일상에서 만나는 과거|1","r":"역사 일반"},{"c":"4사02-02","y":"2022","s":"사회","g":"3~4학년","a":"일상에서 만나는 과거","t":"오래된 물건이나 자료들을 주변에서 찾아보고, 이를 통해 과거의 모습을 살펴볼 수 있음을 이해한다.","e":"주변의 오래된 물건이나 자료 등이 과거 모습을 알려주는 증거 역할을 한다는 것을 이해하도록 설정한 것이다. 학생의 애장품을 비롯해 생활 주변에서 볼 수 있는 오래된 물건이나 자료(신문 기사, 편지, 일기, 노래 가사, 사진 등), 주변 사람들의 증언 등을 활용한다.","k":"2022|사회|3~4학년|일상에서 만나는 과거|1","r":"역사 일반"},{"c":"4사02-03","y":"2022","s":"사회","g":"3~4학년","a":"일상에서 만나는 과거","t":"지역의 변화상을 보여주는 역사 자료를 분석하여 지역 사람들의 달라진 생활 모습을 파악한다.","e":"지역 사람들의 달라진 생활 모습을 탐구하며 역사의 변화와 지속을 이해하도록 설정한 것이다. 지역의 유래와 관련된 이야기, 지역의 변화를 알려주는 사진이나 영상 등 역사 자료를 활용하여 (변형되어, 혹은 그대로) 이어져 내려온 것, 사라진 것을 찾아 지역 사람들의 생활이 어떻게 달라졌는지 살펴본다.","k":"2022|사회|3~4학년|일상에서 만나는 과거|1","r":"역사 일반"},{"c":"4사03-01","y":"2022","s":"사회","g":"3~4학년","a":"사회 변화와 다양한 문화","t":"최근 사회 변화의 양상과 특징을 파악하고, 그로 인해 나타난 생활모습의 변화를 탐색한다.","e":"사례를 통해 저출산, 고령화, 지능정보화 등 최근 사회 변화가 가져온 현상과 특징을 파악하고, 그로 인해 우리의 생활 모습이 어떻게 변화되는지 분석하도록 설정한 것이다. 이를 통하여 사회 변화에 대응할 수 있는 역량을 기르는 데 초점을 맞추도록 한다.","k":"2022|사회|3~4학년|사회 변화와 다양한 문화|1","r":"사회⋅문화"},{"c":"4사03-02","y":"2022","s":"사회","g":"3~4학년","a":"사회 변화와 다양한 문화","t":"우리 사회에 다양한 문화가 확산되면서 나타나는 긍정적 효과와 문제를 분석하고, 나와 다른 사람이나 집단의 문화를 존중하는 태도를 기른다.","e":"외국인 이주민의 증가, 1인 가구와 비혼, 반려동물 양육 등 다양한 문화가 확산⋅공유되면서 나타나는 긍정적 효과와 사회문제를 사례 또는 통계 자료를 통해 파악하도록 설정한 것이다. 이를 바탕으로 나와 다른 사람들의 삶의 방식이나 문화를 존중하는 태도를 함양하는 데 초점을 맞춘다.","k":"2022|사회|3~4학년|사회 변화와 다양한 문화|1","r":"사회⋅문화"},{"c":"4사04-01","y":"2022","s":"사회","g":"3~4학년","a":"옛날과 오늘날의 생활 모습","t":"옛날 풍습에 대해 알아보고, 오늘날과 비교하여 변화상을 파악한다.","e":"옛날의 다양한 풍습을 살펴보며 당시 사람들의 생활을 이해하고, 오늘날과 비교하여 변화상을 파악하도록 설정한 것이다. 놀이, 세시 풍속 등 여러 풍습을 통해 변화상을 알아보고 풍습 속에 담긴 옛날 사람들의 생활과 생각을 이해한다.","k":"2022|사회|3~4학년|옛날과 오늘날의 생활 모습|1","r":"사회⋅문화","x":"역사 일반"},{"c":"4사04-02","y":"2022","s":"사회","g":"3~4학년","a":"옛날과 오늘날의 생활 모습","t":"옛날부터 오늘날까지 교통의 변화에 따른 이동과 생활 모습의 변화를 이해한다.","e":"교통로 및 교통수단의 변화와 달라진 사람들의 생활 모습과의 관계를 이해하도록 설정한 것이다. 시대에 따른 교통의 변화가 사람과 물자의 이동 및 생활 전반에 어떤 변화를 일으켰는지 살펴본다. 그리고 교통 발달에 따른 생활공간의 확대를 고려하여 변화를 설명한다.","k":"2022|사회|3~4학년|옛날과 오늘날의 생활 모습|1","r":"사회⋅문화","x":"역사 일반"},{"c":"4사04-03","y":"2022","s":"사회","g":"3~4학년","a":"옛날과 오늘날의 생활 모습","t":"옛날부터 오늘날까지 통신수단의 변화에 따른 정보 교류와 의사소통 방식의 변화를 설명한다.","e":"시대에 따른 통신수단의 변화 과정을 파악하고 이를 통해 달라진 사람들의 생활 모습을 파악하도록 설정한 것이다. 정보 교류와 의사소통 방식의 변화를 파악하여 통신 발달에 따른 공간적 변화를 탐색한다.","k":"2022|사회|3~4학년|옛날과 오늘날의 생활 모습|1","r":"사회⋅문화","x":"역사 일반"},{"c":"4사05-01","y":"2022","s":"사회","g":"3~4학년","a":"지도로 만나는 우리 지역","t":"우리 지역을 표현한 다양한 종류의 지도를 찾아보고, 지도의 요소를 이해한다.","e":"우리 지역을 표현한 다양한 종류의 지도를 탐색하고, 우리 지역의 지도를 활용하여 방위, 기호와 범례, 축척, 높낮이 표현 방식 등 지도 제작에 필요한 요소를 파악하도록 설정한 것이다. 여기서는 지도의 요소를 이해하여 일상생활에서 지도를 활용하는 데 초점을 맞춘다.","k":"2022|사회|3~4학년|지도로 만나는 우리 지역|1","r":"지리 인식"},{"c":"4사05-02","y":"2022","s":"사회","g":"3~4학년","a":"지도로 만나는 우리 지역","t":"지도에서 우리 지역의 위치를 파악하고, 우리 지역의 지리 정보를 탐색한다.","e":"행정구역을 나타낸 지도에서 지역의 위치를 파악하고, 지역의 지리 정보를 바탕으로 지역의 특징을 탐구하도록 설정한 것이다. 우리나라 지도에서 시⋅도 단위의 행정구역을 파악하면서 우리 지역(시⋅군⋅구)의 위치를 확인하고, 지역의 지리 정보(위치, 면적, 인구, 지형, 기온, 강수량 등)를 다른 지역과 비교하여 지역이 지닌 특징을 이해하는 데 초점을 맞춘다.","k":"2022|사회|3~4학년|지도로 만나는 우리 지역|1","r":"지리 인식"},{"c":"4사06-01","y":"2022","s":"사회","g":"3~4학년","a":"우리 지역의 문화유산","t":"지역의 문화유산을 통해 문화유산의 의미와 유형을 알아보고, 문화유산의 가치를 탐색한다.","e":"문화유산에 관한 기본 지식 및 가치를 지역의 문화유산을 통해 이해하도록 설정한 것이다. 지역 문화유산을 통해 문화유산의 의미와 유형을 알아보고, 이를 토대로 옛날 사람들의 생활 모습을 추론하며 과거와 현재를 이어주는 귀중한 자료로서 문화유산의 가치를 파악한다.","k":"2022|사회|3~4학년|우리 지역의 문화유산|1","r":"지역사"},{"c":"4사06-02","y":"2022","s":"사회","g":"3~4학년","a":"우리 지역의 문화유산","t":"지역의 박물관, 기념관, 유적지 등을 체험하고 지역의 역사를 이해한다.","e":"지역에 있는 박물관, 기념관, 유적지 등을 방문하여 지역의 역사를 이해하기 위해 설정한 것이다. 박물관, 기념관, 유적지 등을 온오프라인으로 방문하여 학생이 주도적으로 지역의 역사에 관한 지식을 습득하고 해석하며 표현한다. 그리고 지역의 역사를 보존하고 실천하는 태도를 기른다.","k":"2022|사회|3~4학년|우리 지역의 문화유산|1","r":"지역사"},{"c":"4사07-01","y":"2022","s":"사회","g":"3~4학년","a":"경제활동과 지역 간 교류","t":"자원의 희소성으로 인해 경제활동에서 선택의 문제가 발생함을 이해하고, 경제활동에서 합리적 선택의 방법을 탐색한다.","e":"자원의 희소성 개념을 이해하고, 이를 바탕으로 경제활동에서 합리적 선택의 방법을 파악하도록 설정한 것이다. 여기서는 경제활동에서 선택의 문제가 발생하는 이유와 합리적 선택의 중요성을 이해하는 데 초점을 맞춘다.","k":"2022|사회|3~4학년|경제활동과 지역 간 교류|1","r":"경제"},{"c":"4사07-02","y":"2022","s":"사회","g":"3~4학년","a":"경제활동과 지역 간 교류","t":"생산과 소비 활동을 파악하고, 인적⋅물적 교류의 사례를 통해 각 지역 및 사람들이 상호의존 관계를 맺고 있음을 탐색한다.","e":"생산과 소비의 개념을 이해하고, 한 지역의 생산과 소비 활동이 다른 지역과 상호의존 관계에 있음을 이해하도록 설정한 것이다. 여기서는 지역에서 이루어지는 생산과 소비 활동의 사례를 통하여 한 지역의 경제활동이 다른 지역과 상호 의존 관계에 있다는 사실을 파악하는 데 초점을 맞춘다.","k":"2022|사회|3~4학년|경제활동과 지역 간 교류|1","r":"경제"},{"c":"4사08-01","y":"2022","s":"사회","g":"3~4학년","a":"민주주의와 자치","t":"학교 자치 사례를 통하여 민주주의의 의미를 이해하고, 학교생활에서 민주주의를 실천하는 능력을 기른다.","e":"학교 자치 사례를 통해 민주주의의 의미를 이해하고, 이를 바탕으로 학교생활에서 학교 자치를 실천할 수 있도록 설정한 것이다. 여기서는 학생이 학교 자치를 통해 민주주의를 실천하고 참여할 수 있는 능력을 기르는 데 초점을 맞춘다.","k":"2022|사회|3~4학년|민주주의와 자치|1","r":"정치"},{"c":"4사08-02","y":"2022","s":"사회","g":"3~4학년","a":"민주주의와 자치","t":"지역에서 이루어지는 민주주의 사례를 통해 주민 자치와 주민 참여의 중요성을 파악하고, 지역사회의 문제 해결에 참여하는 태도를 기른다.","e":"민주주의의 의미에 기초하여 마을이나 지역에서 이루어지는 주민 자치와 참여의 중요성을 파악하도록 설정한 것이다. 여기서는 마을이나 지역사회에서 이루어지는 민주주의의 사례를 통해 주민 자치와 주민 참여의 중요성을 이해하고 지역사회의 문제 해결에 관심을 갖고 참여하는 태도를 기르는 것에 초점을 맞춘다.","k":"2022|사회|3~4학년|민주주의와 자치|1","r":"정치"},{"c":"4사09-01","y":"2022","s":"사회","g":"3~4학년","a":"지역문제를 해결하고 지역을 알리는 노력","t":"생활 주변에서 찾을 수 있는 여러 가지 문제를 파악하고, 그 문제를 합리적으로 해결하는 능력을 기른다.","e":"각 지역에서 발생하는 문제를 민주적 방식으로 해결하는 과정과 방법을 습득하도록 설정한 것이다. 지리적 문제, 환경 문제, 사회적 문제, 역사적 문제 등 다양한 문제를 찾아서 토론을 통해 합리적으로 해결하는 방법과 능력을 배우는 데 초점을 맞춘다.","k":"2022|사회|3~4학년|지역문제를 해결하고 지역을 알리는 노력|1","r":"인문환경과 인간생활","x":"경제"},{"c":"4사09-02","y":"2022","s":"사회","g":"3~4학년","a":"지역문제를 해결하고 지역을 알리는 노력","t":"지역의 자연환경, 역사, 문화, 생산물 등을 알리려는 지역사회의 노력을 알고 관심을 갖는다.","e":"지역의 자연환경, 역사, 문화, 생산물 등을 알리기 위한 여러 활동을 조사하면서 지역을 이해하도록 설정한 것이다. 여기서는 지역의 자연환경, 역사, 문화, 생산물 등을 살펴보고, 지역에 관심을 가지며, 지역사회에 참여하는 태도를 기르는 데 주안점을 둔다.","k":"2022|사회|3~4학년|지역문제를 해결하고 지역을 알리는 노력|1","r":"인문환경과 인간생활","x":"경제"},{"c":"4사10-01","y":"2022","s":"사회","g":"3~4학년","a":"다양한 환경과 삶의 모습","t":"여러 지역의 자연환경과 인문환경의 특징을 살펴보고, 환경의 이용과 개발에 따른 변화를 탐구한다.","e":"우리 지역과 다른 자연환경 및 인문환경이 나타나는 곳을 살펴보고, 환경의 이용과 개발로 변화한 모습을 탐구하도록 설정한 것이다. 여기서는 다양한 환경 특성을 파악하고, 개발로 인해 나타난 긍정적, 부정적 변화 모습을 균형 잡힌 관점으로 파악하는 데 중점을 둔다.","k":"2022|사회|3~4학년|다양한 환경과 삶의 모습|1","r":"자연환경과 인간생활","x":"인문환경과 인간생활"},{"c":"4사10-02","y":"2022","s":"사회","g":"3~4학년","a":"다양한 환경과 삶의 모습","t":"사례에서 도시의 인구, 교통, 산업 등의 특징을 탐구하고, 도시에서의 삶의 모습을 이해한다.","e":"우리나라 여러 도시의 특징을 탐구하면서 도시에서 나타나는 삶의 모습을 종합적으로 이해하도록 설정한 것이다. 사례에서 도시의 경관, 인구, 교통, 산업, 생활방식의 특징을 이해하고 도시 생활의 좋은 점과 문제들을 파악하는 데 중점을 둔다.","k":"2022|사회|3~4학년|다양한 환경과 삶의 모습|1","r":"자연환경과 인간생활","x":"인문환경과 인간생활"},{"c":"6사01-01","y":"2022","s":"사회","g":"5~6학년","a":"우리나라 국토 여행","t":"우리나라 산지, 하천, 해안 지형의 위치를 확인하고 지형의 분포 특징을 탐구한다.","e":"우리나라 주요 산지, 하천, 해안 지형의 위치를 지도에서 확인하고 그 분포 특징을 파악하도록 설정한 것이다. 이를 바탕으로 국토 환경에 대한 기초적인 지식을 기르는 데 중점을 둔다.","k":"2022|사회|5~6학년|우리나라 국토 여행|1","r":"지리 인식","x":"자연환경과 인간생활"},{"c":"6사01-02","y":"2022","s":"사회","g":"5~6학년","a":"우리나라 국토 여행","t":"독도의 지리적 특성과 독도에 대한 역사 기록을 바탕으로 영토로서 독도의 중요성을 이해한다.","e":"독도의 위치, 지형, 기후, 동식물 등의 지리적 특성을 파악하고 독도에 대한 역사 기록을 탐구하여 영토 주권 의식을 기르도록 설정한 것이다. 이를 바탕으로 영토로서 독도의 가치를 인식하고 위상을 확인하는 데 주안점을 둔다.","k":"2022|사회|5~6학년|우리나라 국토 여행|1","r":"지리 인식","x":"자연환경과 인간생활"},{"c":"6사02-01","y":"2022","s":"사회","g":"5~6학년","a":"우리나라 지리 탐구","  탐색한다.","e":"","k":"2022|실과|5~6학년|기술적 문제해결과 혁신|1","r":"기술적 문제해결과 혁신"},{"c":"6실03-05","y":"2022","s":"실과","g":"5~6학년","a":"기술적 문제해결과 혁신","t":"수송 수단의 구성 요소를 이해하고, 친환경 에너지를 적용한 다양한 수송 수단의 시제품을 만들어 수송기술의 가치를 인식한다.","e":"이 성취기준은 수송 수단의 기본 요소가 구동장치, 조향장치, 제동장치 등으로 구성되어 있음을 일상생활에서의 수송 수단 사례를 들어 설명하여 간단한 수송 수단을 만들고 공유하는 메이커 활동으로 연결한다. 수송 수단의 구동장치를 작동시키기 위하여 태양광 전지와 같은 친환경 에너지를 사용하여 수송 수단을 만들어 보면서 수송기술의 중요성과 가치를 인식하도록 한다.","k":"2022|실과|5~6학년|기술적 문제해결과 혁신|1","r":"기술적 문제해결과 혁신"},{"c":"6실04-01","y":"2022","s":"실과","g":"5~6학년","a":"지속가능한 기술과 융합","t":"친환경 건설 구조물을 이해하고, 생활 속 건설 구조물을 탐색하여 간단한 구조물을 체험하면서 건설기술에 대한 가치를 인식한다.","e":"이 성취기준은 건설기술의 의미와 특성에 대한 이해를 바탕으로 건설 구조물에는 건축 구조물과 토목 구조물이 있음을 알고 건설 구조물을 탐색하는 체험 활동을 통해 중등의 건설기술과 연계되도록 설정하였다. 특히, 최근 대두되고 있는 친환경 건설 구조물의 사례를 탐색하고 간단한 구조물을 만드는 메이커 활동을 제시한다.","k":"2022|실과|5~6학년|지속가능한 기술과 융합|1","r":"지속가능한 기술과 융합"},{"c":"6실04-02","y":"2022","s":"실과","g":"5~6학년","a":"지속가능한 기술과 융합","t":"생활 속 디지털 기술의 중요성을 이해하고, 디지털 기기와 디지털 콘텐츠 저작 도구를 사용하여 발표 자료를 만들어 보면서 디지털 기기의 활용 능력을 기른다.","e":"","k":"2022|실과|5~6학년|지속가능한 기술과 융합|1","r":"지속가능한 기술과 융합"},{"c":"6실04-03","y":"2022","s":"실과","g":"5~6학년","a":"지속가능한 기술과 융합","t":"제작한 발표 자료를 사이버 공간에 공유하고, 건전한 정보기기의 활용을 실천한다.","e":"이 성취기준은 활동으로 만든 발표 자료를 사이버 공간에 공유하는 방법에 대한 이해를 바탕으로 자료를 공유할 때 개인 정보 및 저작권 보호의 중요성을 인식하고 실천하도록 설정하였다. 여기에서는 정보윤리를 지키는 방법에 관해 사례나 구체적인 방법을 제시하도록 한다.","k":"2022|실과|5~6학년|지속가능한 기술과 융합|1","r":"지속가능한 기술과 융합"},{"c":"6실04-04","y":"2022","s":"실과","g":"5~6학년","a":"지속가능한 기술과 융합","t":"로봇의 개념과 구조를 이해하고, 생활 속 로봇 기능을 체험하여 로봇의 중요성을 인식한다.","e":"","k":"2022|실과|5~6학년|지속가능한 기술과 융합|1","r":"지속가능한 기술과 융합"},{"c":"6실04-05","y":"2022","s":"실과","g":"5~6학년","a":"지속가능한 기술과 융합","t":"로봇의 종류와 활용 사례를 통해 작동 원리를 이해하고, 로봇에 대한 관심과 흥미를 가진다.","e":"","k":"2022|실과|5~6학년|지속가능한 기술과 융합|1","r":"지속가능한 기술과 융합"},{"c":"6실04-06","y":"2022","s":"실과","g":"5~6학년","a":"지속가능한 기술과 융합","t":"로봇의 융합 기술을 이해하고, 간단한 로봇을 만들어 코딩과 프로그램을 적용하여 동작시키는 체험을 통해 융합 기술의 가치를 인식한다.","e":"이 성취기준은 로봇에 다양한 정보기술이 융합되는 사례를 탐색하여 로봇과 융합된 다양한 제품 개발에 대해 알고, 로봇의 다양한 센서와 동작을 위하여 블록 기반 프로그램으로 제어할 수 있는 활동을 하도록 하였다. 여기에서는 ‘디지털 사회와 인공지능’에서 학습한 블록 기반의 교육용 프로그래밍 도구를 활용하여 움직이는 간단한 인공지능형 로봇을 제작하여 구동시켜 보면서 로봇의 작동 원리를 학습하도록 한다.","k":"2022|실과|5~6학년|지속가능한 기술과 융합|1","r":"지속가능한 기술과 융합"},{"c":"6실04-07","y":"2022","s":"실과","g":"5~6학년","a":"지속가능한 기술과 융합","t":"생활 속 동식물 자원을 활용 목적에 따라 분류하고 이와 관련된 다양한 생명기술을 탐색한다.","e":"","k":"2022|실과|5~6학년|지속가능한 기술과 융합|1","r":"지속가능한 기술과 융합"},{"c":"6실04-08","y":"2022","s":"실과","g":"5~6학년","a":"지속가능한 기술과 융합","t":"생활 속 동식물을 기르고 가꾸는 방법을 알고, 동식물을 기르고 가꾸는 체험을 통해 생태 존중감을 가진다.","e":"","k":"2022|실과|5~6학년|지속가능한 기술과 융합|1","r":"지속가능한 기술과 융합"},{"c":"6실04-09","y":"2022","s":"실과","g":"5~6학년","a":"지속가능한 기술과 융합","t":"동식물 자원의 친환경 농업 사례를 통해 지속가능한 농업이 순환되고 있음을 인식하고 농업의 미래가치를 인식한다.","e":"이 성취기준은 친환경 농업에 대한 이해를 바탕으로 이를 이루기 위한 농업사례들을 구분하여 지속가능한 농업이 이루어지기 위한 농업의 순환성을 이해하고 중요성을 인식하도록 설정하였다. 특히, 지속가능성 농업의 순환에 대한 다양한 사례(예, 친환경 농업, 스마트팜, 로컬 푸드, 푸드 마일리지 등)를 통해 학습하도록 한다.","k":"2022|실과|5~6학년|지속가능한 기술과 융합|1","r":"지속가능한 기술과 융합"},{"c":"6실04-10","y":"2022","s":"실과","g":"5~6학년","a":"지속가능한 기술과 융합","t":"생활 속에서 농업활동과 관련된 모습을 분석하고 이에 따른 농업활동을 체험하여 농업에 대한 관심을 두고 이를 생활 속에서 실천한다.","e":"이 성취기준은 생활 속에서 농업활동과 연관 지을 수 있는 모습에 대한 예측을 바탕으로 다양한 농업활동 분야들을 알고 이와 관련된 농업활동 체험을 통해 농업에 대한 관심과 흥미를 가질 수 있도록 설정하였다. 특히, 농업활동은 실내원예활동, 농업생산물 가공 활동, 원예 및 동물치료 활동 등과 같은 생활상의 변화와 관련된 체험을 제시하도록 한다.","k":"2022|실과|5~6학년|지속가능한 기술과 융합|1","r":"지속가능한 기술과 융합"},{"c":"6실04-11","y":"2022","s":"실과","g":"5~6학년","a":"지속가능한 기술과 융합","t":"농업과 농촌의 다원적인 역할과 가치를 이해하고 미래 농업과 관련된 다양한 직업 세계를 탐색한다.","e":"이 성취기준은 농업과 농촌은 농산물 생산뿐 아닌 그 외에도 다원적인 역할을 하고 있음을 이해하고 이에 대한 인식과 이해를 바탕으로 농업과 농촌에 대한 올바른 진로역량을 기르기 위해서 설정하였다. 특히, 다원적인 농업과 농촌의 가치를 환경, 생태, 사회, 문화적인 가치로 분류하여 이와 관련된 진로를 탐색하고 건전한 진로역량을 기르도록 한다.","k":"2022|실과|5~6학년|지속가능한 기술과 융합|1","r":"지속가능한 기술과 융합"},{"c":"6실05-01","y":"2022","s":"실과","g":"5~6학년","a":"디지털 사회와 인공지능","t":"컴퓨터를 활용한 생활 속 문제해결 사례를 탐색하고 일상생활 속 문제를 해결하기 위한 알고리즘을 다양한 방법으로 표현한다.","e":"이 성취기준은 컴퓨터의 개념을 이해하고 다양한 문제 상황에서 컴퓨터가 활용되는 사례 탐색을 통해 그 가치와 활용 방법을 알 수 있어야 한다. 일상생활에서 컴퓨터를 활용해 해결할 수 있는 문제를 탐색하고, 문제 상황에 제시된 요소들을 분  행동 순서나 방법에 대하여 두세 문장으로 말하거나 쓰는 것을 의미한다. 이때 문장과 문장을 이어 주는 말(and, but 등)이나 순서를 나타내는 말(first, second 등)을 적절하게 활용할 수 있다.","k":"2022|영어|5~6학년|표현|1","r":"5~6학년","gr":1},{"c":"6영02-06","y":"2022","s":"영어","g":"5~6학년","a":"표현","t":"자신의 감정이나 의견, 경험이나 계획을 간단한 문장으로 표현한다.","e":"","k":"2022|영어|5~6학년|표현|1","r":"5~6학년","gr":1},{"c":"6영02-07","y":"2022","s":"영어","g":"5~6학년","a":"표현","t":"일상생활 주제에 관한 담화나 글의 세부 정보를 간단한 문장으로 묻거나 답한다.","e":"","k":"2022|영어|5~6학년|표현|1","r":"5~6학년","gr":1},{"c":"6영02-08","y":"2022","s":"영어","g":"5~6학년","a":"표현","t":"예시문을 참고하여 목적에 맞는 간단한 글을 쓴다.","e":"이 성취기준은 초대, 감사, 축하 등을 목적으로 하는 카드나 이메일, 경험을 담은 일기나 기행문 등 일상생활에서 빈번하게 일어나는 쓰기의 상황과 목적을 고려하여 글을 쓰는 것으로서, 예시문을 참고하여 글의 형식에 맞게 적절한 내용으로 변형하거나 응용하여 쓰는 수준을 말한다.","k":"2022|영어|5~6학년|표현|1","r":"5~6학년","gr":1},{"c":"6영02-09","y":"2022","s":"영어","g":"5~6학년","a":"표현","t":"적절한 매체와 전략을 활용하여 창의적으로 의미를 생성하고 표현한다.","e":"이 성취기준은 구어나 문어로 의사소통하는 과정에서 학습자의 수준과 특성에 알맞은 매체와 전략을 사용하여 창의적으로 의미를 생성하고 표현하는 것을 말한다. 이는 브레인스토밍이나 생각 그물 등을 활용하여 아이디어를 생성하고, 이를 동작이나 그림과 같은 전통적인 매체뿐만 아니라 다양한 앱이나 디지털 매체 등을 활용하여 새로운 방법으로 말하거나 쓰는 것을 의미한다. 또한 의사소통 과정에서 발생하는 어려움을 극복하기 위해 반복하기, 반복 및 확인 요청하기 등의 말하기 전략과 고쳐 쓰거나 다시 쓰기 등의 쓰기 전략을 활용하는 것을 의미한다.","k":"2022|영어|5~6학년|표현|1","r":"5~6학년","gr":1},{"c":"6영02-10","y":"2022","s":"영어","g":"5~6학년","a":"표현","t":"의사소통 활동에 흥미와 자신감을 가지고 참여하여 협력적으로 수행한다.","e":"이 성취기준은 온오프라인 공간에서 제공된 다양한 형태의 말하기⋅쓰기 과업이나 활동에 흥미와 자신감을 가지고 능동적으로 참여하는 것을 의미한다. 지속적으로 이루어지는 짝이나 모둠별 말하기⋅쓰기 활동을 통해 학습자들이 서로 가르쳐 주거나 배우는 과정에서 긍정적인 피드백을 주고받으며 말하거나 쓰고 싶은 의욕과 자신감을 높이는 것을 말한다.","k":"2022|영어|5~6학년|표현|1","r":"5~6학년","gr":1},{"c":"4음01-01","y":"2022","s":"음악","g":"3~4학년","a":"연주","t":"바른 자세와 주법을 익혀 노래 부르거나 악기로 연주한다.","e":"","k":"2022|음악|3~4학년|연주|1","r":"연주"},{"c":"4음01-02","y":"2022","s":"음악","g":"3~4학년","a":"연주","t":"기초적인 음악 요소를 살려 노래 부르거나 악기로 연주하고 느낌을 이야기한다.","e":"이 성취기준은 노래나 악기 연주를 통해 기초적인 음악 요소를 표현하도록 하기 위해 설정하였다. 기초적인 수준의 음악 요소를 익혀 다양한 악곡을 연주하고, 이를 통해 알게 된 점이나 느낌 등을 이야기해 봄으로써 음악 개념과 활동을 의미 있게 연결 짓도록 하는 데 중점을 둔다.","k":"2022|음악|3~4학년|연주|1","r":"연주"},{"c":"4음01-03","y":"2022","s":"음악","g":"3~4학년","a":"연주","t":"노래와 악기 연주에 어울리는 신체표현이나 놀이를 하며 음악을 즐긴다.","e":"이 성취기준은 다양한 노래나 악기 연주의 특성을 탐색하고 관련지어 자유롭게 신체나 놀이로 표현하도록 하기 위해 설정하였다. 학습자의 발달 단계에 적합한 흥미로운 신체표현을 통해 음악을 즐기고, 음악을 활용하여 전통과 현대의 다양한 놀이를 하도록 함으로써 노래, 연주 등의 음악 활동이 음악 외의 여러 활동과 연결되도록 하는 데 중점을 둔다.","k":"2022|음악|3~4학년|연주|1","r":"연주"},{"c":"4음01-04","y":"2022","s":"음악","g":"3~4학년","a":"연주","t":"생활 속에서 음악을 경험하며 연주에 관심을 가지고 참여한다.","e":"이 성취기준은 음악 수업을 통해 학습한 다양한 음악 경험을 생활 속으로 확장하도록 하기 위해 설정하였다. 혼자 또는 여럿이 함께한 노래 및 악기 연주 경험을 바탕으로 가정, 학교 등 주변 생활 속에서 음악을 활용할 수 있는 방법에 대해 살펴보고, 실제 생활에서 간단한 연주 활동에 스스로 관심을 가지고 참여하도록 하는 데 중점을 둔다.","k":"2022|음악|3~4학년|연주|1","r":"연주"},{"c":"4음02-01","y":"2022","s":"음악","g":"3~4학년","a":"감상","t":"음악을 듣고 기초적인 음악 요소를 탐색하며 반응한다.","e":"이 성취기준은 감상곡에 포함된 기초적인 음악 요소를 청각적으로 인식하도록 하기 위해 설정하였다. 음악을 들으며 기초적인 수준의 음악 요소를 탐색해 보고, 노래, 악기, 신체, 언어, 그림 등 다양한 방법으로 자신의 반응을 자유롭게 표현하도록 하는 데 중점을 둔다.","k":"2022|음악|3~4학년|감상|1","r":"감상"},{"c":"4음02-02","y":"2022","s":"음악","g":"3~4학년","a":"감상","t":"다양한 음악을 듣고 음악적 특징을 발견한다.","e":"이 성취기준은 음악의 종류나 주제 등에 따른 음악의 전반적 특징을 발견하며 감상하는 능력을 기르도록 하기 위해 설정하였다. 다양한 음악을 감상하며 음악적 특징을 발표하고 공유하는 활동을 통해 다양한 주제가 감상곡에서 어떤 음악적 특징으로 나타나는지 살펴 청각적 인식과 음악적 이해를 연결 짓도록 하는 데 중점을 둔다.","k":"2022|음악|3~4학년|감상|1","r":"감상"},{"c":"4음02-03","y":"2022","s":"음악","g":"3~4학년","a":"감상","t":"다양한 종류의 음악을 듣고 음악의 분위기를 묘사하거나 쓰임을 이야기한다.","e":"이 성취기준은 다양한 분위기와 쓰임을 가진 음악을 듣고 경험하도록 함으로써 음악을 활용할 수 있는 능력을 기르도록 하기 위해 설정하였다. 악곡과 관련된 느낌과 감정, 분위기나 장면 등을 떠올려 보고, 이를 노래, 악기 연주, 신체표현, 그림, 영상, 글쓰기 등의 방법으로 묘사해 본다. 나아가 놀이, 의식, 노동 등 생활 속에서 다양하게 쓰이는 음악에 관해 이야기해 보며 음악 감상을 통한 경험을 확장하도록 하는 데 중점을 둔다.","k":"2022|음악|3~4학년|감상|1","r":"감상"},{"c":"4음02-04","y":"2022","s":"음악","g":"3~4학년","a":"감상","t":"생활 속에서 음악을 들으며 느낌과 호기심을 갖고 즐긴다.","e":"이 성취기준은 일상생활 속에서 호기심을 가지고 다양한 음악을 들으며 친숙함을 느끼도록 하기 위해 설정하였다. 국악, 서양음악, 세계음악, 대중매체에서 접하는 음악 등을 열린 마음으로 수용하고 즐김으로써 음악 감상을 생활화하도록 하는 데 중점을 둔다.","k":"2022|음악|3~4학년|감상|1","r":"감상"},{"c":"4음02-05","y":"2022","s":"음악","g":"3~4학년","a":"감상","t":"우리 지역의 음악 문화유산을 찾아 듣고 국악을 즐기는 태도를 갖는다.","e":"이 성취기준은 지역에 전승되어 오는 음악 문화유산에 관심을 갖고 찾아 들으며, 생활 속에서 국악을 즐기는 태도를 가질 수 있도록 하기 위해 설정하였다. 타 교과의 지역 학습과 연계하여 지역의 음악 문화유산을 통해 자신이 속한 지역 문화에 대한 이해를 높이고, 지역에 전승되어 오는 음악 문화유산에 호기심을 가지게 함으로써 생활 속에서 국악을 즐기는 태도를 함양하는 데 중점을 둔다.","k":"2022|음악|3~4학년|감상|1","r":"감상"},{"c":"4음03-01","y":"2022","s":"음악","g":"3~4학년","a":"창작","t":"느낌과 상상을 즉흥적으로 표현하며 음악에 대한 흥미를 갖는다.","e":"이 성취기준은 주변 경험과 관련된 느낌이나 상상한 바를 음악으로 나타냄으로써 음악적 상상력을 기르도록 하기 위하여 설정하였다. 자신의 느낌이나 상상을 일정한 틀이나 형식에 얽매이지 않고 목소리, 악기, 신체, 물체 등을 활용하여 즉흥적인 소리나 음악으로 표현하는 활동을 하며 자신과 다른 사람의 자유로운 표현을 즐기고 음악에 관한 흥미를 갖도록 하는 데 중점을 둔다.","k":"2022|음악|3~4학년|창작|1","r":"창작"},{"c":"4음03-02","y":"2022","s":"음악","g":"3~4학년","a":"창작","t":"악곡의 일부를 바꾸어 표현하고 간단한 악보로 나타낸다.","e":"이 성취기준은 노랫말 등 악곡의 일부를 바꾸어 표현하고 음악을 기록하는 다양한 방법에 대해 기초적인 수준에서 이해하도록 하기 위해 설정하였다. 음⋅음표, 그림, 기호, 숫자, 문자 등을 활용하여 악보로 나타내고 창작과 공유의 즐거움을 경험하도록 하는 데 중점을 둔다.","k":"2022|음악|3~4학년|창작|1","r":"창작"},{"c":"4음03-03","y":"2022","s":"음악","g":"3~4학년","a":"창작","t":"기초적인 음악 요소를 활용하여 소리나 음악으로 표현한다.","e":"이 성취기준은 음악 요소에 관한 이해를 바탕으로 소리나 음악을 창작하는 기초적인 능력을 기르도록 하기 위해 설정하였다. 기초적인 수준의 음악 요소를 활용하여 짧고 간단한 소리나 음악으로 자유롭게 표현하며 음악 요소에 따른 음악적 효과와 특징을 스스로 인식하도록 하는 데 중점을 둔다.","k":"2022|음악|3~4학년|창작|1","r":"창작"},{"c":"4음03-04","y":"2022","s":"음악","g":"3~4학년","a":"창작","t":"생활 주변의 소리나 장면을 모방하며 음악의 새로움을 즐기는 태도를 갖는다.","e":"이 성취기준은 생활 주변의 소리에 민감하게 반응하고 새로운 음악을 만들어가며 즐길 수 있도록 하기 위해 설정하였다. 일상에서 경험할 수 있는 다양한 소리나 장면을 음악의 관점에서 탐색해 보고 이를 모방하여 노래, 악기 연주, 신체표현 등의 다양한 방법으로 나타내도록 한다. 학습자마다 산출해낸 다양한 결과물을 서로 공유하며 새로운 표현과 그 가능성을 즐기도록 하는 데 중점을 둔다.","k":"2022|음악|3~4학년|창작|1","r":"창작"},{"c":"6음01-01","y":"2022","s":"음악","g":"5~6학년","a":"연주","t":"바른 주법과 표현 기법을 익혀 노래나 악기로 느낌을 담아 연주한다.","e":"","k":"2022|음악|5~6학년|연주|1","r":"연주"},{"c":"6음01-02","y":"2022","s":"음악","g":"5~6학년","a":"연주","t":"음악 요소를 살려 노래나 악기로 발표하고 과정을 돌아본다.","e":"이 성취기준은 악곡에 드러난 음악의 다양한 요소를 익혀 노래나 악기 연주로 표현하는 기회를 가지도록 하기 위해 설정하였다. 여러 음악 요소에 대한 이해를 바탕으로 노래나 악기 연주로 발표하고, 자신의 발표 과정을 스스로 돌아보면서 서로 평하는 데 중점을 둔다.","k":"2022|음악|5~6학년|연주|1","r":"연주"},{"c":"6음01-03","y":"2022","s":"음악","g":"5~6학년","a":"연주","t":"소리의 어울림을 생각하며 다양한 방법으로 함께 표현한다.","e":"이 성취기준은 함께하는 연주 활동을 통해 다양한 소리의 어울림을 경험하고 음악 표현의 재미를 느낄 수 있도록 하기 위해 설정하였다. 목소리, 악기, 신체, 물체, 매체 등을 활용한 다양한 소리와 그 어울림의 특징을 탐구하고, 이를 표현하기 위한 여러 방법을 탐색하도록 한다. 이 과정에서 다른 사람과 함께 활동함으로써 공동체 속에서 음악으로 소통하는 즐거움을 경험하도록 하는 데 중점을 둔다.","k":"2022|음악|5~6학년|연주|1","r":"연주"},{"c":"6음01-04","y":"2022","s":"음악","g":"5~6학년","a":"연주","t":"간단한 형태의 연주를 준비하여 생활 속 음악 활동에 참여한다.","e":"이 성취기준은 학생들이 노래와 악기 연주 기능을 발휘하여 생활 속에서 음악 활동을 실천하는 태도를 기르도록 하기 위해 설정하였다. 가정 및 학교의 행사나 지역 축제 등 생활 속에서 음악이 필요한 상황을 생각하여 적절한 음악을 선택하고 학생들의 수준에 맞는 간단한 형태로 혼자 또는 여럿이 연주를 준비하도록 한다. 연주를 위한 준비 과정과 발표에 참여함으로써 음악을 생활화하며 자기주도적으로 즐기는 태도를 기르도록 하는 데 중점을 둔다.","k":"2022|음악|5~6학년|연주|1","r":"연주"},{"c":"6음02-01","y":"2022","s":"음악","g":"5~6학년","a":"감상","t":"음악을 듣고 음악의 요소를 감지하며 구별한다.","e":"이 성취기준은 감상곡의 음악 요소를 감지하여 구별하고 반응하는 능력을 기르도록 하기 위해 설정하였다. 음악을 들으며 악곡에 나타나는 여러 음악 요소를 감지하여 구별하고, 이를 노래, 악기, 신체, 언어, 그림 등의 다양한 방법으로 표현해보면서 이해하는 데 중점을 둔다.","k":"2022|음악|5~6학년|감상|1","r":"감상"},{"c":"6음02-02","y":"2022","s":"음악","g":"5~6학년","a":"감상","t":"다양한 문화권의 음악을 듣고 음악적 특징과 음악의 간단한 구성을 인식한다.","e":"이 성취기준은 문화권에 따라 다양하게 나타나는 음악의 특징과 음악의 간단한 구성을 인식하도록 하기 위해 설정하였다. 우리나라를 비롯하여 여러 지역이나 나라의 다양한 음악을 듣고 음악의 간단한 구성과 전반적인 특징을 인식하여, 이를 평하기, 설명하기, 표현하기 등의 다양한 행동적 활동을 통해 나타내 보는 데 중점을 둔다.","k":"2022|음악|5~6학년|감상|1","r":"감상"},{"c":"6음02-03","y":"2022","s":"음악","g":"5~6학년","a":"감상","t":"다양한 종류의 음악을 듣고 음악의 배경과 활용을 설명한다.","e":"이 성취기준은 음악의 내적 측면과 외적 측면을 균형 있게 파악하는 능력을 기르도록 하기 위해 설정하였다. 다양한 음악의 쓰임과 배경을 이해하고 건강, 행사, 환경 등 학습자의 생활과 관련된 다양한 음악의 활용에 대하여 폭넓게 학습하여 이를 설명할 수 있도록 하는 데 중점을 둔다.","k":"2022|음악|5~6학년|감상|1","r":"감상"},{"c":"6음02-04","y":"2022","s":"음악","g":"5~6학년","a":"감상","t":"생활 속에서 음악을 찾아 들으며 아름다움을 느끼고 공감한다.","e":"이 성취기준은 생활 속에서 접하는 다양한 음악의 아름다움을 인식하고 공감하는 능력을 기르도록 하기 위해 설정하였다. 국악, 서양음악, 대중음악, 세계음악 등 생활 속에서 접할 수 있는 다양한 음악에 관심을 가지고 스스로 찾아 들으며, 음악에 대한 느낌을 여러 방식으로 표현할 수 있는 데 중점을 둔다.","k":"2022|음악|5~6학년|감상|1","r":"감상"},{"c":"6음02-05","y":"2022","s":"음악","g":"5~6학년","a":"감상","t":"우리나라 음악 문화유산을 찾아 듣고 국악의 가치를 인식한다.","e":"이 성취기준은 우리나라 음악 문화유산의 경험을 바탕으로 국악의 가치를 인식하도록 하기 위해 설정하였다. 무형문화재에 대한 이해를 바탕으로 시도 무형문화재, 국가 무형문화재로 지정된 음악 문화유산을 찾아 들어보고 음악적⋅문화적 의미를 이해하여 국악의 가치를 인식하는 데에 중점을 둔다.","k":"2022|음악|5~6학년|감상|1","r":"감상"},{"c":"6음03-01","y":"2022","s":"음악","g":"5~6학년","a":"창작","t":"느낌과 아이디어를 떠올려 여러 매체나 방법으로 자신감 있게 표현한다.","e":"이 성취기준은 음악 창작의 소재로서 느낌과 아이디어를 발산해 내고 이를 음악으로 표현하며 음악적 상상력과 자신감을 기르도록 하기 위해 설정하였다. 자신의 경험과 관련된 다양한 느낌과 아이디어를 떠올려 그림, 기호, 언어 등을 활용하여 기록하고, 목소리, 악기, 물체, 신체, 디지털 매체 등을 통해 새롭게 표현해 보도록 하는 데 중점을 둔다.","k":"2022|음악|5~6학년|창작|1","r":"창작"},{"c":"6음03-02","y":"2022","s":"음악","g":"5~6학년","a":"창작","t":"기초적인 기보를 활용하여 간단한 조건에 따라 악곡의 일부를 바꾼다.","e":"이 성취기준은 음악적 약속으로서 통용되는 기초 기보를 이해하고 이를 활용한 음악 창작 능력을 기르도록 하기 위해 설정하였다. 음이름, 계이름, 율명을 익히고 음악을 기록하는 오선보나 정간보 등의 기보 방법을 기초적 수준에서 이해하여 주어진 조건에 따라 노랫말, 말붙임새 등 악곡의 일부를 바꾸어 기보해본다. 또한 이를 통한 느낌이나 생각을 공유하는 데 중점을 둔다.","k":"2022|음악|5~6학년|창작|1","r":"창작"},{"c":"6음03-03","y":"2022","s":"음악","g":"5~6학년","a":"창작","t":"음악의 요소를 활용하여 간단한 음악을 만든다.","e":"이 성취기준은 음악에서 음악 요소의 의미와 효과를 이해하고 이를 활용하여 음악을 창작하는 능력을 기르도록 하기 위해 설정하였다. 음악 요소의 특징이 드러나는 짧고 단순한 형태의 음악을 간단한 기보, 프로그램, 매체 등을 활용하여 스스로 혹은 협력적으로 만들며 서로의 음악적 산출물을 공유해 보는 데 중점을 둔다.","k":"2022|음악|5~6학년|창작|1","r":"창작"},{"c":"6음03-04","y":"2022","s":"음악","g":"5~6학년","a":"창작","t":"생활 주변 상황이나 이야기를 활용하여 음악을 만들며 열린 태도를 갖는다.","e":"이 성취기준은 학생들의 실제 생활과 경험을 토대로 음악 창작과 삶을 연계하여 음악에 대한 긍정적인 태도를 기르도록 하기 위해 설정하였다. 주변의 다양한 상황이나 이야기를 소재로 음악적 아이디어를 끌어내어 간단한 음악극이나 음악 영상 등으로 함께 만들어 나눔으로써 서로의 음악에 대한 열린 태도를 갖고 소통하는 데 중점을 둔다.","k":"2022|음악|5~6학년|창작|1","r":"창작"},{"c":"2즐01-01","y":"2022","s":"즐거운 생활","g":"1~2학년","a":"우리는 누구로 살아갈까","t":"즐겁게 놀이하며, 건강하고 안전하게 생활한다.","e":"‘놀이’는 일정한 규칙이나 방법에 따라 노는 좁은 의미의 놀이 활동뿐만 아니라 학생이 자발적으로 참여하고 몰입함으로써 자유로움과 즐거움을 느낄 수 있는 모든 활동을 의미한다.","k":"2022|즐거운 생활|1~2학년|우리는 누구로 살아갈까|1","r":"1~2학년","gr":1},{"c":"2즐01-02","y":"2022","s":"즐거운 생활","g":"1~2학년","a":"우리는 누구로 살아갈까","t":"놀이하며 내 몸의 움직임이나 감각을 느낀다.","e":"‘놀이’는 일정한 규칙이나 방법에 따라 노는 좁은 의미의 놀이 활동뿐만 아니라 학생이 자발적으로 참여하고 몰입함으로써 자유로움과 즐거움을 느낄 수 있는 모든 활동을 의미한다.","k":"2022|즐거운 생활|1~2학
