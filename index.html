/* 성취기준에 딸린 글. 2022는 고려 사항, 2015는 학습 요소·방법·평가를 쓴다 */
const BLOCKS = [
  ['x', '성취기준 해설 (단원 총괄)'],
  ['c', '적용 시 고려 사항'],
  ['l', '학습 요소'],
  ['m', '교수·학습 방법 및 유의 사항'],
  ['v', '평가 방법 및 유의 사항'],
  ['q', '탐구 활동'],
];

/* ── 검색 정규화 ────────────────────────────────
   NCIC 원문은 인쇄본에서 온 탓에 띄어쓰기가 불규칙하다.
   ('생 태계'처럼 낱말 중간이 갈라져 있는 경우가 있다)
   그래서 공백을 걷어낸 문자열로 찾고, 위치를 원문으로 되돌려 칠한다. */
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const IDX = new Map();

function strip(s){
  const out = [], map = [];
  for (let i = 0; i < s.length; i++){
    if (/\s/.test(s[i])) continue;
    out.push(s[i]); map.push(i);
  }
  return {t: out.join('').toLowerCase(), map};
}
function indexed(s){ if (!IDX.has(s)) IDX.set(s, strip(s)); return IDX.get(s); }
function chosung(s){
  let r = '';
  for (const ch of s){
    const c = ch.charCodeAt(0) - 0xAC00;
    r += (c >= 0 && c <= 11171) ? CHO[Math.floor(c / 588)] : ch;
  }
  return r.toLowerCase();
}
const isCho = q => /^[ㄱ-ㅎ]+$/.test(q.replace(/\s/g, ''));

function hits(src, q){
  if (!src || !q) return [];
  const {t, map} = indexed(src);
  const hay = isCho(q) ? chosung(t) : t;
  const needle = q.replace(/\s/g, '').toLowerCase();
  const out = []; let from = 0;
  while (out.length < 40){
    const i = hay.indexOf(needle, from);
    if (i < 0) break;
    out.push([map[i], map[i + needle.length - 1] + 1]);
    from = i + needle.length;
  }
  return out;
}
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function mark(src, q){
  const hs = hits(src, q);
  if (!hs.length) return esc(src);
  let out = '', at = 0;
  for (const [s, e] of hs){ out += esc(src.slice(at, s)) + '<mark>' + esc(src.slice(s, e)) + '</mark>'; at = e; }
  return out + esc(src.slice(at));
}

/* ── 낱말 차이 ──────────────────────────────────
   두 성취기준을 나란히 놓으면 눈이 좌우로 왕복한다.
   달라진 낱말만 칠해두면 그 왕복이 줄어든다. 어절 단위 최장 공통 부분열. */
function diffWords(a, b){
  const A = a.split(/(\s+)/).filter(s => s !== ''), B = b.split(/(\s+)/).filter(s => s !== '');
  const n = A.length, m = B.length;
  const L = Array.from({length: n + 1}, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--)
    for (let j = m - 1; j >= 0; j--)
      L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const left = [], right = [];
  let i = 0, j = 0, gone = 0, came = 0;
  const word = s => /\S/.test(s);
  while (i < n && j < m){
    if (A[i] === B[j]){ left.push(esc(A[i])); right.push(esc(B[j])); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]){
      left.push('<del>' + esc(A[i]) + '</del>'); if (word(A[i])) gone++; i++;
    } else {
      right.push('<ins>' + esc(B[j]) + '</ins>'); if (word(B[j])) came++; j++;
    }
  }
  while (i < n){ left.push('<del>' + esc(A[i]) + '</del>'); if (word(A[i])) gone++; i++; }
  while (j < m){ right.push('<ins>' + esc(B[j]) + '</ins>'); if (word(B[j])) came++; j++; }
  return {left: left.join(''), right: right.join(''), gone, came};
}

/* 낱말 겹침으로 비슷한 성취기준을 찾는다.
   2015와 2022는 코드를 다시 매겨서 같은 코드가 같은 내용이 아니다.
   그래서 자동으로 짝짓지 않고 후보만 내놓고 고르는 것은 사람이 한다. */
const GRAM = new Map();
function grams(s){
  if (GRAM.has(s)) return GRAM.get(s);
  const t = s.replace(/\s/g, ''), set = new Set();
  for (let i = 0; i < t.length - 1; i++) set.add(t.slice(i, i + 2));
  GRAM.set(s, set); return set;
}
/* 그냥 겹치는 글자를 세면 '하여·태도를·기른다' 같은 어미가 다 걸려서
   엉뚱한 성취기준이 1등을 한다. 그래서 어디에나 나오는 조각일수록 무게를 낮춘다. */
let IDF = null;
function buildIdf(){
  const df = new Map();
  for (const r of DB.records) for (const g of grams(r.t)) df.set(g, (df.get(g) || 0) + 1);
  const N = DB.records.length;
  IDF = new Map();
  for (const [g, c] of df) IDF.set(g, Math.log(N / (1 + c)));
}
function similarity(a, b){
  if (!IDF) buildIdf();
  const A = grams(a), B = grams(b);
  if (!A.size || !B.size) return 0;
  let inter = 0, na = 0, nb = 0;
  for (const g of A){ const w = IDF.get(g) || 1; na += w * w; if (B.has(g)) inter += w * w; }
  for (const g of B){ const w = IDF.get(g) || 1; nb += w * w; }
  return (na && nb) ? inter / Math.sqrt(na * nb) : 0;
}
function nearest(r, limit = 3){
  return DB.records
    .filter(x => x.s === r.s && x.y !== r.y)
    .map(x => ({r: x, score: similarity(r.t, x.t) * (x.g === r.g ? 1 : 0.85)}))
    .filter(x => x.score > 0.18)
    .sort((a, b) => b.score - a.score)
    .slice(0, limit);
}

/* ── 상태 ──────────────────────────────────────── */
let facetsOpen = true, diffOn = false;
try{ facetsOpen = localStorage.getItem('ncic-facets') !== '0';
     diffOn = localStorage.getItem('ncic-diff') === '1'; }catch(e){}
const S = {q:'', year:'', grade:'', subject:'', sel:null, pick:[], view:'browse',
           sheet:false, facetsOpen, diff:diffOn,
           o1:new Set(), o2:new Set()};
const $ = id => document.getElementById(id);
const idOf = r => r.y + '|' + r.c;
const find = id => DB.records.find(x => idOf(x) === id);
const area = r => DB.areas[r.k] || {};
const blocksText = r => { const a = area(r); return BLOCKS.map(([k]) => a[k] || '').join(' '); };
const codeHTML = c => { const m = c.match(/^(\d+)(.*)$/); return m ? `<i>${m[1]}</i>${m[2]}` : c; };

/* 원문은 고려 사항·교수학습 같은 딸린 글을 문단 하나에 항목 하나씩 담는다.
   한 덩어리로 이어 붙이면 줄글 벽이 되므로 그 경계를 살려 목록으로 보여준다. */
const lines = t => (t || '').split('\n').filter(Boolean);
const asItems = (t, q) => `<ul class="items">${
  lines(t).map(s => `<li>${mark(s, q)}</li>`).join('')}</ul>`;
const asParas = (t, q) => lines(t).map(s => `<p>${mark(s, q)}</p>`).join('');

function search(){
  const q = S.q.trim();
  const pool = DB.records.filter(r =>
    (!S.year || r.y === S.year) && (!S.grade || r.g === S.grade) && (!S.subject || r.s === S.subject));
  if (!q) return pool.map(r => ({r, where:[], score:0}));
  const out = [];
  for (const r of pool){
    const where = []; let score = 0;
    if (hits(r.c, q).length){ where.push('코드'); score += 100; }
    if (hits(r.t, q).length){ where.push('성취기준'); score += 60; }
    if (hits(r.a, q).length){ where.push('영역'); score += 40; }
    if (hits(r.e, q).length){ where.push('해설'); score += 20; }
    if (hits(blocksText(r), q).length){ where.push('딸린 글'); score += 8; }
    if (score) out.push({r, where, score});
  }
  return out.sort((a, b) => b.score - a.score || a.r.c.localeCompare(b.r.c));
}

/* ── 최근 본 것 ─────────────────────────────────── */
const RECENT_KEY = 'ncic-recent';
function recent(){ try{ return JSON.parse(localStorage.getItem(RECENT_KEY)) || []; }catch(e){ return []; } }
function remember(id){
  try{
    const list = [id, ...recent().filter(x => x !== id)].slice(0, 6);
    localStorage.setItem(RECENT_KEY, JSON.stringify(list));
  }catch(e){}
}

/* ── 그리기 ────────────────────────────────────── */
function facetRow(label, key, values, counts){
  const chips = values.map(v => {
    const n = counts[v] || 0;
    return `<button class="chip" aria-pressed="${S[key] === v}" data-k="${key}" data-v="${v}"
      ${n ? '' : 'disabled'}>${v}<span class="n">${n}</span></button>`;
  }).join('');
  const clear = S[key] ? `<button class="chip ghost" data-k="${key}" data-v="">전체</button>` : '';
  return `<div class="frow"><span class="flabel">${label}</span>${chips}${clear}</div>`;
}

/* ── 목록 나무 ──────────────────────────────────
   교육과정 문서는 영역 안에 단원이 들어있고 단원 안에 성취기준이 있다.
   그 두 겹을 그대로 보여준다.
   2022는 내용 체계에서 영역을 끌어와 붙였고, 2015은 표 형식이 달라 아직 없어서
   학년군을 위층으로 쓴다. 어느 쪽인지 머리글에 적어 헷갈리지 않게 한다. */
function buildTree(res){
  const tops = new Map();
  for (const {r, where} of res){
    const tkey = `${r.y}|${r.s}|${r.r}`;
    if (!tops.has(tkey))
      tops.set(tkey, {key:tkey, name:r.r, year:r.y, subject:r.s,
                      byGrade:!!r.gr, units:new Map(), n:0});
    const T = tops.get(tkey);
    const ukey = T.byGrade ? `${tkey}|${r.a}` : `${tkey}|${r.g}|${r.a}`;
    if (!T.units.has(ukey))
      T.units.set(ukey, {key:ukey, name:r.a, grade:r.g, cross:r.x || '', rows:[]});
    T.units.get(ukey).rows.push({r, where});
    T.n++;
  }
  for (const T of tops.values()) T.units = [...T.units.values()];
  return [...tops.values()];
}

function treeHTML(res){
  const searching = !!S.q.trim();
  return buildTree(res).map(T => {
    // 검색 중에는 걸린 가지를 열어둔다. 접힌 채 숨으면 검색이 헛일이 된다
    const open1 = searching || S.o1.has(T.key);
    const kind = T.byGrade ? '학년군' : '영역';
    let html = `<button class="grp g1" data-g1="${T.key}" aria-expanded="${open1}">
        <span class="caret">▶</span><span class="nm">${mark(T.name, S.q)}</span>
        <span class="kind">${kind}</span>
        <span class="n">${T.units.length > 1 ? `단원 ${T.units.length} · ` : ''}${T.n}</span>
      </button>`;
    if (!open1) return html;

    for (const U of T.units){
      const open2 = searching || S.o2.has(U.key);
      // 단원명이 영역명과 같으면 되풀이하지 않고 학년군만 보여준다
      const label = (!T.byGrade && U.name === T.name) ? U.grade : mark(U.name, S.q);
      const band = (!T.byGrade && U.name !== T.name) ? `<span class="band">${U.grade}</span>` : '';
      html += `<button class="grp g2" data-g2="${U.key}" aria-expanded="${open2}">
          <span class="caret">▶</span><span class="nm">${label}</span>${band}
          ${U.cross ? `<span class="cross" title="이 단원은 '${U.cross}' 영역에도 걸칩니다">≈ ${U.cross}</span>` : ''}
          <span class="n">${U.rows.length}</span>
        </button>`;
      if (!open2) continue;
      for (const {r, where} of U.rows){
        const id = idOf(r), on = S.pick.includes(id);
        html += `<div class="row" role="option" data-id="${id}" aria-selected="${S.sel === id}">
          <div class="code">${codeHTML(r.c)}</div>
          <div class="body">
            <div class="txt">${mark(r.t, S.q)}</div>
            ${where.length && !where.includes('성취기준')
              ? `<div class="meta"><em>${where[0]}에서 걸림</em></div>` : ''}
          </div>
          <button class="pick" data-pick="${id}" aria-pressed="${on}"
            title="비교함에 담기">${on ? '✓' : '+'}</button>
        </div>`;
      }
    }
    return html;
  }).join('');
}

function drawTray(){
  if (!S.pick.length && S.view !== 'compare'){ $('tray').innerHTML = ''; return; }
  const slots = [0, 1].map(i => {
    const r = S.pick[i] ? find(S.pick[i]) : null;
    return r
      ? `<span class="slot"><span class="code">${r.c}</span><span class="yr">${r.y}</span>
           <button data-drop="${idOf(r)}" aria-label="빼기">×</button></span>`
      : `<span class="slot blank">${i === 0 ? '첫 번째' : '두 번째'} 성취기준을 고르세요</span>`;
  }).join('<span style="color:var(--accent);font-size:12px">↔</span>');

  $('tray').innerHTML = `<div class="tray"><div class="tray-in">
      <b>비교함</b>${slots}
      <span class="go">
        <button class="btn" id="do-cmp" ${S.pick.length === 2 ? '' : 'disabled'}>나란히 보기</button>
        <button class="btn quiet" id="clr-cmp">비우기</button>
      </span></div></div>`;
  $('do-cmp').onclick = () => { S.view = 'compare'; draw(); };
  $('clr-cmp').onclick = () => { S.pick = []; S.view = 'browse'; draw(); };
  $('tray').querySelectorAll('[data-drop]').forEach(b => {
    b.onclick = () => { S.pick = S.pick.filter(x => x !== b.dataset.drop);
      if (S.pick.length < 2) S.view = 'browse'; draw(); };
  });
}

function draw(){
  const res = search();
  const countBy = (key, prop) => {
    const save = S[key]; S[key] = '';
    const c = {};
    for (const {r} of search()) c[r[prop]] = (c[r[prop]] || 0) + 1;
    S[key] = save; return c;
  };
  const years = [...new Set(DB.records.map(r => r.y))].sort().reverse();
  const subjects = [...new Set(DB.records.map(r => r.s))];

  const AXES = [['교육과정','year','y',years],
                ['학년군','grade','g',['1~2학년','3~4학년','5~6학년']],
                ['과목','subject','s',subjects]];
  const on = AXES.filter(([, key]) => S[key]);
  // 접었을 때도 걸린 필터는 그대로 보이고 눌러서 풀 수 있어야 한다
  const summary = S.facetsOpen ? ''
    : (on.length
        ? on.map(([label, key]) => `<button class="chip" aria-pressed="true"
             data-k="${key}" data-v="">${label} · ${S[key]}<span class="n">×</span></button>`).join('')
        : `<span class="fnote">전 과목 · 전 학년군</span>`);
  $('facets').innerHTML = `<div class="fhead">
      <button class="ftoggle" id="ftog" aria-expanded="${S.facetsOpen}">
        ${on.length ? '<span class="dot"></span>' : ''}필터${on.length ? ` ${on.length}` : ''}
        <svg width="9" height="6" viewBox="0 0 9 6" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round"><path d="M1 1.6 4.5 4.6 8 1.6"/></svg>
      </button>${summary}</div>`
    + (S.facetsOpen
        ? AXES.map(([label, key, prop, values]) =>
            facetRow(label, key, values, countBy(key, prop))).join('')
        : '');

  $('tally').textContent = S.q ? `${res.length}건` : '';
  const tops = res.length ? buildTree(res) : [];
  $('lcount').textContent = tops.length > 1
    ? `${tops[0].byGrade ? '학년군' : '영역'} ${tops.length} · ${res.length}건`
    : `${res.length}건`;
  $('lhead').textContent = S.q ? `"${S.q}" 검색 결과` : '전체 성취기준';

  if (!res.length){
    $('list').innerHTML = `<div class="empty"><b>찾은 결과가 없습니다</b>
      낱말을 줄여서 찾아보세요.<br>"인구분포"가 안 걸리면 "인구"로 찾으면 나옵니다.</div>`;
  } else {
    $('list').innerHTML = treeHTML(res);
  }

  drawTray();
  if (S.view === 'compare' && S.pick.length === 2) drawCompare();
  else if (S.sel && find(S.sel)) drawDetail();
  else drawHome();

  const bar = document.querySelector('.bar');
  if (bar) document.documentElement.style.setProperty('--barh', bar.offsetHeight + 'px');
  $('detail').classList.toggle('sheet', S.sheet && window.innerWidth <= 900);
  document.body.classList.toggle('locked', S.sheet && window.innerWidth <= 900);
  sync();
}

function drawHome(){
  const counts = {};
  for (const r of DB.records) counts[r.s] = (counts[r.s] || 0) + 1;
  const seen = recent().map(find).filter(Boolean);
  const intro = [
    `2022·2015 개정 초등 교육과정 성취기준 ${DB.records.length.toLocaleString()}건이 들어있습니다.`,
  ];
  $('detail').innerHTML = `<div class="home">
    <div class="hero">
      <h2>무엇을 찾으세요?</h2>
      <p>${intro.map(t => `<span>${t}</span>`).join('')}</p>
    </div>
    <h3>과목으로 들어가기</h3>
    <div class="tiles">${Object.keys(counts).sort().map(s =>
      `<button class="tile" data-subj="${s}"><b>${s}</b><span>${counts[s]}건</span></button>`).join('')}</div>
    ${seen.length ? `<h3>최근에 본 것</h3><div class="sibs">${seen.map(r =>
      `<button class="sib" data-id="${idOf(r)}"><span class="code">${r.c}</span>
         <span>${esc(r.t)}</span></button>`).join('')}</div>` : ''}
    <h3 style="margin-top:26px">이렇게도 찾습니다</h3>
    <div class="seeds">${['생태계','민주주의','ㅂㅅ','4사01-01','분수','인권'].map(s =>
      `<button class="seed" data-seed="${s}">${s}</button>`).join('')}</div>
  </div>`;
  $('detail').querySelectorAll('[data-subj]').forEach(b => {
    b.onclick = () => { S.subject = b.dataset.subj; S.sel = null; draw(); };
  });
  $('detail').querySelectorAll('[data-seed]').forEach(b => {
    b.onclick = () => { S.q = b.dataset.seed; $('q').value = S.q; S.sel = null; draw(); };
  });
  $('detail').querySelectorAll('.sib[data-id]').forEach(b => {
    b.onclick = () => { S.sel = b.dataset.id; S.sheet = true; draw(); };
  });
}

function backBtn(){
  return `<button class="sheet-back" id="back">‹ 목록으로</button>`;
}

function drawDetail(){
  const r = find(S.sel);
  const a = area(r);
  const sibs = DB.records.filter(x => x.k === r.k);
  const near = nearest(r);
  remember(S.sel);

  const blocks = BLOCKS.filter(([k]) => a[k]).map(([k, title]) => {
    const open = S.q && hits(a[k], S.q).length ? ' open' : '';
    const n = lines(a[k]).length;
    return `<details class="sec"${open}><summary>${title}
        <span>${r.a} 단원 공통 · ${n}항목</span></summary>
      ${asItems(a[k], S.q)}</details>`;
  }).join('');

  $('detail').innerHTML = `${backBtn()}
    <div class="d-code">
      <button id="copy" title="코드 복사">${codeHTML(r.c)}</button>
      <span class="copied" id="copied">복사했습니다</span>
      <button class="btn quiet" id="add-cmp" style="margin-left:auto;border-color:var(--rule)">
        ${S.pick.includes(S.sel) ? '비교함에 담김' : '비교함에 담기'}</button>
    </div>
    <div class="d-tags">
      <span class="tag year">${r.y} 개정</span><span class="tag">${r.s}</span>
      <span class="tag">${r.g}</span><span class="tag">${r.a}</span>
    </div>
    <div class="d-text">${mark(r.t, S.q)}</div>

    <div class="sec ${r.e ? '' : 'none'}">
      <h3>성취기준 해설</h3>
      ${r.e ? asParas(r.e, S.q) : '<p>이 성취기준에는 해설이 없습니다.</p>'}
    </div>
    ${blocks}

    ${!near.length ? `<div class="sec none"><h3>다른 교육과정의 비슷한 성취기준</h3>
      <p>낱말이 충분히 겹치는 성취기준이 없습니다. 이 교육과정에서 새로 들어왔거나 크게 손질된 항목일 수 있습니다.</p></div>` : ''}
    ${near.length ? `<div class="sec"><h3>다른 교육과정의 비슷한 성취기준
        <span>낱말이 겹치는 정도로 고른 후보입니다</span></h3>
      <div class="near">${near.map(({r: n, score}) => `
        <div class="near-row">
          <div><div class="code">${n.c}</div>
            <div class="bar-mini"><i style="width:${Math.round(score * 100)}%"></i></div></div>
          <div class="t">${esc(n.t)}<em>${n.y} 개정 · ${n.a}</em></div>
          <button class="btn quiet" data-cmp="${idOf(n)}"
            style="border-color:var(--rule);white-space:nowrap">나란히 보기</button>
        </div>`).join('')}</div></div>` : ''}

    <div class="sec">
      <h3>같은 단원의 성취기준 <span>${sibs.length}건</span></h3>
      <div class="sibs">${sibs.map(s => `
        <button class="sib" data-id="${idOf(s)}" ${s.c === r.c ? 'data-self="1"' : ''}>
          <span class="code">${s.c}</span><span>${esc(s.t)}</span></button>`).join('')}</div>
    </div>`;

  $('copy').onclick = () => {
    navigator.clipboard?.writeText(r.c);
    $('copied').classList.add('on');
    setTimeout(() => $('copied').classList.remove('on'), 1400);
  };
  $('add-cmp').onclick = () => { pickToggle(S.sel); draw(); };
  const back = $('back'); if (back) back.onclick = () => { S.sheet = false; draw(); };
  $('detail').querySelectorAll('.sib[data-id]').forEach(b => {
    b.onclick = () => { S.sel = b.dataset.id; draw(); };
  });
  $('detail').querySelectorAll('[data-cmp]').forEach(b => {
    b.onclick = () => { S.pick = [S.sel, b.dataset.cmp]; S.view = 'compare'; draw(); };
  });
}

function drawCompare(){
  let [x, y] = S.pick.map(find);
  if (x.y < y.y){ const t = x; x = y; y = t; }        // 최신 교육과정을 왼쪽에 둔다
  const d = diffWords(y.t, x.t);                       // 옛것 → 새것 방향으로 견준다
  const col = (r, body) => `<div class="cmp-col">
      <span class="yr">${r.y} 개정</span>
      <div class="cd">${r.c}</div>
      <div class="mt">${r.s} · ${r.g} · ${r.a}</div>
      <div class="bd">${body}</div></div>`;

  const rows = [['성취기준 해설', y.e, x.e]].concat(
    BLOCKS.map(([k, title]) => [title, area(y)[k] || '', area(x)[k] || ''])
  ).filter(([, a, b]) => a || b);

  // 교육과정이 다르면 개정 전후로 읽히지만, 같은 교육과정끼리는 그렇게 부를 수 없다
  const across = x.y !== y.y;
  const none = '<span style="color:var(--ink-3)">없음</span>';

  $('detail').innerHTML = `${backBtn()}
    <div class="cmp-head">
      <h2>나란히 보기</h2>
      <div class="cmp-tools">
        <button class="switch" id="dtog" role="switch" aria-checked="${S.diff}"
          title="끄면 각 교육과정 원문 그대로, 켜면 달라진 낱말을 덧칠합니다">
          <span class="track"><span class="knob"></span></span>낱말 차이</button>
        <div class="cmp-stat${S.diff ? '' : ' off'}">
          <span class="c">${across ? '새로 들어온 말' : '왼쪽에만 있는 말'} <b>${d.came}</b></span>
          <span class="g">${across ? '빠진 말' : '오른쪽에만 있는 말'} <b>${d.gone}</b></span>
        </div>
      </div>
    </div>
    <div class="cmp">${col(x, S.diff ? d.right : esc(x.t))}${col(y, S.diff ? d.left : esc(y.t))}</div>
    ${rows.map(([title, older, newer]) => {
      // 한쪽이 비어 있으면 견줄 대상이 없다. 문단 전체를 칠하면 읽기만 나빠진다
      const both = older && newer && S.diff;
      const sub = both ? diffWords(older, newer) : null;
      return `<div class="cmp-row"><h4>${title}</h4>
        <div class="cmp">
          <div class="cmp-col"><div class="bd">${newer ? (both ? sub.right : esc(newer)) : none}</div></div>
          <div class="cmp-col"><div class="bd">${older ? (both ? sub.left : esc(older)) : none}</div></div>
        </div></div>`; }).join('')}
    <div class="sec"><p style="color:var(--ink-3);font-size:12.5px">
      2015와 2022는 성취기준 코드를 다시 매겨서 같은 코드가 같은 내용을 뜻하지 않습니다.
      이 화면은 고르신 두 건을 그대로 견준 것이고, 공식 대응 관계가 아닙니다.</p></div>`;

  $('dtog').onclick = () => {
    S.diff = !S.diff;
    try{ localStorage.setItem('ncic-diff', S.diff ? '1' : '0'); }catch(err){}
    draw();
  };
  const back = $('back'); if (back) back.onclick = () => { S.view = 'browse'; S.sheet = false; draw(); };
}

/* ── 담기 ──────────────────────────────────────── */
function pickToggle(id){
  if (S.pick.includes(id)) S.pick = S.pick.filter(x => x !== id);
  else S.pick = [...S.pick, id].slice(-2);
}

/* ── 주소 동기화 ───────────────────────────────── */
function sync(){
  const p = new URLSearchParams();
  if (S.q) p.set('q', S.q);
  if (S.year) p.set('y', S.year);
  if (S.grade) p.set('g', S.grade);
  if (S.subject) p.set('s', S.subject);
  if (S.sel) p.set('code', S.sel);
  if (S.pick.length) p.set('cmp', S.pick.join(','));
  if (S.view === 'compare') p.set('view', 'compare');
  history.replaceState(null, '', p.toString() ? '?' + p : location.pathname);
}
function restore(){
  const p = new URLSearchParams(location.search);
  S.q = p.get('q') || ''; S.year = p.get('y') || '';
  S.grade = p.get('g') || ''; S.subject = p.get('s') || '';
  S.sel = p.get('code') || null;
  S.pick = (p.get('cmp') || '').split(',').filter(Boolean).slice(0, 2);
  if (p.get('view') === 'compare' && S.pick.length === 2) S.view = 'compare';
  $('q').value = S.q;
}

/* ── 이벤트 ────────────────────────────────────── */
$('q').addEventListener('input', e => { S.q = e.target.value; S.sel = null; S.view = 'browse'; draw(); });
$('facets').addEventListener('click', e => {
  if (e.target.closest('#ftog')){
    S.facetsOpen = !S.facetsOpen;
    try{ localStorage.setItem('ncic-facets', S.facetsOpen ? '1' : '0'); }catch(err){}
    draw(); return;
  }
  const c = e.target.closest('.chip');
  if (!c || c.disabled) return;
  S[c.dataset.k] = (S[c.dataset.k] === c.dataset.v) ? '' : c.dataset.v;
  S.sel = null; S.view = 'browse'; draw();
});
$('list').addEventListener('click', e => {
  const g1 = e.target.closest('[data-g1]');
  if (g1){ const k = g1.dataset.g1;
    S.o1.has(k) ? S.o1.delete(k) : S.o1.add(k); draw(); return; }
  const g2 = e.target.closest('[data-g2]');
  if (g2){ const k = g2.dataset.g2;
    S.o2.has(k) ? S.o2.delete(k) : S.o2.add(k); draw(); return; }
  const p = e.target.closest('[data-pick]');
  if (p){ pickToggle(p.dataset.pick); draw(); return; }
  const row = e.target.closest('.row');
  if (row){ S.sel = row.dataset.id; S.view = 'browse'; S.sheet = true; draw(); }
});
$('home-link').onclick = () => {
  S.q = ''; $('q').value = ''; S.year = S.grade = S.subject = ''; S.sel = null;
  S.view = 'browse'; S.sheet = false; draw();
};
document.addEventListener('keydown', e => {
  const inInput = e.target.tagName === 'INPUT';
  if (inInput && !['Escape', 'ArrowDown', 'ArrowUp'].includes(e.key)) return;
  if (e.key === '/'){ e.preventDefault(); $('q').focus(); return; }
  if (e.key === 'Escape'){ $('q').value = ''; S.q = ''; S.sheet = false; $('q').focus(); draw(); return; }
  if ((e.key === 'c' || e.key === 'C') && S.sel){ pickToggle(S.sel); draw(); return; }
  if ((e.key === 'd' || e.key === 'D') && S.view === 'compare'){
    S.diff = !S.diff;
    try{ localStorage.setItem('ncic-diff', S.diff ? '1' : '0'); }catch(err){}
    draw(); return;
  }
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  const rows = [...$('list').querySelectorAll('.row')];
  const at = rows.findIndex(r => r.dataset.id === S.sel);
  const next = rows[Math.min(rows.length - 1, Math.max(0, at + (e.key === 'ArrowDown' ? 1 : -1)))];
  if (next){ e.preventDefault(); S.sel = next.dataset.id; S.view = 'browse'; draw();
    next.scrollIntoView({block:'nearest'}); }
});
$('theme').onclick = () => {
  const now = document.documentElement.dataset.theme
    || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = now === 'dark' ? 'light' : 'dark';
};

restore();
draw();
if (!S.sel && !S.q) $('q').focus();
</script>

</body>
</html>
