 대안 탐구 과정에서 학생들이 실행할 수 있는 대안들과 지역의 공공 기관의 협조를 얻어 실행할 수 있는 대안들을 균형 있게 탐구할 수 있도록 지도한다.\n다양한 영역의 지역 문제(주거, 환경, 복지, 교통 문제 등)에 대해서 관심을 갖도록 안내한다.\n지역 문제에 대한 관심과 문제 해결을 위한 노력이 해당 수업에 한정되지 않고 일상생활과 연계하여 지속적으로 이어져야 한다는 점을 강조한다.","v":"① 평가 방법\n학생들이 공공 기관의 종류를 알고 있고 공공 기관이 주민들의 삶에 주는 도움을 충분히 이해하고 있는지를 서술형으로 평가할 수 있다.\n다양한 지역 문제의 실태 및 원인 조사, 문제 해결을 위한 정보 수집과 분석, 적절한 해결 방안의 탐구 및 토의 활동 전반을 프로젝트법이나 토의법을 활용하여 평가할 수 있다.\n보고서법을 활용하여 지역 문제 해결을 위한 지역 주민들의 참여 방법 및 공공 기관의 역할에 대해 조사하는 능력을 평가한다.\n면접법을 활용하여 지역 문제 해결을 위해 주체적이고 적극적인 참여 의식 및 태도를 지니고 있는지를 평가한다.\n② 유의 사항\n프로젝트법이나 보고서법을 활용할 때에는 내용의 충실도와 타당도를 중심으로 평가한다. 이때 지역 문제의 원인 파악이 제대로 잘 이루어졌는지, 그리고 문제 해결 방안이 문제의 원인과 제대로 연계되어 있는지를 유의한다.\n서술형 평가를 실시할 때에는 다양한 공공 기관의 종류와 그 기관들의 역할을 실제 사례와 관련지어 생각해 보고 서술할 수 있도록 문항을 구성한다.\n지역 문제 해결을 위한 참여 태도를 평가할 때에는 허용적인 분위기를 조성하여 학생들 스스로 자신들의 생각을 편안하게 이야기할 수 있도록 한다.","l":"공공 기관, 공공 기관의 역할, 지역 문제, 주민 참여"},"2015|사회|3~4학년|다양한 삶의 모습과 변화|1":{"x":"이 단원은 촌락과 도시의 특성을 탐구하는 과정에서 인간의 생활공간에 대한 이해를 도모하고 나아가 지역 간 상호 협력하는 태도와 다양한 생활공간을 존중하는 태도를 기르는 데 주안점을 둔다.","m":"촌락과 도시의 특성을 이해하는 데에는 두 지역을 비교하는 학습 방식이 적절할 것이다. 이 경우 개념 학습 모형의 아이디어를 활용하여 촌락과 도시가 지니는 여러 속성을 찾도록 하거나 전형적인 촌락과 도시를 대상으로 하여 그 특성을 탐색하도록 하는 방식이 적용될 수 있다.\n촌락과 도시의 문제점 및 해결 방안 학습의 경우 문제 해결 학습 모형을 활용하여 두 생활공간에서 나타나는 문제 사태를 제시하고, 그 원인과 대안을 탐색하는 절차로 진행할 수 있다.\n촌락을 학습할 경우 전형적인 농촌, 어촌, 산지촌의 경관이 담긴 사진 자료를, 도시 학습의 경우 전형적인 중심 업무 지구, 상업 지구, 주거 지구의 경관이 담긴 사진 자료를 활용하거나 여행 경험을 활용한다. 촌락과 도시의 문제점에 관한 통계 자료나 신문 기사 자료도 활용한다.\n촌락과 도시를 학습할 경우 두 생활공간을 이분법적으로 분류하는 데 초점을 두기보다는 생활양식의 차이를 이해하는 활동에 초점을 둔다. 이때 특정 생활공간에 대한 부정적 혹은 선망적 인식이 형성되지 않도록 유의한다.\n정주 공간으로서의 ‘도시(urban)’ 개념을 물리적 행정 단위로서의 ‘시(city)’와, 산지를 대상으로 생산 활동이 이루어지는 ‘산지촌(山地村)’을 집촌의 상대 개념으로서 가옥 밀도가 낮은 ‘산촌(散村)’과 서로 혼동하지 않도록 특히 유의하여 지도한다.\n촌락과 도시를 구분하는 속성으로서 인구수보다는 생산 활동이나 기능의 차이에 주목할 필요가 있다.","v":"① 평가 방법\n촌락과 도시의 기능, 경관 특성에 대한 이해도를 평가할 때에는 관련 시각·공간 자료를 제시하고 각 항목별 비교표를 완성하거나 두 지역의 특성을 비교하는 등의 자료 해석형으로 평가한다.\n촌락과 도시 간 상호 의존 관계에 대한 이해도를 평가할 때에는 구체적인 삶의 장면이나 사례를 제시할 수 있도록 구안된 서술형으로 평가한다.\n촌락과 도시의 문제점과 해결 방안을 찾는 주제는 프로젝트형 수행평가를 활용할 수 있다. 프로젝트 주제로는 인간과 자연이 공존하는 생활공간의 설계, 촌락과 도시의 장점을 절충한 생활공간의 설계 등을 고려해 볼 수 있다.\n② 유의 사항\n촌락과 도시의 경관에 대한 도식적인 비교보다는 기능과 상호 의존 관계에 대한 이해도를 평가하는 데 주안점을 둔다.\n체험 학습 프로그램과 통합하여 교수·학습 및 평가 활동을 구안할 수도 있다.\n<필요한 것의 생산과 교환>","l":"촌락과 도시의 공통점과 차이점, 촌락과 도시의 문제점과 해결 방안, 촌락과 도시의 상호 의존"},"2015|사회|3~4학년|다양한 삶의 모습과 변화|2":{"x":"이 단원은 ‘생산과 소비’와 같은 기본적인 경제활동의 의미를 이해하고, 인간의 욕구를 충족할 수 있는 자원이 희소하여 경제활동에서 선택의 문제가 발생함을 파악하며, 우리 지역과 다른 지역 사람들의 물자 교환 및 교류 사례를 통하여 지역 간 경제활동이 밀접하게 관련되어 있음을 탐색하는 데 주안점을 둔다.","m":"시장(전통시장, 상설시장, 백화점, 할인 매장 등)에 관한 역할 놀이나 모의 활동을 통해 학생들이 주변에서 볼 수 있는 생산과 소비 활동의 의미를 파악하고, 자원의 희소성 때문에 경제활동을 할 때 선택의 문제가 발생하게 됨을 이해할 수 있도록 지도한다.\n다양한 경제활동(도매, 경매 등) 장면을 설정하여 역할 놀이나 모의 활동을 할 때 필요한 대본을 작성하거나 장보기 목록, 모의 화폐 등을 사용할 수 있다.\n시장에서 거래되는 여러 가지 물건의 생산지를 조사하여 우리 지역과 다른 지역이 물자를 교류하고 경제적으로 서로 밀접하게 연관되어 있음을 파악할 수 있도록 지도한다.\n우리 지역과 다른 지역의 물자 교환 및 교류 사례를 개인별 또는 모둠별로 조사하여 발표하고, 지역 간 경제 교류가 필요한 이유에 대해 토의하도록 한다.","v":"① 평가 방법\n경제활동에 관한 역할 놀이를 평가에 활용할 경우 생산자와 소비자의 역할 수행을 통하여 생산과 소비의 의미를 이해하고 있는지 관찰법을 활용하여 평가할 수 있다.\n모의 시장 활동을 활용하여 평가할 경우 제한된 예산으로 시장에서 어떤 물건을 살 것인지 그리고 왜 그 물건을 선택했는지, 선택할 때 무엇을 기준으로 선택했는지를 발표하게 한다. 이를 통해 선택의 문제가 발생하는 이유와 합리적인 기준 설정 방법을 이해하는지를 평가할 수 있다.\n우리 지역과 다른 지역의 물자 교환 및 교류 사례에 대한 조사 보고서를 발표하게 하고, 이를 바탕으로 지역 간 경제 교류가 필요한 이유를 이해하는지를 평가한다.\n② 유의 사항\n역할 놀이, 모의 시장 놀이, 토의 활동 등 학생 활동을 평가할 수 있는 체크리스트를 마련하여 학습 과정을 평가하도록 한다.\n<사회 변화와 문화 다양성>","l":"자원의 희소성, 경제활동에서 선택의 문제, 시장, 생산, 소비, 지역 간 물자 교환 및 교류"},"2015|사회|3~4학년|다양한 삶의 모습과 변화|3":{"x":"이 단원은 사회 변화로 인해 나타난 일상생활의 변화 모습과 그 특징을 분석하고, 이러한 생활 모습의 변화로 인해 발생하는 문제점과 그 해결 방안을 탐구함으로써 사회 변화에 따른 대처 방안을 모색하는 능력과 삶의 다양성을 존중하는 태도를 기르는 데 주안점을 둔다.","m":"실제 사례나 다양한 시사 자료를 통해 사회 변화(저출산·고령화, 정보화, 세계화 등)가 일상생활에 미친 영향을 탐구하며, 문화 다양성이 확산되면서 발생하는 편견이나 차별 문제의 원인을 파악하고 바람직한 해결 방안을 모색하도록 한다.\n사회 변화의 다양한 양상과 그것이 일상생활에 미친 영향과 특징이 잘 드러난 각종 통계 자료, 신문 기사, 영화, 사진 등 다양한 자료들을 적극 활용하도록 안내한다.\n문화 다양성의 확산으로 발생하는 편견이나 차별 현상은 가치 판단이 요구되는 문제임을 인식하고, 학생들이 현재 가지고 있는 신념이나 경험과 관련지어 반성적으로 살펴보게 함으로써 태도 변화를 모색할 수 있도록 지도한다.\n편견이나 차별과 같은 문제를 학습할 때, 학생들이 평소 갖고 있는 편견이나 차별 사례들을 사전에 조사하여 학습 과정에 반영한다.","v":"① 평가 방법\n보고서법이나 포트폴리오법을 활용하여 사회 변화가 일상생활에 미친 영향 및 특징을 탐구하는 능력을 평가한다.\n서술형 평가나 토의법을 활용하여 문화적 편견이나 차별이 발생하는 요인을 찾고 그에 대한 해결 방안을 모색하는 능력을 평가한다.\n학생들이 평소 갖고 있는 편견이나 차별적 태도에 대해 스스로 체크리스트를 작성하여 평가해 보도록 함으로써 편견 제거를 위한 실천 노력을 유도한다.\n② 유의 사항\n보고서법이나 포트폴리오법 등을 활용할 때에는 사회 변화가 일상생활에 미친 영향과 특징에 관한 자료 수집 및 분석 방법을 적절하게 지도한 후 평가한다.\n토의법, 논술형 평가 등을 활용할 때에는 편견이나 차별 문제의 발생 요인과 이의 해결 방안과 관련된 주장 및 근거의 타당성과 논리성 등을 중심으로 평가한다.","l":"사회 변화, 문화 다양성의 확산과 그에 따른 문제, 타문화 존중"},"2015|사회|5~6학년|국토와 우리 생활|1":{"x":"이 단원은 국토의 위치와 영역, 자연환경과 인문환경이 지니는 특성을 탐구하고, 이를 바탕으로 하여 국토에 대한 올바른 인식과 국토애를 함양하는 데 주안점을 둔다.","m":"국토에 관한 여러 학습 주제에서는 지도나 그래프 등의 자료를 토대로 사실 정보 파악하기, 두 가지 사실 정보 사이의 관계(일반화) 도출하기, 두 가지 사실 정보 외의 다른 사실 정보를 추가하여 관계 확장하기 등의 활동이 위계적으로 이어지도록 한다.\n국토 영역이나 지역 구분 등의 주제에서는 백지도 활용 학습을, 자연재해에 대한 대책 모색의 경우에는 문제 해결 학습을, 인구 분포나 산업구조 변화 학습에서는 탐구 학습을 활용할 수 있다. 더불어 국토의 지역 구분, 지형 모형 제작을 통한 국토의 지형 특성 탐색, 자연재해 대책 등의 주제에서는 프로젝트 학습의 적용도 가능할 것이다. 특히 지형 학습에서는 영상 자료를 활용하여 우리 국토의 아름다움을 감상하게 하고, 이를 통해 학습자가 국토의 아름다움과 소중함을 깨닫고, 나아가 지속가능한 환경 보전의 태도를 지니게 한다.\n효과적인 학습을 위해 다양한 인터넷 디지털 영상 자료나 지도, 통계 자료, 그래프, 사진 등 시각 자료의 활용이 필요하다. 위치와 영역 주제에서는 국토지리정보원 누리집 내 각종 지도 자료, 인터넷상의 디지털 영상, 국토 전체 및 지방별 백지도를 활용할 수 있다. 자연환경 주제에서는 지형이나 지세 관련 각종 주제도, 기상청 누리집에 탑재된 기후 관련 통계 자료와 그래프, 위성사진 등을 활용할 수 있다. 인문환경 주제에서는 이미 개발된 다양한 그래픽 자료와 주제도를 적절히 활용하도록 하며, 통계청 누리집에 제시되어 있는 인구, 산업, 도시, 교통 관련 자료를 적절하게 재구성하여 활용한다.\n성취기준상의 학습 주제는 편의상 항목별로 구분되어 제시된 것이다. 따라서 실제 교수·학습활동에서는 연관된 주제를 상호 입체적으로 연계시켜 재구성함으로써 국토의 특성과 변화를 종합적이고 간략하게 이해하도록 지도한다.\n텍스트 자료에 의존해서 이루어지는 설명식 학습활동보다는 백지도 완성, 지형 모형 제작, 사진이나 그래프 해석, 그래프나 주제도와 같은 공간 자료로의 변환 활동 등을 통해 창의력과 의사소통 능력을 함양하는 데도 유의한다.\n현재의 국토 모습을 이해하는 것에서 더 나아가 궁극적으로 미래의 바람직한 국토상에 대해 구상해 보도록 한다.","v":"① 평가 방법\n지도, 사진, 그래프 등 다양한 시각·공간 자료를 바탕으로 하여 ‘사실 지식의 확인, 공간적 분포 패턴의 인식, 지리적 정보 사이의 관계 탐색, 관계의 확장’의 순서로 문항을 계열적으로 구성하는 순차적 산물형 방식의 평가가 적절할 것이다.\n선다형이나 서술형 평가에서도 단편적인 사실이나 공간적 맥락이 없는 소재를 중심으로 문항을 구성하기보다는, 지도를 활용하여 구체적인 지역을 배경으로 한 통합적인 과제나 문항을 구안하도록 한다. 아울러 선다형 평가에서도 주제도나 그래프 자료 등을 활용하여 학습자의 도해력을 평가한다.\n다양한 형식의 주제도 및 그래프 작성, 지형 모형 제작, 백지도 완성 등 수업과 통합된 수행평가를 통해 학생들의 기능을 측정할 수 있도록 한다.\n프로젝트법을 활용하여 평가할 경우 현장 체험 학습이나 가족 여행 설계하기 등과 같이 실제 생활과 관계 깊은 활동을 프로젝트 주제로 선정할 수 있다.\n② 유의 사항\n국토 지리의 이해 정도에 대한 평가는 텍스트 중심의 추상적인 자료보다는 주제도나 그래픽 중심의 구상적인 자료의 활용도를 높여야 할 것이다. 아울러 과제 개발이나 문항 구성에서 공간적인 맥락이 중시되고 강조될 필요가 있다.\n단편적인 사실 지식의 평가보다는 국토에 대한 종합적인 이해력, 지리 정보 활용 능력 및 의사소통 능력 등을 측정할 수 있도록 유의한다.","l":"국토의 위치와 영역, 국토애, 국토의 지역 구분, 행정구역의 위치 및 도(시)청 소재지, 국토의 기후와 지형, 국토의 자연재해와 대책, 국토의 인구 분포 및 구조 변화, 국토의 도시 발달 과정, 국토의 산업구조 변화, 국토의 교통 발달 과정"},"2015|사회|5~6학년|인권 존중과 정의로운 사회|1":{"x":"이 단원은 인권 신장을 위해 노력했던 옛 사람들의 활동과 오늘날 인권 보장이 필요한 사례를 조사하고, 이를 통해 인권의 중요성을 인식하고 인권 보호를 위해서 스스로 노력하고 실천하는 태도를 육성하는 데 주안점을 둔다.","m":"인권을 신장하기 위한 옛 사람들의 노력이 드러나는 사례를 인물과 사회제도(경국대전 속 인권 관련 조항, 장애인이나 여성의 인권 신장 관련 제도 등)를 중심으로 조사하도록 한다. 이때 조사 자료를 가지고 역사 신문 만들기, 인물 소책자 만들기, 극화 학습 등과 같은 학습활동을 수행할 수 있다.\n일상에서 경험하는 인권 보장이 필요한 사례를 찾고 인권을 지키기 위해서 어떤 노력이 필요한지를 토의하도록 한다.\n학생 인권과 관련된 다양한 자료(책, 보고서, 신문 자료 등)를 모아서 전시하고, 이것을 토대로 인권 보장에 관한 주제를 선정하여 토의할 수 있다.\n인권 보장은 사회 구성원들의 끊임없는 노력을 통해 점진적으로 확대되고 있다는 사실을 파악할 수 있도록 지도한다.\n인권은 우리의 생활과 밀접한 관련이 있고, 인권을 스스로 지키려는 노력이 필요함을 인식한다.","v":"① 평가 방법\n보고서법을 활용할 경우 인권 신장을 위해 노력한 옛 사람들의 주장이나 활동 내용이 얼마나 잘 드러나 있는가에 주안점을 두어 평가한다.\n서술형 방식으로 평가할 경우 인권 보장이 필요한 사례를 제시하고 사례별 해결 방안을 구안하는 능력을 평가할 수 있다.\n② 유의 사항\n인권을 관념적으로 접근하기보다는 사례나 경험과 연관 지어 평가하도록 유의한다.\n<인권 보장과 헌법>","l":"인권 신장을 위한 옛 사람들의 노력, 인권의 의미, 인권 보장이 필요한 사례, 인권의 중요성, 인권 보호의 실천"},"2015|사회|5~6학년|인권 존중과 정의로운 사회|2":{"x":"이 단원은 인권 보장을 위한 헌법의 역할 및 중요성을 학습하고 헌법에서 규정하는 기본권과 의무를 중심으로 헌법과 실생활과의 관련성을 탐구해 봄으로써 인권과 헌법에 대한 올바른 이해를 도모하는 데 주안점을 둔다.","m":"생활 주변에서 인권 보장이나 국민의 의무와 관련된 구체적 사례들을 담고 있는 신문 기사나 법률 조항, 관련 사례 조사에 필요한 자료(국회 법률 지식 정보 시스템, 법제처 누리집 등 참고)를 검색해서 학습에 활용할 수 있도록 안내한다.\n헌법 조항을 통해 인권 보장을 위한 헌법의 역할을 학습하는 것은 학생들 수준에서 추상적이고 어려운 일이므로, 관련 조항을 생활 속 인권 사례들과 자연스럽게 연계되도록 수업 내용을 구성한다.\n인권 보장을 주제로 한 신문이나 홍보 자료 제작 활동을 하는 경우에는 인권, 기본권, 의무 관련 사례에 관한 자료의 형식이나 구성 방식 등에 대해 소개하는 간단한 자료를 학생들에게 미리 제시하여 참고하게 한다.","v":"① 평가 방법\n보고서법을 활용하여 평가할 경우 인권 보장을 위한 헌법의 역할과 중요성을 탐구하는 과제를 제시하고 정보 수집 및 분석 능력, 결론 도출 능력, 문제 해결 능력 등을 평가한다.\n기본권 실현이나 의무 이행과 관련된 사회적 쟁점이나 사례를 제시하고 이에 대해 자신의 주장이 담긴 간단한 글을 작성해 보게 하거나, 면접법을 실시하여 권리와 의무의 조화를 추구하는 태도를 평가한다.\n인권 보장과 국민의 의무 관련 주제로 신문이나 홍보 자료를 제작하는 과정에서 요구되는 가치 판단 능력, 문제 해결력, 의사소통 능력 등을 관찰법을 활용하여 평가한다.\n② 유의 사항\n보고서법을 활용할 경우 인권을 보장하는 헌법의 역할과 중요성에 대한 핵심 내용이 타당하게 제시되어 있는지를 중점적으로 평가할 수 있다.\n면접법을 활용할 경우 생활 주변에서 쉽게 경험할 수 있는 권리와 의무의 충돌 사례를 제공하고, 이에 대해 학생들이 가치 판단을 내리고 그 이유를 설명할 수 있도록 안내한다.\n<법의 의미와 역할>","l":"인권 보장, 헌법의 역할, 기본권, 권리, 의무"},"2015|사회|5~6학년|인권 존중과 정의로운 사회|3":{"x":"이 단원은 다양한 사례를 통해 우리 실생활과 법의 관련성을 탐구하고 법의 의미와 성격에 대해 파악하며, 권리 보호와 질서 유지를 담당하는 법의 역할을 이해함으로써 법을 준수하는 태도를 기르는 데 주안점을 둔다.","m":"생활 경험이나 여러 매체를 통해 법이 적용되는 생활 속 다양한 사례를 조사하거나, 적절한 사례를 제공하고 이를 분석하게 하여 법의 의미와 성격을 파악하도록 한다. 그리고 문제 상황(시민의 권리 침해, 사회질서 침해 등)을 설정하여 관련 인물들(경찰관, 판사, 변호사 등)이 할 수 있는 행동을 시연해 보고 행동의 과정과 결과를 평가하는 역할 놀이 학습을 적용함으로써 권리 보호와 질서 유지를 담당하는 법의 역할을 파악하도록 한다.\n생활 속에서 법 관련 사례를 조사할 때는 시사 자료(신문, 뉴스 등)뿐만 아니라 주변 사람들이 경험했던 실제 사례도 포함시키도록 한다.\n법 관련 사례를 학습에 활용할 때 민사 사건이나 형사 사건 등 다양한 유형의 사례를 접할 수 있도록 하되, 학생들이 쉽게 이해할 수 있도록 재구성하여 안내한다.\n역할 놀이 학습에 필요한 학습 자료를 구성할 경우 학생들이 일상생활 속에서 경험할 수 있는 문제 상황을 설정하며 권리 보호 및 질서 유지와 관련된 법의 성격이 잘 드러나도록 스토리를 구성한다.\n역할 놀이가 효과적으로 활용되기 위해서는 학생들이 연극 활동 자체보다는 역할 놀이의 주제, 내용 등을 주목할 수 있도록 안내한다.","v":"① 평가 방법\n서술형 평가를 할 경우에는 우리 생활 속에서 법이 적용되는 사례를 제시한 후 이를 통해 법의 의미와 성격을 분석하거나 도출하는 능력을 평가한다.\n역할 놀이에 대한 참여도와 문제 상황에 대한 분석 능력 및 법의 역할에 대한 충실한 파악 여부를 평가하기 위해 학습지나 체크리스트를 활용한 관찰법 및 면접법을 활용한다.\n② 유의 사항\n일상생활에서의 법 적용 사례를 민사 사건이나 형사 사건 등 다양한 차원에서 제시할 수 있도록 평가 문항을 구성하되 학생들이 이해하기에 너무 복잡한 사례를 선정하는 것은 지양한다.\n역할 놀이를 활용한 평가에서는 문제 상황에서 도출되는 핵심적인 법 관련 학습 내용을 얼마나 잘 이해하고 참여했는가에 주안점을 두고 평가한다.","l":"법의 의미와 성격, 법의 역할, 준법정신"},"2015|사회|5~6학년|옛 사람들의 삶과 문화|1":{"x":"이 단원은 고대 시기부터 조선 전기에 이르기까지 나라의 성장과 문화 발전에 기여한 인물의 삶을 알아보고, 문화의 우수성을 탐색하는 데 주안점을 둔다.","m":"과거의 문화유산을 이해하거나 사람들의 삶을 간접적으로 체험하기 위해 극화 학습을 활용할 수 있다. 이때 문화유산 학습의 경우 그와 관련된 설화에 등장하는 인물을 중심으로 구성할 수 있다.\n인물 및 문화유산과 관련된 사진, 동영상, 지도 등의 시청각 자료와 위인전, 이야기책 등을 활용할 수 있다.\n주변에 역사적 인물과 문화유산과 관련된 장소가 있다면 이를 적극 활용하여 현장 학습을 진행할 필요가 있다. 이때 준비 및 정리 활동을 통해 장소가 갖는 역사적 의의를 충분히 파악할 수 있도록 한다.\n역사 지도 등을 이용하여 대외 관계 및 국난 극복의 과정, 각 나라의 영토 범위 등을 시각적으로 제시함으로써 역사적 맥락과 주변국과의 관계를 파악할 수 있도록 한다.","v":"① 평가 방법\n서술형 평가, 보고서법, 포트폴리오법 등을 활용하여 고대 시기부터 조선 전기에 이르는 인물과 문화유산에 대한 이해도를 평가할 수 있다.\n극화 학습을 통해 평가할 경우 체크리스트법, 상호 평가 방식 등을 활용하거나 활동 소감문을 작성하도록 하여 활용할 수 있다.\n프로젝트법을 활용할 경우 인물이나 문화유산 관련 역사 신문 만들기 등의 과제를 부과하여 평가할 수 있다.\n② 유의 사항\n서술형 평가의 경우 단편적인 사실 지식을 측정하기보다는 문화유산 및 인물들과 관련된 사건 혹은 사실들을 당시의 시대적 상황과 연관 지어 이해하고 있는지를 평가한다.","l":"고대 국가의 성장과 문화 발전, 고려의 건국과 외침 극복, 고려의 문화와 과학기술, 조선 전기 정치와 문화 발전, 조선의 외침 극복"},"2015|사회|5~6학년|사회의 새로운 변화와 오늘날의 우리|1":{"x":"이 단원은 조선 후기부터 6. 25 전쟁까지 우리나라의 역사 발전에 기여한 인물들의 활동을 통해 우리나라의 역사 발전 과정을 이해하고, 대한민국의 발전을 위해 노력하는 자세의 중요성을 인식하도록 하는 데 주안점을 둔다.","m":"영·정조 시기의 개혁 정치에 대한 역사 글쓰기를 통해 당시 사회상과 개혁 정치의 의미를 파악하도록 한다. 역사 글쓰기는 영·정조의 시각에서 개혁 정치가 필요한 이유와 구체적인 개혁 조치를 서술하거나 신하의 입장에서 개혁의 필요성을 논하는 글을 쓰게 하는 방식으로 구성할 수 있다.\n조선 후기 서민 문화에 대하여 학습할 때에는 판소리, 탈춤과 관련된 사진 및 동영상 자료, 민화 등을 이용하여 당시 사람들의 모습을 살펴볼 수 있다.\n광복을 위하여 노력한 인물들의 활동이나 6. 25 전쟁을 설명할 때에는 다큐멘터리와 사진 등의 자료를 활용할 수 있다. 또한 학습한 사건이나 인물을 역사 신문의 형식으로 정리하여 발표하게 할 수 있다.\n옛날 어린이들의 생활과 관련된 민화, 풍속화 등의 자료를 제공하여 당시의 생활 모습을 파악하도록 안내한다.","v":"① 평가 방법\n서술형 평가, 보고서법 등을 활용하여 조선 후기부터 6. 25 전쟁에 이르기까지의 인물 및 주요 사건에 대한 이해도를 평가할 수 있다.\n역사 글쓰기의 경우 사건의 전후 관계 또는 당시의 시대상을 맥락적으로 이해하고 있는지에 중점을 두어 평가한다.\n프로젝트법을 활용할 경우 주요 인물 및 사건과 관련된 역사 신문 만들기 등의 과제를 부과하여 평가할 수 있다.\n② 유의 사항\n역사 글쓰기를 평가할 때는 당시 사회상을 이해하였는지의 여부와 사회 개혁의 방향을 논리적으로 제시하였는지를 주로 살펴본다.\n역사 신문 만들기를 평가할 때에는 역사적 인물과 사건 등을 당대 시대적 흐름과 관련지어 이해하고 있는지 평가하도록 한다.","l":"영·정조 개혁 정치, 조선 후기의 사회 개혁 노력, 국권 회복 운동, 대한민국 수립, 6. 25 전쟁"},"2015|사회|5~6학년|우리나라의 정치 발전|1":{"x":"이 단원은 민주화의 역사를 통해 우리나라 민주주의의 발전 과정을 이해하고, 시민의 정치 참여로 민주주의가 발전할 수 있다는 사실을 파악함으로써 민주 사회 건설을 위해 노력하는 태도를 함양하는 데 주안점을 둔다.","m":"다양한 사료를 바탕으로 4. 19 혁명, 5. 18 민주화 운동, 6월 민주 항쟁의 원인, 과정, 결과에 대한 이해를 통해 자유민주주의의 발전 과정을 파악하도록 한다. 자유민주주의 발전 과정을 통해 얻을 수 있는 시사점을 주제로 토의 학습을 진행하여 비판적 사고 능력을 함양하도록 한다.\n광복 이후 시민들의 정치 참여 및 민주화 과정과 관련된 다양한 동영상과 사진 자료, 편지, 육성 자료 등을 학생의 발달 수준을 고려하여 제공한다.\n민주화와 관련된 동영상 자료의 경우 학생들의 발달 수준을 고려하여 내용을 이해하기 쉽도록 편집해서 사용하고, 사진이나 편지 등과 같은 자료의 경우 자료에 담긴 의미를 탐색하도록 안내한다.","v":"① 평가 방법\n서술형 평가를 활용할 경우 민주화 과정에 대한 다양한 사료를 제시한 후 민주화 과정에 대한 이해도를 평가할 수 있다.\n토의 학습을 활용하여 평가할 때에는 토의 참여도, 주장의 논리적 정합성 등을 중심으로 평가할 수 있다.\n② 유의 사항\n학생들이 토의 학습 과정에서 전개한 논리가 서로 다른 가치에 바탕을 두고 있다고 하더라도, 그 가치 자체를 평가의 주요 요소로 삼기보다는 논리적 정합성을 중심으로 평가하도록 한다.\n<일상생활과 민주주의>","l":"4. 19 혁명, 5. 18 민주화 운동, 6월 민주 항쟁, 자유민주주의의 발전 과정, 시민의 정치 참여"},"2015|사회|5~6학년|우리나라의 정치 발전|2":{"x":"이 단원은 민주주의의 의미와 중요성, 민주적 의사 결정의 원리를 일상생활 차원에서 학습함으로써 우리 생활과 민주주의의 관련성을 탐색하는 데 주안점을 둔다.","m":"일상생활에서 의사 결정이 필요한 구체적인 사안(학급 규칙 제정, 자리 배정 방법, 학급 봉사 활동 장소와 방법 등)을 선정하여 민주적 의사 결정 과정을 경험해 보게 한다. 또는 일상생활 속에서 발생하는 공동체 문제(학교 폭력 문제, 환경오염 문제 등)를 선정하여 문제 발생의 요인을 탐구하고, 상호 토의 및 협력을 통해 문제를 해결하는 경험을 하게 한다.\n직접 경험한 일상 사례(학급 임원 선거에 적용되는 절차나 규약, 학급 회의에서의 의제 선정 방식 등)나 학생들의 생활과 관련하여 공감할 수 있는 일상 사례(학생 인권 조례, 지방 선거 홍보 자료 등)와 관련된 다양한 자료를 활용한다.\n민주 사회에서 합의 도출 방식으로 일반적으로 사용되는 ‘다수결 원칙’은 일정한 한계를 갖고 있으므로, 의사 결정 과정이 민주적으로 실현되기 위해서는 대화와 타협, 소수 의견 존중이 전제되어야 한다는 점을 강조한다.","v":"① 평가 방법\n민주주의의 의미와 민주적 의사 결정 원리의 필요성을 이해하고 이를 일상생활 속 실천 사례에 적용하는 능력을 서술형으로 평가할 수 있다.\n토의법을 활용할 경우 의사 결정이나 문제 해결 과정에서 민주적 의사 결정 원리를 토의 과정에 적용하여 적절히 참여할 수 있는지를 평가한다.\n체크리스트법을 활용할 때는 민주주의를 실천하려는 태도와 민주적 의사 결정 원리를 생활에서 적용하려는 자세를 관찰하고 점검하여 평가할 수 있다.\n② 유의 사항\n민주적 의사 결정 원리의 필요성에 대한 서술형 평가 문항을 구성할 때에는 민주적 의사 결정 원리가 적용되지 않았을 경우에 일어날 수 있는 구체적인 사례를 제시해 주고, 다수결, 대화와 타협, 소수 의견 존중 등에 대한 원리가 문항 작성 과정에서 자연스럽게 반영될 수 있게 한다.\n토의법을 활용할 때는 토의의 사전 준비도뿐만 아니라 실제 토의 참여 과정에서 민주적 의사 결정 원리를 존중하여 토의에 참여하는지를 중점적으로 평가한다.\n관찰법으로 민주적 의사 결정 원리를 실천하는 태도를 평가할 때는 교과 수업 내에서 실시되는 정규 학습활동뿐만 아니라 학급 회의와 같이 학생들이 일상생활에서 의사 결정이 필요한 경우까지 연계시켜서 지속적으로 평가한다.\n<민주정치의 원리와 국가기관의 역할>","l":"민주주의의 의미와 중요성, 민주적 의사 결정 원리"},"2015|사회|5~6학년|우리나라의 정치 발전|3":{"x":"이 단원은 민주정치의 기본 원리에 대한 이해를 바탕으로 하여 이를 실현하기 위해 필요한 국가기관의 역할을 탐구함으로써 민주주의와 국민생활의 관련성을 파악하는 데 주안점을 둔다.","m":"신문 기사, 뉴스 등 다양한 시사 자료를 활용하여 민주정치의 기본 원리(국민 주권, 권력 분립 등)가 적용된 사례(대통령 선거, 국회의원 선거, 국정감사 등)를 탐색한다. 또한 국가기관의 역할을 학습할 때 국회, 행정부, 법원의 역할을 직간접적으로 체험할 수 있는 유관 기관 및 누리집을 활용한다.\n대표적인 국가기관에 종사하는 사람(국회의원, 장관, 법관 등)들이 하는 일을 조사하여 국가기관의 역할과 권한을 이해하되 학습 내용이 지나치게 깊어지지 않도록 유의한다.\n민주정치의 기본 원리나 국가기관의 역할에 관한 시사 자료를 학생 수준에 맞게 재구성한 후 활용한다.\n민주정치의 기본 원리와 관련 사례를 탐구하는 프로젝트 학습이나 국가기관의 주요 역할(의정 활동, 국무 회의, 재판 등)에 대한 역할 놀이, 모의 시연 활동을 할 때에는 역할을 분담하여 과제 수행이 이루어질 수 있도록 안내한다.\n국가기관이 국회, 행정부, 법원으로 나뉘는 이유를 권력분립의 관점에서 파악할 수 있도록 한다.","v":"① 평가 방법\n민주정치의 기본 원리나 국가기관의 역할을 사례에 적용하는 능력을 서술형으로 평가한다.\n국가기관의 역할과 국민 생활과의 관련성을 탐구하는 보고서를 작성하게 하여 자료 수집의 과정 및 내용, 분석의 타당성, 구성의 체계성 등을 평가한다.\n국가기관의 역할을 시연하는 역할 놀이나 모의 시연을 할 경우에는 참여도를 관찰하여 평가하거나, 국가기관의 각각의 역할에 대한 이해도를 평가하기 위한 면접법을 실시한다.\n② 유의 사항\n서술형 평가에서는 민주정치의 기본 원리나 국가기관의 역할 등을 일상생활과 연관 지어 그 의미와 중요성을 탐색할 수 있는 문항을 구성한다.\n보고서법을 활용하여 국가기관의 역할과 국민 생활과의 관련성을 평가할 때는 다양한 시사 자료를 수집하고 분석하여 각 국가기관의 역할 차이가 분명하게 드러나도록 작성하게 한다.","l":"민주정치의 기본 원리, 국회, 행정부, 법원"},"2015|사회|5~6학년|우리나라의 경제 발전|1":{"x":"이 단원은 경제활동에서 가계와 기업의 역할에 대해 이해하고 합리적 선택 방법을 탐색하며, 시장경제 질서를 기반으로 하되 경제 정의도 추구하는 우리나라 경제체제의 특징을 파악하는 데 주안점을 둔다.","m":"일상생활 속에서 가계와 기업에 의해 이루어지는 경제활동 사례를 분석하게 하고, 합리적 선택 능력을 길러 주기 위한 가상의 상황(특정 상품 구매, 가상 회사의 사업 기획 등)을 설정하여 연습해 볼 수 있게 한다. 그리고 경제활동과 관련된 다양한 시사 자료를 조사하고 분석하여, 시장경제 질서를 바탕으로 하되, 이에 수반되는 문제점을 시정하고 경제적 형평성을 위해 국가의 규제와 조정을 용인하는 우리나라 경제체제의 특징을 탐구하게 한다.\n경제와 관련된 다양한 자료 등을 안내하여 자유경쟁과 경제 정의에 관한 생활 속 사례에 쉽게 접근할 수 있도록 지도한다.\n합리적 선택을 위한 가상 상황을 제시할 때 일상생활에서 학생들이 접할 수 있는 사례를 위주로 구성하며, 경제 윤리에 반하지 않도록 유의한다.\n합리적 선택을 할 때 선택을 위한 다양한 기준이 있으며, 우선 순위도 개인에 따라 다를 수 있다는 점을 파악할 수 있게 한다.\n자유경쟁과 경제 정의 중 어느 하나만 채택했을 경우 발생할 수 있는 문제점에 대해 생각해 보게 하여 양자의 조화를 추구하려는 우리나라 경제체제의 특징을 이해할 수 있도록 한다.","v":"① 평가 방법\n구체적인 경제활동 사례(가족 구성원의 소비나 생산 활동 등)를 제시하고 가계와 기업의 역할을 파악할 수 있는 능력을 서술형으로 평가할 수 있다.\n활동지법을 활용하여 합리적 선택 기준에 대한 이해도 및 합리적 선택 과정과 결과를 총체적으로 평가할 수 있다.\n자유경쟁과 경제 정의의 조화를 추구하는 우리 경제체제의 특징을 제대로 파악했는지를 알아보기 위해 서술형 평가나 면접법을 활용할 수 있다.\n② 유의 사항\n활동지법을 적용할 때는 합리적 선택을 위한 핵심 내용과 활동을 구조화한 활동지를 활용하여 평가를 실시한다.\n면접법을 실시할 때 자유경쟁과 경제 정의의 조화를 추구하는 경제체제의 특징에 대한 이해도를 순차적으로 평가하기 위한 하위 질문을 여러 개 구성하여 활용한다.\n<경제생활의 변화와 우리나라 경제의 성장>","l":"경제활동, 경제주체의 역할, 합리적 선택, 우리나라 경제체제의 특징"},"2015|사회|5~6학년|우리나라의 경제 발전|2":{"x":"이 단원은 우리나라 경제의 성장 과정에서 나타난 특징과 문제점을 역사적 관점에서 탐구하고 더 나은 미래 사회를 만들기 위해 해결할 과제들을 탐구하는 데 주안점이 있다.","m":"시사 자료와 사료를 활용하여 우리나라 경제의 성장 과정과 성장 요인, 경제 구조의 변화와 그에 따른 문제점 등을 파악하도록 한다.\n토의법을 활용하여 경제성장 과정에서 나타난 문제점에 대한 적절한 해결 방법을 탐색하도록 한다. 이를 통해 현재의 문제는 과거로부터 비롯된다는 역사적 인식 능력이나 미래 지향적 사고를 함양할 수 있도록 한다.\n경제성장 과정과 관련된 다양한 통계 자료, 사진, 동영상, 지도 등의 시청각 자료들을 활용한다.\n경제성장에 따른 사회 변동 및 관련 문제에 대한 시사 자료를 찾아 신문 만들기 활동을 하거나 간단한 동영상 제작을 안내할 수 있다.","v":"① 평가 방법\n서술형 평가에서는 경제성장 과정과 관련된 시사 자료를 제시하여 지속적인 경제성장을 위해 해결해야 할 과제에 대한 이해도를 평가할 수 있다.\n토의법을 활용할 경우 우리나라 경제성장의 문제점 및 개선 방안에 대해 제시된 의견의 적절성을 중심으로 평가할 수 있다.\n② 유의 사항\n시사 자료나 사료를 활용하여 평가할 경우 자료에 대한 이해도, 분석력 등에 대한 항목을 넣은 평가 기준표를 작성하여 활용할 수 있다.\n<세계 속의 우리나라 경제>","l":"경제성장 과정, 경제생활의 변화, 경제성장 과정 속에서의 문제 및 과제"},"2015|사회|5~6학년|우리나라의 경제 발전|3":{"x":"이 단원은 세계화로 야기된 세계 여러 나라와의 경제 교류 활동이 경제생활에 미친 변화 모습을 탐구하며, 경제 교류에 관한 다양한 사례 분석을 통해 오늘날 우리나라 경제가 다른 나라와 상호 의존과 경쟁 관계에 있음을 파악하는 데 주안점을 둔다.","m":"각 나라의 기술적·환경적 특징 등이 잘 드러나는 무역의 실제 사례를 조사하여 무역 발생의 원인을 추론하거나 가상 무역 활동을 통해 무역이 발생되는 원리를 파악하도록 한다. 또한 우리나라가 다른 나라와 경제적 상호 의존과 경쟁 관계를 맺고 있음을 탐구하고, 무역 관련 문제나 쟁점의 발생 요인을 탐구하여 합리적인 문제 해결 방안을 모색한다.\n여러 나라와의 경제 교류 사례를 조사할 때는 이를 체계적으로 정리할 수 있도록 일정한 양식(무역 상대국, 무역 품목 등)을 제공하여 활용하도록 한다.\n다양한 경제 관련 통계 자료나 시사 자료를 활용하여 무역 관련 문제나 쟁점을 조사하고 그 원인 및 해결 방안을 모색하는 학습활동을 실시할 수 있다.\n시사 자료에 자주 등장하는 무역 관련 용어(자유무역협정, 무역 마찰, 수출 경쟁력, 무역 의존도 등)의 경우 발달 수준에 맞도록 설명해 주어 경제적 상호 의존과 경쟁 관계를 파악할 수 있도록 안내한다.","v":"① 평가 방법\n무역 상황을 제시한 후 무역 발생의 원인이나 특성을 파악하는 능력을 서술형으로 평가하거나, 무역 관련 문제나 쟁점 해결 방향에 대한 자신의 견해를 주장하는 능력을 논술형으로 평가할 수 있다.\n무역 관련 문제나 쟁점을 제시하고 이에 대한 해결 과정에서 적절한 자료 수집 및 근거 제시 능력, 토의 참여 능력 및 태도 등을 토의법으로 평가할 수 있다.\n수출 경쟁력을 제고하는 다양한 방안을 모색하는 능력을 프로젝트법을 활용하여 평가할 수 있다.\n② 유의 사항\n서술형 문항 구성 시 무역 발생의 조건 및 상황을 발달 수준에 맞게 구성하며, 논술형 평가를 할 때는 무역 관련 문제나 쟁점에 대한 가치 판단 및 정당화 과정을 평가할 수 있는 주제를 선정한다.\n무역 관련 문제나 쟁점에 대한 토의 과정에서 평가를 실시할 때는 근거 제시 능력, 의사소통 능력 등을 중심으로 평가한다.\n무역 관련 문제나 쟁점을 탐구하는 프로젝트법을 실시할 때는 분업과 협업이 잘 이루어지도록 수행하되 자기 주도적으로 참여할 수 있도록 안내한다.","l":"경제 교류, 무역, 상호 의존, 상호 경쟁"},"2015|사회|5~6학년|세계의 여러 나라들|1":{"x":"이 단원은 다양한 공간 표현물의 특성, 대륙 및 세계 주요 국가에 대한 기초적인 지리 정보, 세계의 다양한 자연환경 및 인문환경과 인간 생활의 관계, 우리와 밀접한 관계를 맺고 있는 국가들의 지역적 특성 등을 탐구하고, 이를 바탕으로 하여 세계에 대한 올바른 이해를 도모하고 세계시민으로서 지녀야 할 지구촌적 시각과 태도를 함양하는 데 주안점을 둔다.","m":"세계지리 학습은 주제의 성격에 비추어 전반적으로 프로젝트 학습을 활용하기에 적합하다. 이를테면 디지털 영상 지도를 활용한 세계 각국의 위치와 영토 특성, 세계의 주요 기후 특성과 인간 생활, 세계의 다채로운 의식주 생활, 우리와 정치·경제·문화적으로 밀접한 국가들, 우리와 국경을 맞대고 있는 국가들 등의 대주제를 중심으로 여행 설계와 같이 학생들의 흥미와 관심을 유발할 수 있는 프로젝트 과제를 선정하고, 이를 모둠별 활동을 통하여 실행하는 것이다. 이때 어떤 지역의 특성을 글, 그림, 음악, 댄스 등 다양한 방식으로 표현할 수 있도록 안내한다.\n세계지리 학습은 장소나 지역을 기반으로 통합된 주제를 다룬다는 특성에 비추어 대주제를 하위 주제로 세분하여 할당하는 협동 학습 방법을 활용할 수 있다. 예컨대 세계 6대 기후의 이해 주제는 그 대표적인 사례가 될 것이다. 그리고 인간 생활과 자연환경의 관계 주제에서는 탐구 학습을, 우리와 이웃한 세 나라와의 교류 현황 주제에서는 역할 놀이 학습을 적용할 수 있다.\n디지털 영상 지도를 비롯한 각종 통계 자료와 그래프, 사진 등과 같은 시각 자료와 세계의 자연과 문화, 인간과 자연 간의 관계를 다루는 다큐멘터리 영상 기획물을 활용한다. 아울러 지도 퍼즐 등 세계지리 학습을 위한 교재와 교구를 학습활동에 적절히 활용할 수 있다.\n지명과 같은 사실도 지식으로서의 가치를 지니므로 세계 여행 설계 등과 같이 흥미 있는 학습활동의 과정에서 자연스럽게 익힐 수 있도록 한다.\n평면의 세계지도와 더불어 지구본을 활용함으로써 세계에 대한 인식의 왜곡을 최소화하는 것에 특히 유의한다.","v":"① 평가 방법\n세계지리 학습의 평가에서는 선다형이나 서술형 평가가 주로 활용될 수 있다. 이때 소재나 화제 중심의 단편적이고 지엽적인 사실 지식의 문항 구성을 지양하고 지역 중심의 통합적인 문항을 구안하도록 한다. 아울러 선다형 평가에서도 주제도나 그래프 자료 등 다양한 자료의 해석 능력을 통하여 세계지리의 이해도를 평가하도록 한다.\n프로젝트법을 평가에 활용할 때는 새로운 형태의 세계지도 만들기, 세계 여행 설계하기, 세계의 자연과 문화를 소개하는 웹 자료 작성하기, 동아시아 연합 구상하기 등을 프로젝트 과제로 제시할 수 있다.\n세계지리 학습에서는 지식 영역 이외에도 도해력을 포함한 다양한 기능 영역(지구본에서 경도와 위도 특성 알아내기, 세계 백지도 완성하기, 지도 퍼즐 맞추기, 기후 지역별 각종 이미지 만들기, 기후 지역별 전형적인 경관 사진을 적도에서 극지방 순서로 배열하기, 각국의 전통 복식이나 가옥 사진을 세계지도상 해당 국가의 위치에 놓기, 세계 각 국가나 이웃 3국의 지리 특성 비교표 작성하기 등)을 평가할 수 있다.\n② 유의 사항\n세계지리 학습의 평가를 위한 과제 개발이나 문항 구성에서는 텍스트 자료보다는 주제도나 사진 자료의 활용도를 높임으로써 공간적인 시각을 기를 수 있도록 한다.\n세계지리 학습의 평가에서는 세계에 대한 조망, 지구 생태에 대한 기초적인 이해, 인간 생활의 다양성 등에 초점을 두어 평가하도록 한다.","l":"세계지도와 지구본의 특성, 주요 대륙 및 국가의 위치 특성, 세계 주요 기후의 분포와 특성, 인간 생활과 환경의 관계, 우리와 밀접한 관계를 이루는 국가들의 지리적 특성과 상호 의존"},"2015|사회|5~6학년|통일 한국의 미래와 지구촌의 평화|1":{"x":"이 단원은 급변하는 세계 속에서 우리의 고유 영토인 독도의 역사적·지리적 특성 등을 파악하여 영토주권 의식을 기르고, 우리의 소원이며 지구촌 평화에 기여할 수 있는 남북통일을 위한 그동안의 노력들을 살펴보며 통일 한국의 미래상을 그려 보는 데 주안점을 둔다.","m":"우리의 고유 영토인 독도 관련 역사적 자료와 지리적 특성에 대한 이해를 바탕으로 하여 국토 수호 의지와 영토주권 의식을 함양함은 물론 주변국과 영토 관련 분쟁이 발생할 경우 합리적이고 능동적으로 대처할 수 있도록 한다.\n독도의 아름다움을 감상할 수 있게 하여 아름답고 소중한 국토로서의 독도의 가치를 인식하게 지도할 필요가 있다.\n지리적 차원에서 독도에 대한 학습이 이루어지게 함으로써 과거의 역사 속에서 독도의 의의를 넘어 현재에도 우리 영토로서의 위상을 확인하도록 한다.\n통일과 관련된 다양한 자료를 통해 통일이 필요한 이유, 통일을 위한 방법이나 노력, 그 실천 사례 등을 파악하고, 이를 바탕으로 통일의 당위성을 인식하게 한다.\n남북통일은 우리 국민이 하나 되어 발전하기 위해 필요한 것임을 이해하고, 개인 및 국가 차원에서 실천할 수 있는 방안을 찾아보고 이를 실천할 수 있도록 한다.","v":"① 평가 방법\n독도를 지키기 위한 우리 조상들의 노력을 확인할 수 있는 역사적인 사실이나 지리적 특성을 조사하여 보고서로 작성하고 독도가 우리 고유의 영토임을 주장하는 논술형 평가를 실시한다.\n독도의 아름다움과 독도의 역사를 중심으로 독도를 소개하는 글쓰기를 통해 독도에 대한 이해도 등을 평가할 수 있다.\n남북통일에 관한 여러 자료를 바탕으로 통일의 당위성을 주장하는 서술형 평가를 실시할 수 있다.\n통일 한국의 미래상을 그림이나 글로 표현하게 하여 평가할 수 있다.\n② 유의 사항\n독도가 우리 고유의 영토임을 주장하는 논술형 평가 시, 주장을 뒷받침할 수 있는 근거를 역사적인 사실이나 지리적 특성 등에서 찾을 수 있도록 지도한다.\n<지구촌의 평화와 발전>","l":"독도의 역사적·지리적 특성, 독도를 지킨 조상들의 노력, 남북통일을 위한 노력, 통일 한국의 미래상"},"2015|사회|5~6학년|통일 한국의 미래와 지구촌의 평화|2":{"x":"이 단원은 세계 여러 나라에서 일어나는 국제 사회의 다양한 갈등 사례를 통해서 인류 번영과 평화의 중요성을 이해하고, 개인, 국가, 국제기구 등 다양한 행위 주체의 활동 사례를 통하여 국제 사회가 인류 평화와 발전을 위해서 지속적으로 노력하고 있음을 파악하는 데 주안점을 둔다.","m":"세계의 여러 나라에서 일어나는 다양한 갈등 사례를 조사하여 그 원인과 해결 방안을 탐색하도록 한다. 또한 지구촌에서 발생하는 갈등 사례의 해결을 위한 행위 주체들의 노력을 조사하고 이를 통해 지구촌의 평화와 발전에 기여할 수 있는 방안을 토의하도록 한다.\n일상생활에서 지구촌의 다양한 갈등 사례를 해결하는 데 도움이 될 수 있는 실천 방안들을 찾아보고 지구촌의 평화와 발전을 위한 실천 의지를 갖도록 한다.\n프로젝트법을 활용하여 개인이나 모둠별로 여러 국제기구 중 하나를 선택하여 활동 계획서를 작성해 보도록 한다.","v":"① 평가 방법\n체크리스트법을 활용하여 지구촌에서 일어나고 있는 다양한 갈등 사례들 중 주제를 정해 자료를 모둠별로 수집하고, 모둠 활동 참여도, 자료의 적절성 등을 기준으로 평가할 수 있다.\n지구촌의 평화와 발전을 위한 행위 주체들의 노력을 발표하고 난 후, 지구촌의 평화와 발전을 위한 노력이라는 주제로 서술형 평가를 실시할 수 있다.\n지구촌 평화와 발전을 위한 다양한 진로와 직업에 관한 자료를 탐색하는 활동에서 자료 수집 및 분석 능력 등을 평가할 수 있다.\n② 유의 사항\n개인별 또는 모둠별로 자료 수집을 진행할 수 있으며, 학생들의 참여도 및 자료의 적절성 등을 평가 기준으로 하여 자기 평가와 상호 평가를 실시할 수 있다.\n<지속가능한 지구촌>","l":"지구촌의 갈등과 해결 방안, 지구촌의 평화와 발전을 위한 노력"},"2015|사회|5~6학년|통일 한국의 미래와 지구촌의 평화|3":{"x":"이 단원은 주요 환경문제의 해결 방안과 지속가능한 미래를 건설하기 위한 방안을 탐색하고 이를 실천할 수 있는 세계시민의 자세를 기르는 데 주안점을 둔다.","m":"세계의 여러 문제 중에서 우리 생활과 밀접하게 관련된 환경문제의 사례를 조사하여 문제의 원인을 찾고 문제를 해결하기 위한 다양한 주체들의 노력을 찾아본다.\n지구촌의 지속가능한 발전을 위한 과제(친환경적 생산과 소비 방식 확산, 빈곤과 기아 퇴치, 문화적 편견과 차별 해소 등)를 찾아보고, 해결할 수 있는 다양한 방안을 탐색해 보도록 한다.\n지구촌 환경문제 해결과 지속가능한 발전을 위해서 실천할 수 있는 방안을 찾아서 일상생활에서 실천하도록 유도한다.","v":"① 평가 방법\n지구촌에서 일어나고 있는 다양한 환경문제들과 이의 해결 방안을 수집하여 정리하고, 개인 및 국가 차원에서 실천할 수 있는 일에 대해 서술형 평가를 실시한다.\n체크리스트법을 활용하여 우리가 살아가고 있는 지구촌의 지속가능한 발전을 위해 일상생활 속에서 실천할 수 있는 일들의 목록을 작성해 보고, 이를 얼마나 실천하고 있는지 자기 평가하도록 한다.\n② 유의 사항\n서술형 평가 시 지구촌 환경문제의 원인과 해결 방안의 적절성과 실천 가능성을 기준으로 평가한다.\n지구촌의 지속가능한 발전을 위한 체크리스트 평가 목록을 활용하여 생활 속에서 지속적으로 실천할 수 있도록 안내한다.","l":"지구촌 환경문제, 지속가능한 미래, 세계시민의 자세"},"2015|수학|1~2학년|수와 연산|1":{"m":"자연수가 개수, 순서, 이름 등을 나타내는 경우가 있음을 알고, 실생활에서 수가 쓰이는 사례를 통하여 수의 필요성을 인식하게 한다.\n수 세기가 필요한 장면에서 묶어 세기, 뛰어 세기의 방법으로 수를 세어 보고, 실생활 장면에서 짝수와 홀수를 직관적으로 이해하게 한다.\n두 자리 수를 10개씩 묶음과 낱개로 나타내게 함으로써 위치적 기수법의 기초 개념을 형성하게 한다.\n수를 분해하고 합성하는 활동은 20 이하의 수의 범위에서 한다.\n'더한다', '합한다', '~보다 ~ 큰 수', '~보다 ~ 작은 수', '뺀다', '덜어 낸다', '합', '차' 등의 일상용어를 사용하여 덧셈과 뺄셈의 의미에 친숙하게 한다.\n덧셈은 두 자리 수의 범위에서 다루되, 합이 세 자리 수인 경우도 포함한다.\n덧셈과 뺄셈을 여러 가지 방법으로 계산하는 활동을 통하여 연산 감각을 기르게 한다.\n한 가지 상황을 덧셈식과 뺄셈식으로 나타내는 활동을 통하여 덧셈과 뺄셈의 관계를 이해하게 한다.\n□가 사용된 덧셈식과 뺄셈식은 □의 값을 직관적으로 구할 수 있는 수준으로 다룬다.\n학생들에게 친근한 실생활 상황을 이용하여 덧셈과 뺄셈에 관련된 문제를 만들고 해결하게 한다.\n곱셈의 의미는 배의 개념과 동수누가를 통하여 다루고, 1의 곱과 0의 곱은 실생활과 관련지어 다룬다.\n수와 연산 영역의 문제 상황에 적합한 문제 해결 전략을 지도하여 문제 해결 능력을 기르게 한다.","v":"덧셈과 뺄셈을 여러 가지 방법으로 계산하는 활동을 평가할 때에는 학생들이 자유롭게 계산하도록 하는 데 초점을 두고 이를 지나치게 형식화하지 않도록 관찰, 면담 등의 다양한 방법을 이용한다.","l":"덧셈, 뺄셈, 곱셈, 짝수, 홀수, ＋, －, ×, =, >, <"},"2015|수학|1~2학년|도형|1":{"m":"쌓기나무를 이용한 모양 만들기, 칠교판을 이용한 모양 채우기나 꾸미기를 통하여 도형에 대한 공간 감각을 기르게 한다.\n입체도형의 모양이나 평면도형의 모양을 다룰 때 모양의 특징을 직관적으로 파악하여 모양을 분류하고, 분류한 모양을 지칭하기 위해 일상용어를 사용하게 할 수 있다.\n입체도형의 모양과 평면도형의 모양을 이용한 모양 만들기와 꾸미기의 주제는 학생들에게 친근한 소재인 동물, 탈 것, 건물 등으로 다양하게 제시한다.\n쌓기나무로 만든 입체도형의 모양에 대해서 '~의 앞', '~의 오른쪽', '~의 위', '2층' 등을 사용하여 말하게 한다.\n평면도형의 모양을 이용한 모양 꾸미기 활동에서는 스티커, 잡지에서 오려낸 모양 종이 등을 활용하게 할 수 있다.\n삼각형, 사각형, 원은 예인 것과 예가 아닌 것을 인식하고 분류하는 활동을 통하여 직관적으로 이해하게 한다.\n삼각형과 사각형에 대한 직관적 이해를 통하여 도형의 이름과 변 또는 꼭짓점의 개수와의 관계를 파악하고, 그 관계를 일반화하여 오각형과 육각형을 구별하여 이름 지을 수 있게 한다.\n도형 영역의 문제 상황에 적합한 문제 해결 전략을 지도하여 문제 해결 능력을 기르게 한다.","v":"여러 가지 모양 만들기, 꾸미기, 채우기 활동을 평가할 때에는 과정 중심 평가를 한다.","l":"삼각형, 사각형, 원, 꼭짓점, 변, 오각형, 육각형"},"2015|수학|1~2학년|측정|1":{"m":"양의 비교는 직관적인 비교, 직접 비교, 간접 비교 등을 상황에 따라 알맞게 다룬다.\n시각 읽기는 학생의 경험을 소재로 하고, 학생들이 모형 시계를 조작하며 '몇 시', '몇 시 30분', '몇 시 몇 분', '몇 시 몇 분 전' 등의 시각을 읽게 한다.\n시간의 여러 가지 단위를 지도할 때 단위 사이의 관계를 이해하는 데 중점을 두고, 지나친 단위 환산은 다루지 않는다.\n표준 단위를 도입하기 전에 여러 가지 임의 단위를 사용하여 구체물의 길이를 재어보게 한다.\n측정 영역의 문제 상황에 적합한 문제 해결 전략을 지도하여 문제 해결 능력을 기르게 한다.","v":"'몇 시 몇 분 전'의 시각 읽기를 평가할 때 '5분 전', '10분 전', '15분 전' 등과 같이 실생활에서 자주 사용되는 경우를 다루고, '2시 48분'을 '3시 12분 전'으로 나타내는 것과 같이 복잡한 경우는 다루지 않는다.\n1일, 1주일, 1개월, 1년 사이의 관계를 평가할 때에는 달력을 이용하여 그 관계를 이해하는지 파악하는 데 중점을 둔다.","l":"시, 분, 약, cm, m"},"2015|수학|1~2학년|규칙성|1":{"m":"물체나 무늬의 배열에서는 크기, 색깔, 위치, 방향 등에 대한 단순한 규칙을 다루고, 그 규칙을 말, 수, 그림, 기호, 구체물, 행동 등의 다양한 방법으로 표현하게 한다.\n물체나 무늬의 배열에서 다음에 올 것이나 중간에 빠진 것을 추측하여 말하게 한다.\n수의 배열뿐만 아니라 수 배열표, 덧셈표, 곱셈표를 활용하여 수의 규칙을 찾고, 자신이 정한 규칙에 따라 색칠하거나 ○, / 등으로 나타내게 한다.\n자신의 규칙을 창의적으로 만들어보고, 다른 사람의 배열에서 규칙을 찾아보거나 규칙에 대해 서로 말하게 한다.\n규칙성 영역의 문제 상황에 적합한 문제 해결 전략을 지도하여 문제 해결 능력을 기르게 한다.","v":"규칙 찾기를 평가할 때 학생이 자신의 규칙이나 다른 학생의 규칙에 대해 의사소통하는 과정을 평가한다."},"2015|수학|1~2학년|자료와 가능성|1":{"m":"분류하기에서는 학생들이 실생활에서 친근하게 느낄 수 있는 소재를 활용한다.\n기준을 정하여 분류할 때 학생들이 정한 다양한 기준을 존중하되, 분명하지 않은 기준일 경우에는 분류하는 것이 어려움을 인식하게 한다.\n표를 만들 때 자료가 중복되거나 빠지지 않도록 세어보는 방법을 함께 지도한다.\n표와 그래프로 나타내기는 생활 주변에 있는 자료들을 활용하되, 그 기준이 분명하고 간단한 것을 다룬다.\n자료와 가능성 영역의 문제 상황에 적합한 문제 해결 전략을 지도하여 문제 해결 능력을 기르게 한다.","v":"분류하기를 평가할 때 학생들의 수준에 비해 어려운 분류 대상이나 분류 기준을 사용하지 않는다.","l":"표, 그래프"},"2015|수학|3~4학년|수와 연산|1":{"m":"실생활에서 10000 이상의 큰 수가 쓰이는 경우를 찾고 큰 수와 관련하여 이야기하는 활동을 통하여 큰 수에 대한 양감을 기르고 필요성을 인식하게 한다.\n10000 이상의 수를 비교하면서 수의 크기를 비교하는 방법을 찾아 설명하게 한다.\n덧셈은 세 자리 수의 범위에서 다루되, 합이 네 자리 수인 경우도 포함한다.\n곱셈은 '(두 자리 수)×(한 자리 수)', '(세 자리 수)×(한 자리 수)', '(두 자리 수)×(두 자리 수)', '(세 자리 수)×(두 자리 수)'를 포함한다.\n나눗셈에서 '(두 자리 수)÷(한 자리 수)'는 나누어떨어지는 경우와 나누어떨어지지 않는 경우를 포함하여 몫과 나머지를 이해하게 하고, 나누는 수가 두 자리 수인 나눗셈에서는 '(두 자리 수)÷(두 자리 수)', '(세 자리 수)÷(두 자리 수)'를 다룬다.\n한 가지 상황을 곱셈식과 나눗셈식으로 나타내는 활동을 통하여 곱셈과 나눗셈의 관계를 이해하게 한다.\n덧셈, 뺄셈, 곱셈, 나눗셈을 하기 전에 계산 결과를 어림해 보고, 어림한 값을 이용하여 계산 결과가 타당한지 확인해보게 한다.\n학생들에게 친근한 실생활 상황을 이용하여 덧셈, 뺄셈, 곱셈, 나눗셈에 관련된 문제를 만들고 해결하게 한다.\n자연수의 사칙계산에서 계산 원리를 이해하거나 계산 기능을 숙달하는 것이 목적이 아닌 경우에는 계산기를 사용하게 할 수 있다.\n1보다 작은 양을 나타내는 경우를 통하여 분수의 필요성을 인식하게 하고, 분수를 도입할 때 '분모', '분자'를 사용한다.\n소수의 덧셈과 뺄셈은 계산 원리를 이해할 수 있는 수준에서 간단히 다룬다.\n수와 연산 영역의 문제 상황에 적합한 문제 해결 전략을 지도하고, 문제 해결 과정을 설명하게 하여 문제 해결 능력을 기르게 한다.","v":"다섯 자리 이상의 수에 대해 평가를 할 때에는 수를 읽고 쓰는 것뿐만 아니라 수에 대한 양감과 필요성을 인식하게 할 수 있는 문제를 다룬다.\n나눗셈에 대한 검산에서는 나눗셈식을 보고 곱셈식으로 나타내는 것보다 검산의 목적과 필요성을 이해하는지에 초점을 두고 평가를 한다.","l":"나눗셈, 몫, 나머지, 나누어떨어진다, 분수, 분모, 분자, 단위분수, 진분수, 가분수, 대분수, 자연수, 소수, 소수점(.), ÷"},"2015|수학|3~4학년|도형|1":{"m":"구체적인 사례나 활동을 통하여 각을 도입하고, 각의 변이 반직선임을 알게 한다.\n실생활에서 평면도형의 이동을 활용한 사례를 찾아서 이동에 따른 변화를 추론하고 설명하게 한다.\n평면도형의 이동을 활용하여 자신만의 규칙적인 무늬를 만들고, 다른 사람이 만든 무늬에서 규칙을 찾아 설명하게 한다.\n여러 가지 삼각형과 사각형을 이름 짓는 활동을 통하여 각 도형의 정의에 대해서 학생들 스스로 사고하게 한다.\n여러 가지 사각형의 성질은 구체적인 조작 활동을 통하여 간단한 것만 다루고, 여러 가지 사각형 사이의 관계는 다루지 않는다.\n도형 영역의 문제 상황에 적합한 문제 해결 전략을 지도하고, 문제 해결 과정을 설명하게 하여 문제 해결 능력을 기르게 한다.","v":"직선, 선분, 반직선에 대한 평가에서는 정확한 정의나 표현보다 직선, 선분, 반직선을 서로 구별할 수 있는지에 중점을 둔다.\n평면도형의 이동을 활용하여 모양의 변화나 무늬를 설명하게 할 때 설명 방법이 다양할 수 있음에 유의하여 평가한다.","l":"직선, 선분, 반직선, 각, (각의) 꼭짓점, (각의) 변, 직각, 예각, 둔각, 수직, 수선, 평행, 평행선, 원의 중심, 반지름, 지름, 이등변삼각형, 정삼각형, 직각삼각형, 예각삼각형, 둔각삼각형, 직사각형, 정사각형, 사다리꼴, 평행사변형, 마름모, 다각형, 정다각형, 대각선"},"2015|수학|3~4학년|측정|1":{"m":"시각과 시간의 의미는 구체적인 상황 속에서 구별하여 사용할 수 있는 정도로 이해하게 한다.\n실제로 재거나 어림하는 측정 활동을 통하여 시간, 길이, 들이, 무게, 각도에 대한 양감을 기르게 한다.\n시간, 길이, 들이, 무게의 단위를 지도할 때 단위 사이의 관계를 이해하는 데 중점을 두고, 지나친 단위 환산은 다루지 않는다.\n길이, 들이, 무게, 각도를 측정할 때 측정도구의 눈금에 일치하지 않는 측정값을 '약'으로 표현하게 한다.\n측정 영역의 문제 상황에 적합한 문제 해결 전략을 지도하고, 문제 해결 과정을 설명하게 하여 문제 해결 능력을 기르게 한다.","v":"무게 단위 사이의 관계에 대해 평가할 때 1g과 1t 사이의 단위 환산은 다루지 않는다.","l":"초, 도(°), mm, km, L, mL, g, kg, t"},"2015|수학|3~4학년|규칙성|1":{"m":"규칙적인 계산식의 배열에서 계산 결과의 규칙을 찾는 활동을 할 때 계산기를 사용하게 할 수 있다.\n규칙성 영역에 적합한 문제 해결 전략을 지도하고, 문제 해결 과정을 설명하게 하여 문제 해결 능력을 기르게 한다.","v":"규칙을 식으로 나타낼 때 혼합 계산식, 일반항을 나타낸 식 등을 이용해야 하는 복잡한 문제는 다루지 않는다.\n규칙적인 계산식의 배열에 대한 평가에서는 계산 결과의 규칙을 추측하고 확인하는 데 중점을 둔다."},"2015|수학|3~4학년|자료와 가능성|1":{"m":"그래프로 나타내면 자료의 특성을 알아보는 데 편리함을 설명하게 한다.\n꺾은선그래프를 그릴 때 변화의 경향이 잘 드러날 수 있도록 눈금의 크기를 적절히 선택하게 한다.\n간단한 그림그래프, 막대그래프, 꺾은선그래프의 특성을 비교하여 자료의 특성에 맞는 그래프로 나타내게 한다.\n자료와 가능성 영역의 문제 상황에 적합한 문제 해결 전략을 지도하고, 문제 해결 과정을 설명하게 하여 문제 해결 능력을 기르게 한다.","v":"꺾은선그래프에서는 변화의 경향을 파악하는지에 중점을 두어 평가한다.","l":"그림그래프, 막대그래프, 꺾은선그래프"},"2015|수학|5~6학년|수와 연산|1":{"m":"자연수의 혼합 계산은 계산 순서에 중점을 두고, 지나치게 복잡한 혼합 계산은 다루지 않는다.\n약수와 배수는 실생활에서 활용되는 경우를 찾아 자연수 범위에서 다룬다.\n최대공약수와 최소공배수는 두 수에 대해서 구하게 한다.\n분모가 다른 분수의 크기 비교에서 수 감각을 이용하여 추론하고 토론하는 활동을 하게 한다.\n분수의 나눗셈은 '(분수)÷(자연수)', '(분수)÷(분수)', '(자연수)÷(분수)'를 다룬다.\n소수의 곱셈과 나눗셈은 계산 원리를 이해하는 수준에서 간단히 다루고, 복잡한 계산은 계산기를 사용하게 할 수 있다.\n수와 연산 영역의 문제 상황에서 문제 해결 전략 비교하기, 주어진 문제에서 필요 없는 정보나 부족한 정보 찾기, 조건을 바꾸어 새로운 문제 만들기, 문제 해결 과정의 타당성 검토하기 등을 통하여 문제 해결 능력을 기르게 한다.","v":"최대공약수와 최소공배수에 대한 평가에서 소인수의 곱으로 나타내어 구하는 방법은 다루지 않는다.\n분수의 사칙계산에서 기약분수로 나타낼 것을 요구하지 않을 경우, 계산 결과를 기약분수가 아닌 분수로 나타내는 것도 허용한다.\n분수의 통분을 이용한 문제에서 공통분모로 최소공배수뿐만 아니라 분모의 곱과 같은 공배수도 이용할 수 있게 한다.","l":"약수, 공약수, 최대공약수, 배수, 공배수, 최소공배수, 약분, 통분, 기약분수"},"2015|수학|5~6학년|도형|1":{"m":"실생활에서 같은 무늬 찾기, 종이 겹쳐 오리기, 도장 찍기, 데칼코마니 등 구체적인 조작 활동을 통하여 도형의 합동의 의미를 알게 한다.\n실생활에서 선대칭도형과 점대칭도형의 예를 찾아 설명하게 한다.\n선대칭도형과 점대칭도형의 성질을 이용하여 각 도형의 나머지 부분을 그리게 한다.\n직육면체의 전개도에서 수직인 면과 평행한 면을 찾게 하여 전개도로부터 입체도형을 추측할 수 있게 한다.\n각기둥의 전개도는 간단한 형태만 다루고, 각뿔과 원뿔의 전개도는 다루지 않는다.\n한 직선을 중심으로 직사각형, 직각삼각형, 반원을 돌리는 활동을 통하여 원기둥, 원뿔, 구를 만들어 보게 한다.\n모형을 이용하여 입체도형의 구성 요소와 성질을 확인하게 한다.\n도형 영역의 문제 상황에서 문제 해결 전략 비교하기, 주어진 문제에서 필요 없는 정보나 부족한 정보 찾기, 조건을 바꾸어 새로운 문제 만들기, 문제 해결 과정의 타당성 검토하기 등을 통하여 문제 해결 능력을 기르게 한다.","v":"선대칭도형과 점대칭도형 그리기를 평가할 때 점판이나 격자를 이용하여 쉽게 그릴 수 있게 한다.\n입체도형의 전개도에 대한 평가는 전개도가 될 수 있는 것과 될 수 없는 것을 구별하는 데 중점을 둔다.\n쌓기나무로 만든 입체도형의 위, 앞, 옆에서 본 모양에 대한 평가를 할 때에는 간단한 모양을 이용한다.","l":"합동, 대칭, 대응점, 대응변, 대응각, 선대칭도형, 점대칭도형, 대칭축, 대칭의 중심, 직육면체, 정육면체, 면, 모서리, 밑면, 옆면, 겨냥도, 전개도, 각기둥, 각뿔, 원기둥, 원뿔, 구, 모선"},"2015|수학|5~6학년|측정|1":{"m":"삼각형의 넓이는 높이가 삼각형의 외부에 있는 것도 다룬다.\n원주율을 나타내는 3, 3. 1, 3. 14 등은 정확한 값이 아님을 알고 상황에 따라 적절하게 선택하여 사용할 수 있게 한다.\n원주율, 원주, 원의 넓이, 입체도형의 겉넓이와 부피 등을 구할 때 복잡한 계산은 계산기를 사용하게 할 수 있다.\n겉넓이와 부피를 구하는 방법에 대하여 다양한 추론을 하고, 자신의 추론 과정을 다른 사람에게 설명하게 한다.\n측정 영역의 문제 상황에서 문제 해결 전략 비교하기, 주어진 문제에서 필요 없는 정보나 부족한 정보 찾기, 조건을 바꾸어 새로운 문제 만들기, 문제 해결 과정의 타당성 검토하기 등을 통하여 문제 해결 능력을 기르게 한다.","v":"원주율과 관련하여 계산이 지나치게 복잡한 문제는 다루지 않는다.\n넓이 단위 사이의 관계에 대해 평가할 때 1cm²와 1km²사이의 단위 환산은 다루지 않는다.","l":"이상, 이하, 초과, 미만, 올림, 버림, 반올림, 가로, 세로, 밑변, 높이, 원주, 원주율, cm², m², km², cm³, m³"},"2015|수학|5~6학년|규칙성|1":{"m":"두 양의 대응 관계는 덧셈식, 뺄셈식, 곱셈식, 나눗셈식 중 하나로 표현되는 간단한 경우만 다룬다.\n두 양을 비교할 때 한 양을 기준으로 다른 양이 몇 배가 되는지를 나타낼 필요성을 인식하게 하면서 비의 개념을 도입한다.\n비율의 의미를 다룰 때 타 교과 및 실생활에서 비율이 적용되는 간단한 사례를 사용할 수 있다.\n규칙성 영역의 문제 상황에서 문제 해결 전략 비교하기, 주어진 문제에서 필요 없는 정보나 부족한 정보 찾기, 조건을 바꾸어 새로운 문제 만들기, 문제 해결 과정의 타당성 검토하기 등을 통하여 문제 해결 능력을 기르게 한다.","v":"비율을 평가할 때 속력, 인구밀도, 축척, 농도 등을 구하는 문제는 다루지 않는다.","l":"비, 기준량, 비교하는 양, 비율, 백분율, 비례식, 비례배분,:,%"},"2015|수학|5~6학년|자료와 가능성|1":{"m":"평균을 구하는 방법뿐만 아니라 그 의미를 직관적으로 파악하게 한다.\n띠그래프와 원그래프를 지도할 때 신문, 인터넷 등에 있는 표나 그래프를 소재로 활용할 수 있게 한다.\n원그래프를 그릴 때에는 눈금이 표시된 원을 사용하게 한다.\n복잡한 자료의 평균이나 백분율을 구할 때 계산기를 사용하게 할 수 있다.\n막대그래프, 꺾은선그래프, 그림그래프, 띠그래프, 원그래프의 특성을 비교하여 목적에 맞는 그래프로 나타내게 한다.\n가능성을 수로 표현할 때 0, 1/2, 1 등 직관적으로 파악되는 경우를 다룬다.\n자료와 가능성 영역의 문제 상황에서 문제 해결 전략 비교하기, 주어진 문제에서 필요 없는 정보나 부족한 정보 찾기, 조건을 바꾸어 새로운 문제 만들기, 문제 해결 과정의 타당성 검토하기 등을 통하여 문제 해결 능력을 기르게 한다.","v":"평균을 구하는 것뿐만 아니라 평균이 사용된 상황에서 그 의미를 파악하는지 평가한다.","l":"평균, 띠그래프, 원그래프, 가능성"},"2015|슬기로운 생활|1~2학년|가족|1":{"m":"① 가훈, 가족 구성원 등과 같은 가족의 특징을 조사하여 학생이 발표하고 싶은 점을 중심으로 소개하도록 하며, 이를 통해 가족의 특징이 다양함을 이해하도록 지도한다.\n② 소개할 내용, 조사하는 방법, 소개하는 방식 등을 자세하게 안내해 주고 다양한 형태의 가족이 등장하는 동화책 또는 TV 프로그램 등을 조사하여 소개하게 한다.\n③ 자신과 가족, 친척에 대해 조사하여 관계도를 그릴 때, 자신을 중심으로 한 친척의 관계 및 호칭을 사촌 이내로 한정하며, 학생 경험을 통해 친척과 함께하는 행사나 활동을 조사·발표해 보게 한다.\n④ 친구와 함께 다양한 형태의 가족에 대한 특징을 조사하면서 가족 문화의 다양성을 알도록 지도한다.\n⑤ 가족 구성원의 역할을 이해하고 가족을 위해 내가 할 수 있는 일을 찾아보게 한다.\n⑥ 전형적인 가족의 형태를 규준화하여 제시하는 것을 지양하고, 다양한 가족의 형태를 자연스럽게 예화나, 그림, 설명 등을 통해 제시한다.","v":"① 가족과 친척에 대해 조사하여 발표하기, 관계망 그리기 등의 과정을 통해 나와 친척의 관계에 대해 폭넓게 이해하는지 평가한다.\n② 주변에서 볼 수 있는 다양한 형태의 가족과 그들의 생활 모습을 살펴보는 과정을 통해 다양한 가족의 문화에 대해 이해하는지 평가한다.","l":"가족의 특징, 나와 가족 및 친척의 관계, 다양한 형태의 가족, 가족 구성원의 역할"},"2015|슬기로운 생활|1~2학년|여름|1":{"m":"① 학생의 생활 경험으로부터 여름 날씨의 특징과 주변의 생활 모습을 관련지어 생각해 보게 하고, 여름철 주변 생활 모습의 변화를 조사·발표하게 한다.\n② 여름에 사용하는 생활 도구를 여름 날씨와 관련지어 조사하고, 친구와 함께 다양한 기준에 따라 무리 짓기 활동을 해 보도록 지도한다.\n③ 여름철에 볼 수 있는 곤충, 과일과 채소를 중심으로 동식물의 특징을 관찰하고 정리하도록 지도한다.\n④ 여름방학에 하고 싶은 일과 해야 할 일을 계획하여 발표하게 한다.","v":"① 살펴보기, 조사·발표하기 등의 과정을 통해 여름 날씨와 사람들의 생활 모습을 관련지어 이해하는지 평가한다.\n② 여름에 사용하는 생활 도구를 종류와 쓰임에 따라 무리 짓는 과정을 평가한다.\n③ 여름에 볼 수 있는 동식물을 대상으로 살펴보기, 관찰하기, 모형 만들기, 무리 짓기 등이 적절하게 이루어졌는지 평가한다.\n④ 여름방학 동안 자신이 하고 싶은 일과 해야 할 일에 대해 발표하는 과정을 평가한다.","l":"여름 날씨와 생활, 생활 도구의 종류와 쓰임, 동식물 탐구, 여름방학 계획"},"2015|슬기로운 생활|1~2학년|마을|1":{"m":"① 학생들의 일상생활 경험을 통해 더불어 생활하는 이웃의 모습을 알아보도록 지도한다.\n② 자신이 살고 있는 공간에서 이웃과 함께 쓰는 공공시설에 대하여 살펴보고, 종류와 쓰임새에 따라 무리 짓기 활동을 하며, 각각의 사용 방법을 조사하여 발표한다.\n③ 자신의 집 또는 학교를 중심으로 동네의 모습을 살펴보고, 친구들과 함께 협력학습으로 건물의 위치 등을 그림으로 그려서 마을 모습을 설명하는 활동을 한다. 동네를 그림으로 그려보는 이유는 동네 모습을 전체적으로 파악하는 데 있으므로 동네 그림 그리기 그 자체를 목적으로 하여 지나치게 강조하지 않도록 유의한다.\n④ 동네 사람들이 하는 일을 조사해 보고, 그 결과를 다양한 기준으로 무리 짓기를 해 보도록 지도한다.","v":"① 이웃과 더불어 생활하는 모습을 조사하여 발표할 수 있는지 평가한다.\n② 이웃과 함께 사용하는 시설물의 종류와 쓰임에 대해 이해하는지 평가한다.\n③ 관찰하기, 조사·발표하기 등의 과정을 통해 동네의 모습을 관찰하여 그림으로 그려 설명할 수 있는지 평가한다.\n④ 다양한 기준에 따라 분류하기, 조사·발표하기, 무리 짓기 과정을 통해 동네 사람들이 하는 일과 직업을 관련지어 이해하는지 평가한다.","l":"이웃의 생활 모습, 공공장소와 시설물의 종류와 쓰임, 동네의 모습 관찰, 동네 사람들이 하는 일"},"2015|슬기로운 생활|1~2학년|가을|1":{"m":"① 학생의 생활 경험으로부터 가을 날씨의 특징에 따른 주변의 생활 모습을 관련지어 예상해 보고, 살펴보기, 조사·발표하기 등의 활동을 통해 가을철 주변 생활 모습의 변화를 탐색해 보게 한다.\n② 다양한 매체를 활용하여 가을에 대한 정보나 자료를 수집하는 활동을 한다.\n③ 추석에 먹는 음식과 하는 일 등을 조사하고, 다른 세시 풍속과 비교하여 무리 짓기 활동을 해 보고 발표하도록 지도한다.\n④ 가을에 볼 수 있는 단풍, 낙엽, 열매 등의 모양과 특징을 관찰하여 다양한 기준에 따라 무리 짓기 활동을 한다.","v":"① 살펴보기, 조사·발표하기 등의 활동을 통해 가을 날씨와 사람들의 생활 모습을 관련지어 이해하는지 평가한다.\n② 다양한 매체를 활용하여 탐구 활동을 수행하는 과정에서 살펴보기, 조사·발표하기 활동 등이 적절하였는지 평가한다.\n③ 단풍, 낙엽, 열매의 모양과 특징을 관찰하여 무리 짓기를 할 수 있는지 평가한다.\n④ 추석에 먹는 음식의 종류와 하는 일 등을 기준에 따라 무리 지을 수 있는지, 그리고 다른 세시 풍속과 비교하여 발표할 수 있는지 평가한다.\n⑤ 가을철에 나타나는 주변의 모습과 생활에 대한 학생의 관심과 이해에 초점을 맞춰 평가하고, 매체를 효과적으로 활용하였는지를 고려하여 평가한다.","l":"가을 날씨와 생활, 가을의 특징, 추석, 가을에 볼 수 있는 것"},"2015|슬기로운 생활|1~2학년|나라|1":{"m":"① 우리나라의 상징과 문화를 조사하여 소개하는 자료를 만들면서 전통 문화에 대해 관심을 가질 수 있도록 지도한다.\n② 남한과 북한의 공통점과 차이점을 조사하고 민족의 동질성 회복에 대해 관심을 갖도록 지도한다.\n③ 다양한 자료를 활용하여 알고 싶은 나라에 대하여 궁금한 점을 조사하고 발표한다.\n④ 이 영역(대주제)에서 다루는 다른 나라는 학생들의 관심사를 반영하여 선정하도록 한다.","v":"① 우리나라를 알릴 수 있는 것, 나타내는 것, 자랑할 수 있는 것들을 알아보고 소개하기 위하여 조사·발표하기, 살펴보기와 같은 탐구 활동에 참여하는 태도를 평가한다.\n② 남북한의 공통점과 차이점을 알고 있는지를 포트폴리오, 조사·발표하기 등의 다양한 방법으로 평가한다.\n③ 내가 알고 싶은 다른 나라를 조사하여 발표할 때 역할 놀이, 모둠 신문 만들기, 만화 그리기 등 다양한 방법으로 소개할 수 있는지 평가한다.","l":"우리나라의 상징과 문화, 남북한의 생활 모습, 다른 나라의 문화"},"2015|슬기로운 생활|1~2학년|겨울|1":{"m":"① 겨울 날씨의 특징에 따른 주변의 생활 모습을 관련지어 생각해 보고, 겨울철 생활 모습의 변화를 살펴보기, 조사·발표하기 등의 활동을 통해 탐색해 보게 한다.\n② 겨울에 자기가 하고 싶은 일, 해야 할 일 등을 조사·발표하기를 통해 탐색해 보게 한다.\n③ 여러 동식물들의 겨울나기 모습을 살펴보기, 무리 짓기, 조사·발표하기와 같은 활동을 통해 탐색해 보고, 자신이 좋아하는 동물의 특성을 다양한 방법으로 조사하고 발표하며, 친구들과 기준을 정하여 무리 짓기 활동을 해 보도록 지도한다.\n④ 겨울철에 쓰이는 생활 도구의 종류와 쓰임을 조사·발표하고, 무리 짓기 활동을 하게 한다.","v":"① 살펴보기, 조사·발표하기 등의 과정을 통해 겨울철 날씨의 특징에 따른 주변의 생활 모습의 변화를 관련지어 이해하는지 평가한다.\n② 겨울에 사용하는 생활 도구를 종류와 쓰임에 따라 분류 기준을 정하고, 무리 짓는 활동을 평가한다.\n③ 동식물의 겨울나는 방법과 자신이 좋아하는 동물의 특성에 대해 살펴보기, 무리 짓기, 조사·발표하기 등의 과정을 평가한다.\n④ 겨울방학 동안 하고 싶은 일과 해야 할 일에 대해 발표하는 과정을 평가한다.","l":"겨울 날씨와 생활, 동식물 탐구, 생활 도구"},"2015|실과|5~6학년|인간|1":{"m":"아동의 발달에는 신체적 측면 외에도 인지적, 정서적, 사회적 측면이 있음을 알게 하고 다른 친구들의 발달을 존중하도록 지도한다.\n성적 발달과 관련하여 생활 속에서 실천할 수 있는 자기 관리 방법에 대해 스스로 탐색하고, 실천 목록을 세워보도록 한다. 또한 건강한 발달을 위해 필요한 조건을 탐색하여 실생활에 적용하도록 한다.\n역할 놀이, 광고, 뉴스, 노래, UCC, 프리젠테이션 등을 제작, 발표해 보도록 하여 자신의 발달 특징을 긍정적으로 이해하고 건강한 가정생활의 중요성을 알게 한다.","v":"‘인간 발달과 가족’ 영역에서는 실제적인 사례와 경험을 중심으로 보고서를 작성한 후 평가할 수 있다.\n‘성적 발달과 관련된 자기 관리’에서는 실천 점검표, 자기 평가지 등과 같은 체크리스트를 활용한 평가를 실시할 수 있다.","l":"아동의 발달 특징, 발달의 개인차, 성적 발달(초경, 몽정 등)과 관련된 자기 관리 방법, 건강한 발달을 위해 필요한 조건, 나와 가족의 관계 및 역할, 다양한 가족의 가정생활 공통점, 가정생활의 중요성, 배려와 돌봄의 필요성"},"2015|실과|5~6학년|가정생활과 안전|1":{"m":"간식을 만드는 모둠 활동을 통해 협력과 각자의 역할에 대한 책임감을 키울 수 있도록 하고 조리 시 안전하게 실습하도록 지도한다. 음식을 완성한 후에는 식사 예절을 지키면서 함께 음식을 나누어 먹고 모둠 활동에 대해 서로 평가한다.\n식재료나 음식의 맛을 경험하는 과정에서 모양과 색깔, 냄새, 촉감 등을 살펴보고 맛을 비교·분석할 수 있도록 하며, 마인드맵, 브레인스토밍 등 다양한 창의성 기법을 적용하여 정리하고 오감을 통한 감성 역량을 신장시킬 수 있도록 지도한다.\n생활 안전과 관련된 수업에서는 실제적인 사례와 경험을 중심으로 안전생활에 대한 실천 동기를 형성하도록 지도한다.\n여러 가지 생활용품과 도구 등을 안전하게 사용하는 방법에 대한 사례를 조사하여 이를 실제 상황에 적용할 수 있도록 지도한다.\n한 그릇 음식을 만들어 보는 수업에서는 균형 잡힌 식사의 조건을 고려하여 조리 계획, 준비, 조리, 상차림, 식사, 뒷정리의 전 과정이 위생적이고 안전하게 이루어질 수 있도록 지도한다. 특히 조리 실습 시 화상 예방, 조리 도구 및 소화기 사용법 등의 안전 수칙에 대해 지도한다.","v":"균형 잡힌 식사에 대한 평가에서는 올바른 식습관을 실천하고 있는지, 편식을 교정하려고 노력하는지 등과 같은 과정 중심의 평가가 이루어질 수 있도록 한다.\n간단한 생활 소품 만들기에서는 소품 만들기 계획, 준비, 제작, 뒷정리의 전 과정을 평가한다. 특히, 최종 결과물만 평가하기 보다는 처음, 중간 및 최종 결과물을 비교하여 학생의 성장 정도를 평가하도록 한다.\n한 그릇 음식을 만드는 모둠 활동에서는 협력과 맡은 역할을 책임감 있게 수행하였는지를 평가에 반영하도록 한다.","l":"균형 잡힌 식사, 간식의 중요성, 간식의 선택과 조리, 식생활 예절\n때·장소·상황에 맞는 옷차림, 신체 발달을 고려한 의생활, 다양한 식재료의 맛, 올바른 식습관\n바느질의 기초, 간단한 수선, 생활 소품의 제작, 건강하고 안전한 옷차림 방법\n생활 안전사고의 종류와 예방, 안전과 위생을 고려한 식사 선택, 밥을 이용한 한 그릇 음식, 위생적이고 안전한 조리"},"2015|실과|5~6학년|자원|1":{"m":"학생들이 경험할 수 있는 다양한 옷 관리의 문제를 제시하고 그 원인과 해결책을 토의·토론하여 옷의 종류와 용도에 맞게 스스로 정리, 보관할 수 있도록 지도한다.\n정리정돈, 청소, 쓰레기 분리수거, 재활용 등을 하지 않았을 때의 문제점을 조사하고 이를 해결할 수 있는 실천 가능한 방안을 탐색하여 자신의 생활에 적용하도록 지도한다.\n모둠별로 다양한 가정일의 종류와 특징, 역할 분담에 대해 조사하고 발표해 보도록 하고, 이때 고정된 성 역할에 따른 역할 분담과 각 가정의 상황과 조건을 고려한 유연한 역할 분담을 비교하여 가정일이 가정생활에 미치는 영향을 살펴보도록 지도한다.\n어떠한 가정일을 할 것인지 선정하고 실행 계획을 세워 실천할 수 있도록 지도한다. 또한, 가정일을 수행하는 과정에서 어떠한 일에 관심, 소질, 흥미 등이 있는지 탐색하여 진로교육에 활용할 수 있도록 한다.","v":"모둠 활동을 평가할 때에는 과제 결과물뿐만 아니라 수행과정에서의 상호작용, 의사소통, 역할 충실도 등을 평가에 반영하도록 한다.\n시간 및 용돈 관리는 학생들의 실제 생활을 중심으로 합리적으로 소비하고 있는지를 지속적으로 점검하고 수시로 피드백 하여 자기 평가, 동료 평가 등을 실시할 수 있다.","l":"옷의 종류와 용도에 맞는 정리·보관, 옷 관리의 중요성, 시간 자원의 특성, 시간 관리 방법, 용돈 관리, 합리적 소비생활, 생활공간 관리의 필요성과 관리 방법(정리정돈, 청소, 쓰레기 분리수거, 재활용 등)\n가정일, 가족원의 역할, 가정생활에 미치는 영향, 가정일 수행의 계획과 평가"},"2015|실과|5~6학년|기술|1":{"m":"생명 기술 시스템으로서 가꾸기와 기르기에 대한 학습은 프로젝트를 중심으로 이루어질 수 있도록 하며, 획득한 지식을 직접 활용하고 적용해 볼 수 있는 기회를 제공하도록 한다.\n자전거의 프레임, 구동 장치, 조향 장치, 제동 장치, 바퀴를 통해 수송 수단이 갖추어야할 기본 요소를 이해하도록 한다.\n응용 소프트웨어의 사용법이나 프로그래밍 언어의 문법 학습을 최소화하고, 문제 해결에 필요한 프로그래밍을 통한 컴퓨팅 사고력 신장에 초점을 맞춘다.\n절차적 사고를 적용할 수 있는 일상생활 속의 사례들을 찾아보고, 놀이 중심의 신체 활동, 퍼즐 등의 다양한 활동을 통해 절차적인 문제해결과정을 이해하도록 한다.\n실생활 속에서 일어나는 문제 상황을 중심으로 학생들이 컴퓨팅 사고를 활용할 수 있도록 지도한다.\n컴퓨터를 활용한 활동 이외에도 컴퓨터 없이 문제를 해결할 수 있는 방법과 절차를 이해할 수 있도록 지도한다.\n언플러그드 활동 시 놀이와 학습이 동시에 이루어질 수 있도록 시간과 내용을 적절히 구성하여 지도한다.\n컴퓨팅적인 사고는 소프트웨어 교육에 국한되는 것이 아니므로 국어, 사회, 수학, 과학 등 다양한 교과에서도 반영하여 지도한다.","v":"재배 일지나 사육 일지를 활용하는 평가를 통해 식물이나 동물을 가꾸고 기르면서 경험한 일의 소중함, 책임감, 생명존중, 배려 등의 인성 및 정의적 측면을 평가할 수 있다.\n수송 수단 만들기에서는 수송 수단의 기본 요소 충족, 다양한 재료 활용, 창의적 아이디어 적용 여부 등의 평가 요소를 중심으로 서술형 채점 기준표를 사전에 제시하여 학생들이 활동 수행 시 참고할 수 있도록 하며, 시연 과정에서 동료 평가나 자기 평가를 실시하도록 한다.\n수송 수단의 안전 관리 평가에서는 안전과 관련된 자전거의 기본 요소를 파악하고 있는지에 대해 구술로 평가하고, 체크리스트 형식의 안전 점검표를 만들어 자전거 안전 관리에 대한 자기 평가를 실시하도록 한다.\n다양한 평가 도구를 활용하여 소프트웨어 교육을 통한 컴퓨팅 사고력의 향상 정도를 측정할 수 있도록 한다.","l":"식물 가꾸기, 동물 기르기, 친환경 에너지, 수송 수단의 기본 요소, 자전거의 구성요소와 안전 관리, 소프트웨어가 생활에 미치는 영향, 기초 프로그래밍, 절차적 사고, 사칙 연산·순차·선택·반복 명령, 프로그램 설계와 제작"},"2015|영어|3~4학년|듣기|1":{"m":"알파벳 소리를 지도할 때에는 친숙한 낱말 및 다양한 듣기 자료를 통해 알파벳의 소리를 자연스럽게 식별할 수 있도록 지도한다.\n노래, 찬트, 대화 등의 듣기 자료를 통해 영어의 다양한 강세, 리듬, 억양을 자연스럽게 익힐 수 있도록 지도한다.\n실물, 그림, 동작 등을 활용하여 낱말, 어구, 문장의 의미를 추측하거나 파악하게 한다. 특히 학습 초기에는 교실 및 주변에서 쉽게 접하는 사물의 이름, 가족 호칭, 인사말 등의 낱말, 어구, 문장을 이해할 수 있도록 지도한다.\n쉽고 친숙한 표현을 상황과 함께 제시하여 이해를 돕고, 필요한 경우 다양한 멀티미디어 자료를 활용하여 자연스럽고 흥미로운 학습이 이루어지게 한다.\n교실 내의 여러 가지 실물을 이용하여 다양한 지시나 설명을 하고, 학습자가 듣고 이해한 것을 얼굴 표정, 자세, 동작 등을 이용하여 표현할 수 있도록 지도한다.\n영어 학습에 대한 흥미와 자신감을 부여할 수 있도록 듣고 행동으로 반응하기, 듣고 지시대로 행동하기 등 듣고 이해한 정도를 여러 가지 과업 수행으로 나타낼 수 있도록 지도한다.","v":"3~4학년군 듣기 평가의 내용과 수준은 3~4학년군의 듣기 성취기준을 근거로 선정한다.\n낱말, 어구, 문장의 이해 여부는 질문에 대한 대답 및 그림, 동작 등 언어 이외의 방법으로도 표현하게 하여 확인한다.\n지시, 설명에 대한 이해는 행동이나 동작을 통해 파악하고, 상황에 따라 알맞게 낱말을 바꾸어 제시하고 집중하여 듣는 능력을 평가한다.\n시각적 자료나 일상생활의 맥락, 배경이 포함되어 있는 듣기 자료를 활용하여 평가한다.\n평가 목적, 대상 및 방법에 따라 낱말, 어구, 문장 등 적절한 수준의 문자 언어 재료를 활용하여 평가한다.","l":"알파벳, 낱말의 소리, 강세, 리듬, 억양\n낱말, 어구, 문장\n주변의 사람, 사물"},"2015|영어|3~4학년|말하기|1":{"m":"친숙한 낱말을 통해 영어의 음소를 바르게 소리 낼 수 있도록 하고 노래와 찬트 등을 통해 영어의 강세, 리듬, 억양을 자연스럽게 익힐 수 있도록 지도하도록 한다. 노래와 찬트는 영어의 강세, 리듬, 억양을 익히기에 좋은 언어 자료로서, 학습자들이 노래와 찬트를 듣고 내용을 이해하고 반복적으로 들으면서 자연스럽게 따라 부르도록 한다. 낱말 수준에서부터 문장, 간단한 대화 등의 순으로 들려주면서 자연스럽게 영어의 강세, 리듬, 억양에 익숙해지도록 한다.\n주변의 친숙한 물건이나 사물의 그림을 보고 이름을 말하거나 문장으로 말하는 활동, 해당 단어를 동작으로 표현해 보고 다른 학습자가 맞히게 하거나 소집단으로 나누어 추측하기 등의 게임을 통해서 쉽고 간단한 낱말이나 어구, 문장의 말하기에 흥미를 가지도록 한다.\n작은 종이 인형을 만들어 사용하게 하거나 동물 그림 등에 이름표를 달아주고 소집단 활동으로 발표하는 등의 협동학습을 통해 학습자들이 소개하기 활동에 흥미롭게 참여하도록 한다. 또한 자신의 이름이나 좋아하는 물건, 색깔이나 음식, 운동이나 가족 등도 소개해 보도록 한다.\n교사가 교실 영어로 지시하거나 요청하는 말을 자주 들려주는 것이 필요하며 이러한 표현에 자주 노출된 학습자들이 교실에서 일어나는 활동이나 필요한 행동에 관하여 자연스럽게 말할 수 있도록 한다.\n인사말을 주고받을 수 있는 유의미한 상황을 조성하고 인사하기 표현들을 사용함으로써 학습자들이 내재화할 수 있도록 한다.\n학습자 상호 간의 협력을 요하는 다양한 과업 제시를 통해 학습자와 학습자 간의 영어 말하기를 통한 상호작용이 활발하게 이루어지도록 하고, 대인 관계 능력 및 타인에 대한 배려와 관용을 함께 신장시킬 수 있도록 지도한다.\n의사소통에 지장을 주지 않는 한 교사의 즉각적인 오류 수정을 피하고, 학습자 스스로 오류를 발견하고 수정할 수 있도록 다양한 교정적 피드백을 제공한다.","v":"3~4학년군 말하기 평가의 내용과 수준은 3~4학년군 말하기 영역 성취기준을 근거로 선정한다.\n말하기 능력을 평가하고자 할 때는 가급적 수행평가를 실시한다. 수행평가는 학습자가 학습한 지식이나 기능을 실제적으로 사용하는 것을 평가한다.\n수행평가는 평가의 목표, 평가 유형, 채점 기준을 명확하게 한 후 실시한다. 말하기 성취기준에 근거하여 평가하고자 하는 목표를 설정한 후, 어떤 유형의 평가를 어느 정도의 내용과 수준으로, 어떤 채점 기준을 가지고 할 것인지를 정한 후에 수행평가를 실시한다.\n3~4학년군은 초보적인 영어학습의 단계이고 처음 경험하는 영어 말하기가 부담스러울 수 있는 시기이므로 평가에 심리적인 부담을 가지지 않도록 유의한다. 또한 ‘평가를 위한 평가’아니라 ‘학습을 위한 평가’가 될 수 있도록 평가 결과보다는 학습의 연장선으로 활용될 수 있도록 한다.\n교수·학습 과정 중에 적절한 형성평가를 활용한다. 수업 시간 중에 학습자에게 교사가 하는 질문에 대한 학습자의 응답, 학습자의 소집단 활동과 짝 활동을 통한 과업 수행 여부에 대한 관찰 등의 형성평가를 통해서 교수·학습 방법이 적절한지 확인하고 교수·학습 방법 개선에 활용한다.\n자기 평가는 학습자 자신의 학습에 대해 주의를 기울이고 학습 결과에 대해 스스로 점검함으로써 학습 계획이나 의도에 긍정적인 영향을 주어 차츰 자기 주도적인 학습으로 나아갈 수 있도록 도움을 줄 수 있으므로 ‘따라 말하기’나 ‘자기소개하기’ 등의 평가에 활용한다.\n학생 상호 평가는 학습자 스스로와 교사가 관찰하지 못한 학습 활동상의 태도 등의 부분에 보완적인 평가의 기능을 충분히 할 수 있으므로 ‘인사말을 주고받기’나 ‘쉽고 간단한 표현으로 묻고 답하기’ 등의 평가에 활용한다.","l":"알파벳, 낱말, 강세, 리듬, 억양\n낱말, 어구, 문장\n자기소개, 지시, 설명,\n인사, 일상생활 관련 주제"},"2015|영어|3~4학년|읽기|1":{"m":"대소문자의 모양이 차이가 나는 알파벳은 특별히 유의하여 지도한다. 모양이 비슷한 알파벳은 서로 짝을 지어 제시하여 그 차이점을 분명하게 알도록 한다. 알파벳 대소문자 짝짓기, 해당하는 알파벳 찾기, 알파벳 모형을 활용한 활동, 알파벳 노래 부르기 등 다양한 활동을 활용하여 재미를 느끼면서 익힐 수 있도록 한다.\n소리와 철자의 관계를 지도할 때에는 여러 낱말을 예시로 제시하여 소리와 철자 관계의 규칙을 스스로 찾아보도록 하며 대응 관계가 규칙적인 낱말, 철자 패턴이 같은 낱말 등을 우선 적용하여 지도한다. 그러나 소리와 철자 관계의 규칙성을 지나치게 강조하면 오히려 역효과가 날 수도 있으므로 여러 가지 활동 속에서 자연스럽게 인식하도록 한다. 낱말을 듣고 첫소리나 끝소리가 같은 낱말 찾기, 소집단 활동으로 첫소리나 끝소리가 같은 낱말 사전 만들기, 첫소리가 같은 낱말 릴레이 등의 다양한 활동을 활용할 수 있다.\n소리 내어 읽기를 단순하게 반복하게 되면 지루할 수 있으므로 혼자 읽기, 짝과 교대로 읽기, 목소리 바꾸어서 읽기 등 다양한 방법을 활용하도록 한다. 찬트를 활용하여 소리 내어 읽기를 하는 것도 효과적이다. 다른 학습 활동 속에서 연계하여 기계적이고 반복적인 읽기에만 그치지 않도록 한다.\n어구를 읽을 때에는 개별 낱말보다 어구 전체의 의미를 이해하는데 중점을 둔다. 낱말이나 어구를 읽기로 제시할 때에는 개별로 제시하는 것 외에도 다양한 의사소통 상황 속에서 제시하는 것이 효과적이다. 읽기 활동을 말하기나 쓰기 등 다른 언어 기능과 연계하면 자연스럽게 다른 언어 기능과 통합이 될 수 있다. 낱말이나 어구 카드 놀이나 게임, 컴퓨터 자료 등을 활용하여 재미있으면서도 유의미한 읽기 학습이 되도록 한다.\n문장 읽기를 지도할 때 유의할 점은 문장 내에 있는 내용어 외에도 be 동사, 인칭대명사, 전치사, 의문사 등의 기능어가 포함되어 있다는 것을 고려하여 학습자들에게 부담이 되지 않도록 한다. 문장 수준의 읽기는 구체적인 상황과 연결 지어 학습자들의 흥미를 높이도록 한다. 문장과 알맞은 그림 찾기, 컴퓨터를 활용한 읽기 게임, 모둠 협력 활동 등을 활용할 수 있다.\n놀이나 게임은 학습 참여를 높이고 흥미를 지속시키는 긍정적인 효과가 있으므로 카드, 컴퓨터를 이용한 게임 등 다양한 활동을 활용하도록 한다. 다만, 지나치게 경쟁적인 게임은 오히려 역효과가 날 수 있으므로 유의하여야 하며 경쟁적인 게임이나 놀이보다는 협동할 수 있는 활동이 될 수 있도록 한다.","v":"3~4학년군 읽기 평가의 내용과 수준은 3~4학년군 읽기 영역 성취기준을 근거로 선정한다.\n교수·학습 활동과 평가가 연계되도록 하여 학습의 결과만을 평가하지 않도록 한다.\n알파벳을 식별하여 읽는 평가는 실제로 알파벳을 소리 내어 읽는 평가, 알파벳 대소문자를 연결하기, 흩어진 알파벳을 찾아 맞추기 등 실제 수행과 지필 평가를 병행하여 실시할 수 있다.\n소리와 철자와의 관계를 평가할 때에는 학년 수준을 고려하여 규칙적인 관계가 있는 낱말을 선정하도록 한다. 첫소리가 같은 낱말 찾기, 첫소리 알파벳 채우기, 같은 소리로 시작하는 낱말끼리 묶기, 그림과 알파벳 첫소리나 끝소리 연결하기 등 학습 활동의 결과를 평가할 수 있다.\n낱말이나 어구 읽기를 평가할 때에는 시각적인 보조 자료 없이 문자 언어를 제시할 수 있으나 구두로 익힌 쉽고 간단한 낱말이나 어구를 선정하도록 한다. 평가 방법으로는 낱말 또는 어구와 그림을 연결하기, 낱말 또는 어구를 읽고 분류하기, 상황에 어울리는 낱말 또는 어구 카드 찾기 등을 활용 할 수 있다.\n문장 읽기를 평가할 때에는 지필 평가와 병행하여 다양한 활동 과정을 수행평가로 할 수 있다. 문장을 읽고 행동하기, 문장을 읽고 일치하는 그림 찾기, 문장을 읽고 전달하기 등 단순히 읽고 의미를 해석하는 것을 넘어 과업 수행 과정을 평가 할 수 있다.\n평가의 방법을 지필평가, 교사평가, 상호평가, 자기평가, 포트폴리오 등 다양하게 적용하도록 한다.","l":"알파벳 대소문자, 낱말의 소리, 철자\n낱말, 어구, 문장"},"2015|영어|3~4학년|쓰기|1":{"m":"다양한 활동을 통해 알파벳 대소문자를 바르게 쓰도록 지도한다. 철자의 모양을 식별하고 그 특징을 인식할 수 있도록 철자의 크기, 획의 방향, 쓰는 순서, 4선 공책에서의 글자 위치 등 다양한 특징을 이해하도록 지도한다. 알파벳 모양 안에 색칠하기, 알파벳 베껴 쓰기, 몸으로 알파벳 쓰기, 짝을 이루는 대문자 또는 소문자 쓰기 등의 활동을 할 수 있다.\n구두로 익힌 낱말이나 어구를 쓰는 활동을 할 때는 학습자들의 음성 언어와 문자 언어가 연계될 수 있도록 도와주도록 한다. 이때 주의할 사항은 학습자들에게 낱말을 쓰도록 시킨 후 그대로 내버려 두지 말고 교사가 학습자들과 함께 단어를 읽고 칠판에 쓰는 활동을 통해 그 과정에서 학습자들이 소리와 철자의 관계를 내면화하는 데 도움을 받도록 한다. 학습 활동으로는 단어 읽는 소리를 들으면서 베껴 쓰기, 점선 연결하여 낱말 만들기, 일부만 제시된 단어의 나머지 철자 채우기, 여러 사람이 돌려가면서 낱말 따라 쓰기 등의 활동이 가능하다.\n쓰기는 듣기, 말하기, 읽기와 연계하여 지도하되, 쓰기 활동의 수준은 음성 언어 및 읽기 활동 수준보다 약간 낮추어 지도할 수 있다.\n듣고 쓰기 활동을 할 경우에는 소리와 철자 관계를 생각하며 써 보도록 유도한다.\n초기에는 반복적인 따라 쓰기 등의 통제 쓰기를 통해 쓰기에 대한 자신감을 증진하도록 하며, 점진적으로 통제를 줄여가면서 쓸 수 있도록 지도한다.\n쓰기에 대한 흥미와 관심을 잃지 않도록 알파벳과 일상생활에서 자주 접할 수 있는 쉬운 낱말 위주로 쓰게 하며, 쓰기 결과물은 가능한 한 학습자 수준에 맞추어 개별적으로 교정해 주도록 한다.\n3~4학년은 우리말을 쓸 때에도 시간이 많이 필요한 시기임을 감안하여, 쓰기 활동을 할 때는 시간을 넉넉히 주도록 한다.","v":"3~4학년군 쓰기 평가의 내용과 수준은 3~4학년군 쓰기 영역 성취기준을 근거로 선정한다.\n교수·학습 활동과 평가가 연계 되도록 하여 학습의 결과뿐만 아니라 과정도 평가되도록 한다.\n쓰기 능력을 발현시키고 측정할 수 있는 다양한 쓰기 기법을 사용한다.\n평가 과제의 수준, 난이도 및 내용을 학습자 수준에 맞게 재구성하여 활용하도록 한다.\n쓰기 평가를 위한 채점 척도는 일반 쓰기 평가 원리에 의한 척도를 응용하거나, 해당 평가과제에 최적화된 척도를 별도로 만들어 사용할 수 있다.\n3~4학년군에서는 쓰기 평가와 관련하여 학습 부담이 되지 않도록 특히 유의하며, 쓰기 평가를 위해 준비할 시간을 충분히 갖도록 한다.","l":"알파벳 대소문자\n구두로 익힌 낱말, 어구, 실물, 그림"},"2015|영어|5~6학년|듣기|1":{"m":"대화가 일어나는 상황, 전후 관계, 배경 지식 등을 활용하여 의미를 파악하도록 지도하고 듣기 전 활동, 듣기 중 활동, 듣기 후 활동으로 나누어 단계별로 지도한다.\n연속된 두세 개의 지시나 설명을 들은 뒤 순서에 맞게 동작으로 나타내고 실물, 그림, 인형 등을 이용하여 이해한 것을 표현하게 지도한다.\n영어 학습에 대한 흥미와 자신감을 가질 수 있도록 듣고 행동으로 반응하기, 듣고 지시대로 행동하기 등 듣고 이해한 정도를 다양한 과업 수행하기로 나타내도록 지도한다.\n간단한 말이나 대화를 듣고 내용을 이해하는 데 도움이 되는 인물, 행동, 장소, 시간, 감정 등 세부 정보를 파악하도록 지도한다.\n비교 표현이 사용된 말이나 대화를 듣고 알맞은 그림에 표시하기, 그림 그리기, 번호쓰기, 순서 정하기 등의 다양한 활동을 통해 비교하는 표현을 익힐 수 있도록 지도한다.\n말이나 대화를 듣고 상황을 파악한 뒤, 주요 낱말 및 배경 지식 등을 활용하여 그림이나 도표에 담긴 세부 정보를 파악하도록 지도한다.\n대상을 비교하는 표현이 담긴 말이나 대화를 듣고 알맞은 그림 찾기, 틀린 부분 표시하기, 그림을 그리거나 번호 표시하기 등의 다양한 방법으로 지도한다.\n말이나 대화를 듣고 겉으로 드러나는 세부 정보, 줄거리, 목적, 일이 일어난 순서 파악하기 및 내용에는 나오지 않으나 장소나 인물을 추측하기 등으로 발전시킬 수 있도록 지도한다.","v":"5~6학년군 듣기 평가의 내용과 수준은 5~6학년군 듣기 성취기준을 근거로 선정한다.\n듣기 평가는 평가 목적과 대상, 방법에 따라 낱말, 어구, 문장, 문단 등 적절한 수준의 언어 재료를 활용한다.\n듣기 능력을 측정할 수 있는 다양한 과업 수행을 활용한다.\n사실적 이해 문항을 주로 평가하되 학습자의 수준에 따라 추론적 이해 문항도 포함시킬 수 있다. 예를 들어, 그림에 대한 묘사를 들으면서 묘사에는 나와 있지 않은 그림의 장소 등을 추측하게 하거나, 그림에 관한 간단한 설명을 듣고 불충분한 부분을 완성하게 하는 활동으로 발전시킬 수 있다.\n간단한 설명을 듣고 이해 여부를 그림으로 나타내기, 불충분한 그림 완성하기, 빠진 그림 그려 넣기, 목표 지점에 표시하기 등의 다양한 방법으로 평가한다.\n말이나 대화를 듣고 제시된 그림, 도표, 지도, 숫자 등을 해석하거나 세부 정보나 줄거리, 목적 및 순서 등을 파악하는 정도를 평가한다.","l":"알파벳, 낱말의 소리, 강세, 리듬, 억양\n낱말, 어구, 문장\n주변의 사람, 사물, 대상 비교, 일상생활 관련 주제, 그림, 도표\n줄거리, 목적\n일의 순서"},"2015|영어|5~6학년|말하기|1":{"m":"듣고 따라 말하기, 묻고 답하기 등의 활동을 통해 듣기와 말하기 활동이 자연스럽게 연계되도록 지도하고 게임, 역할놀이 등의 활동을 통해 유창성을 기르도록 지도한다.\n동작이나 그림을 보고 한 문장 이상으로 표현하는 활동을 하거나 문장 릴레이 등을 통해 학습자들이 말하기 활동에 대해 흥미를 가질 수 있도록 한다. 또한 학습자들이 자신이 좋아하는 물건을 보여주며 말하기 활동을 하게 할 수 있는데 이때 교사는 학습 동기를 자연스럽게 유발시켜 편안하게 말할 수 있는 분위기를 조성한다.\n자기 가족이나 친구의 생김새, 옷차림, 직업이나 장래 희망에 대해 말하기와 자신이 살고 있는 집, 교실 및 학교 등을 묘사하는 활동을 게임이나 역할놀이 등과 연계하여 3~4학년군에서의 학습 활동을 발전시켜 유창성을 기를 수 있도록 한다.\n초등학생이 관심을 가질만한 도표나 그림, 경험이나 계획, 친숙한 주제 등 적합한 내용을 선정하여 협동학습이나 과제수행, 프로젝트 학습 등의 활동을 계획해보도록 한다. 예를 들어 기차표나 비행기 표를 예약해야 하는 상황, 가족들과 여행을 계획해야 하는 상황 등을 제공하고 학습한 표현들을 질문하기와 대답하기를 통해 자연스럽게 발화해 볼 수 있게 한다.\n교사는 듣고 말하기, 묻고 답하기 등의 활동을 통해 듣기와 말하기 활동이 자연스럽게 연계되도록 지도하되 의미 전달에 중점을 두고 학습자들의 흥미와 관심을 고려하면서 지도한다. 또한 학습자 개개인이 좋아하거나 관심을 갖는 활동과 학습자들의 일상 활동 등에 관한 질문과 대답을 할 수 있게 한다.","v":"5~6학년군 말하기 평가의 내용과 수준은 5~6학년군 말하기 성취기준을 근거로 선정한다.\n말하기 평가를 위한 채점 척도는 말하기 평가 원리에 의한 척도를 응용하거나 과업에 고유한 척도를 별도로 만들어 사용하고, 말하기 능력을 발현시키고 측정할 수 있는 다양한 발화 도출 기법을 사용한다.\n진단평가를 통해 학습자들의 수준을 확인한 후 교수·학습 방법에 적용하도록 한다. 3~4학년군에서 학습한 말하기 능력이 학습자별, 학급별로 다양한 수준을 나타내므로 학습자의 능력에 대한 정확한 진단이 지도내용을 계획하고 지도방법을 결정하여 효과적인 교수·학습 활동을 하는데 중요한 역할을 한다. 학년 초와 학기 초, 단원 시작이나 차시 시작 부분에 적절한 진단평가가 실시되도록 한다.\n말하기 평가는 과업의 성격 등을 고려하여, 학습자에게 발화를 위한 준비 시간을 적절히 주고 말하기 능력을 발현시킨 후 측정하도록 한다. 말의 속도, 발음, 학습한 어휘의 사용 정도를 점검할 수 있도록 간단한 문장으로 소개하기, 묘사하기, 설명하기 등과 같은 다양한 방법을 활용하여 평가한다.\n말하기 평가는 실제 의사소통 상황과 유사한 언어 통합적인 평가 과업을 통해 실제적인 의사소통능력을 확인하도록 한다. 보고 말하거나 듣고 말하기, 읽고 간단하게 말하기 등의 제시 형태와 응답 형태를 가진 과업들을 평가 목표에 적절하게 활용한다.\n구성원의 협력과 노력으로 과제수행이 이루어지는 협동학습을 통해 학습자들의 참여 정도와 의욕, 소집단 활동에서의 배려와 관용 등의 대인 관계 능력 등 학습자들의 정의적인 영역에 대한 평가도 고려한다.\n말하기 능력의 평가로 관찰평가를 활용하도록 한다. 무엇을 어떻게 관찰할 지에 대한 관찰 내용과 관찰 계획을 수립하여 말하기 능력과 태도의 향상 정도도 점검한다. 효과적인 관찰을 위해 주요 내용을 기술하거나 체크리스트 등의 방법을 활용하며 일관성 있는 관찰을 위해 한 번 이상의 관찰을 하도록 한다.","l":"알파벳, 낱말, 강세, 리듬, 억양\n낱말, 어구, 문장\n자기소개, 지시, 설명, 주변 사람, 사물, 주변 위치, 장소\n인사, 일상생활 관련 주제, 그림, 도표, 경험, 계획"},"2015|영어|5~6학년|읽기|1":{"m":"다양한 자료를 활용하여 읽기의 즐거움을 느낄 수 있도록 지도하고 읽기 전 활동, 읽기 중 활동, 읽기 후 활동으로 나누어 단계별로 지도한다.\n소리 내어 읽는 과정이 기계적이고 반복적인 연습만이 되지 않도록 다른 언어 기능과 통합하여 의미 있는 활동이 되도록 한다.\n쉽고 짧은 글을 읽을 때에는 세부 정보를 파악하기 위해 사실적 이해를 바탕으로 수행할 수 있는 참과 거짓 문장 가리기, 퀴즈, 읽고 과제 완성하기 등의 활동을 적용할 수 있다. 초등학교 고학년 학습자의 인지적 특성을 고려하여 단순하게 사실적 정보를 확인하는 수준을 넘어 이해한 것을 바탕으로 인지 능력을 활용할 수 있는 창의적이고 흥미 있는 과제를 제시하여 흥미를 유발시키도록 한다.\n글 수준의 읽기 단계에서 초등학생 수준에 알맞은 학습 전략을 활용하도록 지도하면 학습자들 스스로 읽기 능력을 향상시키는 데 효과적이다.\n줄거리나 목적을 파악하기 위한 읽기는 쉽고 짧은 글을 읽고 대강의 줄거리 파악하기, 친숙한 이야기를 읽고 문장을 순서대로 배열하기, 글을 읽고 간단한 메모 작성하기 등의 다양한 학습 활동으로 구안하여 학습자들에게 흥미 있고 유의미한 활동이 되도록 한다.\n학습자들 수준에 적합한 놀이나 게임을 활용하여 학습 효과를 높이되 지나치게 경쟁적인 게임은 오히려 역효과가 날 수 있으며 영어에 자신감이 부족한 학습자들이 소외될 수 있으므로 협동 활동을 다양하게 활용하도록 한다. 게임을 활용할 때에는 불예측성 및 불확실성을 적절히 활용하여 흥미와 학습 효과를 함께 거두도록 한다.\n읽기 활동을 다른 언어 영역과 자연스럽게 통합이 되도록 구성하여 언어 습득에 긍정적인 효과를 거두도록 한다.","v":"5~6학년군 읽기 평가의 내용과 수준은 5~6학년군 읽기 영역 성취기준을 근거로 선정한다.\n읽기 평가는 평가 목적, 대상 및 방법에 따라 문자, 낱말, 어구, 문장, 문단 등 적절한 수준의 문자 언어 재료를 사용한다.\n교수·학습 활동과 평가가 연계 되도록 하여 학습의 결과만이 평가 되지 않도록 한다.\n사실적 이해 능력을 평가하는 문항을 주로 하되 학습자의 수준에 따라 추론적 이해 문항도 포함시킨다.\n그림이나 도표에 대한 짧은 글을 읽고 세부 정보를 파악하는 평가는 사실적 내용을 파악하는 것에 중점을 둔다. 평가 방법으로는 지필 평가 외에도 글을 읽고 퀴즈에 답하기, 참과 거짓 문장 가리기, 글과 관련된 과제 완성하기 등으로 학습 활동 결과를 평가에 활용할 수 있다.\n쉽고 짧은 글을 읽고 줄거리나 목적을 파악하는 평가는 글을 읽고 한두 문장으로 말하기, 글을 읽고 메모 작성하기 등 말하기와 쓰기 언어 영역과 통합적으로 실시할 수 있다.\n의사소통상황 속에서 여러 언어 기능을 활용하는 통합적인 지도 과정을 반영하여 평가도 통합형 과제로 실시할 수 있다.\n평가의 방법을 지필평가, 교사평가, 상호평가, 자기평가, 포트폴리오 등 다양하게 적용하도록 한다.","l":"알파벳 대소문자, 낱말의 소리, 철자\n강세, 리듬, 억양\n낱말, 어구, 문장\n그림, 도표, 일상생활 관련 주제\n줄거리, 목적"},"2015|영어|5~6학년|쓰기|1":{"m":"쓰기는 듣기, 말하기, 읽기와 연계하여 지도하되, 쓰기 활동의 수준은 음성 언어 및 읽기 활동 수준보다 약간 낮게 구성할 수 있다. 이와 관련하여, 쓰기 활동에 사용되는 어휘 및 언어 형식 수준이 교육과정에서 요구되는 수준보다 높아지지 않도록 주의한다.\n초기에는 반복적인 따라 쓰기, 통제 쓰기 등을 통해 쓰기에 대한 자신감을 증진하고, 점차 유의미한 쓰기 활동을 통해 쓰기의 가치와 즐거움을 알 수 있도록 지도한다.\n듣고 쓰기에서는 소리와 철자 관계를 생각하며 써 보도록 유도하고, 학습자 스스로 철자 오류를 발견하고 수정할 수 있도록 다양한 교정적 피드백을 제공한다.\n구두로 익힌 문장을 지도할 때 짧고 쉬운 문장부터 쓰게 하고, 표현이 쉬워도 단어의 구조가 어려운 것은 나중에 지도한다. 학습자들의 쓰기 능력이 신장되는 시기이므로 다양한 쓰기 활동을 활용하되 따라 쓰기, 보고 쓰기, 완성하여 쓰기, 듣고 쓰기의 순으로 점진적으로 수준이 높아지도록 한다. 특히 실물이나 그림과 같은 시각적 도움을 제공함으로써 학습자들이 영어로 문장을 쓰는데 있어서 인지적 부담감을 줄여 쓰기에 지속적으로 흥미를 가질 수 있도록 유도한다.\n다양한 쓰기 과제와 협력적 글쓰기 활동을 통해 쓰기에 대한 흥미와 관심 및 학습자 상호간의 협력을 유도하되 결과물로서 쓰기와 과정으로서의 쓰기를 모두 즐길 수 있도록 유도한다.\n교사의 교정 및 학습자 상호간의 교정을 통해 알파벳 대소문자와 문장 부호 등 영어 표기법을 이해하고 바르게 쓸 수 있도록 지도할 수 있다. 예를 들면 단어와 단어 사이를 띄어 쓰는 것, 단어, 구, 문장에서 대문자와 소문자를 구별하여 쓰는 것 등을 익힐 수 있도록 지도하고, 문장의 첫 글자와 나(I)는 항상 대문자로 시작한다는 것을 지도한다. 또한 쉼표, 물음표, 따옴표 등 구두점의 사용을 바르게 할 수 있도록 지도한다. 학습 활동으로는 소문자로 된 문장을 고쳐 쓰기, 문장의 종류에 맞는 구두점 골라 쓰기, 각자 쓴 문장이나 글을 교환하여 대소문자, 문장부호, 띄어쓰기를 서로 고쳐주기 등이 가능하다.\n영어의 표기법을 익히는 활동을 할 때 국어의 표기법과 공통점, 차이점을 비교하면서 학습하는 것도 효과적일 수 있다.\n감사 카드나 생일 초대 카드는 생활 주변에서 익숙하게 접하는 쓰기 자료들이다. 학습자들의 수준에 맞는 카드를 양식에 맞게 써 보도록 한다. 학습 활동으로는 생일 카드 만들기, 스승의 날, 어버이날, 크리스마스 등 특별 행사에 맞는 카드를 만들고 영어로 적절한 말 쓰기 등, 학습자들의 수준에서 실생활과 관련된 쓰기 활동이 가능하다. 예시문을 제시하되 단순히 베끼거나 따라 쓰는 것을 넘어, 각자 쓰고 싶은 내용을 써보는 단계로까지 확장하고 필요 시 교사가 적절하게 도움을 주며 활동을 마무리 할 수 있도록 유도한다.\n학습자가 쓰기의 과정을 충분히 즐길 수 있도록 계획 단계, 쓰기 단계, 수정 단계 혹은 쓰기 전 활동, 쓰기 중 활동, 쓰기 후 활동으로 구성하여 단계적으로 지도할 수 있다.","v":"5~6학년군 쓰기 평가의 내용과 수준은 5~6학년군 쓰기 영역 성취기준을 근거로 선정한다.\n쓰기 능력을 발현시키고 측정할 수 있는 다양한 쓰기 기법을 사용한다.\n쓰기 평가를 위한 채점 척도는 일반 쓰기 평가 원리에 의한 척도를 응용하거나, 과업에 고유한 척도를 별도로 만들어 사용할 수 있다.\n결과물로서의 쓰기뿐만 아니라 쓰기 과정에 대한 평가를 할 수 있도록 한다.\n쓰기 평가의 과정에서 학습자가 자신의 쓰기 실력 향상을 위한 실질적인 도움을 받을 수 있도록 한다.\n평가 과정 및 결과는 다음 수업의 교수 학습 개선을 위해 활용한다.\n교사에 의한 관찰, 지필, 포트폴리오 등의 수행평가 외에 자기평가, 학생 상호평가 등 학습자들에 의한 평가를 부분적으로 반영하는 것도 고려할 수 있다.","l":"알파벳 대소문자\n구두로 익힌 낱말, 어구, 실물, 그림\n문장부호, 구두로 익힌 문장\n초대, 감사, 축하 글"},"2015|음악|3~4학년|표현|1":{"m":"다양한 음악적 경험을 통해 음악을 구성하는 요소들을 이해하고, 악곡의 특징을 목소리, 악기, 신체, 그림 등을 활용하여 창의적으로 표현하도록 한다.\n학생들의 생각과 경험을 바탕으로 노랫말을 창의적으로 바꿀 수 있도록 지도하며, 노랫말의 의미를 살려 말붙임새를 만들도록 한다.\n악곡의 리듬꼴과 장단꼴을 충분히 습득한 후, 창의적으로 리듬꼴과 장단꼴을 바꾸어 표현할 수 있도록 단계적으로 지도한다.\n자연이나 생활 속의 다양한 소리를 탐색하여 목소리, 악기, 신체, 물체 등으로 표현하도록 한다.\n노래, 악기 연주, 신체표현을 통합적으로 활용하여 표현할 수 있도록 한다.\n노래 부르기는 노랫말과 가락의 관계를 탐색하고, 그에 따른 느낌을 자유롭게 표현하도록 한다.\n가락, 시김새, 창법을 지도할 때에는 손, 가락선 악보 등을 활용하여 다양하게 표현하도록 한다.\n악기의 소리를 탐색하고 그 특징을 살려 연주하도록 한다.\n학생의 수준에 따라 그림, 기호, 문자, 악보 등을 활용하여 음악을 만들어 표현하도록 한다.\n이론 위주의 수업보다 활동 중심의 수업을 통해 악곡의 특징을 지도한다.\n국악곡은 되도록 국악기로 반주하여 국악의 특징을 살려 노래 부를 수 있도록 한다.\n자유롭게 소리를 탐색하고 음악을 창의적으로 만들 수 있는 분위기를 조성한다.\n국악과 관련된 음악 만들기는 국악기를 활용하거나 노래 부르기를 통해 그 결과를 표현할 수 있도록 한다.\n노래 부르기나 악기 연주 시 바른 자세로 연주할 수 있도록 지도한다.\n악기의 좋은 소리를 유지하기 위해 악기를 관리하는 법을 안내한다.","v":"평가의 내용에 따라 실기 평가, 관찰, 포트폴리오 등 다양한 유형의 방법을 적절하게 활용한다.\n교사의 평가뿐만 아니라 상호 평가, 자기 평가 등 학생의 평가를 병행하여 실시할 수 있다.\n노래 부르기, 악기 연주하기, 음악 만들기 등의 표현 활동은 기능, 표현, 태도 등을 고루 반영하여 평가한다.","l":"음악의 구성, 자세와 연주법"},"2015|음악|3~4학년|감상|1":{"m":"실음을 통해 음악 요소와 개념을 구별할 수 있도록 지도한다.\n음악 요소와 개념은 시각적, 청각적, 신체적 활동 등을 적극적으로 활용하여 지도한다.\n악곡의 특징을 파악하기 위해 음원, 그림, 영상 등 여러 가지 자료를 활용한다.\n음악 감상을 통해 학생들이 음악에 대한 미적 체험을 할 수 있도록 다양한 교수·학습 방법을 활용한다.","v":"평가의 내용에 따라 실음 지필 평가, 관찰, 포트폴리오, 보고서 등 다양한 유형의 방법을 적절하게 활용한다.\n교사의 평가뿐만 아니라 상호 평가, 자기 평가 등 학생의 평가를 병행하여 실시할 수 있다.\n음악에 관한 포괄적 이해의 정도와 태도 등을 평가한다.","l":"3~4학년 수준의 음악 요소와 개념, 상황이나 이야기 등을 표현한 음악"},"2015|음악|3~4학년|생활화|1":{"m":"음악 수업과 학생들의 생활 속에서 놀이 활동이 이어질 수 있도록 지도한다.\n생활 속에서 학생들이 접할 수 있는 국악을 조사하여 발표하도록 한다.\n학교 내외의 음악 활동과 관련된 다양한 정보와 기회를 제공하여 학생들이 적극적으로 음악 활동에 참여할 수 있도록 지도한다.\n다양한 행사에 적합한 음악을 선택·활용하여 음악의 쓰임과 역할을 이해하도록 지도한다.","v":"평가의 내용에 따라 관찰, 포트폴리오, 보고서 등 다양한 유형의 방법을 적절하게 활용한다.\n교사의 평가뿐만 아니라 상호 평가, 자기 평가 등 학생의 평가를 병행하여 실시할 수 있다.\n학교 내외의 음악 활동에 참여하는 정도, 음악에 대한 태도와 생활화의 실천 정도 등을 평가한다.","l":"음악과 행사, 음악과 놀이, 생활 속의 국악"},"2015|음악|5~6학년|표현|1":{"m":"다양한 음악적 경험을 통해 음악을 구성하는 요소들을 이해하고, 악곡의 특징을 목소리, 악기, 신체, 그림 등을 활용하여 창의적으로 표현하도록 한다.\n학생들의 생각과 경험을 바탕으로 창의적으로 노랫말을 바꿀 수 있도록 지도하며, 노랫말의 의미를 살려 말붙임새를 만들도록 한다.\n가락 바꾸기는 노랫말과 가락의 관계를 탐색하고, 악곡의 특징에 대한 이해를 바탕으로 가락을 바꾸도록 지도한다.\n노래 부르기는 노랫말의 의미를 파악하고, 정확한 발음과 바른 호흡으로 노랫말을 전달할 수 있도록 지도한다.\n자연이나 생활 속의 다양한 소리를 탐색하여 목소리, 악기, 신체, 물체 등으로 표현하도록 한다.\n노래, 악기 연주, 신체표현을 통합적으로 활용하여 표현할 수 있도록 한다.\n노래 부르기는 노랫말과 가락의 관계를 탐색하고, 그에 따른 느낌을 자유롭게 표현하도록 한다.\n가락, 시김새, 창법을 지도할 때에는 손, 가락선 악보 등을 활용하여 다양하게 표현하도록 한다.\n악기의 소리를 탐색하고 그 특징을 살려 연주하도록 한다.\n학생의 수준에 따라 그림, 기호, 문자, 악보 등을 활용하여 음악을 만들어 표현하도록 한다.\n이야기의 장면이나 상황을 음악으로 표현하는 것과 관련된 음악 요소를 탐색하고 이를 신체, 목소리, 악기, 물체 등으로 표현할 수 있도록 한다.\n이론 위주의 수업보다 활동 중심의 수업을 통해 악곡의 특징을 지도한다.\n국악곡은 되도록 국악기로 반주하여 국악의 특징을 살려 노래 부를 수 있도록 한다.\n자유롭게 소리를 탐색하고 음악을 창의적으로 만들 수 있는 분위기를 조성한다.\n국악과 관련된 음악 만들기는 국악기를 활용하거나 노래 부르기를 통해 그 결과를 표현할 수 있도록 한다.\n노래 부르기나 악기 연주 시 바른 자세로 연주할 수 있도록 지도한다.\n악기의 좋은 소리를 유지하기 위해 악기를 관리하는 법을 안내한다.","v":"평가의 내용에 따라 실기 평가, 관찰, 포트폴리오 등 다양한 유형의 방법을 적절하게 활용한다.\n교사의 평가뿐만 아니라 상호 평가, 자기 평가 등 학생의 평가를 병행하여 실시할 수 있다.\n노래 부르기, 악기 연주하기, 음악 만들기 등의 표현 활동은 기능, 표현, 태도 등을 고루 반영하여 평가한다.","l":"음악의 구성, 자세와 연주법"},"2015|음악|5~6학년|감상|1":{"m":"실음을 통해 음악 요소와 개념을 구별할 수 있도록 지도한다.\n음악 요소와 개념은 시각적, 청각적, 신체적 활동 등을 적극적으로 활용하여 지도한다.\n악곡의 특징을 파악하기 위해 음원, 그림, 영상 등 여러 가지 자료를 활용한다.\n다른 교과와의 연계를 통해 음악의 다양한 문화적 배경을 폭넓게 이해할 수 있도록 한다.\n음악 감상을 통해 학생들이 음악에 대한 미적 체험을 할 수 있도록 다양한 교수·학습 방법을 활용한다.","v":"평가의 내용에 따라 실음 지필 평가, 관찰, 포트폴리오, 보고서로 등 다양한 유형의 방법을 적절하게 활용한다.\n교사의 평가뿐만 아니라 상호 평가, 자기 평가 등 학생의 평가를 병행하여 실시할 수 있다.\n음악에 관한 포괄적 이해의 정도와 태도 등을 평가한다.","l":"5~6학년 수준의 음악 요소와 개념, 다양한 문화권의 음악"},"2015|음악|5~6학년|생활화|1":{"m":"학교 내외의 음악 활동과 관련된 다양한 정보와 기회를 제공하여 학생들이 적극적으로 음악 활동에 참여할 수 있도록 지도한다.\n다양한 행사에 적합한 음악을 선택·활용하여 음악의 쓰임과 역할을 이해하도록 한다.\n음악이 몸과 마음의 안정, 정서의 순화, 치유 등 심신 건강에 영향을 미치는 사례를 조사하여 발표하도록 한다.\n지역에 대한 애호심과 국악에 대한 올바른 가치관을 형성할 수 있도록 지도한다.","v":"평가의 내용에 따라 관찰, 포트폴리오, 보고서 등 다양한 유형의 방법을 적절하게 활용한다.\n교사의 평가뿐만 아니라 상호 평가, 자기 평가 등 학생의 평가를 병행하여 실시할 수 있다.\n학교 내외의 음악 활동에 참여하는 정도, 음악에 대한 태도와 생활화의 실천 정도 등을 평가한다.\n[음악 요소와 개념 체계표 ]\n초등학교 3~4학년\n초등학교 5~6학년\n중학교 1~3학년\n박, 박자\n장단, 장단의 세\n음의 길고 짧음\n간단한 리듬꼴\n장단꼴\n말붙임새\n박, 박자\n장단, 장단의 세\n여러 가지 리듬꼴\n장단꼴\n말붙임새\n여러 가지 박자\n장단, 장단의 세\n여러 가지 박자의 리듬꼴\n여러 가지 장단의 장단꼴\n말붙임새\n음의 높고 낮음\n차례가기와 뛰어가기\n시김새\n음이름, 계이름, 율명\n장음계, 단음계\n여러 지역의 토리\n시김새\n여러 가지 음계\n여러 지역의 토리\n여러 가지 시김새\n소리의 어울림\n주요 3화음\n다양한 소리의 어울림\n딸림7화음\n다양한 소리의 어울림, 종지\n형식(메기고 받는 형식, ab 등)\n형식(긴자진 형식, 시조 형식, aba, AB 등)\n형식(연음 형식, 한배에 따른 형식, 론도, ABA, 변주곡 등\n셈여림\n셈여림의 변화\n셈여림의 변화\n빠르기/한배\n빠르기의 변화/한배의 변화\n빠르기의 변화/한배의 변화\n목소리, 물체 소리, 타악기의 음색\n관악기, 현악기의 음색\n여러 가지 음색","l":"음악과 행사, 음악과 건강, 국악과 문화유산"},"2015|즐거운 생활|1~2학년|가족|1":{"m":"① 브레인스토밍이나 마인드맵 등을 활용하여 가족에게 고마움을 표현할 수 있는 방법을 자유롭게 생각할 수 있게 한다.\n② 각 가정마다 가족 행사가 다를 수 있으므로 자신의 가족 행사나 활동은 무엇인지 생각할 수 있는 시간을 충분히 주고, 다양한 방법으로 행사 표나 달력 등을 만들어 볼 수 있도록 한다.\n③ 서로 협력하고 배려하는 마음을 갖고 노래, 작품 제작, 신체 활동 등에 참여하게 한다.\n④ 토의, 역할 놀이 등을 활용하여 가족 구성원의 역할에 대해 서로의 생각을 나타내고 이를 표현하게 한다.\n⑤ 가족 구성원 역할 놀이를 할 때 성역할이 고정되지 않도록 유의한다.\n⑥ 다양한 형태의 가족에 관한 학습을 하는 과정에서 편견을 갖거나 학생들이 서로 마음의 상처를 주지 않도록 지도한다.","v":"① 가족 구성원의 역할, 가족의 소중함과 고마움 등을 여러 가지 방법으로 표현하는지에 대한 과정을 평가함에 있어서 포트폴리오, 자기 평가, 일화 기록, 자료 수집 등을 활용한다.\n② 다양한 가족의 문화를 이해하고 존중하며 가족 놀이에 즐겁게 참여하는지 평가한다.\n③ 우리 집과 주변에서 볼 수 있는 집, 내가 살고 싶은 집을 노래, 이미지, 신체 활동, 놀이 등 다양한 방법으로 표현할 수 있는지 평가한다.","l":"가족에 대한 마음 표현, 가족 활동 및 행사 표현, 집의 모습 표현, 가족 역할 놀이"},"2015|즐거운 생활|1~2학년|여름|1":{"m":"① 즐거운 마음으로 친구들과 함께 여름과 관련된 다양한 놀이를 안전하게 할 수 있도록 지도한다.\n② 여름과 관련된 다양한 주제나 자료 등을 제시하고 주어진 여건이나 상황에 맞게 변형하여 놀이를 해 볼 수 있다.\n③ 물놀이 또는 장난감이나 도구 등을 활용한 놀이를 할 때 필요한 규칙을 탐색하고 직접 체험할 수 있도록 한다. 또한 놀이를 할 때의 안전 수칙을 지켜 위험으로부터 자신을 보호할 수 있도록 지도한다.\n④ 여름에 주로 접할 수 있는 동식물(곤충 포함)을 다양하게 탐색 및 표현하고, 자신과 친구의 결과물을 공연, 전시, 감상하는 과정에서 서로 활발하게 소통할 수 있도록 지도한다.","v":"① 친구와 함께 하는 놀이에서 적극적으로 참여하고 협력하는지를 평가한다.\n② 다양한 표현 및 놀이 활동을 적절히 수행하는지, 친구들의 발표나 공연을 제대로 감상하는지 등을 평가한다.\n③ 자기 평가, 동료 평가, 관찰 평가 등 다양한 방법을 활용하여 평가한다.","l":"여름 느낌 표현, 생활 도구 장식·제작, 여름 동식물 표현, 여름철 놀이"},"2015|즐거운 생활|1~2학년|마을|1":{"m":"① 브레인스토밍이나 마인드맵 등을 활용하여 우리 이웃과 동네의 모습 및 생활에 대하여 자유롭게 생각하고 탐색한다.\n② 주변의 장소, 시설물, 동네 모습, 일터 모습 등에 대한 직접적인 경험과 체험을 할 수 있도록 구성한다. 이를 위해 사전에 학생이 탐색하고 수업 시간에 다양한 활동을 통해 상기하는 방식이나, 수업 중 체험하는 방식 등을 활용할 수 있다.\n③ 모둠별로 동네에서 볼 수 있는 일터 중 하나를 선택하여 직업 놀이를 한다. 모둠별로 일터를 꾸며서 그 일터에서 직업 놀이를 하고 이동하여 다른 일터에서 직업 놀이를 하는 식으로 구상할 수 있다.\n④ 직업 놀이, 역할 놀이 등의 활동을 효율적으로 수행하기 위하여 계획 단계와 실행 단계를 적절히 구분하여 시간 안배를 하도록 한다.","v":"① 동네에서 볼 수 있는 모습, 장소, 시설물, 직업 등을 다양하고 적합하게 표현하는지 평가한다.\n② 표현 활동을 통해 다양한 직업 놀이를 즐기는지 평가한다.\n③ 상호평가, 관찰 평가 등을 활용하여 모둠학습을 할 때 협력적으로 참여하는지 평가한다.\n④ 결과 위주의 기능 중심 평가가 아닌 과정 위주의 표현 중심 평가가 이루어질 수 있도록 한다.","l":"이웃 모습과 생활 모습 표현, 공공장소 시설물 이용 놀이, 동네 모습 표현, 직업 놀이"},"2015|즐거운 생활|1~2학년|가을|1":{"m":"① 가을 모습이나 가을의 아름다움에 대한 느낌 등을 다양하게 탐색 및 표현하고, 친구들과 활발하게 소통하며 자신과 친구의 결과물을 공연, 전시, 감상한다.\n② 민속놀이를 할 때 이기기 위한 경쟁 분위기가 아니라 함께 즐기기 위한 분위기를 조성할 수 있도록 지도한다.\n③ 민속놀이를 할 때 학생들의 수준을 고려하여 다양하게 변형하여 지도할 수 있다. 정확한 동작보다는 전통 춤의 흥겨움을 충분히 느낄 수 있도록 하고, 장단을 쉽게 변형하여 전통 음악의 흥겨움을 느낄 수 있도록 지도할 수 있다.\n④ 협력학습, 모둠학습 등을 활용하여 실제 춤과 놀이에 적극적으로 참여하도록 지도한다.\n⑤ 소리, 이미지(사진/그림), 동영상, 애니메이션, 인터넷, 컴퓨터, 태블릿 PC 등 다양한 정보 매체 자료 및 기기를 활용할 수 있으며, 학생들의 흥미와 관심을 유도하는 교수·학습이 이루어지게 한다.","v":"① 가을의 모습이나 느낌, 관련 소재들을 노래, 이미지, 움직임, 놀이 등 다양한 방법으로 표현할 수 있는지 평가한다.\n② 민속놀이에 흥미를 느끼고 즐겨 참여하는지와 친구와 함께 협력하는지를 평가한다.\n③ 자기 평가, 동료 평가, 관찰 평가 등의 다양한 방법을 활용하여 주어진 가을 관련 상황이나 내용에 적합하게 표현하는지 평가한다.","l":"가을 느낌 표현, 가을 놀이, 민속놀이, 낙엽 및 열매 표현"},"2015|즐거운 생활|1~2학년|나라|1":{"m":"① 우리나라를 상징하는 것들을 여러 가지 방법으로 표현하거나 남북한의 놀이를 하면서 자연스럽게 나라를 사랑하는 마음도 함께 다질 수 있도록 지도한다.\n② 책이나 사진, 영상 등을 보거나 경험을 들음으로써 여러 나라 사람들의 생활 모습을 탐색한 후 다양한 활동을 해 본다.\n③ 작품을 전시하여 친구들과 함께 살펴보면서 사용한 재료와 표현상의 특징을 자유롭게 이야기 해 본다.\n④ 남북한 놀이를 할 때 놀이 또는 신체 활동의 방법 및 규칙을 충분히 설명하고 경쟁보다는 서로를 배려하고 함께 어울리며 참여하는 데 주안점을 두고 지도한다.\n⑤ 다른 나라의 문화를 표현하는 과정에서 다른 문화에 대해 존중하는 마음을 가지도록 지도한다.\n⑥ 이 영역(대주제)에서 다루는 다른 나라는 학생들의 관심사를 반영하여 선정하도록 하고, 그 나라의 문화에 대해 이해할 수 있도록 한다.","v":"① 우리나라 혹은 다른 나라와 관련된 다양한 표현 놀이에 즐겁게 참여하는지 평가한다.\n② 다른 나라의 노래, 춤, 놀이를 즐기는 과정에서 느낀 것을 다양하게 표현할 수 있는지 평가한다.\n③ 다른 나라의 노래, 춤, 놀이에 대한 정보에 익숙해지는 것과 동시에 놀이하기, 표현하기와 같은 표현 기능을 습득하는지에 대해서도 평가한다.","l":"우리나라의 상징 표현, 남북한의 놀이, 작품 전시·공연, 다른 나라의 노래, 춤, 놀이"},"2015|즐거운 생활|1~2학년|겨울|1":{"m":"① 겨울의 모습이나 느낌, 겨울철 동물들의 모습 등을 다양하게 표현해 보고, 이를 소재로 놀이와 신체 활동을 한다.\n② 겨울철 실내외에서 할 수 있는 운동을 찾아 친구들과 재미있게 한다. 날씨 상황이 여의치 않을 경우 실내 놀이나 운동으로 변형하여 활동할 수 있다.\n③ 학급 실정에 맞게 활동을 선택하여 진행하되, 학생들이 놀이 도구를 다양한 방법으로 만들어 볼 수 있도록 격려한다.\n④ 학생들이 충분히 재미를 느끼며 적극적으로 참여하도록 유도하고, 지나친 경쟁심은 경계하여 승부에 집착하지 않도록 지도한다.\n⑤ 질서 있게 놀이가 진행되도록 사전에 경기 방법과 규칙에 대해 충분히 안내한다.\n⑥ 경기 또는 놀이 후에는 느낀 점에 대해 발표해 보고 자신의 경기 태도를 반성하는 시간을 갖는다.","v":"① 건강한 겨울을 나기 위해 스스로 세운 계획에 따라 규칙적으로 운동을 하는지 평가한다.\n② 놀이의 방법과 규칙을 알고 친구와 함께 잘 어울려 겨울 놀이를 하는지 평가한다.\n③ 겨울 놀이에 대한 관심과 이해를 평가하는 동시에 표현하기, 놀이하기와 같은 기능에 대해 관심을 가지고 평가한다.\n④ 겨울 날씨에 따라 자연 환경을 이용한 놀이를 계획하고 즐길 수 있는지, 놀이를 통해 의사소통 역량이 함양되었는지 평가한다.","l":"겨울 느낌 표현, 놀이 도구 제작, 동물 흉내 내기, 겨울철 신체 활동"},"2015|체육|3~4학년|건강|1":{"m":"건강한 생활 습관을 지도하기 위한 소재는 생활 전반에서 보편적이고 지속적으로 요구되는 기본생활 습관을 중심으로 선정하며 각각의 소재는 수행 가능한 구체적인 활동으로 구성한다.\n학생들의 연령별 특성, 흥미 등을 고려하여 건강을 유지 및 증진하기에 적합한 놀이, 게임 등을 중심으로 구성할 수 있다.\n여가에 대한 특정한 실천 방법을 강조하기보다는 다양한 여가 활동을 통해 신체적, 정신적, 정서적으로 건강해짐을 학생들이 인식할 수 있도록 지도한다.\n자신의 수준에 적합한 운동 수준(운동 빈도, 운동 시간, 운동 강도 등)을 지도할 때에는 학생들의 수준에서 적용 가능한 방법을 쉽게 이해할 수 있는 표현을 사용한다(예：옆 사람과 대화가 약간 힘들 정도로 30분간 뛰기 등).","v":"단위 차시별로 성취기준을 구분하여 평가하기보다는 여러 차시에 걸쳐 형성된 건강 관리 능력과 태도를 종합적으로 평가한다.\n건강 관리 능력은 건강 증진을 위해 자신을 평가하고 스스로 계획을 수립하여 실천할 수 있는 능력을 평가한다.\n지필 위주의 평가 방식뿐만 아니라 관찰, 면담, 수행평가, 체크리스트 등을 활용하여 종합적인 이해와 수행 능력을 평가한다.\n평가 결과는 학생들의 건강 증진을 생활화하기 위한 기초 자료로 활용한다."},"2015|체육|3~4학년|도전|1":{"m":"목표 설정에 대한 이해와 지속적인 수련이 필요한 속도 도전 영역의 학습을 위하여 3~4학년군 학생의 수준에 적합한 신체활동을 선정하되 계획한 바에 따라 학생 스스로 지속적인 연습 및 점검(기록 측정 등)을 할 수 있는 활동을 선정한다.\n새로운 동작이나 보다 어려워진 동작을 접했을 때 느낄 수 있는 불안감과 두려움을 해소할 수 있도록 단순한 동작에서부터 난도가 높은 여러 가지 동작으로 수업의 내용을 구성한다.\n학생들의 참여도를 높이고 성취의 기쁨을 경험할 수 있도록 활동 과제의 수준과 연습 방법을 다양화한다.\n학습 과정 중에 일부 단계적인 성취가 이루어졌을 때 즉각적이고 충분한 칭찬과 격려를 함으로써 도전에 대한 지속적인 동기를 부여한다.\n자신의 수행에 대한 의미 있는 분석이 이루어질 수 있도록 수행에 관한 중요한 움직임 요소나 원리 등을 제시한다.","v":"속도 도전은 지속적인 도전을 위한 태도를 과정 중심으로 평가하는 것이 바람직하다. 이를 위해 신체활동의 수행 과정을 기록한 점검 일지나 본인의 도전 내용을 구체적으로 기록한 자료 등을 활용하여 다각도로 평가한다.\n동작 도전은 활동에 지속적으로 참여하는 자세를 평가하는 것이 바람직하다. 따라서 활동의 난이도에 따른 성취 결과뿐만 아니라 활동 참여 빈도, 활동 참여 자세도 함께 평가한다.\n도전 영역에 대한 이해도와 학생의 도전 수행 과정을 평가하기 위해 포트폴리오 등 과정 중심의 평가 도구를 활용한다."},"2015|체육|3~4학년|경쟁|1":{"m":"경쟁의 기초에서 다루는 신체활동은 게임 유형별(영역형, 필드형, 네트형) 기본 기능과 전략을 포함한 단순한 규칙의 게임을 중심으로 선정하되 가급적 학생들이 다양한 게임의 유형을 접할 수 있도록 활동을 편성한다.\n경쟁의 기초에서는 게임 상황을 유리하게 이끌 수 있는 다양한 전략을 학생 스스로 탐색하게 하고 전략의 수립과 적용에 대한 시도 자체를 긍정적으로 수용한다. 운동 기능은 다양한 경쟁 활동에 통용되는 달리기, 받기, 던지기, 치기, 차기 등의 기본 운동 기능을 중심으로 지도한다.\n영역형 경쟁에서는 학습 주제와 학생들의 발달 단계에 적합하도록 변형한 형태의 게임을 중심으로 신체활동을 구성한다.\n영역형 경쟁에서는 공간 만들기, 공간 차단하기, 골 넣기와 막기의 기본 전략과 공 이어주기, 공 몰기, 공 빼앗기, 골 넣기와 막기 등의 기본 기능을 다룬다.\n영역형 경쟁에서는 남녀 성별에 따른 차이가 비교적 두드러지게 나타난다. 남녀 혼합 팀을 구성하여 경쟁을 할 경우 양성의 평등한 참여를 보장할 수 있는 게임 규칙을 적용한다.\n영역형 경쟁의 경우 게임의 흐름을 유지할 수 있도록 충분한 공간을 확보한다. 또한, 공간 만들기의 기본 전략(공간 침투 등)이 구현될 수 있도록 활동을 구성한다.\n영역형 경쟁의 경우 신체 접촉이 많이 일어나므로 과도한 신체 접촉을 완화할 수 있는 규칙(공을 빼앗을 수 있는 조건을 명확히 하는 등)을 적용한다.","v":"경쟁의 의미를 평가할 때에는 여타의 신체활동과 구분되는 경쟁 활동의 특성에 대한 이해를 주요 평가 내용으로 한다.\n경쟁의 기초를 학습할 때는 게임 상황에서 전략과 기능이 필요함을 인지하고 있는지 여부와 이를 습득하려는 노력의 과정을 평가한다.\n전략을 활용한 공격과 수비 행동의 빈도와 적절성 등을 중심으로 영역형 경쟁의 전략 이해 및 적용 능력을 평가한다. 특히, 게임 관련 지식, 기능, 태도 등을 분절적으로 평가하는 것은 지양하며 게임 수행 능력 평가 등의 방법을 활용하여 종합적으로 평가한다.\n게임 수행 과정을 중심으로 규칙 준수 및 협동의 태도를 평가한다."},"2015|체육|3~4학년|표현|1":{"m":"움직임 언어에 따른 표현 요소를 다양하게 익힐 수 있는 신체활동을 선정한다. 특히, 시, 동화 등의 이야기를 적극 활용하여 다양한 상황에 적절한 움직임을 수행할 수 있는 기회를 제공한다.\n리듬 표현을 지도할 때에는 음악의 빠르기, 셈여림 등이 다른 음악을 활용하여 학습자가 리듬이나 음악의 셈여림, 빠르기에 따른 적합한 신체 움직임을 익힐 수 있도록 한다. 또한, 리듬에 따른 신체 움직임에 익숙해지도록 반복되는 리듬을 활용할 수도 있다.\n도구를 활용한 리듬 표현을 할 때에는 음악에 맞추어 도구를 조작하는 것이 어려울 수 있으므로 기초적인 움직임부터 난도가 높은 움직임을 단계적으로 배울 수 있도록 한다. 즉, 도구를 조작하는 데 필요한 동작을 먼저 익히고 이를 바탕으로 리듬에 따른 움직임을 익히게 한다.\n움직임 및 리듬 표현에 관련된 활동을 한 후에는 여러 사람 앞에서 활동한 결과를 지속적으로 발표하고 감상하는 과정을 통해 표현의 중요성을 경험한다. 또한, 자신감을 갖고 표현할 수 있도록 긍정적인 피드백을 적극적으로 제공한다.","v":"초등학교 3~4학년군의 표현 영역은 자신의 감정이나 느낌을 표현한 것을 바탕으로 그것의 수행 이유, 내용, 방법 등을 종합적으로 평가한다.\n움직임 표현은 움직임 언어에 따른 표현 요소의 구성과 표현 방식을 중심으로 평가하되 움직임 언어와 표현 요소를 활용한 신체 움직임 구성 능력을 평가의 기준으로 삼는다.\n리듬 표현은 리듬의 세기, 빠르기에 따라 신체 움직임을 정확하게 구사할 수 있는지를 평가한다.\n자신의 감정을 다른 사람들 앞에서 적극적으로 발표할 수 있는지를 지속적으로 확인하고 평가에 반영한다."},"2015|체육|3~4학년|안전|1":{"m":"다양하고 구체적인 사례들을 중심으로 신체활동과 관련한 위험 요소를 파악하여 안전사고에 대처하는 방법을 체험한다.\n다양한 신체활동에서 장비의 올바른 사용법을 지속적으로 실천할 수 있는 기회를 제공하기 위하여 체육과의 여러 영역과 관련 지어 지도한다.\n운동 장비 안전의 학습 내용에는 장비의 올바른 사용법뿐만 아니라 장비의 안전함을 판단하는 내용을 포함한다.\n수상(게임) 안전에는 안전한 수상(게임) 활동 시설의 선정, 준비 운동, 놀이 시 유의 사항 둥 구체적인 안전 확보 요령과 더불어, 변화하는 상황에 능동적으로 대처할 수 있도록 상황별 위기 대처 요령을 함께 지도한다.\n안전사고의 사례로 지나친 공포를 불러일으킬 수 있거나 선정적인 내용들을 제시하지 않도록 주의한다.\n위기 대처 방법을 익히기 위한 실습 시 주변에 위험한 요소가 없는지 사전에 면밀히 검토한다.","v":"신체활동 상황에 따라 위험 요소를 인식하고 안전한 방법으로 신체활동을 수행하는지 평가한다.\n안전 의식과 안전 확보 능력은 해당 차시의 수업에서뿐만 아니라 타 영역과 연계하여 수시로 평가한다.\n평가 결과에 대한 피드백을 상황별로 즉시 제공함으로써 신속한 교정이 이루어질 수 있도록 한다.\n<표 1> 초등학교 3~4학년 신체활동 예시\n영역\n신체활동 예시\n건강\n(가) 건강과 체력\n일상생활에서 실천할 수 있는 체력 운동(맨손체조, 줄넘기 등), 기본 생활 습관 형성 활동(몸의 바른 자세, 손 씻기, 양치질, 올바른 식습관 등)\n(나)여가와 운동 방법\n일상생활에서 실천할 수 있는 여가 활동(걷기, 자전거타기, 플라잉디스크, 제기차기, 투호, 사방치기 등), 기초체력 측정 및 증진 활동(스트레칭, 팔굽혀펴기, 왕복달리기, 전력달리기 등)\n도전\n(가) 속도 도전\n단거리달리기, 이어달리기, 오래달리기 및 걷기, 장애물달리기, 자유형, 평영, 배영 등\n(나) 동작 도전\n매트운동, 뜀틀운동, 평균대운동, 태권도 품새 등\n경쟁\n(가) 경쟁의 기초\n태그형 게임, 기초적인 수준의 영역형/필드형/네트형 게임 등\n(나) 영역형 경쟁\n축구형 게임, 농구형 게임, 핸드볼형 게임, 럭비형 게임, 하키형 게임 등\n표현\n(가) 움직임 표현\n움직임 언어(이동 움직임, 비이동 움직임, 조작 움직임)를 활용한 표현 활동, 표현 요소(신체, 노력, 공간, 관계 등)를 활용한 표현 활동 등\n(나) 리듬 표현\n공 체조, 리본 체조, 후프 체조, 음악 줄넘기, 율동 등\n안전\n(가) 신체활동과 수상 활동 안전\n신체활동과 관련된 안전사고의 종류와 원인 조사 활동, 수상 안전사고 예방 및 대처활동 등\n(나)운동 장비와 게임 활동 안전\n운동 장비와 관련된 안전사고의 종류와 원인 조사 활동, 게임 안전사고 예방 및 대처활동 등\n※신체활동은 교육과정의 목적에 근거하여 선택하되, 학교의 교육 여건을 고려하여 다른 영역의 신체활동 예시나 새로운 신체활동을 선택할 수 있다. 단, 단위 학교의 학년 협의회를 통해 결정한다."},"2015|체육|5~6학년|건강|1":{"m":"건강한 성장에 대한 학습 활동은 개인에 따라 성장의 속도가 다르고 성별에 따라서도 다른 특징이 나타나며 타인과 자신의 차이를 긍정적으로 수용할 수 있도록 지도한다.\n학생 자신이 선호하거나 관심 있는 신체활동 중심으로 여가 활동을 계획하고 실천할 수 있도록 한다.\n체력의 유형에 따른 건강 증진 방법은 각각의 체력 요소를 기르기에 적합한 운동을 선정하고 자신의 수준에 맞는 운동 방법을 찾아 실천할 수 있도록 지도한다.\n건강한 성장 발달과 관련하여 성별 신체 변화가 나타나기 시작하는 시기임을 고려하여 올바른 성 의식과 태도를 함께 기를 수 있도록 지도한다.\n잘못된 방식으로 운동하거나 과도하게 운동을 하는 것은 오히려 건강에 부정적 영향을 미칠 수 있음을 지도한다.","v":"단순히 체력 수준을 기준으로 평가하는 것을 지양하고 자신에게 필요한 체력 운동을 선정하고 계획을 세워 올바른 방법으로 실천하는 과정을 중심으로 평가한다.\n차시 단위로 평가를 하기보다는 영역 전반에 걸쳐 드러나는 종합적인 수행 능력과 태도 변화를 중심으로 학업 성취를 평가한다."},"2015|체육|5~6학년|도전|1":{"m":"거리 도전은 학생들이 두려움을 가질 가능성이 높으므로 학습자의 수준에 적합한 난이도의 활동을 제시해야 한다. 따라서 거리나 높이 도전의 성격을 지닌 활동 중 다양한 난이도로 구성될 수 있는 신체활동을 선정한다. 또한, 활동의 수준을 체계적으로 제시하여 안전사고를 예방하고 학습자가 활동에 두려움을 느끼지 않도록 해야 한다.\n표적 도전은 고정된 표적, 움직이는 표적 등 대상의 특성에 따른 다양한 도전 활동을 경험 할 수 있게 한다. 투기 도전은 학습자에게 비교적 익숙하고 일상생활에서 자주 경험할 수 있는 활동을 선정하여 활동에 대한 두려움을 없애는 것이 좋다.\n도전 영역은 자신의 연습 과정을 지속적으로 관찰하고 기록할 수 있도록 지도해야 한다. 특히, 사진, 동영상 등 영상 매체를 적극 활용하여 자신의 변화 과정을 꾸준히 반성할 수 있는 기회를 제공한다.\n학습자가 도전의 과정에 흥미를 가지고 지속적으로 참여할 수 있도록 게임을 활용하는 등 다양한 연습 방법을 제시한다. 이 때, 흥미를 강조하기보다는 게임을 통해 도전의 가치를 체험할 수 있도록 지도해야 한다.","v":"도전 영역은 활동의 결과보다 지속적인 수련 과정을 중심으로 평가한다. 이를 위해 자신의 수준에 적절한 연습 방법을 만들고 난이도를 조절하여 도전하는 종합적인 능력을 평가한다.\n도전의 과정을 지속적으로 동영상으로 촬영하여 자신의 운동 수행 변화 과정을 기록한 사진, 동영상 등을 평가에 활용할 수 있다."},"2015|체육|5~6학년|경쟁|1":{"m":"스포츠의 정형화된 규칙을 적용하기보다는 학습 주제와 학생들의 발달 단계에 부합되는 형태의 변형된 규칙(경기장, 인원 구성, 사용하는 도구 등)을 적용한다.\n필드형 경쟁에서는 빈 곳으로 공 보내기, 구역과 역할을 나누어 수비하기 등의 전략과 공 치기, 공 차기, 공 던지기, 공 받기, 달리기 등의 기본 기능을 다룬다.\n네트형 경쟁에서는 공을 받아 넘기기 어려운 지역으로 공 보내기, 역할을 유기적으로 나누어 수비하기 등의 전략과 공 넘기기, 공 받기, 공 이어주기 등의 기본 기능을 다룬다.\n필드형 경쟁은 공격과 수비 역할이 명확히 구분되므로 공수교대에 따른 전략의 변화를 명확히 인식할 수 있도록 지도한다.\n네트형 경쟁은 공격과 수비의 역할이 동시에 이루어지는 경우가 많으므로 미리 다음 상황을 예측하며 게임을 할 수 있도록 지도한다.\n필드형 경쟁과 네트형 경쟁 모두 라켓, 배트 등을 사용하는 경우가 많으므로 주변을 잘 살피고 충분한 활동 공간을 확보할 수 있도록 한다.","v":"필드형 경쟁과 네트형 경쟁의 이해 정도는 개념 진술에만 의존하기보다는 게임 구성 및 게임의 원활한 수행 능력 등을 통합적인 관점에서 평가한다.\n필드형 경쟁과 네트형 경쟁에서 빈 곳으로 공을 보내고, 역할을 유기적으로 분담하여 수비를 하는 행동의 빈도와 적절성 등을 중심으로 전략의 이해와 적용력을 평가한다.\n필드형 경쟁과 네트형 경쟁에 관한 지식과 기능, 태도 등을 게임 수행의 맥락에서 종합적으로 평가한다.\n게임에서의 실천 양상을 중심으로 책임감 및 다른 사람을 이해하고 배려하려는 태도를 평가한다."},"2015|체육|5~6학년|표현|1":{"m":"민속 표현에서는 나라별 문화적 특징이 드러나는 무용을 선정하여 민속 무용을 통해 그 나라의 자연 환경, 생활 습관 등에 따라 나타나는 무용의 형태와 특성을 이해할 수 있도록 한다.\n주제 표현에서는 학습자의 생활이나 경험과 밀접한 관련이 있는 내용을 주제로 작품을 구성하거나 신체활동을 선정한다. 최근 유행하고 있는 실용 무용을 활용하여 학습자가 표현 활동에 보다 관심을 가지고 참여할 수 있도록 유도한다.\n민속 표현에서는 각 나라의 민속 무용에서 나타나는 문화적 의미를 이해하기 위해 민속 무용별로 나타나고 있는 기본 움직임, 대형 등을 이해하고 수행할 수 있도록 지도한다.\n활동 과정에 가급적 음악을 사용하여 음악과 신체 움직임이 조화롭게 표현할 수 있도록 지도한다. 특히, 민속 표현에서는 표현 활동을 위해 그 민족의 문화적 특징이 담긴 음악을 듣는 과정을 경험함으로써 문화를 반영하는 리듬의 차이를 이해할 수 있도록 지도한다.","v":"민속 표현과 주제 표현은 수행의 전 과정을 종합적으로 고려하여 평가한다. 특히, 민속 표현은 민속 무용의 수행 과정과 함께 이와 관련된 민족의 역사, 문화, 환경 등의 특징을 이해하고 있는지를 종합적으로 평가하고 주제 표현은 주제의 선정에서부터 작품 구성 및 발표에 이르는 일련의 과정을 평가한다.\n민속 표현을 평가할 때에는 각각의 민속 표현이 가지고 있는 기본 동작, 대형 등의 수행뿐만 아니라 그 의미에 대하여 이해하고 있는지를 함께 평가한다.\n주제 표현에서는 주제와 관련하여 만들어진 일련의 움직임이 갖는 의도와 표현 방법을 관련 지어 평가한다. 따라서 작품을 만들어가는 단계에서 나타나는 생각이나 느낌을 신체 움직임으로 표현한 이유에 대한 구체적인 설명과 함께 작품의 구성 및 표현 방식을 종합적으로 평가한다."},"2015|체육|5~6학년|안전|1":{"m":"위급 상황에서 실제로 대처할 수 있는 능력이 중요하므로 응급 상황에 따른 대처법을 구체적으로 익힐 수 있는 체험 중심의 활동을 선정한다. 따라서 출혈, 염좌, 골절 등의 응급 상황에 따른 대처법을 모의 상황에서 실연할 수 있는 신체활동을 선정한다.\n응급 대처 방법을 지속적으로 반복 연습하여 응급 상황에 따른 대처 방법을 위기 상황에서 바로 실천할 수 있도록 지도한다. 국가 및 지역 사회에서 실시되고 있는 재난 대응 훈련과 연계하여 실제적인 학습이 될 수 있도록 지도한다.\n캠핑과 같은 야외 활동의 상황이나 실생활에서 자주 당면하게 되는 안전사고에 대처할 수 있는 내용을 중심으로 지도한다.\n다양한 영상 자료를 적극적으로 활용하여 안전사고 예방의 중요성을 인식하고 안전 의식을 높일 수 있도록 지도한다. 특히, 사회적으로 보다 주의가 요구되는 안전사고의 유형과 내용을 중심으로 경각심을 가질 수 있도록 지도한다.","v":"안전 영역의 학습은 실제 상황에서 자신이 학습한 내용을 활용하여 위기를 벗어나는 것이 중요하므로 위기 상황에 따른 대응 능력을 평가한다. 따라서 위기 상황 시 응급 처치, 문제 해결 과정 등을 종합적으로 평가하는 것이 필요하다. 특히, 반복적인 학습 과정을 통해 위급한 상황에서 이를 실연할 수 있는 능력을 갖추었는지를 평가한다.\n영상 자료를 활용하여 위기 상황을 보여주고 그에 따른 적절한 대처법을 다양한 방법으로 실행 및 표현(구술, 서술 등)하는 과정을 평가한다.\n현장 체험 학습, 수련 활동 등과 연계하여 수행 중심의 평가가 될 수 있도록 한다.\n<표 2> 초등학교 5~6학년 신체활동 예시\n영역\n신체활동 예시\n건강\n(가) 성장과 건강 체력\n생활 건강 관련 활동(신체의 성장, 성폭력의 예방과 대처, 음주 및 흡연의 실태와 예방 등), 건강 체력 증진 활동(근력, 근지구력, 심폐지구력, 유연성 운동 등)\n(나) 여가와 운동 체력\n자연 및 운동 시설에서 즐길 수 있는 여가 활동(스키, 캠핑, 등산, 래프팅, 스케이팅, 롤러 등), 운동 체력 증진 활동(순발력, 민첩성, 평형성, 협응성 운동 등)\n도전\n(가) 거리 도전\n멀리뛰기, 높이뛰기, 멀리 던지기 등\n(나) 표적/투기 도전\n볼링 게임, 골프 게임, 다트 게임, 컬링 게임 등 / 태권도, 씨름 등\n경쟁\n(가) 필드형 경쟁\n발야구형 게임, 주먹야구형 게임, 티볼형 게임 등\n(나) 네트형 경쟁\n배구형 게임, 배드민턴형 게임, 족구형 게임, 탁구형 게임, 테니스형 게임 등\n표현\n(가) 민속 표현\n우리나라의 민속 무용(강강술래, 탈춤 등)\n외국의 민속 무용(티니클링, 구스타프 스콜, 마임 등)\n(나) 주제 표현\n창작무용, 창작체조, 실용 무용 등\n안전\n(가) 응급 처치와 빙상·설상 안전\n응급 처치 활동(출혈, 염좌, 골절 등의 발생 시 대처 방법 관련 활동, 심폐소생술 등), 빙상·설상 안전사고 예방 및 대처 활동 등\n(나) 운동 시설과 야외 활동 안전\n운동 시설과 관련한 안전사고의 종류와 원인 조사 활동, 야외 활동 안전사고 예방 및 대처 활동 등\n※신체활동은 교육과정의 목적에 근거하여 선택하되, 학교의 교육 여건을 고려하여 다른 영역의 신체활동 예시나 새로운 신체활동을 선택할 수 있다. 단, 단위 학교의 학년 협의회를 통해 결정한다."}},"records":[{"c":"4과01-01","y":"2022","s":"과학","g":"3~4학년","a":"힘과 우리 생활","t":"일상생활에서 힘과 관련된 현상에 흥미를 갖고, 물체를 밀거나 당길 ,{"c":"4과13-02","y":"2022","s":"과학","g":"3~4학년","a":"밤하늘 관찰","t":"태양계 구성원을 알고, 태양과 행성을 조사할 수 있다.","e":"태양계를 구성하는 행성들의 표면적인 특징 위주로 조사하고, 태양과 행성의 실제 크기나 태양에서 행성까지의 실제 거리, 행성의 질량, 자전 속도, 대기 성분 등과 같은 구체적인 물리량은 다루지 않는다.","k":"2022|과학|3~4학년|밤하늘 관찰|1","r":"지구와 우주"},{"c":"4과13-03","y":"2022","s":"과학","g":"3~4학년","a":"밤하늘 관찰","t":"별의 정의를 알고, 북극성 주변의 별자리를 관찰할 수 있다. <","e":"별의 정의는 행성과 비교하여 스스로 빛을 내는 천체라는 수준에서만 다룬다. 별자리는 학생들이 쉽게 관찰할 수 있는 북극성 주변의 별자리를 다루며, 계절별 별자리와 관련짓지 않는다.","k":"2022|과학|3~4학년|밤하늘 관찰|1","r":"지구와 우주"},{"c":"4과14-01","y":"2022","s":"과학","g":"3~4학년","a":"생물과 환경","t":"생태계의 구성 요소를 조사하여 생물 요소와 비생물 요소로 분류할 수 있다.","e":"숲, 바다, 강 등 다양한 생태계를 다루고, 각 생태계에서 생물 요소와 비생물 요소를 분류할 수 있게 한다.","k":"2022|과학|3~4학년|생물과 환경|1","r":"생명"},{"c":"4과14-02","y":"2022","s":"과학","g":"3~4학년","a":"생물과 환경","t":"생물 요소들의 먹고 먹히는 관계를 조사하여 먹이그물로 표현할 수 있다.","e":"생태계에서 다양한 먹이 관계를 알아보고 먹이 관계가 복잡할수록 생물이 생존하는 데 유리함을 이해하게 한다.","k":"2022|과학|3~4학년|생물과 환경|1","r":"생명"},{"c":"4과14-03","y":"2022","s":"과학","g":"3~4학년","a":"생물과 환경","t":"인간 활동이 생태계에 미치는 영향을 조사하고, 생태계 보전을 위해 우리가 할 수 있는 일을 토의하여 실천할 수 있다. <","e":"대기오염, 수질오염, 토양오염 등의 환경오염에 관한 사례를 중심으로 다루고, 생태계 보전을 위해 우리가 해야 할 일을 조사하여 실천함으로써 생태계 보전에 대한 의식을 가지게 한다.","k":"2022|과학|3~4학년|생물과 환경|1","r":"생명"},{"c":"4과15-01","y":"2022","s":"과학","g":"3~4학년","a":"여러 가지 기체","t":"실험을 통해 기체가 무게가 있음을 설명할 수 있다.","e":"부피가 같은 용기에 공기를 1기압으로 담은 상태와 이 상태에서 공기를 넣거나 뺀 상태의 무게를 비교하는 실험을 바탕으로 기체가 무게가 있음을 설명한다.","k":"2022|과학|3~4학년|여러 가지 기체|1","r":"물질"},{"c":"4과15-02","y":"2022","s":"과학","g":"3~4학년","a":"여러 가지 기체","t":"온도나 압력에 따라 기체의 부피가 달라지는 현상을 관찰하고, 우리 주변에서 예를 찾을 수 있다.","e":"온도를 높일 때와 낮출 때 공기의 부피 변화, 압력을 높일 때와 낮출 때 공기의 부피 변화를 관찰하도록 한다. 온도나 압력에 따라 기체의 부피가 어떻게 변하는지를 정성적으로 이해하도록 하고, 입자 모형으로 기체의 부피가 변하는 까닭은 설명하지 않는다.","k":"2022|과학|3~4학년|여러 가지 기체|1","r":"물질"},{"c":"4과15-03","y":"2022","s":"과학","g":"3~4학년","a":"여러 가지 기체","t":"일상생활에서 이용되는 기체의 종류와 성질을 조사하고, 여러 가지 기체에 대해 흥미를 느낄 수 있다.","e":"","k":"2022|과학|3~4학년|여러 가지 기체|1","r":"물질"},{"c":"4과15-04","y":"2022","s":"과학","g":"3~4학년","a":"여러 가지 기체","t":"기체의 성질을 이용하여 작동시킬 수 있는 장치를 설계하고 만들 수 있다. <","e":"","k":"2022|과학|3~4학년|여러 가지 기체|1","r":"물질"},{"c":"4과16-01","y":"2022","s":"과학","g":"3~4학년","a":"기후변화와 우리 생활","t":"기후변화 현상의 예를 알고, 기후변화가 인간의 활동과 관련되어 있음을 토의할 수 있다.","e":"기후변화의 과학적 원인은 다루지 않으며 기온, 강수량 등 기후요소가 평년값에 비해 현저히 높거나 낮은 사례(가뭄, 폭설, 폭염, 한파, 홍수 등)를 탐구하도록 한다.","k":"2022|과학|3~4학년|기후변화와 우리 생활|1","r":"생명"},{"c":"4과16-02","y":"2022","s":"과학","g":"3~4학년","a":"기후변화와 우리 생활","t":"기후변화의 심각성에 관심을 가지고, 기후변화가 우리 생활과 환경에 미치는 영향을 설명할 수 있다.","e":"인간의 삶에 부정적인 영향을 미치는 기후변화 현상의 사례를 모형이나 실험 활동을 통해 알아보고, 이에 기반하여 기후변화로 인한 인간의 피해를 예측하고 설명할 수 있도록 한다.","k":"2022|과학|3~4학년|기후변화와 우리 생활|1","r":"생명"},{"c":"4과16-03","y":"2022","s":"과학","g":"3~4학년","a":"기후변화와 우리 생활","t":"기후변화 대응 방법을 조사하고, 생활 속에서 기후변화 대응 방법을 실천할 수 있다. <","e":"","k":"2022|과학|3~4학년|기후변화와 우리 생활|1","r":"생명"},{"c":"6과01-01","y":"2022","s":"과학","g":"5~6학년","a":"지층과 화석","t":"지층의 특징을 알고, 지층의 형성 과정을 모형으로 표현할 수 있다.","e":"지층의 두께나 색 등을 다루고, 지층이 휘어지거나 끊어진 모습을 소개하되 생성 원리는 다루지 않는다.","k":"2022|과학|5~6학년|지층과 화석|1","r":"지구와 우주"},{"c":"6과01-02","y":"2022","s":"과학","g":"5~6학년","a":"지층과 화석","t":"지층이 퇴적암으로 이루어짐을 알고, 퇴적암을 알갱이의 크기에 따라 분류할 수 있다.","e":"퇴적암은 이암, 사암, 역암만 다룬다.","k":"2022|과학|5~6학년|지층과 화석|1","r":"지구와 우주"},{"c":"6과01-03","y":"2022","s":"과학","g":"5~6학년","a":"지층과 화석","t":"화석의 생성 과정을 모형으로 설명하고, 지구의 과거 생물과 환경을 추리하는 활동을 통해 화석의 가치를 인식할 수 있다. <","e":"화석 표본은 동물과 식물의 특징이 분명하게 드러나는 것을 사용한다.","k":"2022|과학|5~6학년|지층과 화석|1","r":"지구와 우주"},{"c":"6과02-01","y":"2022","s":"과학","g":"5~6학년","a":"빛의 성질","t":"물체를 보기 위해서 빛이 있어야 함을 알고, 빛의 성질에 대해 흥미를 느낄 수 있다.","e":"","k":"2022|과학|5~6학년|빛의 성질|1","r":"운동과 에너지"},{"c":"6과02-02","y":"2022","s":"과학","g":"5~6학년","a":"빛의 성질","t":"빛이 나아가는 현상을 관찰하여 빛이 직진, 반사, 굴절하는 성질이 있음을 말할 수 있다.","e":"빛이 직진, 반사, 굴절하는 성질은 햇빛이나 레이저 광선의 진행으로 나타나는 현상을 관찰하여 알 수 있도록 하되, 반사와 굴절의 법칙은 다루지 않는다. 또, 볼록렌즈와 물체 사이의 거리, 볼록렌즈와 눈 사이의 거리에 따른 물체의 모습 차이는 다루지 않는다.","k":"2022|과학|5~6학년|빛의 성질|1","r":"운동과 에너지"},{"c":"6과02-03","y":"2022","s":"과학","g":"5~6학년","a":"빛의 성질","t":"거울과 렌즈의 쓰임새를 조사하고 거울이나 렌즈를 이용한 장치를 창의적으로 만들 수 있다. <","e":"","k":"2022|과학|5~6학년|빛의 성질|1","r":"운동과 에너지"},{"c":"6과03-01","y":"2022","s":"과학","g":"5~6학년","a":"용해와 용액","t":"용해 현상의 의미를 알고, 용질의 종류와 물의 온도에 따라 물에 녹는 용질의 양이 달라짐을 비교할 수 있다.","e":"용질, 용매, 용액, 용해의 개념을 다루되, 입자 모형으로 용해 현상을 설명하거나 용해 현상이 일어나는 과학적 이유나 원리를 설명하지 않는다. 용해 전과 후의 무게를 비교하여 용해 과정에서 물질이 사라지지 않음을 이해하도록 한다.","k":"2022|과학|5~6학년|용해와 용액|1","r":"물질"},{"c":"6과03-02","y":"2022","s":"과학","g":"5~6학년","a":"용해와 용액","t":"용질이나 용매의 양에 따라 용액의 진하기가 달라짐을 관찰하고, 용액의 상대적인 진하기를 비교할 수 있다.","e":"진하기가 다른 두 용액에서 같은 물체의 뜨는 정도가 다름을 이용하여 용액의 상대적인 진하기를 비교하도록 한다.","k":"2022|과학|5~6학년|용해와 용액|1","r":"물질"},{"c":"6과03-03","y":"2022","s":"과학","g":"5~6학년","a":"용해와 용액","t":"일상생활에서 용액이 쓰이는 사례를 조사하여 용액의 필요성을 알리는 자료를 만들고 공유할 수 있다. <","e":"","k":"2022|과학|5~6학년|용해와 용액|1","r":"물질"},{"c":"6과04-01","y":"2022","s":"과학","g":"5~6학년","a":"우리 몸의 구조와 기능","t":"뼈와 근육의 생김새를 관찰하고 모형을 만들어 몸이 움직이는 원리를 설명할 수 있다.","e":"중학교와 고등학교 과정에서는 뼈와 근육에 대해서 학습하지 않으므로, 뼈와 근육의 구조와 기능을 기초적으로 이해하는 데 중점을 둔다.","k":"2022|과학|5~6학년|우리 몸의 구조와 기능|1","r":"생명"},{"c":"6과04-02","y":"2022","s":"과학","g":"5~6학년","a":"우리 몸의 구조와 기능","t":"소화, 순환, 호흡, 배설 기관의 구조와 기능을 알아보고, 우리 몸의 여러 기관이 서로 관련되어 있음을 설명할 수 있다.","e":"우리 몸의 각 기관은 종류, 위치, 생김새, 기능을 중심으로 탐구한다.","k":"2022|과학|5~6학년|우리 몸의 구조와 기능|1","r":"생명"},{"c":"6과04-03","y":"2022","s":"과학","g":"5~6학년","a":"우리 몸의 구조와 기능","t":"우리 몸의 여러 기관과 관련된 질병을 조사하고, 건강을 유지하기 위한 생활 방식을 실천할 수 있다. <","e":"질병은 소화, 순환, 호흡, 배설 기관과 관련된 것으로 조사하고 건강을 유지하기 위한 생활 방식은 각 질병의 예방법을 중심으로 다룬다.","k":"2022|과학|5~6학년|우리 몸의 구조와 기능|1","r":"생명"},{"c":"6과05-01","y":"2022","s":"과학","g":"5~6학년","a":"혼합물의 분리","t":"알갱이의 크기가 다른 고체 혼합물과 골고루 섞이지 않는 액체 혼합물을 분리할 수 있다.","e":"혼합물의 의미를 학습한 뒤 혼합물의 분리 실험을 진행하도록 한다. 혼합물은 두 가지 이상의 물질이 성질이 변하지 않고 섞여 있는 상태라는 수준에서 다룬다. 골고루 섞이지 않는 액체 혼합물 분리에서 액체가 골고루 섞이지 않는 까닭은 다루지 않는다.","k":"2022|과학|5~6학년|혼합물의 분리|1","r":"물질","x":"과학과 사회"},{"c":"6과05-02","y":"2022","s":"과학","g":"5~6학년","a":"혼합물의 분리","t":"물에 용해되는 성질을 이용하여 고체 혼합물을 분리하고, 물을 증발시켜 물에 용해된 고체 물질을 분리할 수 있다.","e":"","k":"2022|과학|5~6학년|혼합물의 분리|1","r":"물질","x":"과학과 사회"},{"c":"6과05-03", ":"과학","g":"5~6학년","a":"자원과 에너지","t":"재생에너지의 종류를 조사하고, 에너지를 지속가능하게 이용하는 방법에 관심을 갖는다.","e":"재생에너지는 태양 에너지, 풍력, 수력, 해양 에너지, 지열 에너지, 바이오 에너지 등을 의미한다.","k":"2022|과학|5~6학년|자원과 에너지|1","r":"과학과 사회"},{"c":"6과08-03","y":"2022","s":"과학","g":"5~6학년","a":"자원과 에너지","t":"자원과 에너지의 효율적인 이용 방법에 대해 탐색하고, 생활 속에서 실천할 수 있는 다양한 사례를 공유할 수 있다. <","e":"효율적인 자원의 이용 방법에서 물 자원과 산림 자원, 광물 자원을 종합적으로 다루며, 학생들이 배운 내용을 바탕으로 생활 속에서 자원의 소중함을 느끼고, 효율적인 이용 방법을 공유하고 실천할 수 있도록 한다.","k":"2022|과학|5~6학년|자원과 에너지|1","r":"과학과 사회"},{"c":"6과09-01","y":"2022","s":"과학","g":"5~6학년","a":"산과 염기","t":"여러 가지 용액에 지시약을 넣었을 때의 변화를 관찰하여 용액을 산성 용액과 염기성 용액으로 분류할 수 있다.","e":"리트머스 시험지, 페놀프탈레인 용액, 붉은 양배추 용액 등과 같은 지시약의 색깔 변화를 이용하여 여러 가지 용액을 산성 용액과 염기성 용액으로 분류하도록 한다.","k":"2022|과학|5~6학년|산과 염기|1","r":"물질"},{"c":"6과09-02","y":"2022","s":"과학","g":"5~6학년","a":"산과 염기","t":"산성 용액과 염기성 용액의 성질을 관찰하고, 산성 용액과 염기성 용액을 섞을 때 용액의 성질 변화를 실험을 통해 추론할 수 있다.","e":"산성 용액은 탄산 칼슘과 반응하고 염기성 용액은 단백질과 반응하는 성질을 중심으로 다룬다. 산성 용액과 염기성 용액을 섞을 때 용액의 성질 변화에서 지시약이 들어 있는 용액의 색깔이 변하는 현상을 관찰하는 수준에서만 다루고 중성, pH, 중화 개념은 다루지 않는다.","k":"2022|과학|5~6학년|산과 염기|1","r":"물질"},{"c":"6과09-03","y":"2022","s":"과학","g":"5~6학년","a":"산과 염기","t":"우리 주변에서 산성 용액과 염기성 용액을 이용하는 예를 찾아서 설명할 수 있다.","e":"","k":"2022|과학|5~6학년|산과 염기|1","r":"물질"},{"c":"6과09-04","y":"2022","s":"과학","g":"5~6학년","a":"산과 염기","t":"산성화로 인한 환경의 피해 사례를 소개하는 자료를 만들고 공유할 수 있다. <","e":"","k":"2022|과학|5~6학년|산과 염기|1","r":"물질"},{"c":"6과10-01","y":"2022","s":"과학","g":"5~6학년","a":"물체의 운동","t":"운동하는 물체는 시간에 따라 위치가 변화함을 알고 그 변화를 표현할 수 있다.","e":"시간에 따라 위치가 변하는 다양한 운동을 다루면서 처음 위치와 나중 위치를 간단한 좌표 평면 위에 표현하되 두 위치 사이의 거리는 구하지 않는다.","k":"2022|과학|5~6학년|물체의 운동|1","r":"운동과 에너지","x":"물질"},{"c":"6과10-02","y":"2022","s":"과학","g":"5~6학년","a":"물체의 운동","t":"물체의 이동 거리와 걸린 시간을 측정하여 속력을 구하고 빠르기를 비교할 수 있다.","e":"물체의 속력을 구할 때 물체가 한 길을 따라 한 방향으로 운동하는 경우만 다루며, 속력의 단위 변환에 중점을 두지 않는다.","k":"2022|과학|5~6학년|물체의 운동|1","r":"운동과 에너지","x":"물질"},{"c":"6과10-03","y":"2022","s":"과학","g":"5~6학년","a":"물체의 운동","t":"속력과 관련된 안전 수칙과 안전장치를 조사한 결과를 공유하고 일상생활에서 교통안전을 실천할 수
